plugins {
    id 'com.android.application'
}

android {
    namespace 'org.zombies.wawhd.nativeport'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'org.zombies.wawhd.nativeport'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1-native-bootstrap'
        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -Wall -Wextra -Werror'
            }
        }
    }
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }
}
