name: Temp Monja Live Probe
on:
  push:
    branches:
      - feature/church-expansion-v1
    paths:
      - ".github/workflows/_temp_elite_live_probe_20261005.yml"
permissions:
  actions: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Query all Monja runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run list --repo "${GITHUB_REPOSITORY}" \
            --branch feature/church-expansion-v1 \
            --limit 60 \
            --json databaseId,name,workflowName,status,conclusion,headSha,createdAt,updatedAt,url \
            --jq '.[] | select((.name|ascii_downcase|contains("monja")) or (.workflowName|ascii_downcase|contains("monja")))'
          exit 1

# probe after pose-mode animation fix
