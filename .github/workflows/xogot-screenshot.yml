name: Xogot Current Screenshot

on:
  workflow_dispatch:
  push:
    branches:
      - feature/xogot-port-v1
    paths:
      - "xogot/ci/screenshot_capture.gd"
      - ".github/workflows/xogot-screenshot.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: xogot-screenshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Install rendering tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip curl xvfb libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers

      - name: Install Godot 4.6.1
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --retry-all-errors --retry-delay 2 \
            https://github.com/godotengine/godot-builds/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip \
            -o /tmp/godot.zip
          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.6.1-stable_linux.x86_64

      - name: Render current gameplay screenshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/xogot-screenshot
          xvfb-run -a -s "-screen 0 1280x720x24" \
            /tmp/godot/Godot_v4.6.1-stable_linux.x86_64 \
            --path xogot \
            --rendering-method gl_compatibility \
            --resolution 1280x720 \
            --script res://ci/screenshot_capture.gd \
            2>&1 | tee build/xogot-screenshot/render.log
          grep -q "XZOGOT_SCREENSHOT_GREEN" build/xogot-screenshot/render.log
          test -s /tmp/xogot-current-game.png
          cp /tmp/xogot-current-game.png build/xogot-screenshot/xogot-current-game.png

      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: Xogot-Current-Gameplay-Screenshot
          path: build/xogot-screenshot/xogot-current-game.png
          if-no-files-found: error
          retention-days: 7
