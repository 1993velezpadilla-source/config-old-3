name: Aether Weapon Kismet Authority

on:
  workflow_dispatch:
  push:
    branches:
      - feature/godot-aaa-rebuild-v1
    paths:
      - ".github/workflows/xogot-aether-weapon-kismet-authority.yml"
      - "tools/maps/UENuketownWallbuyBytecode/**"

permissions:
  contents: read
  actions: read

concurrency:
  group: xogot-aether-weapon-kismet-authority
  cancel-in-progress: true

jobs:
  extract:
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_MAPPING_RUN: "37244741312"
      XZOGOT_ENGINE_VERSION: "VER_UE5_7"

    steps:
      - uses: actions/checkout@v5

      - name: Reuse proven UE5.7 mappings
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir="$env:RUNNER_TEMP\mapping-artifact"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          gh run download "$env:SOURCE_MAPPING_RUN" -n aether-waw-usmap-real-weapons -D $dir
          $map=Get-ChildItem $dir -Filter 'Mappings.usmap' -Recurse | Select-Object -First 1
          if (-not $map) { throw 'Mappings.usmap missing' }
          Copy-Item $map.FullName "$PWD\Mappings.usmap"
          Write-Host "XZOGOT_AETHER_KISMET_USMAP_READY"

      - name: Download Project Aether source runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $downloadDir="$env:RUNNER_TEMP\aether-download"
          New-Item -ItemType Directory -Force -Path $downloadDir | Out-Null
          $zip=$null
          for ($attempt=1; $attempt -le 6; $attempt++) {
            npx --yes itchio-downloader --url "https://verrial.itch.io/projectaether" --downloadDirectory $downloadDir
            $rc=$LASTEXITCODE
            $zip=Get-ChildItem $downloadDir -Filter '*.zip' -Recurse |
              Sort-Object Length -Descending | Select-Object -First 1
            if ($rc -eq 0 -and $zip) { break }
            if ($attempt -lt 6) { Start-Sleep -Seconds (45 + ($attempt * 30)) }
          }
          if (-not $zip) { throw 'Aether ZIP missing' }
          $pakRoot="$env:RUNNER_TEMP\aether-paks"
          New-Item -ItemType Directory -Force -Path $pakRoot | Out-Null
          7z x -y $zip.FullName 'ProjectAether/Content/Paks/*' "-o$pakRoot" | Out-Host
          $pakDir=Get-ChildItem $pakRoot -Directory -Recurse |
            Where-Object { $_.Name -eq 'Paks' -and (Get-ChildItem $_.FullName -Filter '*.utoc' -ErrorAction SilentlyContinue) } |
            Select-Object -First 1
          if (-not $pakDir) { throw 'Aether IoStore Paks missing' }
          "AETHER_PAKDIR=$($pakDir.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "XZOGOT_AETHER_KISMET_PAKS_READY"

      - name: Download retoc
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $release=Invoke-RestMethod -Headers @{ 'User-Agent'='xogot-ci' } 'https://api.github.com/repos/trumank/retoc/releases/latest'
          $asset=$release.assets |
            Where-Object { $_.name -match '(?i)(windows|pc-windows-msvc).*\.zip$' } |
            Select-Object -First 1
          if(-not $asset){throw 'retoc Windows zip asset not found'}
          $zip="$env:RUNNER_TEMP\retoc.zip"
          Invoke-WebRequest $asset.browser_download_url -OutFile $zip
          $dir="$env:RUNNER_TEMP\retoc"
          Expand-Archive $zip -DestinationPath $dir -Force
          $exe=Get-ChildItem $dir -Filter 'retoc*.exe' -Recurse | Select-Object -First 1
          if(-not $exe){throw 'retoc.exe missing'}
          "RETOC=$($exe.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          & $exe.FullName --version
          Write-Host "XZOGOT_RETOC_READY"

      - name: Convert exact weapon authority packages to legacy
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $out="$PWD\build\aether-kismet\legacy"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $filters=@(
            'ProjectAether/Content/Assets/BP/Weapons/BP_WeaponBase.uasset',
            'ProjectAether/Content/FirstPerson/Blueprints/Weapons/Misc/WonderWeapons/BP_ExplosiveTracer.uasset',
            'ProjectAether/Content/Assets/BP/Lethals/BP_Master_SplashDamage.uasset'
          )
          $args=@('to-legacy','--no-shaders',"$env:AETHER_PAKDIR")
          foreach($f in $filters){$args += @('--filter',$f)}
          $args += @('--version','UE5_7',$out)
          & "$env:RETOC" @args 2>&1 | Tee-Object build/aether-kismet/retoc.log
          if($LASTEXITCODE -ne 0){throw "retoc to-legacy failed $LASTEXITCODE"}
          foreach($needle in @('BP_WeaponBase.uasset','BP_ExplosiveTracer.uasset','BP_Master_SplashDamage.uasset')){
            if(-not (Get-ChildItem $out -Recurse -File -Filter $needle | Select-Object -First 1)){
              throw "retoc did not recover $needle"
            }
          }
          Write-Host "XZOGOT_AETHER_KISMET_LEGACY_GREEN"

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Build generic Kismet extractor
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          dotnet restore tools/maps/UENuketownWallbuyBytecode/UENuketownWallbuyBytecode.csproj
          dotnet build tools/maps/UENuketownWallbuyBytecode/UENuketownWallbuyBytecode.csproj -c Release --no-restore

      - name: Decompile weapon Kismet authority
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $legacy="$PWD\build\aether-kismet\legacy"
          $targets=@(
            (Get-ChildItem $legacy -Recurse -File -Filter 'BP_WeaponBase.uasset' | Select-Object -First 1).FullName,
            (Get-ChildItem $legacy -Recurse -File -Filter 'BP_ExplosiveTracer.uasset' | Select-Object -First 1).FullName,
            (Get-ChildItem $legacy -Recurse -File -Filter 'BP_Master_SplashDamage.uasset' | Select-Object -First 1).FullName
          )
          $app='tools/maps/UENuketownWallbuyBytecode/bin/Release/net10.0/UENuketownWallbuyBytecode.dll'
          dotnet $app Mappings.usmap build/aether-kismet/weapon-kismet.json @targets |
            Tee-Object build/aether-kismet/extract.log
          if($LASTEXITCODE -ne 0){throw "Kismet extraction failed $LASTEXITCODE"}

      - name: Prove burst hyperburst and splash source graph
        shell: pwsh
        run: |
          @'
          import json,re
          from pathlib import Path
          p=Path("build/aether-kismet/weapon-kismet.json")
          d=json.loads(p.read_text())
          assert d["ready"] is True,d
          assert d["packageSuccessCount"]==3,d
          out={}
          for pkg in d["packages"]:
              name=pkg["fileName"]
              funcs={}
              for fn in pkg["functions"]:
                  if re.search(r"(fire|burst|shot|trigger|splash|damage|hit)",fn["name"],re.I):
                      funcs[fn["name"]]={
                          "calls":fn["calls"],
                          "expressions":fn["expressions"],
                          "topLevelExpressions":fn["topLevelExpressions"],
                      }
              defaults=[
                  row for row in pkg["normalExportProperties"]
                  if re.search(r"(burst|rpm|damage|radius|projectile|splash|fire)",json.dumps(row),re.I)
              ]
              imports=[
                  row for row in pkg["imports"]
                  if re.search(r"(burst|damage|splash|projectile|timer|fire)",json.dumps(row),re.I)
              ]
              out[name]={"functions":funcs,"defaults":defaults,"imports":imports}
          Path("build/aether-kismet/weapon-kismet-proof.json").write_text(json.dumps(out,indent=2)+"\n")
          base=out.get("BP_WeaponBase.uasset",{})
          assert all(k in base.get("functions",{}) for k in ["TryFire","TryBurst","BurstStep","FinishBurst","OnFireReleased"]),base.keys()
          explosive=out.get("BP_ExplosiveTracer.uasset",{})
          assert explosive, out.keys()
          splash=out.get("BP_Master_SplashDamage.uasset",{})
          assert splash, out.keys()
          print("XZOGOT_AETHER_WEAPON_KISMET_GREEN")
          '@ | python -

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Xogot-Aether-Weapon-Kismet-Authority
          path: |
            build/aether-kismet/weapon-kismet.json
            build/aether-kismet/weapon-kismet-proof.json
            build/aether-kismet/retoc.log
            build/aether-kismet/extract.log
          if-no-files-found: warn
          retention-days: 14
