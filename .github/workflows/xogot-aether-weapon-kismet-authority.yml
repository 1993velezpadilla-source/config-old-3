name: Aether Weapon Kismet Authority

on:
  workflow_dispatch:
  push:
    branches:
      - feature/godot-aaa-rebuild-v1
    paths:
      - ".github/workflows/xogot-aether-weapon-kismet-authority.yml"
      - "tools/maps/UENuketownGameplayTruth/**"

permissions:
  contents: read
  actions: read

concurrency:
  group: xogot-aether-weapon-kismet-authority
  cancel-in-progress: true

jobs:
  extract:
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_MAPPING_RUN: "37244741312"
      XZOGOT_SOURCE_GAME: "ue5.7"

    steps:
      - uses: actions/checkout@v5

      - name: Reuse proven UE5.7 mappings
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir="$env:RUNNER_TEMP\mapping-artifact"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          gh run download "$env:SOURCE_MAPPING_RUN" -n aether-waw-usmap-real-weapons -D $dir
          $map=Get-ChildItem $dir -Filter 'Mappings.usmap' -Recurse | Select-Object -First 1
          if (-not $map) { throw 'Mappings.usmap missing' }
          Copy-Item $map.FullName "$PWD\Mappings.usmap"
          Write-Host "XZOGOT_AETHER_KISMET_USMAP_READY"

      - name: Download Project Aether source runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $downloadDir="$env:RUNNER_TEMP\aether-download"
          New-Item -ItemType Directory -Force -Path $downloadDir | Out-Null
          $zip=$null
          for ($attempt=1; $attempt -le 6; $attempt++) {
            Write-Host "XZOGOT_AETHER_DOWNLOAD_ATTEMPT $attempt"
            npx --yes itchio-downloader --url "https://verrial.itch.io/projectaether" --downloadDirectory $downloadDir
            $rc=$LASTEXITCODE
            $zip=Get-ChildItem $downloadDir -Filter '*.zip' -Recurse |
              Sort-Object Length -Descending | Select-Object -First 1
            if ($rc -eq 0 -and $zip) { break }
            if ($attempt -lt 6) { Start-Sleep -Seconds (45 + ($attempt * 30)) }
          }
          if (-not $zip) { throw 'Aether ZIP missing' }
          $pakRoot="$env:RUNNER_TEMP\aether-paks"
          New-Item -ItemType Directory -Force -Path $pakRoot | Out-Null
          7z x -y $zip.FullName 'ProjectAether/Content/Paks/*' "-o$pakRoot" | Out-Host
          $pakDir=Get-ChildItem $pakRoot -Directory -Recurse |
            Where-Object { $_.Name -eq 'Paks' -and (Get-ChildItem $_.FullName -Filter '*.utoc' -ErrorAction SilentlyContinue) } |
            Select-Object -First 1
          if (-not $pakDir) { throw 'Aether IoStore Paks missing' }
          "AETHER_PAKDIR=$($pakDir.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "XZOGOT_AETHER_KISMET_PAKS_READY"

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Build CUE4Parse Blueprint truth extractor
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          dotnet restore tools/maps/UENuketownGameplayTruth/UENuketownGameplayTruth.csproj
          dotnet build tools/maps/UENuketownGameplayTruth/UENuketownGameplayTruth.csproj -c Release --no-restore
          if($LASTEXITCODE -ne 0){throw 'CUE4Parse Blueprint truth build failed'}

      - name: Decompile weapon Kismet authority directly from IoStore
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force -Path build/aether-kismet | Out-Null
          $app='tools/maps/UENuketownGameplayTruth/bin/Release/net10.0/UENuketownGameplayTruth.dll'
          dotnet $app "$env:AETHER_PAKDIR" Mappings.usmap build/aether-kismet/weapon-kismet.json \
            'ProjectAether/Content/Assets/BP/Weapons/BP_WeaponBase.uasset' \
            'ProjectAether/Content/FirstPerson/Blueprints/Weapons/Misc/WonderWeapons/BP_ExplosiveTracer.uasset' \
            'ProjectAether/Content/Assets/BP/Lethals/BP_Master_SplashDamage.uasset' |
            Tee-Object build/aether-kismet/extract.log
          if($LASTEXITCODE -ne 0){throw "CUE4Parse Kismet extraction failed $LASTEXITCODE"}

      - name: Prove burst hyperburst and splash source graph
        shell: pwsh
        run: |
          @'
          import json,re
          from pathlib import Path
          p=Path("build/aether-kismet/weapon-kismet.json")
          d=json.loads(p.read_text())
          assert d["ready"] is True,d
          assert d["packageSuccessCount"]==3,d
          assert d["packageFailureCount"]==0,d
          assert d["dumpedFunctionsWithBytecode"]>0,d

          proof={}
          for pkg in d["packages"]:
              key=Path(pkg["packagePath"]).stem
              functions={}
              pseudos=[]
              for ex in pkg["exports"]:
                  name=ex.get("name","")
                  if int(ex.get("scriptStatementCount") or 0)>0:
                      functions[name]={
                          "scriptStatementCount":ex["scriptStatementCount"],
                          "scriptBytecode":ex.get("scriptBytecode"),
                      }
                  for fn in ex.get("classFunctions") or []:
                      fn_name=fn.get("name","")
                      if int(fn.get("scriptStatementCount") or 0)>0:
                          functions[fn_name]=fn
                  pseudo=ex.get("decompiledPseudo")
                  if pseudo:
                      pseudos.append(pseudo)
              proof[key]={
                  "packagePath":pkg["packagePath"],
                  "functions":functions,
                  "decompiledPseudo":"\n\n".join(pseudos),
              }

          base=proof.get("BP_WeaponBase",{})
          names=set(base.get("functions",{}))
          required={"TryFire","TryBurst","BurstStep","FinishBurst","OnFireReleased","DoubleTapFireRate","AutoFireTick"}
          missing=sorted(required-names)
          assert not missing,{"missing":missing,"available":sorted(names)}
          assert "BP_ExplosiveTracer" in proof,proof.keys()
          assert "BP_Master_SplashDamage" in proof,proof.keys()

          Path("build/aether-kismet/weapon-kismet-proof.json").write_text(
              json.dumps(proof,indent=2)+"\n")
          print("XZOGOT_AETHER_WEAPON_KISMET_GREEN functions=",len(names))
          '@ | python -

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Xogot-Aether-Weapon-Kismet-Authority
          path: |
            build/aether-kismet/weapon-kismet.json
            build/aether-kismet/weapon-kismet-proof.json
            build/aether-kismet/extract.log
          if-no-files-found: warn
          retention-days: 14
