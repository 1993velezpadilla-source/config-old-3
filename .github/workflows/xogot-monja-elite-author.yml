name: Author Elite Black White Monja

on:
  workflow_dispatch:
  push:
    branches:
      - feature/church-expansion-v1
    paths:
      - "xogot/assets/zombies/monja_elite/source/monja_black_white.glb"
      - "xogot/ci/_trigger_elite_author.txt"

permissions:
  contents: write

concurrency:
  group: xogot-monja-elite-author-${{ github.ref }}
  cancel-in-progress: true

jobs:
  author:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Blender headless dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender python3-numpy libegl1 libgl1-mesa-dri mesa-utils
          blender --version | head -n 2
          sudo npm install --global @gltf-transform/cli@4.5.1
          gltf-transform --version

      - name: Verify exact user elite Monja source GLB
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path("xogot")
          m=json.loads((root/"assets/zombies/special_enemy_source_manifest.json").read_text())
          rec=m["sources"]["monja_elite"]
          p=root/rec["repo_path"]
          assert p.is_file(), p
          data=p.read_bytes()
          assert len(data)==rec["bytes"], (len(data),rec["bytes"])
          assert hashlib.sha256(data).hexdigest()==rec["sha256"]
          print("XZOGOT_ELITE_MONJA_SOURCE_HASH_GREEN")
          PY

      - name: Decode meshopt elite input for Blender 4.0
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p xogot/build/special-enemy-decoded
          gltf-transform copy             xogot/assets/zombies/monja_elite/source/monja_black_white.glb             xogot/build/special-enemy-decoded/monja_black_white.glb
          python3 - <<'PY'
          import json,struct
          from pathlib import Path
          p=Path("xogot/build/special-enemy-decoded/monja_black_white.glb")
          data=p.read_bytes()
          assert data[:4] == b"glTF" and len(data) > 20
          json_len,json_type=struct.unpack_from("<II",data,12)
          assert json_type == 0x4E4F534A
          doc=json.loads(data[20:20+json_len].decode("utf-8").rstrip("\x00 \t\r\n"))
          used=set(doc.get("extensionsUsed",[]))
          required=set(doc.get("extensionsRequired",[]))
          assert "EXT_meshopt_compression" not in used, used
          assert "EXT_meshopt_compression" not in required, required
          assert p.stat().st_size > 1000
          print("XZOGOT_ELITE_MESHOPT_DECODE_GREEN",p.stat().st_size,sorted(used))
          PY

      - name: Feed elite source through clean Monja rig pipeline
        shell: bash
        run: |
          set -euo pipefail
          ELITE=xogot/build/special-enemy-decoded/monja_black_white.glb
          test -s "$ELITE"
          rm -rf xogot/build/monja-source-pose-rig
          mkdir -p xogot/build/monja-source-pose-rig
          timeout 3600 blender -b --python xogot/tools/author_monja_source_pose_rig.py -- \
            --source "$PWD/$ELITE" \
            --profile elite \
            --output-dir "$PWD/xogot/build/monja-source-pose-rig" \
            --output-name monja_black_white_clean_rig.glb \
            2>&1 | tee xogot/build/monja-source-pose-rig/blender.log
          grep -q "XZOGOT_MONJA_SOURCE_POSE_RIG_GREEN" xogot/build/monja-source-pose-rig/blender.log
          grep -q "XZOGOT_MONJA_SOURCE_POSE_WEIGHTS_GREEN" xogot/build/monja-source-pose-rig/blender.log
          grep -q "XZOGOT_MONJA_SOURCE_POSE_ANIMS_GREEN" xogot/build/monja-source-pose-rig/blender.log
          grep -q "XZOGOT_MONJA_SOURCE_POSE_MATCH_GREEN" xogot/build/monja-source-pose-rig/blender.log
          grep -q "XZOGOT_MONJA_DEFORMATION_SANITY_GREEN" xogot/build/monja-source-pose-rig/blender.log

      - name: Validate and relabel elite output
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("xogot/build/monja-source-pose-rig/report.json")
          r=json.loads(p.read_text())
          assert r["geometry_conserved"] is True
          assert r["armatures"] == 1
          assert r["bones"] >= 20
          assert r["rig_mode"] == "source_pose_smooth_weighted_humanoid"
          assert r["old_rigid_region_parenting"] is False
          assert r["pose_match"]["validated"] is True
          assert r["profile"] == "elite"
          assert all(x["coverage"] >= 0.98 for x in r["weight_transfer"])
          assert not r.get("deformation_sanity_violations",[])
          assert r.get("deformation_sanity")
          assert all(x["valid"] is True for x in r["deformation_sanity"].values())
          names=" ".join(r["actions"]).lower()
          for required in (
              "zombie_idle_clean","zombie_walk_clean","zombie_attack_clean",
              "zombie_hit_clean","zombie_death_clean"
          ):
              assert required in names,(required,r["actions"])
          r["pipeline"]="elite_black_white_source_pose_mocap_rig_v2"
          r["source"]="assets/zombies/monja_elite/source/monja_black_white.glb"
          r["gameplay_role"]="elite_nun"
          p.write_text(json.dumps(r,indent=2)+"\n")
          print("XZOGOT_ELITE_MONJA_REPORT_GREEN",r["bones"],r["output_bytes"])
          PY

      - name: Bake nine real CMU clips onto elite Monja
        shell: bash
        run: |
          set -euo pipefail
          BASE="$PWD/xogot/build/monja-source-pose-rig/monja_black_white_clean_rig.glb"
          test -s "$BASE"
          rm -rf xogot/build/monja-elite-cmu
          mkdir -p xogot/build/monja-elite-cmu
          timeout 2700 blender -b --python xogot/tools/augment_monja_cmu_mocap.py -- \
            --base "$BASE" \
            --profile elite \
            --output-dir "$PWD/xogot/build/monja-elite-cmu" \
            --output-name monja_black_white_cmu_rig.glb \
            2>&1 | tee xogot/build/monja-elite-cmu/blender.log
          grep -q "XZOGOT_MONJA_CMU_PROFILE_GREEN elite" xogot/build/monja-elite-cmu/blender.log
          grep -q "XZOGOT_MONJA_CMU_9_REAL_MOCAP_CLIPS_GREEN" xogot/build/monja-elite-cmu/blender.log
          grep -q "XZOGOT_MONJA_CMU_DEFORMATION_SANITY_GREEN" xogot/build/monja-elite-cmu/blender.log
          grep -q "XZOGOT_MONJA_CMU_RIG_GREEN" xogot/build/monja-elite-cmu/blender.log
          test -s xogot/build/monja-elite-cmu/monja_black_white_cmu_rig.glb
          test -s xogot/build/monja-elite-cmu/report.json

      - name: Validate elite CMU output
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("xogot/build/monja-elite-cmu/report.json")
          r=json.loads(p.read_text())
          assert r["profile"] == "elite"
          assert r["geometry_conserved"] is True
          assert r["armatures"] == 1
          assert r["bones"] >= 20
          assert len(r["baked_cmu"]) == 9
          assert not r["missing_cmu_actions"]
          assert r.get("raw_glb_animation_motion_valid") is True
          assert not r.get("deformation_sanity_violations",[])
          assert r.get("deformation_sanity")
          assert all(x["valid"] is True for x in r["deformation_sanity"].values())
          names=" ".join(r["output_actions"]).lower()
          for token in ("104_41","105_25","74_01","139_19","02_05","111_19","111_03","90_16","140_01"):
              assert token in names,(token,r["output_actions"])
          print("XZOGOT_ELITE_MONJA_CMU_REPORT_GREEN",r["bones"],r["output_bytes"])
          PY

      - name: Pack elite runtimes as Godot-compatible separate glTF
        shell: bash
        run: |
          set -euo pipefail
          rm -rf xogot/build/monja-runtime
          mkdir -p xogot/build/monja-runtime/clean xogot/build/monja-runtime/cmu
          gltf-transform copy \
            xogot/build/monja-source-pose-rig/monja_black_white_clean_rig.glb \
            xogot/build/monja-runtime/clean/monja_black_white_clean_rig.gltf
          gltf-transform copy \
            xogot/build/monja-elite-cmu/monja_black_white_cmu_rig.glb \
            xogot/build/monja-runtime/cmu/monja_black_white_cmu_rig.gltf
          python3 - <<'PY'
          import json
          from pathlib import Path
          configs=[
              (
                  Path("xogot/build/monja-runtime/clean"),
                  "monja_black_white_clean_rig.gltf",
                  Path("xogot/build/monja-source-pose-rig/report.json"),
              ),
              (
                  Path("xogot/build/monja-runtime/cmu"),
                  "monja_black_white_cmu_rig.gltf",
                  Path("xogot/build/monja-elite-cmu/report.json"),
              ),
          ]
          for root,name,report_path in configs:
              p=root/name
              doc=json.loads(p.read_text())
              used=set(doc.get("extensionsUsed",[]))
              required=set(doc.get("extensionsRequired",[]))
              assert "EXT_meshopt_compression" not in used|set(required),(name,used,required)
              assert "KHR_mesh_quantization" not in required,(name,required)
              files=[x for x in root.iterdir() if x.is_file()]
              assert files,name
              too_big=[(x.name,x.stat().st_size) for x in files if x.stat().st_size>=99_000_000]
              assert not too_big,(name,too_big)
              for buf in doc.get("buffers",[]):
                  uri=buf.get("uri")
                  assert uri and (root/uri).is_file(),(name,uri)
              for img in doc.get("images",[]):
                  uri=img.get("uri")
                  if uri:
                      assert (root/uri).is_file(),(name,uri)
              r=json.loads(report_path.read_text())
              r["runtime_format"]="gltf_separate"
              r["runtime_compression"]="none"
              r["runtime_simplification"]=False
              r["runtime_quantization"]=False
              r["runtime_files"]={x.name:x.stat().st_size for x in files}
              r["runtime_output_bytes"]=sum(x.stat().st_size for x in files)
              report_path.write_text(json.dumps(r,indent=2)+"\n")
              print("XZOGOT_ELITE_RUNTIME_GLTF_SEPARATE_GREEN",name,r["runtime_files"])
          PY

      - name: Stage elite runtime asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p xogot/assets/zombies/monja_elite
          rm -f xogot/assets/zombies/monja_elite/monja_black_white_clean_rig.glb
          rm -f xogot/assets/zombies/monja_elite/monja_black_white_cmu_rig.glb
          rm -rf xogot/assets/zombies/monja_elite/clean_runtime
          rm -rf xogot/assets/zombies/monja_elite/cmu_runtime
          mkdir -p xogot/assets/zombies/monja_elite/clean_runtime
          mkdir -p xogot/assets/zombies/monja_elite/cmu_runtime
          cp -a xogot/build/monja-runtime/clean/. \
             xogot/assets/zombies/monja_elite/clean_runtime/
          cp -a xogot/build/monja-runtime/cmu/. \
             xogot/assets/zombies/monja_elite/cmu_runtime/
          cp xogot/build/monja-source-pose-rig/report.json \
             xogot/assets/zombies/monja_elite/rig_report.json
          cp xogot/build/monja-elite-cmu/report.json \
             xogot/assets/zombies/monja_elite/cmu_mocap_report.json

      - name: Install Godot 4.6.1 for elite import gate
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --retry-all-errors --retry-delay 2 \
            https://github.com/godotengine/godot-builds/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip \
            -o /tmp/godot.zip
          rm -rf /tmp/godot
          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.6.1-stable_linux.x86_64
          /tmp/godot/Godot_v4.6.1-stable_linux.x86_64 --version

      - name: Verify elite CMU Monja in Godot
        shell: bash
        env:
          XZOGOT_SPECIAL_ENEMY_MODE: elite
        run: |
          set -euo pipefail
          timeout 240 /tmp/godot/Godot_v4.6.1-stable_linux.x86_64 \
            --headless --editor --path xogot --quit \
            2>&1 | tee xogot/build/monja-elite-cmu/godot-import.log
          timeout 120 /tmp/godot/Godot_v4.6.1-stable_linux.x86_64 \
            --headless --path xogot --script res://ci/special_enemy_asset_probe.gd \
            2>&1 | tee xogot/build/monja-elite-cmu/godot-probe.log
          grep -q "XZOGOT_ELITE_MONJA_CMU_GODOT_GREEN" xogot/build/monja-elite-cmu/godot-probe.log
          grep -q "XZOGOT_SPECIAL_ENEMY_ASSET_GATE_GREEN mode=elite" xogot/build/monja-elite-cmu/godot-probe.log
          ! grep -E "SCRIPT ERROR|Parse Error|SPECIAL_ENEMY_ASSET_PROBE:" xogot/build/monja-elite-cmu/godot-probe.log

      - name: Commit elite Monja
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for root in (
              Path("xogot/assets/zombies/monja_elite/clean_runtime"),
              Path("xogot/assets/zombies/monja_elite/cmu_runtime"),
          ):
              files=[x for x in root.iterdir() if x.is_file()]
              assert files,root
              for p in files:
                  assert p.stat().st_size < 99_000_000,(p,p.stat().st_size)
          print("XZOGOT_ELITE_GIT_FILE_SIZE_GATE_GREEN")
          PY
          git config user.name "XZOGOT Asset Bot"
          git config user.email "xogot-asset-bot@users.noreply.github.com"
          git pull --rebase origin feature/church-expansion-v1
          git add -A xogot/assets/zombies/monja_elite/
          if ! git diff --cached --quiet; then
            git commit -m "asset: add Godot-compatible elite Monja runtimes"
            git push origin HEAD:feature/church-expansion-v1
          fi

      - name: Upload elite Monja proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monja-elite-clean-rig-proof
          path: |
            xogot/build/monja-source-pose-rig/report.json
            xogot/build/monja-source-pose-rig/blender.log
            xogot/build/monja-source-pose-rig/bind_pose.png
            xogot/build/monja-source-pose-rig/walk_mid.png
            xogot/build/monja-elite-cmu/report.json
            xogot/build/monja-elite-cmu/blender.log
            xogot/build/monja-elite-cmu/cmu_zombie_walk_mid.png
            xogot/build/monja-elite-cmu/cmu_drag_bad_leg_mid.png
            xogot/build/monja-elite-cmu/cmu_crawl_mid.png
            xogot/build/monja-elite-cmu/cmu_strike_mid.png
            xogot/build/monja-elite-cmu/deformation_diagnostic.json
            xogot/build/monja-elite-cmu/godot-import.log
            xogot/build/monja-elite-cmu/godot-probe.log
          if-no-files-found: warn
          retention-days: 14
