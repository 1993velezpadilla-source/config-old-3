name: Xogot UE Bridge Cascade Authority

on:
  push:
    branches:
      - feature/godot-aaa-rebuild-v1
    paths:
      - ".github/workflows/xogot-ue-bridge-cascade-authority.yml"
      - "tools/ue_bridge/**"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: xogot-ue-bridge-cascade-authority
  cancel-in-progress: true

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: "37544922004"
      SOURCE_ARTIFACT: "Xogot-Nacht-Chronicles-Full-Map-Authority"

    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/godot-aaa-rebuild-v1
          fetch-depth: 1

      - name: Unit-test UE bridge decoders
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ue_bridge/test_cascade_distribution_decoder.py
          python3 tools/ue_bridge/test_material_graph_resolver.py

      - name: Download compact Nacht bridge authority
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/nacht-authority" build/ue-bridge
          mkdir -p "$RUNNER_TEMP/nacht-authority" build/ue-bridge

          CACHE_RUN=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/xogot-ue-bridge-authority-cache.yml/runs?branch=feature%2Fgodot-aaa-rebuild-v1&status=success&per_page=10" \
            --jq '.workflow_runs[0].id // empty' || true)

          if [ -n "$CACHE_RUN" ]; then
            echo "XZOGOT_UE_BRIDGE_CACHE_SELECTED run=$CACHE_RUN"
            gh run download "$CACHE_RUN" \
              --repo "$GITHUB_REPOSITORY" \
              --name "Xogot-UE-Bridge-Nacht-Authority-Cache" \
              --dir "$RUNNER_TEMP/nacht-authority"
          else
            echo "XZOGOT_UE_BRIDGE_CACHE_FALLBACK source_run=$SOURCE_RUN"
            gh run download "$SOURCE_RUN" \
              --repo "$GITHUB_REPOSITORY" \
              --name "$SOURCE_ARTIFACT" \
              --dir "$RUNNER_TEMP/nacht-authority"
          fi

          test -s "$RUNNER_TEMP/nacht-authority/nacht-particle-graphs.json"
          test -s "$RUNNER_TEMP/nacht-authority/nacht-materials.json"

      - name: Decode all Nacht cooked Cascade distributions
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ue_bridge/cascade_distribution_decoder.py \
            --graphs "$RUNNER_TEMP/nacht-authority/nacht-particle-graphs.json" \
            --out build/ue-bridge/nacht-cascade-distributions.json \
            --strict \
            2>&1 | tee build/ue-bridge/cascade-bridge.log
          grep -q "XZOGOT_UE_BRIDGE_CASCADE_GREEN" build/ue-bridge/cascade-bridge.log
          if grep -q "XZOGOT_UE_BRIDGE_CASCADE_FAILURE" build/ue-bridge/cascade-bridge.log; then
            exit 1
          fi

      - name: Resolve Monster Fire material through source graph
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ue_bridge/material_graph_resolver.py \
            --materials "$RUNNER_TEMP/nacht-authority/nacht-materials.json" \
            --target "/Game/CustomMaps/UGC2755515831/InfinityBladeEffects/Effects/FX_Materials/Fire/M_Fire_Sheet_01_INST.M_Fire_Sheet_01_INST" \
            --out build/ue-bridge/monster-fire-material-graph.json \
            --strict \
            2>&1 | tee build/ue-bridge/material-bridge.log
          grep -q "XZOGOT_UE_BRIDGE_MATERIAL_GREEN" build/ue-bridge/material-bridge.log
          grep -q "T_FireBlastTile" build/ue-bridge/material-bridge.log
          if grep -q "XZOGOT_UE_BRIDGE_MATERIAL_FAILURE" build/ue-bridge/material-bridge.log; then
            exit 1
          fi

      - name: Resolve Mystery Box vertical material partial graph
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ue_bridge/material_graph_resolver.py \
            --materials "$RUNNER_TEMP/nacht-authority/nacht-materials.json" \
            --target "/Game/CustomMaps/UGC2755515831/CoD/Particles/mysteryBox/findMe/mysterBoxVerticalMat.mysterBoxVerticalMat" \
            --out build/ue-bridge/mystery-vertical-material-graph.json \
            --strict \
            2>&1 | tee build/ue-bridge/mystery-vertical-material-bridge.log
          grep -q "XZOGOT_UE_BRIDGE_MATERIAL_GREEN" build/ue-bridge/mystery-vertical-material-bridge.log
          grep -q "mysteryboxverticalparticle" build/ue-bridge/mystery-vertical-material-bridge.log
          if grep -q "XZOGOT_UE_BRIDGE_MATERIAL_FAILURE" build/ue-bridge/mystery-vertical-material-bridge.log; then
            exit 1
          fi

      - name: Upload UE bridge report
        uses: actions/upload-artifact@v4
        with:
          name: Xogot-UE-Bridge-Cascade-Authority
          path: |
            build/ue-bridge/nacht-cascade-distributions.json
            build/ue-bridge/cascade-bridge.log
            build/ue-bridge/monster-fire-material-graph.json
            build/ue-bridge/material-bridge.log
            build/ue-bridge/mystery-vertical-material-graph.json
            build/ue-bridge/mystery-vertical-material-bridge.log
          if-no-files-found: error
          retention-days: 7
