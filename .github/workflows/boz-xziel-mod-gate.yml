            /tmp/boz-kino/blackops_gles1.xchurch-named.dz \
            /tmp/boz-kino/blackops_gles1.xchurch-room.dz
          test -s /tmp/boz-kino/blackops_gles1.xchurch-final.dz

      - name: Package signed XChurch Android APK
        shell: bash
        run: |
          set -euo pipefail

          BASE=/tmp/boz-kino/base.apk
          DZ=/tmp/boz-kino/blackops_gles1.xchurch-final.dz
          test -s "$BASE"
          test -s "$DZ"

          ENTRY="$(unzip -Z1 "$BASE" | grep -Fi 'blackops_gles1.dz' | head -n1)"
          test -n "$ENTRY"
          echo "APK_DZ_ENTRY=$ENTRY" | tee boz_mod_out/kino_probe/xchurch-apk-package.log

          rm -rf /tmp/xchurch-apk
          mkdir -p "/tmp/xchurch-apk/stage/$(dirname "$ENTRY")"
          cp "$DZ" "/tmp/xchurch-apk/stage/$ENTRY"
          cp "$BASE" /tmp/xchurch-apk/unsigned.apk

          # Remove the stock resource and stale JAR signatures. The original
          # APK signing block is invalid after any ZIP mutation and apksigner
          # will create a fresh one below.
          zip -q -d /tmp/xchurch-apk/unsigned.apk "$ENTRY"
          zip -q -d /tmp/xchurch-apk/unsigned.apk 'META-INF/*.RSA' 'META-INF/*.DSA' \
            'META-INF/*.EC' 'META-INF/*.SF' 'META-INF/MANIFEST.MF' || true

          (
            cd /tmp/xchurch-apk/stage
            zip -0 -q /tmp/xchurch-apk/unsigned.apk "$ENTRY"
          )

          DZ_SHA="$(sha256sum "$DZ" | awk '{print $1}')"
          EMBED_SHA="$(unzip -p /tmp/xchurch-apk/unsigned.apk "$ENTRY" | sha256sum | awk '{print $1}')"
          echo "DZ_SHA256=$DZ_SHA" | tee -a boz_mod_out/kino_probe/xchurch-apk-package.log
          echo "UNSIGNED_EMBEDDED_DZ_SHA256=$EMBED_SHA" | tee -a boz_mod_out/kino_probe/xchurch-apk-package.log
          test "$DZ_SHA" = "$EMBED_SHA"

          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign 2>/dev/null | sort -V | tail -n1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -n1)"
          if [[ -z "$ZIPALIGN" || -z "$APKSIGNER" ]]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n1)"
            test -x "$SDKMANAGER"
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" "build-tools;36.0.0"
            ZIPALIGN="$ANDROID_HOME/build-tools/36.0.0/zipalign"
            APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          fi
          test -x "$ZIPALIGN"
          test -x "$APKSIGNER"

          "$ZIPALIGN" -f -p 4 \
            /tmp/xchurch-apk/unsigned.apk \
            /tmp/xchurch-apk/aligned.apk
          "$ZIPALIGN" -c -v -p 4 /tmp/xchurch-apk/aligned.apk \
            | tee boz_mod_out/kino_probe/xchurch-zipalign-verify.txt

          keytool -genkeypair \
            -keystore /tmp/xchurch-apk/xchurch-ci.jks \
            -storepass android \
            -keypass android \
            -alias xchurch \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=XChurch CI, OU=Development, O=XZIEL, C=US"

          mkdir -p boz_mod_out/xchurch_apk
          APK="$GITHUB_WORKSPACE/boz_mod_out/xchurch_apk/XZIEL-BOZ-XChurch-test.apk"
          "$APKSIGNER" sign \
            --ks /tmp/xchurch-apk/xchurch-ci.jks \
            --ks-key-alias xchurch \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$APK" \
            /tmp/xchurch-apk/aligned.apk

          "$APKSIGNER" verify --verbose --print-certs "$APK" \
            2>&1 | tee boz_mod_out/xchurch_apk/apksigner-verify.txt

          FINAL_EMBED_SHA="$(unzip -p "$APK" "$ENTRY" | sha256sum | awk '{print $1}')"
          test "$DZ_SHA" = "$FINAL_EMBED_SHA"
          unzip -l "$APK" > boz_mod_out/xchurch_apk/apk-list.txt
          grep -q 'lib/arm64-v8a/libs3e_android.so' boz_mod_out/xchurch_apk/apk-list.txt
          grep -Eq 'assets/(boz_aarch64|boz)\.s3e' boz_mod_out/xchurch_apk/apk-list.txt

          {
            echo "APK_SHA256=$(sha256sum "$APK" | awk '{print $1}')"
            echo "APK_BYTES=$(stat -c %s "$APK")"
            echo "EMBEDDED_DZ_SHA256=$FINAL_EMBED_SHA"
            echo "DZ_ENTRY=$ENTRY"
            echo "XCHURCH_DTRZ_GATE=GREEN"
            echo "SIGNED=true"
          } | tee boz_mod_out/xchurch_apk/build-proof.env

          echo "XZIEL_BOZ_XCHURCH_SIGNED_APK_OK" \
            | tee -a boz_mod_out/kino_probe/xchurch-apk-package.log

      - name: Prepare BOZ core runtime for class scan
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 \
            -o /tmp/boz-kino/runtime/boz.s3e \
            https://raw.githubusercontent.com/eugene373/COD-BOZ-Partially-Decompiled/e723c8c1ea4fac59be990efb3edf7a09b1af7768/app/src/main/assets/boz.s3e
          python3 - <<'PY'
          import lzma
          from pathlib import Path
          src=Path('/tmp/boz-kino/runtime/boz.s3e').read_bytes()
          props=src[0]
          pb=props//45
          rem=props%45
          lp=rem//9
          lc=rem%9
          dec=lzma.decompress(
              src[13:],
              format=lzma.FORMAT_RAW,
              filters=[{'id':lzma.FILTER_LZMA1,'lc':lc,'lp':lp,'pb':pb}],
          )
          Path('/tmp/boz-kino/runtime/boz.unpacked').write_bytes(dec)
          print('BOZ_RUNTIME_UNPACKED', len(dec))
          PY
          test -s /tmp/boz-kino/runtime/boz.unpacked

      - name: Identify Marmalade runtime resource classes
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t SO_FILES < <(find /tmp/boz-kino/runtime -type f -name '*.so' -print)
          test "${#SO_FILES[@]}" -gt 0
          ARGS=(--binary /tmp/boz-kino/runtime/boz.unpacked)
          for f in "${SO_FILES[@]}"; do
            ARGS+=(--binary "$f")
          done
          python3 tools/boz_mod/scan_runtime_class_hashes.py \
            --group-root /tmp/boz-kino/extracted \
            "${ARGS[@]}" \
            --out boz_mod_out/kino_probe/runtime-class-scan.json \
            | tee boz_mod_out/kino_probe/runtime-class-scan.log
          grep -q "XZIEL_BOZ_RUNTIME_CLASS_SCAN_OK" boz_mod_out/kino_probe/runtime-class-scan.log
          test -s boz_mod_out/kino_probe/runtime-class-scan.json

      - name: Keep structural report only
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/boz-kino /tmp/dzip-rs
          printf '%s\n' \
            "DECODER=CodexuRegexl/Dzip-Rust" \
            "DECODER_COMMIT=fb4bd41d7f749e74673cd7963ba2df7582334a69" \
            "DECODER_LICENSE=AGPL-3.0-or-later" \
            "DECODER_USED_AS_EXTERNAL_CI_TOOL=true" \
            "SOURCE_BINARY_RETAINED=false" \
            "PAYLOAD_EXTRACTED_TO_ARTIFACT=false" \
            "GATE_6=kino_native_dz_decode" \
            "STATUS=GREEN" \
            > boz_mod_out/kino_probe/gate.env

      - uses: actions/upload-artifact@v4
        with:
          name: XZIEL-BOZ-Kino-Native-DZ-Probe
          path: boz_mod_out/kino_probe/
          if-no-files-found: error
          retention-days: 14

      - name: Upload installable XChurch APK
        uses: actions/upload-artifact@v4
        with:
          name: XZIEL-BOZ-XChurch-APK
          path: boz_mod_out/xchurch_apk/
          if-no-files-found: error
          retention-days: 14
