name: BOZ XZIEL Mod Override Gate

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/boz-mod-runtime
    paths:
      - ".github/workflows/boz-xziel-mod-gate.yml"
      - "tools/boz_mod/**"
      - "docs/BOZ_XZIEL_MOD_LAYER.md"

permissions:
  contents: read

jobs:
  override-priority:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Clone pinned MIT BOZ loader
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/Producdevity/cod-boz-port.git /tmp/cod-boz-port
          cd /tmp/cod-boz-port
          git checkout 3b444d6003a78f08694e965509477d13a742ebf1
          test "$(git rev-parse HEAD)" = "3b444d6003a78f08694e965509477d13a742ebf1"

      - name: Apply XZIEL mod override layer
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/boz_mod/patch_mod_override.py /tmp/cod-boz-port
          grep -q "resolve_xziel_mod_path" /tmp/cod-boz-port/src/s3e_file.c

      - name: Compile override priority test
        shell: bash
        run: |
          set -euo pipefail
          cp tools/boz_mod/xziel_mod_override_test.c /tmp/cod-boz-port/tests/
          cd /tmp/cod-boz-port
          mkdir -p build/tests
          cc -D_GNU_SOURCE -Iinclude -std=c11 -Wall -Wextra -Werror             -o build/tests/xziel_mod_override_test             tests/xziel_mod_override_test.c src/s3e_file.c

      - name: Prove XZIEL wins over stock DTRZ
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/cod-boz-port
          ./build/tests/xziel_mod_override_test | tee /tmp/xziel-boz-mod-gate.log
          grep -q "XZIEL_BOZ_OVERRIDE_PRIORITY_OK" /tmp/xziel-boz-mod-gate.log
          grep -q "XZIEL_BOZ_ASSET_TRACE_OK" /tmp/xziel-boz-mod-gate.log
          grep -q "winner=assets/xziel_mod" /tmp/xziel-boz-mod-gate.log

      - name: Save gate report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p boz_mod_out
          cp /tmp/xziel-boz-mod-gate.log boz_mod_out/
          {
            echo "UPSTREAM=Producdevity/cod-boz-port"
            echo "UPSTREAM_COMMIT=3b444d6003a78f08694e965509477d13a742ebf1"
            echo "MOD_ROOT=assets/xziel_mod"
            echo "GAME_DATA_INCLUDED=false"
            echo "GATE_1=override_priority"
            echo "GATE_2=asset_trace"
            echo "STATUS=GREEN"
          } > boz_mod_out/gate.env

      - uses: actions/upload-artifact@v4
        with:
          name: XZIEL-BOZ-Mod-Override-Gate
          path: boz_mod_out/
          if-no-files-found: error
          retention-days: 14


  dtrz-inplace-replace:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Clone pinned MIT MarmDump verifier
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/codefl0w/MarmDump.git /tmp/MarmDump
          cd /tmp/MarmDump
          git checkout 48b7b743344b7031e683cb81b67f8d874710caef
          test "$(git rev-parse HEAD)" = "48b7b743344b7031e683cb81b67f8d874710caef"

      - name: Build synthetic DTRZ and replace map resource
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/boz_mod/test_dtrz_replace.py "$GITHUB_WORKSPACE" \
            | tee /tmp/xziel-dtrz-gate.log
          grep -q "XZIEL_DTRZ_INPLACE_REPLACE_OK" /tmp/xziel-dtrz-gate.log
          grep -q "XZIEL_DTRZ_SYNTHETIC_BUILD_OK" /tmp/xziel-dtrz-gate.log

      - name: Verify patched archive with independent MarmDump
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/marmdump-out
          python3 /tmp/MarmDump/MarmDump.py \
            -i boz_mod_out/dtrz_gate/synthetic_after.dz \
            -o /tmp/marmdump-out \
            --manifest boz_mod_out/dtrz_gate/marmdump-manifest.json \
            | tee -a /tmp/xziel-dtrz-gate.log
          cmp \
            boz_mod_out/dtrz_gate/replacement.group.bin \
            /tmp/marmdump-out/data-etc/map_probe.group.bin
          echo "XZIEL_DTRZ_MARMDUMP_VERIFY_OK" | tee -a /tmp/xziel-dtrz-gate.log

      - name: Save DTRZ gate report
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/xziel-dtrz-gate.log boz_mod_out/dtrz_gate/
          {
            echo "VERIFIER=codefl0w/MarmDump"
            echo "VERIFIER_COMMIT=48b7b743344b7031e683cb81b67f8d874710caef"
            echo "MODE=inplace_slot_replace"
            echo "OFFSETS_SHIFTED=false"
            echo "GATE_3=dtrz_inplace_replace"
            echo "STATUS=GREEN"
          } > boz_mod_out/dtrz_gate/gate.env

      - uses: actions/upload-artifact@v4
        with:
          name: XZIEL-BOZ-DTRZ-Repack-Gate
          path: boz_mod_out/dtrz_gate/
          if-no-files-found: error
          retention-days: 14


  android-shell-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install required Android packages
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:=/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;25.1.8937393"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Clone pinned BOZ Android reconstruction
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/eugene373/COD-BOZ-Partially-Decompiled.git /tmp/boz-android
          cd /tmp/boz-android
          git checkout e723c8c1ea4fac59be990efb3edf7a09b1af7768
          test "$(git rev-parse HEAD)" = "e723c8c1ea4fac59be990efb3edf7a09b1af7768"
          printf 'VERSION_CODE=1081\n' > app/version.properties
          keytool -genkeypair \
            -keystore ci-debug.jks \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=XZIEL CI, OU=Development, O=XZIEL, L=San Juan, ST=PR, C=US"
          cat > keystore.properties <<'EOF'
storeFile=ci-debug.jks
storePassword=android
keyAlias=androiddebugkey
keyPassword=android
EOF
          chmod +x gradlew

      - name: Build BOZ Android debug shell
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/boz-android
          ./gradlew :app:assembleDebug --no-daemon --stacktrace \
            | tee /tmp/boz-android-build.log

      - name: Verify APK runtime payload
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/boz-android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" > /tmp/boz-apk-list.txt
          grep -q "assets/boz.s3e" /tmp/boz-apk-list.txt
          grep -q "assets/blackops_loader.dz" /tmp/boz-apk-list.txt
          grep -q "lib/armeabi-v7a/libs3e_android.so" /tmp/boz-apk-list.txt
          echo "XZIEL_BOZ_ANDROID_APK_BUILD_OK"
          sha256sum "$APK"
          stat -c 'APK_BYTES=%s' "$APK"

      - name: Save Android build proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p boz_mod_out/android_build
          cp /tmp/boz-android-build.log boz_mod_out/android_build/
          cp /tmp/boz-apk-list.txt boz_mod_out/android_build/
          APK=/tmp/boz-android/app/build/outputs/apk/debug/app-debug.apk
          {
            echo "UPSTREAM=eugene373/COD-BOZ-Partially-Decompiled"
            echo "UPSTREAM_COMMIT=e723c8c1ea4fac59be990efb3edf7a09b1af7768"
            echo "APK_SHA256=$(sha256sum "$APK" | awk '{print $1}')"
            echo "APK_BYTES=$(stat -c %s "$APK")"
            echo "GATE_4=android_shell_build"
            echo "STATUS=GREEN"
            echo "APK_UPLOADED=false"
          } > boz_mod_out/android_build/gate.env

      - uses: actions/upload-artifact@v4
        with:
          name: XZIEL-BOZ-Android-Build-Proof
          path: boz_mod_out/android_build/
          if-no-files-found: error
          retention-days: 14
