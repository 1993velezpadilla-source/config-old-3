          from pathlib import Path

          room=Path('/tmp/xchurch-final/levels/kino/xchurch_shared.group.bin')
          sectors=Path('/tmp/xchurch-final/levels/kino/kino_sectors.group.bin')
          archive=Path('/tmp/boz-kino/blackops_gles1.xchurch-final.dz')
          model=json.loads(Path(
              'boz_mod_out/kino_probe/xchurch-model-patch.json'
          ).read_text(encoding='utf-8'))
          proof={
              'roomBytes':room.stat().st_size,
              'roomSha256':hashlib.sha256(room.read_bytes()).hexdigest(),
              'sectorsBytes':sectors.stat().st_size,
              'sectorsSha256':hashlib.sha256(sectors.read_bytes()).hexdigest(),
              'archiveBytes':archive.stat().st_size,
