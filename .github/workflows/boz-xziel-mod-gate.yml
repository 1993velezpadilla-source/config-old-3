name: BOZ XZIEL Mod Gates

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/boz-mod-runtime
    paths:
      - ".github/workflows/boz-xziel-mod-gate.yml"
      - "tools/boz_mod/**"
      - "docs/BOZ_XZIEL_MOD_LAYER.md"

permissions:
  contents: read

jobs:
  override-priority:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Clone pinned MIT BOZ loader
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/Producdevity/cod-boz-port.git /tmp/cod-boz-port
          cd /tmp/cod-boz-port
          git checkout 3b444d6003a78f08694e965509477d13a742ebf1
          test "$(git rev-parse HEAD)" = "3b444d6003a78f08694e965509477d13a742ebf1"

      - name: Apply XZIEL mod override layer
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/boz_mod/patch_mod_override.py /tmp/cod-boz-port
          grep -q "resolve_xziel_mod_path" /tmp/cod-boz-port/src/s3e_file.c
          grep -q "xziel_trace_asset_request" /tmp/cod-boz-port/src/s3e_file.c

      - name: Compile override priority test
        shell: bash
        run: |
          set -euo pipefail
          cp tools/boz_mod/xziel_mod_override_test.c /tmp/cod-boz-port/tests/
          cd /tmp/cod-boz-port
          mkdir -p build/tests
          cc -D_GNU_SOURCE -Iinclude -std=c11 -Wall -Wextra -Werror \
            -o build/tests/xziel_mod_override_test \
            tests/xziel_mod_override_test.c src/s3e_file.c

      - name: Prove XZIEL wins over stock DTRZ and trace request
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/cod-boz-port
          ./build/tests/xziel_mod_override_test | tee /tmp/xziel-boz-mod-gate.log
          grep -q "XZIEL_BOZ_OVERRIDE_PRIORITY_OK" /tmp/xziel-boz-mod-gate.log
          grep -q "XZIEL_BOZ_ASSET_TRACE_OK" /tmp/xziel-boz-mod-gate.log
          grep -q "winner=assets/xziel_mod" /tmp/xziel-boz-mod-gate.log

      - name: Save override gate report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p boz_mod_out/override
          cp /tmp/xziel-boz-mod-gate.log boz_mod_out/override/
          printf '%s\n' \
            "UPSTREAM=Producdevity/cod-boz-port" \
            "UPSTREAM_COMMIT=3b444d6003a78f08694e965509477d13a742ebf1" \
            "MOD_ROOT=assets/xziel_mod" \
            "GAME_DATA_INCLUDED=false" \
            "GATE_1=override_priority" \
            "GATE_2=asset_trace" \
            "STATUS=GREEN" \
            > boz_mod_out/override/gate.env

      - uses: actions/upload-artifact@v4
        with:
          name: XZIEL-BOZ-Mod-Override-Gates
          path: boz_mod_out/override/
          if-no-files-found: error
          retention-days: 14

  dtrz-inplace-replace:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Clone pinned MIT MarmDump verifier
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/codefl0w/MarmDump.git /tmp/MarmDump
          cd /tmp/MarmDump
          git checkout 48b7b743344b7031e683cb81b67f8d874710caef
          test "$(git rev-parse HEAD)" = "48b7b743344b7031e683cb81b67f8d874710caef"

      - name: Build synthetic DTRZ and replace map resource
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/boz_mod/test_dtrz_replace.py "$GITHUB_WORKSPACE" \
            | tee /tmp/xziel-dtrz-gate.log
          grep -q "XZIEL_DTRZ_INPLACE_REPLACE_OK" /tmp/xziel-dtrz-gate.log
          grep -q "XZIEL_DTRZ_SYNTHETIC_BUILD_OK" /tmp/xziel-dtrz-gate.log

      - name: Verify patched archive with independent MarmDump
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/marmdump-out
          python3 /tmp/MarmDump/MarmDump.py \
            -i boz_mod_out/dtrz_gate/synthetic_after.dz \
            -o /tmp/marmdump-out \
            --manifest boz_mod_out/dtrz_gate/marmdump-manifest.json \
            | tee -a /tmp/xziel-dtrz-gate.log
          cmp \
            boz_mod_out/dtrz_gate/replacement.group.bin \
            /tmp/marmdump-out/data-etc/map_probe.group.bin
          echo "XZIEL_DTRZ_MARMDUMP_VERIFY_OK" | tee -a /tmp/xziel-dtrz-gate.log

      - name: Save DTRZ gate report
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/xziel-dtrz-gate.log boz_mod_out/dtrz_gate/
          printf '%s\n' \
            "VERIFIER=codefl0w/MarmDump" \
            "VERIFIER_COMMIT=48b7b743344b7031e683cb81b67f8d874710caef" \
            "MODE=inplace_slot_replace" \
            "OFFSETS_SHIFTED=false" \
            "GATE_3=dtrz_inplace_replace" \
            "STATUS=GREEN" \
            > boz_mod_out/dtrz_gate/gate.env

      - uses: actions/upload-artifact@v4
        with:
          name: XZIEL-BOZ-DTRZ-Repack-Gate
          path: boz_mod_out/dtrz_gate/
          if-no-files-found: error
          retention-days: 14

  android-shell-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install required Android packages
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;25.1.8937393"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Clone pinned BOZ Android reconstruction
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/eugene373/COD-BOZ-Partially-Decompiled.git /tmp/boz-android
          cd /tmp/boz-android
          git checkout e723c8c1ea4fac59be990efb3edf7a09b1af7768
          test "$(git rev-parse HEAD)" = "e723c8c1ea4fac59be990efb3edf7a09b1af7768"
          printf 'VERSION_CODE=1081\n' > app/version.properties
          printf '%s\n' \
            'android.useAndroidX=true' \
            'android.nonTransitiveRClass=true' \
            'org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8' \
            > gradle.properties
          keytool -genkeypair \
            -keystore ci-debug.jks \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=XZIEL CI, OU=Development, O=XZIEL, L=San Juan, ST=PR, C=US"
          printf '%s\n' \
            'storeFile=ci-debug.jks' \
            'storePassword=android' \
            'keyAlias=androiddebugkey' \
            'keyPassword=android' \
            > keystore.properties
          chmod +x gradlew

      - name: Build BOZ Android debug shell
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/boz-android
          ./gradlew :app:assembleDebug --no-daemon --stacktrace \
            | tee /tmp/boz-android-build.log

      - name: Verify APK runtime payload
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/boz-android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" > /tmp/boz-apk-list.txt
          grep -q "assets/boz.s3e" /tmp/boz-apk-list.txt
          grep -q "assets/blackops_loader.dz" /tmp/boz-apk-list.txt
          grep -q "lib/armeabi-v7a/libs3e_android.so" /tmp/boz-apk-list.txt
          echo "XZIEL_BOZ_ANDROID_APK_BUILD_OK"
          sha256sum "$APK"
          stat -c 'APK_BYTES=%s' "$APK"

      - name: Save Android build proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p boz_mod_out/android_build
          cp /tmp/boz-android-build.log boz_mod_out/android_build/
          cp /tmp/boz-apk-list.txt boz_mod_out/android_build/
          APK=/tmp/boz-android/app/build/outputs/apk/debug/app-debug.apk
          printf '%s\n' \
            "UPSTREAM=eugene373/COD-BOZ-Partially-Decompiled" \
            "UPSTREAM_COMMIT=e723c8c1ea4fac59be990efb3edf7a09b1af7768" \
            "APK_SHA256=$(sha256sum "$APK" | awk '{print $1}')" \
            "APK_BYTES=$(stat -c %s "$APK")" \
            "GATE_4=android_shell_build" \
            "STATUS=GREEN" \
            "APK_UPLOADED=false" \
            > boz_mod_out/android_build/gate.env

      - uses: actions/upload-artifact@v4
        with:
          name: XZIEL-BOZ-Android-Build-Proof
          path: boz_mod_out/android_build/
          if-no-files-found: error
          retention-days: 14


  real-dtrz-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5

      - name: Download public BOZ AArch64 release for analysis only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/boz135
          curl -L --fail --retry 3 --retry-delay 2 \
            -o /tmp/boz135/app-release.apk \
            https://github.com/12brendon34/COD-BOZ-Partially-Decompiled/releases/download/1.3.5/app-release.apk
          test -s /tmp/boz135/app-release.apk
          unzip -l /tmp/boz135/app-release.apk | tee /tmp/boz135/apk-list.txt
          grep -i "blackops_gles1.dz" /tmp/boz135/apk-list.txt

      - name: Extract embedded DTRZ temporarily
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/boz135
          ENTRY="$(unzip -Z1 app-release.apk | grep -i 'blackops_gles1\.dz$' | head -n1)"
          test -n "$ENTRY"
          unzip -p app-release.apk "$ENTRY" > blackops_gles1.dz
          test -s blackops_gles1.dz
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/boz135/blackops_gles1.dz')
          b=p.read_bytes()[:16]
          print('DZ_BYTES', p.stat().st_size)
          print('DZ_HEAD', b.hex())
          assert b[:4] == b'DTRZ', b
          print('REAL_DTRZ_MAGIC_OK')
          PY

      - name: Clone pinned MIT MarmDump
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/codefl0w/MarmDump.git /tmp/MarmDump
          cd /tmp/MarmDump
          git checkout 48b7b743344b7031e683cb81b67f8d874710caef
          test "$(git rev-parse HEAD)" = "48b7b743344b7031e683cb81b67f8d874710caef"

      - name: Build real DTRZ metadata manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p boz_mod_out/real_manifest

          # MarmDump's --list path is useful as an external parser check and
          # does not require successfully decoding every payload variant.
          python3 /tmp/MarmDump/MarmDump.py \
            -i /tmp/boz135/blackops_gles1.dz \
            --list \
            | tee boz_mod_out/real_manifest/marmdump-list.txt

          python3 - <<'PY'
          import json
          from pathlib import Path
          import importlib.util
          import sys

          root=Path('.').resolve()
          spec=importlib.util.spec_from_file_location(
              'dtrz_replace', root/'tools/boz_mod/dtrz_replace.py')
          mod=importlib.util.module_from_spec(spec)
          sys.modules[spec.name]=mod
          spec.loader.exec_module(mod)

          p=Path('/tmp/boz135/blackops_gles1.dz')
          data=p.read_bytes()
          layout=mod.parse_layout(data)

          manifest={
              'schemaVersion': 1,
              'archive': 'blackops_gles1.dz',
              'archiveBytes': len(data),
              'fileCount': layout.file_count,
              'version': layout.version,
              'directoryCount': len(layout.directories),
              'directories': layout.directories,
              'entries': [
                  {
                      'index': e.index,
                      'path': e.path,
                      'offset': e.offset,
                      'slotSize': e.slot_size,
                      'uncompressedSize': e.usize,
                      'uncompressedSize2': e.usize2,
                      'flags': e.flags,
                  }
                  for e in layout.entries
              ],
          }

          out=Path('boz_mod_out/real_manifest/blackops_gles1_manifest.json')
          out.write_text(json.dumps(manifest, indent=2), encoding='utf-8')
          print('REAL_DTRZ_FILE_COUNT', layout.file_count)
          print('REAL_DTRZ_VERSION', layout.version)
          print('REAL_DTRZ_DIRECTORY_COUNT', len(layout.directories))
          print('REAL_DTRZ_METADATA_MANIFEST_OK')
          PY
          test -s boz_mod_out/real_manifest/blackops_gles1_manifest.json

      - name: Extract likely map resource names
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re
          from pathlib import Path

          src=Path('boz_mod_out/real_manifest/blackops_gles1_manifest.json')
          data=json.loads(src.read_text(encoding='utf-8'))

          # MarmDump manifest shape may vary; recursively collect strings that
          # look like archive paths without assuming a fixed schema.
          strings=[]
          def walk(v):
              if isinstance(v, dict):
                  for k,x in v.items():
                      if isinstance(k,str):
                          strings.append(k)
                      walk(x)
              elif isinstance(v, list):
                  for x in v: walk(x)
              elif isinstance(v, str):
                  strings.append(v)
          walk(data)

          paths=[]
          seen=set()
          for s in strings:
              s=s.replace('\\','/')
              if '/' not in s and not re.search(r'\.(?:bin|group|i3d|itx|geo|dat)$', s, re.I):
                  continue
              if s not in seen:
                  seen.add(s); paths.append(s)

          kws=re.compile(
              r'(kino|theatre|theater|ascension|dead.?ops|map|level|world|zombie|'
              r'ingame|scene|environment|recast|nav|collision|geom|room|spawn)',
              re.I
          )
          likely=[p for p in paths if kws.search(p)]

          Path('boz_mod_out/real_manifest/all_resource_paths.txt').write_text(
              '\n'.join(sorted(paths)), encoding='utf-8')
          Path('boz_mod_out/real_manifest/likely_map_resources.txt').write_text(
              '\n'.join(sorted(likely)), encoding='utf-8')

          print('REAL_RESOURCE_PATHS', len(paths))
          print('LIKELY_MAP_RESOURCES', len(likely))
          print('--- LIKELY MAP RESOURCES ---')
          for p in sorted(likely)[:300]:
              print(p)
          PY

      - name: Save analysis proof only
        shell: bash
        run: |
          set -euo pipefail
          sha256sum /tmp/boz135/blackops_gles1.dz \
            | awk '{print "SOURCE_DZ_SHA256=" $1}' \
            > boz_mod_out/real_manifest/gate.env
          {
            echo "SOURCE_RELEASE=12brendon34/COD-BOZ-Partially-Decompiled@1.3.5"
            echo "SOURCE_BINARY_RETAINED=false"
            echo "MANIFEST_ONLY=true"
            echo "GATE_5=real_dtrz_manifest"
            echo "STATUS=GREEN"
          } >> boz_mod_out/real_manifest/gate.env
          rm -f /tmp/boz135/app-release.apk /tmp/boz135/blackops_gles1.dz
          echo "XZIEL_BOZ_REAL_DTRZ_MANIFEST_OK"

      - uses: actions/upload-artifact@v4
        with:
          name: XZIEL-BOZ-Real-DTRZ-Manifest
          path: boz_mod_out/real_manifest/
          if-no-files-found: error
          retention-days: 14


  boz-binariser-capability:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Fetch pinned BOZ S3E payload directly
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/boz-binprobe
          curl -L --fail --retry 3 --retry-delay 2 \
            -o /tmp/boz-binprobe/boz.s3e \
            https://raw.githubusercontent.com/eugene373/COD-BOZ-Partially-Decompiled/e723c8c1ea4fac59be990efb3edf7a09b1af7768/app/src/main/assets/boz.s3e
          test -s /tmp/boz-binprobe/boz.s3e
          printf 'BOZ_S3E_BYTES=%s\n' "$(stat -c %s /tmp/boz-binprobe/boz.s3e)"

      - name: Decompress S3E executable payload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import lzma
          from pathlib import Path

          src=Path('/tmp/boz-binprobe/boz.s3e').read_bytes()
          if len(src) < 14:
              raise SystemExit('boz.s3e too small')
          props=src[0]
          pb=props // 45
          rem=props % 45
          lp=rem // 9
          lc=rem % 9
          dec=lzma.decompress(
              src[13:],
              format=lzma.FORMAT_RAW,
              filters=[{'id': lzma.FILTER_LZMA1, 'lc':lc, 'lp':lp, 'pb':pb}],
          )
          Path('/tmp/boz-binprobe/boz.unpacked').write_bytes(dec)
          print('BOZ_S3E_DECOMPRESSED_BYTES', len(dec))
          print('BOZ_S3E_MAGIC', dec[:4].decode('ascii', errors='replace'))
          PY

      - name: Probe embedded Marmalade resource compiler strings
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p boz_mod_out/binariser_probe
          strings -a -n 5 /tmp/boz-binprobe/boz.unpacked > /tmp/boz-binprobe/strings.txt

          python3 - <<'PY' | tee boz_mod_out/binariser_probe/report.txt
          from pathlib import Path

          lines=Path('/tmp/boz-binprobe/strings.txt').read_text(
              encoding='latin1', errors='replace').splitlines()
          needles=[
              'Serialising CIwResList',
              'Serialising item',
              'Wrote item:',
              'Read item:',
              '.group.bin.txt',
              '.group.bin.debug',
              '.group.hst',
              'CIwModel',
              'CIwMaterial',
              'CIwResGroup',
              'ResGroupResources',
              'ResGroupMembers',
              'Reading asset:',
          ]
          found={}
          for needle in needles:
              hits=[line for line in lines if needle.lower() in line.lower()]
              found[needle]=hits[:20]
              print('PROBE', repr(needle), 'HITS', len(hits))
              for hit in hits[:5]:
                  print('  ', repr(hit[:240]))

          compiler_markers = sum(bool(found[n]) for n in [
              'Serialising CIwResList',
              'Wrote item:',
              '.group.bin.txt',
              '.group.hst',
          ])
          reader_markers = sum(bool(found[n]) for n in [
              'CIwModel', 'CIwMaterial', 'CIwResGroup'
          ])
          print('COMPILER_MARKER_COUNT', compiler_markers)
          print('RESOURCE_READER_MARKER_COUNT', reader_markers)
          print('XZIEL_BOZ_BINARISER_PROBE_OK')
          PY

          grep -q "XZIEL_BOZ_BINARISER_PROBE_OK" boz_mod_out/binariser_probe/report.txt

      - name: Save probe metadata only
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/boz-binprobe
          printf '%s\n' \
            "SOURCE_BINARY_RETAINED=false" \
            "PAYLOAD_STRINGS_RETAINED=false" \
            "GATE_7=boz_binariser_capability_probe" \
            "STATUS=GREEN" \
            > boz_mod_out/binariser_probe/gate.env

      - uses: actions/upload-artifact@v4
        with:
          name: XZIEL-BOZ-Binariser-Capability-Probe
          path: boz_mod_out/binariser_probe/
          if-no-files-found: error
          retention-days: 14

  real-kino-group-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v5

      - name: Fetch temporary BOZ DTRZ source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/boz-kino
          curl -L --fail --retry 3 --retry-delay 2 \
            -o /tmp/boz-kino/app-release.apk \
            https://github.com/12brendon34/COD-BOZ-Partially-Decompiled/releases/download/1.3.5/app-release.apk
          ENTRY="$(unzip -Z1 /tmp/boz-kino/app-release.apk | grep -Fi 'blackops_gles1.dz' | head -n1)"
          test -n "$ENTRY"
          unzip -p /tmp/boz-kino/app-release.apk "$ENTRY" > /tmp/boz-kino/blackops_gles1.dz
          test -s /tmp/boz-kino/blackops_gles1.dz
          mkdir -p /tmp/boz-kino/runtime
          unzip -q /tmp/boz-kino/app-release.apk 'lib/*/*.so' -d /tmp/boz-kino/runtime
          find /tmp/boz-kino/runtime -type f -name '*.so' -print | tee /tmp/boz-kino/runtime-so-list.txt
          test -s /tmp/boz-kino/runtime-so-list.txt
          mv /tmp/boz-kino/app-release.apk /tmp/boz-kino/base.apk
          test -s /tmp/boz-kino/base.apk

      - name: Build pinned native Dzip decoder
        shell: bash
        run: |
          set -euo pipefail
          cargo --version
          git clone https://github.com/CodexuRegexl/Dzip-Rust.git /tmp/dzip-rs
          cd /tmp/dzip-rs
          git checkout fb4bd41d7f749e74673cd7963ba2df7582334a69
          test "$(git rev-parse HEAD)" = "fb4bd41d7f749e74673cd7963ba2df7582334a69"
          cargo build --release -p dzip-cli
          test -x target/release/dzip-cli

      - name: Decode real BOZ archive with native DZ codec
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p boz_mod_out/kino_probe
          /tmp/dzip-rs/target/release/dzip-cli list /tmp/boz-kino/blackops_gles1.dz \
            | tee boz_mod_out/kino_probe/dzip-list.txt
          rm -rf /tmp/boz-kino/extracted
          /tmp/dzip-rs/target/release/dzip-cli extract \
            /tmp/boz-kino/blackops_gles1.dz \
            --output /tmp/boz-kino/extracted \
            | tee boz_mod_out/kino_probe/dzip-extract.log

      - name: Validate decoded Kino resource groups
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/boz_mod/probe_dzip_extracted_groups.py \
            --root /tmp/boz-kino/extracted \
            --out boz_mod_out/kino_probe/report.json \
            | tee boz_mod_out/kino_probe/probe.log
          grep -q "XZIEL_BOZ_GROUP_DECODE_OK" boz_mod_out/kino_probe/probe.log
