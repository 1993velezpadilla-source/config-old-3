name: Xogot Nuketown Source Audio Truth

on:
  workflow_dispatch:
  push:
    branches:
      - feature/godot-aaa-rebuild-v1
    paths:
      - "tools/maps/UENuketownAudioExtract/**"
      - ".github/workflows/xogot-nuketown-audio-truth.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: xogot-nuketown-audio-truth-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extract-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Install source package tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full xz-utils
          mkdir -p "$RUNNER_TEMP/repak"
          curl -fL --retry 5 \
            https://github.com/trumank/repak/releases/download/v0.2.3/repak_cli-x86_64-unknown-linux-gnu.tar.xz \
            -o "$RUNNER_TEMP/repak.tar.xz"
          tar -xJf "$RUNNER_TEMP/repak.tar.xz" -C "$RUNNER_TEMP/repak"
          REPAK=$(find "$RUNNER_TEMP/repak" -type f -name 'repak*' -perm -111 | head -1)
          test -n "$REPAK"
          echo "REPAK=$REPAK" >> "$GITHUB_ENV"

      - name: Download pinned Nuketown source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source-download source-outer source-unpacked
          curl -fL --retry 8 --retry-delay 3 --retry-all-errors \
            -o source-download/nuketown-v49-oculus.zip \
            "https://g-3959.modapi.io/v1/games/3959/mods/5097941/files/7509509/download"
          7z x -y source-download/nuketown-v49-oculus.zip -osource-outer >/dev/null
          PAK=$(find source-outer -type f -name '*.pak' -print -quit)
          test -n "$PAK"
          "$REPAK" unpack "$PAK" -o source-unpacked

          test -s source-unpacked/Pavlov/Plugins/UGC5097941/Content/box/music_box_00.uasset
          test -s source-unpacked/Pavlov/Plugins/UGC5097941/Content/map_creator.uasset
          test -s source-unpacked/Pavlov/Plugins/UGC5097941/Content/admin.uasset

      - name: Pin Pavlov UE5 mappings
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-delay 2 \
            -o source-download/PavMappings.usmap \
            "https://raw.githubusercontent.com/THW-Reaper/PavlovVRMappings/4976647b4f3a209042460bc55a7a3122662d05b7/PavMappings.usmap"
          echo "6d19f9731cc3fbaba34ca8e0833e81e4ffdf1b407edf24de48b1ccb5c63b060c  source-download/PavMappings.usmap" \
            | sha256sum -c -

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build source audio extractor
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore tools/maps/UENuketownAudioExtract/UENuketownAudioExtract.csproj
          dotnet build tools/maps/UENuketownAudioExtract/UENuketownAudioExtract.csproj \
            --configuration Release --no-restore

      - name: Decode internal source SoundWaves
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/nuketown-source-audio/files
          APP=tools/maps/UENuketownAudioExtract/bin/Release/net10.0/UENuketownAudioExtract.dll
          dotnet "$APP" \
            source-unpacked \
            source-download/PavMappings.usmap \
            build/nuketown-source-audio/files \
            build/nuketown-source-audio/audio-manifest.json \
            Pavlov/Plugins/UGC5097941/Content/box/music_box_00.uasset \
            Pavlov/Plugins/UGC5097941/Content/map_creator.uasset \
            Pavlov/Plugins/UGC5097941/Content/admin.uasset \
            Pavlov/Plugins/UGC5097941/Content/sounds/amb/ntzombiesamb.uasset \
            Pavlov/Plugins/UGC5097941/Content/sounds/marlten/marlton_1.uasset \
            Pavlov/Plugins/UGC5097941/Content/sounds/marlten/marlton_2.uasset \
            Pavlov/Plugins/UGC5097941/Content/sounds/marlten/marlton_3.uasset \
            Pavlov/Plugins/UGC5097941/Content/sounds/marlten/marlton_4.uasset \
            Pavlov/Plugins/UGC5097941/Content/sounds/marlten/marlton_5.uasset \
            Pavlov/Plugins/UGC5097941/Content/perks/revive/songs/Call_of_Duty__Zombies_-_Quick_Revive_Song.uasset \
            Pavlov/Plugins/UGC5097941/Content/perks/revive/songs/Perk-a-Cola_OST_-_Quick_Revive_Jingle__2024_.uasset \
            Pavlov/Plugins/UGC5097941/Content/perks/revive/songs/Perk-a-Cola_OST_-_Quick_Revive_Jingle__2025_.uasset \
            Pavlov/Plugins/UGC5097941/Content/perks/revive/songs/Perk-a-Cola_OST_-_Quick_Revive_Jingle__Dark_Aether_.uasset \
            Pavlov/Plugins/UGC5097941/Content/perks/revive/songs/Quick_Revive__Call_of_Duty_.uasset \
            Pavlov/Plugins/UGC5097941/Content/perks/revive/songs/Shadows_of_Evil_NEW__Quick_Revive_Perk_Jingle__in_BO3_Zombies___NEW_Black_Ops_3_Zombies_Perks_.uasset \
            Pavlov/Plugins/UGC5097941/Content/perks/dt/songs/_NEW__The_Official_80_s_Double_Tap_Perk_Jingle_Music_Video.uasset \
            Pavlov/Plugins/UGC5097941/Content/perks/dt/songs/Call_of_Duty__Black_Ops_Zombies_-_Double_Tap_Jingle__Mob_of_the_Dead_Version_.uasset \
            Pavlov/Plugins/UGC5097941/Content/perks/dt/songs/Call_of_Duty__Zombies_-_Double_Tap_Song.uasset \
            Pavlov/Plugins/UGC5097941/Content/perks/dt/songs/Perk-a-Cola_OST_-_Double_Tap_Root_Beer_Jingle__Dark_Aether_.uasset \
            Pavlov/Plugins/UGC5097941/Content/perks/dt/songs/Shadows_of_Evil_NEW__Double_Tap_Perk_Jingle__in_BO3_Zombies___NEW_Black_Ops_3_Zombies_Perks_.uasset \
            | tee build/nuketown-source-audio/extract.log
          grep -q "XZOGOT_NUKETOWN_AUDIO_EXTRACT_GREEN" build/nuketown-source-audio/extract.log

      - name: Record JoinSounds provenance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          p=Path("build/nuketown-source-audio/audio-manifest.json")
          d=json.loads(p.read_text())
          assert d["ready"] is True, d
          assert d["decodedSoundCount"] == 20, d
          d["ambientActors"] = {
              "AmbientSound_1": {
                  "cue": "marlton_1_SoundCue",
                  "loop": True,
                  "volumeMultiplier": 1.2,
                  "attenuationShapeExtent": 430.0,
                  "falloffDistance": 180.0,
                  "relativeLocationUE": [-3446.2954, -2458.0461, 253.4512],
                  "waves": ["marlton_5", "marlton_4", "marlton_2", "marlton_3", "marlton_1"],
              },
              "AmbientSound_2": {
                  "cue": "ntzombiesamb_SoundCue",
                  "loop": True,
                  "canPlayMultipleInstances": True,
                  "relativeLocationUE": [197.16177, -1483.09, 317.21808],
                  "waves": ["ntzombiesamb"],
              },
              "AmbientSound_3": {
                  "cue": "Call_of_Duty__Zombies_-_Quick_Revive_Song_SoundCue",
                  "loop": True,
                  "attenuationShapeExtent": 280.0,
                  "falloffDistance": 250.0,
                  "relativeLocationUE": [-1135.2125, -1309.3485, 308.49698],
                  "waves": [
                      "Call_of_Duty__Zombies_-_Quick_Revive_Song",
                      "Perk-a-Cola_OST_-_Quick_Revive_Jingle__2024_",
                      "Perk-a-Cola_OST_-_Quick_Revive_Jingle__2025_",
                      "Perk-a-Cola_OST_-_Quick_Revive_Jingle__Dark_Aether_",
                      "Quick_Revive__Call_of_Duty_",
                      "Shadows_of_Evil_NEW__Quick_Revive_Perk_Jingle__in_BO3_Zombies___NEW_Black_Ops_3_Zombies_Perks_",
                  ],
              },
              "AmbientSound_4": {
                  "cue": "_NEW__The_Official_80_s_Double_Tap_Perk_Jingle_Music_Video_SoundCue",
                  "loop": True,
                  "falloffDistance": 300.0,
                  "relativeLocationUE": [-149.82141, -1483.9275, 331.50946],
                  "waves": [
                      "_NEW__The_Official_80_s_Double_Tap_Perk_Jingle_Music_Video",
                      "Call_of_Duty__Black_Ops_Zombies_-_Double_Tap_Jingle__Mob_of_the_Dead_Version_",
                      "Call_of_Duty__Zombies_-_Double_Tap_Song",
                      "Perk-a-Cola_OST_-_Double_Tap_Root_Beer_Jingle__Dark_Aether_",
                      "Shadows_of_Evil_NEW__Double_Tap_Perk_Jingle__in_BO3_Zombies___NEW_Black_Ops_3_Zombies_Perks_",
                  ],
              },
          }
          d["joinSoundBlueprints"] = {
              "JoinSounds_C": {
                  "sound": "/UGC4905655/bps/synthesized_audio_wav",
                  "availability": "EXTERNAL_UGC_NOT_IN_NUKETOWN_PAYLOAD",
                  "runtimeDisposition": "XOGOT_REPLACEMENT_REQUIRED",
              },
              "JoinSounds_2_C": {
                  "sound": "/UGC5097941/map_creator",
                  "availability": "SOURCE_INTERNAL_DECODED",
              },
              "JoinSounds_3_C": {
                  "sound": "/UGC5097941/admin",
                  "availability": "SOURCE_INTERNAL_DECODED",
              },
              "NewBlueprint1_2_C": {
                  "sound": "/UGC5097941/box/music_box_00",
                  "availability": "SOURCE_INTERNAL_DECODED",
              },
          }
          p.write_text(json.dumps(d, indent=2) + "\n")
          print("XZOGOT_NUKETOWN_AUDIO_PROVENANCE_GREEN")
          PY

      - name: Upload private benchmark audio proof
        uses: actions/upload-artifact@v4
        with:
          name: Xogot-Nuketown-Source-Audio-Proof
          path: |
            build/nuketown-source-audio/audio-manifest.json
            build/nuketown-source-audio/extract.log
            build/nuketown-source-audio/files/*
          if-no-files-found: error
          retention-days: 14
