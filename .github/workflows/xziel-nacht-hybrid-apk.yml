name: XZIEL Nacht Hybrid EXE-in-APK

on:
  workflow_dispatch:

concurrency:
  group: xziel-nacht-hybrid-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build direct-boot Nacht hybrid APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout XZIEL
        uses: actions/checkout@v5

      - name: Download current GREEN Nacht one-file EXE
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ONEFILE_RUN=36644822493

          # This run is the first one-file build that includes the Win64
          # keyboard/mouse bridge consumed by the Android touch+gyro overlay.
          gh run watch "$ONEFILE_RUN" \
            --repo "${{ github.repository }}" \
            --exit-status

          mkdir -p input/nacht-exe
          gh run download "$ONEFILE_RUN" \
            --repo "${{ github.repository }}" \
            --name "XZIEL-Nacht-Windows-OneFile-Fast" \
            --dir input/nacht-exe

          EXE="$(find input/nacht-exe -type f -name 'Nacht-Chronicles-XZIEL.exe' -print -quit)"
          SHA_FILE="$(find input/nacht-exe -type f -name 'Nacht-Chronicles-XZIEL.exe.sha256' -print -quit)"
          test -n "$EXE"
          test -s "$EXE"
          test -n "$SHA_FILE"
          test -s "$SHA_FILE"

          bytes="$(wc -c < "$EXE" | tr -d '[:space:]')"
          sha="$(sha256sum "$EXE" | awk '{print $1}')"
          artifact_sha="$(awk '{print $1}' "$SHA_FILE")"

          test "$bytes" -gt 800000000
          test "$sha" = "$artifact_sha"

          echo "XZIEL_NACHT_EXE=$EXE" >> "$GITHUB_ENV"
          echo "XZIEL_NACHT_EXPECTED_SHA256=$sha" >> "$GITHUB_ENV"
          echo "XZIEL_ONEFILE_SOURCE_RUN=$ONEFILE_RUN" >> "$GITHUB_ENV"
          echo "XZIEL_CURRENT_EXE_REUSE_GREEN run=$ONEFILE_RUN bytes=$bytes sha256=$sha"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install host build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            git unzip zip python3

      - name: Install Android NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "ndk;24.0.8215888" "cmake;3.22.1"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Build XZIEL Nacht hybrid APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/build_xziel_nacht_hybrid_apk.sh
          bash scripts/build_xziel_nacht_hybrid_apk.sh

      - name: Upload hybrid APK
        uses: actions/upload-artifact@v4
        with:
          name: XZIEL-Nacht-Hybrid-PixelFold
          path: |
            build/xziel-nacht-hybrid/dist/XZIEL-Nacht-Hybrid-PixelFold-debug.apk
            build/xziel-nacht-hybrid/dist/XZIEL-Nacht-Hybrid-PixelFold-debug.apk.sha256
            build/xziel-nacht-hybrid/dist/apk-contents.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
