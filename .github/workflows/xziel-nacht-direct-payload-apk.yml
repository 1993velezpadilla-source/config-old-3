name: XZIEL Nacht Direct Payload APK

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/xziel-nacht-win64-exe-v1
    paths:
      - ".github/workflows/xziel-nacht-direct-payload-apk.yml"
      - "scripts/build_xziel_nacht_direct_payload_apk.sh"
      - "scripts/patch_winlator_xziel_nacht_direct_payload.py"

permissions:
  contents: read
  actions: read

concurrency:
  group: xziel-nacht-direct-payload-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build direct payload Pixel Fold APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout XZIEL
        uses: actions/checkout@v5

      - name: Download validated Nacht VFS and Win64 runtime
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/vfs input/runtime

          gh run download 36642428359             --repo "${{ github.repository }}"             --name "XZIEL-Nacht-VFS-Complete"             --dir input/vfs

          gh run download 36644605239             --repo "${{ github.repository }}"             --name "XZIEL-Nacht-Win64-Runtime"             --dir input/runtime

          VFS="$(find input/vfs -type f -name 'xziel-nacht-vfs.zip' -print -quit)"
          RUNTIME_EXE="$(find input/runtime -type f -name 'Xziel-Nacht.exe' -print -quit)"
          test -n "$VFS" && test -s "$VFS"
          test -n "$RUNTIME_EXE" && test -s "$RUNTIME_EXE"

          RUNTIME_DIR="$(dirname "$RUNTIME_EXE")"
          echo "XZIEL_NACHT_VFS=$VFS" >> "$GITHUB_ENV"
          echo "XZIEL_NACHT_RUNTIME_DIR=$RUNTIME_DIR" >> "$GITHUB_ENV"

          echo "XZIEL_DIRECT_SOURCE_VFS bytes=$(wc -c < "$VFS")"
          echo "XZIEL_DIRECT_SOURCE_RUNTIME bytes=$(wc -c < "$RUNTIME_EXE")"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install host tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y git unzip zip python3 zstd

      - name: Install Android NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "ndk;24.0.8215888" "cmake;3.22.1"

      - name: Build direct payload APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/build_xziel_nacht_direct_payload_apk.sh
          bash scripts/build_xziel_nacht_direct_payload_apk.sh

      - name: Upload direct payload APK
        uses: actions/upload-artifact@v4
        with:
          name: XZIEL-Nacht-DirectPayload-PixelFold
          path: |
            build/xziel-nacht-direct-payload/dist/XZIEL-Nacht-DirectPayload-PixelFold-debug.apk
            build/xziel-nacht-direct-payload/dist/XZIEL-Nacht-DirectPayload-PixelFold-debug.apk.sha256
            build/xziel-nacht-direct-payload/dist/direct-payload-contract.txt
            build/xziel-nacht-direct-payload/dist/apk-contents.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
