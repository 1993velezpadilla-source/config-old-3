name: XZIEL Nacht Structural Geometry Audit

on:
  workflow_dispatch:
  pull_request:
    branches:
      - feature/xziel-static-scene-material-final5
    paths:
      - ".github/workflows/nacht-structural-geometry-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install SteamCMD and repak
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/steamcmd" "$RUNNER_TEMP/repak"
          curl -fL --retry 6 --retry-delay 2 --retry-all-errors \
            https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz \
            -o "$RUNNER_TEMP/steamcmd.tgz"
          tar -xzf "$RUNNER_TEMP/steamcmd.tgz" -C "$RUNNER_TEMP/steamcmd"
          "$RUNNER_TEMP/steamcmd/steamcmd.sh" +quit || true
          curl -fL --retry 5 \
            https://github.com/trumank/repak/releases/download/v0.2.3/repak_cli-x86_64-unknown-linux-gnu.tar.xz \
            -o "$RUNNER_TEMP/repak.tar.xz"
          tar -xJf "$RUNNER_TEMP/repak.tar.xz" -C "$RUNNER_TEMP/repak"
          REPAK=$(find "$RUNNER_TEMP/repak" -type f -name 'repak*' -perm -111 | head -1)
          test -n "$REPAK"
          echo "REPAK=$REPAK" >> "$GITHUB_ENV"

      - name: Download Nacht source
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/steamcmd/steamcmd.sh" \
            +login anonymous \
            +workshop_download_item 555160 2755515831 validate \
            +quit
          ROOT=$(find "$HOME" "$RUNNER_TEMP" -type d \
            -path '*/steamapps/workshop/content/555160/2755515831' \
            -print -quit 2>/dev/null)
          test -n "$ROOT"
          mkdir -p "$RUNNER_TEMP/nacht-unpacked"
          "$REPAK" unpack "$ROOT/WindowsNoEditor.pak" -o "$RUNNER_TEMP/nacht-unpacked"
          echo "UNPACKED=$RUNNER_TEMP/nacht-unpacked" >> "$GITHUB_ENV"

      - name: Build structural mesh exporter
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/struct-exporter"
          cd "$RUNNER_TEMP/struct-exporter"
          dotnet new console --framework net10.0 --force
          dotnet add package CUE4Parse --version 1.2.2.202609
          dotnet add package CUE4Parse-Conversion --version 1.2.2.202609
          cat > Program.cs <<'CS'
          using CUE4Parse.FileProvider;
          using CUE4Parse.UE4.Versions;
          using CUE4Parse.UE4.Assets.Exports.StaticMesh;
          using CUE4Parse_Conversion;
          using CUE4Parse_Conversion.Options;

          if (args.Length != 2) return 2;

          var wanted = new HashSet<string>(
              new[] {
                  "zm_prototype_part1_t7_concrete_wall_damaged_01_bare",
                  "zm_prototype_part1_t7_concrete_wall_weathered_01",
                  "zm_prototype_part1_t7_concrete_floor_sealed_01",
                  "zm_prototype_part3_t7_metal_rust_ceiling_01",
                  "zm_prototype_part1_t7_concrete_poured_bunker_dirty_01"
              },
              StringComparer.OrdinalIgnoreCase);

          var provider = new DefaultFileProvider(
              args[0],
              SearchOption.AllDirectories,
              true,
              new VersionContainer(EGame.GAME_UE4_21));
          provider.Initialize();
          provider.PostMount();
          provider.LoadVirtualPaths();

          var session = new ExportSession {
              MaxDegreeOfParallelism = 2
          };
          var found = new HashSet<string>(
              StringComparer.OrdinalIgnoreCase);

          foreach (var file in provider.Files.Values
              .Where(f => f.IsUePackage)
              .Where(f => f.Path.Contains(
                  "/CoD_nacht/",
                  StringComparison.OrdinalIgnoreCase))
              .Where(f => f.Path.EndsWith(
                  ".uasset",
                  StringComparison.OrdinalIgnoreCase)))
          {
              try
              {
                  foreach (var mesh in provider.LoadPackage(file.Path)
                      .GetExports()
                      .OfType<UStaticMesh>())
                  {
                      if (!wanted.Contains(mesh.Name))
                          continue;
                      if (!found.Add(mesh.Name))
                          continue;
                      Console.WriteLine(
                          $"FOUND {mesh.Name} {mesh.GetPathName()}");
                      session.Add(mesh);
                  }
              }
              catch { }
          }

          Console.WriteLine(
              $"wanted={wanted.Count} found={found.Count}");

          if (found.Count != wanted.Count)
          {
              foreach (var miss in wanted.Except(found))
                  Console.Error.WriteLine("MISSING " + miss);
              return 3;
          }

          Directory.CreateDirectory(args[1]);
          var result = await session.RunAsync(
              args[1],
              new ExportOptions(
                  meshFormat: EMeshFormat.Gltf2,
                  exportMaterials: false));

          Console.WriteLine($"exportResults={result.Count}");
          return result.Count == wanted.Count ? 0 : 4;
          CS
          dotnet build -c Release

      - name: Export and inspect structural chunks
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/struct-glb"
          mkdir -p "$OUT" build/nacht-structural-audit
          dotnet "$RUNNER_TEMP/struct-exporter/bin/Release/net10.0/struct-exporter.dll" \
            "$UNPACKED" "$OUT" | tee build/nacht-structural-audit/export.log

          python3 - <<'PY'
          import os, pathlib, shutil
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"struct-glb"
          for p in list(pathlib.Path.cwd().iterdir()):
              if p.is_file() and "\\" in p.name and p.name.lower().endswith(".glb"):
                  target=root/p.name.replace("\\","/").split("/")[-1]
                  shutil.move(str(p),str(target))
          glbs=list(root.rglob("*.glb"))
          print("GLB_COUNT",len(glbs))
          assert len(glbs)==5, [str(x) for x in glbs]
          PY

          python3 - <<'PY'
          import importlib.util, json, os, pathlib
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"struct-glb"
          spec=importlib.util.spec_from_file_location(
              "conv",
              pathlib.Path("tools/maps/convert_glb_to_xzmesh.py"))
          conv=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(conv)

          reports={}
          for glb in sorted(root.rglob("*.glb")):
              out=pathlib.Path("build/nacht-structural-audit")/(glb.stem+".xzm")
              report=conv.convert(glb,out)
              reports[glb.stem]=report
              print(
                  "XZIEL_STRUCTURAL_BOUNDS",
                  glb.stem,
                  json.dumps(report,sort_keys=True),
              )

          pathlib.Path(
              "build/nacht-structural-audit/report.json"
          ).write_text(
              json.dumps(reports,indent=2)+"\n",
              encoding="utf-8")
          PY

      - name: Upload audit
        uses: actions/upload-artifact@v4
        with:
          name: nacht-structural-geometry-audit
          path: build/nacht-structural-audit/
          if-no-files-found: error
