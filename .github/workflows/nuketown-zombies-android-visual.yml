name: XZIEL Nuketown Android Visual - LEGACY HARNESS BLOCKED

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blocked:
    name: Legacy Quake/NZP visual harness is not acceptance evidence
    runs-on: ubuntu-latest
    steps:
      - name: Block obsolete visual path
        shell: bash
        run: |
          echo "::error::This workflow is intentionally blocked."
          echo "::error::Nuketown visual acceptance must NOT use NZPActivity, QuakeC, ndu.bsp, nzp-data.zip, or XZIEL_STATIC_SCENE_HARNESS_MAP."
          echo "::error::Use the standalone XZIEL native visual runner instead."
          exit 1
