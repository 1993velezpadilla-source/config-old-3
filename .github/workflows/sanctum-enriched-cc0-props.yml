name: Sanctum Enriched CC0 Props

on:
  push:
    branches:
      - feature/xziel-map-builder-agent-v1
    paths:
      - ".github/workflows/sanctum-enriched-cc0-props.yml"
      - "tools/sanctum_v2/enrich_sanctum_cc0_props.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sanctum-enriched-cc0-props-${{ github.ref }}
  cancel-in-progress: true

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v5

      - name: Install host packages
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            git-lfs curl xz-utils xvfb unzip bzip2 \
            build-essential cmake ninja-build pkg-config python3-venv \
            libx11-6 libxi6 libxxf86vm1 libxfixes3 libxrender1 \
            libgl1 libglu1-mesa
          git lfs install

      - name: Fetch approved architecture and CC0 props
        shell: bash
        run: |
          set -euo pipefail
          rm -rf external-french-houses external-cc0-church external-ruins external-sanctum-props
          git clone --depth 1 https://github.com/IRCSS/Blender-Geometry-Node-French-Houses.git external-french-houses
          (cd external-french-houses && git lfs pull || true)
          grep -q "MIT License" external-french-houses/LICENSE
          test -s external-french-houses/GeometryNodesFrenchHous.blend

          mkdir -p external-cc0-church external-ruins external-sanctum-props

          curl -L --fail --retry 3 https://opengameart.org/content/medieval-church-interior -o external-cc0-church/page.html
          grep -qi CC0 external-cc0-church/page.html
          curl -L --fail --retry 3 https://opengameart.org/sites/default/files/church.blend -o external-cc0-church/church.blend

          curl -L --fail --retry 3 https://opengameart.org/content/3td-fantasy-ruins-pack-for-blender -o external-ruins/page.html
          grep -qi CC0 external-ruins/page.html
          curl -L --fail --retry 3 https://opengameart.org/sites/default/files/fantasy_ruins_pack_for_blender.blend -o external-ruins/fantasy_ruins_pack_for_blender.blend

          curl -L --fail --retry 3 https://opengameart.org/content/medieval-benches -o external-sanctum-props/benches.html
          grep -qi CC0 external-sanctum-props/benches.html
          curl -L --fail --retry 3 https://opengameart.org/sites/default/files/medievalbenchesexport.blend -o external-sanctum-props/medievalbenchesexport.blend

          curl -L --fail --retry 3 https://opengameart.org/content/medieval-candles -o external-sanctum-props/candles.html
          grep -qi CC0 external-sanctum-props/candles.html
          curl -L --fail --retry 3 https://opengameart.org/sites/default/files/medievalcandles.blend -o external-sanctum-props/medievalcandles.blend

          test -s external-cc0-church/church.blend
          test -s external-ruins/fantasy_ruins_pack_for_blender.blend
          test -s external-sanctum-props/medievalbenchesexport.blend
          test -s external-sanctum-props/medievalcandles.blend

          sha256sum external-sanctum-props/medievalbenchesexport.blend | tee /tmp/bench.sha256
          sha256sum external-sanctum-props/medievalcandles.blend | tee /tmp/candle.sha256
          sha256sum external-ruins/fantasy_ruins_pack_for_blender.blend | tee /tmp/ruins.sha256

      - name: Install Blender 5.2.2
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz -o /tmp/blender.tar.xz
          tar -C /tmp -xf /tmp/blender.tar.xz
          /tmp/blender-5.2.2-linux-x64/blender --version

      - name: Build enriched Sanctum
        shell: bash
        env:
          SANCTUM_COMPOSITE_OUT: sanctum-enriched-composite
          SANCTUM_DRESS_OUT: sanctum-enriched-base
          SANCTUM_ENRICH_OUT: sanctum-enriched-probe
          SANCTUM_CC0_BLEND: external-cc0-church/church.blend
          SANCTUM_RUINS_BLEND: external-ruins/fantasy_ruins_pack_for_blender.blend
          SANCTUM_BENCH_BLEND: external-sanctum-props/medievalbenchesexport.blend
          SANCTUM_CANDLE_BLEND: external-sanctum-props/medievalcandles.blend
          XZIEL_MAP_AGENT_PLAN: tools/sanctum_v2/map_builder_plan.json
        run: |
          set -euo pipefail
          mkdir -p sanctum-enriched-composite sanctum-enriched-base sanctum-enriched-probe
          export SANCTUM_RUINS_SHA256="$(cut -d' ' -f1 /tmp/ruins.sha256)"
          export SANCTUM_BENCH_SHA256="$(cut -d' ' -f1 /tmp/bench.sha256)"
          export SANCTUM_CANDLE_SHA256="$(cut -d' ' -f1 /tmp/candle.sha256)"

          xvfb-run -a -s "-screen 0 1600x1000x24" \
            /tmp/blender-5.2.2-linux-x64/blender \
            -b external-french-houses/GeometryNodesFrenchHous.blend \
            --python tools/sanctum_v2/enrich_sanctum_cc0_props.py \
            2>&1 | tee sanctum-enriched-probe/blender-enriched.log

          grep -q SANCTUM_ENRICHED_CC0_PROPS_PASS sanctum-enriched-probe/blender-enriched.log

      - name: Validate enriched evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path("sanctum-enriched-probe")
          d=json.loads((root/"enriched-report.json").read_text(encoding="utf-8"))
          assert d["status"]=="PASS",d
          assert d["pew_count"]==10,d
          assert d["candle_count"]==6,d
          assert d["walkability_retention_ratio"]>=0.88,d
          assert d["central_aisle_intruders"]==[],d
          assert len(d["renders"])==4,d
          assert d["glb_bytes"]>1000000,d
          assert len(d["bench_source_sha256"])==64,d
          assert len(d["candle_source_sha256"])==64,d
          for item in d["renders"]:
              p=root/item["name"]
              assert p.is_file() and p.stat().st_size>4000,p
          print("SANCTUM_ENRICHED_EVIDENCE_GREEN")
          print("PEWS",d["pew_count"])
          print("CANDLES",d["candle_count"])
          print("RETENTION",d["walkability_retention_ratio"])
          PY

      - name: Optimize validate and bake runtime sidecars
        shell: bash
        run: |
          set -euo pipefail
          RAW="sanctum-enriched-probe/sanctum-enriched-cathedral-interior.glb"

          bash tools/xziel_toolchain/bootstrap_asset_cli.sh
          XZIEL_KTX2_UASTC=1 bash tools/xziel_toolchain/process_glb.sh \
            "$RAW" sanctum-enriched-probe/asset-pipeline sanctum-enriched

          bash tools/xziel_toolchain/bootstrap_fast.sh
          bash tools/xziel_toolchain/bootstrap_geometry_cpu.sh
          mkdir -p sanctum-enriched-probe/runtime

          .xziel-tools/geometry-venv/bin/python \
            tools/xziel_toolchain/extract_runtime_geometry.py \
            --input "$RAW" \
            --out sanctum-enriched-probe/runtime

          .xziel-tools/bin/xziel-navmesh-bake \
            sanctum-enriched-probe/runtime/sanctum-nav-source.obj \
            sanctum-enriched-probe/runtime/sanctum.navbin \
            sanctum-enriched-probe/runtime/navmesh-report.json

          .xziel-tools/geometry-venv/bin/python \
            tools/xziel_toolchain/generate_collision_hulls.py \
            --input sanctum-enriched-probe/runtime/sanctum-collision-source.glb \
            --output sanctum-enriched-probe/runtime/sanctum-collision-hulls.glb \
            --report sanctum-enriched-probe/runtime/collision-report.json \
            --threshold 0.08 --max-hulls 128 --max-hull-vertices 64

          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path("sanctum-enriched-probe")
          pipe=json.loads((root/"asset-pipeline/sanctum-enriched.pipeline.json").read_text())
          nav=json.loads((root/"runtime/navmesh-report.json").read_text())
          col=json.loads((root/"runtime/collision-report.json").read_text())
          assert pipe["validator"]["errors"]==0,pipe
          assert nav["status"]=="PASS" and nav["nav_polygons"]>0,nav
          assert col["status"]=="PASS" and 1<=col["hull_count"]<=128,col
          print("SANCTUM_ENRICHED_RUNTIME_GREEN",nav["nav_polygons"],col["hull_count"])
          PY

      - name: Upload enriched Sanctum
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XZIEL-Sanctum-Enriched-CC0-Props
          path: |
            sanctum-enriched-probe/
            sanctum-enriched-base/dressed-report.json
            sanctum-enriched-composite/composite-report.json
          if-no-files-found: error
          retention-days: 14
