name: XZIEL Nacht PostProcess Exposure Audit

on:
  workflow_dispatch:
  pull_request:
    branches:
      - feature/xziel-nacht-light-components-166-integrate-v1
    paths:
      - ".github/workflows/nacht-postprocess-exposure-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install SteamCMD and repak
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/steamcmd" "$RUNNER_TEMP/repak"
          curl -fL --retry 6 --retry-delay 2 --retry-all-errors \
            https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz \
            -o "$RUNNER_TEMP/steamcmd.tgz"
          tar -xzf "$RUNNER_TEMP/steamcmd.tgz" -C "$RUNNER_TEMP/steamcmd"
          "$RUNNER_TEMP/steamcmd/steamcmd.sh" +quit || true
          curl -fL --retry 5 \
            https://github.com/trumank/repak/releases/download/v0.2.3/repak_cli-x86_64-unknown-linux-gnu.tar.xz \
            -o "$RUNNER_TEMP/repak.tar.xz"
          tar -xJf "$RUNNER_TEMP/repak.tar.xz" -C "$RUNNER_TEMP/repak"
          REPAK=$(find "$RUNNER_TEMP/repak" -type f -name 'repak*' -perm -111 | head -1)
          test -n "$REPAK"
          echo "REPAK=$REPAK" >> "$GITHUB_ENV"

      - name: Download Nacht source
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/steamcmd/steamcmd.sh" \
            +login anonymous \
            +workshop_download_item 555160 2755515831 validate \
            +quit
          ROOT=$(find "$HOME" "$RUNNER_TEMP" -type d \
            -path '*/steamapps/workshop/content/555160/2755515831' \
            -print -quit 2>/dev/null)
          test -n "$ROOT/WindowsNoEditor.pak"
          mkdir -p "$RUNNER_TEMP/nacht-unpacked"
          "$REPAK" unpack "$ROOT/WindowsNoEditor.pak" -o "$RUNNER_TEMP/nacht-unpacked"
          echo "UNPACKED=$RUNNER_TEMP/nacht-unpacked" >> "$GITHUB_ENV"

      - name: Extract PostProcess and exposure state
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/postprocess"
          cd "$RUNNER_TEMP/postprocess"
          dotnet new console --framework net10.0 --force
          dotnet add package CUE4Parse --version 1.2.2.202609
          cat > Program.cs <<'CS'
          using CUE4Parse.FileProvider;
          using CUE4Parse.UE4.Versions;
          using System.Collections;
          using System.Reflection;
          using System.Text.Json;

          if (args.Length != 2) return 2;

          const BindingFlags Flags =
              BindingFlags.Instance |
              BindingFlags.Public |
              BindingFlags.NonPublic;

          var provider = new DefaultFileProvider(
              args[0],
              SearchOption.AllDirectories,
              true,
              new VersionContainer(EGame.GAME_UE4_21));
          provider.Initialize();
          provider.PostMount();
          provider.LoadVirtualPaths();

          var maps = provider.Files.Values
              .Where(f => Path.GetFileName(f.Path).Equals(
                  "Nacht_de_Untoten.umap",
                  StringComparison.OrdinalIgnoreCase))
              .Select(f => f.Path)
              .Distinct(StringComparer.OrdinalIgnoreCase)
              .ToArray();

          if (maps.Length != 1) return 3;
          var exports = provider.LoadPackage(maps[0]).GetExports().ToArray();

          object? Read(object target, string name)
          {
              var f = target.GetType().GetField(name, Flags);
              if (f is not null) {
                  try { return f.GetValue(target); } catch { }
              }
              var p = target.GetType().GetProperty(name, Flags);
              if (p is not null && p.GetIndexParameters().Length == 0 && p.GetMethod is not null) {
                  try { return p.GetValue(target); } catch { }
              }
              return null;
          }

          string Safe(object? value)
          {
              if (value is null) return "";
              try { return value.ToString() ?? ""; } catch { return ""; }
          }

          Dictionary<string,string> Members(object target, Func<string,bool> keep)
          {
              var rows = new Dictionary<string,string>(StringComparer.OrdinalIgnoreCase);
              foreach (var f in target.GetType().GetFields(Flags))
              {
                  if (!keep(f.Name)) continue;
                  try { rows[f.Name] = Safe(f.GetValue(target)); } catch { }
              }
              foreach (var p in target.GetType().GetProperties(Flags))
              {
                  if (!keep(p.Name) || p.GetIndexParameters().Length != 0 || p.GetMethod is null)
                      continue;
                  try { rows[p.Name] = Safe(p.GetValue(target)); } catch { }
              }
              return rows;
          }

          bool Relevant(string name)
          {
              string[] needles = {
                  "Exposure","AutoExposure","EyeAdapt","Meter","Histogram",
                  "WhiteTemp","WhiteTint","Temperature","Bloom","Film",
                  "Tone","Color","Vignette","Gamma","Contrast","Saturation",
                  "MinBrightness","MaxBrightness","SpeedUp","SpeedDown"
              };
              return needles.Any(n => name.Contains(n, StringComparison.OrdinalIgnoreCase));
          }

          var rows = new List<object>();

          foreach (var export in exports)
          {
              var type = export.GetType().FullName ?? export.GetType().Name;
              var name = export.Name ?? "";
              if (!type.Contains("PostProcess", StringComparison.OrdinalIgnoreCase)
                  && !name.Contains("PostProcess", StringComparison.OrdinalIgnoreCase))
                  continue;

              var settings = Read(export, "Settings");
              rows.Add(new {
                  name,
                  type,
                  path = export.GetPathName() ?? "",
                  bUnbound = Safe(Read(export, "bUnbound")),
                  priority = Safe(Read(export, "Priority")),
                  blendRadius = Safe(Read(export, "BlendRadius")),
                  blendWeight = Safe(Read(export, "BlendWeight")),
                  enabled = Safe(Read(export, "bEnabled")),
                  directRelevant = Members(export, Relevant),
                  settingsType = settings?.GetType().FullName ?? "",
                  settingsRelevant = settings is null
                      ? new Dictionary<string,string>()
                      : Members(settings, Relevant),
                  settingsAll = settings is null
                      ? new Dictionary<string,string>()
                      : Members(settings, _ => true)
              });
          }

          var keywordRows = exports
              .Where(e => {
                  var t = e.GetType().FullName ?? e.GetType().Name;
                  var n = e.Name ?? "";
                  return t.Contains("Exposure", StringComparison.OrdinalIgnoreCase)
                      || n.Contains("Exposure", StringComparison.OrdinalIgnoreCase)
                      || t.Contains("EyeAdapt", StringComparison.OrdinalIgnoreCase)
                      || n.Contains("EyeAdapt", StringComparison.OrdinalIgnoreCase);
              })
              .Select(e => new {
                  name = e.Name,
                  type = e.GetType().FullName ?? e.GetType().Name,
                  path = e.GetPathName() ?? ""
              })
              .ToArray();

          var report = new {
              schemaVersion = 1,
              sourcePackage = maps[0],
              postProcessExportCount = rows.Count,
              postProcess = rows,
              exposureKeywordExportCount = keywordRows.Length,
              exposureKeywordExports = keywordRows
          };

          File.WriteAllText(
              args[1],
              JsonSerializer.Serialize(
                  report,
                  new JsonSerializerOptions { WriteIndented = true }));

          Console.WriteLine(
              "XZIEL_NACHT_POSTPROCESS_AUDIT " +
              JsonSerializer.Serialize(new {
                  report.postProcessExportCount,
                  report.exposureKeywordExportCount
              }));

          foreach (var row in rows)
              Console.WriteLine(
                  "XZIEL_NACHT_POSTPROCESS_ROW " +
                  JsonSerializer.Serialize(row));

          return 0;
          CS

          dotnet run --configuration Release -- \
            "$UNPACKED" \
            "$GITHUB_WORKSPACE/nacht-postprocess-exposure.json"

      - name: Upload audit
        uses: actions/upload-artifact@v4
        with:
          name: nacht-postprocess-exposure
          path: nacht-postprocess-exposure.json
          if-no-files-found: error
