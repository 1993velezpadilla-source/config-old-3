name: Nacht Real Source 16 Cardinal Interior Exterior Yaw Visual 360 A-B (Research)

on:
  workflow_dispatch:
  push:
    branches:
      - research/nacht-bo3-meridian-source-bridge-20261009
    paths:
      - ".github/workflows/xogot-nacht-real-vista-360-yaw-ab.yml"
      - "tools/maps/nacht_real_vista_360_candidate_view_sweep.gd"
      - "tools/maps/nacht_apply_vista_spatial_multimesh_research.gd"

permissions:
  contents: read
  actions: read

jobs:
  real-godot-source-pixel-visual-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - name: Require real Godot 4.6.1 sweep parser GREEN and source actors/materials/lights authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh run view 37979504607 --json conclusion --jq '.conclusion')" = success
          for id in 37938836028 37939504798 37944732189 37945872261 37947767584 37961985956 37965581696 37967088357 37966178042; do
            test "$(gh run view "$id" --json conclusion --jq '.conclusion')" = success
          done
          echo "XZOGOT_NACHT_REAL_GLTF_DDS_EXTERIOR_DRAW_CALL_SOURCE_DEPENDENCIES_GREEN"
      - name: Stage authoritative original native Godot GLB/UE materials source DDS, original lights, and 55m guard
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/nacht-renderer-ab/glb build/nacht-renderer-ab/materials \
            build/nacht-renderer-ab/vista build/nacht-renderer-ab/policy "$RUNNER_TEMP/source"
          gh run download 37938836028 \
            -n Nacht-LOSSLESS-Native-493-GLB-10793-Actor-Godot-Research-Proof \
            -D build/nacht-renderer-ab/glb
          gh run download 37944732189 \
            -n Nacht-10793-Original-574-Materials-16595-Source-Surface-Assignments \
            -D build/nacht-renderer-ab/materials
          gh run download 37961985956 \
            -n Nacht-Original-10793-Exterior-Foliage-World-Distance-LOD-Policy \
            -D build/nacht-renderer-ab/policy
          gh run download 37965581696 \
            -n Nacht-Original-UE421-Authored-Vista-Far-Background-Reachability-Guard \
            -D build/nacht-renderer-ab/vista
          gh run download 37762871109 \
            -n Xogot-Nacht-Chronicles-Godot-Runtime \
            -D "$RUNNER_TEMP/source"
          PROJECT=$(find build/nacht-renderer-ab/glb -name project.godot -type f -print -quit)
          MATERIAL=$(find build/nacht-renderer-ab/materials -name nacht-actor-material-authority.json -type f -print -quit)
          POLICY=$(find build/nacht-renderer-ab/policy -name original-exterior-source-actor-visual-policy.json -type f -print -quit)
          VISTA=$(find build/nacht-renderer-ab/vista -name authored-vista-distance-source.json -type f -print -quit)
          STAGE=$(dirname "$(find "$RUNNER_TEMP/source" -name material-binding-manifest.json -type f -print -quit)")
          DDS=$(find "$RUNNER_TEMP/source" -name textures_dds -type d -print -quit)
          LIGHT=$(find "$RUNNER_TEMP/source" -name nacht-lights.json -type f -print -quit)
          ENV=$(find "$RUNNER_TEMP/source" -name nacht-environment-report.json -type f -print -quit)
          AUTH_ENV=$(find "$RUNNER_TEMP/source" -name nacht-environment-runtime-authority.json -type f -print -quit)
          test -s "$PROJECT" && test -s "$MATERIAL" && test -s "$POLICY" && test -s "$VISTA"
          test -s "$LIGHT" && test -s "$ENV" && test -s "$AUTH_ENV" && test -d "$DDS"
          echo "GODOT_PROJECT=$(dirname "$PROJECT")" >> "$GITHUB_ENV"
          echo "SOURCE_MATERIAL=$PWD/$MATERIAL" >> "$GITHUB_ENV"
          echo "SOURCE_POLICY=$PWD/$POLICY" >> "$GITHUB_ENV"
          echo "SOURCE_VISTA=$PWD/$VISTA" >> "$GITHUB_ENV"
          echo "STAGE=$STAGE" >> "$GITHUB_ENV"
          echo "DDS=$DDS" >> "$GITHUB_ENV"
          echo "UE_LIGHT=$LIGHT" >> "$GITHUB_ENV"
          echo "UE_ENV=$ENV" >> "$GITHUB_ENV"
          echo "ORIGINAL_ENV=$AUTH_ENV" >> "$GITHUB_ENV"
      - name: Reconstruct actual Godot scene with original 718 DDS 574 materials 166 UE4 light components
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GODOT_PROJECT/nacht-authority" "$GODOT_PROJECT/scripts"
          cp xogot/scripts/xziel_benchmark_loader.gd "$GODOT_PROJECT/scripts/xziel_benchmark_loader.gd"
          cp tools/maps/nacht_apply_source_exterior_visual_lod.gd "$GODOT_PROJECT/nacht_apply_source_exterior_visual_lod.gd"
          cp tools/maps/nacht_apply_source_vista_actor_local_dds.gd "$GODOT_PROJECT/nacht_apply_source_vista_actor_local_dds.gd"
          cp tools/maps/nacht_apply_vista_spatial_multimesh_research.gd "$GODOT_PROJECT/nacht_apply_vista_spatial_multimesh_research.gd"
          cp tools/maps/nacht_real_vista_360_candidate_view_sweep.gd "$GODOT_PROJECT/nacht_real_vista_360_candidate_view_sweep.gd"
          cp "$SOURCE_MATERIAL" "$GODOT_PROJECT/nacht-actor-material-authority.json"
          cp "$SOURCE_POLICY" "$GODOT_PROJECT/nacht-exterior-visual-policy.json"
          cp "$SOURCE_VISTA" "$GODOT_PROJECT/nacht-authored-vista-actor-policy.json"
          cp "$ORIGINAL_ENV" "$GODOT_PROJECT/nacht-authority/nacht-environment-runtime-authority.json"
          python3 tools/maps/stage_nacht_all_used_source_dds.py \
            --stage "$STAGE" --dds "$DDS" --project "$GODOT_PROJECT" \
            --output build/nacht-renderer-ab/stage-source-DDS-audit.json \
            2>&1 | tee build/nacht-renderer-ab/stage-DDS.log
          python3 tools/maps/compile_nacht_source_lights_for_meridian.py \
            --environment "$UE_ENV" --source-lights "$UE_LIGHT" \
            --output "$GODOT_PROJECT/nacht-authority/xzen-report.json" \
            --report build/nacht-renderer-ab/native-lights-audit.json \
            2>&1 | tee build/nacht-renderer-ab/stage-lights.log
          grep -q XZOGOT_NACHT_ALL_USED_UE421_SOURCE_DDS_STAGE_GREEN build/nacht-renderer-ab/stage-DDS.log
          grep -q XZOGOT_NACHT_166_SOURCE_UE_LIGHTS_EXACT_AUTHORITY_ADAPTER_GREEN build/nacht-renderer-ab/stage-lights.log
      - name: Install real Mesa Compatibility GL renderer under Xvfb; software GPU is NOT actual Android
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb unzip libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers
          mkdir -p "$RUNNER_TEMP/godot"
          curl --fail -L --retry 3 \
            -o "$RUNNER_TEMP/godot/godot.zip" \
            https://github.com/godotengine/godot-builds/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip
          unzip -q "$RUNNER_TEMP/godot/godot.zip" -d "$RUNNER_TEMP/godot"
          GODOT="$RUNNER_TEMP/godot/Godot_v4.6.1-stable_linux.x86_64"
          chmod +x "$GODOT"
          echo "GODOT=$GODOT" >> "$GITHUB_ENV"
      - name: Import complete real native source geometry DDS
        shell: bash
        run: |
          set -euo pipefail
          timeout 600 "$GODOT" --headless --editor --path "$GODOT_PROJECT" --quit \
            2>&1 | tee build/nacht-renderer-ab/import.log
          if grep -E "SCRIPT ERROR|Parse Error|ERROR: Failed to load" build/nacht-renderer-ab/import.log; then exit 1; fi
      - name: Original source 16 candidate 360 yaw views, 32 before-after PNGs and driver GPU counters
        shell: bash
        run: |
          set -euo pipefail
          timeout 2700 xvfb-run -a -s "-screen 0 960x540x24" \
            "$GODOT" --path "$GODOT_PROJECT" --rendering-method gl_compatibility \
            --resolution 960x540 \
            --script res://nacht_real_vista_360_candidate_view_sweep.gd \
            2>&1 | tee build/nacht-renderer-ab/original-vista-360-yaw-visual-sweep.log
          REPORT="$GODOT_PROJECT/nacht-original-vista-360-candidate-visual-sweep.json"
          if test -f "$REPORT"; then cp "$REPORT" build/nacht-renderer-ab/nacht-original-vista-360-candidate-visual-sweep.json; fi
          grep -q XZOGOT_NACHT_REAL_SOURCE_VISTA_16_CANDIDATE_YAWS_32_PIXELS_GREEN \
            build/nacht-renderer-ab/original-vista-360-yaw-visual-sweep.log
          test -s "$REPORT"
          python3 - <<'PY'
          import json,glob,os
          d=json.load(open("build/nacht-renderer-ab/nacht-original-vista-360-candidate-visual-sweep.json"))
          assert d["fullOriginalActors"]==10793
          assert d["originalSourceMaterialBindings"]==16595
          assert d["sourceLightsReconstructed"]==166
          assert d["originalVistaTreeIds"]==340
          assert d["originalActorsRetained"]==10793
          assert d["sourceMultiMeshGroups"]==90
          assert d["originalActorsTemporarilyHidden"]==282
          assert d["sampledCandidateEyeHeightPositions"]==4
          assert d["cardinal360DegreesHeadingsPerSample"]==4
          assert d["pairedBeforeAfterScreenshots"]==32
          assert len(d["individualPairReports"])==16
          assert d["viewsWithAtLeast500NonDarkSourcePixels"]>=12
          assert all(r["resolution"]==[960,540] for r in d["individualPairReports"])
          assert all(r["meanRGBDifferencePercent"]<=0.25 for r in d["individualPairReports"])
          assert all(r["changedPixelsOverRGB3PercentPercent"]<=1.0 for r in d["individualPairReports"])
          assert not d["productionShipApproved"]
          assert d["originalWorld3DNavigationAndWindowsNotCertified"]
          assert not d["realPhysicalAndroidGPUFPSOrMemoryMeasured"]
          assert not d["errors"]
          shots=glob.glob(os.path.join(os.environ["GODOT_PROJECT"],"*_spatial32m.png"))
          assert len(shots)==32,len(shots)
          print("XZOGOT_NACHT_REAL_FULL_SOURCE_16_CANDIDATE_DIRECTIONS_32_PNG_A_B_GREEN")
          PY
      - name: Preserve native 32 original source before/after renders even if RED
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nacht-10793-Source-16-Candidate-EyeHeight-Yaw-Directions-32-Original-Godot-PNGs
          path: |
            build/nacht-renderer-ab/glb/new-godot/*_spatial32m.png
            build/nacht-renderer-ab/nacht-original-vista-360-candidate-visual-sweep.json
            build/nacht-renderer-ab/original-vista-360-yaw-visual-sweep.log
            build/nacht-renderer-ab/import.log
            build/nacht-renderer-ab/stage-DDS.log
            build/nacht-renderer-ab/stage-lights.log
          retention-days: 14
          if-no-files-found: warn
