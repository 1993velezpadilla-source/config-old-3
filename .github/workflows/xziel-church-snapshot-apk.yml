name: XZIEL Church Snapshot APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/xziel-map-builder-agent-v1
    paths:
      - ".github/workflows/xziel-church-snapshot-apk.yml"
      - "tools/church_map/bake_hero_blend_for_xzsm.py"
      - "tools/church_map/export_vril_static_mesh.py"

permissions:
  contents: read
  actions: read

concurrency:
  group: xziel-church-snapshot-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-snapshot-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: Install host packages
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq git-lfs curl xz-utils xvfb unzip bzip2 build-essential cmake ninja-build pkg-config python3-venv libx11-6 libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libglu1-mesa libegl1
          git lfs install

      - name: Download exact packed Hero #33 Blender authority
        uses: actions/download-artifact@v5
        with:
          name: XZIEL-Sanctum-Hero-Altar
          path: snapshot/hero
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37006309792

      - name: Verify packed Hero Blender authority
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p snapshot/out
          test -s snapshot/hero/sanctum-hero-altar.blend
          test -s snapshot/hero/01-hero-altar-from-nave.png
          test "$(stat -c%s snapshot/hero/sanctum-hero-altar.blend)" -gt 50000000
          echo "PACKED_HERO33_BLEND_GREEN $(stat -c%s snapshot/hero/sanctum-hero-altar.blend)"

      - name: Install Blender 5.2.2
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 6 --retry-all-errors --retry-delay 2 https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz -o /tmp/blender.tar.xz
          tar -C /tmp -xf /tmp/blender.tar.xz

      - name: Bake exact procedural materials for Android
        shell: bash
        env:
          XZIEL_HERO_BLEND: ${{ github.workspace }}/snapshot/hero/sanctum-hero-altar.blend
          XZIEL_SNAPSHOT_OUT: snapshot/out
        run: |
          set -euo pipefail
          xvfb-run -a -s "-screen 0 1600x1000x24" /tmp/blender-5.2.2-linux-x64/blender -b \
            --python tools/church_map/bake_hero_blend_for_xzsm.py \
            2>&1 | tee snapshot/out/material-bake.log
          grep -q XZIEL_EXACT_HERO_MATERIAL_BAKE_PASS snapshot/out/material-bake.log
          test -s snapshot/out/hero31_android_baked.blend

      - name: Export full XZSM with exact baked materials
        shell: bash
        env:
          CHURCH_GAMEPLAY_BLEND: ${{ github.workspace }}/snapshot/out/hero31_android_baked.blend
          CHURCH_PLAN: ${{ github.workspace }}/snapshot/out/snapshot_plan.json
          CHURCH_OUT: ${{ github.workspace }}/snapshot/out
          XZIEL_STATIC_TARGET_TRIS: "99999999"
          XZIEL_STATIC_TEXTURE_MAX: "4096"
          XZIEL_SCAN_TINY_MAX_FACES: "0"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          xvfb-run -a -s "-screen 0 1600x1000x24" /tmp/blender-5.2.2-linux-x64/blender -b \
            --python tools/church_map/export_vril_static_mesh.py \
            2>&1 | tee snapshot/out/xzsm-export.log
          grep -q XZSM_EXPORT_OK snapshot/out/xzsm-export.log
          python3 - <<'PY'
          import json
          d=json.load(open("snapshot/out/vril_static_mesh_report.json"))
          assert d["decimateRatio"]==1.0,d
          assert d["fallbackMaterials"]==[],d
          assert d["churchFallbackMaterials"]==[],d
          assert d["runtimeTriangles"]>100000,d
          assert d["runtimeTextureNameMode"]=="short_qpath_safe_ids",d
          assert d["uniqueTextureCount"]<=d["textureCount"],d
          assert all(len(x["path"]) < 48 for x in d["textures"].values()), d
          print("EXACT_TEXTURE_XZSM_GREEN",{
              "tris":d["runtimeTriangles"],
              "materials":d["textureCount"],
              "uniqueTextures":d["uniqueTextureCount"],
              "deduped":d["deduplicatedTextureCount"],
              "modelBytes":d["modelBytes"],
          })
          PY

      - name: Generate and compile walkable harness
        shell: bash
        env:
          CHURCH_PACKAGE: ${{ github.workspace }}/snapshot/out/package
          CHURCH_PLAN: ${{ github.workspace }}/snapshot/out/snapshot_plan.json
          CHURCH_FITTED: ${{ github.workspace }}/snapshot/out/fitted.json
          NZP_MAP_OUT: ${{ github.workspace }}/snapshot/out/nzp_harness/sanctum_harness.map
        run: |
          set -euo pipefail
          python3 tools/church_map/export_nzp_harness.py
          rm -rf /tmp/nzp-assets /tmp/spawn-zone-tool
          git clone --depth 1 https://github.com/nzp-team/assets.git /tmp/nzp-assets
          git clone --depth 1 --recursive https://github.com/nzp-team/spawn-zone-tool.git /tmp/spawn-zone-tool
          python3 -m pip install --quiet -r /tmp/spawn-zone-tool/requirements.txt
          (
            cd /tmp/nzp-assets
            bash tools/compile-wads.sh
            mkdir -p source/maps/sanctum_harness
            cp "$GITHUB_WORKSPACE/snapshot/out/nzp_harness/sanctum_harness.map" source/maps/sanctum_harness/sanctum_harness.map
            bash tools/compile-maps.sh --map sanctum_harness --zone-tool-path /tmp/spawn-zone-tool
          )
          cp /tmp/nzp-assets/common/maps/sanctum_harness.bsp snapshot/out/nzp_harness/
          cp /tmp/nzp-assets/common/maps/sanctum_harness.nsz snapshot/out/nzp_harness/

      - name: Enable infinite pistol
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("scripts/patch_vril_weaponhud.py")
          s=p.read_text()
          old='cvar_t xziel_mobile_unlimited_pistol = {"xziel_mobile_unlimited_pistol", "0", true};'
          new='cvar_t xziel_mobile_unlimited_pistol = {"xziel_mobile_unlimited_pistol", "1", true};'
          if old not in s: raise SystemExit("unlimited pistol anchor missing")
          p.write_text(s.replace(old,new,1))
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK NDK and emulator
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "emulator" "system-images;android-35;google_apis;x86_64"

      - name: Prepare one-tap Android snapshot
        shell: bash
        env:
          XZIEL_EXTRA_MAP_NAME: sanctum_harness
          XZIEL_EXTRA_MAP_BSP: ${{ github.workspace }}/snapshot/out/nzp_harness/sanctum_harness.bsp
          XZIEL_EXTRA_MAP_NSZ: ${{ github.workspace }}/snapshot/out/nzp_harness/sanctum_harness.nsz
          XZIEL_EXTRA_ASSET_DIR: ${{ github.workspace }}/snapshot/out/vril_static
        run: |
          set -euo pipefail
          bash scripts/prepare_android.sh
          python3 - <<'PY'
          from pathlib import Path
          import re
          activity=Path("build/android-project/app/src/main/java/org/libsdl/app/NZPActivity.java")
          s=activity.read_text()
          pat=re.compile(r'(return\s+new\s+String\[\]\s*\{\s*"-basedir"\s*,\s*dataRoot\.getAbsolutePath\(\)\s*)(\};)',re.MULTILINE)
          s,n=pat.subn(r'\1,\n            "+map", "sanctum_harness"\n        \2',s,count=1)
          if n!=1: raise SystemExit("launch patch failed")
          activity.write_text(s)
          gradle=Path("build/android-project/app/build.gradle")
          g=gradle.read_text()
          g=re.sub(r'applicationId\s+"[^"]+"','applicationId "com.xziel.churchsnapshot"',g,count=1)
          g=re.sub(r'versionName\s+"[^"]+"','versionName "0.2-exact-materials"',g,count=1)
          gradle.write_text(g)
          strings=Path("build/android-project/app/src/main/res/values/strings.xml")
          x=strings.read_text()
          x=re.sub(r'<string name="app_name">.*?</string>','<string name="app_name">XZIEL Church Snapshot</string>',x)
          strings.write_text(x)
          PY

      - name: Build APK
        working-directory: build/android-project
        run: ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p snapshot-dist
          cp build/android-project/app/build/outputs/apk/debug/app-debug.apk snapshot-dist/XZIEL-Church-ExactTextures-InfinitePistol-debug.apk
          cp snapshot/hero/01-hero-altar-from-nave.png snapshot-dist/blender-reference.png
          cp snapshot/out/exact-material-bake-report.json snapshot-dist/
          cp snapshot/out/vril_static_mesh_report.json snapshot-dist/

      - name: Android visual smoke
        id: smoke
        continue-on-error: true
        shell: bash
        env:
          ANDROID_AVD_HOME: ${{ runner.temp }}/xziel-church-snapshot-avd
        run: |
          set -euo pipefail
          ADB="${ANDROID_HOME}/platform-tools/adb"
          EMULATOR="${ANDROID_HOME}/emulator/emulator"
          AVDMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name avdmanager | sort | tail -n 1)"
          mkdir -p "$ANDROID_AVD_HOME"
          printf 'no\n' | "$AVDMANAGER" create avd --force --name xziel-church-snapshot-ci --package "system-images;android-35;google_apis;x86_64" --device "pixel_6"
          [[ ! -e /dev/kvm ]] || sudo chmod 666 /dev/kvm || true
          nohup "$EMULATOR" @xziel-church-snapshot-ci -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -memory 3072 > snapshot-dist/emulator-stdout.txt 2>&1 &
          timeout 120 "$ADB" wait-for-device
          for i in $(seq 1 60); do
            [[ "$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]] && break
            sleep 2
          done
          "$ADB" install -r snapshot-dist/XZIEL-Church-ExactTextures-InfinitePistol-debug.apk
          "$ADB" shell settings put secure immersive_mode_confirmations confirmed || true
          "$ADB" shell am force-stop com.xziel.churchsnapshot || true
          "$ADB" shell am start -W -n com.xziel.churchsnapshot/org.libsdl.app.NZPActivity >/dev/null 2>&1 || true
          for i in $(seq 1 50); do
            STAGE="$("$ADB" shell run-as com.xziel.churchsnapshot cat files/nzp-runtime/.xziel-stage 2>/dev/null | tr -d '\r' || true)"
            [[ "$STAGE" == "FIRST_FRAME_OK" ]] && break
            sleep 1
          done
          sleep 10
          "$ADB" exec-out screencap -p > snapshot-dist/church-exact-textures.png
          PID="$("$ADB" shell pidof com.xziel.churchsnapshot | tr -d '\r' || true)"
          STAGE="$("$ADB" shell run-as com.xziel.churchsnapshot cat files/nzp-runtime/.xziel-stage 2>/dev/null | tr -d '\r' || true)"
          test -n "$PID"
          test "$STAGE" = "FIRST_FRAME_OK"
          python3 -m pip install --quiet pillow==11.3.0
          python3 - <<'PY' | tee snapshot-dist/visual-gate.txt
          from PIL import Image,ImageStat
          im=Image.open("snapshot-dist/church-exact-textures.png").convert("RGB")
          st=ImageStat.Stat(im.convert("L"))
          px=list(im.getdata())
          pure=sum(1 for r,g,b in px if r>248 and g>248 and b>248)/len(px)
          near=sum(1 for r,g,b in px if min(r,g,b)>235)/len(px)
          print("size",im.size,"std",round(st.stddev[0],3),"pure_white",round(pure,5),"near_white",round(near,5))
          if st.stddev[0]<18: raise SystemExit("flat frame")
          if pure>0.05 or near>0.07: raise SystemExit("white material regression")
          PY

      - name: Upload exact-texture APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XZIEL-Church-ExactTextures-InfinitePistol
          path: snapshot-dist/
          if-no-files-found: error
          retention-days: 14

      - name: Fail if smoke failed
        if: steps.smoke.outcome == 'failure'
        run: exit 1
