name: Convert Nuketown Benchmark Meshes to Native GLB

on:
  workflow_dispatch:
  push:
    branches:
      - feature/godot-aaa-rebuild-v1
    paths:
      - "tools/maps/xzms_to_glb.py"
      - ".github/workflows/xogot-convert-nuketown-native-glb.yml"

permissions:
  contents: write

concurrency:
  group: xogot-convert-nuketown-native-glb
  cancel-in-progress: true

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/godot-aaa-rebuild-v1
          fetch-depth: 0

      - name: Convert all 52 resolved XZMS meshes to GLB
        shell: bash
        run: |
          set -euo pipefail
          src=xogot/assets/benchmarks/nuketown_xziel/vfs/xziel/maps/xziel_nuketown_zombies/meshes
          dst=xogot/assets/benchmarks/nuketown_xziel/vfs/xziel/maps/xziel_nuketown_zombies/meshes_glb
          test -d "$src"
          rm -rf "$dst"
          mkdir -p "$dst"
          python3 tools/maps/xzms_to_glb.py "$src" "$dst"             --report xogot/assets/benchmarks/nuketown_xziel/native-glb-report.json             | tee /tmp/nuketown-glb.log

          grep -q "XZOGOT_XZMS_GLB_GREEN" /tmp/nuketown-glb.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("xogot/assets/benchmarks/nuketown_xziel/native-glb-report.json")
          d=json.loads(p.read_text())
          assert d["mesh_count"] == 52, d
          assert d["vertices"] == 671012, d
          assert d["indices"] == 859353, d
          assert d["submeshes"] == 563, d
          files=sorted(Path("xogot/assets/benchmarks/nuketown_xziel/vfs/xziel/maps/xziel_nuketown_zombies/meshes_glb").glob("*.glb"))
          assert len(files)==52, len(files)
          assert all(x.stat().st_size > 100 for x in files)
          print("XZOGOT_NUKETOWN_NATIVE_GLB_VALIDATE_GREEN",len(files))
          PY

      - name: Mark native mesh runtime authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("xogot/assets/benchmarks/nuketown_xziel/source_manifest.json")
          d=json.loads(p.read_text())
          d["runtime_mesh_format"]="GLB"
          d["runtime_mesh_directory"]="vfs/xziel/maps/xziel_nuketown_zombies/meshes_glb"
          d["runtime_mesh_conversion"]="lossless XZMS vertex/index/submesh bridge"
          d["source_xzms_authority"]={
            "source_run":36613010234,
            "source_artifact":"XZIEL-Nuketown-Zombies-Virgin-Package-Census",
            "staged_directory":"vfs/xziel/maps/xziel_nuketown_zombies/meshes",
          }
          p.write_text(json.dumps(d,indent=2)+"\n")
          print("XZOGOT_NUKETOWN_NATIVE_GLB_MANIFEST_GREEN")
          PY

      - name: Commit native benchmark meshes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             xogot/assets/benchmarks/nuketown_xziel/native-glb-report.json             xogot/assets/benchmarks/nuketown_xziel/source_manifest.json             xogot/assets/benchmarks/nuketown_xziel/vfs/xziel/maps/xziel_nuketown_zombies/meshes_glb
          if git diff --cached --quiet; then
            echo "XZOGOT_NUKETOWN_NATIVE_GLB_ALREADY_GREEN"
            exit 0
          fi
          git commit -m "assets: add native Godot GLB benchmark meshes"
          git pull --rebase origin feature/godot-aaa-rebuild-v1
          git push origin HEAD:feature/godot-aaa-rebuild-v1
          echo "XZOGOT_NUKETOWN_NATIVE_GLB_COMMIT_GREEN"

      - name: Upload conversion proof
        uses: actions/upload-artifact@v4
        with:
          name: xogot-nuketown-native-glb-proof
          path: |
            xogot/assets/benchmarks/nuketown_xziel/native-glb-report.json
            xogot/assets/benchmarks/nuketown_xziel/source_manifest.json
          if-no-files-found: error
          retention-days: 14
