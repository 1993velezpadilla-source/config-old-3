name: Xogot Nacht Fast Exact Capture

on:
  push:
    branches:
      - feature/godot-aaa-rebuild-v1
    paths:
      - ".github/workflows/xogot-nacht-fast-exact-capture.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: xogot-nacht-fast-exact-capture
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: "37538136430"
      SOURCE_ARTIFACT: "Xogot-Nacht-Chronicles-Godot-Runtime"
      SOURCE_SHA: "7fac0271606c53cc51e11d4bbf46a43be9cb8c1d"

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1

      - name: Download exact GREEN staged runtime
        shell: bash
        run: |
          set -euo pipefail
          rm -rf fast-stage xogot/assets/benchmarks/nacht_chronicles
          mkdir -p fast-stage xogot/assets/benchmarks/nacht_chronicles
          gh run download "$SOURCE_RUN" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$SOURCE_ARTIFACT" \
            --dir fast-stage
          manifest=$(find fast-stage -type f -name source_manifest.json -print -quit)
          test -n "$manifest"
          artifact_root=$(dirname "$manifest")
          cp -a "$artifact_root/." xogot/assets/benchmarks/nacht_chronicles/
          test -s xogot/assets/benchmarks/nacht_chronicles/source_manifest.json
          echo "XZOGOT_NACHT_FAST_EXACT_STAGE_GREEN run=$SOURCE_RUN sha=$SOURCE_SHA"

      - name: Install Godot 4.6.1
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip curl xvfb libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers
          curl -L --fail --retry 5 --retry-all-errors --retry-delay 2 \
            https://github.com/godotengine/godot-builds/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip \
            -o /tmp/godot.zip
          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.6.1-stable_linux.x86_64

      - name: Import exact staged runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/nacht-fast-capture
          timeout 1200 /tmp/godot/Godot_v4.6.1-stable_linux.x86_64 \
            --headless --editor --path xogot --quit \
            2>&1 | tee build/nacht-fast-capture/import.log
          ! grep -E "SCRIPT ERROR|Parse Error|ERROR: Failed to load script|MAX_MESH_SURFACES" \
            build/nacht-fast-capture/import.log

      - name: Render exact staged world fast
        shell: bash
        run: |
          set -euo pipefail
          cp xogot/ci/nacht_full_map_capture.gd xogot/ci/nacht_fast_exact_capture.gd
          sed -i 's/for _i in range(12):/for _i in range(1):/' xogot/ci/nacht_fast_exact_capture.gd
          timeout 1200 xvfb-run -a -s "-screen 0 1280x720x24" \
            /tmp/godot/Godot_v4.6.1-stable_linux.x86_64 \
            --path xogot \
            --rendering-method gl_compatibility \
            --resolution 1280x720 \
            --script res://ci/nacht_fast_exact_capture.gd \
            2>&1 | tee build/nacht-fast-capture/render.log
          grep -q "XZOGOT_NACHT_CAPTURE_WORLD_GREEN" build/nacht-fast-capture/render.log
          grep -q "XZOGOT_NACHT_SPAWN_SCREENSHOT_GREEN" build/nacht-fast-capture/render.log
          grep -q "XZOGOT_NACHT_OVERVIEW_SCREENSHOT_GREEN" build/nacht-fast-capture/render.log
          test -s /tmp/xogot-nacht-spawn.png
          test -s /tmp/xogot-nacht-overview.png
          test "$(find /tmp -maxdepth 1 -type f -name 'xogot-nacht-spawn-candidate-*.png' | wc -l)" -eq 10
          cp /tmp/xogot-nacht-spawn.png build/nacht-fast-capture/
          cp /tmp/xogot-nacht-overview.png build/nacht-fast-capture/
          cp /tmp/xogot-nacht-spawn-candidate-*.png build/nacht-fast-capture/
          echo "XZOGOT_NACHT_FAST_EXACT_CAPTURE_GREEN"

      - name: Upload exact fast screenshots
        uses: actions/upload-artifact@v4
        with:
          name: Xogot-Nacht-Fast-Exact-Screenshots
          path: |
            build/nacht-fast-capture/xogot-nacht-spawn.png
            build/nacht-fast-capture/xogot-nacht-overview.png
            build/nacht-fast-capture/xogot-nacht-spawn-candidate-*.png
            build/nacht-fast-capture/render.log
          if-no-files-found: error
          retention-days: 7
