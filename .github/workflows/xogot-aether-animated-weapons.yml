name: Build Aether Animated Weapon GLBs

on:
  workflow_dispatch:
  push:
    branches:
      - feature/church-expansion-v1
    paths:
      - ".github/workflows/xogot-aether-animated-weapons.yml"
      - "tools/weapons/build_aether_animated_glbs.py"

permissions:
  actions: read
  contents: write

concurrency:
  group: xogot-aether-animated-weapons
  cancel-in-progress: true

jobs:
  animate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: "37244741312"
    steps:
      - name: Checkout gameplay branch
        uses: actions/checkout@v5
        with:
          ref: feature/church-expansion-v1
          fetch-depth: 0

      - name: Wait for mapped material plus PSA export
        shell: bash
        run: |
          set -euo pipefail
          gh run watch "$SOURCE_RUN_ID" --exit-status

      - name: Download mapped Aether weapon artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf aether-artifact
          mkdir -p aether-artifact
          gh run download "$SOURCE_RUN_ID" -n aether-waw-usmap-real-weapons -D aether-artifact
          test -d aether-artifact/recovered-export
          test -d aether-artifact/recovered-actorx
          find aether-artifact/recovered-export -type f -name '*.glb' | wc -l
          find aether-artifact/recovered-actorx -type f -name '*.psa' | wc -l
          echo "XZOGOT_ANIMATION_SOURCE_ARTIFACT_READY"

      - name: Install Blender version used by upstream importer CI
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check blender-downloader
          BLENDER_PATH=$(blender-downloader 5.0 --extract --remove-compressed --print-blender-executable)
          test -x "$BLENDER_PATH"
          "$BLENDER_PATH" --version | head -n 2
          echo "BLENDER=$BLENDER_PATH" >> "$GITHUB_ENV"
          echo "XZOGOT_BLENDER_UPSTREAM_COMPAT_READY 5.0"

      - name: Install maintained Unreal PSK PSA Blender importer
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/io_scene_psk_psa" "$RUNNER_TEMP/psk_psa_py_installed"
          git clone --depth 1 https://github.com/DarklightGames/io_scene_psk_psa.git "$RUNNER_TEMP/io_scene_psk_psa"
          test -f "$RUNNER_TEMP/io_scene_psk_psa/io_scene_psk_psa/__init__.py"
          WHEEL=$(find "$RUNNER_TEMP/io_scene_psk_psa/io_scene_psk_psa/wheels" -maxdepth 1 -type f -name 'psk_psa_py-*.whl' | sort | tail -n 1)
          test -n "$WHEEL"
          mkdir -p "$RUNNER_TEMP/psk_psa_py_installed"
          python3 -m pip install --no-deps --disable-pip-version-check --target "$RUNNER_TEMP/psk_psa_py_installed" "$WHEEL"
          test -f "$RUNNER_TEMP/psk_psa_py_installed/psk_psa_py/__init__.py"
          echo "PSK_PSA_PY_TARGET=$RUNNER_TEMP/psk_psa_py_installed" >> "$GITHUB_ENV"
          echo "XZOGOT_PSK_PSA_IMPORTER_READY"

      - name: Merge real skeleton meshes with real PSA animation actions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf animated-output
          mkdir -p animated-output
          "$BLENDER" --background --factory-startup             --python tools/weapons/build_aether_animated_glbs.py             -- "$PWD/aether-artifact" "$RUNNER_TEMP/io_scene_psk_psa" "$PSK_PSA_PY_TARGET" "$PWD/animated-output"             2>&1 | tee animated-weapons-blender.log
          grep -q "XZOGOT_28_ANIMATED_FIREARMS_1_THROWABLE_GREEN" animated-weapons-blender.log
          test -s animated-output/animated-inventory.json

      - name: Validate animated GLB payloads
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,struct
          inv=json.loads(Path("animated-output/animated-inventory.json").read_text())
          assert inv["weapon_count"]==29,inv["weapon_count"]
          assert inv["animated_weapon_count"]==28,inv["animated_weapon_count"]
          assert inv["throwable_count"]==1,inv["throwable_count"]
          total_anims=0
          for rec in inv["weapons"]:
              p=Path(rec["output"])
              b=p.read_bytes()
              assert b[:4]==b"glTF",(rec["runtime_id"],b[:4])
              n,t=struct.unpack_from("<II",b,12)
              doc=json.loads(b[20:20+n].rstrip(b" \t\r\n\0"))
              meshes=len(doc.get("meshes",[]))
              skins=len(doc.get("skins",[]))
              anims=len(doc.get("animations",[]))
              assert meshes>=1,(rec["runtime_id"],meshes)
              assert skins>=1,(rec["runtime_id"],skins)
              if rec["animation_mode"]=="embedded_psa_actions":
                  assert anims>=1,(rec["runtime_id"],anims)
                  total_anims += anims
              else:
                  assert rec["runtime_id"]=="stielhand",rec
                  assert anims==0,(rec["runtime_id"],anims)
          assert total_anims>=50,total_anims
          print("XZOGOT_ANIMATED_GLB_VALIDATION_GREEN",inv["animated_weapon_count"],inv["throwable_count"],total_anims)
          PY

      - name: Replace staged viewmodels with animated real GLBs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,shutil
          inv=json.loads(Path("animated-output/animated-inventory.json").read_text())
          root=Path("xogot/assets/weapons/aether_waw_real")
          for rec in inv["weapons"]:
              wid=rec["runtime_id"]
              src=Path(rec["output"])
              dst=root/wid/"viewmodel.glb"
              dst.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(src,dst)
              print("XZOGOT_ANIMATED_VIEWMODEL_STAGED",wid,src.stat().st_size)
          shutil.copy2("animated-output/animated-inventory.json",root/"animated-inventory.json")
          PY

      - name: Mark animation-backed manifest records
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          inv=json.loads(Path("xogot/assets/weapons/aether_waw_real/animated-inventory.json").read_text())
          p=Path("xogot/assets/weapons/mapmod_weapon_asset_manifest.json")
          d=json.loads(p.read_text())
          known=d["weapons"]
          updated=[]
          for rec in inv["weapons"]:
              wid=rec["runtime_id"]
              if wid not in known:
                  continue
              notes=known[wid].setdefault("notes",[])
              marker=f"Aether UE5.7 skeletal GLB now contains {rec['animations']} imported real animation Actions."
              notes=[n for n in notes if not str(n).startswith("Aether UE5.7 skeletal GLB now contains ")]
              notes.append(marker)
              known[wid]["notes"]=notes
              if known[wid].get("status")=="MISSING":
                  known[wid]["status"]="PARTIAL"
              updated.append(wid)
          p.write_text(json.dumps(d,indent=2)+"\n")
          print("XZOGOT_ANIMATION_MANIFEST_UPDATED",len(updated),sorted(updated))
          PY

      - name: Commit animated real weapon viewmodels
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add xogot/assets/weapons/aether_waw_real xogot/assets/weapons/mapmod_weapon_asset_manifest.json
          if git diff --cached --quiet; then
            echo "XZOGOT_ANIMATED_WEAPONS_ALREADY_PRESENT"
            exit 0
          fi
          git commit -m "Integrate animated real Aether WaW weapon viewmodels"
          git pull --rebase origin feature/church-expansion-v1
          git push origin HEAD:feature/church-expansion-v1
          echo "XZOGOT_ANIMATED_WEAPON_COMMIT_GREEN"

      - name: Upload animation integration proof
        uses: actions/upload-artifact@v4
        with:
          name: xogot-aether-animated-weapon-proof
          path: |
            animated-output/animated-inventory.json
            animated-weapons-blender.log
          if-no-files-found: error
          retention-days: 14
