name: Discover Aether MG42 Fire Audio

on:
  workflow_dispatch:
  push:
    branches:
      - feature/church-expansion-v1
    paths:
      - ".github/workflows/xogot-aether-mg42-audio-discovery.yml"

permissions:
  contents: read

concurrency:
  group: xogot-aether-mg42-audio-discovery
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Download Project Aether
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aether-download"
          npx --yes itchio-downloader             --url "https://verrial.itch.io/projectaether"             --downloadDirectory "$RUNNER_TEMP/aether-download"
          FILE=$(find "$RUNNER_TEMP/aether-download" -type f -name '*.zip' -printf '%s	%p
' | sort -nr | head -1 | cut -f2-)
          test -s "$FILE"
          echo "PAYLOAD=$FILE" >> "$GITHUB_ENV"

      - name: Build searchable legacy package index
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aether-paks"
          7z x -y "$PAYLOAD" 'ProjectAether/Content/Paks/*' -o"$RUNNER_TEMP/aether-paks" >/dev/null
          PAKDIR="$RUNNER_TEMP/aether-paks/ProjectAether/Content/Paks"

          curl -fL --retry 5             https://github.com/trumank/retoc/releases/download/v0.1.5/retoc_cli-x86_64-unknown-linux-gnu.tar.xz             -o "$RUNNER_TEMP/retoc.tar.xz"
          mkdir -p "$RUNNER_TEMP/retoc"
          tar -xJf "$RUNNER_TEMP/retoc.tar.xz" -C "$RUNNER_TEMP/retoc"
          RETOC=$(find "$RUNNER_TEMP/retoc" -type f -name 'retoc*' -perm -111 | head -1)

          curl -fL --retry 5             https://github.com/trumank/repak/releases/download/v0.2.3/repak_cli-x86_64-unknown-linux-gnu.tar.xz             -o "$RUNNER_TEMP/repak.tar.xz"
          mkdir -p "$RUNNER_TEMP/repak"
          tar -xJf "$RUNNER_TEMP/repak.tar.xz" -C "$RUNNER_TEMP/repak"
          REPAK=$(find "$RUNNER_TEMP/repak" -type f -name 'repak*' -perm -111 | head -1)

          test -x "$RETOC" && test -x "$REPAK"
          "$RETOC" to-legacy "$PAKDIR" "$RUNNER_TEMP/aether-legacy.pak"
          "$REPAK" list "$RUNNER_TEMP/aether-legacy.pak" > aether-all-files.txt
          echo "REPAK=$REPAK" >> "$GITHUB_ENV"

      - name: Search every sound path for MG42 candidates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re

          rows=[]
          for raw in Path("aether-all-files.txt").read_text(errors="ignore").splitlines():
              line=raw.strip().replace("\\","/")
              low=line.lower()
              if "projectaether/content/assets/sounds/" not in low:
                  continue
              name=Path(line).name.lower()
              score=0
              if "mg42" in low:
                  score+=200
              if re.search(r"(?:^|[_/])mg[_-]?42(?:[_./]|$)",low):
                  score+=140
              if "fire" in low:
                  score+=60
              if re.search(r"(?:^|_)st_f(?:_|\.|$)",name):
                  score+=70
              if re.search(r"(?:^|_)f(?:_|\.|$)",name):
                  score+=25
              if any(x in low for x in ("charge","mag_in","mag_out","pull","reload","mech","jimmy")):
                  score-=80
              if any(x in low for x in ("tail","dist","distant")):
                  score-=25
              if score>0:
                  rows.append({"score":score,"path":line})
          rows.sort(key=lambda r:(-r["score"],r["path"].lower()))
          out={"candidate_count":len(rows),"candidates":rows}
          Path("mg42-audio-candidates.json").write_text(json.dumps(out,indent=2)+"\n")
          print("XZOGOT_MG42_AUDIO_CANDIDATES",len(rows))
          for row in rows[:80]:
              print("XZOGOT_MG42_AUDIO_CANDIDATE",row["score"],row["path"])
          if not rows:
              print("XZOGOT_MG42_AUDIO_NOT_FOUND_ANYWHERE")
          PY

      - name: Extract discovered MG42 sound payloads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mg42-raw
          python3 - <<'PY' > "$RUNNER_TEMP/mg42-includes.txt"
          import json
          from pathlib import Path
          d=json.loads(Path("mg42-audio-candidates.json").read_text())
          stems=set()
          for row in d["candidates"]:
              p=Path(row["path"])
              if p.suffix.lower() not in (".uasset",".uexp",".ubulk"):
                  continue
              stem=p.with_suffix("").as_posix()
              stems.add(stem)
          for stem in sorted(stems):
              print(stem+".*")
          PY
          if [ -s "$RUNNER_TEMP/mg42-includes.txt" ]; then
            args=()
            while IFS= read -r pat; do
              [ -n "$pat" ] && args+=(-i "$pat")
            done < "$RUNNER_TEMP/mg42-includes.txt"
            "$REPAK" unpack "$RUNNER_TEMP/aether-legacy.pak" -o mg42-raw "${args[@]}" --force
          fi
          find mg42-raw -type f -printf '%p	%s
' | sort > mg42-raw-files.txt || true
          echo "XZOGOT_MG42_AUDIO_DISCOVERY_GREEN"

      - name: Upload MG42 discovery proof
        uses: actions/upload-artifact@v4
        with:
          name: aether-mg42-audio-discovery
          path: |
            mg42-audio-candidates.json
            mg42-raw-files.txt
            mg42-raw/**
          if-no-files-found: warn
          retention-days: 14
