name: Xogot Nacht Godot 4.6 Native TRIANGLES Parity (Research)

on:
  workflow_dispatch:
  push:
    branches:
      - research/nacht-bo3-meridian-source-bridge-20261009
    paths:
      - ".github/workflows/xogot-nacht-lossless-godot-triangle-parity.yml"
      - "tools/maps/count_nacht_gltf_runtime_triangles.py"

permissions:
  contents: read
  actions: read

jobs:
  actual-godot-triangle-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - name: Exact previous full native lossless source Godot import must be GREEN
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh run view 37938836028 --json conclusion --jq '.conclusion')" = success
      - name: Download previously proven 493 native GLB types and Godot research scene
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/nacht-godot-tris/artifact
          gh run download 37938836028 \
            -n Nacht-LOSSLESS-Native-493-GLB-10793-Actor-Godot-Research-Proof \
            -D build/nacht-godot-tris/artifact
          PROJECT=$(find build/nacht-godot-tris/artifact -name project.godot -type f -print -quit)
          GLB=$(find build/nacht-godot-tris/artifact -name Nacht_Source_Bridge_Probe.glb -type f -print -quit)
          test -s "$PROJECT" && test -s "$GLB"
          echo "GODOT_DIR=$(dirname "$PROJECT")" >> "$GITHUB_ENV"
          echo "EXACT_GLB=$PWD/$GLB" >> "$GITHUB_ENV"
          echo "XZOGOT_GODOT_REAL_LOSSLESS_REUSED_ARTIFACT_GREEN"
      - name: Independently count all GLB indexed source triangles actually reachable in 10793 actor scene
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/maps/count_nacht_gltf_runtime_triangles.py \
            --glb "$EXACT_GLB" \
            --output "$GODOT_DIR/expected-native-tris.json" \
            2>&1 | tee build/nacht-godot-tris/source-glb-triangle-count.log
          grep -q "XZOGOT_NACHT_RAW_LOSSLESS_TOTAL_TRIANGLE_BASELINE_GREEN" \
            build/nacht-godot-tris/source-glb-triangle-count.log
      - name: Godot 4.6.1 actually create surface arrays and count the ORIGINAL indexed triangles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          curl --fail -L --retry 3 -o "$RUNNER_TEMP/godot/godot.zip" \
            https://github.com/godotengine/godot-builds/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip
          unzip -q "$RUNNER_TEMP/godot/godot.zip" -d "$RUNNER_TEMP/godot"
          GODOT="$RUNNER_TEMP/godot/Godot_v4.6.1-stable_linux.x86_64"
          chmod +x "$GODOT"
          "$GODOT" --headless --path "$GODOT_DIR" --import \
            2>&1 | tee build/nacht-godot-tris/godot-import.log
          ! grep -E "SCRIPT ERROR|Parse Error|ERROR: Failed to load" \
            build/nacht-godot-tris/godot-import.log
          cat > "$GODOT_DIR"/count_real_triangles.gd <<'GDS'
          extends SceneTree

          func _initialize() -> void:
              call_deferred("_test")

          func _test() -> void:
              var expected_raw: String = FileAccess.get_file_as_string("res://expected-native-tris.json")
              var expected: Dictionary = JSON.parse_string(expected_raw)
              var packed: PackedScene = load("res://scenes/main.tscn") as PackedScene
              if packed == null:
                  push_error("XZOGOT_GODOT_NATIVE_TRIANGLES_SCENE_LOAD_RED")
                  quit(3)
                  return
              var root: Node = packed.instantiate()
              get_root().add_child(root)
              var nodes: Array[Node] = root.find_children("*", "MeshInstance3D", true, false)
              var triangles: int = 0
              for node in nodes:
                  var mesh: Mesh = (node as MeshInstance3D).mesh
                  if mesh == null:
                      push_error("XZOGOT_GODOT_EMPTY_MESH_RED")
                      quit(4)
                      return
                  for surface in range(mesh.get_surface_count()):
                      var count: int = mesh.surface_get_array_index_len(surface)
                      if count == 0:
                          count = mesh.surface_get_array_len(surface)
                      if count % 3 != 0:
                          push_error("XZOGOT_GODOT_NON_TRIANGLE_SURFACE_RED")
                          quit(5)
                          return
                      triangles += count / 3
              var target_meshes: int = int(expected["expected_reachable_mesh_instances"])
              var target_triangles: int = int(expected["expected_total_reachable_surface_triangles"])
              if nodes.size() != target_meshes or triangles != target_triangles:
                  push_error("XZOGOT_GODOT_NATIVE_TRIANGLE_LOSS_RED actual_meshes=" +
                      str(nodes.size()) + " expected_meshes=" + str(target_meshes) +
                      " actual_triangles=" + str(triangles) +
                      " expected_triangles=" + str(target_triangles))
                  quit(6)
                  return
              print("XZOGOT_NACHT_GODOT_ALL_NATIVE_SOURCE_TRIANGLES_GREEN",
                  " actors=10793 meshes=", nodes.size(), " triangles=", triangles)
              root.queue_free()
              quit(0)
          GDS
          "$GODOT" --headless --path "$GODOT_DIR" --script res://count_real_triangles.gd \
            2>&1 | tee build/nacht-godot-tris/real-godot-triangle-count.log
          grep -q XZOGOT_NACHT_GODOT_ALL_NATIVE_SOURCE_TRIANGLES_GREEN \
            build/nacht-godot-tris/real-godot-triangle-count.log
      - name: Preserve GREEN or RED runtime truth
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nacht-Godot46-Real-10793-Actors-All-Source-Triangle-Parity
          path: |
            build/nacht-godot-tris/source-glb-triangle-count.log
            build/nacht-godot-tris/godot-import.log
            build/nacht-godot-tris/real-godot-triangle-count.log
            build/nacht-godot-tris/artifact/expected-native-tris.json
          if-no-files-found: warn
          retention-days: 14
