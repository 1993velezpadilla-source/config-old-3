# diagnostic-window: 180s guest-process sampling
name: XZIEL Nacht Hybrid Android x86 ARM-Bridge Smoke
# xziel rootfs runtime path probe

# rootfs runtime-path probe
# bionic-pie glibc-compat rerun gate
# libc-shm symbol bridge gate

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/xziel-nacht-win64-exe-v1
    paths:
      - ".github/workflows/xziel-nacht-hybrid-android-x86bridge-smoke.yml"
      - "scripts/smoke_xziel_nacht_x86bridge_android.sh"
      - "scripts/build_box64_android_pie_for_x86bridge.sh"
      - "scripts/build_box64_glibc_pie_for_x86bridge.sh"

permissions:
  contents: read
  actions: read

jobs:
  smoke:
    name: x86_64 Google APIs ARM-translation smoke
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout XZIEL
        uses: actions/checkout@v5

      - name: Download final 12-skin touch gyro APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SOURCE_RUN="$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow "xziel-nacht-hybrid-touch-gyro-apk.yml" \
            --branch "experiment/xziel-nacht-win64-exe-v1" \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')"
          test -n "$SOURCE_RUN"
          echo "XZIEL_X86BRIDGE_SOURCE_APK_RUN=$SOURCE_RUN"
          mkdir -p input/hybrid-apk dist/android-x86bridge-smoke
          gh run download "$SOURCE_RUN" \
            --repo "${{ github.repository }}" \
            --name "XZIEL-Nacht-Hybrid-TouchGyro-PixelFold" \
            --dir input/hybrid-apk

          APK="$(find input/hybrid-apk -type f -name 'XZIEL-Nacht-Hybrid-TouchGyro-PixelFold-debug.apk' -print -quit)"
          test -n "$APK" && test -s "$APK"
          echo "XZIEL_APK=$APK" >> "$GITHUB_ENV"
          sha256sum "$APK" | tee dist/android-x86bridge-smoke/apk.sha256
          echo "XZIEL_X86BRIDGE_APK_READY"

      - name: Build Android Bionic PIE Box64 interpreter with glibc Wine shims
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/build_box64_android_pie_for_x86bridge.sh
          bash scripts/build_box64_android_pie_for_x86bridge.sh

      - name: Enable KVM
        shell: bash
        run: |
          set -euo pipefail
          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          fi

      - name: Android 11 x86_64 Google APIs with ARM translation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          disk-size: 14G
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: >-
            -no-window
            -no-snapshot
            -noaudio
            -no-boot-anim
            -gpu swiftshader
            -camera-back none
            -camera-front none
            -memory 4096
          script: |
            bash scripts/smoke_xziel_nacht_x86bridge_android.sh "$XZIEL_APK"

      - name: Upload x86 bridge smoke proof
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: XZIEL-Nacht-Hybrid-Android-x86Bridge-Smoke-Proof
          path: dist/android-x86bridge-smoke/
          if-no-files-found: warn
          retention-days: 14
