name: Sanctum Dressed Gothic Interior

on:
  push:
    branches:
      - feature/xziel-map-builder-agent-v1
    paths:
      - ".github/workflows/sanctum-dressed-gothic-interior.yml"
      - "tools/sanctum_v2/dress_sanctum_with_cc0_gothic.py"
      - "tools/sanctum_v2/compose_cathedral_cc0_interior.py"
      - "tools/sanctum_v2/map_builder_plan.json"
      - "tools/xziel_toolchain/bootstrap_asset_cli.sh"
      - "tools/xziel_toolchain/process_glb.sh"
      - "tools/xziel_toolchain/validate_glb.cjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sanctum-dressed-gothic-interior-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dress:
    name: Dress walkable nave with CC0 Gothic pieces
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout XZIEL
        uses: actions/checkout@v5

      - name: Install host packages
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            git-lfs curl xz-utils xvfb unzip bzip2 \
            libx11-6 libxi6 libxxf86vm1 libxfixes3 libxrender1 \
            libgl1 libglu1-mesa
          git lfs install

      - name: Fetch approved source assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf external-french-houses external-cc0-church external-ruins

          git clone --depth 1 \
            https://github.com/IRCSS/Blender-Geometry-Node-French-Houses.git \
            external-french-houses
          (cd external-french-houses && git lfs pull || true)
          test -s external-french-houses/LICENSE
          grep -q "MIT License" external-french-houses/LICENSE
          test -s external-french-houses/GeometryNodesFrenchHous.blend

          mkdir -p external-cc0-church
          curl -L --fail --retry 3 \
            https://opengameart.org/content/medieval-church-interior \
            -o external-cc0-church/source-page.html
          grep -qi "CC0" external-cc0-church/source-page.html
          grep -qi "fully explorable interior" external-cc0-church/source-page.html
          curl -L --fail --retry 3 \
            https://opengameart.org/sites/default/files/church.blend \
            -o external-cc0-church/church.blend
          test -s external-cc0-church/church.blend

          mkdir -p external-ruins
          curl -L --fail --retry 3 \
            https://opengameart.org/content/3td-fantasy-ruins-pack-for-blender \
            -o external-ruins/source-page.html
          grep -qi "CC0" external-ruins/source-page.html
          curl -L --fail --retry 3 \
            https://opengameart.org/sites/default/files/fantasy_ruins_pack_for_blender.blend \
            -o external-ruins/fantasy_ruins_pack_for_blender.blend
          test -s external-ruins/fantasy_ruins_pack_for_blender.blend

          {
            echo "OUTER_REV=$(git -C external-french-houses rev-parse HEAD)"
            echo "INNER_SHA256=$(sha256sum external-cc0-church/church.blend | cut -d' ' -f1)"
            echo "RUINS_SHA256=$(sha256sum external-ruins/fantasy_ruins_pack_for_blender.blend | cut -d' ' -f1)"
          } | tee /tmp/sanctum-dressed-sources.txt

      - name: Install Blender 5.2.2
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz \
            -o /tmp/blender-5.2.2-linux-x64.tar.xz
          tar -C /tmp -xf /tmp/blender-5.2.2-linux-x64.tar.xz
          /tmp/blender-5.2.2-linux-x64/blender --version

      - name: Build dressed Sanctum candidate
        shell: bash
        env:
          SANCTUM_COMPOSITE_OUT: sanctum-dressed-base
          SANCTUM_DRESS_OUT: sanctum-dressed-probe
          SANCTUM_CC0_BLEND: external-cc0-church/church.blend
          SANCTUM_RUINS_BLEND: external-ruins/fantasy_ruins_pack_for_blender.blend
          XZIEL_MAP_AGENT_PLAN: tools/sanctum_v2/map_builder_plan.json
        run: |
          set -euo pipefail
          mkdir -p sanctum-dressed-base sanctum-dressed-probe
          export SANCTUM_RUINS_SHA256="$(grep '^RUINS_SHA256=' /tmp/sanctum-dressed-sources.txt | cut -d= -f2)"

          xvfb-run -a -s "-screen 0 1600x1000x24" \
            /tmp/blender-5.2.2-linux-x64/blender \
            -b external-french-houses/GeometryNodesFrenchHous.blend \
            --python tools/sanctum_v2/dress_sanctum_with_cc0_gothic.py \
            2>&1 | tee sanctum-dressed-probe/blender-dressed.log

          grep -q "SANCTUM_DRESSED_INTERIOR_PASS" sanctum-dressed-probe/blender-dressed.log

      - name: Validate dressed evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          out=Path("sanctum-dressed-probe")
          d=json.loads((out/"dressed-report.json").read_text(encoding="utf-8"))

          assert d["status"]=="PASS", d
          assert d["outer_license"]=="MIT", d
          assert d["interior_license"]=="CC0", d
          assert d["dressing_license"]=="CC0", d
          assert len(d["instances"]) >= 13, d
          assert d["walkability_retention_ratio"] >= 0.88, d
          assert d["stats"]["vertices"] > 200000, d
          assert d["stats"]["polygons"] > 150000, d
          assert len(d["renders"]) == 6, d
          assert d["glb_bytes"] > 1000000, d
          assert len(d["dressing_source_sha256"]) == 64, d

          for item in d["renders"]:
              p=out/item["name"]
              assert p.is_file() and p.stat().st_size > 3000, p

          print("SANCTUM_DRESSED_EVIDENCE_GREEN")
          print("INSTANCES", len(d["instances"]))
          print("BASELINE_CLEARANCE_RATIO", d["baseline_clearance"]["walkable_ratio"])
          print("DRESSED_CLEARANCE_RATIO", d["walkability"]["walkable_ratio"])
          print("WALKABILITY_RETENTION_RATIO", d["walkability_retention_ratio"])
          print("VERTICES", d["stats"]["vertices"])
          print("POLYGONS", d["stats"]["polygons"])
          print("GLB_BYTES", d["glb_bytes"])
          PY

      - name: Optimize inspect and validate dressed GLB
        shell: bash
        env:
          XZIEL_KTX2_UASTC: "1"
        run: |
          set -euo pipefail
          bash tools/xziel_toolchain/bootstrap_asset_cli.sh
          RAW_GLB="$(python3 - <<'PY'
          import json
          print(json.load(open("sanctum-dressed-probe/dressed-report.json",encoding="utf-8"))["glb"])
          PY
          )"
          bash tools/xziel_toolchain/process_glb.sh             "sanctum-dressed-probe/$RAW_GLB"             "sanctum-dressed-probe/asset-pipeline"             "sanctum-dressed"

          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("sanctum-dressed-probe/asset-pipeline/sanctum-dressed.pipeline.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          u=d.get("uastc_ktx2")
          assert u, d
          assert u["validator"]["errors"] == 0, u
          assert u["texture_dimensions_policy"] == "preserved-no-resize-flags", u
          assert Path(u["path"]).is_file(), u
          print("XZIEL_DRESSED_UASTC_KTX2_GREEN")
          print("UASTC_BYTES", u["bytes"])
          print("UASTC_RATIO", u["size_ratio"])
          PY

      - name: Record source provenance
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            cat /tmp/sanctum-dressed-sources.txt 2>/dev/null || true
            echo "OUTER_SOURCE=https://github.com/IRCSS/Blender-Geometry-Node-French-Houses"
            echo "OUTER_LICENSE=MIT"
            echo "INTERIOR_SOURCE=https://opengameart.org/content/medieval-church-interior"
            echo "INTERIOR_LICENSE=CC0"
            echo "DRESSING_SOURCE=https://opengameart.org/content/3td-fantasy-ruins-pack-for-blender"
            echo "DRESSING_LICENSE=CC0"
            echo "BLENDER=5.2.2"
          } > sanctum-dressed-probe/source-provenance.txt

      - name: Upload dressed Sanctum evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XZIEL-Sanctum-Dressed-Gothic-Interior
          path: |
            sanctum-dressed-probe/
            sanctum-dressed-base/composite-report.json
          if-no-files-found: error
          retention-days: 14
