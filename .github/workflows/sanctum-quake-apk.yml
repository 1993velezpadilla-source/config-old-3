name: XZIEL Sanctum GREEN APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/sanctum-quake-apk.yml"
      - "tools/church_map/**"
      - "android/**"
      - "scripts/**"

permissions:
  contents: read
  actions: read

concurrency:
  group: xziel-sanctum-green-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-sanctum:
    name: Build XZIEL Sanctum GREEN
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout XZIEL
        uses: actions/checkout@v5

      - name: Export measured Sanctum GREEN Quake church
        shell: bash
        env:
          SANCTUM_SNAPSHOT: tools/church_map/sanctum_st_giles_measurement.v1.json
          NZP_MAP_OUT: church/out/nzp_green/sanctum_green.map
        run: |
          set -euo pipefail
          mkdir -p church/out/nzp_green
          python3 tools/church_map/export_nzp_green_snapshot.py | tee church/out/sanctum-green-export.log
          test -s church/out/nzp_green/sanctum_green.map
          test -s church/out/nzp_green/sanctum_green_report.json
          cat church/out/nzp_green/sanctum_green_report.json

      - name: Compile Sanctum BSP and spawn zones
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/nzp-assets /tmp/spawn-zone-tool
          git clone --depth 1 https://github.com/nzp-team/assets.git /tmp/nzp-assets
          git clone --depth 1 --recursive https://github.com/nzp-team/spawn-zone-tool.git /tmp/spawn-zone-tool
          python3 -m pip install --quiet -r /tmp/spawn-zone-tool/requirements.txt
          (
            cd /tmp/nzp-assets
            bash tools/compile-wads.sh
            mkdir -p source/maps/sanctum_green
            cp "$GITHUB_WORKSPACE/church/out/nzp_green/sanctum_green.map" source/maps/sanctum_green/sanctum_green.map
            bash tools/compile-maps.sh --map sanctum_green --zone-tool-path /tmp/spawn-zone-tool
          ) 2>&1 | tee church/out/sanctum-green-compile.log
          mkdir -p sanctum-dist
          cp /tmp/nzp-assets/common/maps/sanctum_green.bsp sanctum-dist/
          test -s /tmp/nzp-assets/common/maps/sanctum_green.nsz
          cp /tmp/nzp-assets/common/maps/sanctum_green.nsz sanctum-dist/
          cp church/out/nzp_green/sanctum_green.map sanctum-dist/
          cp church/out/nzp_green/sanctum_green_report.json sanctum-dist/
          cp church/out/church_scene_report.json sanctum-dist/
          cp church/out/zombies_map_plan.json sanctum-dist/
          cp church/out/top_layout.png sanctum-dist/ || true
          cp church/out/zombies_gameplay_top.png sanctum-dist/ || true
          ls -lh sanctum-dist/

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK, NDK and emulator
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER"             "platform-tools"             "platforms;android-35"             "build-tools;35.0.0"             "ndk;27.2.12479018"             "emulator"             "system-images;android-35;google_apis;x86_64"

      - name: Prepare native XZIEL Android project
        shell: bash
        env:
          XZIEL_EXTRA_MAP_NAME: sanctum_green
          XZIEL_EXTRA_MAP_BSP: ${{ github.workspace }}/sanctum-dist/sanctum_green.bsp
          XZIEL_EXTRA_MAP_NSZ: ${{ github.workspace }}/sanctum-dist/sanctum_green.nsz
        run: |
          set -euo pipefail
          bash scripts/prepare_android.sh
          unzip -l build/android-project/app/src/main/assets/nzp-data.zip | grep 'nzp/maps/sanctum_green.bsp'
          unzip -l build/android-project/app/src/main/assets/nzp-data.zip | grep 'nzp/maps/sanctum_green.nsz'

      - name: Make Sanctum a one-tap app
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          activity=Path("build/android-project/app/src/main/java/org/libsdl/app/NZPActivity.java")
          text=activity.read_text(encoding="utf-8")
          pattern=re.compile(r'(return\s+new\s+String\[\]\s*\{\s*"-basedir"\s*,\s*dataRoot\.getAbsolutePath\(\)\s*)(\};)',re.MULTILINE)
          text,count=pattern.subn(r'\1,\n            "+map", "sanctum_green"\n        \2',text,count=1)
          if count!=1:
              raise SystemExit("Could not patch NZPActivity launch args")
          activity.write_text(text,encoding="utf-8")

          gradle=Path("build/android-project/app/build.gradle")
          g=gradle.read_text(encoding="utf-8")
          g,n=re.subn(r'applicationId\s+"[^"]+"','applicationId "com.xziel.sanctum"',g,count=1)
          if n!=1:
              raise SystemExit("Could not patch applicationId")
          g,n=re.subn(r'versionName\s+"[^"]+"','versionName "0.1-sanctum-green"',g,count=1)
          if n!=1:
              raise SystemExit("Could not patch versionName")
          gradle.write_text(g,encoding="utf-8")

          strings=Path("build/android-project/app/src/main/res/values/strings.xml")
          s=strings.read_text(encoding="utf-8")
          s=re.sub(r'<string name="app_name">.*?</string>','<string name="app_name">XZIEL: Sanctum</string>',s)
          strings.write_text(s,encoding="utf-8")
          PY

      - name: Build Sanctum APK
        working-directory: build/android-project
        shell: bash
        run: ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          cp build/android-project/app/build/outputs/apk/debug/app-debug.apk sanctum-dist/XZIEL-Sanctum-GREEN-debug.apk
          ls -lh sanctum-dist/XZIEL-Sanctum-GREEN-debug.apk

      - name: Android emulator Sanctum smoke
        id: smoke
        continue-on-error: true
        shell: bash
        env:
          ANDROID_AVD_HOME: ${{ runner.temp }}/xziel-sanctum-avd
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_AVD_HOME"
          ADB="${ANDROID_HOME}/platform-tools/adb"
          EMULATOR="${ANDROID_HOME}/emulator/emulator"
          AVDMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name avdmanager | sort | tail -n 1)"

          printf 'no\n' | "$AVDMANAGER" create avd --force --name xziel-sanctum-ci             --package "system-images;android-35;google_apis;x86_64" --device "pixel_6"

          [[ ! -e /dev/kvm ]] || sudo chmod 666 /dev/kvm || true
          nohup "$EMULATOR" @xziel-sanctum-ci -no-window -no-audio -no-boot-anim -no-snapshot             -gpu swiftshader_indirect -memory 2048 > sanctum-dist/emulator-stdout.txt 2>&1 &

          timeout 120 "$ADB" wait-for-device
          for i in $(seq 1 60); do
            [[ "$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]] && break
            sleep 2
          done
          test "$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1"

          "$ADB" install -r sanctum-dist/XZIEL-Sanctum-GREEN-debug.apk
          "$ADB" logcat -c
          "$ADB" shell am force-stop com.xziel.sanctum || true
          "$ADB" shell am start -W -n com.xziel.sanctum/org.libsdl.app.NZPActivity > sanctum-dist/am-start.txt 2>&1 || true

          sleep 28
          "$ADB" exec-out screencap -p > sanctum-dist/sanctum-a.png
          sleep 5
          "$ADB" exec-out screencap -p > sanctum-dist/sanctum-b.png
          "$ADB" logcat -d -v threadtime > sanctum-dist/sanctum-logcat.txt || true

          python3 -m pip install --quiet pillow==11.3.0
          python3 - <<'PY' | tee sanctum-dist/visual-report.txt
          from PIL import Image, ImageChops, ImageStat
          ims=[]
          for p in ["sanctum-dist/sanctum-a.png","sanctum-dist/sanctum-b.png"]:
              im=Image.open(p).convert("RGB")
              if im.width <= im.height or im.width < 1000 or im.height < 500:
                  raise SystemExit(f"Bad gameplay screenshot dimensions: {p} {im.size}")
              gray=im.convert("L"); st=ImageStat.Stat(gray); lo,hi=gray.getextrema()
              if hi-lo < 20 or st.stddev[0] < 6:
                  raise SystemExit(f"Gameplay frame blank/flat: {p} extrema={(lo,hi)} std={st.stddev[0]:.2f}")
              ims.append(im)
              print(p,im.size,"mean",round(st.mean[0],2),"std",round(st.stddev[0],2),"extrema",(lo,hi))
          diff=ImageChops.difference(ims[0],ims[1]).convert("L")
          ds=ImageStat.Stat(diff)
          print("frame_delta_mean",round(ds.mean[0],3),"frame_delta_std",round(ds.stddev[0],3))
          PY

          PID="$("$ADB" shell pidof com.xziel.sanctum 2>/dev/null | tr -d '\r' || true)"
          STAGE="$("$ADB" shell run-as com.xziel.sanctum cat files/nzp-runtime/.xziel-stage 2>/dev/null | tr -d '\r' || true)"
          echo "PID=$PID" | tee sanctum-dist/runtime-state.txt
          echo "STAGE=$STAGE" | tee -a sanctum-dist/runtime-state.txt

          if grep -Eq "Fatal signal|FATAL EXCEPTION|stage=SYS_ERROR|XZIEL_QC.*PR_RunError" sanctum-dist/sanctum-logcat.txt; then
            echo "Native/QuakeC runtime error detected"
            grep -E "XZIEL_QC|stage=SYS_ERROR|Fatal signal|FATAL EXCEPTION" sanctum-dist/sanctum-logcat.txt | tail -100 || true
            exit 1
          fi
          test -n "$PID"
          test "$STAGE" = "FIRST_FRAME_OK"

      - name: Upload Sanctum APK and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XZIEL-Sanctum-GREEN
          path: sanctum-dist/
          if-no-files-found: error
          retention-days: 14

      - name: Fail if Sanctum gameplay boot failed
        if: steps.smoke.outcome == 'failure'
        shell: bash
        run: exit 1
