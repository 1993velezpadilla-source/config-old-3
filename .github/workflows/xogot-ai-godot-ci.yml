name: Xogot AI Godot VM

on:
  workflow_dispatch:
  push:
    branches:
      - feature/xogot-port-v1
      - feature/church-expansion-v1
    paths:
      - "xogot/**"
      - ".github/workflows/xogot-ai-godot-ci.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: xogot-ai-godot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  godot-ai-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Install Godot host tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip curl

      - name: Install Godot 4.6.1
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --retry-all-errors --retry-delay 2 \
            https://github.com/godotengine/godot-builds/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip \
            -o /tmp/godot.zip
          rm -rf /tmp/godot
          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.6.1-stable_linux.x86_64
          /tmp/godot/Godot_v4.6.1-stable_linux.x86_64 --version

      - name: Import and parse project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/xogot-ai
          timeout 180 /tmp/godot/Godot_v4.6.1-stable_linux.x86_64 \
            --headless --editor --path xogot --quit \
            2>&1 | tee build/xogot-ai/import.log
          ! grep -E "SCRIPT ERROR|Parse Error|ERROR: Failed to load script" build/xogot-ai/import.log

      - name: Run live scene smoke test
        shell: bash
        run: |
          set -euo pipefail
          timeout 120 /tmp/godot/Godot_v4.6.1-stable_linux.x86_64 \
            --headless --path xogot --quit-after 120 \
            2>&1 | tee build/xogot-ai/runtime.log
          grep -q "YOU_WONT_WIN: CHURCH_V2_READY" build/xogot-ai/runtime.log
          grep -q "XZOGOT_PLAYER_READY" build/xogot-ai/runtime.log
          grep -q "XZOGOT_MOVEMENT_V2_READY" build/xogot-ai/runtime.log
          grep -q "XZOGOT_HUD_V8_READY" build/xogot-ai/runtime.log
          grep -q "XZOGOT_LATEST_12_SKINS_READY" build/xogot-ai/runtime.log
          grep -q "XZOGOT_FIRE_SKIN_VALID_PNG_READY" build/xogot-ai/runtime.log
          grep -q "XZOGOT_COD_VIEW_READY" build/xogot-ai/runtime.log
          grep -q "XZOGOT_WEAPON_READY" build/xogot-ai/runtime.log
          grep -q "XZOGOT_INTERACTION_PLAYER_READY 500" build/xogot-ai/runtime.log
          grep -q "XZOGOT_INTERACTIONS_PREPARED 14" build/xogot-ai/runtime.log
          grep -q "XZOGOT_EXPANSION_V1_LOOP_READY" build/xogot-ai/runtime.log
          grep -q "XZOGOT_CHURCH_SECOND_FLOOR_LOOP_READY" build/xogot-ai/runtime.log
          grep -q "XZOGOT_BELL_TOWER_V1_PLAYABLE" build/xogot-ai/runtime.log
          grep -q "XZOGOT_SELECTIVE_SPAWNS_READY 8" build/xogot-ai/runtime.log
          grep -q "XZOGOT_ZOMBIE_PATH_NETWORK_READY" build/xogot-ai/runtime.log
          grep -q "XZOGOT_SPAWN_DIRECTOR_READY" build/xogot-ai/runtime.log
          grep -q "XZOGOT_WEAPON_CATALOG_READY" build/xogot-ai/runtime.log
          grep -q "XZOGOT_WINDOWS_PREPARED 8" build/xogot-ai/runtime.log
          grep -q "XZOGOT_ARCH_SHELL_V2_READY" build/xogot-ai/runtime.log
          grep -q "XZOGOT_AUTHORED_ALTAR_READY" build/xogot-ai/runtime.log
          grep -q "XZOGOT_ROYAL_AISLE_CARPET_READY" build/xogot-ai/runtime.log
          grep -q "XZOGOT_ALTAR_LIGHT_READY" build/xogot-ai/runtime.log
          grep -q "XZOGOT_AUTHORED_BENCHES_FACE_ALTAR 180" build/xogot-ai/runtime.log
          grep -q "XZOGOT_AUTHORED_BENCHES_READY 9" build/xogot-ai/runtime.log
          grep -q "XZOGOT_ROUND_MANAGER_READY" build/xogot-ai/runtime.log
          ! grep -E "SCRIPT ERROR|Parse Error|ERROR: Failed to load script" build/xogot-ai/runtime.log

      - name: Verify movement state in Godot
        shell: bash
        run: |
          set -euo pipefail
          timeout 60 /tmp/godot/Godot_v4.6.1-stable_linux.x86_64 \
            --headless --path xogot --script res://ci/movement_probe.gd \
            2>&1 | tee build/xogot-ai/movement-probe.log
          grep -q "XZOGOT_COD_VIEW_PROBE_GREEN" build/xogot-ai/movement-probe.log
          grep -q "XZOGOT_MOVEMENT_PROBE_GREEN" build/xogot-ai/movement-probe.log
          ! grep -E "SCRIPT ERROR|Parse Error|ERROR: Failed to load script" build/xogot-ai/movement-probe.log
          echo "XOGOT_AI_VM_GREEN"

      - name: Verify weapon state in Godot
        shell: bash
        run: |
          set -euo pipefail
          timeout 60 /tmp/godot/Godot_v4.6.1-stable_linux.x86_64 \
            --headless --path xogot --script res://ci/weapon_probe.gd \
            2>&1 | tee build/xogot-ai/weapon-probe.log
          grep -q "XZOGOT_WEAPON_PROBE_GREEN" build/xogot-ai/weapon-probe.log
          ! grep -E "SCRIPT ERROR|Parse Error|ERROR: Failed to load script" build/xogot-ai/weapon-probe.log
          echo "XOGOT_AI_VM_GREEN"

      - name: Verify interaction economy in Godot
        shell: bash
        run: |
          set -euo pipefail
          timeout 60 /tmp/godot/Godot_v4.6.1-stable_linux.x86_64 \
            --headless --path xogot --script res://ci/interaction_probe.gd \
            2>&1 | tee build/xogot-ai/interaction-probe.log
          grep -q "XZOGOT_INTERACTION_PROBE_GREEN" build/xogot-ai/interaction-probe.log
          ! grep -E "SCRIPT ERROR|Parse Error|ERROR: Failed to load script" build/xogot-ai/interaction-probe.log
          echo "XOGOT_AI_VM_GREEN"

      - name: Verify round barricade and zombie loop
        shell: bash
        run: |
          set -euo pipefail
          timeout 60 /tmp/godot/Godot_v4.6.1-stable_linux.x86_64 \
            --headless --path xogot --script res://ci/round_zombie_probe.gd \
            2>&1 | tee build/xogot-ai/round-zombie-probe.log
          grep -q "XZOGOT_MONJA_BASICA_LOADED" build/xogot-ai/round-zombie-probe.log
          grep -q "XZOGOT_ZOMBIE_GROUND_SNAP_READY 0.24" build/xogot-ai/round-zombie-probe.log
          grep -q "XZOGOT_MONJA_FORWARD_FIXED 90" build/xogot-ai/round-zombie-probe.log
          grep -q "XZOGOT_WINDOW_PHYSICAL_CROSS_GREEN" build/xogot-ai/round-zombie-probe.log
          grep -q "XZOGOT_ENEMY_SCALE_PROBE_GREEN" build/xogot-ai/round-zombie-probe.log
          grep -q "XZOGOT_HEADSHOT_PROBE_GREEN" build/xogot-ai/round-zombie-probe.log
          grep -q "XZOGOT_ROUND_ZOMBIE_PROBE_GREEN" build/xogot-ai/round-zombie-probe.log
          ! grep -E "SCRIPT ERROR|Parse Error|ERROR: Failed to load script" build/xogot-ai/round-zombie-probe.log
          echo "XOGOT_AI_VM_GREEN"

      - name: Verify church traversal in Godot
        shell: bash
        run: |
          set -euo pipefail
          timeout 75 /tmp/godot/Godot_v4.6.1-stable_linux.x86_64 \
            --headless --path xogot --script res://ci/church_traversal_probe.gd \
            2>&1 | tee build/xogot-ai/church-traversal-probe.log
          grep -q "XZOGOT_HUMAN_SCALE_GREEN" build/xogot-ai/church-traversal-probe.log
          grep -q "XZOGOT_BALCONY_TRAVERSAL_GREEN" build/xogot-ai/church-traversal-probe.log
          grep -q "XZOGOT_CHURCH_TRAVERSAL_PROBE_GREEN" build/xogot-ai/church-traversal-probe.log
          ! grep -E "SCRIPT ERROR|Parse Error|ERROR: Failed to load script" build/xogot-ai/church-traversal-probe.log
          echo "XOGOT_AI_VM_GREEN"

      - name: Verify expanded church gameplay in Godot
        shell: bash
        run: |
          set -euo pipefail
          timeout 75 /tmp/godot/Godot_v4.6.1-stable_linux.x86_64 \
            --headless --path xogot --script res://ci/church_expansion_probe.gd \
            2>&1 | tee build/xogot-ai/church-expansion-probe.log
          grep -q "XZOGOT_SECOND_FLOOR_PROBE_GREEN" build/xogot-ai/church-expansion-probe.log
          grep -q "XZOGOT_SELECTIVE_SPAWN_PROBE_GREEN" build/xogot-ai/church-expansion-probe.log
          grep -q "XZOGOT_BELL_TOWER_PROBE_GREEN" build/xogot-ai/church-expansion-probe.log
          grep -q "XZOGOT_CHURCH_EXPANSION_PROBE_GREEN" build/xogot-ai/church-expansion-probe.log
          ! grep -E "SCRIPT ERROR|Parse Error|ERROR: Failed to load script" build/xogot-ai/church-expansion-probe.log
          echo "XOGOT_EXPANSION_VM_GREEN"

      - name: Verify mobile assists and dismemberment
        shell: bash
        run: |
          set -euo pipefail
          timeout 75 /tmp/godot/Godot_v4.6.1-stable_linux.x86_64 \
            --headless --path xogot --script res://ci/mobile_survival_probe.gd \
            2>&1 | tee build/xogot-ai/mobile-survival-probe.log
          grep -q "XZOGOT_SETTINGS_PROBE_GREEN" build/xogot-ai/mobile-survival-probe.log
          grep -q "XZOGOT_AUTO_REBUILD_PROBE_GREEN" build/xogot-ai/mobile-survival-probe.log
          grep -q "XZOGOT_MANUAL_KNIFE_PROBE_GREEN" build/xogot-ai/mobile-survival-probe.log
          grep -q "XZOGOT_DISMEMBERMENT_CRAWLER_PROBE_GREEN" build/xogot-ai/mobile-survival-probe.log
          grep -q "XZOGOT_MOBILE_SURVIVAL_PROBE_GREEN" build/xogot-ai/mobile-survival-probe.log
          ! grep -E "SCRIPT ERROR|Parse Error|ERROR: Failed to load script" build/xogot-ai/mobile-survival-probe.log
          echo "XOGOT_MOBILE_SURVIVAL_GREEN"

      - name: Verify release pause and DEV lab
        shell: bash
        run: |
          set -euo pipefail
          timeout 75 /tmp/godot/Godot_v4.6.1-stable_linux.x86_64 \
            --headless --path xogot --script res://ci/dev_menu_probe.gd \
            2>&1 | tee build/xogot-ai/dev-menu-probe.log
          grep -q "XZOGOT_RELEASE_PAUSE_PROBE_GREEN" build/xogot-ai/dev-menu-probe.log
          grep -q "XZOGOT_RELEASE_DEV_FLAGS_PROBE_GREEN" build/xogot-ai/dev-menu-probe.log
          grep -q "XZOGOT_RELEASE_DEV_UNLOCK_PROBE_GREEN" build/xogot-ai/dev-menu-probe.log
          grep -q "XZOGOT_RELEASE_WEAPON_LAB_PROBE_GREEN" build/xogot-ai/dev-menu-probe.log
          grep -q "XZOGOT_RELEASE_DEV_MENU_PROBE_GREEN" build/xogot-ai/dev-menu-probe.log
          ! grep -E "SCRIPT ERROR|Parse Error|ERROR: Failed to load script" build/xogot-ai/dev-menu-probe.log
          echo "XOGOT_RELEASE_DEV_LAB_GREEN"

      - name: Verify split gift runtime contract
        shell: bash
        run: |
          set -euo pipefail
          timeout 75 /tmp/godot/Godot_v4.6.1-stable_linux.x86_64 \
            --headless --path xogot --script res://ci/gift_runtime_probe.gd \
            2>&1 | tee build/xogot-ai/gift-runtime-probe.log
          grep -q "XZOGOT_GIFT_RUNTIME_CONTRACT_GREEN" build/xogot-ai/gift-runtime-probe.log
          ! grep -E "SCRIPT ERROR|Parse Error|ERROR: Failed to load script" build/xogot-ai/gift-runtime-probe.log
          echo "XZOGOT_GIFT_RUNTIME_GATE_GREEN"

      - name: Verify animated candles and light FX
        shell: bash
        run: |
          set -euo pipefail
          timeout 75 /tmp/godot/Godot_v4.6.1-stable_linux.x86_64 \
            --headless --path xogot --script res://ci/candle_light_probe.gd \
            2>&1 | tee build/xogot-ai/candle-light-probe.log
          grep -q "XZOGOT_CANDLE_STATES_GREEN" build/xogot-ai/candle-light-probe.log
          grep -q "XZOGOT_CANDLE_LIGHT_BUDGET_GREEN" build/xogot-ai/candle-light-probe.log
          grep -q "XZOGOT_STAINED_GLASS_LIGHT_PROBE_GREEN" build/xogot-ai/candle-light-probe.log
          grep -q "XZOGOT_CANDLE_LIGHT_SYSTEM_GREEN" build/xogot-ai/candle-light-probe.log
          ! grep -E "SCRIPT ERROR|Parse Error|ERROR: Failed to load script" build/xogot-ai/candle-light-probe.log
          echo "XZOGOT_CANDLE_LIGHT_GATE_GREEN"

      - name: Upload AI Godot logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Xogot-AI-Godot-VM-logs
          path: build/xogot-ai/
          if-no-files-found: warn
          retention-days: 7
