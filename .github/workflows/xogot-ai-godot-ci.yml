name: Xogot AI Godot VM

on:
  workflow_dispatch:
  push:
    branches:
      - feature/xogot-port-v1
      - feature/church-expansion-v1
    paths:
      - "xogot/**"
      - "services/xz-match-directory/**"
      - "services/xz-ws-relay/**"
      - "render.yaml"
      - ".github/workflows/xogot-ai-godot-ci.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: xogot-ai-godot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  godot-ai-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Install Godot host tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip curl

      - name: Install Godot 4.6.1
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --retry-all-errors --retry-delay 2 \
            https://github.com/godotengine/godot-builds/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip \
            -o /tmp/godot.zip
          rm -rf /tmp/godot
          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.6.1-stable_linux.x86_64
          /tmp/godot/Godot_v4.6.1-stable_linux.x86_64 --version

      - name: Import and parse project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/xogot-ai
          timeout 180 /tmp/godot/Godot_v4.6.1-stable_linux.x86_64 \
            --headless --editor --path xogot --quit \
            2>&1 | tee build/xogot-ai/import.log
          ! grep -E "SCRIPT ERROR|Parse Error|ERROR: Failed to load script" build/xogot-ai/import.log

      - name: Run live scene smoke test
        shell: bash
        run: |
          set -euo pipefail
          timeout 120 /tmp/godot/Godot_v4.6.1-stable_linux.x86_64 \
            --headless --path xogot --quit-after 120 \
            2>&1 | tee build/xogot-ai/runtime.log
          grep -q "YOU_WONT_WIN: CHURCH_V2_READY" build/xogot-ai/runtime.log
          grep -q "XZOGOT_PLAYER_READY" build/xogot-ai/runtime.log
          grep -q "XZOGOT_MOVEMENT_V2_READY" build/xogot-ai/runtime.log
          grep -q "XZOGOT_HUD_V8_READY" build/xogot-ai/runtime.log
          grep -q "XZOGOT_LATEST_12_SKINS_READY" build/xogot-ai/runtime.log
          grep -q "XZOGOT_FIRE_SKIN_VALID_PNG_READY" build/xogot-ai/runtime.log
          grep -q "XZOGOT_COD_VIEW_READY" build/xogot-ai/runtime.log
          grep -q "XZOGOT_WEAPON_READY" build/xogot-ai/runtime.log
          grep -q "XZOGOT_INTERACTION_PLAYER_READY 500" build/xogot-ai/runtime.log
          grep -q "XZOGOT_INTERACTIONS_PREPARED 27" build/xogot-ai/runtime.log
          grep -q "XZOGOT_EXPANSION_V1_LOOP_READY" build/xogot-ai/runtime.log
          grep -q "XZOGOT_CHURCH_SECOND_FLOOR_LOOP_READY" build/xogot-ai/runtime.log
          grep -q "XZOGOT_BELL_TOWER_V1_PLAYABLE" build/xogot-ai/runtime.log
          grep -q "XZOGOT_SELECTIVE_SPAWNS_READY 8" build/xogot-ai/runtime.log
          grep -q "XZOGOT_ZOMBIE_PATH_NETWORK_READY" build/xogot-ai/runtime.log
          grep -q "XZOGOT_SPAWN_DIRECTOR_READY" build/xogot-ai/runtime.log
          grep -q "XZOGOT_WEAPON_CATALOG_READY" build/xogot-ai/runtime.log
          grep -q "XZOGOT_WINDOWS_PREPARED 8" build/xogot-ai/runtime.log
          if test -s xogot/assets/environment/church/church_final_architecture.glb; then
            grep -q "XZOGOT_FINAL_CHURCH_ARCHITECTURE_READY" build/xogot-ai/runtime.log
          else
            grep -Eq "XZOGOT_FINAL_CHURCH_ARCHITECTURE_READY|XZOGOT_ARCH_SHELL_V2_READY" build/xogot-ai/runtime.log
          fi
          grep -q "XZOGOT_AUTHORED_ALTAR_READY" build/xogot-ai/runtime.log
          grep -q "XZOGOT_ROYAL_AISLE_CARPET_READY" build/xogot-ai/runtime.log
          grep -q "XZOGOT_ALTAR_LIGHT_READY" build/xogot-ai/runtime.log
          grep -q "XZOGOT_AUTHORED_BENCHES_FACE_ALTAR 180" build/xogot-ai/runtime.log
          grep -q "XZOGOT_AUTHORED_BENCHES_READY 9" build/xogot-ai/runtime.log
          grep -q "XZOGOT_ROUND_MANAGER_READY" build/xogot-ai/runtime.log
          grep -q "XZOGOT_NETWORK_MANAGER_READY" build/xogot-ai/runtime.log
          ! grep -E "SCRIPT ERROR|Parse Error|ERROR: Failed to load script" build/xogot-ai/runtime.log

      - name: Verify movement state in Godot
        shell: bash
        run: |
          set -euo pipefail
          timeout 60 /tmp/godot/Godot_v4.6.1-stable_linux.x86_64 \
            --headless --path xogot --script res://ci/movement_probe.gd \
            2>&1 | tee build/xogot-ai/movement-probe.log
          grep -q "XZOGOT_COD_VIEW_PROBE_GREEN" build/xogot-ai/movement-probe.log
          grep -q "XZOGOT_MOVEMENT_PROBE_GREEN" build/xogot-ai/movement-probe.log
          ! grep -E "SCRIPT ERROR|Parse Error|ERROR: Failed to load script" build/xogot-ai/movement-probe.log
          echo "XOGOT_AI_VM_GREEN"

      - name: Verify weapon state in Godot
        shell: bash
        run: |
          set -euo pipefail
          timeout 60 /tmp/godot/Godot_v4.6.1-stable_linux.x86_64 \
            --headless --path xogot --script res://ci/weapon_probe.gd \
            2>&1 | tee build/xogot-ai/weapon-probe.log
          grep -q "XZOGOT_WEAPON_PROBE_GREEN" build/xogot-ai/weapon-probe.log
          ! grep -E "SCRIPT ERROR|Parse Error|ERROR: Failed to load script" build/xogot-ai/weapon-probe.log
          echo "XOGOT_AI_VM_GREEN"

      - name: Verify previous AAA source PSAs attach to animated gun and MP40 ADS
        shell: bash
        run: |
          set -euo pipefail
          timeout 85 /tmp/godot/Godot_v4.6.1-stable_linux.x86_64 \
            --headless --path xogot --script res://ci/church_source_grip_ads_probe.gd \
            2>&1 | tee build/xogot-ai/church-hands-ads-probe.log
          grep -q "XZOGOT_CHURCH_COLT_SOURCE_HANDS_GRIP_GREEN" build/xogot-ai/church-hands-ads-probe.log
          grep -q "XZOGOT_CHURCH_MP40_SOURCE_HANDS_GRIP_GREEN" build/xogot-ai/church-hands-ads-probe.log
          grep -q "XZOGOT_CHURCH_MP40_DTWEAPONS_ADS_TRANSFORM_GREEN" build/xogot-ai/church-hands-ads-probe.log
          grep -q "XZOGOT_CHURCH_MP40_AUTHORED_ADS_HIP_LOOP_GREEN" build/xogot-ai/church-hands-ads-probe.log
          ! grep -E "SCRIPT ERROR|Parse Error|CHURCH_HANDS_ADS_PROBE:" build/xogot-ai/church-hands-ads-probe.log

      - name: Diagnose real source hands and gun camera-space geometry
        shell: bash
        run: |
          set -euo pipefail
          timeout 80 /tmp/godot/Godot_v4.6.1-stable_linux.x86_64 \
            --headless --path xogot --script res://ci/church_real_fps_geometry_diagnostic.gd \
            2>&1 | tee build/xogot-ai/church-fps-geometry-diagnostic.log
          grep -q 'XZOGOT_SOURCE_2_WEAPON_FPS_BOUNDS_DIAGNOSTIC_COMPLETE' build/xogot-ai/church-fps-geometry-diagnostic.log
          ! grep -E 'CHURCH_VIEWMODEL_GEOMETRY_DIAGNOSTIC:|SCRIPT ERROR|Parse Error' build/xogot-ai/church-fps-geometry-diagnostic.log

      - name: Verify interaction economy in Godot
        shell: bash
        run: |
          set -euo pipefail
          timeout 60 /tmp/godot/Godot_v4.6.1-stable_linux.x86_64 \
            --headless --path xogot --script res://ci/interaction_probe.gd \
            2>&1 | tee build/xogot-ai/interaction-probe.log
          grep -q "XZOGOT_INTERACTION_PROBE_GREEN" build/xogot-ai/interaction-probe.log
          grep -q "XZOGOT_REVIVAL_SIX_WALLBUY_PURCHASES_GREEN" build/xogot-ai/interaction-probe.log
          ! grep -E "SCRIPT ERROR|Parse Error|ERROR: Failed to load script" build/xogot-ai/interaction-probe.log
          echo "XOGOT_AI_VM_GREEN"

      - name: Verify multiplayer lobby UI
        shell: bash
        run: |
          set -euo pipefail
          timeout 75 /tmp/godot/Godot_v4.6.1-stable_linux.x86_64 \
            --headless --path xogot --script res://ci/network_lobby_probe.gd \
            2>&1 | tee build/xogot-ai/network-lobby-probe.log
          grep -q "XZOGOT_NETWORK_LOBBY_CONTROLS_GREEN" build/xogot-ai/network-lobby-probe.log
          grep -q "XZOGOT_NETWORK_LOBBY_PRIVATE_GREEN" build/xogot-ai/network-lobby-probe.log
          grep -q "XZOGOT_NETWORK_LOBBY_PUBLIC_GREEN" build/xogot-ai/network-lobby-probe.log
          grep -q "XZOGOT_NETWORK_ONLINE_PAUSE_GREEN" build/xogot-ai/network-lobby-probe.log
          grep -q "XZOGOT_NETWORK_LOBBY_PORT_GREEN" build/xogot-ai/network-lobby-probe.log
          grep -q "XZOGOT_NETWORK_LOBBY_SYSTEM_GREEN" build/xogot-ai/network-lobby-probe.log
          ! grep -E "SCRIPT ERROR|Parse Error|ERROR: Failed to load script|NETWORK_LOBBY_PROBE:" build/xogot-ai/network-lobby-probe.log
          echo "XZOGOT_NETWORK_LOBBY_GATE_GREEN"

      - name: Verify ENet four-player foundation
        shell: bash
        run: |
          set -euo pipefail
          timeout 75 /tmp/godot/Godot_v4.6.1-stable_linux.x86_64 \
            --headless --path xogot --script res://ci/network_probe.gd \
            2>&1 | tee build/xogot-ai/network-probe.log
          grep -q "XZOGOT_NETWORK_BOOT_GREEN" build/xogot-ai/network-probe.log
          grep -q "XZOGOT_ENET_HOST_GREEN" build/xogot-ai/network-probe.log
          grep -q "XZOGOT_NETWORK_ROSTER_2P_GREEN" build/xogot-ai/network-probe.log
          grep -q "XZOGOT_NETWORK_REVIVE_AUTHORITY_GREEN" build/xogot-ai/network-probe.log
          grep -q "XZOGOT_NETWORK_HOST_AUTHORITY_GREEN" build/xogot-ai/network-probe.log
          grep -q "XZOGOT_NETWORK_LEAVE_GREEN" build/xogot-ai/network-probe.log
          grep -q "XZOGOT_NETWORK_ZOMBIE_DAMAGE_GREEN" build/xogot-ai/network-probe.log
          grep -q "XZOGOT_NETWORK_ZOMBIE_REPLICATION_GREEN" build/xogot-ai/network-probe.log
          grep -q "XZOGOT_NETWORK_MAX_AMMO_GREEN" build/xogot-ai/network-probe.log
          grep -q "XZOGOT_NETWORK_ROUND_STATE_GREEN" build/xogot-ai/network-probe.log
          grep -q "XZOGOT_NETWORK_POWERUP_EFFECTS_GREEN" build/xogot-ai/network-probe.log
          grep -q "XZOGOT_NETWORK_POWERUP_PICKUP_GREEN" build/xogot-ai/network-probe.log
          grep -q "XZOGOT_NETWORK_LATE_JOIN_STATE_GREEN" build/xogot-ai/network-probe.log
          grep -q "XZOGOT_ENET_LOCALHOST_HANDSHAKE_GREEN" build/xogot-ai/network-probe.log
          grep -q "XZOGOT_ENET_RELIABLE_PACKET_GREEN" build/xogot-ai/network-probe.log
          grep -q "XZOGOT_4P_NETWORK_FOUNDATION_GREEN" build/xogot-ai/network-probe.log
          ! grep -E "SCRIPT ERROR|Parse Error|ERROR: Failed to load script|NETWORK_PROBE:" build/xogot-ai/network-probe.log
          echo "XZOGOT_4P_NETWORK_GATE_GREEN"

      - name: Verify LAN Find Match discovery
        shell: bash
        run: |
          set -euo pipefail
          timeout 75 /tmp/godot/Godot_v4.6.1-stable_linux.x86_64 \
            --headless --path xogot --script res://ci/lan_discovery_probe.gd \
            2>&1 | tee build/xogot-ai/lan-discovery-probe.log
          grep -q "XZOGOT_LAN_BEACON_DISCOVERY_GREEN" build/xogot-ai/lan-discovery-probe.log
          grep -q "XZOGOT_LAN_FIND_MATCH_GREEN" build/xogot-ai/lan-discovery-probe.log
          grep -q "XZOGOT_LAN_PRIVATE_HIDDEN_GREEN" build/xogot-ai/lan-discovery-probe.log
          grep -q "XZOGOT_LAN_PUBLIC_ADVERTISE_GREEN" build/xogot-ai/lan-discovery-probe.log
          grep -q "XZOGOT_LAN_LEAVE_STOPS_ADVERTISE_GREEN" build/xogot-ai/lan-discovery-probe.log
          grep -q "XZOGOT_LAN_DISCOVERY_SYSTEM_GREEN" build/xogot-ai/lan-discovery-probe.log
          ! grep -E "SCRIPT ERROR|Parse Error|ERROR: Failed to load script|LAN_DISCOVERY_PROBE:" build/xogot-ai/lan-discovery-probe.log
          echo "XZOGOT_LAN_DISCOVERY_GATE_GREEN"

      - name: Verify public directory and UPnP integration
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile services/xz-match-directory/server.py
          PORT=18790 SESSION_TTL_SECONDS=25 XZ_MATCH_TRUST_SUPPLIED_IP=1 \
            python3 services/xz-match-directory/server.py \
            > build/xogot-ai/public-directory-server.log 2>&1 &
          DIR_PID=$!
          cleanup_directory() {
            kill "$DIR_PID" 2>/dev/null || true
            wait "$DIR_PID" 2>/dev/null || true
          }
          trap cleanup_directory EXIT

          for _i in $(seq 1 80); do
            if curl -fsS http://127.0.0.1:18790/health >/dev/null 2>&1; then
              break
            fi
            sleep 0.1
          done
          curl -fsS http://127.0.0.1:18790/health | tee build/xogot-ai/public-directory-health.json

          timeout 90 /tmp/godot/Godot_v4.6.1-stable_linux.x86_64 \
            --headless --path xogot --script res://ci/public_matchmaking_probe.gd \
            2>&1 | tee build/xogot-ai/public-matchmaking-probe.log

          grep -q "XZOGOT_PUBLIC_DIRECTORY_CONFIG_PROBE_GREEN" build/xogot-ai/public-matchmaking-probe.log
          grep -q "XZOGOT_UPNP_FAILSAFE_HOST_GREEN" build/xogot-ai/public-matchmaking-probe.log
          grep -q "XZOGOT_PUBLIC_DIRECTORY_REGISTER_GREEN" build/xogot-ai/public-matchmaking-probe.log
          grep -q "XZOGOT_PUBLIC_FIND_MATCH_GREEN" build/xogot-ai/public-matchmaking-probe.log
          grep -q "XZOGOT_PUBLIC_BEST_MATCH_GREEN" build/xogot-ai/public-matchmaking-probe.log
          grep -q "XZOGOT_PUBLIC_DIRECTORY_UNREGISTER_GREEN" build/xogot-ai/public-matchmaking-probe.log
          grep -q "XZOGOT_PUBLIC_PRIVATE_ISOLATION_GREEN" build/xogot-ai/public-matchmaking-probe.log
          grep -q "XZOGOT_PUBLIC_MATCHMAKING_CLIENT_GREEN" build/xogot-ai/public-matchmaking-probe.log
          ! grep -E "SCRIPT ERROR|Parse Error|ERROR: Failed to load script|PUBLIC_MATCH_PROBE:" build/xogot-ai/public-matchmaking-probe.log
          echo "XZOGOT_PUBLIC_MATCHMAKING_GATE_GREEN"

      - name: Verify real two-process ENet late join
        shell: bash
        run: |
          set -euo pipefail
          HOST_LOG="build/xogot-ai/network-e2e-host.log"
          CLIENT_LOG="build/xogot-ai/network-e2e-client.log"

          timeout 30 /tmp/godot/Godot_v4.6.1-stable_linux.x86_64 \
            --headless --path xogot --script res://ci/network_e2e_host.gd \
            >"$HOST_LOG" 2>&1 &
          HOST_PID=$!

          ready=0
          for _i in $(seq 1 160); do
            if grep -q "XZOGOT_E2E_HOST_LISTENING" "$HOST_LOG" 2>/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$HOST_PID" 2>/dev/null; then
              break
            fi
            sleep 0.10
          done

          if [ "$ready" -ne 1 ]; then
            cat "$HOST_LOG" || true
            wait "$HOST_PID" || true
            echo "Host integration probe never reached listening state" >&2
            exit 1
          fi

          set +e
          timeout 25 /tmp/godot/Godot_v4.6.1-stable_linux.x86_64 \
            --headless --path xogot --script res://ci/network_e2e_client.gd \
            >"$CLIENT_LOG" 2>&1
          CLIENT_RC=$?
          wait "$HOST_PID"
          HOST_RC=$?
          set -e

          cat "$HOST_LOG"
          cat "$CLIENT_LOG"

          test "$HOST_RC" -eq 0
          test "$CLIENT_RC" -eq 0
          grep -q "XZOGOT_E2E_HOST_PREJOIN_STATE_GREEN" "$HOST_LOG"
          grep -q "XZOGOT_E2E_HOST_CLIENT_CONNECTED" "$HOST_LOG"
          grep -q "XZOGOT_E2E_HOST_GREEN" "$HOST_LOG"
          grep -q "XZOGOT_E2E_CLIENT_ROSTER_GREEN" "$CLIENT_LOG"
          grep -q "XZOGOT_E2E_CLIENT_ROUND_GREEN" "$CLIENT_LOG"
          grep -q "XZOGOT_E2E_CLIENT_POWERUP_GREEN" "$CLIENT_LOG"
          grep -q "XZOGOT_E2E_CLIENT_WORLD_GREEN" "$CLIENT_LOG"
          grep -q "XZOGOT_E2E_CLIENT_ZOMBIE_GREEN" "$CLIENT_LOG"
          grep -q "XZOGOT_E2E_CLIENT_GREEN" "$CLIENT_LOG"
          ! grep -E "SCRIPT ERROR|Parse Error|ERROR: Failed to load script|NETWORK_E2E_(HOST|CLIENT):" "$HOST_LOG" "$CLIENT_LOG"
          echo "XZOGOT_REAL_ENET_E2E_GREEN"

      - name: Verify real four-process ENet session
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/xogot-ai
          HOST_LOG="build/xogot-ai/network-4p-host.log"
          C2_LOG="build/xogot-ai/network-4p-client2.log"
          C3_LOG="build/xogot-ai/network-4p-client3.log"
          C4_LOG="build/xogot-ai/network-4p-client4.log"

          timeout 35 /tmp/godot/Godot_v4.6.1-stable_linux.x86_64 \
            --headless --path xogot --script res://ci/network_4p_e2e_host.gd \
            >"$HOST_LOG" 2>&1 &
          HOST_PID=$!

          for _i in $(seq 1 120); do
            if grep -q "XZOGOT_4P_E2E_HOST_LISTENING" "$HOST_LOG" 2>/dev/null; then
              break
            fi
            sleep 0.1
          done
          grep -q "XZOGOT_4P_E2E_HOST_LISTENING" "$HOST_LOG"

          timeout 30 /tmp/godot/Godot_v4.6.1-stable_linux.x86_64 \
            --headless --path xogot --script res://ci/network_4p_e2e_client.gd -- client2 \
            >"$C2_LOG" 2>&1 &
          C2_PID=$!
          timeout 30 /tmp/godot/Godot_v4.6.1-stable_linux.x86_64 \
            --headless --path xogot --script res://ci/network_4p_e2e_client.gd -- client3 \
            >"$C3_LOG" 2>&1 &
          C3_PID=$!
          timeout 30 /tmp/godot/Godot_v4.6.1-stable_linux.x86_64 \
            --headless --path xogot --script res://ci/network_4p_e2e_client.gd -- client4 \
            >"$C4_LOG" 2>&1 &
          C4_PID=$!

          wait "$C2_PID"
          wait "$C3_PID"
          wait "$C4_PID"
          wait "$HOST_PID"

          grep -q "XZOGOT_4P_E2E_HOST_PREJOIN_GREEN" "$HOST_LOG"
          grep -q "XZOGOT_4P_E2E_HOST_ROSTER_GREEN" "$HOST_LOG"
          grep -q "XZOGOT_4P_E2E_HOST_PROXIES_GREEN 3" "$HOST_LOG"
          grep -q "XZOGOT_4P_E2E_HOST_STABLE_GREEN" "$HOST_LOG"
          grep -q "XZOGOT_4P_E2E_HOST_GREEN" "$HOST_LOG"

          for LOG in "$C2_LOG" "$C3_LOG" "$C4_LOG"; do
            grep -q "XZOGOT_4P_E2E_CLIENT_ROSTER_GREEN" "$LOG"
            grep -q "XZOGOT_4P_E2E_CLIENT_PROXIES_GREEN" "$LOG"
            grep -q "XZOGOT_4P_E2E_CLIENT_ROUND_GREEN" "$LOG"
            grep -q "XZOGOT_4P_E2E_CLIENT_WORLD_GREEN" "$LOG"
            grep -q "XZOGOT_4P_E2E_CLIENT_EFFECTS_GREEN" "$LOG"
            grep -q "XZOGOT_4P_E2E_CLIENT_STABLE_GREEN" "$LOG"
            grep -q "XZOGOT_4P_E2E_CLIENT_GREEN" "$LOG"
            ! grep -E "SCRIPT ERROR|Parse Error|ERROR: Failed to load script|NETWORK_4P_CLIENT:" "$LOG"
          done
          ! grep -E "SCRIPT ERROR|Parse Error|ERROR: Failed to load script|NETWORK_4P_HOST:" "$HOST_LOG"
          echo "XZOGOT_REAL_4P_ENET_GATE_GREEN"

      - name: Verify public relay fallback selection
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile services/xz-ws-relay/proxy.py
          timeout 60 /tmp/godot/Godot_v4.6.1-stable_linux.x86_64 \
            --headless --path xogot --script res://ci/public_relay_fallback_probe.gd \
            2>&1 | tee build/xogot-ai/public-relay-fallback-probe.log
          grep -q "XZOGOT_PUBLIC_RELAY_CONFIG_GREEN" build/xogot-ai/public-relay-fallback-probe.log
          grep -q "XZOGOT_PUBLIC_EMPTY_DIRECTORY_FALLBACK_GREEN" build/xogot-ai/public-relay-fallback-probe.log
          grep -q "XZOGOT_PUBLIC_RELAY_AUTO_FALLBACK_GREEN" build/xogot-ai/public-relay-fallback-probe.log
          ! grep -E "SCRIPT ERROR|Parse Error|ERROR: Failed to load script|PUBLIC_RELAY_FALLBACK_PROBE:" build/xogot-ai/public-relay-fallback-probe.log
          echo "XZOGOT_PUBLIC_RELAY_SELECTION_GATE_GREEN"

      - name: Verify real four-player WebSocket relay fallback
        shell: bash
        run: |
          set -euo pipefail
          SERVER_LOG="build/xogot-ai/ws-4p-server.log"
          C1_LOG="build/xogot-ai/ws-4p-client1.log"
          C2_LOG="build/xogot-ai/ws-4p-client2.log"
          C3_LOG="build/xogot-ai/ws-4p-client3.log"
          C4_LOG="build/xogot-ai/ws-4p-client4.log"

          timeout 35 /tmp/godot/Godot_v4.6.1-stable_linux.x86_64 \
            --headless --path xogot --script res://ci/network_ws_4p_server.gd \
            >"$SERVER_LOG" 2>&1 &
          SERVER_PID=$!

          for _i in $(seq 1 140); do
            if grep -q "XZOGOT_WS_4P_SERVER_LISTENING" "$SERVER_LOG" 2>/dev/null; then
              break
            fi
            sleep 0.1
          done
          grep -q "XZOGOT_WS_4P_SERVER_LISTENING" "$SERVER_LOG"

          for IDX in 1 2 3 4; do
            timeout 30 /tmp/godot/Godot_v4.6.1-stable_linux.x86_64 \
              --headless --path xogot --script res://ci/network_ws_4p_client.gd -- "client${IDX}" \
              >"build/xogot-ai/ws-4p-client${IDX}.log" 2>&1 &
            eval "C${IDX}_PID=$!"
          done

          set +e
          wait "$C1_PID"; C1_RC=$?
          wait "$C2_PID"; C2_RC=$?
          wait "$C3_PID"; C3_RC=$?
          wait "$C4_PID"; C4_RC=$?
          wait "$SERVER_PID"; SERVER_RC=$?
          set -e

          cat "$SERVER_LOG"
          cat "$C1_LOG"
          cat "$C2_LOG"
          cat "$C3_LOG"
          cat "$C4_LOG"

          test "$SERVER_RC" -eq 0
          test "$C1_RC" -eq 0
          test "$C2_RC" -eq 0
          test "$C3_RC" -eq 0
          test "$C4_RC" -eq 0
          grep -q "XZOGOT_WS_DEDICATED_ZERO_HUMANS_GREEN" "$SERVER_LOG"
          grep -q "XZOGOT_WS_4P_SERVER_ROSTER_GREEN" "$SERVER_LOG"
          grep -q "XZOGOT_WS_4P_SERVER_HUMAN_SLOTS_GREEN 4" "$SERVER_LOG"
          grep -q "XZOGOT_WS_4P_SERVER_STATE_GREEN" "$SERVER_LOG"
          grep -q "XZOGOT_WS_4P_SERVER_STABLE_GREEN" "$SERVER_LOG"
          grep -q "XZOGOT_WS_4P_SERVER_GREEN" "$SERVER_LOG"
          for LOG in "$C1_LOG" "$C2_LOG" "$C3_LOG" "$C4_LOG"; do
            grep -q "XZOGOT_WS_4P_CLIENT_ROSTER_GREEN" "$LOG"
            grep -q "XZOGOT_WS_4P_CLIENT_PROXIES_GREEN" "$LOG"
            grep -q "XZOGOT_WS_4P_CLIENT_STATE_GREEN" "$LOG"
            grep -q "XZOGOT_WS_4P_CLIENT_STABLE_GREEN" "$LOG"
            grep -q "XZOGOT_WS_4P_CLIENT_GREEN" "$LOG"
            ! grep -E "SCRIPT ERROR|Parse Error|ERROR: Failed to load script|WS_4P_CLIENT:" "$LOG"
          done
          ! grep -E "SCRIPT ERROR|Parse Error|ERROR: Failed to load script|WS_4P_SERVER:" "$SERVER_LOG"
          echo "XZOGOT_WS_RELAY_4P_GATE_GREEN"

