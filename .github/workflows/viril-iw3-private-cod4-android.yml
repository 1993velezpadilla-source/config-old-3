name: VIRIL IW3 actual COD4 gun private Android render probe
on:
  workflow_dispatch:
  push:
    branches:
      - feature/viril-iw3-native-weapon-bridge-20261102
    paths:
      - .github/workflows/viril-iw3-private-cod4-android.yml
permissions:
  contents: read
concurrency:
  group: viril-iw3-private-cod4-android-kvm-v2
  cancel-in-progress: false
jobs:
  first-original-gun:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/viril-iw3-native-weapon-bridge-20261102
      - name: Recover user's authentic original COD4 files in runner only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/viril-iw3-private"
          mkdir -p "$D/parts" "$D/oat" "$D/converted"
          gh release download gofile-p2DdQHsz \
            --repo 1993velezpadilla-source/ZOMBIES-2026 \
            --pattern 'C4-Mocs.zip.part-*' --dir "$D/parts"
          python3 scripts/iw3_collect_original_fastfiles.py "$D/parts" "$D/data" > "$D/manifest.json"
          rm -rf "$D/parts"
          curl -fLsS --retry 4 \
            https://github.com/Laupetin/OpenAssetTools/releases/download/v0.34.0/oat-linux.tar.gz \
            -o "$D/oat.tar.gz"
          tar -xf "$D/oat.tar.gz" -C "$D/oat"
          chmod +x "$D/oat/Unlinker"
          "$D/oat/Unlinker" --no-color --model-format glb \
            --include-assets xmodel,weapon,xanim \
            --output-folder "$D/converted" "$D/data/zone/spanish/common_mp.ff" \
            > "$D/oat.log" 2>&1
          python3 - "$D" <<'PY'
          from pathlib import Path
          import shutil,sys,json
          root=Path(sys.argv[1])
          models=list((root/"converted").rglob("*.glb"))
          candidates=[p for p in models if p.stem.startswith("viewmodel_") and p.stem.endswith("_lod0")]
          candidates.sort(key=lambda p:(0 if "usp" in p.name else 1 if "beretta" in p.name else 2,p.name))
          if not candidates:raise SystemExit("Original CoD4 model list contains no weapon LOD0")
          selected=candidates[0]
          (root/"selected").mkdir(exist_ok=True)
          shutil.copy2(selected,root/"selected"/selected.name)
          mapping=[{"vril_viewmodel":"models/weapons/m1911/v_colt.mdl",
                    "iw3_glb":selected.name,"scale":1.0}]
          (root/"mapping.json").write_text(json.dumps(mapping))
          print("Official COD4 3D selected:",selected.name,selected.stat().st_size,"bytes")
          sys.path.insert(0,"scripts")
          from iw3_bind_private_weapon import bind_weapon
          pose=bind_weapon(root/"converted",selected.name,
              "models/weapons/m1911/v_colt.mdl",root/"private_pose")
          print("Original IW3 WeaponDef pose matched:",pose["matched"],
                "numeric pose fields:",pose["numeric_pose_fields"])
          PY
          rm -rf "$D/data" "$D/converted" "$D/oat" "$D/oat.tar.gz"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android native SDK and build private first 3D gun
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" \
            "build-tools;35.0.0" "ndk;27.2.12479018"
          D="$RUNNER_TEMP/viril-iw3-private"
          XZIEL_IW3_WEAPON_DEFS_DIR="$D/private_pose" \
          XZIEL_IW3_WEAPON_MODEL_MAP="$D/private_pose/pose_mapping.json" \
          bash scripts/prepare_viril_iw3_android.sh
          python3 scripts/iw3_private_weapon_pack.py \
            --game-data-zip build/android-project/app/src/main/assets/nzp-data.zip \
            --glb-dir "$D/selected" \
            --manifest "$D/mapping.json" > "$D/private-geometry-report.json"
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile("build/android-project/app/src/main/assets/nzp-data.zip") as z:
              iwvm=z.read("nzp/models/iw3/v_colt.iwvm")
              assert iwvm.startswith(b"IWVM") and len(iwvm)>100
              print("REAL COD4 GUN INCLUDED IN TEMPORARY ANDROID BUILD (NOT PUBLISHED).")
          PY
          (cd build/android-project && ./gradlew --no-daemon :app:assembleDebug)
          test -s build/android-project/app/build/outputs/apk/debug/app-debug.apk
      - name: Enable KVM hardware acceleration for Android emulator
        run: |
          if test -e /dev/kvm; then sudo chmod 666 /dev/kvm; fi
          ls -l /dev/kvm || true
      - name: Android GLES native original COD4 first-person viewmodel test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 3072M
          disk-size: 9000M
          disable-animations: true
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            set -e
            adb install -r build/android-project/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -n com.xziel.viriliw3/org.libsdl.app.NZPActivity --ez xziel_ci_hud_preview true
            sleep 70
            adb shell pidof com.xziel.viriliw3
            adb shell run-as com.xziel.viriliw3 cat files/nzp-runtime/.xziel-stage
            adb exec-out screencap -p > "$RUNNER_TEMP/viril-iw3-private/gameplay-private.png"
            python3 -c 'from pathlib import Path; import struct,os; p=Path(os.environ["RUNNER_TEMP"])/"viril-iw3-private/gameplay-private.png"; d=p.read_bytes(); assert d[:8]==bytes.fromhex("89504e470d0a1a0a") and len(d)>10000; print("Private Android screenshot metadata, size:",len(d),"resolution:",struct.unpack(">II",d[16:24]))'
            adb logcat -d -v brief > "$RUNNER_TEMP/viril-iw3-private/experiment-logcat.txt"
            adb logcat -d -s VIRIL_IW3:I '*:S' | tail -35
            grep -q 'IW3_NATIVE_MESH_DRAW submitted model=models/iw3/v_colt.iwvm' "$RUNNER_TEMP/viril-iw3-private/experiment-logcat.txt"
            grep -q 'IW3_NATIVE_MESH_DRAW submitted model=models/iw3/v_colt.iwvm.*glerr=0' "$RUNNER_TEMP/viril-iw3-private/experiment-logcat.txt"
            echo 'GREEN: ORIGINAL COD4 GUN RENDER SUBMITTED with GLES_NO_ERROR and actual private gameplay screenshot captured'
      - name: Delete ALL extracted game data and private APK without publishing
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/viril-iw3-private" build
          echo "All original CoD4 game data and private APK destroyed. No redistribution."
