name: Aether Source Presentation Metadata

on:
  workflow_dispatch:
  push:
    branches:
      - feature/godot-aaa-rebuild-v1
    paths:
      - ".github/workflows/xogot-aether-presentation-metadata.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: xogot-aether-presentation-metadata
  cancel-in-progress: true

jobs:
  extract:
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_MAPPING_RUN: "37244741312"
    steps:
      - uses: actions/checkout@v5

      - name: Reuse proven UE5.7 mappings
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir="$env:RUNNER_TEMP\mapping-artifact"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          gh run download "$env:SOURCE_MAPPING_RUN" -n aether-waw-usmap-real-weapons -D $dir
          $map=Get-ChildItem $dir -Filter 'Mappings.usmap' -Recurse | Select-Object -First 1
          if (-not $map) { throw 'Mappings.usmap missing from proven Aether export artifact' }
          Copy-Item $map.FullName "$PWD\Mappings.usmap"
          if ((Get-Item "$PWD\Mappings.usmap").Length -lt 4096) { throw 'Mappings.usmap too small' }
          Write-Host "XZOGOT_PRESENTATION_USMAP_READY $((Get-Item "$PWD\Mappings.usmap").Length)"

      - name: Download Project Aether source runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $downloadDir="$env:RUNNER_TEMP\aether-download"
          New-Item -ItemType Directory -Force -Path $downloadDir | Out-Null
          $zip=$null
          for ($attempt=1; $attempt -le 6; $attempt++) {
            Write-Host "XZOGOT_AETHER_DOWNLOAD_ATTEMPT $attempt"
            npx --yes itchio-downloader --url "https://verrial.itch.io/projectaether" --downloadDirectory $downloadDir
            $rc=$LASTEXITCODE
            $zip=Get-ChildItem $downloadDir -Filter '*.zip' -Recurse |
              Sort-Object Length -Descending | Select-Object -First 1
            if ($rc -eq 0 -and $zip) { break }
            if ($attempt -lt 6) {
              $delay=45 + ($attempt * 30)
              Write-Host "XZOGOT_AETHER_DOWNLOAD_BACKOFF seconds=$delay rc=$rc"
              Start-Sleep -Seconds $delay
            }
          }
          if (-not $zip) { throw 'Aether ZIP missing after retry/backoff' }
          $pakRoot="$env:RUNNER_TEMP\aether-paks"
          New-Item -ItemType Directory -Force -Path $pakRoot | Out-Null
          7z x -y $zip.FullName 'ProjectAether/Content/Paks/*' "-o$pakRoot" | Out-Host
          $pakDir=Get-ChildItem $pakRoot -Directory -Recurse |
            Where-Object { $_.Name -eq 'Paks' -and (Get-ChildItem $_.FullName -Filter '*.utoc' -ErrorAction SilentlyContinue) } |
            Select-Object -First 1
          if (-not $pakDir) { throw 'Aether IoStore Paks missing' }
          "AETHER_PAKDIR=$($pakDir.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "XZOGOT_PRESENTATION_PAKS_READY $($pakDir.FullName)"

      - name: Build current CUE4Parse CLI
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Compile CUE4Parse
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src="$env:RUNNER_TEMP\CUE4Parse.CLI"
          $out="$env:RUNNER_TEMP\cue4parse-publish"
          git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/joric/CUE4Parse.CLI.git $src
          git -C $src submodule update --init --recursive --depth 1
          dotnet publish "$src\CUE4Parse.CLI\CUE4Parse.CLI.csproj" -c Release -r win-x64 --self-contained true -p:PublishTrimmed=false -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o $out
          $exe=Get-ChildItem $out -Filter '*.exe' | Sort-Object Length -Descending | Select-Object -First 1
          if (-not $exe) { throw 'CUE4Parse CLI missing' }
          "CUE4PARSE=$($exe.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "XZOGOT_PRESENTATION_CUE4PARSE_READY"

      - name: Discover exact MP40 package paths
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stdout = & "$env:CUE4PARSE" -i "$env:AETHER_PAKDIR" -g GAME_UE5_7 -m "$PWD\Mappings.usmap" -l -p '*MP40*' -p '*mp40*' 2> presentation-mp40-list-stderr.log
          $paths = @($stdout | Where-Object { $_ -match '(?i)mp40' -and $_ -match '(?i)\.uasset$' } | Sort-Object -Unique)
          $paths | Set-Content mp40-packages.txt -Encoding ascii
          if ($paths.Count -lt 1) { throw 'CUE4Parse provider index returned no MP40 uasset paths' }
          Write-Host "XZOGOT_MP40_PROVIDER_PATHS_READY count=$($paths.Count)"
          $paths | ForEach-Object { Write-Host "XZOGOT_MP40_PATH $_" }

      - name: Discover weapon blueprint package paths
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stdout = & "$env:CUE4PARSE" -i "$env:AETHER_PAKDIR" -g GAME_UE5_7 -m "$PWD\Mappings.usmap" -l -p '*Assets/BP/Weapons/*.uasset' 2> presentation-weapon-bp-list-stderr.log
          $paths = @($stdout | Where-Object { $_ -match '(?i)/Assets/BP/Weapons/' -and $_ -match '(?i)\.uasset$' } | Sort-Object -Unique)
          $paths | Set-Content weapon-bp-packages.txt -Encoding ascii
          if ($paths.Count -lt 1) { throw 'CUE4Parse provider index returned no weapon BP uasset paths' }
          Write-Host "XZOGOT_WEAPON_BP_PROVIDER_PATHS_READY count=$($paths.Count)"

      - name: Discover first-person weapon package paths
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stdout = & "$env:CUE4PARSE" -i "$env:AETHER_PAKDIR" -g GAME_UE5_7 -m "$PWD\Mappings.usmap" -l -p '*FirstPerson/Blueprints/Weapons/*.uasset' 2> presentation-firstperson-list-stderr.log
          $paths = @($stdout | Where-Object { $_ -match '(?i)/FirstPerson/Blueprints/Weapons/' -and $_ -match '(?i)\.uasset$' } | Sort-Object -Unique)
          $paths | Set-Content firstperson-weapon-packages.txt -Encoding ascii
          if ($paths.Count -lt 1) { throw 'CUE4Parse provider index returned no FirstPerson weapon uasset paths' }
          Write-Host "XZOGOT_FIRSTPERSON_WEAPON_PATHS_READY count=$($paths.Count)"

      - name: Export first-person weapon and camera authority packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @() | Set-Content presentation-patterns.txt -Encoding ascii
          Get-Content mp40-packages.txt | Add-Content presentation-patterns.txt -Encoding ascii
          Get-Content weapon-bp-packages.txt | Add-Content presentation-patterns.txt -Encoding ascii
          Get-Content firstperson-weapon-packages.txt | Add-Content presentation-patterns.txt -Encoding ascii
          $uniquePatterns = @(Get-Content presentation-patterns.txt | Where-Object { -not [string]::IsNullOrWhiteSpace($_) } | Sort-Object -Unique)
          $uniquePatterns | Set-Content presentation-patterns.txt -Encoding ascii
          Write-Host "XZOGOT_PRESENTATION_PATTERN_SET_GREEN count=$($uniquePatterns.Count)"

          Remove-Item presentation-export -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path presentation-export | Out-Null
          & "$env:CUE4PARSE" -i "$env:AETHER_PAKDIR" -g GAME_UE5_7 -m "$PWD\Mappings.usmap" -c presentation-patterns.txt -o presentation-export -y -v --mesh-format Gltf2 --mesh-quality Highest --export-materials true 2>&1 |
            Tee-Object -FilePath presentation-cue4parse.log

          $files=@(Get-ChildItem presentation-export -Recurse -File)
          if ($files.Count -lt 1) { throw 'Presentation export produced no files' }
          Write-Host "XZOGOT_PRESENTATION_EXPORT_READY files=$($files.Count)"

      - name: Build numeric presentation metadata report
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          from pathlib import Path
          import json,re

          root=Path("presentation-export")
          key_rx=re.compile(r"(ads|aim|offset|camera|viewmodel|viewhands|field.?of.?view|fov|height|stance|weapon|transform|location|rotation|scale|socket|attach|tag|hand)",re.I)
          value_rx=re.compile(r"[-+]?\d+(?:\.\d+)?")
          hits=[]

          def walk(value,path,source):
              if isinstance(value,dict):
                  for k,v in value.items():
                      p=path+[str(k)]
                      if key_rx.search(str(k)):
                          if isinstance(v,(int,float,str)):
                              sv=str(v)
                              if value_rx.search(sv):
                                  hits.append({"source":source,"path":".".join(p),"value":v})
                      walk(v,p,source)
              elif isinstance(value,list):
                  for i,v in enumerate(value):
                      walk(v,path+[str(i)],source)

          json_files=list(root.rglob("*.json"))
          for path in json_files:
              try:
                  data=json.loads(path.read_text(encoding="utf-8-sig",errors="strict"))
              except Exception:
                  continue
              walk(data,[],path.as_posix())

          log=Path("presentation-cue4parse.log").read_text(errors="ignore")
          markers=sorted(set(
              line.strip() for line in log.splitlines()
              if re.search(r"BP_WeaponBase|AetherViewmodel|CameraAnimOffset|Legacy_Viewhands|T7_Viewhands|FirstPerson",line,re.I)
          ))

          base_hits=[h for h in hits if "BP_WeaponBase" in h["source"]]
          mp40_refs=[]
          def scan_refs(value,path,source):
              if isinstance(value,dict):
                  for k,v in value.items():
                      scan_refs(v,path+[str(k)],source)
              elif isinstance(value,list):
                  for i,v in enumerate(value):
                      scan_refs(v,path+[str(i)],source)
              elif isinstance(value,str) and re.search(r"mp40|HandIdleMP40|MP40_SM",value,re.I):
                  mp40_refs.append({"source":source,"path":".".join(path),"value":value})
          for path in json_files:
              try:
                  data=json.loads(path.read_text(encoding="utf-8-sig",errors="strict"))
              except Exception:
                  continue
              scan_refs(data,[],path.as_posix())
          report={
              "schema":1,
              "source":"Project Aether UE5.7 reconstructed first-person presentation packages",
              "bp_weapon_base_numeric_hits":base_hits,
              "mp40_reference_hits":mp40_refs[:5000],
              "mapping_run":37244741312,
              "export_file_count":sum(1 for p in root.rglob("*") if p.is_file()),
              "json_file_count":len(json_files),
              "numeric_property_hit_count":len(hits),
              "numeric_property_hits":hits[:10000],
              "authority_markers":markers[:2000],
              "policy":{
                  "family_offset_guessing_forbidden":True,
                  "godot_binding_requires_source_property_or_authored_hand_tag":True
              }
          }
          Path("aether-presentation-metadata-report.json").write_text(json.dumps(report,indent=2)+"\n",encoding="utf-8")
          print("XZOGOT_PRESENTATION_METADATA_REPORT",report["export_file_count"],report["json_file_count"],report["numeric_property_hit_count"])
          joined="\n".join(markers)
          if not re.search(r"BP_WeaponBase|Legacy_Viewhands|T7_Viewhands|FirstPerson",joined,re.I):
              raise SystemExit("Presentation authority markers were not recovered")
          print("XZOGOT_PRESENTATION_METADATA_SOURCE_GREEN")
          '@ | python -

      - name: Upload source presentation evidence
        uses: actions/upload-artifact@v4
        with:
          name: aether-source-presentation-metadata
          path: |
            aether-presentation-metadata-report.json
            presentation-patterns.txt
            mp40-packages.txt
            weapon-bp-packages.txt
            firstperson-weapon-packages.txt
            presentation-mp40-list-stderr.log
            presentation-firstperson-list-stderr.log
            presentation-weapon-bp-list-stderr.log
            presentation-cue4parse.log
            presentation-export/**
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
