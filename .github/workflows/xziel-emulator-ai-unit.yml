name: XZIEL Emulator AI Unit

on:
  workflow_dispatch:
  push:
    branches:
      - feature/emulator-ai-nacht-v1
    paths:
      - "scripts/xziel_bot/**"
      - "scripts/patch_quakec_emulator_bot_telemetry.py"
      - "scripts/prepare_android.sh"
      - "android/NZPActivity.java"
      - "tests/test_xziel_bot_*.py"
      - ".github/workflows/xziel-emulator-ai-unit.yml"

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile bot package
        run: python -m compileall -q scripts/xziel_bot
      - name: Run policy tests
        run: python -m unittest discover -s tests -p 'test_xziel_bot_*.py' -v

  quakec-telemetry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Clone NZ:P QuakeC
        run: git clone --depth 1 https://github.com/nzp-team/quakec.git build/quakec
      - name: Install NZ:P QuakeC build dependencies
        run: python3 -m pip install --quiet colorama==0.4.6 fastcrc==0.3.0 pandas==2.1.4
      - name: Apply emulator telemetry patch
        run: python3 scripts/patch_quakec_emulator_bot_telemetry.py build/quakec
      - name: Compile patched QuakeC
        run: |
          chmod +x build/quakec/bin/fteqcc-cli-lin build/quakec/tools/qc-compiler-gnu.sh
          cd build/quakec
          bash tools/qc-compiler-gnu.sh
      - name: Verify bytecode
        run: test -s build/quakec/build/standard/progs.dat
