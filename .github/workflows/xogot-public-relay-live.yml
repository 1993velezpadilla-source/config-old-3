name: Xogot Public Relay Live

on:
  workflow_dispatch:
  push:
    branches:
      - feature/church-expansion-v1
    paths:
      - "services/xz-ws-relay/**"
      - "xogot/server/public_ws_dedicated.gd"
      - ".github/workflows/xogot-public-relay-live.yml"

permissions:
  contents: read

concurrency:
  group: xogot-public-session-live
  cancel-in-progress: false

jobs:
  public-wss-multiroom:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for empty reconnect-v4 rooms
        shell: bash
        run: |
          set -euo pipefail
          for _i in $(seq 1 180); do
            HEALTH="$(curl -fsS https://xz-zombie-relay-gateway.onrender.com/health 2>/dev/null || true)"
            ROOMS="$(curl -fsS https://xz-zombie-relay-gateway.onrender.com/v1/rooms 2>/dev/null || true)"
            if python3 - "$HEALTH" "$ROOMS" <<'PY'
          import json, sys
          try:
              health = json.loads(sys.argv[1])
              rooms = json.loads(sys.argv[2]).get("rooms", [])
          except Exception:
              raise SystemExit(1)
          ok = (
              health.get("runtime_contract") == "multiroom-reconnect-v4"
              and health.get("multi_room") is True
              and len(rooms) >= 2
              and all(bool(room.get("ready")) for room in rooms[:2])
              and all(int(room.get("players", -1)) == 0 for room in rooms[:2])
              and all(int(room.get("reserved", 0)) == 0 for room in rooms[:2])
          )
          raise SystemExit(0 if ok else 1)
          PY
            then
              echo "$HEALTH"
              echo "$ROOMS"
              echo "XZ_PUBLIC_MULTIROOM_DEPLOY_GREEN"
              exit 0
            fi
            sleep 2
          done
          echo "Timed out waiting for empty reconnect-v4 rooms" >&2
          exit 1

      - name: Install Godot 4.6.1
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --retry-all-errors --retry-delay 2 \
            https://github.com/godotengine/godot-builds/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip \
            -o /tmp/godot.zip
          rm -rf /tmp/godot /tmp/xz-public-probe
          mkdir -p /tmp/godot /tmp/xz-public-probe
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.6.1-stable_linux.x86_64
          cat > /tmp/xz-public-probe/project.godot <<'EOF'
          config_version=5
          [application]
          config/name="XZ Public Multi-room Probe"
          EOF
          cat > /tmp/xz-public-probe/probe.gd <<'GDSCRIPT'
          extends SceneTree

          const URL := "wss://xz-zombie-relay-gateway.onrender.com/matchmake"
          const CONNECT_TIMEOUT_MS := 45000

          var peers: Array[WebSocketMultiplayerPeer] = []

          func _init() -> void:
              call_deferred("_run")

          func _fail(code: int, message: String) -> void:
              push_error("PUBLIC_WSS_MULTIROOM_PROBE: " + message)
              quit(code)

          func _poll_all() -> int:
              var connected := 0
              for peer: WebSocketMultiplayerPeer in peers:
                  peer.poll()
                  if peer.get_connection_status() == MultiplayerPeer.CONNECTION_CONNECTED:
                      connected += 1
              return connected

          func _add_clients(count: int) -> bool:
              for _index: int in range(count):
                  var peer := WebSocketMultiplayerPeer.new()
                  var err: Error = peer.create_client(URL)
                  if err != OK:
                      _fail(10, "create_client err=" + str(err))
                      return false
                  peers.append(peer)
              return true

          func _wait_for_count(target: int) -> bool:
              var deadline := Time.get_ticks_msec() + CONNECT_TIMEOUT_MS
              while Time.get_ticks_msec() < deadline:
                  if _poll_all() == target:
                      return true
                  await create_timer(0.05).timeout
              return false

          func _run() -> void:
              if not _add_clients(4):
                  return
              if not await _wait_for_count(4):
                  _fail(20, "public room one failed")
                  return
              print("XZ_PUBLIC_WSS_ROOM1_4P_GREEN")

              if not _add_clients(2):
                  return
              if not await _wait_for_count(6):
                  _fail(21, "public room two failed")
                  return
              print("XZ_PUBLIC_WSS_MULTIROOM_6_CONNECTIONS_GREEN")

              var stable_deadline := Time.get_ticks_msec() + 8000
              while Time.get_ticks_msec() < stable_deadline:
                  if _poll_all() != 6:
                      _fail(22, "public connection dropped during stability window")
                      return
                  await create_timer(0.05).timeout

              print("XZ_PUBLIC_WSS_MULTIROOM_6_STABLE_GREEN")
              quit(0)
          GDSCRIPT

      - name: Verify public WSS splits six clients into two rooms
        shell: bash
        run: |
          set -euo pipefail
          /tmp/godot/Godot_v4.6.1-stable_linux.x86_64 \
            --headless --path /tmp/xz-public-probe --script res://probe.gd \
            > /tmp/public-wss-multiroom.log 2>&1 &
          CLIENT_PID=$!

          for _i in $(seq 1 450); do
            if grep -q "XZ_PUBLIC_WSS_MULTIROOM_6_CONNECTIONS_GREEN" /tmp/public-wss-multiroom.log 2>/dev/null; then
              break
            fi
            if ! kill -0 "$CLIENT_PID" 2>/dev/null; then
              cat /tmp/public-wss-multiroom.log
              exit 1
            fi
            sleep 0.1
          done
          grep -q "XZ_PUBLIC_WSS_MULTIROOM_6_CONNECTIONS_GREEN" /tmp/public-wss-multiroom.log

          curl -fsS https://xz-zombie-relay-gateway.onrender.com/v1/rooms | tee /tmp/public-rooms.json
          python3 - <<'PY'
          import json
          with open("/tmp/public-rooms.json", "r", encoding="utf-8") as handle:
              data = json.load(handle)
          rooms = data.get("rooms", [])
          counts = sorted(int(room.get("players", -1)) for room in rooms)
          assert len(rooms) >= 2, data
          assert counts[-2:] == [2, 4], data
          assert all(int(room.get("capacity", 0)) == 4 for room in rooms), data
          print("XZ_PUBLIC_WSS_MULTIROOM_OCCUPANCY_GREEN 4+2")
          PY

          wait "$CLIENT_PID"
          cat /tmp/public-wss-multiroom.log
          grep -q "XZ_PUBLIC_WSS_ROOM1_4P_GREEN" /tmp/public-wss-multiroom.log
          grep -q "XZ_PUBLIC_WSS_MULTIROOM_6_STABLE_GREEN" /tmp/public-wss-multiroom.log
          ! grep -E "SCRIPT ERROR|Parse Error|ERROR: Failed to load script|PUBLIC_WSS_MULTIROOM_PROBE:" /tmp/public-wss-multiroom.log
          echo "XZ_PUBLIC_WSS_MULTIROOM_LIVE_GATE_GREEN"
