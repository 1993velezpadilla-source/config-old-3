name: Xogot MP40 Real Gameplay HIP ADS Acceptance
on:
  workflow_dispatch:
  push:
    branches:
      - fix/source-viewmodel-inherited-hands-unit-scale
    paths:
      - "xogot/ci/mp40_real_gameplay_hip_ads_runtime_probe.gd"
      - "xogot/scripts/weapon.gd"
      - ".github/workflows/xogot-mp40-real-gameplay-hip-ads-probe.yml"
permissions:
  contents: read
jobs:
  mp40-real:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v5
      - name: Install original Godot 4.6.1 renderer
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers
          curl -L --fail --retry 5 --retry-all-errors --retry-delay 2 \
            https://github.com/godotengine/godot-builds/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip -o /tmp/godot.zip
          mkdir -p /tmp/godot /tmp/xogot-mp40-real-hip-ads build/mp40-real
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.6.1-stable_linux.x86_64
      - name: Import original MP40 hands, original gun and Godot scene
        run: |
          set -euo pipefail
          timeout 250 /tmp/godot/Godot_v4.6.1-stable_linux.x86_64 --headless --editor --path xogot --quit 2>&1 | tee build/mp40-real/import.log
          ! grep -E "SCRIPT ERROR|Parse Error" build/mp40-real/import.log
      - name: Three original Godot screenshots prove real in-game HIP ADS and restoration
        run: |
          set -euo pipefail
          timeout 220 xvfb-run -a -s "-screen 0 1280x720x24" \
            /tmp/godot/Godot_v4.6.1-stable_linux.x86_64 --path xogot --audio-driver Dummy \
            --rendering-method gl_compatibility --resolution 1280x720 \
            --script res://ci/mp40_real_gameplay_hip_ads_runtime_probe.gd \
            2>&1 | tee build/mp40-real/render.log
          grep -q "XZOGOT_MP40_REAL_GAMEPLAY_PROOF_GREEN frames=3" build/mp40-real/render.log
          test "$(find /tmp/xogot-mp40-real-hip-ads -maxdepth 1 -name '*.png' | wc -l)" -eq 3
          ! grep -E "SCRIPT ERROR|Parse Error|XZOGOT_MP40_REAL_HIP_ADS_RED" build/mp40-real/render.log
      - name: Preserve individual original HIP ADS HIP screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Xogot-Original-MP40-Full-Game-HIP-ADS-HIP-3PNG
          path: /tmp/xogot-mp40-real-hip-ads/*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve strict Godot runtime logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Xogot-Original-MP40-Full-Game-Acceptance-Logs
          path: build/mp40-real/*.log
          if-no-files-found: warn
          retention-days: 14
