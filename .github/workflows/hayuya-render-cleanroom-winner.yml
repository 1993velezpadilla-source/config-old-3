name: HAYUYA • render cleanroom winner

on:
  push:
    branches:
      - art/hayuya-cleanroom-aaa-v1
    paths:
      - .github/workflows/hayuya-render-cleanroom-winner.yml

permissions:
  actions: read
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Fetch renderer and source reference
        run: |
          set -euo pipefail
          mkdir -p tools/hayuya3d input out/hayuya-cleanroom-winner-preview
          BASE="https://raw.githubusercontent.com/1993velezpadilla-source/config-old-3/${GITHUB_SHA}"
          curl -L --fail --retry 3             "$BASE/tools/hayuya3d/blender_model_preview_pack.py"             -o tools/hayuya3d/blender_model_preview_pack.py
          curl -L --fail --retry 3             "$BASE/tools/hayuya3d/orient_preview_pack.py"             -o tools/hayuya3d/orient_preview_pack.py
          curl -L --fail --retry 3             "$BASE/hayuya/assets/monji-murgucol/geometry/primary.webp"             -o input/front_reference.webp

      - name: Download cleanroom winner from Run 17
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api             repos/${GITHUB_REPOSITORY}/actions/artifacts/11268740676/zip             > input/final.zip
          mkdir -p input/final
          unzip -q input/final.zip -d input/final
          find input/final -type f -maxdepth 4 -print
          WINNER="$(find input/final -type f -name 'winner.glb' -print -quit)"
          test -n "$WINNER"
          cp "$WINNER" input/winner.glb
          test -s input/winner.glb

      - name: Set up cleanup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install cleanup + renderer dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy trimesh
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender xvfb python3-pil python3-numpy

      - name: Strip generated support slabs
        run: |
          set -euo pipefail
          cp input/winner.glb input/winner.raw.glb
          python tools/hayuya3d/support_plane_cleanup.py input/winner.glb \
            | tee out/hayuya-cleanroom-winner-preview/support_cleanup.log
          test -s input/winner.glb

      - name: Render winner preview pack
        run: |
          set -euo pipefail
          xvfb-run -a blender --python-exit-code 1 -b             --python tools/hayuya3d/blender_model_preview_pack.py --             --input input/winner.glb             --output-dir out/hayuya-cleanroom-winner-preview             --size 1024

      - name: Orient from original front reference
        run: |
          set -euo pipefail
          python tools/hayuya3d/orient_preview_pack.py             --reference input/front_reference.webp             --render-dir out/hayuya-cleanroom-winner-preview

      - name: Verify full-body safe margins
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import numpy as np

          root = Path("out/hayuya-cleanroom-winner-preview")
          names = [
              "front", "three_quarter", "side", "opposite",
              "three_quarter_opposite", "side_opposite",
          ]
          report = {}
          for name in names:
              img = np.asarray(Image.open(root / f"{name}.png").convert("RGB"))
              h, w, _ = img.shape
              s = 24
              corners = np.concatenate([
                  img[:s,:s].reshape(-1,3),
                  img[:s,-s:].reshape(-1,3),
                  img[-s:,:s].reshape(-1,3),
                  img[-s:,-s:].reshape(-1,3),
              ])
              bg = np.median(corners.astype(np.float32), axis=0)
              dist = np.linalg.norm(img.astype(np.float32) - bg[None,None,:], axis=2)
              ys, xs = np.where(dist > 18.0)
              if not len(xs):
                  raise SystemExit(f"{name}: no foreground detected")
              margins = {
                  "left": int(xs.min()) / w,
                  "top": int(ys.min()) / h,
                  "right": (w - 1 - int(xs.max())) / w,
                  "bottom": (h - 1 - int(ys.max())) / h,
              }
              report[name] = margins
              if min(margins.values()) < 0.02:
                  raise SystemExit(f"{name}: unsafe margin {margins}")
          print("HAYUYA_CLEANROOM_WINNER_PREVIEW_GREEN", report)
          PY

      - name: Preserve winner metadata
        run: |
          set -euo pipefail
          cp input/final/cleanroom_aggregate.json             out/hayuya-cleanroom-winner-preview/cleanroom_aggregate.json

      - uses: actions/upload-artifact@v4
        with:
          name: hayuya-cleanroom-winner-preview
          path: out/hayuya-cleanroom-winner-preview/**
          if-no-files-found: error
          retention-days: 5
