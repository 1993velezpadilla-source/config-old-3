name: Extract Aether Knife Hands Machines

on:
  workflow_dispatch:
  push:
    branches:
      - feature/church-expansion-v1
    paths:
      - ".github/workflows/xogot-aether-knife-hands-machines.yml"

permissions:
  contents: read

concurrency:
  group: xogot-aether-knife-hands-machines
  cancel-in-progress: true

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: Download public Project Aether payload
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full xz-utils
          mkdir -p "$RUNNER_TEMP/aether-download"
          npx --yes itchio-downloader             --url "https://verrial.itch.io/projectaether"             --downloadDirectory "$RUNNER_TEMP/aether-download"
          FILE=$(find "$RUNNER_TEMP/aether-download" -type f -name '*.zip' -printf '%s\t%p\n' | sort -nr | head -1 | cut -f2-)
          test -s "$FILE"
          echo "PAYLOAD=$FILE" >> "$GITHUB_ENV"
          echo "XZOGOT_AETHER_INTERACTIVE_PAYLOAD_GREEN"

      - name: Build searchable legacy pak
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aether-paks"
          7z x -y "$PAYLOAD" 'ProjectAether/Content/Paks/*' -o"$RUNNER_TEMP/aether-paks" >/dev/null
          rm -f "$PAYLOAD"
          PAKDIR="$RUNNER_TEMP/aether-paks/ProjectAether/Content/Paks"
          test -d "$PAKDIR"

          curl -fL --retry 5             https://github.com/trumank/retoc/releases/download/v0.1.5/retoc_cli-x86_64-unknown-linux-gnu.tar.xz             -o "$RUNNER_TEMP/retoc.tar.xz"
          mkdir -p "$RUNNER_TEMP/retoc"
          tar -xJf "$RUNNER_TEMP/retoc.tar.xz" -C "$RUNNER_TEMP/retoc"
          RETOC=$(find "$RUNNER_TEMP/retoc" -type f -name 'retoc*' -perm -111 | head -1)

          curl -fL --retry 5             https://github.com/trumank/repak/releases/download/v0.2.3/repak_cli-x86_64-unknown-linux-gnu.tar.xz             -o "$RUNNER_TEMP/repak.tar.xz"
          mkdir -p "$RUNNER_TEMP/repak"
          tar -xJf "$RUNNER_TEMP/repak.tar.xz" -C "$RUNNER_TEMP/repak"
          REPAK=$(find "$RUNNER_TEMP/repak" -type f -name 'repak*' -perm -111 | head -1)

          "$RETOC" to-legacy "$PAKDIR" "$RUNNER_TEMP/aether-legacy.pak"
          test -s "$RUNNER_TEMP/aether-legacy.pak"
          echo "REPAK=$REPAK" >> "$GITHUB_ENV"
          echo "AETHER_LEGACY=$RUNNER_TEMP/aether-legacy.pak" >> "$GITHUB_ENV"
          echo "XZOGOT_AETHER_INTERACTIVE_LEGACY_GREEN"

      - name: Census knife hands and interactive machines
        shell: bash
        run: |
          set -euo pipefail
          rm -rf interactive-census
          mkdir -p interactive-census/raw
          "$REPAK" list "$AETHER_LEGACY" > interactive-census/all_paths.txt
          python3 - <<'PY'
          from pathlib import Path
          import json,re

          lines=[
              x.strip().replace("\\","/")
              for x in Path("interactive-census/all_paths.txt").read_text(errors="ignore").splitlines()
              if x.strip()
          ]

          categories={
              "knife_melee": [],
              "first_person_hands": [],
              "perk_soda_machines": [],
              "pack_upgrade_machines": [],
              "machine_audio": [],
          }

          knife_rx=re.compile(r"(knife|melee|stab|bayonet|slash|combat.?knife|bowie)",re.I)
          hands_rx=re.compile(r"(view.?hands|first.?person.?hands|/hands/|/anims/hands/|view.?arms|/arms/|handrig|hand_rig)",re.I)
          perk_rx=re.compile(r"(perk|jugger|revive|speed.?cola|double.?tap|stamin|deadshot|mule.?kick|soda|vending)",re.I)
          pap_rx=re.compile(r"(pack.?a.?punch|packapunch|pap_|upgrade.?machine|weapon.?upgrade)",re.I)
          machine_audio_rx=re.compile(r"(perk|jugger|revive|speed.?cola|double.?tap|pack.?a.?punch|vending|soda).*(sound|audio|sfx)|(?:sound|audio|sfx).*(perk|jugger|revive|speed.?cola|double.?tap|pack.?a.?punch)",re.I)

          for line in lines:
              if knife_rx.search(line):
                  categories["knife_melee"].append(line)
              if hands_rx.search(line):
                  categories["first_person_hands"].append(line)
              if perk_rx.search(line):
                  categories["perk_soda_machines"].append(line)
              if pap_rx.search(line):
                  categories["pack_upgrade_machines"].append(line)
              if machine_audio_rx.search(line):
                  categories["machine_audio"].append(line)

          for key in categories:
              categories[key]=sorted(set(categories[key]))

          out={
              "schema":1,
              "source":"Project Aether public reconstructed build",
              "counts":{k:len(v) for k,v in categories.items()},
              "categories":categories,
          }
          Path("interactive-census/interactive_asset_paths.json").write_text(json.dumps(out,indent=2)+"\n")
          for key,vals in categories.items():
              Path(f"interactive-census/{key}.txt").write_text("\n".join(vals)+"\n")
              print("XZOGOT_AETHER_INTERACTIVE_CENSUS",key,len(vals))
          assert out["counts"]["knife_melee"]>0, out["counts"]
          assert out["counts"]["first_person_hands"]>0, out["counts"]
          print("XZOGOT_AETHER_KNIFE_HANDS_CENSUS_GREEN",out["counts"])
          PY

      - name: Extract exact raw candidate packages
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,shlex
          d=json.loads(Path("interactive-census/interactive_asset_paths.json").read_text())
          keep=[]
          for key in ("knife_melee","first_person_hands","perk_soda_machines","pack_upgrade_machines","machine_audio"):
              keep.extend(d["categories"][key])
          # UE asset triplets are adjacent by stem; keep unique exact package paths.
          keep=sorted(set(x for x in keep if x.startswith("ProjectAether/Content/")))
          # Cap candidate extraction to avoid dragging the whole game into the proof artifact.
          if len(keep)>1400:
              keep=keep[:1400]
          Path("interactive-census/extract_paths.txt").write_text("\n".join(keep)+"\n")
          print("XZOGOT_AETHER_INTERACTIVE_EXTRACT_PATHS",len(keep))
          PY

          args=(unpack "$AETHER_LEGACY" -o interactive-census/raw --force)
          while IFS= read -r asset; do
            [ -n "$asset" ] || continue
            args+=(-i "$asset")
          done < interactive-census/extract_paths.txt
          "$REPAK" "${args[@]}" >/dev/null 2>&1 || true

          find interactive-census/raw -type f | sort > interactive-census/raw_files.txt
          python3 - <<'PY'
          from pathlib import Path
          files=[p for p in Path("interactive-census/raw").rglob("*") if p.is_file()]
          total=sum(p.stat().st_size for p in files)
          print("XZOGOT_AETHER_INTERACTIVE_RAW_GREEN",len(files),total)
          assert len(files)>0
          PY

      - name: Upload knife hands and machine source proof
        uses: actions/upload-artifact@v4
        with:
          name: aether-knife-hands-machines-source
          path: |
            interactive-census/interactive_asset_paths.json
            interactive-census/knife_melee.txt
            interactive-census/first_person_hands.txt
            interactive-census/perk_soda_machines.txt
            interactive-census/pack_upgrade_machines.txt
            interactive-census/machine_audio.txt
            interactive-census/extract_paths.txt
            interactive-census/raw_files.txt
            interactive-census/raw/
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
