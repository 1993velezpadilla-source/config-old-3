          base_cost=int(cdo_prop("Cost"))
          time_to_raise=float(cdo_prop("TimetoRaise"))
          time_to_fall=float(cdo_prop("TimetoFall"))
          cycle_time=float(cdo_prop("time"))
          gum_rows=cdo_prop("Gobblegum")
          gum_pool=[
              str(row.get("Value",""))
              for row in gum_rows
              if isinstance(row,dict)
          ]
          if (
              base_cost!=950
              or abs(time_to_raise-5.5)>0.001
              or abs(time_to_fall-8.0)>0.001
              or abs(cycle_time-10.0)>0.001
              or gum_pool!=[
                  "ammo","Firesale1","Instagum",
                  "nuke","DoublePointsDrop","Weapon",
              ]
          ):
