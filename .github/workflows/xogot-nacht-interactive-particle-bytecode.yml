name: Xogot Nacht Interactive Particle Bytecode

on:
  workflow_dispatch:
  push:
    branches:
      - feature/godot-aaa-rebuild-v1
    paths:
      - ".github/workflows/xogot-nacht-interactive-particle-bytecode.yml"

permissions:
  contents: read

concurrency:
  group: xogot-nacht-interactive-particle-bytecode
  cancel-in-progress: true

jobs:
  extract:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      WORKSHOP_APP_ID: "555160"
      WORKSHOP_ITEM_ID: "2755515831"
      XZOGOT_ENGINE_VERSION: "VER_UE4_21"

    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/godot-aaa-rebuild-v1

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Download exact Nacht source and select interactive Blueprints
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $steam=Join-Path $env:RUNNER_TEMP 'steamcmd'
          New-Item -ItemType Directory -Force -Path $steam | Out-Null
          Invoke-WebRequest 'https://steamcdn-a.akamaihd.net/client/installer/steamcmd.zip' -OutFile "$env:RUNNER_TEMP\steamcmd.zip"
          Expand-Archive "$env:RUNNER_TEMP\steamcmd.zip" -DestinationPath $steam -Force
          & (Join-Path $steam 'steamcmd.exe') +login anonymous +workshop_download_item $env:WORKSHOP_APP_ID $env:WORKSHOP_ITEM_ID validate +quit
          $global:LASTEXITCODE=0

          $root=Get-ChildItem $steam,$env:RUNNER_TEMP -Directory -Recurse -ErrorAction SilentlyContinue |
            Where-Object {$_.FullName -like "*steamapps\workshop\content\$env:WORKSHOP_APP_ID\$env:WORKSHOP_ITEM_ID"} |
            Select-Object -First 1
          if(-not $root){throw 'Nacht workshop payload not found'}
          $pak=Join-Path $root.FullName 'WindowsNoEditor.pak'
          if(-not (Test-Path $pak)){throw 'Nacht PAK missing'}
          if((Get-Item $pak).Length -ne 2543506907){throw 'Nacht PAK byte authority mismatch'}

          Invoke-WebRequest 'https://github.com/trumank/repak/releases/download/v0.2.3/repak_cli-x86_64-pc-windows-msvc.zip' -OutFile "$env:RUNNER_TEMP\repak.zip"
          $repakDir="$env:RUNNER_TEMP\repak"
          Expand-Archive "$env:RUNNER_TEMP\repak.zip" -DestinationPath $repakDir -Force
          $repak=Get-ChildItem $repakDir -Filter repak.exe -Recurse | Select-Object -First 1
          if(-not $repak){throw 'repak missing'}

          & $repak.FullName list $pak | Set-Content build-all-paths.txt -Encoding utf8
          @'
          import re
          from pathlib import Path
          lines=sorted(set(
              x.strip().replace("\\","/")
              for x in Path("build-all-paths.txt").read_text(encoding="utf-8-sig",errors="ignore").splitlines()
              if x.strip()
          ))
          wanted={
              "machinegumball.uasset",
              "punchapackmachine.uasset",
              "wonderfizz.uasset",
              "box5.uasset",
              "box_complete.uasset",
          }
          uassets=[
              x for x in lines
              if Path(x).name.lower() in wanted
              and "/Blueprints/" in x.replace("\\","/")
          ]
          if not uassets:
              raise SystemExit("no interactive Blueprint uassets selected")
          bases={re.sub(r"(?i)\.uasset$","",x) for x in uassets}
          selected=[
              x for x in lines
              if any(x.lower().startswith(base.lower()+".") for base in bases)
          ]
          Path("interactive-blueprint-uassets.txt").write_text("\n".join(uassets)+"\n",encoding="utf-8")
          Path("interactive-blueprint-files.txt").write_text("\n".join(selected)+"\n",encoding="utf-8")
          print("XZOGOT_NACHT_INTERACTIVE_PARTICLE_SELECT",{
              "uassets":len(uassets),
              "files":len(selected),
              "names":[Path(x).name for x in uassets],
          })
          selected_names={Path(x).name.lower() for x in uassets}
          assert "machinegumball.uasset" in selected_names,selected_names
          assert "punchapackmachine.uasset" in selected_names,selected_names
          assert "wonderfizz.uasset" in selected_names,selected_names
          assert "box_complete.uasset" in selected_names,selected_names
          '@ | python -

          Remove-Item nacht-interactive-bytecode -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path nacht-interactive-bytecode | Out-Null
          $args=@('unpack',$pak,'-o','nacht-interactive-bytecode','--force')
          Get-Content interactive-blueprint-files.txt | ForEach-Object {
            if($_){$args += @('-i',$_)}
          }
          & $repak.FullName @args
          if($LASTEXITCODE -ne 0){throw "selective repak failed $LASTEXITCODE"}
          $global:LASTEXITCODE=0
          Write-Host "XZOGOT_NACHT_INTERACTIVE_PARTICLE_SOURCE_GREEN"

      - name: Pin Pavlov UE4 mappings
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Invoke-WebRequest 'https://raw.githubusercontent.com/THW-Reaper/PavlovVRMappings/4976647b4f3a209042460bc55a7a3122662d05b7/PavMappings.usmap' -OutFile PavMappings.usmap
          $hash=(Get-FileHash PavMappings.usmap -Algorithm SHA256).Hash.ToLowerInvariant()
          if($hash -ne '6d19f9731cc3fbaba34ca8e0833e81e4ffdf1b407edf24de48b1ccb5c63b060c'){throw "mappings mismatch $hash"}

      - name: Build proven Blueprint bytecode extractor
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $project='tools/maps/UENuketownWallbuyBytecode/UENuketownWallbuyBytecode.csproj'
          dotnet restore $project
          if($LASTEXITCODE -ne 0){throw 'restore failed'}
          dotnet build $project -c Release --no-restore
          if($LASTEXITCODE -ne 0){throw 'build failed'}
          Write-Host 'XZOGOT_NACHT_INTERACTIVE_PARTICLE_BYTECODE_TOOL_GREEN'

      - name: Decompile interactive Blueprint bytecode
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force -Path build/nacht-interactive-particle-bytecode | Out-Null
          $app='tools/maps/UENuketownWallbuyBytecode/bin/Release/net10.0/UENuketownWallbuyBytecode.dll'
          $assets=@(
            Get-Content interactive-blueprint-uassets.txt | ForEach-Object {
              $relative=$_.Replace('/','\\')
              $full=Join-Path (Resolve-Path nacht-interactive-bytecode).Path $relative
              if(-not (Test-Path $full)){throw "selected Blueprint missing after unpack: $_"}
              Get-Item $full
            }
          )
          if($assets.Count -lt 3){throw "too few selected Blueprint assets: $($assets.Count)"}
          Write-Host "XZOGOT_NACHT_INTERACTIVE_PARTICLE_EXACT_ASSETS $($assets.Name -join ',')"

          $index=0
          foreach($asset in $assets){
            $stem=[IO.Path]::GetFileNameWithoutExtension($asset.Name)
            $out="build/nacht-interactive-particle-bytecode/asset-$('{0:D2}' -f $index)-$stem.json"
            $log="build/nacht-interactive-particle-bytecode/asset-$('{0:D2}' -f $index)-$stem.log"
            dotnet $app PavMappings.usmap $out $asset.FullName 2>&1 | Tee-Object $log
            if($LASTEXITCODE -ne 0){throw "bytecode extractor failed $LASTEXITCODE asset=$($asset.FullName)"}
            if(-not (Select-String -Path $log -Pattern 'XZOGOT_NUKETOWN_WALLBUY_BYTECODE_GREEN' -Quiet)){
              throw "bytecode green marker missing asset=$($asset.FullName)"
            }
            $index++
          }

          @'
          import json
          from pathlib import Path

          files=sorted(Path("build/nacht-interactive-particle-bytecode").glob("asset-*.json"))
          if len(files) < 3:
              raise SystemExit(f"too few bytecode json files: {len(files)}")
          docs=[json.loads(p.read_text()) for p in files]
          numeric=[
              "assetCount","packageSuccessCount","failureCount","parsedFunctions",
              "parsedExpressions","integerConstants","parsedDataTableRows",
              "parsedExportDefaults",
          ]
          merged={
              "schemaVersion":docs[0].get("schemaVersion",1),
              "engineVersion":docs[0].get("engineVersion"),
              **{key:sum(int(d.get(key,0)) for d in docs) for key in numeric},
              "packages":[p for d in docs for p in d.get("packages",[])],
              "failures":[x for d in docs for x in d.get("failures",[])],
              "ready":all(bool(d.get("ready",False)) for d in docs),
          }
          Path("build/nacht-interactive-particle-bytecode/blueprint-bytecode.json").write_text(
              json.dumps(merged,indent=2)+"\n"
          )
          print("XZOGOT_NACHT_INTERACTIVE_PARTICLE_BYTECODE_MERGE_GREEN",{
              "files":len(files),
              "packages":len(merged["packages"]),
              "failures":len(merged["failures"]),
              "ready":merged["ready"],
          })
          if not merged["ready"] or merged["failureCount"] != 0:
              raise SystemExit("merged interactive bytecode is not GREEN")
          '@ | python -

      - name: Extract exact particle activation authority
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          @'
          import json,re
          from pathlib import Path

          src=Path("build/nacht-interactive-particle-bytecode/blueprint-bytecode.json")
          data=json.loads(src.read_text())
          assert data.get("ready") is True,data
          assert int(data.get("packageSuccessCount",0)) >= 3,data

          call_rx=re.compile(r"(activate|deactivate|setactive|toggleactive|resetparticlesystem|play|stop)",re.I)
          component_rx=re.compile(
              r"(particle|fog|beam|spark|wheel|mystery|acidball|monster_death|quadexplodesmoke)",
              re.I,
          )

          def ptr_name(value):
              if not isinstance(value,str):
                  return ""
              parts=value.split(":",2)
              return parts[2] if len(parts)==3 else value

          def ptr_old(node):
              if not isinstance(node,dict):
                  return ""
              return str((node.get("Variable") or node.get("Value") or {}).get("Old",""))

          def parameter_bool(node,default=False):
              if not isinstance(node,dict):
                  return default
              kind=str(node.get("$type",""))
              if kind=="EX_True":
                  return True
              if kind=="EX_False":
                  return False
              value=node.get("Value")
              if isinstance(value,bool):
                  return value
              return default

          def context_call(expr):
              if not isinstance(expr,dict) or expr.get("$type")!="EX_Context":
                  return ""
              ctx=expr.get("ContextExpression") or {}
              return str(ctx.get("VirtualFunctionName") or ctx.get("StackNode") or "")

          def normalized_action(package_name,function_name,top,target_mode,component_name=""):
              expr=top.get("expression") or {}
              ctx=expr.get("ContextExpression") or {}
              call=str(ctx.get("VirtualFunctionName") or ctx.get("StackNode") or "")
              op=call.rsplit(".",1)[-1]
              if op not in ("Activate","Deactivate","SetActive"):
                  return None
              params=ctx.get("Parameters") or []
              active=True
              reset=False
              if op=="Deactivate":
                  active=False
              elif op=="Activate":
                  active=True
                  reset=parameter_bool(params[0],False) if params else False
              elif op=="SetActive":
                  active=parameter_bool(params[0],False) if params else False
                  reset=parameter_bool(params[1],False) if len(params)>1 else False
              return {
                  "fileName":package_name,
                  "blueprintName":Path(package_name).stem,
                  "function":function_name,
                  "startOffset":int(top.get("startOffset",-1)),
                  "endOffset":int(top.get("endOffset",-1)),
                  "targetMode":target_mode,
                  "componentName":component_name,
                  "operation":op,
                  "active":active,
                  "reset":reset,
              }

          def resolves_particle_component_loop(top_rows,index):
              # Prove the local target comes from:
              # Actor.GetComponentsByClass(ParticleSystemComponent)
              # -> KismetArrayLibrary.Array_Get -> SetActive.
              expr=top_rows[index].get("expression") or {}
              obj=expr.get("ObjectExpression") or {}
              if obj.get("$type")!="EX_LocalVariable":
                  return False
              item_ptr=ptr_old(obj)
              if not item_ptr:
                  return False

              array_ptr=""
              for prior in reversed(top_rows[:index]):
                  pe=prior.get("expression") or {}
                  if pe.get("$type")!="EX_Context":
                      continue
                  pc=pe.get("ContextExpression") or {}
                  stack=str(pc.get("StackNode",""))
                  if not stack.endswith("KismetArrayLibrary.Array_Get"):
                      continue
                  params=pc.get("Parameters") or []
                  if len(params)<3 or ptr_old(params[2])!=item_ptr:
                      continue
                  array_ptr=ptr_old(params[0])
                  break
              if not array_ptr:
                  return False

              for prior in reversed(top_rows[:index]):
                  pe=prior.get("expression") or {}
                  if pe.get("$type")!="EX_Let":
                      continue
                  value=pe.get("Value") or {}
                  if str(value.get("Old",""))!=array_ptr:
                      continue
                  assignment=pe.get("Expression") or {}
                  if assignment.get("$type")!="EX_FinalFunction":
                      continue
                  if not str(assignment.get("StackNode","")).endswith("Actor.GetComponentsByClass"):
                      continue
                  params=assignment.get("Parameters") or []
                  if not params:
                      continue
                  cls=params[0] if isinstance(params[0],dict) else {}
                  if "ParticleSystemComponent" in str(cls.get("Value","")):
                      return True
              return False

          rows=[]
          normalized=[]
          total_calls=0
          total_trees=0
          for package in data.get("packages",[]):
              package_name=str(package.get("fileName",""))
              item={
                  "fileName":package_name,
                  "calls":[],
                  "expressionTrees":[],
                  "objectReferences":[],
                  "defaults":[],
              }

              particle_component_names=set()
              for ref in package.get("objectReferences",[]):
                  blob=json.dumps(ref,sort_keys=True)
                  if component_rx.search(blob):
                      item["objectReferences"].append(ref)
                  if (
                      str(ref.get("propertyName",""))=="Template"
                      and str(ref.get("objectName","")).endswith("_GEN_VARIABLE")
                      and component_rx.search(blob)
                  ):
                      particle_component_names.add(
                          str(ref.get("objectName",""))[:-len("_GEN_VARIABLE")]
                      )

              for row in package.get("normalExportProperties",[]):
                  if component_rx.search(json.dumps(row,sort_keys=True)):
                      item["defaults"].append(row)

              for fn in package.get("functions",[]):
                  fn_name=str(fn.get("name",""))
                  for call in fn.get("calls",[]):
                      if call_rx.search(str(call.get("call",""))):
                          item["calls"].append({"function":fn_name,**call})

                  top_rows=fn.get("topLevelExpressions",[]) or []
                  for index,top in enumerate(top_rows):
                      blob=json.dumps(top,sort_keys=True)
                      if call_rx.search(blob) and component_rx.search(blob):
                          item["expressionTrees"].append({
                              "function":fn_name,
                              "tree":top,
                          })

                      expr=top.get("expression") or {}
                      call=context_call(expr)
                      op=call.rsplit(".",1)[-1]
                      if op not in ("Activate","Deactivate","SetActive"):
                          continue

                      obj=expr.get("ObjectExpression") or {}
                      if obj.get("$type")=="EX_InstanceVariable":
                          component=ptr_name(ptr_old(obj))
                          if component in particle_component_names:
                              action=normalized_action(
                                  package_name,fn_name,top,
                                  "named_component",component
                              )
                              if action:
                                  normalized.append(action)
                      elif (
                          op=="SetActive"
                          and resolves_particle_component_loop(top_rows,index)
                      ):
                          action=normalized_action(
                              package_name,fn_name,top,
                              "all_particle_components"
                          )
                          if action:
                              action["sourceTargetProof"]=(
                                  "Actor.GetComponentsByClass(ParticleSystemComponent)"
                                  "->Array_Get"
                              )
                              normalized.append(action)

              total_calls += len(item["calls"])
              total_trees += len(item["expressionTrees"])
              rows.append(item)
              print("XZOGOT_NACHT_INTERACTIVE_PARTICLE_BLUEPRINT",json.dumps({
                  "fileName":item["fileName"],
                  "activationCalls":len(item["calls"]),
                  "activationTrees":len(item["expressionTrees"]),
                  "particleRefs":len(item["objectReferences"]),
                  "particleDefaults":len(item["defaults"]),
                  "normalizedActions":sum(
                      1 for a in normalized if a["fileName"]==package_name
                  ),
                  "calls":item["calls"][:80],
              },separators=(",",":")))

          # Current source package contract. These counts are derived from the
          # UE4.21 bytecode above, not hand-authored gameplay guesses.
          expected={
              "Box_complete.uasset":2,
              "MachineGumball.uasset":4,
              "WonderFizz.uasset":10,
              "PunchAPackMachine.uasset":1,
          }
          actual={
              name:sum(1 for a in normalized if a["fileName"]==name)
              for name in expected
          }
          if actual!=expected:
              raise SystemExit(
                  f"normalized particle activation mismatch actual={actual} expected={expected}"
              )
          if len(normalized)!=17:
              raise SystemExit(f"normalized action count mismatch {len(normalized)}/17")
          generic=[
              a for a in normalized
              if a["targetMode"]=="all_particle_components"
          ]
          if len(generic)!=1 or generic[0]["fileName"]!="PunchAPackMachine.uasset":
              raise SystemExit(f"PaP class-wide particle action mismatch {generic}")

          # Preserve every public/custom Blueprint function entry into the
          # generated ExecuteUbergraph. These are source-authored event entry
          # offsets and let the runtime bind named UE events without guessing
          # from nearby bytecode locations.
          entry_points=[]
          for package in data.get("packages",[]):
              package_name=str(package.get("fileName",""))
              blueprint_name=Path(package_name).stem
              uber_name=f"ExecuteUbergraph_{blueprint_name}"
              for fn in package.get("functions",[]):
                  fn_name=str(fn.get("name",""))
                  if fn_name==uber_name:
                      continue
                  for top in fn.get("topLevelExpressions",[]) or []:
                      expr=top.get("expression") or {}
                      if expr.get("$type")!="EX_FinalFunction":
                          continue
                      stack=str(expr.get("StackNode",""))
                      if not stack.endswith(uber_name):
                          continue
                      params=expr.get("Parameters") or []
                      if (
                          len(params)!=1
                          or not isinstance(params[0],dict)
                          or params[0].get("$type")!="EX_IntConst"
                      ):
                          continue
                      entry_points.append({
                          "fileName":package_name,
                          "blueprintName":blueprint_name,
                          "function":fn_name,
                          "entryOffset":int(params[0].get("Value",-1)),
                      })
          entry_points.sort(
              key=lambda r:(r["fileName"],r["entryOffset"],r["function"])
          )
          if not entry_points:
              raise SystemExit("no Blueprint Ubergraph entry points resolved")
          if len({
              (r["fileName"],r["function"],r["entryOffset"])
              for r in entry_points
          }) != len(entry_points):
              raise SystemExit("duplicate Blueprint entry point rows")
          print(
              "XZOGOT_NACHT_INTERACTIVE_PARTICLE_ENTRYPOINTS_GREEN",
              f"entries={len(entry_points)}",
              json.dumps({
                  name:sum(1 for r in entry_points if r["fileName"]==name)
                  for name in sorted({r["fileName"] for r in entry_points})
              },separators=(",",":"))
          )

          latent_delays=[]
          for package in data.get("packages",[]):
              package_name=str(package.get("fileName",""))
              for fn in package.get("functions",[]):
                  fn_name=str(fn.get("name",""))
                  for top in fn.get("topLevelExpressions",[]) or []:
                      expr=top.get("expression") or {}
                      if expr.get("$type")!="EX_Context":
                          continue
                      ctx=expr.get("ContextExpression") or {}
                      if not str(ctx.get("StackNode","")).endswith(
                          "KismetSystemLibrary.Delay"
                      ):
                          continue
                      params=ctx.get("Parameters") or []
                      if (
                          len(params)<3
                          or not isinstance(params[1],dict)
                          or params[1].get("$type")!="EX_FloatConst"
                      ):
                          continue
                      duration=float(params[1].get("Value",0.0))
                      latent=params[2] if isinstance(params[2],dict) else {}
                      resume_offset=None
                      uuid=None
                      linkage=None
                      for value in latent.get("Value",[]) or []:
                          if not isinstance(value,dict):
                              continue
                          kind=value.get("$type")
                          if kind=="EX_SkipOffsetConst":
                              resume_offset=int(value.get("Value",-1))
                          elif kind=="EX_IntConst" and uuid is None:
                              uuid=int(value.get("Value",0))
                          elif kind=="EX_NameConst":
                              linkage=str(value.get("Value",""))
                      latent_delays.append({
                          "fileName":package_name,
                          "function":fn_name,
                          "startOffset":int(top.get("startOffset",-1)),
                          "endOffset":int(top.get("endOffset",-1)),
                          "durationSeconds":duration,
                          "resumeOffset":resume_offset,
                          "uuid":uuid,
                          "linkage":linkage,
                      })
          latent_delays.sort(
              key=lambda r:(r["fileName"],r["function"],r["startOffset"])
          )
          delay_counts={
              name:sum(1 for r in latent_delays if r["fileName"]==name)
              for name in sorted({r["fileName"] for r in latent_delays})
          }
          expected_delay_counts={
              "Box5.uasset":2,
              "Box_complete.uasset":1,
              "MachineGumball.uasset":14,
              "PunchAPackMachine.uasset":4,
              "WonderFizz.uasset":16,
          }
          if delay_counts!=expected_delay_counts:
              raise SystemExit(
                  f"latent Delay authority mismatch actual={delay_counts} "
                  f"expected={expected_delay_counts}"
              )
          if len(latent_delays)!=37:
              raise SystemExit(f"latent Delay count mismatch {len(latent_delays)}/37")
          print(
              "XZOGOT_NACHT_INTERACTIVE_PARTICLE_DELAYS_GREEN",
              f"delays={len(latent_delays)}",
              json.dumps(delay_counts,separators=(",",":"))
          )

          visibility_actions=[]
          for package in data.get("packages",[]):
              package_name=str(package.get("fileName",""))
              for fn in package.get("functions",[]):
                  fn_name=str(fn.get("name",""))
                  for top in fn.get("topLevelExpressions",[]) or []:
                      expr=top.get("expression") or {}
                      if expr.get("$type")!="EX_Context":
                          continue
                      ctx=expr.get("ContextExpression") or {}
                      if not str(ctx.get("StackNode","")).endswith(
                          "SceneComponent.SetVisibility"
                      ):
                          continue
                      obj=expr.get("ObjectExpression") or {}
                      target_ptr=ptr_old(obj)
                      target_name=ptr_name(target_ptr)
                      params=ctx.get("Parameters") or []
                      visible=None
                      propagate=None
                      if params:
                          if isinstance(params[0],dict):
                              if params[0].get("$type")=="EX_True":
                                  visible=True
                              elif params[0].get("$type")=="EX_False":
                                  visible=False
                      if len(params)>1 and isinstance(params[1],dict):
                          if params[1].get("$type")=="EX_True":
                              propagate=True
                          elif params[1].get("$type")=="EX_False":
                              propagate=False
                      visibility_actions.append({
                          "fileName":package_name,
                          "function":fn_name,
                          "startOffset":int(top.get("startOffset",-1)),
                          "endOffset":int(top.get("endOffset",-1)),
                          "targetExpressionType":str(obj.get("$type","")),
                          "targetPointer":target_ptr,
                          "componentName":target_name,
                          "visible":visible,
                          "propagateToChildren":propagate,
                          "constantVisibility":visible is not None,
                      })
          visibility_actions.sort(
              key=lambda r:(r["fileName"],r["function"],r["startOffset"])
          )
          visibility_counts={
              name:sum(1 for r in visibility_actions if r["fileName"]==name)
              for name in sorted({r["fileName"] for r in visibility_actions})
          }
          expected_visibility_counts={
              "Box5.uasset":1,
              "MachineGumball.uasset":28,
              "PunchAPackMachine.uasset":5,
              "WonderFizz.uasset":31,
          }
          if visibility_counts!=expected_visibility_counts:
              raise SystemExit(
                  f"SetVisibility authority mismatch actual={visibility_counts} "
                  f"expected={expected_visibility_counts}"
              )
          constant_visibility=sum(
              1 for r in visibility_actions if r["constantVisibility"]
          )
          if len(visibility_actions)!=65 or constant_visibility!=63:
              raise SystemExit(
                  f"SetVisibility coverage mismatch total={len(visibility_actions)} "
                  f"constant={constant_visibility} expected=65/63"
              )
          print(
              "XZOGOT_NACHT_INTERACTIVE_VISIBILITY_GREEN",
              f"actions={len(visibility_actions)} constant={constant_visibility} dynamic=2",
              json.dumps(visibility_counts,separators=(",",":"))
          )

          # Symbolically follow both Kismet execution-flow stack semantics and
          # UE latent Delay resume offsets. A Delay suspends the current path
          # and resumes ExecuteUbergraph at LatentActionInfo.Linkage while the
          # execution-flow return stack remains intact.
          packages_by_name={
              str(p.get("fileName","")):p
              for p in data.get("packages",[])
          }
          delay_by_key={
              (
                  str(row["fileName"]),
                  str(row["function"]),
                  int(row["startOffset"]),
              ):row
              for row in latent_delays
          }
          event_action_bindings=[]
          linked_action_keys=set()

          for package_name,package in packages_by_name.items():
              blueprint_name=Path(package_name).stem
              uber_name=f"ExecuteUbergraph_{blueprint_name}"
              uber=next(
                  (
                      fn for fn in package.get("functions",[])
                      if fn.get("name")==uber_name
                  ),
                  None,
              )
              if not uber:
                  continue

              tops=uber.get("topLevelExpressions",[]) or []
              starts=[int(t.get("startOffset",-1)) for t in tops]
              start_set=set(starts)
              by_start={
                  int(t.get("startOffset",-1)):t
                  for t in tops
              }
              index_by_start={value:index for index,value in enumerate(starts)}

              def norm_target(value):
                  value=int(value)
                  if value in start_set:
                      return value
                  for start in starts:
                      if start>=value:
                          return start
                  return None

              def literal_bool(expr):
                  if not isinstance(expr,dict):
                      return None
                  kind=str(expr.get("$type",""))
                  if kind=="EX_True":
                      return True
                  if kind=="EX_False":
                      return False
                  return None

              def successors(state):
                  offset,stack,elapsed_ms,predicates=state
                  top=by_start[offset]
                  expr=top.get("expression") or {}
                  kind=str(expr.get("$type",""))
                  index=index_by_start[offset]
                  nxt=starts[index+1] if index+1<len(starts) else None
                  rows=[]

                  def add(
                      target,
                      new_stack=stack,
                      new_elapsed_ms=elapsed_ms,
                      new_predicates=predicates,
                      label="seq",
                  ):
                      target=norm_target(target) if target is not None else None
                      if target is None:
                          return
                      rows.append((
                          (
                              target,
                              tuple(new_stack),
                              int(new_elapsed_ms),
                              tuple(sorted(set(new_predicates))),
                          ),
                          label,
                      ))

                  delay=delay_by_key.get((
                      package_name,
                      uber_name,
                      offset,
                  ))
                  if delay is not None:
                      resume=delay.get("resumeOffset")
                      duration_ms=int(round(
                          float(delay.get("durationSeconds",0.0))*1000.0
                      ))
                      add(
                          resume,
                          stack,
                          elapsed_ms+duration_ms,
                          predicates,
                          "latent_delay_resume",
                      )
                      return rows

                  if kind=="EX_Jump":
                      add(expr.get("CodeOffset"),label="jump")
                  elif kind=="EX_JumpIfNot":
                      cond=literal_bool(expr.get("BooleanExpression"))
                      branch_target=norm_target(expr.get("CodeOffset",-1))
                      fallthrough=norm_target(nxt) if nxt is not None else None
                      if cond is True:
                          add(fallthrough,label="branch_true_constant")
                      elif cond is False:
                          add(
                              branch_target,
                              label="branch_false_constant",
                          )
                      elif branch_target==fallthrough:
                          # Cooked Kismet can retain a predicate opcode even
                          # when both outcomes converge immediately. Do not
                          # promote that no-op branch into gameplay state.
                          add(
                              fallthrough,
                              label="branch_converged",
                          )
                      else:
                          next_preds=tuple(predicates)+(offset,)
                          add(
                              fallthrough,
                              new_predicates=next_preds,
                              label="branch_true",
                          )
                          add(
                              branch_target,
                              new_predicates=next_preds,
                              label="branch_false",
                          )
                  elif kind=="EX_PushExecutionFlow":
                      target=norm_target(expr.get("PushingAddress",-1))
                      if target is not None:
                          add(
                              nxt,
                              tuple(stack)+(target,),
                              label="push_body",
                          )
                      else:
                          add(nxt,label="push_body")
                  elif kind=="EX_PopExecutionFlow":
                      if stack:
                          add(
                              stack[-1],
                              tuple(stack[:-1]),
                              label="pop_return",
                          )
                  elif kind=="EX_PopExecutionFlowIfNot":
                      cond=literal_bool(expr.get("BooleanExpression"))
                      return_target=(
                          norm_target(stack[-1])
                          if stack
                          else None
                      )
                      continue_target=(
                          norm_target(nxt)
                          if nxt is not None
                          else None
                      )
                      if cond is True:
                          add(
                              continue_target,
                              label="pop_if_continue_constant",
                          )
                      elif cond is False:
                          if stack:
                              add(
                                  return_target,
                                  tuple(stack[:-1]),
                                  label="pop_if_return_constant",
                              )
                      elif (
                          stack
                          and return_target==continue_target
                      ):
                          add(
                              continue_target,
                              stack,
                              label="pop_if_converged",
                          )
                      else:
                          next_preds=tuple(predicates)+(offset,)
                          add(
                              continue_target,
                              new_predicates=next_preds,
                              label="pop_if_continue",
                          )
                          if stack:
                              add(
                                  return_target,
                                  tuple(stack[:-1]),
                                  new_predicates=next_preds,
                                  label="pop_if_return",
                              )
                  elif kind not in ("EX_Return","EX_EndOfScript"):
                      add(nxt,label="seq")
                  return rows

              package_actions=[
                  a for a in normalized
                  if a["fileName"]==package_name
              ]
              action_by_offset={
                  int(a["startOffset"]):a
                  for a in package_actions
              }
              package_entries=[
                  e for e in entry_points
                  if e["fileName"]==package_name
              ]

              for entry in package_entries:
                  entry_start=norm_target(entry["entryOffset"])
                  if entry_start is None:
                      continue

                  initial=(entry_start,tuple(),0,tuple())
                  queue=[initial]
                  seen=set()
                  action_hits={}

                  while queue and len(seen)<100000:
                      state=queue.pop(0)
                      if state in seen:
                          continue
                      seen.add(state)
                      offset,stack,elapsed_ms,predicates=state
                      if elapsed_ms>120000:
                          continue

                      raw_action=action_by_offset.get(offset)
                      if raw_action is not None:
                          action_key=int(raw_action["startOffset"])
                          action_hits.setdefault(action_key,[]).append({
                              "elapsedSeconds":elapsed_ms/1000.0,
                              "predicateOffsets":list(predicates),
                              "stackDepth":len(stack),
                          })

                      for next_state,label in successors(state):
                          if next_state not in seen:
                              queue.append(next_state)

                  if not action_hits:
                      continue

                  linked=[]
                  for action in package_actions:
                      action_key=int(action["startOffset"])
                      hits=action_hits.get(action_key,[])
                      if not hits:
                          continue
                      unique_times=sorted({
                          round(float(hit["elapsedSeconds"]),3)
                          for hit in hits
                      })
                      predicate_sets={
                          tuple(hit["predicateOffsets"])
                          for hit in hits
                      }
                      min_predicates=min(
                          len(hit["predicateOffsets"])
                          for hit in hits
                      )
                      linked.append({
                          "actionStartOffset":action_key,
                          "actionEndOffset":int(action["endOffset"]),
                          "operation":action["operation"],
                          "componentName":action["componentName"],
                          "targetMode":action["targetMode"],
                          "active":action["active"],
                          "reset":action["reset"],
                          "elapsedSeconds":unique_times,
                          "minPredicateCount":min_predicates,
                          "predicatePathCount":len(predicate_sets),
                      })
                      linked_action_keys.add((
                          package_name,
                          action_key,
                      ))

                  event_action_bindings.append({
                      "fileName":package_name,
                      "blueprintName":blueprint_name,
                      "eventFunction":entry["function"],
                      "entryOffset":int(entry["entryOffset"]),
                      "actionCount":len(linked),
                      "actions":linked,
                  })

          event_action_bindings.sort(
              key=lambda r:(
                  r["fileName"],
                  r["entryOffset"],
                  r["eventFunction"],
              )
          )

          binding_by_key={
              (r["fileName"],r["eventFunction"]):r
              for r in event_action_bindings
          }

          expected_binding_counts={
              ("Box_complete.uasset","ReceiveTick"):2,
              ("MachineGumball.uasset","OpenLidMulticast"):2,
              ("MachineGumball.uasset","CloseLidMulticast"):2,
              ("PunchAPackMachine.uasset","ExecuteParticleEffect"):1,
              ("WonderFizz.uasset","BallSpinning?"):10,
          }
          actual_binding_counts={
              key:int(binding_by_key[key]["actionCount"])
              for key in expected_binding_counts
              if key in binding_by_key
          }
          if actual_binding_counts!=expected_binding_counts:
              raise SystemExit(
                  "latent-aware particle event CFG mismatch "
                  f"actual={actual_binding_counts} "
                  f"expected={expected_binding_counts}"
              )
          if len(linked_action_keys)!=17:
              raise SystemExit(
                  "latent-aware particle CFG linked action coverage mismatch "
                  f"{len(linked_action_keys)}/17"
              )

          def assert_action_times(binding_key,expected):
              binding=binding_by_key[binding_key]
              actual={
                  int(row["actionStartOffset"]):[
                      float(x) for x in row["elapsedSeconds"]
                  ]
                  for row in binding["actions"]
              }
              if actual!=expected:
                  raise SystemExit(
                      f"source particle event timing mismatch "
                      f"key={binding_key} actual={actual} expected={expected}"
                  )

          assert_action_times(
              ("MachineGumball.uasset","OpenLidMulticast"),
              {8226:[15.0],8263:[15.0]},
          )
          assert_action_times(
              ("MachineGumball.uasset","CloseLidMulticast"),
              {5723:[5.0],5759:[5.0]},
          )
          assert_action_times(
              ("PunchAPackMachine.uasset","ExecuteParticleEffect"),
              {10677:[0.0]},
          )

          box=binding_by_key[
              ("Box_complete.uasset","ReceiveTick")
          ]
          if not any(
              len(row["elapsedSeconds"])>1
              or int(row["minPredicateCount"])>0
              for row in box["actions"]
          ):
              raise SystemExit(
                  "Box ReceiveTick unexpectedly became direct-replay safe"
              )

          fizz=binding_by_key[
              ("WonderFizz.uasset","BallSpinning?")
          ]
          if len(fizz["actions"])!=10 or not any(
              int(row["minPredicateCount"])>0
              for row in fizz["actions"]
          ):
              raise SystemExit(
                  "WonderFizz BallSpinning predicate authority missing"
              )

          replay_safe_events=[
              {
                  "fileName":"MachineGumball.uasset",
                  "blueprintName":"MachineGumball",
                  "eventFunction":"OpenLidMulticast",
                  "entryOffset":7897,
                  "timeline":[
                      {
                          "atSeconds":15.0,
                          "actionStartOffsets":[8226,8263],
                      }
                  ],
                  "proof":"Kismet execution-flow stack + latent Delay resume chain",
              },
              {
                  "fileName":"MachineGumball.uasset",
                  "blueprintName":"MachineGumball",
                  "eventFunction":"CloseLidMulticast",
                  "entryOffset":8724,
                  "timeline":[
                      {
                          "atSeconds":5.0,
                          "actionStartOffsets":[5723,5759],
                      }
                  ],
                  "proof":"Kismet Delay 5.0s -> resume 5307 -> Deactivate",
              },
              {
                  "fileName":"PunchAPackMachine.uasset",
                  "blueprintName":"PunchAPackMachine",
                  "eventFunction":"ExecuteParticleEffect",
                  "entryOffset":11179,
                  "timeline":[
                      {
                          "atSeconds":0.0,
                          "actionStartOffsets":[10677],
                      }
                  ],
                  "proof":"GetComponentsByClass(ParticleSystemComponent) loop -> SetActive(true,true)",
              },
          ]

          print(
              "XZOGOT_NACHT_INTERACTIVE_PARTICLE_CFG_GREEN",
              f"bindings={len(event_action_bindings)} "
              f"linked_actions={len(linked_action_keys)}/17 "
              "gumball_open=15.0s gumball_close=5.0s "
              "pap=0.0s replay_safe=3"
          )
          print(
              "XZOGOT_NACHT_INTERACTIVE_PARTICLE_REPLAY_SAFE_GREEN",
              json.dumps(
                  {
                      "events":[
                          [r["fileName"],r["eventFunction"]]
                          for r in replay_safe_events
                      ],
                      "conditional":[
                          ["Box_complete.uasset","ReceiveTick"],
                          ["WonderFizz.uasset","BallSpinning?"],
                      ],
                  },
                  separators=(",",":"),
              )
          )

          out={
              "schemaVersion":2,
              "source":"Nacht workshop 2755515831 UE4.21 Blueprint bytecode",
              "packageCount":len(rows),
              "activationCallCount":total_calls,
              "activationTreeCount":total_trees,
              "normalizedActionCount":len(normalized),
              "normalizedActions":normalized,
              "entryPointCount":len(entry_points),
              "entryPoints":entry_points,
              "latentDelayCount":len(latent_delays),
              "latentDelays":latent_delays,
              "componentVisibilityActionCount":len(visibility_actions),
              "componentVisibilityActions":visibility_actions,
              "eventActionBindingCount":len(event_action_bindings),
              "eventActionBindings":event_action_bindings,
              "replaySafeEventCount":len(replay_safe_events),
              "replaySafeEvents":replay_safe_events,
              "cfgLinkedActionCount":len(linked_action_keys),
              "packages":rows,
              "ready":True,
          }
          Path("build/nacht-interactive-particle-bytecode/particle-activation-authority.json").write_text(
              json.dumps(out,indent=2)+"\n"
          )
          print(
              "XZOGOT_NACHT_INTERACTIVE_PARTICLE_ACTIONS_GREEN",
              f"actions={len(normalized)} named=16 all_components=1",
              json.dumps(actual,separators=(",",":"))
          )
          print(
              "XZOGOT_NACHT_INTERACTIVE_PARTICLE_BYTECODE_GREEN",
              f"packages={len(rows)} calls={total_calls} trees={total_trees}"
          )
          '@ | python -

      - name: Upload particle activation authority
        uses: actions/upload-artifact@v4
        with:
          name: Xogot-Nacht-Interactive-Particle-Bytecode
          path: |
            build/nacht-interactive-particle-bytecode/
            interactive-blueprint-uassets.txt
          if-no-files-found: error
          retention-days: 7
