              )

          def gumball_blob(offset):
              if offset not in gumball_top:
                  raise SystemExit(
                      f"MachineGumball source opcode missing offset={offset}"
                  )
              return json.dumps(gumball_top[offset],sort_keys=True)

          predicate_1=gumball_blob(7433)
          predicate_2=gumball_blob(7786)
          precondition_blob=" ".join(
              gumball_blob(offset)
              for offset in [
                  6976,7053,7130,7168,7197,7256,
                  7290,7328,7357,7395,7433,
              ]
          )
          cash_blob=" ".join(
              gumball_blob(offset)
              for offset in [7631,7654,7695,7786]
          )
          success_blob=" ".join(
              gumball_blob(offset)
              for offset in [4446,4564,4663,4722,4736,4750,4787]
          )
          for token in [
              "Zombie","Downed","PowerSwitchFlags","Powered","Inuse?",
              "BooleanAND","BooleanOR","Not_PreBool",
          ]:
              if token not in precondition_blob:
                  raise SystemExit(
                      f"MachineGumball precondition token missing {token}"
                  )
          for token in [
              "FireSaleActive?","PavlovPlayerStatus.Cash",
              "GreaterEqual_IntInt","Cost",
          ]:
              if token not in cash_blob:
                  raise SystemExit(
                      f"MachineGumball cash predicate token missing {token}"
                  )
          if '"Value": 10' not in cash_blob:
              raise SystemExit("MachineGumball Fire Sale cost 10 missing")
          for token in [
              "Inuse?","Subtract_IntInt","SetPlayerCash",
              "OpenLidMulticast","OpenMystreyBoxSound",
              "KismetSystemLibrary.Delay",
          ]:
              if token not in success_blob:
                  raise SystemExit(
                      f"MachineGumball success token missing {token}"
                  )
          delay_expr=gumball_top[4787]
          delay_ctx=delay_expr.get("ContextExpression") or {}
          delay_params=delay_ctx.get("Parameters") or []
          if (
              len(delay_params)<3
              or abs(float(delay_params[1].get("Value",-1.0))-0.5)>0.001
          ):
              raise SystemExit(
                  f"MachineGumball post-open Delay mismatch {delay_expr}"
              )
          latent=delay_params[2].get("Value",[]) or []
          resume_offsets=[
              int(row.get("Value",-1))
              for row in latent
              if isinstance(row,dict)
              and row.get("$type")=="EX_SkipOffsetConst"
          ]
          if resume_offsets!=[794]:
              raise SystemExit(
                  f"MachineGumball post-open resume mismatch {resume_offsets}"
              )

          interact_template=next(
              row for row in gumball_package.get("normalExportProperties",[])
              if row.get("objectName")=="Pavlov_InteractBox_GEN_VARIABLE"
          )
          interact_props={
              str(row.get("Name","")):row.get("Value")
              for row in interact_template.get("properties",[])
          }
          def vector_value(raw,name):
              if not isinstance(raw,list) or len(raw)!=1:
                  raise SystemExit(
                      f"MachineGumball {name} vector wrapper mismatch {raw}"
                  )
              row=raw[0]
              value=row.get("Value") if isinstance(row,dict) else None
              if not isinstance(value,dict):
                  raise SystemExit(
                      f"MachineGumball {name} vector value mismatch {raw}"
                  )
