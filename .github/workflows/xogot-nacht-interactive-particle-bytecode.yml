                  "MachineGumball source defaults mismatch "
                  f"cost={base_cost} raise={time_to_raise} "
                  f"fall={time_to_fall} time={cycle_time} pool={gum_pool}"
              )

          server_event=next(
              row for row in entry_points
              if row["fileName"]=="MachineGumball.uasset"
              and row["function"]==
                  "BndEvt__Pavlov_InteractBox_K2Node_ComponentBoundEvent_3_"
                  "OnInteractBoxServerSignature__DelegateSignature"
          )
          if int(server_event["entryOffset"])!=6892:
              raise SystemExit(
