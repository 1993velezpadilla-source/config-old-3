          # Source interaction contract for the placed Gumball machine. Keep this
          # as bytecode authority, not gameplay guesswork: every constant,
          # predicate and success mutation below is asserted against the
          # UE4.21 cooked Blueprint before it is emitted.
          gumball_package=packages_by_name["MachineGumball.uasset"]
          gumball_uber=next(
              fn for fn in gumball_package.get("functions",[])
              if fn.get("name")=="ExecuteUbergraph_MachineGumball"
          )
          gumball_top={
              int(row.get("startOffset",-1)):row.get("expression") or {}
              for row in gumball_uber.get("topLevelExpressions",[]) or []
          }
          gumball_cdo=next(
              row for row in gumball_package.get("normalExportProperties",[])
              if row.get("objectName")=="Default__MachineGumball_C"
          )
          def cdo_prop(name):
