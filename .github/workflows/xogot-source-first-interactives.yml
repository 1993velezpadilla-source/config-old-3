name: Xogot Source-First Interactive Export

on:
  workflow_dispatch:
  push:
    branches:
      - feature/godot-aaa-rebuild-v1
    paths:
      - ".github/workflows/xogot-source-first-interactives.yml"
      - "xogot/data/source_first_full_game_baseline.json"

permissions:
  contents: read
  actions: read

concurrency:
  group: xogot-source-first-interactives
  cancel-in-progress: true

jobs:
  export:
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_MAPPING_RUN: "37244741312"

    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/godot-aaa-rebuild-v1

      - name: Reuse proven Aether UE5.7 mapping
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $dir="$env:RUNNER_TEMP\mapping"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          gh run download "$env:SOURCE_MAPPING_RUN" -n aether-waw-usmap-real-weapons -D $dir
          $map=Get-ChildItem $dir -Filter 'Mappings.usmap' -Recurse | Select-Object -First 1
          if(-not $map){throw 'Mappings.usmap missing'}
          Copy-Item $map.FullName "$PWD\Mappings.usmap"
          if((Get-Item "$PWD\Mappings.usmap").Length -lt 4096){throw 'Mappings.usmap too small'}
          Write-Host 'XZOGOT_INTERACTIVES_USMAP_GREEN'

      - name: Download Project Aether
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $download="$env:RUNNER_TEMP\aether-download"
          New-Item -ItemType Directory -Force -Path $download | Out-Null
          $zip=$null
          for($attempt=1;$attempt -le 6;$attempt++){
            npx --yes itchio-downloader --url "https://verrial.itch.io/projectaether" --downloadDirectory $download
            $zip=Get-ChildItem $download -Filter '*.zip' -Recurse | Sort-Object Length -Descending | Select-Object -First 1
            if($zip){break}
            if($attempt -lt 6){Start-Sleep -Seconds (30 + 20*$attempt)}
          }
          if(-not $zip){throw 'Aether ZIP missing'}
          $root="$env:RUNNER_TEMP\aether-paks"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          7z x -y $zip.FullName 'ProjectAether/Content/Paks/*' "-o$root" | Out-Host
          $pakDir=Get-ChildItem $root -Directory -Recurse | Where-Object {
            $_.Name -eq 'Paks' -and (Get-ChildItem $_.FullName -Filter '*.utoc' -ErrorAction SilentlyContinue)
          } | Select-Object -First 1
          if(-not $pakDir){throw 'Aether Paks missing'}
          "AETHER_PAKDIR=$($pakDir.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host 'XZOGOT_INTERACTIVES_AETHER_GREEN'

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build current CUE4Parse CLI
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $src="$env:RUNNER_TEMP\CUE4Parse.CLI"
          $out="$env:RUNNER_TEMP\cue4parse"
          git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/joric/CUE4Parse.CLI.git $src
          git -C $src submodule update --init --recursive --depth 1
          dotnet publish "$src\CUE4Parse.CLI\CUE4Parse.CLI.csproj" -c Release -r win-x64 --self-contained true -p:PublishTrimmed=false -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o $out
          $exe=Get-ChildItem $out -Filter '*.exe' | Sort-Object Length -Descending | Select-Object -First 1
          if(-not $exe){throw 'CUE4Parse CLI missing'}
          "CUE4PARSE=$($exe.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host 'XZOGOT_INTERACTIVES_CUE4PARSE_GREEN'

      - name: Define complete interaction source set
        shell: pwsh
        run: |
          @'
          *Assets/BP/Weapons/BP_MeleeBase.uasset
          *Assets/Data/Enums/E_ActiveMelee.uasset
          *Assets/Data/Enums/E_MeleeWeapon.uasset
          *Assets/Weapons/BO1/Bowie/*.uasset
          *Assets/Weapons/BO1/Bowie/*/*.uasset
          *Assets/Data/DataTables/DT_Perks.uasset
          *Assets/Data/Structs/S_Perks.uasset
          *FirstPerson/Blueprints/Interactables/*.uasset
          *FirstPerson/Blueprints/Interactables/*/*.uasset
          *FirstPerson/Blueprints/Interactables/*/*/*.uasset
          *FirstPerson/Blueprints/Interactables/*/*/*/*.uasset
          *FirstPerson/Blueprints/Interactables/*/*/*/*/*.uasset
          *Assets/BP/MapEnt/*.uasset
          *Assets/BP/MapEnt/*/*.uasset
          *Assets/BP/MapEnt/*/*/*.uasset
          '@ | Set-Content interactive-patterns.txt -Encoding ascii
          Write-Host 'XZOGOT_INTERACTIVES_PATTERN_GREEN'

      - name: Resolve exact provider paths
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $stdout=& "$env:CUE4PARSE" -i "$env:AETHER_PAKDIR" -g GAME_UE5_7 -m "$PWD\Mappings.usmap" -l -c interactive-patterns.txt 2> interactive-list-stderr.log
          $paths=@($stdout | Where-Object {$_ -match '(?i)\.uasset$'} | Sort-Object -Unique)
          $paths | Set-Content interactive-provider-paths.txt -Encoding ascii
          if($paths.Count -lt 100){throw "Interactive provider set too small: $($paths.Count)"}
          Write-Host "XZOGOT_INTERACTIVES_PROVIDER_GREEN count=$($paths.Count)"

      - name: Export meshes materials blueprints data and referenced media
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Remove-Item interactive-gltf -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path interactive-gltf | Out-Null
          & "$env:CUE4PARSE" -i "$env:AETHER_PAKDIR" -g GAME_UE5_7 -m "$PWD\Mappings.usmap" -c interactive-provider-paths.txt -o interactive-gltf -y -v --mesh-format Gltf2 --mesh-quality Highest --export-materials true 2>&1 | Tee-Object interactive-gltf.log
          $files=@(Get-ChildItem interactive-gltf -Recurse -File)
          $mesh=@($files | Where-Object {$_.Extension -in '.glb','.gltf'})
          $json=@($files | Where-Object {$_.Extension -eq '.json'})
          $png=@($files | Where-Object {$_.Extension -eq '.png'})
          Write-Host "XZOGOT_INTERACTIVES_GLTF_GREEN files=$($files.Count) mesh=$($mesh.Count) json=$($json.Count) png=$($png.Count)"
          if($mesh.Count -lt 5){throw "Too few interactive meshes: $($mesh.Count)"}
          if($json.Count -lt 20){throw "Too few interactive data/blueprint exports: $($json.Count)"}

      - name: Export melee and hand animations as ActorX
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          @'
          *Assets/Weapons/BO1/Bowie/*.uasset
          *Assets/Weapons/BO1/Bowie/*/*.uasset
          *FirstPerson/Blueprints/Interactables/Bottles/*.uasset
          *FirstPerson/Blueprints/Interactables/Bottles/*/*.uasset
          *FirstPerson/Blueprints/Interactables/Bottles/*/*/*.uasset
          *FirstPerson/Blueprints/Interactables/Bottles/*/*/*/*.uasset
          *FirstPerson/Blueprints/Interactables/Bottles/*/*/*/*/*.uasset
          '@ | Set-Content interactive-actorx-patterns.txt -Encoding ascii

          $actorStdout=& "$env:CUE4PARSE" -i "$env:AETHER_PAKDIR" -g GAME_UE5_7 -m "$PWD\Mappings.usmap" -l -c interactive-actorx-patterns.txt 2> interactive-actorx-list-stderr.log
          $actorPaths=@($actorStdout | Where-Object {$_ -match '(?i)\.uasset$'} | Sort-Object -Unique)
          $actorPaths | Set-Content interactive-actorx-provider-paths.txt -Encoding ascii
          if($actorPaths.Count -lt 3){throw "Interactive ActorX provider set too small: $($actorPaths.Count)"}

          Remove-Item interactive-actorx -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path interactive-actorx | Out-Null
          & "$env:CUE4PARSE" -i "$env:AETHER_PAKDIR" -g GAME_UE5_7 -m "$PWD\Mappings.usmap" -c interactive-actorx-provider-paths.txt -o interactive-actorx -y -v --mesh-format ActorX --mesh-quality Highest --export-materials true 2>&1 | Tee-Object interactive-actorx.log
          $psa=@(Get-ChildItem interactive-actorx -Recurse -File -Filter '*.psa')
          $psk=@(Get-ChildItem interactive-actorx -Recurse -File | Where-Object {$_.Extension -in '.psk','.pskx'})
          Write-Host "XZOGOT_INTERACTIVES_ACTORX_GREEN psa=$($psa.Count) psk=$($psk.Count)"
          if($psa.Count -lt 3){throw "Too few interaction/melee PSA files: $($psa.Count)"}

      - name: Classify full source interaction roles
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          @'
          import json,re
          from pathlib import Path

          roots=[Path("interactive-gltf"),Path("interactive-actorx")]
          files=[p for r in roots for p in r.rglob("*") if p.is_file()]
          rules={
            "knife_melee":r"(bowie|knife|melee|stab|slash|swipe|bayonet)",
            "perk_drink":r"(perk.*drink|drink.*perk|bottle|jugger|speed.?cola|double.?tap|quick.?revive|stamin)",
            "pack_a_punch":r"(pack.?a.?punch|packapunch|pap_|upgrade)",
            "power":r"(power.?switch|power.?lever|electric|breaker|generator)",
            "trap":r"(trap|electric.?trap|flame.?trap|switch.?trap)",
            "teleporter":r"(teleporter|teleport|linker)",
            "wunderfizz":r"(wunderfizz|wonderfizz)",
            "mystery_box":r"(mystery.?box|weapon.?box|box.?weapon)",
            "wallbuy":r"(wall.?buy|wallbuy|chalk|weapon.?buy)",
            "generic_use_hands":r"(view.?hand|view.?arm|hand.*use|use.*hand|interact|grab|press)",
            "perk_data":r"(dt_perks|s_perks|perk.*data)"
          }
          cats={k:[] for k in rules}
          for p in files:
              s=p.as_posix()
              for k,rx in rules.items():
                  if re.search(rx,s,re.I):
                      cats[k].append(s)
          cats={k:sorted(set(v)) for k,v in cats.items()}
          report={
            "schema":1,
            "source":"Project Aether UE5.7 source-first interactive export",
            "file_count":len(files),
            "counts":{k:len(v) for k,v in cats.items()},
            "categories":cats,
          }
          Path("interactive-source-inventory.json").write_text(json.dumps(report,indent=2)+"\n")
          print("XZOGOT_INTERACTIVE_SOURCE_INVENTORY_GREEN",report["counts"])
          for required in ("knife_melee","perk_drink","pack_a_punch","power","teleporter","wunderfizz"):
              if report["counts"][required] < 1:
                  raise SystemExit(f"missing required source interaction category: {required}")
          '@ | python -

      - name: Upload complete interactive source package
        uses: actions/upload-artifact@v4
        with:
          name: xogot-source-first-interactives
          path: |
            interactive-source-inventory.json
            interactive-patterns.txt
            interactive-actorx-patterns.txt
            interactive-provider-paths.txt
            interactive-actorx-provider-paths.txt
            interactive-actorx-list-stderr.log
            interactive-list-stderr.log
            interactive-gltf.log
            interactive-actorx.log
            interactive-gltf/**
            interactive-actorx/**
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
