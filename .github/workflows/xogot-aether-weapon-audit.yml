name: Audit Reconstructed Aether Weapons

on:
  workflow_dispatch:
  push:
    branches:
      - feature/church-expansion-v1
    paths:
      - ".github/workflows/xogot-aether-weapon-audit.yml"

concurrency:
  group: xogot-aether-weapon-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5

      - name: Install package tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full xz-utils
          npm --version

      - name: Download public reconstructed Project Aether build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aether-download"
          npx --yes itchio-downloader \
            --url "https://verrial.itch.io/projectaether" \
            --downloadDirectory "$RUNNER_TEMP/aether-download"
          FILE=$(find "$RUNNER_TEMP/aether-download" -type f -name '*.zip' -printf '%s\t%p\n' | sort -nr | head -1 | cut -f2-)
          test -n "$FILE"
          echo "PAYLOAD=$FILE" >> "$GITHUB_ENV"
          sha256sum "$FILE"

      - name: Extract cooked package files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aether-paks"
          7z x -y "$PAYLOAD" 'ProjectAether/Content/Paks/*' -o"$RUNNER_TEMP/aether-paks" >/tmp/aether-7z.log
          rm -f "$PAYLOAD"
          PAKDIR="$RUNNER_TEMP/aether-paks/ProjectAether/Content/Paks"
          echo "PAKDIR=$PAKDIR" >> "$GITHUB_ENV"
          du -sh "$PAKDIR"

      - name: Install retoc and repak
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 https://github.com/trumank/retoc/releases/download/v0.1.5/retoc_cli-x86_64-unknown-linux-gnu.tar.xz -o "$RUNNER_TEMP/retoc.tar.xz"
          mkdir -p "$RUNNER_TEMP/retoc"
          tar -xJf "$RUNNER_TEMP/retoc.tar.xz" -C "$RUNNER_TEMP/retoc"
          RETOC=$(find "$RUNNER_TEMP/retoc" -type f -name 'retoc*' -perm -111 | head -1)
          curl -fL --retry 4 https://github.com/trumank/repak/releases/download/v0.2.3/repak_cli-x86_64-unknown-linux-gnu.tar.xz -o "$RUNNER_TEMP/repak.tar.xz"
          mkdir -p "$RUNNER_TEMP/repak"
          tar -xJf "$RUNNER_TEMP/repak.tar.xz" -C "$RUNNER_TEMP/repak"
          REPAK=$(find "$RUNNER_TEMP/repak" -type f -name 'repak*' -perm -111 | head -1)
          test -x "$RETOC" && test -x "$REPAK"
          echo "RETOC=$RETOC" >> "$GITHUB_ENV"
          echo "REPAK=$REPAK" >> "$GITHUB_ENV"

      - name: Convert reconstructed IoStore to searchable legacy package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-out
          "$RETOC" to-legacy "$PAKDIR" "$RUNNER_TEMP/aether-legacy.pak" \
            > audit-out/to-legacy.log 2>&1
          test -s "$RUNNER_TEMP/aether-legacy.pak"
          "$REPAK" list "$RUNNER_TEMP/aether-legacy.pak" > audit-out/all-paths.txt
          wc -l audit-out/all-paths.txt

      - name: Build weapon model animation audio inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re,pathlib
          paths=[x.strip() for x in pathlib.Path("audit-out/all-paths.txt").read_text(errors="replace").splitlines() if x.strip()]
          aliases={
            "colt":["colt","m1911","1911"],
            "m1":["m1_garand","m1garand","garand"],
            "mp40":["mp40"],
            "trench":["trench","m1897","winchester_1897"],
            "thompson":["thompson","m1928"],
            "bar":["bar1918","m1918","/bar_","/bar."],
            "browning":["browning","m1919"],
            "doublebarrel":["double_barrel","doublebarrel"],
            "sawnoff":["sawed","sawnoff","sawn"],
            "fg42":["fg42"],
            "gewehr":["gewehr","g43"],
            "m1a1":["m1a1"],
            "mg42":["mg42"],
            "ppsh":["ppsh"],
            "ptrs":["ptrs"],
            "stg":["stg44","mp44"],
            "type100":["type100","type_100"],
            "springfield":["springfield"],
            "ray":["raygun","ray_gun"],
            "raymk2":["raygunmk2","ray_gun_mk2","mark2"],
            "tesla":["wunderwaffe","tesla"],
          }
          role_terms={
            "model":["weapon","skeletal","mesh","view","firstperson","fp_"],
            "animation":["anim","reload","fire","shoot","ads","idle","melee","equip","raise","lower"],
            "audio":["sound","audio","sfx","fire","reload","foley"],
            "texture":["texture","material","mat_","tex_"],
          }
          out={}
          for wid,needles in aliases.items():
            hits=[]
            for p in paths:
              lo=p.lower()
              if any(n in lo for n in needles):
                roles=[r for r,terms in role_terms.items() if any(t in lo for t in terms)]
                hits.append({"path":p,"roles":roles})
            out[wid]=hits[:5000]
          summary={k:{
            "total":len(v),
            "model_like":sum("model" in x["roles"] for x in v),
            "animation_like":sum("animation" in x["roles"] for x in v),
            "audio_like":sum("audio" in x["roles"] for x in v),
            "texture_like":sum("texture" in x["roles"] for x in v),
          } for k,v in out.items()}
          report={
            "source":"Project Aether public reconstructed build",
            "path_count":len(paths),
            "summary":summary,
            "weapons":out,
          }
          pathlib.Path("audit-out/aether-weapon-inventory.json").write_text(json.dumps(report,indent=2)+"\n")
          pathlib.Path("audit-out/aether-weapon-summary.txt").write_text(
            "\n".join(f"{k}: {v}" for k,v in summary.items())+"\n"
          )
          print(json.dumps(summary,indent=2))
          total=sum(v["total"] for v in summary.values())
          if total<=0:
            raise SystemExit("No weapon-like reconstructed assets discovered")
          print("XZOGOT_AETHER_WEAPON_INVENTORY_GREEN",total)
          PY

      - name: Upload reconstructed weapon audit
        uses: actions/upload-artifact@v4
        with:
          name: aether-reconstructed-weapon-audit
          path: |
            audit-out/aether-weapon-inventory.json
            audit-out/aether-weapon-summary.txt
            audit-out/to-legacy.log
          retention-days: 14
