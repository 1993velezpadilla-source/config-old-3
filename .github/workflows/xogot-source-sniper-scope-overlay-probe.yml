name: Xogot Real WaW Sniper Scope Mobile Overlay Proof
on:
  workflow_dispatch:
  push:
    branches:
      - fix/source-viewmodel-inherited-hands-unit-scale
    paths:
      - "xogot/scripts/mobile_hud.gd"
      - "xogot/scripts/weapon.gd"
      - "xogot/shaders/source_sniper_scope_mask.gdshader"
      - "xogot/ci/source_sniper_scope_overlay_probe.gd"
      - ".github/workflows/xogot-source-sniper-scope-overlay-probe.yml"

permissions:
  contents: read

jobs:
  authentic-scopes:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v5
      - name: Install Godot 4.6.1 original renderer
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers
          curl -L --fail --retry 5 --retry-all-errors --retry-delay 2 \
            https://github.com/godotengine/godot-builds/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip -o /tmp/godot.zip
          mkdir -p /tmp/godot /tmp/xogot-source-sniper-overlay build/sniper-overlay
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.6.1-stable_linux.x86_64
      - name: Import real gameplay and original weapon assets
        run: |
          set -euo pipefail
          timeout 250 /tmp/godot/Godot_v4.6.1-stable_linux.x86_64 --headless --editor --path xogot --quit 2>&1 | tee build/sniper-overlay/import.log
          ! grep -E "SCRIPT ERROR|Parse Error" build/sniper-overlay/import.log
      - name: Six real gameplay photos scope HIP and ADS plus non-scoped MP40
        run: |
          set -euo pipefail
          timeout 270 xvfb-run -a -s "-screen 0 1280x720x24" \
            /tmp/godot/Godot_v4.6.1-stable_linux.x86_64 --path xogot --audio-driver Dummy --rendering-method gl_compatibility \
            --resolution 1280x720 --script res://ci/source_sniper_scope_overlay_probe.gd 2>&1 | tee build/sniper-overlay/render.log
          grep -q "XZOGOT_WAW_SNIPER_SCOPE_OVERLAY_GREEN frames=6" build/sniper-overlay/render.log
          test "$(find /tmp/xogot-source-sniper-overlay -maxdepth 1 -name '*.png' | wc -l)" -eq 6
          ! grep -E "SCRIPT ERROR|Parse Error|XZOGOT_SOURCE_SNIPER_SCOPE_OVERLAY_RED" build/sniper-overlay/render.log
      - name: Six real original screenshots from gameplay renderer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Xogot-WaW-Sniper-Scope-vs-HIP-6PNG
          path: /tmp/xogot-source-sniper-overlay/*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Diagnostics for source weapon scope overlay
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Xogot-WaW-Sniper-Scope-Render-Logs
          path: build/sniper-overlay/*.log
          if-no-files-found: warn
          retention-days: 14
