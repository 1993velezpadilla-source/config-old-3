
name: Xogot Nacht Audio Blueprint Bytecode

on:
  workflow_dispatch:
  push:
    branches:
      - feature/godot-aaa-rebuild-v1
    paths:
      - ".github/workflows/xogot-nacht-audio-blueprint-bytecode.yml"
      - "tools/maps/UENuketownWallbuyBytecode/**"

permissions:
  contents: read

concurrency:
  group: xogot-nacht-audio-blueprint-bytecode
  cancel-in-progress: true

jobs:
  decompile:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      WORKSHOP_APP_ID: "555160"
      WORKSHOP_ITEM_ID: "2755515831"
      XZOGOT_ENGINE_VERSION: "VER_UE4_21"

    steps:
      - uses: actions/checkout@v5

      - name: Download and unpack exact Nacht source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $steam=Join-Path $env:RUNNER_TEMP 'steamcmd'
          New-Item -ItemType Directory -Force -Path $steam | Out-Null
          Invoke-WebRequest 'https://steamcdn-a.akamaihd.net/client/installer/steamcmd.zip' -OutFile "$env:RUNNER_TEMP\steamcmd.zip"
          Expand-Archive "$env:RUNNER_TEMP\steamcmd.zip" -DestinationPath $steam -Force
          & (Join-Path $steam 'steamcmd.exe') +login anonymous +workshop_download_item $env:WORKSHOP_APP_ID $env:WORKSHOP_ITEM_ID validate +quit
          $root=Get-ChildItem $steam,$env:RUNNER_TEMP -Directory -Recurse -ErrorAction SilentlyContinue | Where-Object {$_.FullName -like "*steamapps\workshop\content\$env:WORKSHOP_APP_ID\$env:WORKSHOP_ITEM_ID"} | Select-Object -First 1
          if(-not $root){throw 'Nacht workshop payload not found'}
          $pak=Join-Path $root.FullName 'WindowsNoEditor.pak'
          if(-not (Test-Path $pak)){throw 'Nacht PAK missing'}
          Invoke-WebRequest 'https://github.com/trumank/repak/releases/download/v0.2.3/repak_cli-x86_64-pc-windows-msvc.zip' -OutFile "$env:RUNNER_TEMP\repak.zip"
          $repakDir="$env:RUNNER_TEMP\repak"
          Expand-Archive "$env:RUNNER_TEMP\repak.zip" -DestinationPath $repakDir -Force
          $repak=Get-ChildItem $repakDir -Filter repak.exe -Recurse | Select-Object -First 1
          if(-not $repak){throw 'repak.exe missing'}
          Remove-Item nacht-source -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path nacht-source | Out-Null
          & $repak.FullName unpack "$pak" -o nacht-source --force
          if($LASTEXITCODE -ne 0){throw "repak unpack failed $LASTEXITCODE"}
          $content=Join-Path $PWD 'nacht-source\Pavlov\Content'
          if(-not (Test-Path $content)){throw 'Pavlov Content root missing'}
          "NACHT_CONTENT_ROOT=$content" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $targets=@(
            "$content\CustomMaps\UGC2755515831\Blueprints\Objects\EasterEgg\Box5.uasset",
            "$content\CustomMaps\UGC2755515831\Blueprints\Perks\PerkMachine_QuickRevive.uasset",
            "$content\CustomMaps\UGC2755515831\Blueprints\KillerJimsPaP\PunchAPackMachine.uasset"
          )
          foreach($target in $targets){if(-not (Test-Path $target)){throw "missing exact Blueprint $target"}}
          Write-Host "XZOGOT_NACHT_AUDIO_BLUEPRINT_SOURCE_GREEN"

      - name: Pin Pavlov UE4.21 mappings
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Invoke-WebRequest 'https://raw.githubusercontent.com/THW-Reaper/PavlovVRMappings/4976647b4f3a209042460bc55a7a3122662d05b7/PavMappings.usmap' -OutFile PavMappings.usmap
          $hash=(Get-FileHash PavMappings.usmap -Algorithm SHA256).Hash.ToLowerInvariant()
          if($hash -ne '6d19f9731cc3fbaba34ca8e0833e81e4ffdf1b407edf24de48b1ccb5c63b060c'){throw "mapping hash mismatch $hash"}

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Build generic Kismet bytecode extractor
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          dotnet restore tools/maps/UENuketownWallbuyBytecode/UENuketownWallbuyBytecode.csproj
          dotnet build tools/maps/UENuketownWallbuyBytecode/UENuketownWallbuyBytecode.csproj -c Release --no-restore
          if($LASTEXITCODE -ne 0){throw 'Kismet extractor build failed'}

      - name: Decompile exact Nacht audio Blueprints
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force -Path build/nacht-audio-bytecode | Out-Null
          $app='tools/maps/UENuketownWallbuyBytecode/bin/Release/net10.0/UENuketownWallbuyBytecode.dll'
          dotnet $app PavMappings.usmap build/nacht-audio-bytecode/audio-blueprints.json "$env:NACHT_CONTENT_ROOT\CustomMaps\UGC2755515831\Blueprints\Objects\EasterEgg\Box5.uasset" "$env:NACHT_CONTENT_ROOT\CustomMaps\UGC2755515831\Blueprints\Perks\PerkMachine_QuickRevive.uasset" "$env:NACHT_CONTENT_ROOT\CustomMaps\UGC2755515831\Blueprints\KillerJimsPaP\PunchAPackMachine.uasset" | Tee-Object build/nacht-audio-bytecode/extract.log
          if($LASTEXITCODE -ne 0){throw "bytecode extraction failed $LASTEXITCODE"}

      - name: Prove dynamic audio authority
        shell: pwsh
        run: |
          @'
          import json,re
          from pathlib import Path
          p=Path("build/nacht-audio-bytecode/audio-blueprints.json")
          d=json.loads(p.read_text())
          assert d["ready"] is True,d
          assert d["packageSuccessCount"]==3,d
          rx=re.compile(r"(sound|audio|cue|play|stop|set.*sound)",re.I)
          proof=[]
          for pkg in d["packages"]:
              imports=[row for row in pkg["imports"] if rx.search(str(row.get("objectName",""))) or rx.search(str(row.get("className",""))) or rx.search(str(row.get("resolved","")))]
              functions=[]
              for fn in pkg["functions"]:
                  calls=[c for c in fn["calls"] if rx.search(str(c.get("call","")))]
                  expressions=[e for e in fn["expressions"] if rx.search(json.dumps(e,sort_keys=True))]
                  if calls or expressions:
                      functions.append({"name":fn["name"],"calls":calls,"expressions":expressions[:100]})
              defaults=[row for row in pkg["normalExportProperties"] if rx.search(json.dumps(row,sort_keys=True))]
              row={"file":pkg["fileName"],"imports":imports,"functions":functions,"defaults":defaults}
              proof.append(row)
              print("XZOGOT_NACHT_AUDIO_BYTECODE_PACKAGE",json.dumps(row,separators=(",",":")))
          Path("build/nacht-audio-bytecode/audio-proof.json").write_text(json.dumps(proof,indent=2)+"\n")
          assert any(x["imports"] or x["functions"] or x["defaults"] for x in proof),proof
          print("XZOGOT_NACHT_AUDIO_BYTECODE_GREEN")
          '@ | python -

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Xogot-Nacht-Audio-Blueprint-Bytecode
          path: |
            build/nacht-audio-bytecode/audio-blueprints.json
            build/nacht-audio-bytecode/audio-proof.json
            build/nacht-audio-bytecode/extract.log
          if-no-files-found: warn
          retention-days: 14
