name: GTA CTW Android 3D

on:
  push:
    branches:
      - "feature/gtactw-android-3d-*"
    paths:
      - "projects/gtactw-android-3d/**"
      - "tools/gtactw/**"
      - ".github/workflows/gtactw-android-3d.yml"
  workflow_dispatch:

jobs:
  probe-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Android NDK
        shell: bash
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "ndk;27.2.12479018"

      - name: Compile probes
        run: |
          python -m py_compile \
            tools/gtactw/ctw_probe.py \
            tools/gtactw/test_ctw_probe.py \
            tools/gtactw/elf_probe.py \
            tools/gtactw/test_elf_probe.py \
            tools/gtactw/pak_inventory.py \
            tools/gtactw/test_pak_inventory.py \
            tools/gtactw/analyze_apk.py \
            tools/gtactw/test_analyze_apk.py \
            tools/gtactw/analyze_apkset.py \
            tools/gtactw/test_analyze_apkset.py \
            tools/gtactw/apk_identity.py \
            tools/gtactw/test_apk_identity.py \
            tools/gtactw/aarch64_xref.py \
            tools/gtactw/test_aarch64_xref.py \
            tools/gtactw/plt_calls.py \
            tools/gtactw/test_plt_calls.py \
            tools/gtactw/apk_modpack.py \
            tools/gtactw/test_apk_modpack.py \
            tools/gtactw/apkset_probe.py \
            tools/gtactw/test_apkset_probe.py \
            tools/gtactw/apkset_modpack.py \
            tools/gtactw/test_apkset_modpack.py \
            tools/gtactw/profile_template.py \
            tools/gtactw/test_profile_template.py \
            tools/gtactw/profile_emit_c.py \
            tools/gtactw/test_profile_emit_c.py \
            tools/gtactw/profile_verify_binary.py \
            tools/gtactw/test_profile_verify_binary.py \
            tools/gtactw/mdl_probe.py \
            tools/gtactw/test_mdl_probe.py \
            tools/gtactw/ped_probe.py \
            tools/gtactw/test_ped_probe.py \
            tools/gtactw/wbl_probe.py \
            tools/gtactw/test_wbl_probe.py \
            tools/gtactw/world_census.py \
            tools/gtactw/test_world_census.py \
            tools/gtactw/adb_collect.py \
            tools/gtactw/test_adb_collect.py \
            tools/gtactw/abi_probe.py \
            tools/gtactw/test_abi_probe.py

      - name: Run CTW ARM64 ABI evidence gate
        run: python -m unittest -v tools/gtactw/test_abi_probe.py

      - name: Run CTW ADB collector gate
        run: python -m unittest -v tools/gtactw/test_adb_collect.py

      - name: Run synthetic CTW PAK gate
        run: python -m unittest -v tools/gtactw/test_ctw_probe.py

      - name: Run CTW split-APK resolver gate
        run: python -m unittest -v tools/gtactw/test_apkset_probe.py

      - name: Run CTW split-APK modpack gate
        run: python -m unittest -v tools/gtactw/test_apkset_modpack.py

      - name: Run CTW APK identity gate
        run: python -m unittest -v tools/gtactw/test_apk_identity.py

      - name: Run CTW ARM64 xref gate
        run: python -m unittest -v tools/gtactw/test_aarch64_xref.py

      - name: Run CTW AArch64 PLT import caller gate
        run: python -m unittest -v tools/gtactw/test_plt_calls.py

      - name: Run synthetic CTW ARM64 ELF gate
        run: python -m unittest -v tools/gtactw/test_elf_probe.py

      - name: Run synthetic CTW PAK inventory gate
        run: python -m unittest -v tools/gtactw/test_pak_inventory.py

      - name: Run synthetic CTW APK repack gate
        run: python -m unittest -v tools/gtactw/test_apk_modpack.py

      - name: Run CTW patch-profile template gate
        run: python -m unittest -v tools/gtactw/test_profile_template.py

      - name: Run CTW verified profile emitter gate
        run: python -m unittest -v tools/gtactw/test_profile_emit_c.py

      - name: Run CTW exact-binary profile verification gate
        run: python -m unittest -v tools/gtactw/test_profile_verify_binary.py

      - name: Run CTW mobile model parser gate
        run: python -m unittest -v tools/gtactw/test_mdl_probe.py

      - name: Run CTW ped model-link inference gate
        run: python -m unittest -v tools/gtactw/test_ped_probe.py

      - name: Run CTW worldblock streaming census gate
        run: python -m unittest -v tools/gtactw/test_wbl_probe.py

      - name: Run CTW world streaming density gate
        run: python -m unittest -v tools/gtactw/test_world_census.py

      - name: Host-compile native CTW loader
        run: |
          cc -shared -fPIC -std=c11 -Wall -Wextra -Werror \
            -o /tmp/libGame.so \
            projects/gtactw-android-3d/android-loader/ctw_loader.c \
            projects/gtactw-android-3d/android-loader/ctw_patch.c \
            projects/gtactw-android-3d/android-loader/ctw_camera.c \
            projects/gtactw-android-3d/android-loader/ctw_camera_pose.c \
            projects/gtactw-android-3d/android-loader/ctw_character.c \
            projects/gtactw-android-3d/android-loader/ctw_runtime_policy.c \
            projects/gtactw-android-3d/android-loader/ctw_profile.c \
            projects/gtactw-android-3d/android-loader/ctw_config.c \
            -ldl -lpthread
          nm -D --defined-only /tmp/libGame.so | grep -q "Java_com_rockstargames_oswrapper_GameNative_implOnDrawFrame"
          nm -D --defined-only /tmp/libGame.so | grep -q "Java_com_rockstargames_oswrapper_GameNative_implOnGamepadAxesChanged"
          nm -D --defined-only /tmp/libGame.so | grep -q "Java_com_rockstargames_oswrapper_GameNative_implIsInitialized"
          echo "GTACTW_ANDROID_PROXY_LOADER_GREEN=1"

      - name: Build CTW proxy for Android ARM64
        shell: bash
        run: |
          cmake \
            -S projects/gtactw-android-3d/android-loader \
            -B /tmp/ctw-android-arm64 \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_HOME}/ndk/27.2.12479018/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/ctw-android-arm64 --parallel
          test -f /tmp/ctw-android-arm64/libGame.so
          file /tmp/ctw-android-arm64/libGame.so | grep -q "ARM aarch64"
          "${ANDROID_HOME}/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm" \
            -D --defined-only /tmp/ctw-android-arm64/libGame.so \
            | grep -q "Java_com_rockstargames_oswrapper_GameNative_implOnDrawFrame"
          echo "GTACTW_ANDROID_ARM64_LOADER_GREEN=1"

      - name: Run CTW camera input state gate
        run: |
          cc -std=c11 -Wall -Wextra -Werror \
            -Iprojects/gtactw-android-3d/android-loader \
            -o /tmp/ctw_camera_test \
            projects/gtactw-android-3d/android-loader/test_camera_state.c \
            projects/gtactw-android-3d/android-loader/ctw_camera.c \
            projects/gtactw-android-3d/android-loader/ctw_patch.c \
            projects/gtactw-android-3d/android-loader/ctw_profile.c \
            -ldl -lm
          /tmp/ctw_camera_test
          echo "GTACTW_CAMERA_INPUT_GREEN=1"

      - name: Run CTW camera pose math gate
        run: |
          cc -std=c11 -Wall -Wextra -Werror \
            -Iprojects/gtactw-android-3d/android-loader \
            -o /tmp/ctw_camera_pose_test \
            projects/gtactw-android-3d/android-loader/test_camera_pose.c \
            projects/gtactw-android-3d/android-loader/ctw_camera_pose.c \
            -lm
          /tmp/ctw_camera_pose_test
          echo "GTACTW_CAMERA_POSE_GREEN=1"
          echo "GTACTW_RUNTIME_POLICY_GREEN=1"

      - name: Run CTW projection-distance policy gate
        run: |
          cc -std=c11 -Wall -Wextra -Werror \
            -Iprojects/gtactw-android-3d/android-loader \
            -o /tmp/ctw_runtime_policy_test \
            projects/gtactw-android-3d/android-loader/test_runtime_policy.c \
            projects/gtactw-android-3d/android-loader/ctw_runtime_policy.c \
            -lm
          /tmp/ctw_runtime_policy_test
          echo "GTACTW_RUNTIME_POLICY_GREEN=1"

      - name: Run CTW character visibility policy gate
        run: |
          cc -std=c11 -Wall -Wextra -Werror \
            -Iprojects/gtactw-android-3d/android-loader \
            -o /tmp/ctw_character_test \
            projects/gtactw-android-3d/android-loader/test_character_policy.c \
            projects/gtactw-android-3d/android-loader/ctw_character.c
          /tmp/ctw_character_test
          echo "GTACTW_CAMERA_POSE_GREEN=1"
          echo "GTACTW_CHARACTER_POLICY_GREEN=1"

      - name: Run CTW Mod Hub config parser gate
        run: |
          cc -std=c11 -Wall -Wextra -Werror \
            -Iprojects/gtactw-android-3d/android-loader \
            -o /tmp/ctw_config_test \
            projects/gtactw-android-3d/android-loader/test_config.c \
            projects/gtactw-android-3d/android-loader/ctw_config.c \
            -lm
          /tmp/ctw_config_test
          echo "GTACTW_CHARACTER_POLICY_GREEN=1"
          echo "GTACTW_MODHUB_CONFIG_GREEN=1"

      - name: Run CTW patch-state gate
        run: |
          cc -std=c11 -Wall -Wextra -Werror \
            -Iprojects/gtactw-android-3d/android-loader \
            -o /tmp/ctw_patch_state_test \
            projects/gtactw-android-3d/android-loader/test_patch_state.c \
            projects/gtactw-android-3d/android-loader/ctw_patch.c \
            projects/gtactw-android-3d/android-loader/ctw_profile.c \
            -ldl
          /tmp/ctw_patch_state_test
          echo "GTACTW_PATCH_STATE_GREEN=1"

      - name: Run CTW runtime profile matcher gate
        run: |
          cc -std=c11 -Wall -Wextra -Werror \
            -Iprojects/gtactw-android-3d/android-loader \
            -o /tmp/ctw_profile_test \
            projects/gtactw-android-3d/android-loader/test_profile_match.c \
            projects/gtactw-android-3d/android-loader/ctw_profile.c \
            -ldl
          /tmp/ctw_profile_test
          echo "GTACTW_PATCH_STATE_GREEN=1"
          echo "GTACTW_RUNTIME_PROFILE_MATCH_GREEN=1"

      - name: Run synthetic CTW end-to-end APK gate
        run: python -m unittest -v tools/gtactw/test_analyze_apk.py

      - name: Run CTW split end-to-end analysis gate
        run: python -m unittest -v tools/gtactw/test_analyze_apkset.py

      - name: Gate marker
        run: |
          echo "GTACTW_ABI_EVIDENCE_GREEN=1"
          echo "GTACTW_ADB_COLLECTOR_GREEN=1"
          echo "GTACTW_ANDROID_PAK_PROBE_GREEN=1"
          echo "GTACTW_ANDROID_SPLIT_APK_GREEN=1"
          echo "GTACTW_ANDROID_SPLIT_MODPACK_GREEN=1"
          echo "GTACTW_ANDROID_ELF_PROBE_GREEN=1"
          echo "GTACTW_ANDROID_PAK_INVENTORY_GREEN=1"
          echo "GTACTW_ANDROID_ANALYZER_GREEN=1"
          echo "GTACTW_ANDROID_SPLIT_ANALYZER_GREEN=1"
          echo "GTACTW_ANDROID_IDENTITY_GREEN=1"
          echo "GTACTW_ANDROID_XREF_GREEN=1"
          echo "GTACTW_ANDROID_PLT_CALLS_GREEN=1"
          echo "GTACTW_ANDROID_APK_MODPACK_GREEN=1"
          echo "GTACTW_ANDROID_PROFILE_TEMPLATE_GREEN=1"
          echo "GTACTW_ANDROID_PROFILE_EMITTER_GREEN=1"
          echo "GTACTW_ANDROID_PROFILE_BINARY_VERIFY_GREEN=1"
          echo "GTACTW_ANDROID_MDL_PROBE_GREEN=1"
          echo "GTACTW_ANDROID_PED_PROBE_GREEN=1"
          echo "GTACTW_ANDROID_WBL_PROBE_GREEN=1"
          echo "GTACTW_ANDROID_WORLD_CENSUS_GREEN=1"
          echo "GTACTW_MODHUB_CONFIG_GREEN=1"
          echo "GTACTW_ANDROID_ARM64_LOADER_GREEN=1"
          echo "GTACTW_RUNTIME_PROFILE_MATCH_GREEN=1"
