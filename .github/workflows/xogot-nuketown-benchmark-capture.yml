name: Xogot Nuketown Benchmark Capture

on:
  workflow_dispatch:
  push:
    branches:
      - feature/godot-aaa-rebuild-v1
    paths:
      - "xogot/ci/nuketown_benchmark_capture.gd"
      - "xogot/scripts/xziel_benchmark_loader.gd"
      - "xogot/data/nuketown_source_gameplay.json"
      - "tools/maps/xztx_astc6_to_png.py"
      - "benchmarks/nuketown_xziel/**"
      - ".github/workflows/xogot-nuketown-benchmark-capture.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: xogot-nuketown-benchmark-capture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5

      - name: Mount benchmark payload into Godot project
        shell: bash
        run: |
          set -euo pipefail
          test -d benchmarks/nuketown_xziel
          rm -rf xogot/assets/benchmarks/nuketown_xziel
          mkdir -p xogot/assets/benchmarks
          cp -a benchmarks/nuketown_xziel xogot/assets/benchmarks/nuketown_xziel
          echo "XZOGOT_NUKETOWN_BENCHMARK_MOUNT_GREEN"

      - name: Validate Godot-safe native mesh payload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path("xogot/assets/benchmarks/nuketown_xziel")
          authority=json.loads((root/"source_manifest.json").read_text())
          assert authority["source_authority"] == "Pavlov/Plugins/UGC5097941/Content (complete folder)", authority
          assert authority["source_file_count"] == 2859, authority
          assert authority["source_package_count"] == 1266, authority
          assert authority["source_export_count"] == 2499, authority
          complete=authority["complete_converted_library"]
          expected={
              "static_meshes":83,
              "textures":321,
              "audio":26,
              "skeletons":3,
              "skeletal_meshes":3,
              "animations":9,
          }
          assert {k:int(complete[k]["count"]) for k in expected} == expected, complete
          assert authority["texture_count"] == 321, authority
          assert authority["complete_source_texture_count"] == 321, authority
          skeletal=authority["complete_skeletal_runtime_library"]
          assert skeletal["exact_runtime_bindings_ready"] is True, skeletal
          bindings=json.loads((root/skeletal["runtime_bindings"]).read_text())
          assert bindings["ready"] is True, bindings
          assert bindings["bindingCount"] == 3, bindings
          assert len(bindings["bindings"]) == 3, bindings
          assert sum(len(row["animations"]) for row in bindings["bindings"]) == 9, bindings
          print("XZOGOT_NUKETOWN_CAPTURE_COMPLETE_SOURCE_GREEN", expected)
          print(
              "XZOGOT_NUKETOWN_CAPTURE_SKELETAL_GREEN",
              [(row["actorName"],row["sourceXzskFile"],row["gltf"]) for row in bindings["bindings"]]
          )

          p=root/"native-glb-report.json"
          d=json.loads(p.read_text())
          assert d["mesh_count"] == 52, d
          assert d["mesh_chunks"] == 53, d
          assert d["max_chunk_surfaces"] <= 240, d
          assert d["vertices"] == 671012, d
          assert d["indices"] == 859353, d
          assert d["submeshes"] == 563, d
          print(
              "XZOGOT_NUKETOWN_CHUNK_PREFLIGHT_GREEN",
              "meshes=", d["mesh_count"],
              "chunks=", d["mesh_chunks"],
              "max_surfaces=", d["max_chunk_surfaces"],
          )
          PY

      - name: Install rendering tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip curl xvfb libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers astcenc

      - name: Decode all 321 source textures for Godot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          python3 tools/maps/xztx_astc6_to_png.py \
            xogot/assets/benchmarks/nuketown_xziel \
            2>&1 | tee build/nuketown-benchmark-texture-decode.log
          grep -q "XZOGOT_ASTC6_DECODE_GREEN" build/nuketown-benchmark-texture-decode.log
          grep -q "XZOGOT_XZTX_COMPLETE_DECODE_GREEN textures=321 astc6=312 bgra8=9" build/nuketown-benchmark-texture-decode.log

      - name: Install Godot 4.6.1
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --retry-all-errors --retry-delay 2 \
            https://github.com/godotengine/godot-builds/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip \
            -o /tmp/godot.zip
          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.6.1-stable_linux.x86_64

      - name: Import benchmark project assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/nuketown-benchmark
          timeout 300 /tmp/godot/Godot_v4.6.1-stable_linux.x86_64 \
            --headless --editor --path xogot --quit \
            2>&1 | tee build/nuketown-benchmark/import.log
          ! grep -E "SCRIPT ERROR|Parse Error|ERROR: Failed to load script|MAX_MESH_SURFACES" build/nuketown-benchmark/import.log

      - name: Render source world benchmark
        shell: bash
        run: |
          set -euo pipefail
          timeout 300 xvfb-run -a -s "-screen 0 1280x720x24" \
            /tmp/godot/Godot_v4.6.1-stable_linux.x86_64 \
            --path xogot \
            --rendering-method gl_compatibility \
            --resolution 1280x720 \
            --script res://ci/nuketown_benchmark_capture.gd \
            2>&1 | tee build/nuketown-benchmark/render.log

          grep -q "XZOGOT_NUKETOWN_WORLD_RUNTIME_GREEN" build/nuketown-benchmark/render.log
          grep -q "XZOGOT_NUKETOWN_SPAWN_SCREENSHOT_GREEN" build/nuketown-benchmark/render.log
          grep -q "XZOGOT_NUKETOWN_OVERVIEW_SCREENSHOT_GREEN" build/nuketown-benchmark/render.log
          ! grep -E "MAX_MESH_SURFACES|NUKETOWN_CAPTURE:" build/nuketown-benchmark/render.log
          test -s /tmp/xogot-nuketown-spawn.png
          test -s /tmp/xogot-nuketown-overview.png
          cp /tmp/xogot-nuketown-spawn.png build/nuketown-benchmark/xogot-nuketown-spawn.png
          cp /tmp/xogot-nuketown-overview.png build/nuketown-benchmark/xogot-nuketown-overview.png

      - name: Upload benchmark screenshots
        uses: actions/upload-artifact@v4
        with:
          name: Xogot-Nuketown-Source-World-Screenshots
          path: |
            build/nuketown-benchmark/xogot-nuketown-spawn.png
            build/nuketown-benchmark/xogot-nuketown-overview.png
            build/nuketown-benchmark/render.log
          if-no-files-found: error
          retention-days: 7
