name: Sanctum CC0 Industrial Object Inventory

on:
  push:
    branches:
      - feature/xziel-map-builder-agent-v1
    paths:
      - ".github/workflows/sanctum-cc0-industrial-inventory.yml"
      - "tools/sanctum_v2/inventory_cc0_sanctum_props.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sanctum-cc0-industrial-inventory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5

      - name: Install runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl xz-utils unzip libx11-6 libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libglu1-mesa

      - name: Fetch verified CC0 industrial pack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p external-industrial industrial-inventory
          curl -L --fail --retry 3 https://opengameart.org/content/pbr-industrial-asset-pack -o industrial-inventory/source-page.html
          grep -qi CC0 industrial-inventory/source-page.html
          curl -L --fail --retry 3 https://opengameart.org/sites/default/files/oga_industrial_a52_version_0.zip -o /tmp/industrial.zip
          sha256sum /tmp/industrial.zip | tee industrial-inventory/source.sha256
          unzip -q /tmp/industrial.zip -d external-industrial
          test -s external-industrial/OGA_industrial_a52_version/industrial_final_cycles.blend

      - name: Install Blender
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz -o /tmp/blender.tar.xz
          tar -C /tmp -xf /tmp/blender.tar.xz

      - name: Inventory industrial objects
        shell: bash
        env:
          SANCTUM_PROP_INV_OUT: industrial-inventory
          SANCTUM_PROP_PACK: industrial
        run: |
          set -euo pipefail
          export SANCTUM_PROP_SHA256="$(cut -d' ' -f1 industrial-inventory/source.sha256)"
          /tmp/blender-5.2.2-linux-x64/blender \
            -b external-industrial/OGA_industrial_a52_version/industrial_final_cycles.blend \
            --python tools/sanctum_v2/inventory_cc0_sanctum_props.py \
            2>&1 | tee industrial-inventory/blender.log
          grep -q SANCTUM_PROP_INVENTORY_PASS industrial-inventory/blender.log

      - name: Validate inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          d=json.load(open("industrial-inventory/inventory.json",encoding="utf-8"))
          assert d["status"]=="PASS",d
          assert d["license"]=="CC0",d
          assert d["mesh_object_count"]>=10,d
          assert len(d["sha256"])==64,d
          print("SANCTUM_INDUSTRIAL_INVENTORY_GREEN",d["mesh_object_count"])
          print("TOP_OBJECTS",[x["name"] for x in d["objects"][:30]])
          PY

      - name: Upload inventory
        uses: actions/upload-artifact@v4
        with:
          name: XZIEL-Sanctum-CC0-Industrial-Inventory
          path: industrial-inventory/
          if-no-files-found: error
          retention-days: 14
