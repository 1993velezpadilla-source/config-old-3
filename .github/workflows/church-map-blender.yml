name: Build Church Map with Blender

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/church-map-blender.yml"
      - "tools/church_map/**"
      - "tools/xziel_toolchain/bootstrap_geometry_cpu.sh"
      - "tools/xziel_toolchain/generate_collision_hulls.py"
      - "ci/sanctum_dressing/build_dressing.py"
      - "docs/SANCTUM_OF_ASH_MAP_BIBLE.md"

permissions:
  contents: read

concurrency:
  group: xziel-church-map-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-church-map:
    name: Sanctum of Ash Blender + runtime validation
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout Xziel
        uses: actions/checkout@v5

      - name: Install 3D and NZP map dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            blender python3-numpy \
            libegl1 libgl1-mesa-dri libglx-mesa0 mesa-utils xvfb \
            git wget curl unzip zip libicu-dev python3-venv
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet objaverse trimesh huggingface_hub
          blender --version

      - name: Fetch St Giles Cripplegate from Objaverse
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p church/source church/out
          python3 - <<'PY'
          import json
          import shutil
          from pathlib import Path
          import objaverse

          uid = "b92917ff83914adc8bc93959ba8b4399"
          out = Path("church/source")
          out.mkdir(parents=True, exist_ok=True)

          annotations = objaverse.load_annotations([uid])
          ann = annotations.get(uid)
          if not ann:
              raise SystemExit("St Giles Cripplegate UID is not present in Objaverse 1.0 annotations")
          if ann.get("license") != "by":
              raise SystemExit(f"Unexpected source license: {ann.get('license')!r}; expected CC BY")

          print(json.dumps(ann, indent=2))
          (out / "source_metadata.json").write_text(json.dumps(ann, indent=2), encoding="utf-8")

          objects = objaverse.load_objects([uid], download_processes=1)
          source = objects.get(uid)
          if not source:
              raise SystemExit("Objaverse metadata exists but the St Giles GLB could not be downloaded")

          shutil.copy2(source, out / "st-giles-cripplegate.glb")
          (out / "ATTRIBUTION.txt").write_text(
              "St Giles Cripplegate by artfletch\n"
              "Original Sketchfab UID: b92917ff83914adc8bc93959ba8b4399\n"
              "Original page: https://sketchfab.com/3d-models/st-giles-cripplegate-b92917ff83914adc8bc93959ba8b4399\n"
              "License published by creator: Creative Commons Attribution (CC BY).\n"
              "Downloaded for this build through the public Objaverse dataset mirror.\n",
              encoding="utf-8",
          )
          print("SOURCE", source)
          print("COPIED", out / "st-giles-cripplegate.glb")
          PY
          ls -lh church/source

      - name: Convert, inspect and render in Blender
        shell: bash
        env:
          CHURCH_SOURCE: church/source/st-giles-cripplegate.glb
          CHURCH_OUT: church/out
          CHURCH_TARGET_TRIS: "650000"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          xvfb-run -a -s "-screen 0 1280x1024x24" \
            blender --background --python tools/church_map/build_church_scene.py \
            2>&1 | tee church/out/blender-build.log
          cp church/source/source_metadata.json church/out/
          cp church/source/ATTRIBUTION.txt church/out/
          cp docs/SANCTUM_OF_ASH_MAP_BIBLE.md church/out/

      - name: Author Zombies gameplay blockout from real scan zones
        shell: bash
        env:
          CHURCH_MASTER: church/out/church_map_master.blend
          CHURCH_OUT: church/out
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          xvfb-run -a -s "-screen 0 1600x1000x24" \
            blender --background \
            --python tools/church_map/design_zombies_gameplay.py \
            2>&1 | tee church/out/zombies-gameplay-build.log

      - name: Build collision and nav proxy pass
        shell: bash
        env:
          CHURCH_GAMEPLAY_BLEND: church/out/church_zombies_gameplay_v1.blend
          CHURCH_PLAN: church/out/zombies_map_plan.json
          CHURCH_OUT: church/out
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          xvfb-run -a -s "-screen 0 1600x1000x24" \
            blender --background \
            --python tools/church_map/build_runtime_collision.py \
            2>&1 | tee church/out/collision-nav-build.log

      - name: Fit collision and barricades to real church geometry
        shell: bash
        env:
          CHURCH_GAMEPLAY_BLEND: church/out/church_zombies_gameplay_v1.blend
          CHURCH_PLAN: church/out/zombies_map_plan.json
          CHURCH_OUT: church/out
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          xvfb-run -a -s "-screen 0 1600x1000x24" \
            blender --background \
            --python tools/church_map/fit_runtime_geometry_v2.py \
            2>&1 | tee church/out/runtime-fitted-v2.log

      - name: Generate CoACD convex collision sidecar
        shell: bash
        run: |
          set -euo pipefail
          bash tools/xziel_toolchain/bootstrap_geometry_cpu.sh
          .xziel-tools/geometry-venv/bin/python             tools/xziel_toolchain/generate_collision_hulls.py             --input church/out/church_collision_fitted_v2.glb             --output church/out/church_collision_coacd_v3.glb             --report church/out/church_collision_coacd_v3.json             --threshold 0.08             --max-hulls 128             --max-hull-vertices 64

          test -s church/out/church_collision_coacd_v3.glb
          test -s church/out/church_collision_coacd_v3.json
          python3 - <<'PY'
          import json
          d=json.load(open("church/out/church_collision_coacd_v3.json",encoding="utf-8"))
          assert d["status"]=="PASS", d
          assert 1 <= d["hull_count"] <= 128, d
          assert d["hull_triangles"] > 0, d
          print("XZIEL_CHURCH_COACD_GREEN",d["hull_count"],d["hull_triangles"])
          PY

      - name: Build runtime horror dressing overlay
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          mkdir -p church/out/dressing
          SANCTUM_BLEND=church/out/church_zombies_gameplay_v1.blend \
          SANCTUM_PLAN=church/out/zombies_map_plan.json \
          SANCTUM_FITTED=church/out/church_runtime_fitted_v2.json \
          SANCTUM_DRESS_OUT=church/out/dressing \
          xvfb-run -a -s "-screen 0 1600x1000x24" \
            blender --background --python ci/sanctum_dressing/build_dressing.py \
            2>&1 | tee church/out/dressing-build.log
          test -s church/out/dressing/sanctum_dressing_v1.blend
          test -s church/out/dressing/sanctum_dressing_v1.glb
          test -s church/out/dressing/sanctum_dressing_v1.json

      - name: Export textured Vril static mesh
        shell: bash
        env:
          CHURCH_GAMEPLAY_BLEND: church/out/dressing/sanctum_dressing_v1.blend
          CHURCH_PLAN: church/out/zombies_map_plan.json
          CHURCH_OUT: church/out
          XZIEL_STATIC_TARGET_TRIS: "640000"
          XZIEL_STATIC_TEXTURE_MAX: "2048"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          xvfb-run -a -s "-screen 0 1600x1000x24" \
            blender --background \
            --python tools/church_map/export_vril_static_mesh.py \
            2>&1 | tee church/out/vril-static-export.log
          test -s church/out/vril_static/models/xziel/sanctum/sanctum.xzsm
          test -d church/out/vril_static/textures/xziel/sanctum
          test -s church/out/vril_static_mesh_report.json

      - name: Export portable map package
        shell: bash
        env:
          CHURCH_PLAN: church/out/zombies_map_plan.json
          CHURCH_PACKAGE: church/out/SanctumOfAsh
        run: |
          set -euo pipefail
          python3 tools/church_map/export_map_package.py | tee church/out/map-package-preflight.log
          mkdir -p church/out/SanctumOfAsh/geometry church/out/SanctumOfAsh/nav
          cp church/out/church_map_mobile_lod0.glb church/out/SanctumOfAsh/geometry/
          cp church/out/church_collision_proxy_v1.glb church/out/SanctumOfAsh/geometry/
          cp church/out/church_collision_fitted_v2.glb church/out/SanctumOfAsh/geometry/
          cp church/out/church_collision_coacd_v3.glb church/out/SanctumOfAsh/geometry/
          cp church/out/church_collision_coacd_v3.json church/out/SanctumOfAsh/nav/
          cp church/out/church_barricades_fitted_v2.glb church/out/SanctumOfAsh/geometry/
          cp church/out/dressing/sanctum_dressing_v1.glb church/out/SanctumOfAsh/geometry/
          cp church/out/church_nav_proxy_v1.json church/out/SanctumOfAsh/nav/
          cp church/out/church_runtime_fitted_v2.json church/out/SanctumOfAsh/nav/
          cp church/out/ATTRIBUTION.txt church/out/SanctumOfAsh/
          cp church/out/SANCTUM_OF_ASH_MAP_BIBLE.md church/out/SanctumOfAsh/

      - name: Export NZP compatibility harness
        shell: bash
        env:
          CHURCH_PACKAGE: church/out/SanctumOfAsh
          CHURCH_PLAN: church/out/zombies_map_plan.json
          CHURCH_FITTED: church/out/church_runtime_fitted_v2.json
          NZP_MAP_OUT: church/out/nzp_harness/sanctum_harness.map
        run: |
          set -euo pipefail
          python3 tools/church_map/export_nzp_harness.py | tee church/out/nzp-harness-export.log
          test -s church/out/nzp_harness/sanctum_harness.map

      - name: Compile NZP BSP and spawn zones with official toolchain
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/nzp-assets /tmp/spawn-zone-tool
          git clone --depth 1 https://github.com/nzp-team/assets.git /tmp/nzp-assets
          git clone --depth 1 --recursive https://github.com/nzp-team/spawn-zone-tool.git /tmp/spawn-zone-tool
          python3 -m pip install --quiet -r /tmp/spawn-zone-tool/requirements.txt

          (
            cd /tmp/nzp-assets
            bash tools/compile-wads.sh
            mkdir -p source/maps/sanctum_harness
            cp "$GITHUB_WORKSPACE/church/out/nzp_harness/sanctum_harness.map" source/maps/sanctum_harness/sanctum_harness.map
            bash tools/compile-maps.sh --map sanctum_harness --zone-tool-path /tmp/spawn-zone-tool
          ) 2>&1 | tee church/out/nzp-harness-compile.log

          cp /tmp/nzp-assets/common/maps/sanctum_harness.bsp church/out/nzp_harness/
          if [[ -s /tmp/nzp-assets/common/maps/sanctum_harness.nsz ]]; then
            cp /tmp/nzp-assets/common/maps/sanctum_harness.nsz church/out/nzp_harness/
          fi
          ls -lh church/out/nzp_harness/

      - name: Validate all outputs
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            church/out/church_map_master.blend \
            church/out/church_map_mobile_lod0.glb \
            church/out/church_scene_report.json \
            church/out/exterior_3q.png \
            church/out/exterior_opposite.png \
            church/out/top_layout.png \
            church/out/entry_axis.png \
            church/out/church_zombies_gameplay_v1.blend \
            church/out/zombies_map_plan.json \
            church/out/zombies_gameplay_top.png \
            church/out/zombies_gameplay_iso.png \
            church/out/zombies_tower_quest.png \
            church/out/church_zombies_collision_nav_v1.blend \
            church/out/church_collision_proxy_v1.glb \
            church/out/church_nav_proxy_v1.json \
            church/out/church_zombies_runtime_fitted_v2.blend \
            church/out/church_collision_fitted_v2.glb \
            church/out/church_collision_coacd_v3.glb \
            church/out/church_collision_coacd_v3.json \
            church/out/church_barricades_fitted_v2.glb \
            church/out/church_runtime_fitted_v2.json \
            church/out/dressing/sanctum_dressing_v1.blend \
            church/out/dressing/sanctum_dressing_v1.glb \
            church/out/dressing/sanctum_dressing_v1.json \
            church/out/vril_static/models/xziel/sanctum/sanctum.xzsm \
            church/out/vril_static_mesh_report.json \
            church/out/SANCTUM_OF_ASH_MAP_BIBLE.md \
            church/out/SanctumOfAsh/map.json \
            church/out/SanctumOfAsh/entities.json \
            church/out/SanctumOfAsh/spawns.json \
            church/out/SanctumOfAsh/logic.json \
            church/out/SanctumOfAsh/quests.json \
            church/out/SanctumOfAsh/preflight.json \
            church/out/SanctumOfAsh/geometry/church_map_mobile_lod0.glb \
            church/out/SanctumOfAsh/geometry/church_collision_proxy_v1.glb \
            church/out/SanctumOfAsh/geometry/church_collision_fitted_v2.glb \
            church/out/SanctumOfAsh/geometry/church_collision_coacd_v3.glb \
            church/out/SanctumOfAsh/nav/church_collision_coacd_v3.json \
            church/out/SanctumOfAsh/geometry/church_barricades_fitted_v2.glb \
            church/out/SanctumOfAsh/nav/church_runtime_fitted_v2.json \
            church/out/nzp_harness/sanctum_harness.map \
            church/out/nzp_harness/sanctum_harness.bsp
          do
            test -s "$f"
          done

          test -s church/out/nzp_harness/sanctum_harness.nsz

          python3 - <<'PY'
          import json
          r=json.load(open("church/out/church_scene_report.json", encoding="utf-8"))
          p=json.load(open("church/out/zombies_map_plan.json", encoding="utf-8"))
          q=json.load(open("church/out/SanctumOfAsh/preflight.json", encoding="utf-8"))
          n=json.load(open("church/out/church_nav_proxy_v1.json", encoding="utf-8"))
          h=json.load(open("church/out/nzp_harness/sanctum_harness_export.json", encoding="utf-8"))
          f=json.load(open("church/out/church_runtime_fitted_v2.json", encoding="utf-8"))
          c=json.load(open("church/out/church_collision_coacd_v3.json", encoding="utf-8"))
          s=json.load(open("church/out/vril_static_mesh_report.json", encoding="utf-8"))
          assert r["source_triangles"] >= 2700000, r
          assert r["mobile_lod0_triangles"] >= 640000, r
          assert p["working_title"] == "SANCTUM OF ASH"
          assert len(p["interactives"]) >= 30
          assert q["ok"], q
          assert len(n["nodes"]) >= 8
          assert len(n["windowCandidates"]) >= 8
          assert h["spawns"] >= 8
          assert s["runtimeTriangles"] >= 620000, s
          assert s["dressingTriangles"] > 0, s
          assert s["dressingObjectCount"] > 0, s
          assert s["runtimeTotalTriangles"] > s["runtimeTriangles"], s
          assert s["textureMaxDimension"] >= 2048, s
          assert s["batchCount"] <= 512, s
          assert s["version"] >= 2, s
          assert s["vertexStrideBytes"] == 24, s
          assert s["vertexLighting"] == "night_moon_plus_zone_practicals_v1", s
          assert f["counts"]["barricades"] >= 8, f
          assert f["counts"]["raycastFitted"] > 0, f
          assert f["counts"]["collisionMeshes"] >= 4, f
          assert c["status"] == "PASS", c
          assert 1 <= c["hull_count"] <= 128, c
          assert c["hull_triangles"] > 0, c
          assert s["runtimeTriangles"] >= 100000, s
          assert s["batchCount"] > 0, s
          assert s["textureCount"] > 0, s
          assert s["modelBytes"] > 1000000, s
          for zone in ["boiler","clock_chamber","ringing_chamber","tower_stairs"]:
              assert zone in p["zones"], zone
          print("SOURCE_TRIANGLES", r["source_triangles"])
          print("MOBILE_LOD0_TRIANGLES", r["mobile_lod0_triangles"])
          print("GAMEPLAY_ZONES", sorted(p["zones"]))
          print("INTERACTIVES", len(p["interactives"]))
          print("NAV_NODES", len(n["nodes"]))
          print("WINDOW_CANDIDATES", len(n["windowCandidates"]))
          print("NZP_HARNESS", h)
          print("FITTED_RUNTIME", f["counts"])
          print("COACD_COLLISION", {k:c[k] for k in ["hull_count","hull_triangles","output_bytes"]})
          print("VRIL_STATIC", {k:s[k] for k in ["version","runtimeTriangles","dressingTriangles","runtimeTotalTriangles","dressingObjectCount","batchCount","textureCount","modelBytes","vertexStrideBytes","vertexLighting"]})
          print("PACKAGE_PREFLIGHT", q)
          PY

      - name: Upload Sanctum of Ash development build
        uses: actions/upload-artifact@v4
        with:
          name: Xziel-Sanctum-of-Ash-Runtime-Blockout
          path: church/out/
          if-no-files-found: error
          retention-days: 14
