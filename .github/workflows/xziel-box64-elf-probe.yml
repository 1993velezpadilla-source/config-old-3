name: XZIEL Box64 ELF Probe

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/xziel-nacht-win64-exe-v1
    paths:
      - ".github/workflows/xziel-box64-elf-probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Clone pinned Winlator
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/brunodev85/winlator-app.git winlator
          git -C winlator checkout 3981d86efa4f333b2a34a7da8b6521476cd8c8b9

      - name: Inspect builtin Box64 0.4.4
        shell: bash
        run: |
          set -euo pipefail
          src="winlator/app/src/main/assets/box64/box64-0.4.4.tzst"
          test -s "$src"
          mkdir -p out/root
          tar --zstd -xf "$src" -C out/root
          box="$(find out/root -type f -path '*/usr/local/bin/box64' -print -quit)"
          test -n "$box" -a -s "$box"
          echo "BOX64=$box"
          file "$box" | tee out/file.txt
          readelf -h "$box" | tee out/elf-header.txt
          readelf -l "$box" | tee out/program-headers.txt
          readelf -d "$box" | tee out/dynamic.txt || true
          echo "XZIEL_BOX64_TYPE=$(readelf -h "$box" | awk -F: '/Type:/{gsub(/^ +/,"",$2); print $2}')"
          interp="$(readelf -l "$box" | sed -n 's/.*Requesting program interpreter: \(.*\)]/\1/p')"
          echo "XZIEL_BOX64_INTERP=$interp"
          if readelf -h "$box" | grep -q 'Type:.*DYN'; then
            echo "XZIEL_BOX64_PIE=1"
          else
            echo "XZIEL_BOX64_PIE=0"
          fi

      - name: Probe rootfs ARM64 interpreters
        shell: bash
        run: |
          set -euo pipefail
          rootfs="winlator/app/src/main/assets/rootfs.tzst"
          test -s "$rootfs"
          mkdir -p out/rootfs
          tar --zstd -xf "$rootfs" -C out/rootfs

          : > out/rootfs-arm64-interpreters.txt
          while IFS= read -r -d '' f; do
            desc="$(file -b "$f" 2>/dev/null || true)"
            case "$desc" in
              *ELF*"ARM aarch64"*)
                interp="$(readelf -l "$f" 2>/dev/null | sed -n 's/.*Requesting program interpreter: \(.*\)]/\1/p' | head -n1)"
                if [[ -n "$interp" ]]; then
                  rel="${f#out/rootfs/}"
                  printf '%s\t%s\n' "$rel" "$interp" >> out/rootfs-arm64-interpreters.txt
                fi
                ;;
            esac
          done < <(find out/rootfs -type f -print0)

          grep -R -a -l '/data/data/com\.winlator' out/rootfs 2>/dev/null             | sed 's#^out/rootfs/##' > out/rootfs-com-winlator-paths.txt || true

          echo "XZIEL_ROOTFS_ARM64_INTERP_COUNT=$(wc -l < out/rootfs-arm64-interpreters.txt)"
          echo "XZIEL_ROOTFS_COM_WINLATOR_REF_COUNT=$(wc -l < out/rootfs-com-winlator-paths.txt)"
          echo "--- ARM64 interpreters ---"
          cat out/rootfs-arm64-interpreters.txt
          echo "--- /data/data/com.winlator refs ---"
          head -n 200 out/rootfs-com-winlator-paths.txt

      - name: Upload ELF probe
        uses: actions/upload-artifact@v4
        with:
          name: XZIEL-Box64-ELF-Probe
          path: out/
          if-no-files-found: error
