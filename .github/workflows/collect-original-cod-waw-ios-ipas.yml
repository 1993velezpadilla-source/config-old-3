name: Collect Original World at War Zombies iOS IPAs

on:
  workflow_dispatch:
  push:
    branches:
      - feature/boz-mod-runtime
    paths:
      - .github/workflows/collect-original-cod-waw-ios-ipas.yml

permissions:
  contents: read

jobs:
  download-archive:
    name: Fetch archived iPad and iPhone IPAs unchanged
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download original legacy iOS app archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cod-waw-ios
          cd /tmp/cod-waw-ios
          base='https://archive.org/download/call-of-duty-waw-blackops-zombies-stirketeam-ios'
          ipad="$base/Call%20of%20Duty%20World%20at%20War%20Zombies%20HD/Call%20of%20Duty%20WAW%20Zombies%20HD%20v1.5.0%20%28IOS%203.2%2B%20for%20iPads%20Only%29.ipa"
          iphone="$base/Call%20of%20Duty%20World%20at%20War%20Zombies/Call%20of%20Duty%20World%20at%20War%20Zombies%20v1.5.0%20%28IOS%203.0%2B%29.ipa"
          curl --fail --location --retry 4 --retry-all-errors --retry-delay 8 --connect-timeout 30 --max-time 480 --user-agent 'Mozilla/5.0' -o 'COD_WAW_Zombies_HD_iPad_v1.5.0.ipa' "$ipad"
          curl --fail --location --retry 4 --retry-all-errors --retry-delay 8 --connect-timeout 30 --max-time 480 --user-agent 'Mozilla/5.0' -o 'COD_WAW_Zombies_iPhone_v1.5.0.ipa' "$iphone"
          printf '%s  %s\n' '198399fe9da5e98218b909f938d2762127ffadc4' 'COD_WAW_Zombies_HD_iPad_v1.5.0.ipa' '7ff13c22c9e9fa4184515015108bd8bc834aca17' 'COD_WAW_Zombies_iPhone_v1.5.0.ipa' > SHA1SUMS
          sha1sum --check SHA1SUMS
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          for ipa in sorted(Path(".").glob("*.ipa")):
              with zipfile.ZipFile(ipa) as z:
                  assert any(x.endswith("/Info.plist") and x.startswith("Payload/") for x in z.namelist())
                  print(f"ORIGINAL_IPA_VERIFIED {ipa.name} bytes={ipa.stat().st_size}")
          PY
      - name: Publish both archived IPAs for original-source reference
        uses: actions/upload-artifact@v4
        with:
          name: COD-World-at-War-Zombies-iPhone-iPad-IPA-originals
          path: |
            /tmp/cod-waw-ios/*.ipa
            /tmp/cod-waw-ios/SHA1SUMS
          retention-days: 14
          if-no-files-found: error
          compression-level: 0
