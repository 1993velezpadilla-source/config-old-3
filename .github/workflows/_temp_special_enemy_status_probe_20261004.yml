name: Temp Special Enemy Run Status Probe

on:
  push:
    branches:
      - feature/church-expansion-v1
    paths:
      - ".github/workflows/_temp_special_enemy_status_probe_20261004.yml"

permissions:
  actions: read
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Query special enemy workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          repo=os.environ["REPO"]
          token=os.environ["GH_TOKEN"]
          branch="feature/church-expansion-v1"
          workflows=[
            "xogot-zombie-sheep-author.yml",
            "xogot-monja-elite-author.yml",
          ]
          out={}
          for wf in workflows:
              url=f"https://api.github.com/repos/{repo}/actions/workflows/{wf}/runs?branch={urllib.parse.quote(branch,safe='')}&per_page=5"
              req=urllib.request.Request(url,headers={
                  "Authorization":f"Bearer {token}",
                  "Accept":"application/vnd.github+json",
                  "X-GitHub-Api-Version":"2022-11-28",
              })
              with urllib.request.urlopen(req, timeout=30) as r:
                  data=json.load(r)
              runs=[]
              for x in data.get("workflow_runs",[]):
                  runs.append({
                      "id":x["id"],
                      "name":x["name"],
                      "event":x["event"],
                      "status":x["status"],
                      "conclusion":x.get("conclusion"),
                      "head_sha":x["head_sha"],
                      "created_at":x["created_at"],
                      "updated_at":x["updated_at"],
                      "html_url":x["html_url"],
                      "run_number":x["run_number"],
                      "run_attempt":x["run_attempt"],
                  })
              out[wf]=runs
          open("xogot/special_enemy_run_status.json","w").write(json.dumps(out,indent=2)+"\n")
          print(json.dumps(out,indent=2))
          PY
      - name: Commit status snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "XZOGOT Status Bot"
          git config user.email "xogot-status-bot@users.noreply.github.com"
          git pull --rebase origin feature/church-expansion-v1
          git add xogot/special_enemy_run_status.json
          git commit -m "ci: snapshot special enemy workflow status" || exit 0
          git push origin HEAD:feature/church-expansion-v1
