name: Xogot Source Scoped ADS Bore and Roll A-B

on:
  workflow_dispatch:
  push:
    branches:
      - fix/source-viewmodel-inherited-hands-unit-scale
    paths:
      - "xogot/ci/source_scoped_ads_bore_axis_ab.gd"
      - ".github/workflows/xogot-source-scoped-ads-bore-axis-ab.yml"

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - name: Install original Godot 4.6.1 renderer
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers
          curl -L --fail --retry 5 --retry-all-errors --retry-delay 2 \
            https://github.com/godotengine/godot-builds/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip -o /tmp/godot.zip
          mkdir -p /tmp/godot /tmp/xogot-scoped-bore-axis build/scoped-bore
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.6.1-stable_linux.x86_64
      - name: Import original 28 viewmodels and hand PSA
        run: |
          set -euo pipefail
          timeout 240 /tmp/godot/Godot_v4.6.1-stable_linux.x86_64 --headless --editor --path xogot --quit 2>&1 | tee build/scoped-bore/import.log
          ! grep -E "SCRIPT ERROR|Parse Error" build/scoped-bore/import.log
      - name: Render source camera versus bore/upright eye-line correction
        run: |
          set -euo pipefail
          timeout 240 xvfb-run -a -s "-screen 0 1280x720x24" \
            /tmp/godot/Godot_v4.6.1-stable_linux.x86_64 --path xogot --audio-driver Dummy \
            --rendering-method gl_compatibility --resolution 1280x720 \
            --script res://ci/source_scoped_ads_bore_axis_ab.gd 2>&1 | tee build/scoped-bore/render.log
          grep -q "XZOGOT_SCOPED_BORE_AXIS_PROOF_GREEN frames=8" build/scoped-bore/render.log
          test "$(find /tmp/xogot-scoped-bore-axis -maxdepth 1 -name '*.png' | wc -l)" -eq 8
          ! grep -E "SCRIPT ERROR|Parse Error|XZOGOT_SCOPED_BORE_AB_RED" build/scoped-bore/render.log
      - name: Upload 8 real zoomable scoped rifle orientation A-B images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Xogot-Scoped-Original-Gun-Bore-Orientation-8PNG
          path: /tmp/xogot-scoped-bore-axis/*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Upload exact real source gun barrel and sight axis metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Xogot-Scoped-Original-Gun-Bore-Orientation-Logs
          path: build/scoped-bore/*.log
          if-no-files-found: warn
          retention-days: 14
