name: HAYUYA Hunyuan Textured Donor Probe

on:
  workflow_dispatch:
  push:
    branches:
      - art/hayuya-monster-v1
    paths:
      - tools/hayuya3d/hunyuan3d_cloud.py
      - .github/workflows/hayuya-hunyuan-texture-donor-probe.yml

permissions:
  contents: read

concurrency:
  group: hayuya-hunyuan-texture-donor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  monja-texture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install probe dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "gradio_client>=1.10,<2" trimesh numpy pillow scipy

      - name: Generate Hunyuan textured material donor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/hunyuan-texture-donor
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, "tools/hayuya3d")
          from hunyuan3d_cloud import generate_textured_material_donor

          meta=generate_textured_material_donor(
              Path("hayuya/assets/monja-mugfwln6/geometry/primary.webp"),
              Path("out/hunyuan-texture-donor/monja_hunyuan_textured_donor.glb"),
              seed=1993,
              steps=20,
              guidance_scale=5.0,
              octree_resolution=256,
              num_chunks=8000,
          )
          print("HAYUYA_HUNYUAN_TEXTURE_DONOR_META",json.dumps(meta,separators=(",",":")))
          PY

      - name: Inspect donor mesh and texture
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, "tools/hayuya3d")
          from mesh_gate import inspect as inspect_mesh
          from texture_gate import inspect as inspect_texture

          p=Path("out/hunyuan-texture-donor/monja_hunyuan_textured_donor.glb")
          mesh=inspect_mesh(p,require_normals=False)
          tex=inspect_texture(p,min_edge=512,min_base_color_edge=512)
          payload={
              "schema":1,
              "faces":int(mesh.faces),
              "vertices":int(mesh.vertices),
              "components":int(mesh.components),
              "largest_component_fraction":float(mesh.largest_component_fraction),
              "mesh_passed":bool(mesh.passed),
              "texture_passed":bool(tex.passed),
              "texture_max_edge":int(tex.max_edge),
              "base_color_max_edge":int(tex.base_color_max_edge),
              "warnings":list(tex.warnings),
          }
          Path("out/hunyuan-texture-donor/donor_gate.json").write_text(
              json.dumps(payload,indent=2)+"\n",encoding="utf-8"
          )
          print("HAYUYA_HUNYUAN_TEXTURE_DONOR_GATE",json.dumps(payload,separators=(",",":")))
          if not mesh.passed or not tex.passed:
              raise SystemExit(2)
          PY

      - name: Install Blender for textured evidence
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender python3-numpy xvfb libegl1 libgl1-mesa-dri

      - name: Render textured donor front
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a blender --python-exit-code 1 -b \
            --python tools/hayuya3d/blender_judge_turntable_24.py -- \
            --input out/hunyuan-texture-donor/monja_hunyuan_textured_donor.glb \
            --output-dir out/hunyuan-texture-donor/front_evidence \
            --size 768 \
            --face-size 768 \
            --preflight-only

      - name: Upload donor artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hayuya-hunyuan-texture-donor
          path: out/hunyuan-texture-donor/**
          if-no-files-found: warn
          retention-days: 3
