name: XZIEL Nacht Hybrid Touch Gyro APK

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/xziel-nacht-win64-exe-v1
    paths:
      - ".github/workflows/xziel-nacht-hybrid-touch-gyro-apk.yml"
      - "assets/mobile/xziel_hud_v1/**"
      - "scripts/build_xziel_nacht_hybrid_touch_apk.sh"
      - "scripts/patch_winlator_xziel_nacht_direct.py"

permissions:
  contents: read
  actions: read

concurrency:
  group: xziel-nacht-hybrid-touch-gyro-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Pixel Fold touch gyro APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout XZIEL
        uses: actions/checkout@v5

      - name: Download direct Win64 runtime and validated VFS
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUNTIME_RUN="$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow "xziel-nacht-win64-runtime.yml" \
            --branch "experiment/xziel-nacht-win64-exe-v1" \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')"
          VFS_RUN=36642428359
          test -n "$RUNTIME_RUN"
          echo "XZIEL_DIRECT_RUNTIME_SOURCE_RUN=$RUNTIME_RUN"
          mkdir -p input/runtime input/vfs

          gh run download "$RUNTIME_RUN" \
            --repo "${{ github.repository }}" \
            --name "XZIEL-Nacht-Win64-Runtime" \
            --dir input/runtime
          gh run download "$VFS_RUN" \
            --repo "${{ github.repository }}" \
            --name "XZIEL-Nacht-VFS-Complete" \
            --dir input/vfs

          RUNTIME_EXE="$(find input/runtime -type f -name 'Xziel-Nacht.exe' -print -quit)"
          VFS="$(find input/vfs -type f -name 'xziel-nacht-vfs.zip' -print -quit)"
          test -n "$RUNTIME_EXE" && test -s "$RUNTIME_EXE"
          test -n "$VFS" && test -s "$VFS"
          test -s input/runtime/SDL2.dll
          test -s input/runtime/libEGL.dll
          test -s input/runtime/libGLESv2.dll
          test -s input/runtime/libstdc++-6.dll
          test -s input/runtime/zlib1.dll

          vfs_bytes="$(wc -c < "$VFS" | tr -d '[:space:]')"
          vfs_sha="$(sha256sum "$VFS" | awk '{print $1}')"
          runtime_sha="$(sha256sum "$RUNTIME_EXE" | awk '{print $1}')"
          test "$vfs_bytes" -gt 800000000
          test "${#vfs_sha}" = "64"
          test "${#runtime_sha}" = "64"

          echo "XZIEL_NACHT_RUNTIME_DIR=input/runtime" >> "$GITHUB_ENV"
          echo "XZIEL_NACHT_VFS=$VFS" >> "$GITHUB_ENV"
          echo "XZIEL_NACHT_VFS_BYTES=$vfs_bytes" >> "$GITHUB_ENV"
          echo "XZIEL_NACHT_VFS_SHA256=$vfs_sha" >> "$GITHUB_ENV"
          echo "XZIEL_NACHT_RUNTIME_EXE_SHA256=$runtime_sha" >> "$GITHUB_ENV"
          echo "XZIEL_DIRECT_PAYLOAD_INPUT_GREEN vfs_bytes=$vfs_bytes vfs_sha256=$vfs_sha runtime_sha256=$runtime_sha"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install host tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y git unzip zip python3 zstd

      - name: Install Android NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "ndk;24.0.8215888" "cmake;3.22.1"

      - name: Build touch gyro hybrid APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/build_xziel_nacht_hybrid_touch_apk.sh
          bash scripts/build_xziel_nacht_hybrid_touch_apk.sh

      - name: Verify official 12-skin touch gyro contract
        shell: bash
        run: |
          set -euo pipefail
          CONTRACT=build/xziel-nacht-hybrid-touch/dist/control-contract.txt
          CONTENTS=build/xziel-nacht-hybrid-touch/dist/apk-contents.txt
          APK=build/xziel-nacht-hybrid-touch/dist/XZIEL-Nacht-Hybrid-TouchGyro-PixelFold-debug.apk

          test -s "$CONTRACT"
          test -s "$CONTENTS"
          test -s "$APK"

          grep -q '^gyro=enabled$' "$CONTRACT"
          grep -q '^hip_fire=mouse_left$' "$CONTRACT"
          grep -q '^ads_fire=mouse_right+mouse_left$' "$CONTRACT"
          grep -q '^skin=xziel_hud_zombies_mobile_v1$' "$CONTRACT"
          grep -q '^skin_asset_count=12$' "$CONTRACT"
          grep -q '^skin_idle_alpha=210$' "$CONTRACT"
          grep -q '^skin_pressed_alpha=246$' "$CONTRACT"
          grep -q '^winlator_ui=hidden$' "$CONTRACT"

          for asset in             hud_ads.webp             hud_ads_fire.webp             hud_claw.webp             hud_crouch.webp             hud_fire.webp             hud_grenade.webp             hud_knife.webp             hud_prone.webp             hud_reload.webp             hud_slide.webp             hud_sprint.webp             hud_swap.webp; do
            grep -q "assets/xziel_hud/$asset" "$CONTENTS"
          done

          echo "XZIEL_OFFICIAL_12_SKIN_TOUCH_GYRO_CONTRACT_GREEN"

      - name: Upload Pixel Fold APK
        uses: actions/upload-artifact@v4
        with:
          name: XZIEL-Nacht-Hybrid-TouchGyro-PixelFold
          path: |
            build/xziel-nacht-hybrid-touch/dist/XZIEL-Nacht-Hybrid-TouchGyro-PixelFold-debug.apk
            build/xziel-nacht-hybrid-touch/dist/XZIEL-Nacht-Hybrid-TouchGyro-PixelFold-debug.apk.sha256
            build/xziel-nacht-hybrid-touch/dist/apk-contents.txt
            build/xziel-nacht-hybrid-touch/dist/control-contract.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
