name: Sanctum V2 Cathedral Floor Material Audit

on:
  push:
    branches:
      - sanctum-v2-existing-assets-only
    paths:
      - ".github/workflows/sanctum-v2-cathedral-floor-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Fetch cathedral source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/IRCSS/Blender-Geometry-Node-French-Houses.git external-french-houses
          (cd external-french-houses && git lfs pull || true)
          test -s external-french-houses/GeometryNodesFrenchHous.blend
      - name: Install Blender
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz -o /tmp/blender.tar.xz
          tar -C /tmp -xf /tmp/blender.tar.xz
      - name: Audit monastery diffuse luminance
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y python3-pil
          python3 - <<'PY'
          import urllib.request
          from pathlib import Path
          from PIL import Image,ImageStat
          url="https://dl.polyhaven.org/file/ph-assets/Textures/png/4k/monastery_stone_floor/monastery_stone_floor_diff_4k.png"
          dst=Path("/tmp/monastery_stone_floor_diff_4k.png")
          with urllib.request.urlopen(url,timeout=180) as r, dst.open("wb") as f:
              while True:
                  b=r.read(1024*1024)
                  if not b: break
                  f.write(b)
          im=Image.open(dst).convert("RGB")
          stat=ImageStat.Stat(im)
          means=[v/255.0 for v in stat.mean]
          gray=im.convert("L")
          hist=gray.histogram()
          total=sum(hist)
          def pct(q):
              target=total*q
              s=0
              for i,n in enumerate(hist):
                  s+=n
                  if s>=target: return i/255.0
              return 1.0
          print("SANCTUM_MONASTERY_DIFFUSE_LUMA",{
              "size":im.size,
              "mean_rgb":means,
              "mean_luma":ImageStat.Stat(gray).mean[0]/255.0,
              "p10":pct(.10),"p50":pct(.50),"p90":pct(.90)
          })
          PY

      - name: Audit evaluated cathedral materials
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/audit_floor.py <<'PY'
          import bpy, json
          from mathutils import Vector

          o=bpy.data.objects.get("Catehdral")
          if o is None:
              raise SystemExit("Missing Catehdral")
          deps=bpy.context.evaluated_depsgraph_get()
          eo=o.evaluated_get(deps)
          me=eo.to_mesh()
          mw=eo.matrix_world
          normal_m=eo.matrix_world.to_3x3()

          mats=[m.name if m else None for m in me.materials]
          rows={}
          for p in me.polygons:
              idx=p.material_index
              name=mats[idx] if idx<len(mats) else None
              n=(normal_m @ p.normal).normalized()
              c=mw @ p.center
              area=p.area
              r=rows.setdefault(name,{
                  "polygons":0,"area":0.0,
                  "up_polygons":0,"up_area":0.0,
                  "near_floor_up_polygons":0,"near_floor_up_area":0.0,
                  "z_min":float(c.z),"z_max":float(c.z),
              })
              r["polygons"]+=1; r["area"]+=float(area)
              r["z_min"]=min(r["z_min"],float(c.z)); r["z_max"]=max(r["z_max"],float(c.z))
              if n.z>0.85:
                  r["up_polygons"]+=1; r["up_area"]+=float(area)
                  if c.z<2.5:
                      r["near_floor_up_polygons"]+=1
                      r["near_floor_up_area"]+=float(area)

          eo.to_mesh_clear()
          floor_pts=[]
          floor_area=0.0
          floor_faces=0
          floor_z_min=None
          floor_z_max=None
          for p in me.polygons:
              idx=p.material_index
              name=mats[idx] if idx<len(mats) else None
              if name!="GroundFloorWalls":
                  continue
              n=(normal_m @ p.normal).normalized()
              c=mw @ p.center
              if n.z<=0.85 or c.z>2.5:
                  continue
              floor_faces+=1
              floor_area+=float(p.area)
              for vi in p.vertices:
                  wv=mw @ me.vertices[vi].co
                  floor_pts.append((float(wv.x),float(wv.y),float(wv.z)))
                  floor_z_min=float(wv.z) if floor_z_min is None else min(floor_z_min,float(wv.z))
                  floor_z_max=float(wv.z) if floor_z_max is None else max(floor_z_max,float(wv.z))

          if floor_pts:
              xs=[p[0] for p in floor_pts]; ys=[p[1] for p in floor_pts]
              bounds={
                  "min":[min(xs),min(ys),floor_z_min],
                  "max":[max(xs),max(ys),floor_z_max],
                  "size":[max(xs)-min(xs),max(ys)-min(ys),floor_z_max-floor_z_min],
              }
              bbox_xy_area=(max(xs)-min(xs))*(max(ys)-min(ys))
              coverage_ratio=(floor_area/bbox_xy_area) if bbox_xy_area>0 else 0.0
          else:
              bounds=None; bbox_xy_area=0.0; coverage_ratio=0.0

          report={
              "materials":rows,
              "near_floor_groundfloorwalls":{
                  "face_count":floor_faces,
                  "face_area":floor_area,
                  "bounds":bounds,
                  "bbox_xy_area":bbox_xy_area,
                  "coverage_ratio":coverage_ratio,
              },
          }
          print("SANCTUM_V2_FLOOR_MATERIAL_AUDIT")
          print(json.dumps(report,indent=2,sort_keys=True))
          PY
          /tmp/blender-5.2.2-linux-x64/blender -b external-french-houses/GeometryNodesFrenchHous.blend --python /tmp/audit_floor.py 2>&1 | tee /tmp/floor-audit.log
          grep -q SANCTUM_V2_FLOOR_MATERIAL_AUDIT /tmp/floor-audit.log
