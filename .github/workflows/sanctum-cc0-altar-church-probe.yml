name: Sanctum CC0 Altar Church Probe

on:
  push:
    branches:
      - feature/xziel-map-builder-agent-v1
    paths:
      - ".github/workflows/sanctum-cc0-altar-church-probe.yml"
      - "tools/sanctum_v2/probe_cc0_sanctum_prop_pack.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sanctum-cc0-altar-church-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Install runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl xz-utils xvfb libx11-6 libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libglu1-mesa

      - name: Fetch verified CC0 altar church
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p external-altar sanctum-altar-probe
          curl -L --fail --retry 3 https://opengameart.org/content/church-0 -o sanctum-altar-probe/source-page.html
          grep -qi CC0 sanctum-altar-probe/source-page.html
          grep -qi altar sanctum-altar-probe/source-page.html
          curl -L --fail --retry 3 https://opengameart.org/sites/default/files/Church.blend -o external-altar/Church.blend
          test -s external-altar/Church.blend
          sha256sum external-altar/Church.blend | tee sanctum-altar-probe/source.sha256

      - name: Install Blender
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz -o /tmp/blender.tar.xz
          tar -C /tmp -xf /tmp/blender.tar.xz

      - name: Inventory and render altar church
        shell: bash
        env:
          SANCTUM_PROP_OUT: sanctum-altar-probe
          SANCTUM_PROP_PACK: altar_church
          SANCTUM_PROP_LICENSE: CC0
          SANCTUM_PROP_SOURCE_URL: https://opengameart.org/content/church-0
          SANCTUM_PROP_SOURCE_FILE_URL: https://opengameart.org/sites/default/files/Church.blend
        run: |
          set -euo pipefail
          export SANCTUM_PROP_SHA256="$(cut -d' ' -f1 sanctum-altar-probe/source.sha256)"
          xvfb-run -a -s "-screen 0 1600x1000x24" \
            /tmp/blender-5.2.2-linux-x64/blender \
            -b external-altar/Church.blend \
            --python tools/sanctum_v2/probe_cc0_sanctum_prop_pack.py \
            2>&1 | tee sanctum-altar-probe/blender.log
          grep -q SANCTUM_PROP_PROBE_PASS sanctum-altar-probe/blender.log

      - name: Validate altar evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          d=json.load(open("sanctum-altar-probe/report.json",encoding="utf-8"))
          assert d["status"]=="PASS",d
          assert d["license"]=="CC0",d
          assert d["mesh_object_count"]>=1,d
          assert len(d["source_sha256"])==64,d
          print("SANCTUM_ALTAR_CHURCH_PROBE_GREEN")
          print("OBJECTS",[x["name"] for x in d["objects"]])
          PY

      - name: Upload altar probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XZIEL-Sanctum-CC0-Altar-Church
          path: sanctum-altar-probe/
          if-no-files-found: error
          retention-days: 14
