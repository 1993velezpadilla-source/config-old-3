name: CoDz Gameplay Source Census

on:
  workflow_dispatch:
  push:
    branches: [feature/godot-aaa-rebuild-v1]
    paths: [".github/workflows/xogot-codz-gameplay-source-census.yml"]

permissions:
  actions: read
  contents: read

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SOURCE_RUN_ID: "37470563200"
      SOURCE_ARTIFACT: "xogot-codz-parity-wonder-weapon-census"
    steps:
      - uses: actions/checkout@v5

      - name: Reuse preserved complete modkit inventory
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p census build/gameplay-census
          gh run download "$SOURCE_RUN_ID" -n "$SOURCE_ARTIFACT" -D census
          SRC="$(find census -type f -name 'all-paths.txt' -print -quit)"
          test -n "$SRC"
          test -s "$SRC"
          cp "$SRC" build/gameplay-census/all-source-paths.txt
          echo "XZOGOT_GAMEPLAY_CENSUS_SOURCE_REUSED run=$SOURCE_RUN_ID"
          echo "XZOGOT_GAMEPLAY_CENSUS_SOURCE_PATHS $(wc -l < build/gameplay-census/all-source-paths.txt)"

      - name: Build exhaustive gameplay manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re

          src=Path("build/gameplay-census/all-source-paths.txt")
          paths=sorted(
              {line.strip().replace("\\","/") for line in src.read_text(errors="ignore").splitlines() if line.strip()},
              key=str.lower,
          )

          groups={
            "pack_a_punch":[
              r"pack.?a.?punch",r"packapunch",r"/pap/",r"_pap",r"pap_",r"pack.?punch",
              r"upgrade.?weapon",r"weapon.?upgrade",r"killerjimspap"
            ],
            "perks":[
              r"/bps/perks/",r"perkmachine",r"perkbottle",r"perk_core",r"perk_list",
              r"wunderfizz",r"jug",r"speed.?cola",r"quick.?revive",r"double.?tap",
              r"deadshot",r"stamin",r"mule.?kick",r"phd",r"cherry",r"widow",
              r"who.?s.?who",r"tombstone",r"vulture"
            ],
            "gobblegum":[
              r"gobble",r"gobblegum",r"gobble.?gum",r"gum.?machine",r"gumball",
              r"/gum/",r"_gum",r"gum_",r"mega.?gum",r"liquid.?divinium"
            ],
            "mystery_box":[r"mystery.?box",r"/mysterybox/",r"random.?weapon",r"weapon.?box"],
            "wallbuy":[r"wallbuy",r"wall.?buy",r"chalk.?weapon",r"wall.?weapon"],
            "power":[r"power.?switch",r"powerswitch",r"electricity",r"turn.?power",r"/power/"],
            "player_gameplay":[
              r"playerproxy",r"player_proxy",r"bp_cod[z]?_player",r"proxiesandgamelogics",
              r"playerstate",r"gamemode",r"game.?logic"
            ],
            "weapon_gameplay":[
              r"/bps/customitems/guns/",r"gun_base",r"customgunbase",r"weaponid",
              r"bullet_base",r"weapon.?base"
            ],
            "interaction":[
              r"interact",r"hand",r"drink",r"bottle",r"lever",r"button",r"machine",
              r"pickup",r"use.?prompt",r"activate"
            ],
          }

          out={"schema":2,"source_run_id":37470563200,"total_paths":len(paths),"groups":{}}
          all_gameplay=set()
          for name,patterns in groups.items():
              rx=[re.compile(p,re.I) for p in patterns]
              hits=[p for p in paths if any(r.search(p) for r in rx)]
              out["groups"][name]={"count":len(hits),"paths":hits}
              all_gameplay.update(hits)
              print("XZOGOT_GAMEPLAY_CENSUS",name,"count=",len(hits))
              for p in hits[:120]:
                  print("  ",p)

          blueprintish=[
              p for p in sorted(all_gameplay,key=str.lower)
              if p.lower().endswith((".uasset",".umap"))
          ]
          out["gameplay_unique_count"]=len(all_gameplay)
          out["blueprintish_count"]=len(blueprintish)
          out["blueprintish_paths"]=blueprintish

          Path("build/gameplay-census/gameplay-source-manifest.json").write_text(
              json.dumps(out,indent=2)+"\n",encoding="utf-8")
          Path("build/gameplay-census/gameplay-blueprints.txt").write_text(
              "\n".join(blueprintish)+"\n",encoding="utf-8")
          Path("build/gameplay-census/all-gameplay-paths.txt").write_text(
              "\n".join(sorted(all_gameplay,key=str.lower))+"\n",encoding="utf-8")

          required=("pack_a_punch","perks","mystery_box","wallbuy","power","player_gameplay","weapon_gameplay","interaction")
          missing=[name for name in required if not out["groups"][name]["count"]]
          if missing:
              raise SystemExit("Required gameplay source groups missing: "+", ".join(missing))
          print("XZOGOT_GAMEPLAY_SOURCE_CENSUS_GREEN",
                "paths=",len(paths),
                "gameplay=",len(all_gameplay),
                "blueprintish=",len(blueprintish))
          PY

      - name: Upload durable gameplay census
        uses: actions/upload-artifact@v4
        with:
          name: xogot-codz-gameplay-source-census
          path: |
            build/gameplay-census/all-source-paths.txt
            build/gameplay-census/gameplay-source-manifest.json
            build/gameplay-census/gameplay-blueprints.txt
            build/gameplay-census/all-gameplay-paths.txt
          if-no-files-found: error
          retention-days: 90
