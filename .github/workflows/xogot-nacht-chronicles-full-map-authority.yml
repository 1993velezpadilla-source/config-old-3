name: Xogot Nacht Chronicles Full Map Authority

on:
  workflow_dispatch:
  push:
    branches:
      - feature/godot-aaa-rebuild-v1
    paths:
      - ".github/workflows/xogot-nacht-chronicles-full-map-authority.yml"
      - "tools/maps/UEStaticSceneExtract/Program.cs"
      - "tools/patches/patch_ue421_material_texture_refs.py"
      - "tools/patches/synthesize_ue_basic_cube_xzms.py"

permissions:
  contents: read
  actions: read

concurrency:
  group: xogot-nacht-chronicles-full-map-authority
  cancel-in-progress: false

jobs:
  full-authority:
    runs-on: windows-latest
    timeout-minutes: 330
    env:
      WORKSHOP_APP_ID: "555160"
      WORKSHOP_ITEM_ID: "2755515831"
      SOURCE_GAME: "ue4.21"
      EXPECTED_PACKAGE_COUNT: "3871"
      EXPECTED_MAP: "Pavlov/Content/CustomMaps/UGC2755515831/Nacht_de_Untoten.umap"

    steps:
      - name: Checkout gameplay branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Restore proven generic UE source conversion stack
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $old='055f0d0721eb212e3f4713e149d1e2ace5c53674'
          git fetch origin $old --depth=1
          if($LASTEXITCODE -ne 0){throw 'converter commit fetch failed'}
          git cat-file -e "$old^{commit}"
          git checkout $old -- engine/xz tools/maps tests
          git checkout $env:GITHUB_SHA -- tools/maps/UEStaticSceneExtract/Program.cs
          if($LASTEXITCODE -ne 0){throw 'patched UEStaticSceneExtract restore failed'}
          git checkout $env:GITHUB_SHA -- tools/maps/UEAudioSceneExtract
          if($LASTEXITCODE -ne 0){throw 'UEAudioSceneExtract restore failed'}
          python tools/patches/patch_ue421_material_texture_refs.py
          if($LASTEXITCODE -ne 0){throw 'UE4.21 material texture reference patch failed'}
          Write-Host "XZOGOT_NACHT_CONVERTER_STACK_GREEN source=$old patched_scene_extractor=$env:GITHUB_SHA material_texture_refs=patched"

      - name: Download exact validated Nacht package
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $steam=Join-Path $env:RUNNER_TEMP 'steamcmd'
          New-Item -ItemType Directory -Force -Path $steam | Out-Null
          Invoke-WebRequest 'https://steamcdn-a.akamaihd.net/client/installer/steamcmd.zip' -OutFile "$env:RUNNER_TEMP\steamcmd.zip"
          Expand-Archive "$env:RUNNER_TEMP\steamcmd.zip" -DestinationPath $steam -Force

          & (Join-Path $steam 'steamcmd.exe') +login anonymous +workshop_download_item $env:WORKSHOP_APP_ID $env:WORKSHOP_ITEM_ID validate +quit

          $root=Get-ChildItem $steam,$env:RUNNER_TEMP -Directory -Recurse -ErrorAction SilentlyContinue |
            Where-Object {$_.FullName -like "*steamapps\workshop\content\$env:WORKSHOP_APP_ID\$env:WORKSHOP_ITEM_ID"} |
            Select-Object -First 1
          if(-not $root){throw 'Nacht workshop payload not found'}

          $pak=Join-Path $root.FullName 'WindowsNoEditor.pak'
          if(-not (Test-Path $pak)){throw 'Nacht WindowsNoEditor.pak missing'}

          "NACHT_PAK=$pak" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $size=(Get-Item $pak).Length
          Write-Host "XZOGOT_NACHT_FULL_SOURCE_PAK_GREEN bytes=$size"
          $global:LASTEXITCODE=0
          exit 0

      - name: Install repak and unpack literally complete PAK
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Invoke-WebRequest 'https://github.com/trumank/repak/releases/download/v0.2.3/repak_cli-x86_64-pc-windows-msvc.zip' -OutFile "$env:RUNNER_TEMP\repak.zip"
          $repakDir="$env:RUNNER_TEMP\repak"
          Expand-Archive "$env:RUNNER_TEMP\repak.zip" -DestinationPath $repakDir -Force
          $repak=Get-ChildItem $repakDir -Filter repak.exe -Recurse | Select-Object -First 1
          if(-not $repak){throw 'repak.exe missing'}
          "REPAK=$($repak.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

          Remove-Item nacht-source -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path nacht-source | Out-Null

          & $repak.FullName list "$env:NACHT_PAK" | Set-Content nacht-full-paths.txt -Encoding utf8
          & $repak.FullName unpack "$env:NACHT_PAK" -o nacht-source --force
          if($LASTEXITCODE -ne 0){throw "repak unpack failed $LASTEXITCODE"}

          @'
          from pathlib import Path
          import json,collections

          paths=sorted(set(
              x.strip().replace("\\","/")
              for x in Path("nacht-full-paths.txt").read_text(encoding="utf-8-sig",errors="ignore").splitlines()
              if x.strip()
          ))
          expected=int(__import__("os").environ["EXPECTED_PACKAGE_COUNT"])
          expected_map=__import__("os").environ["EXPECTED_MAP"]
          maps=[p for p in paths if p.lower().endswith(".umap")]
          uassets=[p for p in paths if p.lower().endswith(".uasset")]

          physical=sorted(
              p.relative_to(Path("nacht-source")).as_posix()
              for p in Path("nacht-source").rglob("*")
              if p.is_file() and p.suffix.lower() in {".uasset",".umap"}
          )

          report={
              "schemaVersion":1,
              "authority":"literal complete validated Nacht workshop PAK",
              "workshopItem":"2755515831",
              "sourceGame":"UE4.21",
              "packageCount":len(paths),
              "uassetCount":len(uassets),
              "umapCount":len(maps),
              "maps":maps,
              "physicalPackageCount":len(physical),
              "ready":len(paths)==expected and maps==[expected_map] and len(physical)==expected,
          }
          Path("nacht-source-authority.json").write_text(json.dumps(report,indent=2)+"\n")
          assert report["ready"], report
          print("XZOGOT_NACHT_LITERAL_FULL_SOURCE_GREEN",report)
          '@ | python -

          $contentRoot=Join-Path $PWD 'nacht-source\Pavlov\Content'
          if(-not (Test-Path $contentRoot)){throw "Nacht Pavlov Content root missing: $contentRoot"}
          "NACHT_CONTENT_ROOT=$contentRoot" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "XZOGOT_NACHT_CONTENT_ROOT_GREEN $contentRoot"

      - name: Pin Pavlov mappings
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Invoke-WebRequest 'https://raw.githubusercontent.com/THW-Reaper/PavlovVRMappings/4976647b4f3a209042460bc55a7a3122662d05b7/PavMappings.usmap' -OutFile PavMappings.usmap
          $hash=(Get-FileHash PavMappings.usmap -Algorithm SHA256).Hash.ToLowerInvariant()
          if($hash -ne '6d19f9731cc3fbaba34ca8e0833e81e4ffdf1b407edf24de48b1ccb5c63b060c'){
            throw "PavMappings hash mismatch $hash"
          }
          Write-Host "XZOGOT_NACHT_PAVLOV_MAPPINGS_GREEN $hash"

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build complete UE4.21 source tools
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $projects=@(
            'tools/maps/UEAssetClassCensus/UEAssetClassCensus.csproj',
            'tools/maps/UEStaticMeshXZMS/UEStaticMeshXZMS.csproj',
            'tools/maps/UETextureXZTX/UETextureXZTX.csproj',
            'tools/maps/UEAudioXZAW/UEAudioXZAW.csproj',
            'tools/maps/UESkeletonXZRG/UESkeletonXZRG.csproj',
            'tools/maps/UESkeletalMeshXZSK/UESkeletalMeshXZSK.csproj',
            'tools/maps/UEAnimationXZAN/UEAnimationXZAN.csproj',
            'tools/maps/UEMaterialAudit/UEMaterialAudit.csproj',
            'tools/maps/UEStaticSceneExtract/UEStaticSceneExtract.csproj',
            'tools/maps/UELightExtract/UELightExtract.csproj',
            'tools/maps/UEAudioSceneExtract/UEAudioSceneExtract.csproj'
          )
          foreach($project in $projects){
            if(-not (Test-Path $project)){throw "missing source tool $project"}
            dotnet restore $project
            if($LASTEXITCODE -ne 0){throw "restore failed $project"}
            dotnet build $project -c Release --no-restore
            if($LASTEXITCODE -ne 0){throw "build failed $project"}
          }
          Write-Host "XZOGOT_NACHT_SOURCE_TOOLS_GREEN count=$($projects.Count)"

      - name: Census every cooked package and export class
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $app='tools/maps/UEAssetClassCensus/bin/Release/net10.0/UEAssetClassCensus.dll'
          dotnet $app $env:NACHT_CONTENT_ROOT nacht-class-census.json ue4.21 | Tee-Object nacht-class-census.log
          if($LASTEXITCODE -ne 0){throw "class census exited $LASTEXITCODE"}

          @'
          import json
          from pathlib import Path
          d=json.loads(Path("nacht-class-census.json").read_text())
          expected=int(__import__("os").environ["EXPECTED_PACKAGE_COUNT"])
          assert d["packageCount"]==expected,d["packageCount"]
          assert d["packagesLoaded"]==expected,d["packagesLoaded"]
          assert d["packageLoadFailureCount"]==0,d["packageLoadFailures"][:10]
          assert d["packageExtensionCounts"].get(".umap",0)==1,d["packageExtensionCounts"]
          assert d["totalExports"]>0,d["totalExports"]
          print("XZOGOT_NACHT_CLASS_CENSUS_GREEN",{
              "packages":d["packageCount"],
              "exports":d["totalExports"],
              "classes":d["uniqueExportClassCount"],
          })
          '@ | python -

      - name: Convert every static mesh texture sound skeleton skeletal mesh and animation
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force -Path nacht-native | Out-Null

          $census=Get-Content nacht-class-census.json -Raw | ConvertFrom-Json
          $textureCount=0
          foreach($p in $census.classCounts.PSObject.Properties){
            if($p.Name -like '*Texture2D'){ $textureCount += [int]$p.Value }
          }
          $jobs=@(
            @('UEStaticMeshXZMS','nacht-native/static-meshes',[int]$census.classCounts.StaticMesh),
            @('UETextureXZTX','nacht-native/textures',[int]$textureCount),
            @('UEAudioXZAW','nacht-native/audio',[int]$census.classCounts.SoundWave),
            @('UESkeletonXZRG','nacht-native/skeletons',[int]$census.classCounts.Skeleton),
            @('UESkeletalMeshXZSK','nacht-native/skeletal-meshes',[int]$census.classCounts.SkeletalMesh),
            @('UEAnimationXZAN','nacht-native/animations',[int]$census.classCounts.AnimSequence)
          )

          foreach($job in $jobs){
            $name=$job[0]
            $out=$job[1]
            $count=[int]$job[2]
            New-Item -ItemType Directory -Force -Path $out | Out-Null
            if($count -le 0){
              Write-Host "XZOGOT_NACHT_NATIVE_GROUP_EMPTY $name"
              continue
            }
            $dll="tools/maps/$name/bin/Release/net10.0/$name.dll"
            Write-Host "XZOGOT_NACHT_NATIVE_CONVERT $name expected=$count"
            dotnet $dll $env:NACHT_CONTENT_ROOT PavMappings.usmap nacht-class-census.json $out $count ue4.21 |
              Tee-Object "nacht-$name.log"
            if($LASTEXITCODE -ne 0){throw "$name failed $LASTEXITCODE"}
          }

          @'
          from pathlib import Path
          import json
          roots={
              "static_meshes":Path("nacht-native/static-meshes"),
              "textures":Path("nacht-native/textures"),
              "audio":Path("nacht-native/audio"),
              "skeletons":Path("nacht-native/skeletons"),
              "skeletal_meshes":Path("nacht-native/skeletal-meshes"),
              "animations":Path("nacht-native/animations"),
          }
          report={"schemaVersion":1,"assets":{}}
          for name,root in roots.items():
              files=[p for p in root.rglob("*") if p.is_file() and p.name!="report.json"]
              report["assets"][name]={"count":len(files),"bytes":sum(p.stat().st_size for p in files)}
              rp=root/"report.json"
              if rp.is_file():
                  report["assets"][name]["converterReport"]=json.loads(rp.read_text())
          report["ready"]=report["assets"]["static_meshes"]["count"]>0 and report["assets"]["textures"]["count"]>0
          Path("nacht-native-library.json").write_text(json.dumps(report,indent=2)+"\n")
          assert report["ready"],report
          print("XZOGOT_NACHT_NATIVE_LIBRARY_GREEN",report["assets"])
          '@ | python -

      - name: Extract exact material semantics
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $app='tools/maps/UEMaterialAudit/bin/Release/net10.0/UEMaterialAudit.dll'
          dotnet $app $env:NACHT_CONTENT_ROOT PavMappings.usmap nacht-class-census.json nacht-materials.json ue4.21 |
            Tee-Object nacht-materials.log
          if($LASTEXITCODE -ne 0){throw "material audit failed $LASTEXITCODE"}
          if(-not (Test-Path nacht-materials.json)){throw 'material report missing'}
          $material=Get-Content nacht-materials.json -Raw | ConvertFrom-Json
          $ms=$material.summary
          if([int]$ms.textureReferenceCount -le 0){throw 'material graph resolved zero texture references'}
          if([int]$ms.packageFailureCount -ne 0 -or [int]$ms.materialFailureCount -ne 0 -or [int]$ms.unresolvedTextureReferenceCount -ne 0){throw 'material authority contains failures'}
          if(-not [bool]$ms.ready){throw 'material authority not ready'}
          Write-Host "XZOGOT_NACHT_MATERIAL_AUTHORITY_GREEN materials=$($ms.materialExportsDecoded) textureRefs=$($ms.textureReferenceCount) textureLoads=$($ms.textureLoadCount)"

      - name: Extract exact UMAP scene transforms and all actor anchors
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $app='tools/maps/UEStaticSceneExtract/bin/Release/net10.0/UEStaticSceneExtract.dll'
          $sourceXzms='nacht-native/static-meshes/report.json'
          $runtimeXzms='nacht-static-runtime-meshes.json'
          if(-not (Test-Path $sourceXzms)){throw 'static mesh report missing'}

          python tools/patches/synthesize_ue_basic_cube_xzms.py `
            --source-report $sourceXzms `
            --mesh-dir nacht-native/static-meshes `
            --output-report $runtimeXzms
          if($LASTEXITCODE -ne 0){throw 'UE engine basic cube synthesis failed'}

          dotnet $app $env:NACHT_CONTENT_ROOT PavMappings.usmap nacht-class-census.json $runtimeXzms nacht-static-scene.json ue4.21 |
            Tee-Object nacht-static-scene.log
          if($LASTEXITCODE -ne 0){throw "static scene extraction failed $LASTEXITCODE"}

          @'
          import json
          from pathlib import Path
          d=json.loads(Path("nacht-static-scene.json").read_text())
          s=d.get("summary",{})
          assert s.get("mapPackageCount",0)==1,s
          assert s.get("packagesLoaded",0)==1,s
          assert s.get("actorAnchorCount",0)>0,s
          assert s.get("sceneInstanceCount",0)==10793,s
          assert s.get("referencedNativeMeshCount",0)==493,s
          assert s.get("unresolvedMeshCount",1)==0,s
          assert s.get("packageFailureCount",1)==0,s
          assert s.get("componentFailureCount",1)==0,s
          assert s.get("ready") is True,s
          print("XZOGOT_NACHT_EXACT_SCENE_GREEN",{
              "actors":s.get("actorAnchorCount"),
              "instances":s.get("sceneInstanceCount"),
              "staticComponents":s.get("staticComponents"),
              "meshes":s.get("referencedNativeMeshCount"),
              "sourcePackageMeshes":568,
              "engineBuiltins":1,
          })
          '@ | python -

      - name: Extract exact complete UMAP lighting
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $app='tools/maps/UELightExtract/bin/Release/net10.0/UELightExtract.dll'
          dotnet $app $env:NACHT_CONTENT_ROOT PavMappings.usmap nacht-class-census.json nacht-lights.json ue4.21 |
            Tee-Object nacht-lights.log
          if($LASTEXITCODE -ne 0){throw "light extraction failed $LASTEXITCODE"}

          @'
          import json
          from pathlib import Path
          d=json.loads(Path("nacht-lights.json").read_text())
          assert d["mapPackageCount"]==1,d
          assert d["packagesLoaded"]==1,d
          assert d["lightCount"]>0,d
          required=("intensity","lightColor","visible","castShadows")
          for row in d["lights"]:
              props=row["properties"]
              assert props.get("intensity") is not None,row
              assert props.get("visible") is not None,row
              assert props.get("castShadows") is not None,row
              if row["componentType"]!="sky":
                  assert props.get("lightColor") is not None,row
          print("XZOGOT_NACHT_EXACT_LIGHTING_GREEN",{
              "lights":d["lightCount"],
              "types":d["typeCounts"],
          })
          '@ | python -

      - name: Extract exact UMAP source audio placement
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $app='tools/maps/UEAudioSceneExtract/bin/Release/net10.0/UEAudioSceneExtract.dll'
          dotnet $app $env:NACHT_CONTENT_ROOT PavMappings.usmap nacht-class-census.json nacht-audio-scene.json ue4.21 |
            Tee-Object nacht-audio-scene.log
          if($LASTEXITCODE -ne 0){throw "audio scene extraction failed $LASTEXITCODE"}

          @'
          import json
          from pathlib import Path
          d=json.loads(Path("nacht-audio-scene.json").read_text())
          assert d["mapPackageCount"]==1,d
          assert d["packagesLoaded"]==1,d
          assert d["audioComponentCount"]>0,d
          assert d["referencedSoundCount"]>0,d
          assert len(d["packageFailures"])==0,d
          assert d["ready"] is True,d
          print("XZOGOT_NACHT_EXACT_AUDIO_SCENE_GREEN",{
              "components":d["audioComponentCount"],
              "referenced":d["referencedSoundCount"],
              "loaded":d["loadedSoundCount"],
              "null":d["nullSoundCount"],
              "types":d["soundTypeCounts"],
          })
          '@ | python -

      - name: Build full gameplay interactive FX and environment manifest
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          @'
          from pathlib import Path
          import json,re,collections

          paths=sorted(set(
              x.strip().replace("\\","/")
              for x in Path("nacht-full-paths.txt").read_text(encoding="utf-8-sig",errors="ignore").splitlines()
              if x.strip()
          ))
          rules={
              "world_map":r"\.umap$",
              "static_world":r"(CoD_nacht|/Environment/|/Props?/|/xmodels?/)",
              "materials":r"(/materials?/|_Mat\.uasset$|mtl_)",
              "textures":r"(/textures?/|texture)",
              "audio":r"(sound|sfx|voice|dialog|music)",
              "particles_fx":r"(particle|/fx|effects|smoke|fire|dust|lightning)",
              "lights":r"(light|lamp|flicker)",
              "blueprints":r"(/Blueprints/|Blueprint)",
              "zombies":r"(zombie|zmb|undead)",
              "dogs":r"(dog|hound|wolf)",
              "weapons":r"(weapon|weap|gun|pistol|rifle|smg|shotgun|lmg)",
              "perks":r"(perk|jugger|quickrevive|doubletap|speedcola|stamin|deadshot|mule)",
              "gumball":r"(gumball|gobble|gum_machine)",
              "mystery_box":r"(mysterybox|mystery_box|weaponbox|mysteryBox)",
              "pack_a_punch":r"(pack.?a.?punch|killerjimspap|pap)",
              "power":r"(powerswitch|power_box|powered_object|poweron|power_on)",
              "wallbuy":r"(wallbuy|wall_buy|chalk)",
              "barricades":r"(barricade|boardrepair|boardbreak)",
              "spawns_navigation":r"(spawn|nav|doorlink|traverse)",
          }
          groups={}
          for key,rx in rules.items():
              hits=[p for p in paths if re.search(rx,p,re.I)]
              groups[key]={"count":len(hits),"paths":hits}

          classes=json.loads(Path("nacht-class-census.json").read_text())
          scene=json.loads(Path("nacht-static-scene.json").read_text())
          lights=json.loads(Path("nacht-lights.json").read_text())
          audio_scene=json.loads(Path("nacht-audio-scene.json").read_text())
          native=json.loads(Path("nacht-native-library.json").read_text())

          report={
              "schemaVersion":1,
              "source":{
                  "workshopItem":"2755515831",
                  "sourceGame":"UE4.21",
                  "packageCount":len(paths),
                  "map":"Pavlov/Content/CustomMaps/UGC2755515831/Nacht_de_Untoten.umap",
              },
              "groups":groups,
              "classCensus":{
                  "exports":classes["totalExports"],
                  "uniqueClasses":classes["uniqueExportClassCount"],
                  "packageFailures":classes["packageLoadFailureCount"],
              },
              "scene":{
                  "actorAnchors":scene.get("summary",{}).get("actorAnchorCount",0),
                  "instances":scene.get("summary",{}).get("sceneInstanceCount",0),
                  "meshes":scene.get("summary",{}).get("referencedNativeMeshCount",0),
              },
              "lighting":{
                  "count":lights["lightCount"],
                  "types":lights["typeCounts"],
              },
              "audioScene":{
                  "components":audio_scene["audioComponentCount"],
                  "referencedSounds":audio_scene["referencedSoundCount"],
                  "loadedSounds":audio_scene["loadedSoundCount"],
                  "nullSounds":audio_scene["nullSoundCount"],
                  "types":audio_scene["soundTypeCounts"],
              },
              "nativeLibrary":native["assets"],
              "ready":True,
          }
          Path("nacht-full-map-authority.json").write_text(json.dumps(report,indent=2)+"\n")
          print("XZOGOT_NACHT_FULL_MAP_AUTHORITY_GREEN",{
              "packages":len(paths),
              "actors":report["scene"]["actorAnchors"],
              "lights":report["lighting"]["count"],
              "groups":{k:v["count"] for k,v in groups.items()},
          })
          '@ | python -

      - name: Build current CUE4Parse portable exporter
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $src="$env:RUNNER_TEMP\CUE4Parse.CLI"
          $out="$env:RUNNER_TEMP\cue4parse"
          git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/joric/CUE4Parse.CLI.git $src
          git -C $src submodule update --init --recursive --depth 1
          dotnet publish "$src\CUE4Parse.CLI\CUE4Parse.CLI.csproj" -c Release -r win-x64 --self-contained true -p:PublishTrimmed=false -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o $out
          $exe=Get-ChildItem $out -Filter '*.exe' | Sort-Object Length -Descending | Select-Object -First 1
          if(-not $exe){throw 'CUE4Parse CLI missing'}
          "CUE4PARSE=$($exe.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "XZOGOT_NACHT_CUE4PARSE_GREEN"

      - name: Export complete portable GLTF texture material audio payload
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference='Continue'
          Remove-Item nacht-portable -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path nacht-portable | Out-Null

          & "$env:CUE4PARSE" -i "$env:NACHT_CONTENT_ROOT" -g GAME_UE4_21 -m "$PWD\PavMappings.usmap" -o nacht-portable -y -v --mesh-format Gltf2 --mesh-quality Highest --export-materials true 2>&1 |
            Tee-Object nacht-portable-export.log

          $files=@(Get-ChildItem nacht-portable -Recurse -File -ErrorAction SilentlyContinue)
          $meshes=@($files | Where-Object {$_.Extension -in '.glb','.gltf'})
          $images=@($files | Where-Object {$_.Extension -in '.png','.jpg','.jpeg','.tga'})
          $audio=@($files | Where-Object {$_.Extension -in '.wav','.ogg'})
          Write-Host "XZOGOT_NACHT_PORTABLE_EXPORT_RESULT files=$($files.Count) meshes=$($meshes.Count) images=$($images.Count) audio=$($audio.Count)"
          $global:LASTEXITCODE=0
          exit 0

      - name: Write immutable full-map handoff manifest
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          @'
          from pathlib import Path
          import json
          authority=json.loads(Path("nacht-full-map-authority.json").read_text())
          portable=Path("nacht-portable")
          files=[p for p in portable.rglob("*") if p.is_file()] if portable.exists() else []
          handoff={
              "schemaVersion":1,
