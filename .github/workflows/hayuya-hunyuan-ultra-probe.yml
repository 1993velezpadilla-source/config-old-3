name: HAYUYA Hunyuan Ultra 512 Probe

on:
  workflow_dispatch:
  push:
    branches:
      - art/hayuya-monster-v1
    paths:
      - .github/workflows/hayuya-hunyuan-ultra-probe.yml

permissions:
  contents: read

concurrency:
  group: hayuya-hunyuan-ultra-512-${{ github.ref }}
  cancel-in-progress: true

jobs:
  monja-ultra:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install probe dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "gradio_client>=1.10,<2" trimesh numpy pillow scipy

      - name: Generate Monja native Ultra 512
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/hunyuan-ultra-512
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, "tools/hayuya3d")
          from hunyuan3d_cloud import generate_shape

          meta=generate_shape(
              Path("hayuya/assets/monja-mugfwln6/geometry/primary.webp"),
              Path("out/hunyuan-ultra-512/monja_hunyuan_512.glb"),
              seed=1993,
              steps=30,
              guidance_scale=5.0,
              octree_resolution=512,
              num_chunks=8000,
          )
          print("HAYUYA_HUNYUAN_ULTRA512_META",json.dumps(meta,separators=(",",":")))
          PY

      - name: Inspect Ultra 512 geometry
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, "tools/hayuya3d")
          from mesh_gate import inspect
          p=Path("out/hunyuan-ultra-512/monja_hunyuan_512.glb")
          report=inspect(p,require_normals=False)
          payload={
              "schema":1,
              "generator":"tencent/Hunyuan3D-2.1",
              "octree_resolution":512,
              "faces":int(report.faces),
              "vertices":int(report.vertices),
              "components":int(report.components),
              "largest_component_fraction":float(report.largest_component_fraction),
              "passed":bool(report.passed),
              "reasons":list(report.reasons),
              "warnings":list(report.warnings),
          }
          Path("out/hunyuan-ultra-512/mesh_gate.json").write_text(
              json.dumps(payload,indent=2)+"\n",encoding="utf-8"
          )
          print("HAYUYA_HUNYUAN_ULTRA512_MESH",json.dumps(payload,separators=(",",":")))
          if not report.passed:
              raise SystemExit(2)
          PY

      - name: Install Blender for front evidence
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender python3-numpy xvfb libegl1 libgl1-mesa-dri

      - name: Render Ultra 512 front
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a blender --python-exit-code 1 -b             --python tools/hayuya3d/blender_judge_turntable_24.py --             --input out/hunyuan-ultra-512/monja_hunyuan_512.glb             --output-dir out/hunyuan-ultra-512/front_evidence             --size 768             --face-size 768             --preflight-only

      - name: Upload Ultra 512 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hayuya-hunyuan-ultra-512
          path: out/hunyuan-ultra-512/**
          if-no-files-found: warn
          retention-days: 3
