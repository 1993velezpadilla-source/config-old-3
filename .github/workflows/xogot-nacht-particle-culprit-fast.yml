name: Xogot Nacht Particle Culprit Fast

on:
  push:
    branches:
      - wip/nacht-cascade-system-isolation-v1
    paths:
      - ".github/workflows/xogot-nacht-particle-culprit-fast.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: xogot-nacht-particle-culprit-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_ARTIFACT: "Xogot-Nacht-Chronicles-Godot-Runtime"

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Resolve exact GREEN staged runtime
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_RUN=37623273042
          gh api -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/$SOURCE_RUN" \
            --jq 'select(.conclusion=="success") | .id' | grep -qx "$SOURCE_RUN"
          echo "SOURCE_RUN=$SOURCE_RUN" >> "$GITHUB_ENV"
          echo "XZOGOT_NACHT_FAST_CULPRIT_SOURCE_GREEN run=$SOURCE_RUN"

      - name: Download GREEN staged runtime
        shell: bash
        run: |
          set -euo pipefail
          rm -rf wip-stage xogot/assets/benchmarks/nacht_chronicles
          mkdir -p wip-stage xogot/assets/benchmarks/nacht_chronicles
          gh run download "$SOURCE_RUN" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$SOURCE_ARTIFACT" \
            --dir wip-stage
          manifest=$(find wip-stage -type f -name source_manifest.json -print -quit)
          test -n "$manifest"
          artifact_root=$(dirname "$manifest")
          cp -a "$artifact_root/." xogot/assets/benchmarks/nacht_chronicles/
          test -s xogot/assets/benchmarks/nacht_chronicles/source_manifest.json

      - name: Install Godot 4.6.1
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip curl xvfb libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers
          curl -L --fail --retry 5 --retry-all-errors --retry-delay 2 \
            https://github.com/godotengine/godot-builds/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip \
            -o /tmp/godot.zip
          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.6.1-stable_linux.x86_64

      - name: Import WIP runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/nacht-fast-culprit
          timeout 1200 /tmp/godot/Godot_v4.6.1-stable_linux.x86_64 \
            --headless --editor --path xogot --quit \
            2>&1 | tee build/nacht-fast-culprit/import.log
          ! grep -E "SCRIPT ERROR|Parse Error|ERROR: Failed to load script|MAX_MESH_SURFACES" \
            build/nacht-fast-culprit/import.log

      - name: Render deterministic isolation low-res
        shell: bash
        run: |
          set -euo pipefail
          timeout 1200 xvfb-run -a -s "-screen 0 320x180x24" \
            /tmp/godot/Godot_v4.6.1-stable_linux.x86_64 \
            --path xogot \
            --script res://ci/nacht_full_map_capture.gd \
            2>&1 | tee build/nacht-fast-culprit/capture.log
          grep -q "XZOGOT_NACHT_CAPTURE_WORLD_GREEN" build/nacht-fast-culprit/capture.log
          grep -q "XZOGOT_NACHT_CANDIDATE02_PARTICLE_AB_GREEN" build/nacht-fast-culprit/capture.log
          ! grep -E "NACHT_CAPTURE:|SCRIPT ERROR|Parse Error|MAX_MESH_SURFACES" \
            build/nacht-fast-culprit/capture.log
          mkdir -p build/nacht-fast-culprit/screenshots
          cp /tmp/xogot-nacht-spawn-candidate-02*.png build/nacht-fast-culprit/screenshots/
          echo "XZOGOT_NACHT_FAST_CULPRIT_GREEN head=${GITHUB_SHA} source_run=$SOURCE_RUN"

      - name: Upload culprit screenshots
        uses: actions/upload-artifact@v4
        with:
          name: Xogot-Nacht-Particle-Culprit-Fast
          path: |
            build/nacht-fast-culprit/screenshots/*.png
            build/nacht-fast-culprit/capture.log
          if-no-files-found: error
          retention-days: 7
