name: MP40 Vril and Aether Binary Bridge Audit
on:
  push:
    branches: [experiment/mp40-aether-vril-binary-bridge-20261014]
    paths:
      - "tools/mp40_bridge/**"
      - ".github/workflows/mp40-vril-aether-binary-audit.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-real-source-binaries:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Retrieve actual Project Aether MP40 file from OUR Godot reference branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/mp40/aether /tmp/mp40/stock /tmp/mp40/quakec
          git -c protocol.version=2 fetch --no-tags --depth 1 --filter=blob:none origin feature/godot-aaa-rebuild-v1
          git show FETCH_HEAD:xogot/assets/weapons/aether_waw_real/mp40/viewmodel.glb \
            > /tmp/mp40/aether/viewmodel.glb
          for name in weapon_mp40_c.png weapon_mp40_n.png _weapon_mp40_mp_s-rgb_weapon__08433bb1.png; do
            git show "FETCH_HEAD:xogot/assets/weapons/aether_waw_textures/$name" \
              > "/tmp/mp40/aether/$name"
          done
          test -s /tmp/mp40/aether/viewmodel.glb
          printf 'AETHER_GODOT_ACTUAL_BINARY_ACQUIRED\n'

      - name: Retrieve stock NZP MP40 original MDL and 2 PCX skins
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --depth 1 --sparse https://github.com/nzp-team/assets.git /tmp/mp40-assets
          git -C /tmp/mp40-assets sparse-checkout set common/models/weapons/mp40
          cp /tmp/mp40-assets/common/models/weapons/mp40/v_mp40.mdl /tmp/mp40/stock/
          cp /tmp/mp40-assets/common/models/weapons/mp40/v_mp40.mdl_0.pcx /tmp/mp40/stock/
          cp /tmp/mp40-assets/common/models/weapons/mp40/v_mp40.mdl_1.pcx /tmp/mp40/stock/
          printf 'VRIL_STOCK_MDL_ORIGINAL_ACQUIRED\n'

      - name: Read exact pinned NZP QuakeC animation frame contract
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --depth 1 https://github.com/nzp-team/quakec.git /tmp/mp40-quakec
          git -C /tmp/mp40-quakec fetch --depth 1 origin 8a77f1ce45f1a2b9aa0afb301446954fda40e696
          git -C /tmp/mp40-quakec checkout --detach 8a77f1ce45f1a2b9aa0afb301446954fda40e696
          cp /tmp/mp40-quakec/source/shared/weapon_stats.qc /tmp/mp40/quakec/
          printf 'NZP_PINNED_QUAKEC_ANIMATION_AUTHORITY_ACQUIRED\n'

      - name: Binary audit both models, skeletal animations, true frame contract, UV/PBR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          python3 tools/mp40_bridge/audit_mp40_binary.py \
            --stock /tmp/mp40/stock/v_mp40.mdl \
            --aether /tmp/mp40/aether/viewmodel.glb \
            --texture /tmp/mp40/aether/weapon_mp40_c.png \
            --texture /tmp/mp40/aether/weapon_mp40_n.png \
            --texture /tmp/mp40/aether/_weapon_mp40_mp_s-rgb_weapon__08433bb1.png \
            --quakec /tmp/mp40/quakec/weapon_stats.qc \
            --report reports/mp40-real-binary-audit.json \
            2>&1 | tee reports/mp40-audit.log
          grep -q MP40_REAL_BINARY_GATES_GREEN reports/mp40-audit.log
          grep -q MP40_16K_CAPACITY_ONLY_GREEN reports/mp40-audit.log
          python3 - <<'PY'
          import json
          data=json.load(open("reports/mp40-real-binary-audit.json"))
          assert data["stock_vril"]["frames"]==46
          assert data["aether"]["clips"]==18
          assert data["aether"]["skins"]==1
          assert data["aether"]["total_triangles"]>2048
          assert data["triangles_fit_16k_patch"]
          assert not data["automatic_animation_retarget_proven"]
          assert not data["production_or_commercial_distribution_approved"]
          print("MP40_BOTH_REAL_BINARY_SOURCES_GATED_GREEN")
          PY

      - name: Publish NON-BINARY audit evidence only (do not redistribute Aether art)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MP40-VRIL-AETHER-TRUE-BINARY-AUDIT
          path: reports/
          if-no-files-found: warn
          retention-days: 14

  inspect-original-blender-source:
    name: Determine whether Vril MP40 gun and hands can be separated without rebuilding reload
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Retrieve NZP authored MP40 3D source
        run: |
          set -euo pipefail
          git clone --filter=blob:none --depth 1 --sparse https://github.com/nzp-team/assets.git /tmp/mp40-assets
          git -C /tmp/mp40-assets sparse-checkout set source/models/weapons/mp40/v_mp40 common/models/weapons/mp40
          test -s /tmp/mp40-assets/source/models/weapons/mp40/v_mp40/mesh.blend
      - name: Blender headless original 3D topology and rig census
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender python3-numpy python3-pil libegl1 libgl1 libgl1-mesa-dri
          blender -b /tmp/mp40-assets/source/models/weapons/mp40/v_mp40/mesh.blend \
            --python tools/mp40_bridge/blender_source_census.py \
            2>&1 | tee /tmp/mp40-blender-census.log
          grep -q MP40_NZP_SOURCE_AUTHORING_CENSUS /tmp/mp40-blender-census.log
          test -s /tmp/mp40-authoring-census.json
      - name: Bind-mapping truth -- gun, magazine and bolt against exact source bones
        run: |
          set -euo pipefail
          git -c protocol.version=2 fetch --no-tags --depth 1 --filter=blob:none origin feature/godot-aaa-rebuild-v1
          mkdir -p /tmp/mp40/aether
          git show FETCH_HEAD:xogot/assets/weapons/aether_waw_real/mp40/viewmodel.glb \
            > /tmp/mp40/aether/viewmodel.glb
          blender -b /tmp/mp40-assets/source/models/weapons/mp40/v_mp40/mesh.blend \
            --python tools/mp40_bridge/blender_rig_crosswalk.py \
            -- /tmp/mp40/aether/viewmodel.glb \
            2>&1 | tee /tmp/mp40-rig-crosswalk.log
          grep -q MP40_RIG_SEMANTIC_CROSSWALK_GREEN /tmp/mp40-rig-crosswalk.log
          test -s /tmp/mp40-skeleton-crosswalk.json
      - name: Experimental hybrid Blender asset - Aether HD gun + original animated NZP hands
        shell: bash
        run: |
          set -euo pipefail
          git show FETCH_HEAD:xogot/assets/weapons/aether_waw_textures/weapon_mp40_c.png \
            > /tmp/mp40/aether/weapon_mp40_c.png
          mkdir -p /tmp/mp40/hybrid
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          source=Path("/tmp/mp40-assets/common/models/weapons/mp40/v_mp40.mdl_0.pcx")
          dest=Path("/tmp/mp40/hybrid/real_stock_hand_skin.png")
          img=Image.open(source).convert("RGB")
          assert img.size==(128,128),img.size
          img.save(dest)
          print("MP40_ORIGINAL_PCX_HAND_TEXTURE_CONVERTED_GREEN")
          PY
          blender -b /tmp/mp40-assets/source/models/weapons/mp40/v_mp40/mesh.blend \
            --python tools/mp40_bridge/blender_hybrid_proto.py \
            -- /tmp/mp40/aether/viewmodel.glb \
               /tmp/mp40/aether/weapon_mp40_c.png \
               /tmp/mp40/hybrid/real_stock_hand_skin.png \
               /tmp/mp40/hybrid \
            2>&1 | tee /tmp/mp40-hybrid.log
          grep -q MP40_HYBRID_REAL_GUN_HAND_SEPARATION_GREEN /tmp/mp40-hybrid.log
          grep -q MP40_HYBRID_ORIGINAL_NZP_ARMATURE_BONE_BIND_GREEN /tmp/mp40-hybrid.log
          test -s /tmp/mp40/hybrid/hybrid-report.json
          python3 - <<'PY'
          import json
          r=json.load(open("/tmp/mp40/hybrid/hybrid-report.json"))
          assert r["retained_original_hand_triangles"]>300
          assert r["removed_stock_weapon_triangles"]>100
          assert r["aether_hd_triangles"]>3000
          assert r["actual_retained_hand_triangles"]==r["retained_original_hand_triangles"]
          assert r["old_animation_rig_reused"] is True
          assert r["stock_hands_original_skin_rebound"] is True
          assert not r["mdl_exported"] and not r["android_rendered"]
          print("MP40_BLENDER_HYBRID_NON_SHIPPING_GATE_GREEN")
          PY
      - name: Render original MP40 hands + modern Aether model at three actual rig poses
        shell: bash
        run: |
          set -euo pipefail
          BLEND=/tmp/mp40/hybrid/mp40-hybrid-vril-hands-aether-gun-EXPERIMENT.blend
          test -s "$BLEND"
          export LIBGL_ALWAYS_SOFTWARE=1
          export EGL_PLATFORM=surfaceless
          blender -b "$BLEND" \
            --python tools/mp40_bridge/blender_visual_motion_gate.py \
            -- /tmp/mp40/hybrid \
            2>&1 | tee /tmp/mp40-visual.log
          grep -q MP40_REAL_HYBRID_THREE_FRAME_RENDERED_GREEN /tmp/mp40-visual.log
          test -s /tmp/mp40/hybrid/hybrid_mp40_frame_01.png
          test -s /tmp/mp40/hybrid/hybrid_mp40_frame_17.png
          test -s /tmp/mp40/hybrid/hybrid_mp40_frame_31.png
          python3 - <<'PY'
          import json
          p="/tmp/mp40/hybrid/hybrid-visual-kinematic-report.json"
          data=json.load(open(p))
          assert data["real_hybrid_in_blender"]
          assert len(data["visual_preview_png"])==3
          assert not data["model_mdl_created"] and not data["phone_apk_created"]
          print("MP40_TRUE_HYBRID_VISUAL_FRAMES_CAPTURED_GREEN")
          PY

      - name: Preserve original authoring audit, no copyrighted model files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MP40-NZP-ORIGINAL-BLENDER-STRUCTURE-ONLY
          path: |
            /tmp/mp40-authoring-census.json
            /tmp/mp40-blender-census.log
            /tmp/mp40-skeleton-crosswalk.json
            /tmp/mp40-rig-crosswalk.log
            /tmp/mp40-hybrid.log
            /tmp/mp40/hybrid/hybrid-report.json
            /tmp/mp40/hybrid/hybrid-visual-kinematic-report.json
            /tmp/mp40/hybrid/hybrid_mp40_frame_*.png
            /tmp/mp40-visual.log
          if-no-files-found: warn
          retention-days: 14
