name: HAYUYA • export existing renders

on:
  push:
    branches:
      - art/hayuya-cleanroom-aaa-v1
    paths:
      - .github/workflows/hayuya-export-existing-renders.yml

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch four committed renders
        env:
          REV: db1f7ce50b916a1f8fbfd92e8eb36182d216e779
        run: |
          set -euo pipefail
          mkdir -p out/render-pack
          BASE="https://raw.githubusercontent.com/1993velezpadilla-source/config-old-3/$REV/hayuya/models/monja-trellis2-ab-01/renders"
          curl -L --fail --retry 3 "$BASE/front.png" -o out/render-pack/front.png
          curl -L --fail --retry 3 "$BASE/three_quarter.png" -o out/render-pack/three_quarter.png
          curl -L --fail --retry 3 "$BASE/side.png" -o out/render-pack/side.png
          curl -L --fail --retry 3 "$BASE/opposite.png" -o out/render-pack/opposite.png
      - uses: actions/upload-artifact@v4
        with:
          name: hayuya-monja-inline-renders
          path: out/render-pack/*
          if-no-files-found: error
          retention-days: 2
