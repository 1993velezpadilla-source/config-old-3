name: Xogot Nacht Toolchain Gate

on:
  workflow_dispatch:
  push:
    branches:
      - feature/godot-aaa-rebuild-v1
    paths:
      - "tools/patches/patch_ue421_material_texture_refs.py"
      - "tools/patches/synthesize_ue_basic_cube_xzms.py"
      - "tools/maps/UEAudioSceneExtract/**"
      - "tools/maps/UEAudioCueGraphExtract/**"
      - "tools/maps/UELightExtract/Program.cs"
      - ".github/workflows/xogot-nacht-toolchain-gate.yml"

permissions:
  contents: read

concurrency:
  group: xogot-nacht-toolchain-gate
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore pinned material audit and apply UE4.21 patch
        shell: bash
        run: |
          set -euo pipefail
          OLD=055f0d0721eb212e3f4713e149d1e2ace5c53674
          git fetch origin "$OLD" --depth=1
          git checkout "$OLD" -- tools/maps/UEMaterialAudit tools/maps/UELightExtract
          python3 tools/patches/patch_ue421_material_texture_refs.py
          grep -q "ResolveAuthoritativeTextureReferences" tools/maps/UEMaterialAudit/Program.cs
          git checkout "$GITHUB_SHA" -- tools/maps/UELightExtract/Program.cs
          grep -q "USCeneComponent visibility defaults to true" tools/maps/UELightExtract/Program.cs || true
          echo "XZOGOT_NACHT_MATERIAL_PATCH_APPLIED_GREEN"

      - name: Compile patched material authority
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore tools/maps/UEMaterialAudit/UEMaterialAudit.csproj
          dotnet build tools/maps/UEMaterialAudit/UEMaterialAudit.csproj -c Release --no-restore             2>&1 | tee /tmp/nacht-material-build.log
          ! grep -q " error CS" /tmp/nacht-material-build.log
          echo "XZOGOT_NACHT_MATERIAL_TOOLCHAIN_GREEN"

      - name: Compile generic audio scene authority
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore tools/maps/UEAudioSceneExtract/UEAudioSceneExtract.csproj
          dotnet build tools/maps/UEAudioSceneExtract/UEAudioSceneExtract.csproj -c Release --no-restore             2>&1 | tee /tmp/nacht-audio-scene-build.log
          ! grep -q " error CS" /tmp/nacht-audio-scene-build.log
          echo "XZOGOT_NACHT_AUDIO_SCENE_TOOLCHAIN_GREEN"

      - name: Compile generic audio cue graph authority
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore tools/maps/UEAudioCueGraphExtract/UEAudioCueGraphExtract.csproj
          dotnet build tools/maps/UEAudioCueGraphExtract/UEAudioCueGraphExtract.csproj -c Release --no-restore \
            2>&1 | tee /tmp/nacht-audio-cue-build.log
          ! grep -q " error CS" /tmp/nacht-audio-cue-build.log
          echo "XZOGOT_NACHT_AUDIO_CUE_TOOLCHAIN_GREEN"

      - name: Validate canonical UE engine cube bridge
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/nacht-cube
          mkdir -p /tmp/nacht-cube/meshes
          python3 - <<'PY'
          import json
          from pathlib import Path
          rows=[]
          for i in range(568):
              rows.append({
                  "index":i,
                  "file":f"m{i:04d}.xzm",
                  "objectPath":f"/Game/Fake/M{i}.M{i}",
                  "sourceMaterialCount":1,
                  "sourceSectionMaterialIndices":[0],
              })
          Path("/tmp/nacht-cube/source.json").write_text(
              json.dumps({"meshes":rows},indent=2)+"\n"
          )
          PY

          python3 tools/patches/synthesize_ue_basic_cube_xzms.py \
            --source-report /tmp/nacht-cube/source.json \
            --mesh-dir /tmp/nacht-cube/meshes \
            --output-report /tmp/nacht-cube/runtime.json

          python3 - <<'PY'
          import json,struct
          from pathlib import Path
          report=json.loads(Path("/tmp/nacht-cube/runtime.json").read_text())
          assert report["sourcePackageMeshCount"]==568,report
          assert report["engineBuiltinMeshCount"]==1,report
          assert report["runtimeMeshCount"]==569,report
          row=report["meshes"][-1]
          assert row["objectPath"]=="/Engine/BasicShapes/Cube.Cube",row
          assert row["vertexCount"]==24 and row["indexCount"]==36,row
          p=Path("/tmp/nacht-cube/meshes")/row["file"]
          data=p.read_bytes()
          assert data[:4]==b"XZMS"
          version,vc,ic,sc,flags,vstride,sstride=struct.unpack_from("<7I",data,4)
          assert (version,vc,ic,sc,vstride,sstride)==(4,24,36,1,104,16)
          bmin=struct.unpack_from("<3f",data,32)
          bmax=struct.unpack_from("<3f",data,44)
          assert bmin==(-0.5,-0.5,-0.5),(bmin,bmax)
          assert bmax==(0.5,0.5,0.5),(bmin,bmax)
          print("XZOGOT_NACHT_ENGINE_CUBE_TOOLCHAIN_GREEN",{
              "runtimeMeshes":569,
              "vertices":vc,
              "indices":ic,
              "bounds":[bmin,bmax],
          })
          PY

      - name: Compile patched UE4 light authority
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore tools/maps/UELightExtract/UELightExtract.csproj
          dotnet build tools/maps/UELightExtract/UELightExtract.csproj -c Release --no-restore \
            2>&1 | tee /tmp/nacht-light-build.log
          ! grep -q " error CS" /tmp/nacht-light-build.log
          echo "XZOGOT_NACHT_LIGHT_TOOLCHAIN_GREEN"
