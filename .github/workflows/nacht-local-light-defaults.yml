name: XZIEL Nacht Local Light Defaults

on:
  workflow_dispatch:
  pull_request:
    branches:
      - feature/xziel-nacht-decal-environment-v1
    paths:
      - ".github/workflows/nacht-local-light-defaults.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install SteamCMD and repak
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/steamcmd" "$RUNNER_TEMP/repak"
          curl -fL --retry 6 --retry-delay 2 --retry-all-errors \
            https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz \
            -o "$RUNNER_TEMP/steamcmd.tgz"
          tar -xzf "$RUNNER_TEMP/steamcmd.tgz" -C "$RUNNER_TEMP/steamcmd"
          "$RUNNER_TEMP/steamcmd/steamcmd.sh" +quit || true
          curl -fL --retry 5 \
            https://github.com/trumank/repak/releases/download/v0.2.3/repak_cli-x86_64-unknown-linux-gnu.tar.xz \
            -o "$RUNNER_TEMP/repak.tar.xz"
          tar -xJf "$RUNNER_TEMP/repak.tar.xz" -C "$RUNNER_TEMP/repak"
          REPAK=$(find "$RUNNER_TEMP/repak" -type f -name 'repak*' -perm -111 | head -1)
          test -n "$REPAK"
          echo "REPAK=$REPAK" >> "$GITHUB_ENV"

      - name: Download Nacht source
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/steamcmd/steamcmd.sh" \
            +login anonymous \
            +workshop_download_item 555160 2755515831 validate \
            +quit
          ROOT=$(find "$HOME" "$RUNNER_TEMP" -type d \
            -path '*/steamapps/workshop/content/555160/2755515831' \
            -print -quit 2>/dev/null)
          test -n "$ROOT"
          mkdir -p "$RUNNER_TEMP/nacht-unpacked"
          "$REPAK" unpack "$ROOT/WindowsNoEditor.pak" -o "$RUNNER_TEMP/nacht-unpacked"
          echo "UNPACKED=$RUNNER_TEMP/nacht-unpacked" >> "$GITHUB_ENV"

      - name: Inspect typed local-light components
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/light-defaults"
          cd "$RUNNER_TEMP/light-defaults"
          dotnet new console --framework net10.0 --force
          dotnet add package CUE4Parse --version 1.2.2.202609
          cat > Program.cs <<'CS'
          using CUE4Parse.FileProvider;
          using CUE4Parse.UE4.Versions;
          using System.Reflection;
          using System.Text.Json;

          if (args.Length != 2) return 2;

          var targetActors = new HashSet<string>(
              new [] {
                  "SpotLight_1","SpotLight2","SpotLight3","SpotLight4",
                  "SpotLight6","SpotLight7","SpotLight10","SpotLight11","SpotLight12",
                  "PointLight43","PointLight77","PointLight78","PointLight79",
                  "PointLight80","PointLight81","PointLight83_2","PointLight84_6"
              },
              StringComparer.OrdinalIgnoreCase);

          var provider = new DefaultFileProvider(
              args[0],
              SearchOption.AllDirectories,
              true,
              new VersionContainer(EGame.GAME_UE4_21));
          provider.Initialize();
          provider.PostMount();
          provider.LoadVirtualPaths();

          var maps = provider.Files.Values
              .Where(f => Path.GetFileName(f.Path).Equals(
                  "Nacht_de_Untoten.umap",
                  StringComparison.OrdinalIgnoreCase))
              .Select(f => f.Path)
              .Distinct(StringComparer.OrdinalIgnoreCase)
              .ToArray();
          if (maps.Length != 1) return 3;

          var exports = provider.LoadPackage(maps[0]).GetExports().ToArray();
          const BindingFlags flags =
              BindingFlags.Instance | BindingFlags.Public | BindingFlags.NonPublic;

          object? Read(object target, string name)
          {
              var f = target.GetType().GetField(name, flags);
              if (f is not null) {
                  try { return f.GetValue(target); } catch { }
              }
              var p = target.GetType().GetProperty(name, flags);
              if (p is not null && p.GetIndexParameters().Length == 0 && p.GetMethod is not null) {
                  try { return p.GetValue(target); } catch { }
              }
              return null;
          }

          string Value(object? value)
          {
              if (value is null) return "";
              try { return value.ToString() ?? ""; }
              catch { return ""; }
          }

          object? Resolve(object? value)
          {
              if (value is null) return null;
              var p = value.GetType().GetProperty("ResolvedObject", flags);
              if (p is null) return null;
              try { return p.GetValue(value); } catch { return null; }
          }

          object Snapshot(object target)
          {
              string[] wanted = {
                  "AttenuationRadius","Intensity","IntensityUnits","LightColor",
                  "InnerConeAngle","OuterConeAngle","SourceRadius","SoftSourceRadius",
                  "SourceLength","RelativeLocation","RelativeRotation","RelativeScale3D",
                  "Template","Class","bUseInverseSquaredFalloff","LightFalloffExponent"
              };

              var values = new SortedDictionary<string,string>(
                  StringComparer.OrdinalIgnoreCase);
              foreach (var name in wanted)
                  values[name] = Value(Read(target, name));

              return new {
                  type = target.GetType().FullName ?? target.GetType().Name,
                  values
              };
          }

          var rows = new List<object>();

          foreach (var export in exports)
          {
              var type = export.GetType().FullName ?? export.GetType().Name;
              if (!type.Contains("PointLightComponent", StringComparison.OrdinalIgnoreCase)
                  && !type.Contains("SpotLightComponent", StringComparison.OrdinalIgnoreCase))
                  continue;

              var path = export.GetPathName() ?? "";
              var actor = targetActors.FirstOrDefault(
                  name => path.Contains(
                      "." + name + ".",
                      StringComparison.OrdinalIgnoreCase));
              if (actor is null)
                  continue;

              var templateRef = Read(export, "Template");
              var template = Resolve(templateRef);

              rows.Add(new {
                  actor,
                  name = export.Name,
                  path,
                  component = Snapshot(export),
                  templateRef = Value(templateRef),
                  template = template is null ? null : Snapshot(template)
              });
          }

          var report = new {
              schemaVersion = 1,
              targetCount = targetActors.Count,
              componentCount = rows.Count,
              rows
          };

          File.WriteAllText(
              args[1],
              JsonSerializer.Serialize(
                  report,
                  new JsonSerializerOptions { WriteIndented = true }));

          Console.WriteLine(
              "XZIEL_LOCAL_LIGHT_DEFAULTS " +
              JsonSerializer.Serialize(new {
                  report.targetCount,
                  report.componentCount
              }));

          foreach (var row in rows)
              Console.WriteLine(
                  "XZIEL_LOCAL_LIGHT_ROW " +
                  JsonSerializer.Serialize(row));

          return rows.Count == targetActors.Count ? 0 : 4;
          CS

          dotnet run --configuration Release -- \
            "$UNPACKED" "$GITHUB_WORKSPACE/nacht-local-light-defaults.json"

      - name: Upload audit
        uses: actions/upload-artifact@v4
        with:
          name: nacht-local-light-defaults
          path: nacht-local-light-defaults.json
          if-no-files-found: error
