name: Aether Global Weapon Census

on:
  workflow_dispatch:
  push:
    branches:
      - feature/church-expansion-v1
    paths:
      - ".github/workflows/xogot-aether-global-weapon-census.yml"

permissions:
  contents: read

concurrency:
  group: xogot-aether-global-weapon-census
  cancel-in-progress: true

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v5

      - name: Download Project Aether
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aether-download"
          npx --yes itchio-downloader             --url "https://verrial.itch.io/projectaether"             --downloadDirectory "$RUNNER_TEMP/aether-download"
          FILE=$(find "$RUNNER_TEMP/aether-download" -type f -name '*.zip' -printf '%s\t%p\n' | sort -nr | head -1 | cut -f2-)
          test -s "$FILE"
          echo "PAYLOAD=$FILE" >> "$GITHUB_ENV"

      - name: Prepare legacy index
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aether-paks"
          7z x -y "$PAYLOAD" 'ProjectAether/Content/Paks/*' -o"$RUNNER_TEMP/aether-paks" >/dev/null
          PAKDIR="$RUNNER_TEMP/aether-paks/ProjectAether/Content/Paks"
          curl -fL --retry 5             https://github.com/trumank/retoc/releases/download/v0.1.5/retoc_cli-x86_64-unknown-linux-gnu.tar.xz             -o "$RUNNER_TEMP/retoc.tar.xz"
          mkdir -p "$RUNNER_TEMP/retoc"
          tar -xJf "$RUNNER_TEMP/retoc.tar.xz" -C "$RUNNER_TEMP/retoc"
          RETOC=$(find "$RUNNER_TEMP/retoc" -type f -name 'retoc*' -perm -111 | head -1)
          curl -fL --retry 5             https://github.com/trumank/repak/releases/download/v0.2.3/repak_cli-x86_64-unknown-linux-gnu.tar.xz             -o "$RUNNER_TEMP/repak.tar.xz"
          mkdir -p "$RUNNER_TEMP/repak"
          tar -xJf "$RUNNER_TEMP/repak.tar.xz" -C "$RUNNER_TEMP/repak"
          REPAK=$(find "$RUNNER_TEMP/repak" -type f -name 'repak*' -perm -111 | head -1)
          test -x "$RETOC" && test -x "$REPAK"
          "$RETOC" to-legacy "$PAKDIR" "$RUNNER_TEMP/aether-legacy.pak"
          "$REPAK" list "$RUNNER_TEMP/aether-legacy.pak" > aether-all-files.txt
          test -s aether-all-files.txt

      - name: Build complete family and weapon-directory census
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          prefix="ProjectAether/Content/Assets/Weapons/"
          rows={}
          for raw in Path("aether-all-files.txt").read_text(errors="ignore").splitlines():
              line=raw.strip().replace("\\","/")
              i=line.find(prefix)
              if i<0: continue
              rel=line[i+len(prefix):]
              parts=[p for p in rel.split("/") if p]
              if len(parts)<2: continue
              family,weapon=parts[0],parts[1]
              rec=rows.setdefault((family,weapon),{
                  "family":family,"weapon_dir":weapon,
                  "file_count":0,"uasset_count":0,
                  "has_model_hint":False,"has_gun_anims":False,"has_hand_anims":False,
                  "examples":[]
              })
              rec["file_count"]+=1
              if line.lower().endswith(".uasset"):
                  rec["uasset_count"]+=1
              low=rel.lower()
              base=parts[-1].lower()
              if any(k in base for k in ("model","viewmodel","weapon","gunmodel","_sm","vm_")) and base.endswith(".uasset"):
                  rec["has_model_hint"]=True
              if "/anims/gun/" in low: rec["has_gun_anims"]=True
              if "/anims/hands/" in low: rec["has_hand_anims"]=True
              if len(rec["examples"])<8: rec["examples"].append(rel)
          data=sorted(rows.values(),key=lambda x:(x["family"].lower(),x["weapon_dir"].lower()))
          families={}
          for rec in data:
              families.setdefault(rec["family"],[]).append(rec["weapon_dir"])
          wonder_rx=re.compile(r"ray|thunder|wunder|dg.?2|dg.?3|tesla|wave|apoth|servant|staff|blundergat|scavenger|paralyzer|sliquifier|jetgun|wonder",re.I)
          wonders=[r for r in data if wonder_rx.search(r["weapon_dir"])]
          complete=[r for r in data if r["has_model_hint"] and (r["has_gun_anims"] or r["has_hand_anims"])]
          out={
              "schema":1,
              "source":"Project Aether UE5.7",
              "family_count":len(families),
              "weapon_directory_count":len(data),
              "families":{k:sorted(v,key=str.lower) for k,v in sorted(families.items())},
              "model_plus_animation_candidate_count":len(complete),
              "model_plus_animation_candidates":complete,
              "wonder_candidate_count":len(wonders),
              "wonder_candidates":wonders,
          }
          Path("aether-global-weapon-census.json").write_text(json.dumps(out,indent=2)+"\n")
          print("XZOGOT_GLOBAL_WEAPON_CENSUS families=",out["family_count"],"weapon_dirs=",out["weapon_directory_count"],"model_anim=",len(complete),"wonders=",len(wonders))
          for fam,names in out["families"].items():
              print("XZOGOT_FAMILY",fam,len(names),names)
          print("XZOGOT_WONDER_CANDIDATES",[(r["family"],r["weapon_dir"]) for r in wonders])
          assert out["family_count"]>=20
          assert out["weapon_directory_count"]>=100
          PY

      - name: Upload global weapon census
        uses: actions/upload-artifact@v4
        with:
          name: aether-global-weapon-census
          path: aether-global-weapon-census.json
          if-no-files-found: error
          retention-days: 14
