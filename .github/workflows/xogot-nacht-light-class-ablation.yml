name: Nacht Light Class Saturation Diagnostic

on:
  push:
    branches:
      - feature/godot-aaa-rebuild-v1
    paths:
      - ".github/workflows/xogot-nacht-light-class-ablation.yml"
  workflow_dispatch:
    inputs:
      source_stage:
        description: "Validated Stage Nacht world artifact run with two source Blueprint interaction contracts"
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: xogot-nacht-light-class-ablation
  cancel-in-progress: true

jobs:
  ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      STAGE_RUN: ${{ inputs.source_stage || '37719736071' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/godot-aaa-rebuild-v1

      - name: Mount exact approved two-contract Nacht Stage #210
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nacht-sky-test" build/nacht-sky-ablation
          status="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/$STAGE_RUN" \
            --jq '.status + ":" + (.conclusion // "")')"
          test "$status" = "completed:success"
          gh run download "$STAGE_RUN" -R "$GITHUB_REPOSITORY" \
            -n Xogot-Nacht-Chronicles-Godot-Runtime \
            -D "$RUNNER_TEMP/nacht-sky-test"
          manifest="$(find "$RUNNER_TEMP/nacht-sky-test" -type f -name source_manifest.json -print -quit)"
          test -n "$manifest"
          source="$(dirname "$manifest")"
          test -s "$source/nacht-static-scene.json"
          python3 - "$source/nacht-particle-activation-authority.json" <<'PY'
          import json,sys
          from pathlib import Path
          path=Path(sys.argv[1]);assert path.is_file(),path
          authority=json.loads(path.read_text())
          contracts=authority.get("sourceInteractionContracts",[])
          assert len(contracts)==2,[c.get("fileName") for c in contracts]
          assert {c.get("fileName") for c in contracts}=={"MachineGumball.uasset","MysteryBox.uasset"}
          print("XZOGOT_NACHT_LIGHT_ABLATION_TWO_CONTRACT_STAGE_GREEN")
          PY
          rm -rf xogot/assets/benchmarks/nacht_chronicles
          mkdir -p xogot/assets/benchmarks
          cp -a "$source" xogot/assets/benchmarks/nacht_chronicles
          echo "XZOGOT_NACHT_SKY_ABLATION_STAGE_MOUNT_GREEN run=$STAGE_RUN"

      - name: Switch one actual Light3D class off in QA process only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('xogot/ci/nacht_full_map_capture.gd')
          s = p.read_text()
          needle = 'func _prepare_structural_visual_proof(scene: Node3D) -> void:\n'
          assert s.count(needle) == 1
          patch = (
              "\t# Diagnostic mode, never exported to Android or saved as a scene.\n"
              "\tvar mode := OS.get_environment(\"XZOGOT_NACHT_LIGHT_CLASS_ABLATION\")\n"
              "\tvar ablated := 0\n"
              "\tfor source_light: Node in scene.find_children(\"*\", \"Light3D\", true, false):\n"
              "\t\tvar affected := (\n"
              "\t\t\t(mode == \"directional\" and source_light is DirectionalLight3D)\n"
              "\t\t\tor (mode == \"local\" and (source_light is OmniLight3D or source_light is SpotLight3D))\n"
              "\t\t)\n"
              "\t\tif affected:\n"
              "\t\t\t(source_light as Light3D).visible = false\n"
              "\t\t\tablated += 1\n"
              "\tprint(\"XZOGOT_NACHT_LIGHT_CLASS_ABLATION mode=\", mode, \" nodes=\", ablated)\n"
              "\tassert((mode == \"directional\" and ablated >= 2) or (mode == \"local\" and ablated >= 160))\n"
          )
          p.write_text(s.replace(needle, needle + patch))
          print('XZOGOT_NACHT_LIGHT_CLASS_DIAGNOSTIC_TEST_ONLY_GREEN')
          PY
          echo "Source-authoritative stage and code untouched; local capture-only class filter." > build/nacht-sky-ablation/source-parity.txt

      - name: Install tested renderer and visual QA tooling
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          timeout 400 sudo apt-get update -qq
          timeout 600 sudo apt-get install -y -qq unzip curl xvfb libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers
          python3 -m pip install --user "pillow==11.3.0" || python3 -m pip install --break-system-packages "pillow==11.3.0"
          curl -L --fail --retry 4 --retry-all-errors --retry-delay 2 \
            https://github.com/godotengine/godot-builds/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip \
            -o /tmp/godot-sky.zip
          mkdir -p /tmp/godot-sky
          unzip -q /tmp/godot-sky.zip -d /tmp/godot-sky
          chmod +x /tmp/godot-sky/Godot_v4.6.1-stable_linux.x86_64

      - name: Import once and capture both directional-off and local-off branches
        shell: bash
        run: |
          set -euo pipefail
          timeout 900 /tmp/godot-sky/Godot_v4.6.1-stable_linux.x86_64 \
            --headless --editor --path xogot --quit \
            2>&1 | tee build/nacht-sky-ablation/import.log
          ! grep -E 'SCRIPT ERROR|Parse Error|ERROR: Failed to load script|MAX_MESH_SURFACES' build/nacht-sky-ablation/import.log
          for mode in directional local; do
            XZOGOT_NACHT_LIGHT_CLASS_ABLATION="$mode" \
              timeout 1000 xvfb-run -a -s "-screen 0 1280x720x24" \
              /tmp/godot-sky/Godot_v4.6.1-stable_linux.x86_64 \
              --path xogot --rendering-method gl_compatibility \
              --resolution 1280x720 --script res://ci/nacht_full_map_capture.gd \
              2>&1 | tee "build/nacht-sky-ablation/capture-$mode.log"
            grep -q "XZOGOT_NACHT_LIGHT_CLASS_ABLATION mode=$mode nodes=" \
              "build/nacht-sky-ablation/capture-$mode.log"
            grep -q 'XZOGOT_NACHT_CAPTURE_WORLD_GREEN' \
              "build/nacht-sky-ablation/capture-$mode.log"
            cp /tmp/xogot-nacht-overview.png \
              "build/nacht-sky-ablation/$mode-overview.png"
            cp /tmp/xogot-nacht-spawn.png \
              "build/nacht-sky-ablation/$mode-spawn.png"
          done
          echo 'XZOGOT_NACHT_LIGHT_CLASS_BOTH_CAPTURES_GREEN'

      - name: Measure class-specific source-white pixel counts independently
        shell: bash
        run: |
          set -euo pipefail
          for mode in directional local; do
            set +e
            python3 tools/maps/nacht_visual_void_guard.py \
              --overview "build/nacht-sky-ablation/$mode-overview.png" \
              --spawn "build/nacht-sky-ablation/$mode-spawn.png" \
              --report "build/nacht-sky-ablation/$mode-metrics.json" \
              --max-white-ratio 0.005 --max-white-blob 500
            code=$?
            set -e
            [[ "$code" -eq 0 || "$code" -eq 3 ]]
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=Path('build/nacht-sky-ablation')
          cases={}
          for mode in ('directional','local'):
              r=json.loads((d/f'{mode}-metrics.json').read_text())
              assert r['images'][0]['width']==1280
              assert r['images'][0]['height']==720
              cases[mode]={
                  'nearWhitePixels':r['images'][0]['near_white_pixels'],
                  'largestBlob':r['images'][0]['largest_contiguous_near_white_pixels'],
                  'visualQAGreen':bool(r['ready']),
              }
          (d/'class-contrast-report.json').write_text(json.dumps({
            'baselineNearWhitePixels':31460,
            'sourceVisualExact':False,
            'sourceStageRun':37719736071,
            'cases':cases,
            'instruction':'A/B diagnostic only. Never turn off all lighting in shipping build.'
          },indent=2))
          print('XZOGOT_NACHT_LIGHT_CLASS_CONTRAST_GREEN',json.dumps(cases,sort_keys=True))
          PY

      - name: Upload actual source-class captures, logs and measured contrast
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nacht-Source-Light-Class-Contrast
          path: build/nacht-sky-ablation/
          retention-days: 14
          if-no-files-found: warn
