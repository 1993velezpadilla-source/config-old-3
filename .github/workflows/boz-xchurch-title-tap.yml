name: XChurch Title Tap Capture

on:
  workflow_dispatch:
  push:
    branches:
      - feature/boz-mod-runtime
    paths:
      - ".github/workflows/boz-xchurch-title-tap.yml"

permissions:
  actions: read
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 18

    steps:
      - uses: actions/checkout@v5

      - name: Enable KVM
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/xchurch-tap/proof/screens
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"'             | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          test -e /dev/kvm

      - name: Download verified XChurch APK
        uses: actions/download-artifact@v4
        with:
          name: XZIEL-BOZ-XChurch-APK
          run-id: 36768068731
          github-token: ${{ github.token }}
          path: /tmp/xchurch-source

      - name: Install Android tools
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n1)"
          AVDMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name avdmanager | sort -V | tail -n1)"
          test -x "$SDKMANAGER"
          test -x "$AVDMANAGER"
          echo "AVDMANAGER=$AVDMANAGER" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER"             "platform-tools"             "emulator"             "system-images;android-30;google_apis;x86_64" >/dev/null

      - name: Boot Android 11 and launch BOZ
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/xchurch-tap
          PROOF="$OUT/proof"
          APK="$(find /tmp/xchurch-source -type f -name '*.apk' | head -n1)"
          test -s "$APK"
          cp "$APK" "$OUT/xchurch.apk"

          export ANDROID_AVD_HOME=/tmp/xchurch-tap-avd
          mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"

          printf 'no\n' | "$AVDMANAGER" create avd             --force --name xchurch-tap             --package "system-images;android-30;google_apis;x86_64"             --device "pixel_4" >/dev/null

          ADB="$ANDROID_HOME/platform-tools/adb"
          EMU="$ANDROID_HOME/emulator/emulator"
          "$ADB" start-server >/dev/null 2>&1 || true

          nohup "$EMU" @xchurch-tap             -no-window -gpu swiftshader_indirect -no-snapshot             -noaudio -no-boot-anim -no-metrics -camera-back none             > "$PROOF/emulator.log" 2>&1 &
          EMU_PID=$!
          echo "EMU_PID=$EMU_PID" > "$PROOF/status.txt"

          READY=0
          for i in $(seq 1 70); do
            if [ "$("$ADB" get-state 2>/dev/null || true)" = "device" ]; then
              READY=1; break
            fi
            sleep 2
          done
          echo "ADB_READY=$READY" >> "$PROOF/status.txt"
          test "$READY" = "1"

          BOOT=0
          for i in $(seq 1 70); do
            if [ "$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              BOOT=1; break
            fi
            sleep 2
          done
          echo "BOOT_COMPLETED=$BOOT" >> "$PROOF/status.txt"
          test "$BOOT" = "1"

          "$ADB" install --abi arm64-v8a -r -d "$OUT/xchurch.apk"             > "$PROOF/install.txt" 2>&1
          echo "INSTALL_RC=$?" >> "$PROOF/status.txt"

          "$ADB" shell pm grant com.activision.boz android.permission.WRITE_EXTERNAL_STORAGE 2>/dev/null || true
          "$ADB" shell pm grant com.activision.boz android.permission.READ_EXTERNAL_STORAGE 2>/dev/null || true
          "$ADB" shell mkdir -p /sdcard/Android/obb/com.activision.boz 2>/dev/null || true

          "$ADB" logcat -c
          "$ADB" shell am force-stop com.activision.boz >/dev/null 2>&1 || true
          "$ADB" shell am start -W -n com.activision.boz/.Main             > "$PROOF/launch.txt" 2>&1
          echo "LAUNCH_RC=$?" >> "$PROOF/status.txt"

      - name: Wait for title screen tap and capture menu
        shell: bash
        run: |
          set +e
          OUT=/tmp/xchurch-tap
          PROOF="$OUT/proof"
          ADB="$ANDROID_HOME/platform-tools/adb"

          sleep 60
          "$ADB" exec-out screencap -p > "$PROOF/screens/pre_tap_60s.png" 2>/dev/null || true

          sleep 35
          "$ADB" exec-out screencap -p > "$PROOF/screens/title_95s.png" 2>/dev/null || true
          echo "TITLE_PID=$("$ADB" shell pidof com.activision.boz 2>/dev/null | tr -d '\r\n')"             | tee -a "$PROOF/status.txt"

          "$ADB" shell wm size > "$PROOF/wm-size.txt" 2>&1 || true
          "$ADB" shell dumpsys input > "$PROOF/input-before.txt" 2>&1 || true

          # Title screen accepts touch anywhere; use multiple safe points.
          "$ADB" shell input tap 540 400
          sleep 1
          "$ADB" shell input tap 900 400
          echo "TAP_SENT=true" | tee -a "$PROOF/status.txt"

          sleep 5
          "$ADB" exec-out screencap -p > "$PROOF/screens/post_tap_05s.png" 2>/dev/null || true
          sleep 10
          "$ADB" exec-out screencap -p > "$PROOF/screens/post_tap_15s.png" 2>/dev/null || true
          sleep 15
          "$ADB" exec-out screencap -p > "$PROOF/screens/post_tap_30s.png" 2>/dev/null || true

          PID="$("$ADB" shell pidof com.activision.boz 2>/dev/null | tr -d '\r\n')"
          echo "FINAL_PID=$PID" | tee -a "$PROOF/status.txt"

          "$ADB" logcat -d -v threadtime > "$PROOF/logcat.txt" 2>&1
          "$ADB" shell dumpsys activity activities > "$PROOF/activities.txt" 2>&1
          "$ADB" shell dumpsys window windows > "$PROOF/window.txt" 2>&1
          sha256sum "$PROOF"/screens/*.png > "$PROOF/screen-hashes.txt" 2>/dev/null || true
          grep -Eai             'FATAL EXCEPTION|Fatal signal|SIGSEGV|SIGABRT|UnsatisfiedLinkError|dlopen failed|STARTGAME|GAME|menu|front|xchurch|kino|Marmalade|s3e|activision|boz'             "$PROOF/logcat.txt" | tail -1200 > "$PROOF/logcat-focus.txt" || true
          exit 0

      - name: Summarize title tap proof
        if: always()
        shell: bash
        run: |
          set +e
          PROOF=/tmp/xchurch-tap/proof
          cat "$PROOF/status.txt" 2>/dev/null || true
          cat "$PROOF/screen-hashes.txt" 2>/dev/null || true
          find "$PROOF" -maxdepth 2 -type f -printf '%P %s bytes\n'             | sort > "$PROOF/manifest.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: XChurch-Title-Tap-Proof
          path: /tmp/xchurch-tap/proof/
          if-no-files-found: error
          retention-days: 14
