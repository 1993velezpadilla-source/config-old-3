name: XZIEL Nacht Source Visual Scene Build

on:
  workflow_dispatch:
  push:
    branches:
      - feature/xziel-engine-nacht-runtime-v1
    paths:
      - "tools/maps/compile_nacht_visual_scene.py"
      - "tests/test_nacht_visual_scene_compiler.py"
      - "assets/nacht_reference/pavlov_scene_reference/**"
      - ".github/workflows/nacht-source-visual-scene.yml"

permissions:
  contents: read

concurrency:
  group: xziel-nacht-source-visual-scene
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Prove visual scene compiler contract
        run: |
          set -euo pipefail
          python3 -m py_compile tools/maps/compile_nacht_visual_scene.py
          python3 tests/test_nacht_visual_scene_compiler.py

  source-conversion:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5

      - name: Install SteamCMD and repak
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/steamcmd" "$RUNNER_TEMP/repak"
          curl -fL --retry 6 --retry-delay 2 --retry-all-errors             https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz             -o "$RUNNER_TEMP/steamcmd.tgz"
          tar -xzf "$RUNNER_TEMP/steamcmd.tgz" -C "$RUNNER_TEMP/steamcmd"
          "$RUNNER_TEMP/steamcmd/steamcmd.sh" +quit || true
          curl -fL --retry 5             https://github.com/trumank/repak/releases/download/v0.2.3/repak_cli-x86_64-unknown-linux-gnu.tar.xz             -o "$RUNNER_TEMP/repak.tar.xz"
          tar -xJf "$RUNNER_TEMP/repak.tar.xz" -C "$RUNNER_TEMP/repak"
          REPAK=$(find "$RUNNER_TEMP/repak" -type f -name 'repak*' -perm -111 | head -1)
          test -n "$REPAK"
          echo "REPAK=$REPAK" >> "$GITHUB_ENV"

      - name: Download and unpack public Pavlov Nacht source
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/steamcmd/steamcmd.sh"             +login anonymous             +workshop_download_item 555160 2755515831 validate             +quit
          ROOT=$(find "$HOME" "$RUNNER_TEMP" -type d             -path '*/steamapps/workshop/content/555160/2755515831'             -print -quit 2>/dev/null)
          test -n "$ROOT"
          test -f "$ROOT/WindowsNoEditor.pak"
          mkdir -p "$RUNNER_TEMP/nacht-unpacked"
          "$REPAK" unpack "$ROOT/WindowsNoEditor.pak" -o "$RUNNER_TEMP/nacht-unpacked"
          echo "UNPACKED=$RUNNER_TEMP/nacht-unpacked" >> "$GITHUB_ENV"

      - name: Build exact 492-mesh CUE4Parse exporter
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/exporter"
          cd "$RUNNER_TEMP/exporter"
          dotnet new console --framework net10.0 --force
          dotnet add package CUE4Parse --version 1.2.2.202609
          dotnet add package CUE4Parse-Conversion --version 1.2.2.202609
          cat > Program.cs <<'CS'
          using CUE4Parse.FileProvider;
          using CUE4Parse.UE4.Versions;
          using CUE4Parse.UE4.Assets.Exports.StaticMesh;
          using CUE4Parse_Conversion;
          using CUE4Parse_Conversion.Options;
          using System.Text.Json;

          if (args.Length < 3) return 2;
          using var doc = JsonDocument.Parse(File.ReadAllText(args[2]));
          var wanted = new HashSet<string>(StringComparer.OrdinalIgnoreCase);
          foreach (var row in doc.RootElement.GetProperty("meshes").EnumerateArray()) {
              var source = row.GetProperty("sourcePath").GetString() ?? "";
              var name = source.Replace('\\','/').TrimEnd('/').Split('/').Last();
              if (!string.IsNullOrWhiteSpace(name)) wanted.Add(name);
          }
          if (wanted.Count != 492) {
              Console.Error.WriteLine($"expected 492 mesh names, got {wanted.Count}");
              return 3;
          }

          var provider = new DefaultFileProvider(
              args[0],
              SearchOption.AllDirectories,
              true,
              new VersionContainer(EGame.GAME_UE4_21)
          );
          provider.Initialize();
          provider.PostMount();
          provider.LoadVirtualPaths();

          var session = new ExportSession {
              MaxDegreeOfParallelism = Math.Max(1, Environment.ProcessorCount / 2)
          };
          var queued = new HashSet<string>(StringComparer.OrdinalIgnoreCase);

          foreach (var file in provider.Files.Values
              .Where(f => f.IsUePackage)
              .Where(f => f.Path.Contains("/CoD_nacht/", StringComparison.OrdinalIgnoreCase))
              .Where(f => f.Path.EndsWith(".uasset", StringComparison.OrdinalIgnoreCase))) {
              try {
                  foreach (var mesh in provider.LoadPackage(file.Path).GetExports().OfType<UStaticMesh>()) {
                      if (!wanted.Contains(mesh.Name) || !queued.Add(mesh.Name)) continue;
                      session.Add(mesh);
                  }
              } catch (Exception e) {
                  Console.WriteLine("skip=" + file.Path + " :: " + e.Message);
              }
          }

          Console.WriteLine($"wanted={wanted.Count} queued={queued.Count}");
          if (queued.Count != wanted.Count) {
              foreach (var name in wanted.Except(queued).Take(50))
                  Console.Error.WriteLine("missing=" + name);
              return 4;
          }

          Directory.CreateDirectory(args[1]);
          var result = await session.RunAsync(
              args[1],
              new ExportOptions(meshFormat: EMeshFormat.Gltf2, exportMaterials: false)
          );
          Console.WriteLine($"exportResults={result.Count}");
          return result.Count == wanted.Count ? 0 : 5;
          CS
          dotnet build -c Release

      - name: Export all referenced Nacht StaticMeshes
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/scene-glb" build/nacht-source-visual
          dotnet "$RUNNER_TEMP/exporter/bin/Release/net10.0/exporter.dll"             "$UNPACKED"             "$RUNNER_TEMP/scene-glb"             "$GITHUB_WORKSPACE/assets/nacht_reference/pavlov_scene_reference/assets.json"             2>&1 | tee build/nacht-source-visual/export.log

          python3 - <<'PY'
          import os, pathlib, shutil
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'scene-glb'
          root.mkdir(parents=True, exist_ok=True)
          recovered=0
          for p in list(pathlib.Path.cwd().iterdir()):
              if not p.is_file() or '\\' not in p.name or not p.name.lower().endswith('.glb'):
                  continue
              name=p.name.replace('\\','/').split('/')[-1]
              target=root/name
              if target.exists():
                  raise SystemExit(f'duplicate exported GLB {name}')
              shutil.move(str(p),str(target))
              recovered+=1
          glbs=list(root.rglob('*.glb'))
          stems={p.stem.lower() for p in glbs}
          print('recovered_backslash_outputs', recovered)
          print('glb_files', len(glbs), 'unique_stems', len(stems))
          assert len(glbs)==492, len(glbs)
          assert len(stems)==492, len(stems)
          PY

      - name: Compile XZIEL visual scene
        run: |
          set -euo pipefail
          python3 tools/maps/compile_nacht_visual_scene.py             --mesh-root "$RUNNER_TEMP/scene-glb"             --output build/nacht-source-visual/xziel.visual.scene.json             | tee build/nacht-source-visual/compile.log
          python3 - <<'PY'
          import json, pathlib
          p=json.loads(pathlib.Path('build/nacht-source-visual/xziel.visual.scene.json').read_text())
          s=p['summary']
          assert s['requiredMeshCount']==492, s
          assert s['resolvedMeshCount']==492, s
          assert s['sceneInstanceCount']==10791, s
          assert s['referencedMeshCount']==492, s
          assert s['geometryReady'] is True, s
          assert s['visualParityReady'] is False, s
          print('XZIEL_NACHT_SOURCE_CONVERSION_GREEN', s)
          PY

      - name: Upload conversion evidence only
        uses: actions/upload-artifact@v4
        with:
          name: XZIEL-Nacht-Source-Visual-Scene-Evidence
          path: |
            build/nacht-source-visual/xziel.visual.scene.json
            build/nacht-source-visual/export.log
            build/nacht-source-visual/compile.log
          retention-days: 7
