name: Nacht Material Graph Slice

on:
  workflow_dispatch:
  push:
    branches:
      - feature/godot-aaa-rebuild-v1
    paths:
      - ".github/workflows/xogot-nacht-material-graph-slice.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: xogot-nacht-material-graph-slice
  cancel-in-progress: true

jobs:
  slice:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_ARTIFACT: Xogot-Nacht-Chronicles-Full-Map-Authority

    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/godot-aaa-rebuild-v1
          fetch-depth: 1

      - name: Resolve latest GREEN full Nacht authority
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_RUN=""
          for PAGE in 1 2 3 4 5; do
            SOURCE_RUN=$(gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100&page=$PAGE" \
              --jq '[.workflow_runs[] | select(.head_branch=="feature/godot-aaa-rebuild-v1" and .name=="Xogot Nacht Chronicles Full Map Authority" and .conclusion=="success")][0].id // empty')
            if [ -n "$SOURCE_RUN" ]; then break; fi
          done
          test -n "$SOURCE_RUN"
          echo "SOURCE_RUN=$SOURCE_RUN" >> "$GITHUB_ENV"
          echo "XZOGOT_NACHT_MATERIAL_GRAPH_SLICE_SOURCE_GREEN run=$SOURCE_RUN"

      - name: Download exact full authority
        shell: bash
        run: |
          set -euo pipefail
          rm -rf full slice
          mkdir -p full slice
          downloaded=false
          for attempt in 1 2 3; do
            rm -rf full
            mkdir -p full
            if gh run download "$SOURCE_RUN" \
              -R "${GITHUB_REPOSITORY}" \
              -n "$SOURCE_ARTIFACT" \
              -D full; then
              downloaded=true
              break
            fi
            sleep $((attempt * 8))
          done
          test "$downloaded" = true

      - name: Slice unresolved material graphs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          root=Path("full")
          out=Path("slice")
          out.mkdir(exist_ok=True)
          matches=list(root.rglob("nacht-materials.json"))
          if not matches:
              raise SystemExit("nacht-materials.json missing")
          source=json.loads(matches[0].read_text())

          needles=[
              "mtl_p7_zm_gen_debris_concrete_rubble_lg_03",
              "t7_water_cp_bio_muddy_waterfall",
              "mysterBoxVerticalMat",
          ]
          rows=source.get("materials",[])
          selected=[]
          selected_paths=set()
          base_paths=set()

          for row in rows:
              path=str(row.get("objectPath",""))
              if any(n.lower() in path.lower() for n in needles):
                  selected.append(row)
                  selected_paths.add(path.lower())
                  base=str(row.get("semanticBaseMaterialPath",""))
                  if base:
                      base_paths.add(base.lower())

          # Pull every exact-basename sibling plus every material whose
          # semantic base points at a selected target. This can recover a
          # MaterialInstanceConstant carrying explicit source parameters even
          # when the cooked base Material graph is stripped.
          target_leafs={
              p.rsplit("/",1)[-1].split(".",1)[0].lower()
              for p in selected_paths
          }
          changed=True
          while changed:
              changed=False
              for row in rows:
                  path=str(row.get("objectPath",""))
                  path_l=path.lower()
                  leaf=path.rsplit("/",1)[-1].split(".",1)[0].lower()
                  base=str(row.get("semanticBaseMaterialPath","")).lower()
                  if (
                      path_l not in selected_paths
                      and (
                          leaf in target_leafs
                          or base in selected_paths
                          or path_l in base_paths
                      )
                  ):
                      selected.append(row)
                      selected_paths.add(path_l)
                      if leaf:
                          target_leafs.add(leaf)
                      if base:
                          base_paths.add(base)
                      changed=True

          payload={
              "sourceRun":int(os.environ["SOURCE_RUN"]),
              "targets":needles,
              "selectedCount":len(selected),
              "materials":selected,
          }
          (out/"material-graph-slice.json").write_text(
              json.dumps(payload,indent=2)+"\n"
          )
          print("XZOGOT_NACHT_MATERIAL_GRAPH_SLICE_GREEN", {
              "sourceRun":payload["sourceRun"],
              "selectedCount":payload["selectedCount"],
              "paths":[r.get("objectPath") for r in selected],
          })
          PY

      - name: Slice portable source material exports
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p slice/portable
          python3 - <<'PY'
          from pathlib import Path
          import json, shutil

          root=Path("full")
          out=Path("slice/portable")
          needles=(
              "mysterboxverticalmat",
              "mysteryboxverticalparticle",
              "mysteryboxverticalrippleparticle",
              "mysteryboxverticalmaskparticlethin",
              "mtl_p7_zm_gen_debris_concrete_rubble_lg_03",
          )
          copied=[]
          for source in root.rglob("*"):
              if not source.is_file():
                  continue
              rel=source.relative_to(root).as_posix()
              lower=rel.lower()
              if not any(needle in lower for needle in needles):
                  continue
              # Portable material/texture JSON is the useful diagnostic lane;
              # keep logs/binaries out of this focused slice.
              if source.suffix.lower() != ".json":
                  continue
              target=out / rel.replace("/", "__")
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source,target)
              copied.append({
                  "source":rel,
                  "slice":target.relative_to(Path("slice")).as_posix(),
                  "bytes":source.stat().st_size,
              })

          (out/"index.json").write_text(json.dumps(copied,indent=2)+"\n")
          if not copied:
              raise SystemExit("no portable target material exports found")
          print("XZOGOT_NACHT_PORTABLE_MATERIAL_SLICE_GREEN", {
              "count":len(copied),
              "files":[row["source"] for row in copied],
          })
          PY

      - name: Build placed Cascade candidate matrix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          root=Path("full")
          out=Path("slice")
          graphs_path=next(root.rglob("nacht-particle-graphs.json"), None)
          runtime_path=next(root.rglob("particle-runtime-manifest.json"), None)
          materials_path=next(root.rglob("nacht-materials.json"), None)
          if not graphs_path or not runtime_path or not materials_path:
              raise SystemExit("particle/material authority missing")

          graphs=json.loads(graphs_path.read_text())
          runtime=json.loads(runtime_path.read_text())
          materials=json.loads(materials_path.read_text())

          def canonical(raw):
              value=str(raw or "").strip().replace("\\","/")
              if "'" in value and value.endswith("'"):
                  value=value.split("'",1)[1][:-1]
              if value.startswith("Content/"):
                  value="/Game/"+value[8:]
              elif value.startswith("Game/"):
                  value="/"+value
              return value.lower()

          def unwrap(value):
              if isinstance(value,list):
                  return [unwrap(x) for x in value]
              if not isinstance(value,dict):
                  return value
              kind=str(value.get("kind",""))
              if kind=="FScriptStruct":
                  return unwrap(value.get("value"))
              if kind=="FPackageIndex":
                  return value.get("path")
              members=value.get("members")
              if isinstance(members,dict):
                  if "GenericValue" in members:
                      return unwrap(members["GenericValue"])
                  if "Value" in members and len(members)<=4:
                      return unwrap(members["Value"])
              if kind=="FStructFallback":
                  result={}
                  for row in value.get("properties",[]):
                      if isinstance(row,dict) and row.get("name"):
                          result[str(row["name"])]=unwrap(row.get("value"))
                  return result
              return {str(k):unwrap(v) for k,v in value.items()}

          def props(node):
              result={}
              for row in node.get("properties",[]):
                  if isinstance(row,dict) and row.get("name"):
                      result[str(row["name"])]=unwrap(row.get("value"))
              return result

          mats={canonical(row.get("objectPath")):row for row in materials.get("materials",[]) if row.get("objectPath")}
          rows=[]
          seen=set()
          for placement in runtime.get("placements",[]):
              system_path=str(placement.get("templatePath",""))
              key=canonical(system_path)
              graph=next((g for g in graphs.get("systems",[]) if canonical(g.get("objectPath"))==key),None)
              if graph is None:
                  continue
              if key in seen:
                  continue
              seen.add(key)
              required=[n for n in graph.get("nodes",[]) if n.get("exportType")=="ParticleModuleRequired"]
              material_path=""
              screen_alignment=""
              if len(required)==1:
                  p=props(required[0])
                  material_path=str(p.get("Material","") or "")
                  screen_alignment=str(p.get("ScreenAlignment","") or "")
              mat=mats.get(canonical(material_path),{})
              node_types=sorted({str(n.get("exportType","")) for n in graph.get("nodes",[]) if n.get("exportType")})
              rows.append({
                  "systemPath":system_path,
                  "placementCount":sum(1 for p in runtime.get("placements",[]) if canonical(p.get("templatePath"))==key),
                  "nodeCount":graph.get("nodeCount"),
                  "referenceCount":graph.get("referenceCount"),
                  "unsupportedNodeTypes":placement.get("unsupportedNodeTypes",[]),
                  "nodeTypes":node_types,
                  "materialPath":material_path,
                  "screenAlignment":screen_alignment,
                  "materialFound":bool(mat),
                  "materialExportType":mat.get("exportType"),
                  "materialCanonicalTextures":mat.get("canonicalTextures",{}),
                  "materialTextureCount":len(mat.get("textures",[])),
                  "materialRawPropertyKeys":mat.get("rawPropertyKeys",[]),
                  "materialExpressionTypes":sorted({str(x.get("exportType","")) for x in mat.get("expressions",[]) if isinstance(x,dict) and x.get("exportType")}),
              })

          rows.sort(key=lambda r:(len(r["unsupportedNodeTypes"]),r["materialTextureCount"],r["systemPath"].lower()))
          payload={"systemCount":len(rows),"systems":rows}
          (out/"particle-candidate-matrix.json").write_text(json.dumps(payload,indent=2)+"\n")
          print("XZOGOT_NACHT_PARTICLE_CANDIDATE_MATRIX_GREEN", {
              "systems":len(rows),
              "zeroUnsupported":sum(1 for r in rows if not r["unsupportedNodeTypes"]),
              "materialsFound":sum(1 for r in rows if r["materialFound"]),
          })
          PY

      - name: Upload material graph slice
        uses: actions/upload-artifact@v4
        with:
          name: Xogot-Nacht-Material-Graph-Slice
          path: slice/
          if-no-files-found: error
          retention-days: 14
          compression-level: 9
