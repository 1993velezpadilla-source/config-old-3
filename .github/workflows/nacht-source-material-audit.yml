name: XZIEL Nacht Source Material Audit

on:
  workflow_dispatch:
  push:
    branches:
      - feature/xziel-nacht-material-pipeline-v1
      - feature/xziel-engine-nacht-runtime-v1
    paths:
      - "tools/maps/build_xziel_nacht_material_contract.py"
      - "tests/test_nacht_material_contract.py"
      - "assets/nacht_reference/pavlov_scene_reference/assets.json"
      - ".github/workflows/nacht-source-material-audit.yml"

permissions:
  contents: read

concurrency:
  group: xziel-nacht-source-material-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - name: Test XZIEL Nacht material semantics
        run: |
          set -euo pipefail
          python3 -m py_compile tools/maps/build_xziel_nacht_material_contract.py
          python3 tests/test_nacht_material_contract.py

  source-material-audit:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5

      - name: Install source extraction dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev zlib1g-dev libpng-dev build-essential perl git p7zip-full
          mkdir -p "$RUNNER_TEMP/steamcmd" "$RUNNER_TEMP/repak"
          curl -fL --retry 6 --retry-delay 2 --retry-all-errors             https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz             -o "$RUNNER_TEMP/steamcmd.tgz"
          tar -xzf "$RUNNER_TEMP/steamcmd.tgz" -C "$RUNNER_TEMP/steamcmd"
          "$RUNNER_TEMP/steamcmd/steamcmd.sh" +quit || true
          curl -fL --retry 5             https://github.com/trumank/repak/releases/download/v0.2.3/repak_cli-x86_64-unknown-linux-gnu.tar.xz             -o "$RUNNER_TEMP/repak.tar.xz"
          tar -xJf "$RUNNER_TEMP/repak.tar.xz" -C "$RUNNER_TEMP/repak"
          REPAK=$(find "$RUNNER_TEMP/repak" -type f -name 'repak*' -perm -111 | head -1)
          test -n "$REPAK"
          echo "REPAK=$REPAK" >> "$GITHUB_ENV"

      - name: Download and unpack public Pavlov Nacht source
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/steamcmd/steamcmd.sh"             +login anonymous             +workshop_download_item 555160 2755515831 validate             +quit
          ROOT=$(find "$HOME" "$RUNNER_TEMP" -type d             -path '*/steamapps/workshop/content/555160/2755515831'             -print -quit 2>/dev/null)
          test -n "$ROOT"
          test -f "$ROOT/WindowsNoEditor.pak"
          mkdir -p "$RUNNER_TEMP/nacht-unpacked"
          "$REPAK" unpack "$ROOT/WindowsNoEditor.pak" -o "$RUNNER_TEMP/nacht-unpacked"
          echo "UNPACKED=$RUNNER_TEMP/nacht-unpacked" >> "$GITHUB_ENV"

      - name: Build UE Viewer
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/gildor2/UEViewer.git "$RUNNER_TEMP/UEViewer"
          cd "$RUNNER_TEMP/UEViewer"
          ./build.sh
          UMODEL=$(realpath "$(find . -type f -name umodel -perm -111 | head -1)")
          test -n "$UMODEL"
          echo "UMODEL=$UMODEL" >> "$GITHUB_ENV"

      - name: Build exact 492 source package list
        run: |
          set -euo pipefail
          mkdir -p build/nacht-material-audit
          python3 - <<'PY'
          import json, pathlib
          src=pathlib.Path('assets/nacht_reference/pavlov_scene_reference/assets.json')
          d=json.loads(src.read_text())
          rows=d['meshes']
          assert d['uniqueMeshCount']==492 and len(rows)==492
          out=[]
          for row in rows:
              p=row['sourcePath']
              assert p.startswith('/Game/')
              parts=pathlib.PurePosixPath(p[len('/Game/'):].strip('/')).parts
              assert len(parts)>=2,(p,parts)
              rel='Pavlov/Content/'+pathlib.PurePosixPath(*parts[:-1]).as_posix()+'.uasset'
              out.append(rel)
          assert len(set(x.lower() for x in out))==492
          pathlib.Path('build/nacht-material-audit/source-uassets.txt').write_text('\n'.join(out)+'\n')
          print('XZIEL_NACHT_MATERIAL_SOURCE_LIST_OK',len(out),'object_to_package_mapping=DROP_FINAL_OBJECT_SEGMENT')
          PY

      - name: Export material metadata for all 492 referenced meshes
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/umodel-materials"
          mkdir -p "$OUT"
          ok=0
          fail=0
          while IFS= read -r rel; do
            file="$UNPACKED/$rel"
            if [ ! -f "$file" ]; then
              echo "MISSING_PACKAGE $rel"
              fail=$((fail+1))
              continue
            fi
            if "$UMODEL" -export -gltf -game=ue4.21 -path="$UNPACKED" -out="$OUT" "$rel" >/dev/null 2>&1; then
              ok=$((ok+1))
            else
              echo "UMODEL_FAIL $rel"
              fail=$((fail+1))
            fi
          done < build/nacht-material-audit/source-uassets.txt
          echo "packages_ok=$ok packages_fail=$fail" | tee build/nacht-material-audit/export-summary.txt
          test "$ok" -eq 492
          test "$fail" -eq 0

      - name: Inventory material channels and texture references
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import collections,json,os,pathlib,re
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'umodel-materials'
          mats=sorted(root.rglob('*.mat'))
          if not mats:
              raise SystemExit('no .mat files exported')
          channels=collections.Counter()
          suffixes=collections.Counter()
          texture_refs=collections.Counter()
          rows=[]
          keys=('Diffuse','Normal','Specular','SpecPower','Opacity','Emissive','Cube','Mask')
          for p in mats:
              vals={}
              others=[]
              for raw in p.read_text(errors='replace').splitlines():
                  line=raw.strip()
                  if not line or '=' not in line:
                      continue
                  k,v=line.split('=',1)
                  if k in keys:
                      vals[k]=v
                      channels[k]+=1
                      texture_refs[v]+=1
                      m=re.search(r'_([cnsg])$',v,re.I)
                      if m:
                          suffixes['_'+m.group(1).lower()]+=1
                  elif k.startswith('Other['):
                      others.append(v)
                      texture_refs[v]+=1
                      m=re.search(r'_([cnsg])$',v,re.I)
                      if m:
                          suffixes['_'+m.group(1).lower()]+=1
              rows.append({
                  'material':p.stem,
                  'channels':vals,
                  'other_textures':others,
              })
          report={
              'material_count':len(mats),
              'channel_counts':dict(channels),
              'texture_suffix_counts':dict(suffixes),
              'unique_texture_refs':len(texture_refs),
              'materials':rows,
          }
          out=pathlib.Path('build/nacht-material-audit/nacht-material-channel-report.json')
          out.write_text(json.dumps(report,indent=2)+'\n')
          print('XZIEL_NACHT_MATERIAL_RAW_AUDIT',json.dumps({
              'materialCount':len(mats),
              'uniqueTextureReferences':len(texture_refs),
              'channelCounts':dict(channels),
          },sort_keys=True))
          PY

      - name: Build XZIEL material contract
        run: |
          set -euo pipefail
          python3 tools/maps/build_xziel_nacht_material_contract.py             build/nacht-material-audit/nacht-material-channel-report.json             build/nacht-material-audit/xziel.materials.json             | tee build/nacht-material-audit/material-contract.log
          python3 - <<'PY'
          import json,pathlib
          p=json.loads(pathlib.Path('build/nacht-material-audit/xziel.materials.json').read_text())
          assert p['validation']['ok'] is True,p['validation']
          assert p['summary']['materialCount'] > 0,p['summary']
          assert p['summary']['uniqueTextureReferenceCount'] > 0,p['summary']
          assert p['runtimeContract']['preserveSourceTextureNames'] is True
          assert p['runtimeContract']['requireSamplerSemanticMetadata'] is True
          print('XZIEL_NACHT_MATERIAL_CONTRACT_GREEN',json.dumps(p['summary'],sort_keys=True))
          PY

      - name: Upload material evidence only
        uses: actions/upload-artifact@v4
        with:
          name: XZIEL-Nacht-Source-Material-Evidence
          path: |
            build/nacht-material-audit/source-uassets.txt
            build/nacht-material-audit/export-summary.txt
            build/nacht-material-audit/nacht-material-channel-report.json
            build/nacht-material-audit/xziel.materials.json
            build/nacht-material-audit/material-contract.log
          retention-days: 7
