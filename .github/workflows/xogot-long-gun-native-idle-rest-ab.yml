name: Xogot Long Guns Original PSA vs Native Rest Forensic
on:
  workflow_dispatch:
  push:
    branches:
      - fix/source-viewmodel-inherited-hands-unit-scale
    paths:
      - "xogot/ci/source_long_gun_idle_rest_ab.gd"
      - ".github/workflows/xogot-long-gun-native-idle-rest-ab.yml"
permissions:
  contents: read
jobs:
  native-source-forensics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {start: 0, end: 4}
          - {start: 4, end: 8}
    env:
      XOGOT_REST_START: ${{ matrix.start }}
      XOGOT_REST_END: ${{ matrix.end }}
    steps:
      - uses: actions/checkout@v5
      - name: Install native Godot renderer
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers
          curl -L --fail --retry 5 --retry-all-errors --retry-delay 2 \
            https://github.com/godotengine/godot-builds/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip -o /tmp/godot.zip
          mkdir -p /tmp/godot /tmp/xogot-long-gun-native-rest build/long-native
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.6.1-stable_linux.x86_64
      - name: Parse all original skeletons and animations
        run: |
          set -euo pipefail
          timeout 240 /tmp/godot/Godot_v4.6.1-stable_linux.x86_64 \
            --headless --editor --path xogot --quit 2>&1 | tee build/long-native/import.log
          ! grep -E "SCRIPT ERROR|Parse Error" build/long-native/import.log
      - name: Real Godot PSA idle vs native rest A-B screenshots
        run: |
          set -euo pipefail
          timeout 490 xvfb-run -a -s "-screen 0 1280x720x24" \
            /tmp/godot/Godot_v4.6.1-stable_linux.x86_64 \
            --path xogot --audio-driver Dummy --rendering-method gl_compatibility \
            --resolution 1280x720 --script res://ci/source_long_gun_idle_rest_ab.gd \
            2>&1 | tee build/long-native/render.log
          grep -q "XZOGOT_LONG_NATIVE_REST_SOURCE_AB_GREEN frames=16" build/long-native/render.log
          test "$(find /tmp/xogot-long-gun-native-rest -maxdepth 1 -name '*.png' | wc -l)" -eq 16
          ! grep -E "SCRIPT ERROR|Parse Error|XZOGOT_LONG_NATIVE_REST_RED" build/long-native/render.log
      - name: Preserve source comparative screenshots even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Xogot-Source-PSA-vs-Rest-${{ matrix.start }}-${{ matrix.end }}-16PNG
          path: /tmp/xogot-long-gun-native-rest/*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve measured native bone positions even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Xogot-Source-PSA-vs-Rest-Logs-${{ matrix.start }}-${{ matrix.end }}
          path: build/long-native/*.log
          if-no-files-found: warn
          retention-days: 14
