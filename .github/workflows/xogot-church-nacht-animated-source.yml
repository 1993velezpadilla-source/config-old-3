name: Church Recovered 102-bone Nacht Zombie Test

on:
  workflow_dispatch:
  push:
    branches:
      - feature/church-expansion-v1
    paths:
      - "tools/maps/chronicles_bridge/**"
      - "xogot/scripts/church_source_machine_mount.gd"
      - "xogot/scripts/you_wont_win.gd"
      - "xogot/ci/church_source_machine_probe.gd"
      - "xogot/ci/church_three_real_rounds_probe.gd"
      - "xogot/ci/church_template_visual_capture.gd"
      - "xogot/scripts/zombie_dummy.gd"
      - "xogot/scripts/chronicles_template_registry.gd"
      - "xogot/data/church_chronicles_template.json"
      - "xogot/ci/chronicles_original_template_probe.gd"
      - ".github/workflows/xogot-church-nacht-animated-source.yml"

permissions:
  contents: read
  actions: read

jobs:
  source-runtime-church:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      XZOGOT_REQUIRE_WORKSHOP_ZOMBIE: "1"
    steps:
      - uses: actions/checkout@v5
      - name: Use EXISTING decoded rig archive, no new source decoding
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovered-workshop
          gh run download 37714627696 -n Xogot-Nacht-Chronicles-Full-Map-Authority -D recovered-workshop
          test "$(find recovered-workshop -path '*/skeletons/report.json' -type f | wc -l)" -eq 1
          test "$(find recovered-workshop -path '*/skeletal-meshes/report.json' -type f | wc -l)" -eq 1
          test "$(find recovered-workshop -path '*/animations/report.json' -type f | wc -l)" -eq 1
          echo XZOGOT_EXISTING_DECODED_NACHT_ARCHIVE_RECOVERED
      - name: Source 102-bone / original source animation bridge
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/maps/chronicles_bridge/stage_reference_zombie.py recovered-workshop xogot | tee zombie-bridge.log
          grep -q XZOGOT_NACHT_102BONE_REFERENCE_IMPORTED zombie-bridge.log
          python3 tools/maps/chronicles_bridge/stage_church_machines.py recovered-workshop xogot | tee machine-bridge.log
          grep -q XZOGOT_NACHT_13_MACHINE_PIECES_CONVERTED_GREEN machine-bridge.log
          gh api "repos/${GITHUB_REPOSITORY}/git/blobs/6ae63194bae7682c4f8188e95fb31cefd0b7c315" --jq .content | base64 --decode > xogot/assets/reference/church/machines/nuketown_mystery_box.gltf
          python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path("xogot/assets/reference/church/machines/nuketown_mystery_box.gltf")
          doc=json.loads(path.read_text())
          clips={c.get("name","") for c in doc.get("animations",[])}
          assert len(doc.get("skins",[]))==1
          assert len(doc["skins"][0].get("joints",[]))==5
          assert {"open","close","weapon_rise","teddy_rise","arrive","leave"}.issubset(clips),clips
          print("XZOGOT_NUKETOWN_BOX_5BONE_SEVEN_REAL_CLIPS_STAGED")
          PY
          rm -rf recovered-workshop
      - name: Verify real animated gun model bytes, not procedural placeholders
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/maps/chronicles_bridge/check_real_guns.py xogot | tee gun-meshes.log
          grep -q XZOGOT_CHURCH_11_REAL_GUN_MODELS_GREEN gun-meshes.log
      - name: Install Godot 4.6.1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/church-godot
          curl -L --fail --retry 4 --retry-all-errors --retry-delay 2 \
            https://github.com/godotengine/godot-builds/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip \
            -o /tmp/church-godot.zip
          unzip -q /tmp/church-godot.zip -d /tmp/church-godot
          chmod +x /tmp/church-godot/Godot_v4.6.1-stable_linux.x86_64
      - name: Import 102-bone animated real source scene into Godot
        shell: bash
        run: |
          set -euo pipefail
          timeout 180 /tmp/church-godot/Godot_v4.6.1-stable_linux.x86_64 \
            --headless --editor --path xogot --quit 2>&1 | tee godot-import.log
          ! grep -E 'SCRIPT ERROR|Parse Error|ERROR: Failed to load script' godot-import.log
      - name: Real church chase collision hitscan and source animation test
        shell: bash
        run: |
          set -euo pipefail
          timeout 140 /tmp/church-godot/Godot_v4.6.1-stable_linux.x86_64 \
            --headless --path xogot --script res://ci/chronicles_original_template_probe.gd \
            2>&1 | tee church-zombie-live.log
          grep -q XZOGOT_CHURCH_RECOVERED_NACHT_102_BONE_RIG_GREEN church-zombie-live.log
          grep -q XZOGOT_CHURCH_TEMPLATE_PHYSICAL_CHASE_GREEN church-zombie-live.log
          grep -q XZOGOT_CHURCH_TEMPLATE_GUN_HIT_DAMAGE_GREEN church-zombie-live.log
          ! grep -E 'CHRONICLES_TEMPLATE_PROBE:|SCRIPT ERROR|Parse Error' church-zombie-live.log
      - name: Verify original-reference Mystery Box Power Switch and Pack-a-Punch geometry in playable church
        shell: bash
        run: |
          set -euo pipefail
          timeout 105 /tmp/church-godot/Godot_v4.6.1-stable_linux.x86_64 \
            --headless --path xogot --script res://ci/church_source_machine_probe.gd \
            2>&1 | tee church-machine-live.log
          grep -q XZOGOT_CHURCH_THREE_ARCHIVED_MACHINE_MODELS_MOUNTED_GREEN church-machine-live.log
          grep -q XZOGOT_CHURCH_SOURCE_BOX_OPEN_AUTHORED_ANIMATION_GREEN church-machine-live.log
          grep -q XZOGOT_CHURCH_MACHINE_GAMEPLAY_BACKEND_COLLISION_PRESERVED church-machine-live.log
          ! grep -E 'CHURCH_SOURCE_MACHINE_PROBE:|SCRIPT ERROR|Parse Error' church-machine-live.log
      - name: Complete three real zombie rounds and validate unlimited round formula
        shell: bash
        run: |
          set -euo pipefail
          timeout 200 /tmp/church-godot/Godot_v4.6.1-stable_linux.x86_64 \
            --headless --path xogot --script res://ci/church_three_real_rounds_probe.gd \
            2>&1 | tee church-three-rounds.log
          grep -q XZOGOT_CHURCH_THREE_LIVE_WAVES_GREEN church-three-rounds.log
          grep -q XZOGOT_CHURCH_ROUNDS_1000_FORMULA_GREEN church-three-rounds.log
          ! grep -E 'CHURCH_THREE_ROUNDS_PROBE:|SCRIPT ERROR|Parse Error' church-three-rounds.log
      - name: Capture SIX unobstructed, source-authentic Godot inspection screenshots
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers
          mkdir -p build/church-visual-evidence
          timeout 270 xvfb-run -a -s "-screen 0 1600x900x24" \
            /tmp/church-godot/Godot_v4.6.1-stable_linux.x86_64 \
            --path xogot --rendering-method gl_compatibility --resolution 1600x900 \
            --script res://ci/church_template_visual_capture.gd \
            2>&1 | tee church-photos.log
          grep -q 'XZOGOT_REAL_CHURCH_SIX_SOURCE_INSPECTION_PHOTOS_CAPTURED_ART_REVIEW_PENDING' church-photos.log
          test "$(find build/church-visual-evidence -maxdepth 1 -name '*.jpg' | wc -l)" -eq 6
          ! grep -E 'CHURCH_VISUAL_CAPTURE:|SCRIPT ERROR|Parse Error' church-photos.log
      - name: Print compact authenticated real image data for inline QA
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          for path in sorted(Path("build/church-visual-evidence").glob("*.jpg")):
              encoded = base64.b64encode(path.read_bytes()).decode("ascii")
              for index, offset in enumerate(range(0,len(encoded),3400)):
                  print(f"XZOGOT_IMAGE_CHUNK {path.stem} {index:05d} {encoded[offset:offset+3400]}")
              print(f"XZOGOT_IMAGE_COMPLETE {path.stem} {len(encoded)}")
          PY
      - name: Upload authentic Godot church screenshots (not asset meshes)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Church-Real-Godot-Source-Template-Photos
          path: |
            build/church-visual-evidence/*.jpg
            church-photos.log
          if-no-files-found: warn
          retention-days: 10
      - name: Upload technical verification LOGS ONLY (not copyrighted asset files)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Church-102Bone-Zombie-and-3DGuns-Technical-Logs
          path: |
            zombie-bridge.log
            machine-bridge.log
            gun-meshes.log
            church-machine-live.log
            church-three-rounds.log
            godot-import.log
            church-zombie-live.log
          if-no-files-found: ignore
          retention-days: 7
