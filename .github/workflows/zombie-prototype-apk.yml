name: XZIEL Dead Cell APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/zombie-prototype-apk.yml"
      - "tools/zombie_prototype/**"
      - "android/**"
      - "scripts/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/zombie-prototype-apk.yml"
      - "tools/zombie_prototype/**"
      - "android/**"
      - "scripts/**"

permissions:
  contents: read
  actions: read

concurrency:
  group: xziel-dead-cell-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-prototype:
    name: Build XZIEL Dead Cell
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout XZIEL
        uses: actions/checkout@v5

      - name: Generate Dead Cell gameplay map
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/zombie_prototype/generate_graybox_map.py
          test -s build/prototype/xziel_proto.map
          cat build/prototype/xziel_proto_report.json

      - name: Compile map and spawn zones with NZP tools
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/nzp-assets /tmp/spawn-zone-tool
          git clone --depth 1 https://github.com/nzp-team/assets.git /tmp/nzp-assets
          git clone --depth 1 --recursive https://github.com/nzp-team/spawn-zone-tool.git /tmp/spawn-zone-tool
          python3 -m pip install --quiet -r /tmp/spawn-zone-tool/requirements.txt

          (
            cd /tmp/nzp-assets
            bash tools/compile-wads.sh
            mkdir -p source/maps/xziel_proto
            cp "$GITHUB_WORKSPACE/build/prototype/xziel_proto.map" source/maps/xziel_proto/xziel_proto.map
            bash tools/compile-maps.sh --map xziel_proto --zone-tool-path /tmp/spawn-zone-tool
          ) 2>&1 | tee /tmp/xziel-proto-map-compile.log

          mkdir -p proto-dist
          cp /tmp/nzp-assets/common/maps/xziel_proto.bsp proto-dist/
          test -s /tmp/nzp-assets/common/maps/xziel_proto.nsz
          cp /tmp/nzp-assets/common/maps/xziel_proto.nsz proto-dist/
          cp build/prototype/xziel_proto.map proto-dist/
          cp build/prototype/xziel_proto_report.json proto-dist/
          cp /tmp/xziel-proto-map-compile.log proto-dist/
          ls -lh proto-dist/

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK, NDK and emulator
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER"             "platform-tools"             "platforms;android-35"             "build-tools;35.0.0"             "ndk;27.2.12479018"             "emulator"             "system-images;android-35;google_apis;x86_64"

      - name: Prepare native Android project with prototype map
        shell: bash
        env:
          XZIEL_EXTRA_MAP_NAME: xziel_proto
          XZIEL_EXTRA_MAP_BSP: ${{ github.workspace }}/proto-dist/xziel_proto.bsp
          XZIEL_EXTRA_MAP_NSZ: ${{ github.workspace }}/proto-dist/xziel_proto.nsz
        run: |
          set -euo pipefail
          bash scripts/prepare_android.sh
          unzip -l build/android-project/app/src/main/assets/nzp-data.zip | grep 'nzp/maps/xziel_proto.bsp'
          unzip -l build/android-project/app/src/main/assets/nzp-data.zip | grep 'nzp/maps/xziel_proto.nsz'

      - name: Make prototype a separate one-tap app
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          activity = Path("build/android-project/app/src/main/java/org/libsdl/app/NZPActivity.java")
          text = activity.read_text(encoding="utf-8")
          pattern = re.compile(
              r'(return\s+new\s+String\[\]\s*\{\s*"-basedir"\s*,\s*dataRoot\.getAbsolutePath\(\)\s*)(\};)',
              re.MULTILINE,
          )
          text, count = pattern.subn(
              r'\1,\n            "+map", "xziel_proto"\n        \2',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("Could not patch NZPActivity default launch arguments")
          activity.write_text(text, encoding="utf-8")

          gradle = Path("build/android-project/app/build.gradle")
          g = gradle.read_text(encoding="utf-8")
          if 'applicationId "com.xziel.nzp"' not in g:
              raise SystemExit("Could not locate applicationId")
          g = g.replace('applicationId "com.xziel.nzp"', 'applicationId "com.xziel.deadcell"', 1)
          g = g.replace('versionName "0.18-hud-polish"', 'versionName "0.2-dead-cell"', 1)
          gradle.write_text(g, encoding="utf-8")

          strings = Path("build/android-project/app/src/main/res/values/strings.xml")
          s = strings.read_text(encoding="utf-8")
          s = re.sub(r'<string name="app_name">.*?</string>',
                     '<string name="app_name">XZIEL: Dead Cell</string>', s)
          strings.write_text(s, encoding="utf-8")
          PY

      - name: Build prototype APK
        working-directory: build/android-project
        shell: bash
        run: ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          cp build/android-project/app/build/outputs/apk/debug/app-debug.apk             proto-dist/XZIEL-Dead-Cell-debug.apk
          ls -lh proto-dist/XZIEL-Dead-Cell-debug.apk

      - name: Android emulator gameplay boot smoke
        id: smoke
        continue-on-error: true
        shell: bash
        env:
          ANDROID_AVD_HOME: ${{ runner.temp }}/xziel-zombie-proto-avd
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_AVD_HOME"
          ADB="${ANDROID_HOME}/platform-tools/adb"
          EMULATOR="${ANDROID_HOME}/emulator/emulator"
          AVDMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name avdmanager | sort | tail -n 1)"

          printf 'no\n' | "$AVDMANAGER" create avd             --force --name xziel-zombie-proto-ci             --package "system-images;android-35;google_apis;x86_64"             --device "pixel_6"

          [[ ! -e /dev/kvm ]] || sudo chmod 666 /dev/kvm || true
          nohup "$EMULATOR" @xziel-zombie-proto-ci             -no-window -no-audio -no-boot-anim -no-snapshot             -gpu swiftshader_indirect -memory 2048             > proto-dist/emulator-stdout.txt 2>&1 &

          timeout 120 "$ADB" wait-for-device
          for i in $(seq 1 60); do
            [[ "$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]] && break
            sleep 2
          done
          test "$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1"

          "$ADB" install -r proto-dist/XZIEL-Dead-Cell-debug.apk
          "$ADB" shell settings put secure immersive_mode_confirmations confirmed || true
          "$ADB" logcat -c
          "$ADB" shell am force-stop com.xziel.deadcell || true
          "$ADB" shell am start -W -n com.xziel.deadcell/org.libsdl.app.NZPActivity             > proto-dist/am-start.txt 2>&1 || true

          sleep 32
          "$ADB" exec-out screencap -p > proto-dist/prototype-a.png
          sleep 5
          "$ADB" exec-out screencap -p > proto-dist/prototype-b.png
          "$ADB" logcat -d -v threadtime > proto-dist/prototype-logcat.txt || true

          python3 -m pip install --quiet pillow==11.3.0
          python3 - <<'PY' | tee proto-dist/visual-report.txt
          from PIL import Image, ImageChops, ImageStat
          ims=[]
          for p in ["proto-dist/prototype-a.png","proto-dist/prototype-b.png"]:
              im=Image.open(p).convert("RGB")
              if im.width <= im.height or im.width < 1000 or im.height < 500:
                  raise SystemExit(f"Bad gameplay screenshot dimensions: {p} {im.size}")
              gray=im.convert("L")
              st=ImageStat.Stat(gray)
              lo,hi=gray.getextrema()
              if hi-lo < 20 or st.stddev[0] < 6:
                  raise SystemExit(f"Gameplay frame is blank/flat: {p} extrema={(lo,hi)} std={st.stddev[0]:.2f}")
              ims.append(im)
              print(p, im.size, "mean", round(st.mean[0],2), "std", round(st.stddev[0],2), "extrema", (lo,hi))
          diff=ImageChops.difference(ims[0],ims[1]).convert("L")
          ds=ImageStat.Stat(diff)
          print("frame_delta_mean",round(ds.mean[0],3),"frame_delta_std",round(ds.stddev[0],3))
          PY

          PID="$("$ADB" shell pidof com.xziel.deadcell 2>/dev/null | tr -d '\r' || true)"
          STAGE="$("$ADB" shell run-as com.xziel.deadcell cat files/nzp-runtime/.xziel-stage 2>/dev/null | tr -d '\r' || true)"
          echo "PID=$PID" | tee proto-dist/runtime-state.txt
          echo "STAGE=$STAGE" | tee -a proto-dist/runtime-state.txt
          "$ADB" shell run-as com.xziel.deadcell ls -l files/nzp-runtime/nzp/maps/             > proto-dist/runtime-maps.txt 2>&1 || true

          if grep -Eq "Fatal signal|FATAL EXCEPTION|EGL_BAD_CONTEXT|stage=SYS_ERROR" proto-dist/prototype-logcat.txt; then
            echo "Native/runtime crash detected"
            exit 1
          fi
          test -n "$PID"
          test "$STAGE" = "FIRST_FRAME_OK"

      - name: Upload APK, map and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XZIEL-Dead-Cell
          path: proto-dist/
          if-no-files-found: error
          retention-days: 14

      - name: Fail if gameplay boot failed
        if: steps.smoke.outcome == 'failure'
        shell: bash
        run: exit 1
