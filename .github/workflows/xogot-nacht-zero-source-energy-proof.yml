name: Nacht Authored Zero-Light Source Proof

on:
  push:
    branches:
      - fix/nacht-zero-source-light-photometric-fidelity
    paths:
      - ".github/workflows/xogot-nacht-zero-source-energy-proof.yml"
  workflow_dispatch:
    inputs:
      source_stage:
        description: "Validated Stage Nacht world artifact run with two source Blueprint interaction contracts"
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: xogot-nacht-zero-light-source-proof
  cancel-in-progress: true

jobs:
  ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      STAGE_RUN: ${{ inputs.source_stage || '37719736071' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/nacht-zero-source-light-photometric-fidelity

      - name: Mount unchanged two-contract Stage Nacht #210
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nacht-sky-test" build/nacht-sky-ablation
          status="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/$STAGE_RUN" \
            --jq '.status + ":" + (.conclusion // "")')"
          test "$status" = "completed:success"
          gh run download "$STAGE_RUN" -R "$GITHUB_REPOSITORY" \
            -n Xogot-Nacht-Chronicles-Godot-Runtime \
            -D "$RUNNER_TEMP/nacht-sky-test"
          manifest="$(find "$RUNNER_TEMP/nacht-sky-test" -type f -name source_manifest.json -print -quit)"
          test -n "$manifest"
          source="$(dirname "$manifest")"
          test -s "$source/nacht-static-scene.json"
          python3 - "$source/nacht-particle-activation-authority.json" <<'PY'
          import json,sys
          from pathlib import Path
          path=Path(sys.argv[1]);assert path.is_file(),path
          authority=json.loads(path.read_text())
          contracts=authority.get("sourceInteractionContracts",[])
          assert len(contracts)==2,[c.get("fileName") for c in contracts]
          assert {c.get("fileName") for c in contracts}=={"MachineGumball.uasset","MysteryBox.uasset"}
          print("XZOGOT_NACHT_LIGHT_ABLATION_TWO_CONTRACT_STAGE_GREEN")
          PY
          rm -rf xogot/assets/benchmarks/nacht_chronicles
          mkdir -p xogot/assets/benchmarks
          cp -a "$source" xogot/assets/benchmarks/nacht_chronicles
          echo "XZOGOT_NACHT_SKY_ABLATION_STAGE_MOUNT_GREEN run=$STAGE_RUN"

      - name: Verify zero UE sunlight is zero-energy in actual running world
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('xogot/ci/nacht_full_map_capture.gd')
          s=p.read_text()
          needle='func _prepare_structural_visual_proof(scene: Node3D) -> void:\n'
          assert s.count(needle)==1
          patch=(
              '\tvar zero_sun := scene.find_child("light_0001", true, false) as DirectionalLight3D\n'
              '\tvar moon := scene.find_child("light_0000", true, false) as DirectionalLight3D\n'
              '\tassert(zero_sun != null and moon != null)\n'
              '\tassert(is_zero_approx(zero_sun.light_energy))\n'
              '\tassert(is_zero_approx(zero_sun.light_intensity_lux))\n'
              '\tassert(not is_zero_approx(moon.light_energy))\n'
              '\tprint("XZOGOT_NACHT_SOURCE_ZERO_SUN_ENERGY_GREEN zero_light=light_0001 energy=0 other_source_light=light_0000 unchanged=true")\n'
          )
          p.write_text(s.replace(needle,needle+patch))
          print('XZOGOT_NACHT_ZERO_SOURCE_ENERGY_RENDER_GUARD_INSTALLED')
          PY
          echo 'Source-authored zero intensity correction is the only runtime change.' > build/nacht-sky-ablation/source-parity.txt

      - name: Install tested renderer and visual QA tooling
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          timeout 400 sudo apt-get update -qq
          timeout 600 sudo apt-get install -y -qq unzip curl xvfb libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers
          python3 -m pip install --user "pillow==11.3.0" || python3 -m pip install --break-system-packages "pillow==11.3.0"
          curl -L --fail --retry 4 --retry-all-errors --retry-delay 2 \
            https://github.com/godotengine/godot-builds/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip \
            -o /tmp/godot-sky.zip
          mkdir -p /tmp/godot-sky
          unzip -q /tmp/godot-sky.zip -d /tmp/godot-sky
          chmod +x /tmp/godot-sky/Godot_v4.6.1-stable_linux.x86_64

      - name: Render actual Nacht with authoritative zero-energy directional sun
        shell: bash
        run: |
          set -euo pipefail
          timeout 900 /tmp/godot-sky/Godot_v4.6.1-stable_linux.x86_64 \
            --headless --editor --path xogot --quit \
            2>&1 | tee build/nacht-sky-ablation/import.log
          ! grep -E "SCRIPT ERROR|Parse Error|ERROR: Failed to load script|MAX_MESH_SURFACES" build/nacht-sky-ablation/import.log
          timeout 1200 xvfb-run -a -s "-screen 0 1280x720x24" \
            /tmp/godot-sky/Godot_v4.6.1-stable_linux.x86_64 \
            --path xogot --rendering-method gl_compatibility \
            --resolution 1280x720 --script res://ci/nacht_full_map_capture.gd \
            2>&1 | tee build/nacht-sky-ablation/capture.log
          grep -q 'XZOGOT_NACHT_SOURCE_ZERO_SUN_ENERGY_GREEN' build/nacht-sky-ablation/capture.log
          grep -q 'XZOGOT_NACHT_CAPTURE_WORLD_GREEN' build/nacht-sky-ablation/capture.log
          test -s /tmp/xogot-nacht-overview.png
          test -s /tmp/xogot-nacht-spawn.png
          cp /tmp/xogot-nacht-overview.png build/nacht-sky-ablation/
          cp /tmp/xogot-nacht-spawn.png build/nacht-sky-ablation/
          echo 'XZOGOT_NACHT_ZERO_SUN_RENDER_GREEN'

      - name: Measure genuine white pixels after zero-intensity sun correction
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python3 tools/maps/nacht_visual_void_guard.py \
            --overview build/nacht-sky-ablation/xogot-nacht-overview.png \
            --spawn build/nacht-sky-ablation/xogot-nacht-spawn.png \
            --report build/nacht-sky-ablation/metrics.json \
            --max-white-ratio 0.005 --max-white-blob 500
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 3 ]; then exit "$code"; fi
          echo "XZOGOT_NACHT_ZERO_SUN_METRICS_CAPTURED original_white_pixels=31460 current_guard_exit=$code"
      - name: Upload original-night render with zero sun correctly disabled
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nacht-Zero-Intensity-Source-Corrected-Render
          path: build/nacht-sky-ablation/
          retention-days: 14
          if-no-files-found: warn
