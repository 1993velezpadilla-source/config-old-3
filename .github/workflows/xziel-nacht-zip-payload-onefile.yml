name: XZIEL Nacht ZIP-Payload OneFile EXE

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/xziel-nacht-win64-exe-v1
    paths:
      - ".github/workflows/xziel-nacht-zip-payload-onefile.yml"

permissions:
  contents: read
  actions: read

jobs:
  onefile:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Download fresh GREEN Nacht VFS
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force input\vfs, input\runtime, dist | Out-Null
          gh run download 36642428359 --repo "$env:GITHUB_REPOSITORY" --name "XZIEL-Nacht-VFS-Complete" --dir input\vfs
          $vfs = Get-ChildItem input\vfs -Recurse -Filter xziel-nacht-vfs.zip | Select-Object -First 1
          if (-not $vfs) { throw "Fresh Nacht VFS artifact not found" }
          Copy-Item $vfs.FullName dist\xziel-nacht-vfs.zip
          Write-Host "FRESH_VFS_BYTES=$($vfs.Length)"

      - name: Download proven GREEN Win64 runtime
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          gh run download 36642195566 --repo "$env:GITHUB_REPOSITORY" --name "XZIEL-Nacht-Win64-Runtime" --dir input\runtime
          $exe = Get-ChildItem input\runtime -Recurse -Filter Xziel-Nacht.exe | Select-Object -First 1
          if (-not $exe) { throw "GREEN Xziel-Nacht.exe artifact not found" }
          Write-Host "GREEN_RUNTIME=$($exe.FullName) bytes=$($exe.Length)"

      - name: Validate complete Nacht ZIP before packaging
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $vfs = (Resolve-Path "dist\xziel-nacht-vfs.zip").Path
          $zip = [System.IO.Compression.ZipFile]::OpenRead($vfs)
          try {
            $entries = $zip.Entries
            $files = @($entries | Where-Object { $_.Name.Length -gt 0 })
            $meshes = @($entries | Where-Object { $_.FullName -match '^xziel/maps/xziel_nacht_bo3/meshes/[^/]+\.xzm$' })
            if ($meshes.Count -ne 492) { throw "Expected 492 meshes, got $($meshes.Count)" }
            $required = @(
              "xziel/maps/xziel_nacht_bo3/scene.xzsc",
              "xziel/maps/xziel_nacht_bo3/materials.xzmt",
              "xziel/maps/xziel_nacht_bo3/materials.xzpb",
              "xziel/maps/xziel_nacht_bo3/materials.xzmn",
              "xziel/maps/xziel_nacht_bo3/environment.xzen",
              "xziel/maps/xziel_nacht_bo3/fog.xzfg",
              "xziel/maps/xziel_nacht_bo3/reflection.xzrc",
              "xziel/maps/xziel_nacht_bo3/lightmaps.xzlt",
              "xziel/maps/xziel_nacht_bo3/lightmap-bindings.xzlb"
            )
            foreach ($name in $required) {
              if (-not ($entries | Where-Object FullName -eq $name)) { throw "Missing required VFS file: $name" }
            }
            $bytes = (Get-Item $vfs).Length
            $sha = (Get-FileHash $vfs -Algorithm SHA256).Hash.ToLowerInvariant()
            @(
              "XZIEL_NACHT_ZIP_PAYLOAD"
              "map=xziel_nacht_bo3"
              "vfs_files=$($files.Count)"
              "meshes=$($meshes.Count)"
              "expected_instances=10791"
              "vfs_bytes=$bytes"
              "vfs_sha256=$sha"
            ) | Set-Content dist\pack-report.txt
            Write-Host "XZIEL_NACHT_VFS_GATE_GREEN files=$($files.Count) meshes=$($meshes.Count) bytes=$bytes sha256=$sha"
          } finally { $zip.Dispose() }

      - name: Install 7-Zip and NSIS
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install 7zip nsis -y --no-progress

          $seven = @("C:\Program Files\7-Zip\7z.exe","C:\Program Files (x86)\7-Zip\7z.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          $sevenDll = @("C:\Program Files\7-Zip\7z.dll","C:\Program Files (x86)\7-Zip\7z.dll") | Where-Object { Test-Path $_ } | Select-Object -First 1
          $makensis = @("C:\Program Files (x86)\NSIS\makensis.exe","C:\Program Files\NSIS\makensis.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $seven) { throw "7z.exe not found" }
          if (-not $sevenDll) { throw "7z.dll not found" }
          if (-not $makensis) { throw "makensis.exe not found" }

          "SEVENZIP=$seven" | Out-File -FilePath $env:GITHUB_ENV -Append
          "SEVENZIP_DLL=$sevenDll" | Out-File -FilePath $env:GITHUB_ENV -Append
          "MAKENSIS=$makensis" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Stage tiny launcher plus compressed complete VFS
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force dist\onefile\launcher | Out-Null

          $runtimeDir = (Get-ChildItem input\runtime -Recurse -Filter Xziel-Nacht.exe | Select-Object -First 1).Directory.FullName
          Copy-Item "$runtimeDir\Xziel-Nacht.exe" dist\onefile\launcher\
          foreach ($dll in @("SDL2.dll","libEGL.dll","libGLESv2.dll","libgcc_s_seh-1.dll","libwinpthread-1.dll")) {
            $p = Join-Path $runtimeDir $dll
            if (Test-Path $p) { Copy-Item $p dist\onefile\launcher\ }
          }

          Copy-Item "$env:SEVENZIP" dist\onefile\launcher\7z.exe
          Copy-Item "$env:SEVENZIP_DLL" dist\onefile\launcher\7z.dll

          foreach ($required in @("Xziel-Nacht.exe","SDL2.dll","libEGL.dll","libGLESv2.dll","7z.exe","7z.dll")) {
            if (-not (Test-Path "dist\onefile\launcher\$required")) { throw "Launcher file missing: $required" }
          }

          $launcherBytes = (Get-ChildItem dist\onefile\launcher -File | Measure-Object Length -Sum).Sum
          "launcher_bytes=$launcherBytes" | Add-Content dist\pack-report.txt
          Write-Host "XZIEL_NACHT_LAUNCHER_GREEN bytes=$launcherBytes"

      - name: Build one EXE with ZIP payload and autorun
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $nsi = @'
          Unicode true
          Name "XZIEL Nacht"
          OutFile "Nacht-Chronicles-XZIEL.exe"
          RequestExecutionLevel user
          SilentInstall silent
          AutoCloseWindow true
          SetCompress off
          SetDatablockOptimize off
          CRCCheck force
          ShowInstDetails nevershow

          Section "Run XZIEL Nacht"
            InitPluginsDir
            SetOutPath "$PLUGINSDIR\game"
            File /r "launcher\*.*"
            File /oname=xziel-nacht-vfs.zip "..\xziel-nacht-vfs.zip"

            ExecWait '"$PLUGINSDIR\game\7z.exe" x -y "$PLUGINSDIR\game\xziel-nacht-vfs.zip" -o"$PLUGINSDIR\game"' $0
            IntCmp $0 0 extract_ok extract_fail extract_fail

          extract_fail:
            SetErrorLevel $0
            Quit

          extract_ok:
            Delete "$PLUGINSDIR\game\xziel-nacht-vfs.zip"
            IfFileExists "$PLUGINSDIR\game\xziel\maps\xziel_nacht_bo3\scene.xzsc" scene_ok scene_fail

          scene_fail:
            SetErrorLevel 94
            Quit

          scene_ok:
            ExecWait '"$PLUGINSDIR\game\Xziel-Nacht.exe" --xziel-root "$PLUGINSDIR\game" --xziel-map xziel_nacht_bo3' $1
            SetErrorLevel $1
          SectionEnd
          '@

          $nsi | Set-Content dist\onefile\nacht-onefile.nsi -Encoding UTF8

          Push-Location dist\onefile
          try {
            & "$env:MAKENSIS" "nacht-onefile.nsi"
            if ($LASTEXITCODE -ne 0) { throw "makensis failed: $LASTEXITCODE" }
          } finally { Pop-Location }

          $exe = Get-Item dist\onefile\Nacht-Chronicles-XZIEL.exe
          if ($exe.Length -lt 800MB) { throw "One-file EXE unexpectedly small: $($exe.Length)" }

          $sha = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  Nacht-Chronicles-XZIEL.exe" | Set-Content dist\onefile\Nacht-Chronicles-XZIEL.exe.sha256
          "onefile_exe_bytes=$($exe.Length)" | Add-Content dist\pack-report.txt
          "onefile_exe_sha256=$sha" | Add-Content dist\pack-report.txt

          Write-Host "XZIEL_NACHT_ONEFILE_ZIP_PAYLOAD_GREEN bytes=$($exe.Length) sha256=$sha"

      - name: Upload finished Nacht executable
        uses: actions/upload-artifact@v4
        with:
          name: XZIEL-Nacht-Windows-OneFile-ZIP-Payload
          path: |
            dist/onefile/Nacht-Chronicles-XZIEL.exe
            dist/onefile/Nacht-Chronicles-XZIEL.exe.sha256
            dist/pack-report.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
