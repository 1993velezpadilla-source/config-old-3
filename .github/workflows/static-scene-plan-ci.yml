name: XZIEL Static Scene Draw Plan CI

on:
  workflow_dispatch:
  push:
    branches:
      - feature/xziel-nacht-static-renderer-v1
      - feature/xziel-engine-nacht-runtime-v1
    paths:
      - "engine/xz/xz_static_scene_plan.*"
      - "tests/xz_static_scene_plan_test.c"
      - "tools/maps/compile_nacht_xzscene.py"
      - ".github/workflows/static-scene-plan-ci.yml"

permissions:
  contents: read

jobs:
  draw-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - name: Compile real Nacht XZSC
        run: |
          set -euo pipefail
          mkdir -p /tmp/xziel-static-plan
          python3 tools/maps/compile_nacht_xzscene.py \
            --output /tmp/xziel-static-plan/nacht.xzsc

      - name: Build and validate static draw plan
        run: |
          set -euo pipefail
          cc -std=c99 -O2 -Wall -Wextra -Werror \
            -Iengine/xz \
            tests/xz_static_scene_plan_test.c \
            engine/xz/xz_xzscene.c \
            engine/xz/xz_static_scene_plan.c \
            -lm \
            -o /tmp/xz_static_scene_plan_test

          /tmp/xz_static_scene_plan_test \
            /tmp/xziel-static-plan/nacht.xzsc
