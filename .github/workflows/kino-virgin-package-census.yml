name: XZIEL Kino Virgin Package Census

on:
  workflow_dispatch:
  push:
    branches:
      - feature/xziel-bo3-style-map-loader-v1
    paths:
      - .github/workflows/kino-virgin-package-census.yml
      - tools/maps/audit_virgin_ue_package.py
      - tools/maps/UEAssetClassCensus/**
      - tools/maps/UEAssetPropertyProbe/**
      - tools/maps/UEAssetPropertySweep/**
      - engine/xz/xz_xzmesh.h
      - engine/xz/xz_xzmesh.c
      - tools/maps/xz_xzmesh_file_gate.c
      - tools/maps/UEStaticMeshXZMS/**
      - engine/xz/xz_xztexture.h
      - engine/xz/xz_xztexture.c
      - tools/maps/xz_xztexture_selftest.c
      - tools/maps/xz_xztexture_file_gate.c
      - tools/maps/UETextureXZTX/**
      - tools/maps/UEStaticMeshAudit/**
      - tools/maps/UEDeepPayloadAudit/**
      - tools/maps/patch_cue4parse_animation_fallback.py
      - tools/maps/UESceneTransformAudit/**
      - tools/maps/UEAssetSourceManifest/**
      - tools/maps/xz_source_class_gate.c
      - tools/maps/xz_source_adapter_blocker_gate.c
      - engine/xz/xz_source_adapter_registry.c
      - engine/xz/xz_source_adapter_registry.h
      - engine/xz/xz_source_class_registry.c
      - engine/xz/xz_source_class_registry.h
      - tools/maps/audit_ue_class_requirements.py

jobs:
  kino-census:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout XZIEL Engine
        uses: actions/checkout@v4

      - name: Install archive tools and repak
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y p7zip-full unzip jq
          mkdir -p "$RUNNER_TEMP/repak"
          curl -fL --retry 5 \
            https://github.com/trumank/repak/releases/download/v0.2.3/repak_cli-x86_64-unknown-linux-gnu.tar.xz \
            -o "$RUNNER_TEMP/repak.tar.xz"
          tar -xJf "$RUNNER_TEMP/repak.tar.xz" \
            -C "$RUNNER_TEMP/repak"
          REPAK=$(find "$RUNNER_TEMP/repak" \
            -type f -name 'repak*' -perm -111 | head -1)
          test -n "$REPAK"
          echo "REPAK=$REPAK" >> "$GITHUB_ENV"

      - name: Download public Kino Der Toten CODz v109
        run: |
          set -euxo pipefail
          mkdir -p kino-download
          curl -fL --retry 8 --retry-delay 3 --retry-all-errors \
            -o kino-download/kino-v109.zip \
            "https://g-3959.modapi.io/v1/games/3959/mods/2809826/files/5245723/download"
          test -s kino-download/kino-v109.zip
          sha256sum kino-download/kino-v109.zip | tee kino-download/sha256.txt
          ls -lh kino-download/kino-v109.zip

      - name: Inventory archive without assumptions
        run: |
          set -euxo pipefail
          7z l -slt kino-download/kino-v109.zip > kino-download/archive-list.txt
          python3 tools/maps/audit_virgin_ue_package.py \
            --archive kino-download/kino-v109.zip \
            --report kino-download/kino-census.json
          cat kino-download/kino-census.json

      - name: Extract package
        run: |
          set -euxo pipefail
          mkdir -p kino-unpacked
          7z x -y kino-download/kino-v109.zip -okino-unpacked >/dev/null
          du -sh kino-unpacked
          find kino-unpacked -type f | sort > kino-download/extracted-files.txt
          echo "files=$(wc -l < kino-download/extracted-files.txt)"

      - name: Unpack inner Unreal pak generically
        run: |
          set -euxo pipefail
          PAK=$(find kino-unpacked -type f -name '*.pak' -print -quit)
          test -n "$PAK"
          mkdir -p kino-pak-unpacked
          "$REPAK" unpack "$PAK" -o kino-pak-unpacked
          find kino-pak-unpacked -type f | sort > kino-download/pak-files.txt
          echo "pakFiles=$(wc -l < kino-download/pak-files.txt)"
          du -sh kino-pak-unpacked

      - name: Census Unreal package payload
        run: |
          set -euxo pipefail
          python3 tools/maps/audit_virgin_ue_package.py \
            --root kino-pak-unpacked \
            --report kino-download/kino-pak-census.json
          cat kino-download/kino-pak-census.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path("kino-download/kino-pak-census.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          assert data["fileCount"] > 100
          assert data["uassetCount"] > 0
          assert len(data["mapFiles"]) > 0
          print("XZIEL_KINO_INNER_PAK_CENSUS_GREEN", {
              "files": data["fileCount"],
              "uassets": data["uassetCount"],
              "maps": len(data["mapFiles"]),
              "audio": data["audioFileCount"],
              "localization": data["localizationFileCount"],
          })
          PY

      - name: Census real Unreal export classes
        run: |
          set -euxo pipefail
          mkdir -p kino-download/class-shards

          dotnet restore \
            tools/maps/UEAssetClassCensus/UEAssetClassCensus.csproj

          dotnet build \
            tools/maps/UEAssetClassCensus/UEAssetClassCensus.csproj \
            --configuration Release \
            --no-restore

          APP="tools/maps/UEAssetClassCensus/bin/Release/net10.0/UEAssetClassCensus.dll"
          test -s "$APP"

          SHARDS=64

          python3 - <<'PY'
          from pathlib import Path
          import os

          source = Path("kino-pak-unpacked").resolve()
          out = Path("kino-shards").resolve()
          out.mkdir(parents=True, exist_ok=True)

          packages = sorted(
              [
                  p for p in source.rglob("*")
                  if p.is_file() and p.suffix.lower() in {".uasset", ".umap"}
              ],
              key=lambda p: p.relative_to(source).as_posix().lower(),
          )

          shards = 64
          companion_exts = [".uasset", ".umap", ".uexp", ".ubulk"]

          for index, package in enumerate(packages):
              shard = index % shards
              rel = package.relative_to(source)
              base = package.with_suffix("")
              shard_root = out / f"shard-{shard}"
              shard_root.mkdir(parents=True, exist_ok=True)

              for ext in companion_exts:
                  candidate = Path(str(base) + ext)
                  if not candidate.is_file():
                      continue
                  candidate_rel = candidate.relative_to(source)
                  target = shard_root / candidate_rel
                  target.parent.mkdir(parents=True, exist_ok=True)
                  if not target.exists():
                      os.symlink(candidate, target)

          counts = []
          for i in range(shards):
              root = out / f"shard-{i}"
              count = sum(
                  1 for p in root.rglob("*")
                  if p.is_file() or p.is_symlink()
              ) if root.exists() else 0
              counts.append(count)

          assert min(counts) > 0, counts
          print("XZIEL_KINO_PHYSICAL_SHARDS_GREEN", {
              "packages": len(packages),
              "shards": shards,
              "minFiles": min(counts),
              "maxFiles": max(counts),
              "totalLinkedFiles": sum(counts),
          })
          PY

          for i in $(seq 0 $((SHARDS - 1))); do
            echo "XZIEL_KINO_CLASS_SHARD_START $i/$SHARDS"
            dotnet "$APP" \
              "kino-shards/shard-$i" \
              "kino-download/class-shards/shard-$i.json" \
              ue5.1 \
              | tee "kino-download/class-shards/shard-$i.log"
            test -s "kino-download/class-shards/shard-$i.json"
            echo "XZIEL_KINO_CLASS_SHARD_GREEN $i/$SHARDS"
          done

          python3 - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          root = Path("kino-download/class-shards")
          reports = [
              json.loads(p.read_text(encoding="utf-8"))
              for p in sorted(
                  root.glob("shard-*.json"),
                  key=lambda p: int(p.stem.split("-")[1]),
              )
          ]
          assert len(reports) == 64, len(reports)

          classes = Counter()
          package_exts = Counter()
          failures = []
          packages = []
          for r in reports:
              classes.update(r["classCounts"])
              package_exts.update(r["packageExtensionCounts"])
              failures.extend(r["packageLoadFailures"])
              packages.extend(r["packages"])

          out = {
              "schemaVersion": 1,
              "shardCount": 64,
              "packageCount": sum(r["packageCount"] for r in reports),
              "packagesLoaded": sum(r["packagesLoaded"] for r in reports),
              "packageLoadFailureCount": len(failures),
              "totalExports": sum(r["totalExports"] for r in reports),
              "uniqueExportClassCount": len(classes),
              "packageExtensionCounts": dict(sorted(package_exts.items())),
              "classCounts": dict(sorted(classes.items())),
              "packageLoadFailures": failures,
              "packages": packages,
          }
          Path("kino-download/kino-class-census.json").write_text(
              json.dumps(out, indent=2, sort_keys=True),
              encoding="utf-8",
          )
          print("XZIEL_KINO_CLASS_CENSUS_MERGED", {
              "packages": out["packageCount"],
              "loaded": out["packagesLoaded"],
              "failures": out["packageLoadFailureCount"],
              "exports": out["totalExports"],
              "classes": out["uniqueExportClassCount"],
          })
          for name, count in classes.most_common(100):
              print("XZIEL_KINO_CLASS", count, name)

          if out["packageLoadFailureCount"] != 0:
              print("XZIEL_KINO_CLASS_CENSUS_FAILURES",
                    out["packageLoadFailureCount"])
              for row in failures[:100]:
                  print("XZIEL_KINO_CLASS_FAILURE", row)
              raise SystemExit(5)
          PY

          cat kino-download/class-shards/shard-*.log \
            > kino-download/kino-class-census.log
          test -s kino-download/kino-class-census.json

      - name: Audit every source class against XZIEL readiness
        run: |
          set -euxo pipefail
          python3 tools/maps/audit_ue_class_requirements.py \
            --input kino-download/kino-class-census.json \
            --output kino-download/kino-class-requirements.json
          test -s kino-download/kino-class-requirements.json

      - name: Pin Pavlov UE5 property mappings
        run: |
          set -euxo pipefail
          curl -fL --retry 5 --retry-delay 2 \
            -o kino-download/PavMappings.usmap \
            "https://raw.githubusercontent.com/THW-Reaper/PavlovVRMappings/4976647b4f3a209042460bc55a7a3122662d05b7/PavMappings.usmap"
          test -s kino-download/PavMappings.usmap
          echo "6d19f9731cc3fbaba34ca8e0833e81e4ffdf1b407edf24de48b1ccb5c63b060c  kino-download/PavMappings.usmap" \
            | tee kino-download/PavMappings.sha256 \
            | sha256sum -c -

      - name: Probe real UE5 unversioned properties
        run: |
          set -euxo pipefail
          dotnet restore \
            tools/maps/UEAssetPropertyProbe/UEAssetPropertyProbe.csproj

          dotnet build \
            tools/maps/UEAssetPropertyProbe/UEAssetPropertyProbe.csproj \
            --configuration Release \
            --no-restore

          APP="tools/maps/UEAssetPropertyProbe/bin/Release/net10.0/UEAssetPropertyProbe.dll"
          test -s "$APP"

          dotnet "$APP" \
            kino-pak-unpacked \
            kino-download/PavMappings.usmap \
            kino-download/kino-class-census.json \
            kino-download/kino-property-probe.json \
            ue5.1 \
            | tee kino-download/kino-property-probe.log

          test -s kino-download/kino-property-probe.json
          grep -q 'XZIEL_UE_PROPERTY_PROBE_GREEN' \
            kino-download/kino-property-probe.log

      - name: Sweep every UE5 package export with real mappings
        run: |
          set -euxo pipefail
          dotnet restore \
            tools/maps/UEAssetPropertySweep/UEAssetPropertySweep.csproj

          dotnet build \
            tools/maps/UEAssetPropertySweep/UEAssetPropertySweep.csproj \
            --configuration Release \
            --no-restore

          APP="tools/maps/UEAssetPropertySweep/bin/Release/net10.0/UEAssetPropertySweep.dll"
          test -s "$APP"

          mkdir -p kino-download/property-sweep-shards
          SHARDS=16

          for i in $(seq 0 $((SHARDS - 1))); do
            echo "XZIEL_KINO_PROPERTY_SWEEP_START $i/$SHARDS"
            dotnet "$APP" \
              kino-pak-unpacked \
              kino-download/PavMappings.usmap \
              kino-download/kino-class-census.json \
              "kino-download/property-sweep-shards/shard-$i.json" \
              "$i" "$SHARDS" ue5.1 \
              | tee "kino-download/property-sweep-shards/shard-$i.log"
            test -s "kino-download/property-sweep-shards/shard-$i.json"
            echo "XZIEL_KINO_PROPERTY_SWEEP_DONE $i/$SHARDS"
          done

          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("kino-download/property-sweep-shards")
          reports = [
              json.loads(p.read_text(encoding="utf-8"))
              for p in sorted(
                  root.glob("shard-*.json"),
                  key=lambda p: int(p.stem.split("-")[1]),
              )
          ]
          assert len(reports) == 16, len(reports)

          census = json.loads(
              Path("kino-download/kino-class-census.json")
              .read_text(encoding="utf-8")
          )

          package_failures = []
          export_failures = []
          for report in reports:
              package_failures.extend(report["packageLoadFailures"])
              export_failures.extend(report["exportLoadFailures"])

          out = {
              "schemaVersion": 1,
              "shardCount": 16,
              "packageCount": sum(r["packageCount"] for r in reports),
              "packageSuccesses": sum(r["packageSuccesses"] for r in reports),
              "packageLoadFailureCount": len(package_failures),
              "exportsAttempted": sum(r["exportsAttempted"] for r in reports),
              "exportSuccesses": sum(r["exportSuccesses"] for r in reports),
              "exportLoadFailureCount": len(export_failures),
              "exportsWithProperties": sum(r["exportsWithProperties"] for r in reports),
              "propertyTagCount": sum(r["propertyTagCount"] for r in reports),
              "generatedExports": sum(r["generatedExports"] for r in reports),
              "generatedExportsWithProperties": sum(
                  r["generatedExportsWithProperties"] for r in reports
              ),
              "packageLoadFailures": package_failures,
              "exportLoadFailures": export_failures,
          }

          assert out["packageCount"] == census["packageCount"], (
              out["packageCount"],
              census["packageCount"],
          )
          assert out["packageSuccesses"] == census["packageCount"], (
              out["packageSuccesses"],
              census["packageCount"],
          )
          assert out["exportsAttempted"] == census["totalExports"], (
              out["exportsAttempted"],
              census["totalExports"],
          )
          assert out["exportSuccesses"] == census["totalExports"], (
              out["exportSuccesses"],
              census["totalExports"],
          )

          mapping_type_counts = {r["mappingTypes"] for r in reports}
          mapping_enum_counts = {r["mappingEnums"] for r in reports}
          assert len(mapping_type_counts) == 1, mapping_type_counts
          assert len(mapping_enum_counts) == 1, mapping_enum_counts
          assert next(iter(mapping_type_counts)) > 100
          assert next(iter(mapping_enum_counts)) > 0

          out["mappingTypes"] = next(iter(mapping_type_counts))
          out["mappingEnums"] = next(iter(mapping_enum_counts))

          Path("kino-download/kino-property-sweep.json").write_text(
              json.dumps(out, indent=2, sort_keys=True),
              encoding="utf-8",
          )

          print("XZIEL_KINO_PROPERTY_SWEEP_MERGED", {
              "packages": out["packageCount"],
              "packageFailures": out["packageLoadFailureCount"],
              "exportsAttempted": out["exportsAttempted"],
              "exports": out["exportSuccesses"],
              "exportFailures": out["exportLoadFailureCount"],
              "exportsWithProperties": out["exportsWithProperties"],
              "propertyTags": out["propertyTagCount"],
              "generatedExports": out["generatedExports"],
              "generatedWithProperties": out["generatedExportsWithProperties"],
          })

          if out["packageLoadFailureCount"] or out["exportLoadFailureCount"]:
              for row in package_failures[:100]:
                  print("XZIEL_KINO_PROPERTY_PACKAGE_FAILURE", row)
              for row in export_failures[:200]:
                  print("XZIEL_KINO_PROPERTY_EXPORT_FAILURE", row)
              raise SystemExit(5)

          print("XZIEL_KINO_PROPERTY_SWEEP_GREEN")
          PY

      - name: Prepare pinned CUE4Parse animation fallback
        run: |
          set -euxo pipefail
          CUE4PARSE_ROOT="$RUNNER_TEMP/CUE4Parse"
          git init "$CUE4PARSE_ROOT"
          git -C "$CUE4PARSE_ROOT" remote add origin \
            https://github.com/FabianFG/CUE4Parse.git
          git -C "$CUE4PARSE_ROOT" fetch --depth=1 origin \
            28f385e622468c4ab84997d596b46bb1c3adfcfa
          git -C "$CUE4PARSE_ROOT" checkout --detach FETCH_HEAD
          test "$(git -C "$CUE4PARSE_ROOT" rev-parse HEAD)" = \
            "28f385e622468c4ab84997d596b46bb1c3adfcfa"
          python3 tools/maps/patch_cue4parse_animation_fallback.py \
            --root "$CUE4PARSE_ROOT"
          echo "CUE4PARSE_SOURCE_ROOT=$CUE4PARSE_ROOT" >> "$GITHUB_ENV"

      - name: Layer pinned public Pavlov base dependencies
        run: |
          set -euxo pipefail
          MODKIT_COMMIT="612c8d43c3dba7701b8de63e373e13487917b985"
          HAND_BLOB_SHA="178d724fcd113eeda970762e96d01d38e938e957"
          TARGET="kino-pak-unpacked/Pavlov/Content/Hands/Mesh/SK_Hand_Skeleton.uasset"

          mkdir -p "$(dirname "$TARGET")"
          curl -fL --retry 5 \
            "https://raw.githubusercontent.com/vankruptgames/PavlovVR-ModKit/$MODKIT_COMMIT/Content/Hands/Mesh/SK_Hand_Skeleton.uasset" \
            -o "$TARGET"

          test -s "$TARGET"
          test "$(git hash-object "$TARGET")" = "$HAND_BLOB_SHA"

          echo "XZIEL_PAVLOV_BASE_HAND_SKELETON_GREEN"

      - name: Audit deep cooked UE payloads
        run: |
          set -euxo pipefail
          dotnet restore tools/maps/UEDeepPayloadAudit/UEDeepPayloadAudit.csproj \
            -p:CUE4ParseSourceRoot="$CUE4PARSE_SOURCE_ROOT" \
            -p:CUE4PARSE_SKIP_NATIVE=true
          dotnet build tools/maps/UEDeepPayloadAudit/UEDeepPayloadAudit.csproj \
            --configuration Release \
            --no-restore \
            -p:CUE4ParseSourceRoot="$CUE4PARSE_SOURCE_ROOT" \
            -p:CUE4PARSE_SKIP_NATIVE=true

          APP="tools/maps/UEDeepPayloadAudit/bin/Release/net10.0/UEDeepPayloadAudit.dll"
          test -s "$APP"

          mkdir -p kino-download/deep-payload-shards
          SHARDS=16
          for i in $(seq 0 $((SHARDS - 1))); do
            echo "XZIEL_KINO_DEEP_PAYLOAD_START $i/$SHARDS"
            dotnet "$APP" \
              kino-pak-unpacked \
              kino-download/PavMappings.usmap \
              kino-download/kino-class-census.json \
              "kino-download/deep-payload-shards/shard-$i.json" \
              "$i" "$SHARDS" ue5.1 \
              | tee "kino-download/deep-payload-shards/shard-$i.log"
            test -s "kino-download/deep-payload-shards/shard-$i.json"
            echo "XZIEL_KINO_DEEP_PAYLOAD_DONE $i/$SHARDS"
          done

          python3 - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          root = Path("kino-download/deep-payload-shards")
          reports = [
              json.loads(p.read_text(encoding="utf-8"))
              for p in sorted(
                  root.glob("shard-*.json"),
                  key=lambda p: int(p.stem.split("-")[1]),
              )
          ]
          assert len(reports) == 16, len(reports)

          census = json.loads(
              Path("kino-download/kino-class-census.json").read_text(
                  encoding="utf-8"
              )
          )

          classes = census["classCounts"]
          expected_textures = sum(
              count
              for name, count in classes.items()
              if name.endswith("Texture2D")
          )
          expected_audio = classes.get("SoundWave", 0)
          expected_skeletal = classes.get("SkeletalMesh", 0)
          expected_anims = classes.get("AnimSequence", 0)

          texture_formats = Counter()
          audio_formats = Counter()
          failures = []
          for report in reports:
              texture_formats.update(report["textureFormats"])
              audio_formats.update(report["audioFormats"])
              failures.extend(report["failures"])

          out = {
              "schemaVersion": 1,
              "shardCount": 16,
              "packageCount": sum(r["packageCount"] for r in reports),
              "packagesLoaded": sum(r["packagesLoaded"] for r in reports),
              "expectedTextures": sum(r["expectedTextures"] for r in reports),
              "texturesDecoded": sum(r["texturesDecoded"] for r in reports),
              "textureMips": sum(r["textureMips"] for r in reports),
              "textureBytes": sum(r["textureBytes"] for r in reports),
              "textureFormats": dict(sorted(texture_formats.items())),
              "maxTextureWidth": max(r["maxTextureWidth"] for r in reports),
              "maxTextureHeight": max(r["maxTextureHeight"] for r in reports),
              "expectedSoundWaves": sum(r["expectedSoundWaves"] for r in reports),
              "soundWavesDecoded": sum(r["soundWavesDecoded"] for r in reports),
              "audioBytes": sum(r["audioBytes"] for r in reports),
              "audioFormats": dict(sorted(audio_formats.items())),
              "expectedSkeletalMeshes": sum(r["expectedSkeletalMeshes"] for r in reports),
              "skeletalMeshesDecoded": sum(r["skeletalMeshesDecoded"] for r in reports),
              "skeletalBones": sum(r["skeletalBones"] for r in reports),
              "skeletalVertices": sum(r["skeletalVertices"] for r in reports),
              "skeletalIndices": sum(r["skeletalIndices"] for r in reports),
              "skeletalTriangles": sum(r["skeletalTriangles"] for r in reports),
              "maxSkeletalUvChannels": max(r["maxSkeletalUvChannels"] for r in reports),
              "expectedAnimSequences": sum(r["expectedAnimSequences"] for r in reports),
              "animSequencesDecoded": sum(r["animSequencesDecoded"] for r in reports),
              "animationFrames": sum(r["animationFrames"] for r in reports),
              "animationTracks": sum(r["animationTracks"] for r in reports),
              "animationPositionKeys": sum(r["animationPositionKeys"] for r in reports),
              "animationRotationKeys": sum(r["animationRotationKeys"] for r in reports),
              "animationScaleKeys": sum(r["animationScaleKeys"] for r in reports),
              "failureCount": len(failures),
              "failures": failures,
          }

          out["ready"] = (
              all(r["ready"] for r in reports)
              and out["expectedTextures"] == expected_textures
              and out["texturesDecoded"] == expected_textures
              and out["expectedSoundWaves"] == expected_audio
              and out["soundWavesDecoded"] == expected_audio
              and out["expectedSkeletalMeshes"] == expected_skeletal
              and out["skeletalMeshesDecoded"] == expected_skeletal
              and out["expectedAnimSequences"] == expected_anims
              and out["animSequencesDecoded"] == expected_anims
              and out["failureCount"] == 0
              and (expected_textures == 0 or (
                  out["textureMips"] > 0 and out["textureBytes"] > 0
              ))
              and (expected_audio == 0 or out["audioBytes"] > 0)
              and (expected_skeletal == 0 or (
                  out["skeletalBones"] > 0
                  and out["skeletalVertices"] > 0
                  and out["skeletalIndices"] > 0
              ))
              and (expected_anims == 0 or (
                  out["animationFrames"] > 0
                  and out["animationTracks"] > 0
                  and (
                      out["animationPositionKeys"]
                      + out["animationRotationKeys"]
                      + out["animationScaleKeys"]
                  ) > 0
              ))
          )

          Path("kino-download/kino-deep-payload-audit.json").write_text(
              json.dumps(out, indent=2, sort_keys=True),
              encoding="utf-8",
          )

          print("XZIEL_KINO_DEEP_PAYLOAD_AUDIT", {
              "textures": f'{out["texturesDecoded"]}/{expected_textures}',
              "textureMips": out["textureMips"],
              "textureBytes": out["textureBytes"],
