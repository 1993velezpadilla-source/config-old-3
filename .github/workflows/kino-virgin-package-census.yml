          done

          python3 - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          reports = [
              json.loads(p.read_text(encoding="utf-8"))
              for p in sorted(
                  Path("kino-download/scene-transform-shards").glob("shard-*.json"),
                  key=lambda p: int(p.stem.split("-")[1]),
              )
          ]
          assert len(reports) == 16, len(reports)

          census = json.loads(
              Path("kino-download/kino-class-census.json").read_text(
                  encoding="utf-8"
              )
          )

          types = Counter()
          failures = []
          for r in reports:
              assert r["ready"], r["shardIndex"]
              types.update(r["typeCounts"])
              failures.extend(r["failures"])

          out = {
              "schemaVersion": 1,
              "shardCount": 16,
              "packageCount": sum(r["packageCount"] for r in reports),
              "packagesLoaded": sum(r["packagesLoaded"] for r in reports),
              "failureCount": len(failures),
              "sceneComponents": sum(r["sceneComponents"] for r in reports),
              "attachedComponents": sum(r["attachedComponents"] for r in reports),
              "absoluteLocation": sum(r["absoluteLocation"] for r in reports),
              "absoluteRotation": sum(r["absoluteRotation"] for r in reports),
              "absoluteScale": sum(r["absoluteScale"] for r in reports),
              "anyAbsolute": sum(r["anyAbsolute"] for r in reports),
              "negativeScale": sum(r["negativeScale"] for r in reports),
              "zeroScale": sum(r["zeroScale"] for r in reports),
              "nonFiniteTransform": sum(r["nonFiniteTransform"] for r in reports),
              "typeCounts": dict(sorted(types.items())),
              "failures": failures,
          }
          out["ready"] = (
              out["packageCount"] == census["packageCount"]
              and out["packagesLoaded"] == census["packageCount"]
              and out["failureCount"] == 0
              and out["sceneComponents"] > 0
              and out["nonFiniteTransform"] == 0
          )

          Path("kino-download/kino-scene-transform-audit.json").write_text(
              json.dumps(out, indent=2, sort_keys=True),
              encoding="utf-8",
          )

          print("XZIEL_KINO_SCENE_TRANSFORM_AUDIT", {
              "packages": out["packageCount"],
              "sceneComponents": out["sceneComponents"],
              "attached": out["attachedComponents"],
              "absoluteLocation": out["absoluteLocation"],
              "absoluteRotation": out["absoluteRotation"],
              "absoluteScale": out["absoluteScale"],
              "anyAbsolute": out["anyAbsolute"],
              "negativeScale": out["negativeScale"],
              "zeroScale": out["zeroScale"],
              "nonFinite": out["nonFiniteTransform"],
              "ready": out["ready"],
          })
          if not out["ready"]:
              raise SystemExit(5)
          print("XZIEL_KINO_SCENE_TRANSFORM_AUDIT_GREEN")
