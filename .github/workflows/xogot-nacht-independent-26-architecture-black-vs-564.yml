name: Nacht Independent 26 Structural Material Black Fix versus 564 Unsafe MasterMat
on:
  workflow_dispatch:
  push:
    branches:
      - research/nacht-bo3-meridian-source-bridge-20261009
    paths:
      - ".github/workflows/xogot-nacht-independent-26-architecture-black-vs-564.yml"
      - "tools/maps/nacht_independent_architecture26_vs_master564_black_pixels.py"
permissions:
  contents: read
  actions: read
jobs:
  compare-three-original-godot-native-source-camera-images:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - name: Fail closed on old 564 all-master source sample; wait for 26 hard architecture source camera proof
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh run view 37993064837 --json conclusion --jq '.conclusion')" = success
          python3 -m py_compile tools/maps/nacht_independent_architecture26_vs_master564_black_pixels.py
          state=""
          for i in $(seq 1 100); do
            state="$(gh run view 37995469541 --json status --jq '.status')"
            if test "$state" = completed; then break; fi
            echo "Waiting for genuine 10793 source actor 26 hard-surface original Godot renderer $i/100"
            sleep 30
          done
          test "$state" = completed || { echo "RED: original source 26 surface candidate not completed"; exit 1; }
          test "$(gh run view 37995469541 --json conclusion --jq '.conclusion')" = success
          mkdir -p build/nacht-architecture-vs-master/structural build/nacht-architecture-vs-master/broad
          gh run download 37995469541 \
            -n Nacht-Original-26-Architecture-Building-Alpha-Only-7-PNG-Research \
            -D build/nacht-architecture-vs-master/structural
          gh run download 37993064837 \
            -n Nacht-Original-564-MasterMat-Opacity-Only-Reversible-3-Camera-7-PNG-Research \
            -D build/nacht-architecture-vs-master/broad
      - name: Compare original Godot PNG bytes independently, reject synthetic source or flat scene
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --user pillow --disable-pip-version-check
          python3 tools/maps/nacht_independent_architecture26_vs_master564_black_pixels.py \
            --architecture build/nacht-architecture-vs-master/structural \
            --all-masked build/nacht-architecture-vs-master/broad \
            --output build/nacht-architecture-vs-master/audited \
            2>&1 | tee build/nacht-architecture-vs-master/independent-source-materials.log
          grep -q XZOGOT_NACHT_SOURCE_ARCHITECTURE26_BLACK_FIX_INDEPENDENT_3_CAMERA_RGB_GREEN \
            build/nacht-architecture-vs-master/independent-source-materials.log
      - name: Preserve original source 3 view 26-architecture/broad 564 original contrast images even if RED
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nacht-Three-Original-Camera-26-Structural-Alpha-vs-564-Masked-Independent-PNG
          path: |
            build/nacht-architecture-vs-master/audited/
            build/nacht-architecture-vs-master/independent-source-materials.log
          retention-days: 14
          if-no-files-found: warn
