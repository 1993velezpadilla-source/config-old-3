name: Cathedral Blender Production

on:
  push:
    branches:
      - art/cathedral-production-models
    paths:
      - "tools/blender/build_cathedral_roster.py"
      - "tools/blender/cathedral_roster.json"
      - ".github/workflows/cathedral-production-models.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cathedral-production-models
  cancel-in-progress: true

jobs:
  build-production-roster:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Install Linux render dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y curl xz-utils unzip git libegl1 libgl1-mesa-dri libglx-mesa0 mesa-utils xvfb

      - name: Cache Blender 4.5.14 LTS
        id: cache-blender
        uses: actions/cache@v4
        with:
          path: /opt/blender-4.5.14
          key: blender-linux-x64-4.5.14

      - name: Install Blender 4.5.14 LTS
        if: steps.cache-blender.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 4 https://download.blender.org/release/Blender4.5/blender-4.5.14-linux-x64.tar.xz -o /tmp/blender.tar.xz
          sudo mkdir -p /opt/blender-4.5.14
          sudo tar -xJf /tmp/blender.tar.xz --strip-components=1 -C /opt/blender-4.5.14

      - name: Build and install MPFB2
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/mpfb2 /tmp/mpfb.zip
          git clone https://github.com/makehumancommunity/mpfb2.git /tmp/mpfb2
          git -C /tmp/mpfb2 checkout b58176c661a9680294eb75f127842cb8378e4974
          /opt/blender-4.5.14/blender --command extension build --source-dir /tmp/mpfb2/src/mpfb --output-filepath /tmp/mpfb.zip
          /opt/blender-4.5.14/blender --command extension install-file -r user_default -e /tmp/mpfb.zip

      - name: Cache MakeHuman CC0 system assets
        id: cache-mhassets
        uses: actions/cache@v4
        with:
          path: /tmp/mhassets
          key: makehuman-system-assets-cc0-v2026

      - name: Download MakeHuman CC0 system assets
        if: steps.cache-mhassets.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/mhassets
          mkdir -p /tmp/mhassets
          curl -fL --retry 4 https://files2.makehumancommunity.org/asset_packs/makehuman_system_assets/makehuman_system_assets_cc0.zip -o /tmp/makehuman_system_assets_cc0.zip
          unzip -q /tmp/makehuman_system_assets_cc0.zip -d /tmp/mhassets

      - name: Build Sister of Ash
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euxo pipefail
          mkdir -p assets/generated/cathedral_roster
          rm -rf assets/generated/cathedral_roster/sister_of_ash
          rm -f assets/generated/cathedral_roster/roster_build_summary.json
          xvfb-run -a -s "-screen 0 1280x1024x24" /opt/blender-4.5.14/blender --background --python tools/blender/build_cathedral_roster.py -- --assets-root /tmp/mhassets --spec tools/blender/cathedral_roster.json --out-dir assets/generated/cathedral_roster --only sister_of_ash

      - name: Validate production outputs
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m json.tool assets/generated/cathedral_roster/roster_build_summary.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("assets/generated/cathedral_roster/roster_build_summary.json").read_text())
          if d.get("errors"):
              raise SystemExit(f"Blender character build errors: {d['errors']}")
          if "sister_of_ash" not in d.get("built",[]):
              raise SystemExit(f"Sister of Ash missing from built list: {d}")
          print("SISTER_OF_ASH_CLEAN_BUILD_OK")
          PY
          for id in sister_of_ash; do
            test -s "assets/generated/cathedral_roster/$id/model.blend"
            test -s "assets/generated/cathedral_roster/$id/model.glb"
            test -s "assets/generated/cathedral_roster/$id/model.fbx"
            test -s "assets/generated/cathedral_roster/$id/preview.png"
            test -s "assets/generated/cathedral_roster/$id/preview_side.png"
            test -s "assets/generated/cathedral_roster/$id/preview_back.png"
            test -s "assets/generated/cathedral_roster/$id/preview_face.png"
            test -s "assets/generated/cathedral_roster/$id/manifest.json"
          done

      - name: Commit generated Blender assets and pass source to GitHub
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "cathedral-blender-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f assets/generated/cathedral_roster tools/blender/build_cathedral_roster.py
          if git diff --cached --quiet; then
            echo "No generated asset changes."
          else
            git commit -m "art: generate Sister of Ash fidelity pass 37 clean source"
            git pull --rebase origin art/cathedral-production-models
            git push origin HEAD:art/cathedral-production-models
          fi

      - name: Upload full production artifact
        uses: actions/upload-artifact@v4
        with:
          name: cathedral-sister-of-ash-pass37
          path: assets/generated/cathedral_roster/
          if-no-files-found: error
          retention-days: 14
