name: Decode Aether Full Real Fire Audio

on:
  workflow_dispatch:
  push:
    branches:
      - feature/church-expansion-v1
    paths:
      - ".github/workflows/xogot-aether-full-fire-audio.yml"

permissions:
  contents: write

concurrency:
  group: xogot-aether-full-fire-audio
  cancel-in-progress: true

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: Download Project Aether
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aether-download"
          npx --yes itchio-downloader             --url "https://verrial.itch.io/projectaether"             --downloadDirectory "$RUNNER_TEMP/aether-download"
          FILE=$(find "$RUNNER_TEMP/aether-download" -type f -name '*.zip' -printf '%s\t%p\n' | sort -nr | head -1 | cut -f2-)
          test -s "$FILE"
          echo "PAYLOAD=$FILE" >> "$GITHUB_ENV"

      - name: Prepare legacy Aether pak
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aether-paks"
          7z x -y "$PAYLOAD" 'ProjectAether/Content/Paks/*' -o"$RUNNER_TEMP/aether-paks" >/dev/null
          PAKDIR="$RUNNER_TEMP/aether-paks/ProjectAether/Content/Paks"
          curl -fL --retry 5             https://github.com/trumank/retoc/releases/download/v0.1.5/retoc_cli-x86_64-unknown-linux-gnu.tar.xz             -o "$RUNNER_TEMP/retoc.tar.xz"
          mkdir -p "$RUNNER_TEMP/retoc"
          tar -xJf "$RUNNER_TEMP/retoc.tar.xz" -C "$RUNNER_TEMP/retoc"
          RETOC=$(find "$RUNNER_TEMP/retoc" -type f -name 'retoc*' -perm -111 | head -1)
          curl -fL --retry 5             https://github.com/trumank/repak/releases/download/v0.2.3/repak_cli-x86_64-unknown-linux-gnu.tar.xz             -o "$RUNNER_TEMP/repak.tar.xz"
          mkdir -p "$RUNNER_TEMP/repak"
          tar -xJf "$RUNNER_TEMP/repak.tar.xz" -C "$RUNNER_TEMP/repak"
          REPAK=$(find "$RUNNER_TEMP/repak" -type f -name 'repak*' -perm -111 | head -1)
          test -x "$RETOC" && test -x "$REPAK"
          "$RETOC" to-legacy "$PAKDIR" "$RUNNER_TEMP/aether-legacy.pak"
          test -s "$RUNNER_TEMP/aether-legacy.pak"
          echo "REPAK=$REPAK" >> "$GITHUB_ENV"

      - name: Extract exact real fire sound payloads
        shell: bash
        run: |
          set -euo pipefail
          rm -rf fire-raw
          mkdir -p fire-raw
          cat > "$RUNNER_TEMP/fire-stems.txt" <<'EOF'
          wpn_colt1911_st_f
          wpn_357_st_shot
          wpn_arisaka_st_f
          wpn_bar_st_f
          wpn_30cal_st_f
          wpn_dbshot_st_f
          wpn_dp28_st_f
          wpn_fg42_st_f
          wpn_g43_st_f
          wpn_kar98_st_f
          wpn_m1carbine_st_f
          wpn_m1garand_st_f
          wpn_mosin_st_f
          wpn_mp40_st_f
          wpn_nambu_st_f
          wpn_ppsh_st_f
          wpn_ptrs_st_shot
          wpn_dbsawshot_st_f
          wpn_springfield_st_f
          wpn_mp44_st_f
          wpn_svt40_st_f
          wpn_thompson_st_f
          wpn_shtgun_st_f
          wpn_tt33_st_f
          wpn_type100_st_f
          wpn_type99_st_f
          wpn_p38_st_f
          wpn_ray_st_f
          ThundergunFire
          EOF

          args=()
          while IFS= read -r stem; do
            [[ -n "$stem" ]] || continue
            args+=(-i "ProjectAether/Content/Assets/Sounds/Base/$stem.*")
          done < "$RUNNER_TEMP/fire-stems.txt"
          "$REPAK" unpack "$RUNNER_TEMP/aether-legacy.pak" -o fire-raw "${args[@]}" --force
          find fire-raw -type f | sort > fire-raw-files.txt
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path("fire-raw")
          stems=[x.strip() for x in Path("/tmp/fire-stems.txt").read_text().splitlines() if x.strip()] if Path("/tmp/fire-stems.txt").exists() else []
          # GitHub hosted runner temp differs; derive from extracted ubulk payload instead.
          ubulk=list(root.rglob("*.ubulk"))
          by={p.stem:p for p in ubulk}
          expected={
            "colt":"wpn_colt1911_st_f","357":"wpn_357_st_shot","arisaka":"wpn_arisaka_st_f",
            "bar":"wpn_bar_st_f","browning":"wpn_30cal_st_f","doublebarrel":"wpn_dbshot_st_f",
            "dp28":"wpn_dp28_st_f","fg42":"wpn_fg42_st_f","gewehr":"wpn_g43_st_f",
            "kar98k":"wpn_kar98_st_f","m1a1":"wpn_m1carbine_st_f","m1":"wpn_m1garand_st_f",
            "mosin":"wpn_mosin_st_f","mp40":"wpn_mp40_st_f","nambu":"wpn_nambu_st_f",
            "ppsh":"wpn_ppsh_st_f","ptrs":"wpn_ptrs_st_shot","sawnoff":"wpn_dbsawshot_st_f",
            "springfield":"wpn_springfield_st_f","stg":"wpn_mp44_st_f","svt40":"wpn_svt40_st_f",
            "thompson":"wpn_thompson_st_f","trench":"wpn_shtgun_st_f","tt33":"wpn_tt33_st_f",
            "type100":"wpn_type100_st_f","type99":"wpn_type99_st_f","walther":"wpn_p38_st_f",
            "ray":"wpn_ray_st_f","thundergun":"ThundergunFire",
          }
          missing=[]
          for wid,stem in expected.items():
              p=by.get(stem)
              if p is None:
                  missing.append(f"{wid}:{stem}")
                  continue
              for ext in (".uasset",".uexp",".ubulk"):
                  mate=p.with_suffix(ext)
                  if not mate.is_file():
                      missing.append(f"{wid}:{mate.name}")
          Path("fire-extract-report.json").write_text(json.dumps({
              "expected":expected,
              "ubulk_count":len(ubulk),
              "missing":missing,
          },indent=2)+"\n")
          print("XZOGOT_FULL_FIRE_RAW",len(ubulk),"missing",missing)
          if missing:
              raise SystemExit("Missing exact fire payloads: "+", ".join(missing))
          PY

      - name: Upload exact fire payloads
        uses: actions/upload-artifact@v4
        with:
          name: aether-full-real-fire-raw
          path: |
            fire-raw/**
            fire-extract-report.json
          if-no-files-found: error
          retention-days: 14

  decode:
    needs: extract
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout gameplay branch
        uses: actions/checkout@v5
        with:
          ref: feature/church-expansion-v1
          fetch-depth: 0

      - name: Download exact fire payloads
        uses: actions/download-artifact@v4
        with:
          name: aether-full-real-fire-raw
          path: fire-bundle

      - name: Install UE5 BINKA decoder
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git clone --depth 1 https://github.com/AbienteSadness/ue5-binka-to-wav.git "$env:RUNNER_TEMP\ue5-binka-to-wav"
          Invoke-WebRequest 'https://github.com/Keisawaakira/BinkadecWithWavHeader/releases/download/1.0.2/binkadec.zip' -OutFile "$env:RUNNER_TEMP\binkadec.zip"
          Expand-Archive "$env:RUNNER_TEMP\binkadec.zip" -DestinationPath "$env:RUNNER_TEMP\binkadec" -Force
          $decoder=Get-ChildItem "$env:RUNNER_TEMP\binkadec" -Filter 'binkadec.exe' -Recurse | Select-Object -First 1
          if (-not $decoder) { throw 'binkadec.exe missing' }
          "BINKADEC=$($decoder.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Decode 27 conventional plus Ray and Thundergun fire sounds
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $targets=@{
            'colt'='wpn_colt1911_st_f'; '357'='wpn_357_st_shot'; 'arisaka'='wpn_arisaka_st_f';
            'bar'='wpn_bar_st_f'; 'browning'='wpn_30cal_st_f'; 'doublebarrel'='wpn_dbshot_st_f';
            'dp28'='wpn_dp28_st_f'; 'fg42'='wpn_fg42_st_f'; 'gewehr'='wpn_g43_st_f';
            'kar98k'='wpn_kar98_st_f'; 'm1a1'='wpn_m1carbine_st_f'; 'm1'='wpn_m1garand_st_f';
            'mosin'='wpn_mosin_st_f'; 'mp40'='wpn_mp40_st_f'; 'nambu'='wpn_nambu_st_f';
            'ppsh'='wpn_ppsh_st_f'; 'ptrs'='wpn_ptrs_st_shot'; 'sawnoff'='wpn_dbsawshot_st_f';
            'springfield'='wpn_springfield_st_f'; 'stg'='wpn_mp44_st_f'; 'svt40'='wpn_svt40_st_f';
            'thompson'='wpn_thompson_st_f'; 'trench'='wpn_shtgun_st_f'; 'tt33'='wpn_tt33_st_f';
            'type100'='wpn_type100_st_f'; 'type99'='wpn_type99_st_f'; 'walther'='wpn_p38_st_f';
            'ray'='wpn_ray_st_f'; 'thundergun'='ThundergunFire'
          }
          $tool="$env:RUNNER_TEMP\ue5-binka-to-wav"
          $report=@()
          foreach($wid in $targets.Keys){
            $stem=$targets[$wid]
            $ubulk=Get-ChildItem "$PWD\fire-bundle" -Filter "$stem.ubulk" -Recurse | Select-Object -First 1
            if(-not $ubulk){ throw "Missing $wid $stem.ubulk" }
            $tmp="$env:RUNNER_TEMP\decoded-$wid"
            New-Item -ItemType Directory -Force -Path $tmp | Out-Null
            Push-Location $tool
            python 'binka2wav-cli.py' $ubulk.FullName -o $tmp --binkadec $env:BINKADEC
            if($LASTEXITCODE -ne 0){ throw "Decode failed: $wid" }
            Pop-Location
            $wav=Get-ChildItem $tmp -Filter '*.wav' -Recurse | Select-Object -First 1
            if(-not $wav -or $wav.Length -le 44){ throw "Invalid WAV: $wid" }
            $out=Join-Path $PWD "xogot\assets\audio\weapons\mapmod\$wid"
            New-Item -ItemType Directory -Force -Path $out | Out-Null
            Copy-Item $wav.FullName (Join-Path $out 'fire.wav') -Force
            $report += [PSCustomObject]@{weapon=$wid;stem=$stem;bytes=$wav.Length}
            Write-Host "XZOGOT_REAL_FIRE_READY $wid $stem $($wav.Length)"
          }
          $report | ConvertTo-Json -Depth 4 | Set-Content 'xogot/assets/audio/weapons/mapmod/full-fire-report.json' -Encoding utf8
          if($report.Count -ne 29){ throw "Expected 29 decoded fire sounds, got $($report.Count)" }
          Write-Host 'XZOGOT_29_REAL_FIRE_SOUNDS_GREEN'

      - name: Bind decoded fire WAVs to manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import json
          from pathlib import Path
          p=Path("xogot/assets/weapons/mapmod_weapon_asset_manifest.json")
          d=json.loads(p.read_text())
          report=json.loads(Path("xogot/assets/audio/weapons/mapmod/full-fire-report.json").read_text())
          changed=[]
          for row in report:
              wid=row["weapon"]
              if wid not in d["weapons"]:
                  continue
              d["weapons"][wid]["runtime"]["audio"]["fire"]=f"res://assets/audio/weapons/mapmod/{wid}/fire.wav"
              changed.append(wid)
          p.write_text(json.dumps(d,indent=2)+"\n")
          print("XZOGOT_FIRE_BINDINGS_UPDATED",len(changed),sorted(changed))
          '@ | Set-Content "$env:RUNNER_TEMP\bind.py" -Encoding utf8
          python "$env:RUNNER_TEMP\bind.py"

      - name: Validate decoded WAVs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import json,wave
          from pathlib import Path
          report=json.loads(Path("xogot/assets/audio/weapons/mapmod/full-fire-report.json").read_text())
          for row in report:
              p=Path(f"xogot/assets/audio/weapons/mapmod/{row['weapon']}/fire.wav")
              assert p.is_file() and p.stat().st_size>44,p
              with wave.open(str(p),"rb") as w:
                  assert w.getnframes()>100,(p,w.getnframes())
                  assert 8000<=w.getframerate()<=96000,(p,w.getframerate())
          print("XZOGOT_FULL_FIRE_WAV_VALIDATION_GREEN",len(report))
          '@ | Set-Content "$env:RUNNER_TEMP\validate.py" -Encoding utf8
          python "$env:RUNNER_TEMP\validate.py"

      - name: Commit decoded real fire audio
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add xogot/assets/audio/weapons/mapmod xogot/assets/weapons/mapmod_weapon_asset_manifest.json
          git diff --cached --quiet
          if($LASTEXITCODE -eq 0){
            Write-Host 'XZOGOT_FULL_FIRE_ALREADY_PRESENT'
            exit 0
          }
          $global:LASTEXITCODE=0
          git commit -m "Integrate full Aether real weapon fire audio"
          git pull --rebase origin feature/church-expansion-v1
          git push origin HEAD:feature/church-expansion-v1
          Write-Host 'XZOGOT_FULL_FIRE_COMMIT_GREEN'

      - name: Upload decoded fire proof
        uses: actions/upload-artifact@v4
        with:
          name: aether-full-real-fire-wav
          path: |
            xogot/assets/audio/weapons/mapmod/*/fire.wav
            xogot/assets/audio/weapons/mapmod/full-fire-report.json
          if-no-files-found: error
          retention-days: 14
