name: Build Clean Blender Monja Rig

on:
  workflow_dispatch:
  push:
    branches:
      - feature/church-expansion-v1
    paths:
      - "xogot/tools/author_monja_source_pose_rig.py"
      - ".github/workflows/xogot-monja-clean-blender-rig.yml"

permissions:
  contents: write

concurrency:
  group: xogot-monja-clean-blender-rig-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Blender
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender python3-numpy libegl1 libgl1-mesa-dri mesa-utils
          blender --version | head -n 2
          sudo npm install --global @gltf-transform/cli@4.5.1
          gltf-transform --version

      - name: Build clean humanoid Monja rig
        shell: bash
        run: |
          set -euo pipefail
          rm -rf xogot/build/monja-source-pose-rig
          mkdir -p xogot/build/monja-source-pose-rig
          timeout 2700 blender -b --python xogot/tools/author_monja_source_pose_rig.py             2>&1 | tee xogot/build/monja-source-pose-rig/blender.log
          grep -q "XZOGOT_MONJA_SOURCE_POSE_RIG_GREEN" xogot/build/monja-source-pose-rig/blender.log
          grep -q "XZOGOT_MONJA_SOURCE_POSE_WEIGHTS_GREEN" xogot/build/monja-source-pose-rig/blender.log
          grep -q "XZOGOT_MONJA_SOURCE_POSE_ANIMS_GREEN" xogot/build/monja-source-pose-rig/blender.log
          grep -q "XZOGOT_MONJA_SOURCE_POSE_GEOMETRY_GREEN" xogot/build/monja-source-pose-rig/blender.log
          grep -q "XZOGOT_MONJA_SOURCE_POSE_MATCH_GREEN" xogot/build/monja-source-pose-rig/blender.log
          grep -q "XZOGOT_MONJA_DEFORMATION_SANITY_GREEN" xogot/build/monja-source-pose-rig/blender.log
          test -s xogot/build/monja-source-pose-rig/monja_basica_clean_rig.glb
          test -s xogot/build/monja-source-pose-rig/bind_pose.png
          test -s xogot/build/monja-source-pose-rig/walk_mid.png
          test -s xogot/build/monja-source-pose-rig/report.json

      - name: Validate clean rig report
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("xogot/build/monja-source-pose-rig/report.json").read_text())
          assert r["geometry_conserved"] is True
          assert r["armatures"] == 1
          assert r["bones"] >= 20
          assert r["rig_mode"] == "source_pose_smooth_weighted_humanoid"
          assert r["old_rigid_region_parenting"] is False
          assert all(x["coverage"] >= 0.98 for x in r["weight_transfer"])
          assert len(r["baked"]) >= 3
          assert r["pose_match"]["validated"] is True
          assert r.get("deformation_sanity")
          assert all(v["max_extent_ratio"] <= 2.75 for v in r["deformation_sanity"].values())
          assert all(v["max_diag_ratio"] <= 2.25 for v in r["deformation_sanity"].values())
          assert all(v["max_surface_area_ratio"] <= 3.0 for v in r["deformation_sanity"].values())
          print("XZOGOT_MONJA_SOURCE_POSE_REPORT_GREEN",r["bones"],r["output_bytes"])
          PY

      - name: Pack Godot-compatible clean runtime as separate glTF
        shell: bash
        run: |
          set -euo pipefail
          rm -rf xogot/build/monja-clean-runtime
          mkdir -p xogot/build/monja-clean-runtime
          gltf-transform dequantize \
            xogot/build/monja-source-pose-rig/monja_basica_clean_rig.glb \
            xogot/build/monja-clean-runtime/monja_basica_clean_rig.gltf
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path("xogot/build/monja-clean-runtime")
          p=root/"monja_basica_clean_rig.gltf"
          doc=json.loads(p.read_text())
          used=set(doc.get("extensionsUsed",[]))
          required=set(doc.get("extensionsRequired",[]))
          assert "EXT_meshopt_compression" not in used|set(required), (used,required)
          assert "KHR_mesh_quantization" not in required, required
          files=[x for x in root.iterdir() if x.is_file()]
          assert files, files
          too_big=[(x.name,x.stat().st_size) for x in files if x.stat().st_size>=99_000_000]
          assert not too_big, too_big
          for buf in doc.get("buffers",[]):
              uri=buf.get("uri")
              assert uri and (root/uri).is_file(), uri
          for img in doc.get("images",[]):
              uri=img.get("uri")
              if uri:
                  assert (root/uri).is_file(), uri
          report_path=Path("xogot/build/monja-source-pose-rig/report.json")
          r=json.loads(report_path.read_text())
          r["runtime_format"]="gltf_separate"
          r["runtime_compression"]="none"
          r["runtime_simplification"]=False
          r["runtime_quantization"]=False
          r["runtime_files"]={x.name:x.stat().st_size for x in files}
          r["runtime_output_bytes"]=sum(x.stat().st_size for x in files)
          report_path.write_text(json.dumps(r,indent=2)+"\n")
          print("XZOGOT_MONJA_BASIC_RUNTIME_GLTF_SEPARATE_GREEN",r["runtime_files"])
          PY

      - name: Stage clean rig candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("xogot/build/monja-source-pose-rig/report.json").read_text())
          assert r.get("pose_match",{}).get("validated") is True, "Refusing to promote clean Monja until source-pose match is validated"
          assert r.get("raw_glb_bind_valid") is True
          assert r.get("raw_glb_geometry_conserved") is True
          assert r.get("runtime_simplification") is False
          assert r.get("runtime_format") == "gltf_separate"
          assert r.get("runtime_compression") == "none"
          assert r.get("runtime_quantization") is False
          print("XZOGOT_MONJA_POSE_MATCH_PROMOTION_GREEN")
          PY
          mkdir -p xogot/assets/zombies/monja_clean
          rm -f xogot/assets/zombies/monja_clean/monja_basica_clean_rig.glb
          rm -rf xogot/assets/zombies/monja_clean/clean_runtime
          mkdir -p xogot/assets/zombies/monja_clean/clean_runtime
          cp -a xogot/build/monja-clean-runtime/. \
             xogot/assets/zombies/monja_clean/clean_runtime/
          cp xogot/build/monja-source-pose-rig/report.json \
             xogot/assets/zombies/monja_clean/report.json

      - name: Commit clean rig candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "XZOGOT Asset Bot"
          git config user.email "xogot-asset-bot@users.noreply.github.com"
          git pull --rebase origin feature/church-expansion-v1
          git add xogot/assets/zombies/monja_clean/
          if ! git diff --cached --quiet; then
            git commit -m "asset: add source-pose Blender-rigged Monja"
            git push origin HEAD:feature/church-expansion-v1
          fi

      - name: Upload Blender rig proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monja-source-pose-rig
          path: xogot/build/monja-source-pose-rig/
          if-no-files-found: warn
          retention-days: 14

# bounded-motion-v2 explicit retry
