name: Build Clean Blender Monja Rig

on:
  workflow_dispatch:
  push:
    branches:
      - feature/church-expansion-v1
    paths:
      - "xogot/tools/author_monja_clean_blender_rig.py"
      - ".github/workflows/xogot-monja-clean-blender-rig.yml"

permissions:
  contents: write

concurrency:
  group: xogot-monja-clean-blender-rig-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Blender
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender python3-numpy
          blender --version | head -n 2

      - name: Build clean humanoid Monja rig
        shell: bash
        run: |
          set -euo pipefail
          rm -rf xogot/build/monja-clean-blender-rig
          mkdir -p xogot/build/monja-clean-blender-rig
          timeout 2700 blender -b --python xogot/tools/author_monja_clean_blender_rig.py             2>&1 | tee xogot/build/monja-clean-blender-rig/blender.log
          grep -q "XZOGOT_MONJA_CLEAN_BINDPOSE_GREEN" xogot/build/monja-clean-blender-rig/blender.log
          grep -q "XZOGOT_MONJA_CLEAN_WEIGHTS_GREEN" xogot/build/monja-clean-blender-rig/blender.log
          grep -q "XZOGOT_MONJA_CLEAN_ACTIONS_GREEN" xogot/build/monja-clean-blender-rig/blender.log
          grep -q "XZOGOT_MONJA_CLEAN_GEOMETRY_GREEN" xogot/build/monja-clean-blender-rig/blender.log
          grep -q "XZOGOT_MONJA_CLEAN_RIG_GREEN" xogot/build/monja-clean-blender-rig/blender.log
          test -s xogot/build/monja-clean-blender-rig/monja_basica_clean_rig.glb
          test -s xogot/build/monja-clean-blender-rig/bind_pose.png
          test -s xogot/build/monja-clean-blender-rig/walk_mid.png
          test -s xogot/build/monja-clean-blender-rig/report.json

      - name: Validate clean rig report
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("xogot/build/monja-clean-blender-rig/report.json").read_text())
          assert r["geometry_conserved"] is True
          assert r["armatures"] == 1
          assert r["bones"] >= 20
          assert r["rig_mode"] == "smooth_weighted_humanoid_bind_pose"
          assert r["old_rigid_region_parenting"] is False
          assert all(x["coverage"] >= 0.98 for x in r["weight_transfer"])
          assert len(r["baked"]) >= 3
          print("XZOGOT_MONJA_CLEAN_REPORT_GREEN",r["bones"],r["output_bytes"])
          PY

      - name: Stage clean rig candidate
        shell: bash
        run: |
          set -euo pipefail
          SIZE=$(stat -c%s xogot/build/monja-clean-blender-rig/monja_basica_clean_rig.glb)
          mkdir -p xogot/assets/zombies/monja_clean
          cp xogot/build/monja-clean-blender-rig/report.json xogot/assets/zombies/monja_clean/report.json
          if [ "$SIZE" -lt 95000000 ]; then
            cp xogot/build/monja-clean-blender-rig/monja_basica_clean_rig.glb xogot/assets/zombies/monja_clean/monja_basica_clean_rig.glb
            echo "COMMIT_CLEAN_RIG=1" >> "$GITHUB_ENV"
          else
            echo "COMMIT_CLEAN_RIG=0" >> "$GITHUB_ENV"
            echo "Clean rig is too large for normal Git; artifact only."
          fi

      - name: Commit clean rig candidate
        if: env.COMMIT_CLEAN_RIG == '1'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "XZOGOT Asset Bot"
          git config user.email "xogot-asset-bot@users.noreply.github.com"
          git pull --rebase origin feature/church-expansion-v1
          git add xogot/assets/zombies/monja_clean/
          if ! git diff --cached --quiet; then
            git commit -m "asset: add clean Blender-rigged Monja candidate"
            git push origin HEAD:feature/church-expansion-v1
          fi

      - name: Upload Blender rig proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monja-clean-blender-rig
          path: xogot/build/monja-clean-blender-rig/
          if-no-files-found: warn
          retention-days: 14
