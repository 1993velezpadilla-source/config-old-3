name: Xogot Five Pistols Original Gun Idle Bone A-B

on:
  workflow_dispatch:
  push:
    branches:
      - fix/source-viewmodel-inherited-hands-unit-scale
    paths:
      - "xogot/ci/source_pistol_idle_bone_ab.gd"
      - ".github/workflows/xogot-source-pistol-idle-bone-ab.yml"

permissions:
  contents: read

concurrency:
  group: xogot-pistol-native-ab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare-source-roll:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - name: Install Godot 4.6.1 OpenGL capture runtime
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers
          curl -L --fail --retry 5 --retry-all-errors --retry-delay 2 \
            https://github.com/godotengine/godot-builds/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip -o /tmp/godot.zip
          mkdir -p /tmp/godot /tmp/xogot-pistol-native-ab build/pistol-roll
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.6.1-stable_linux.x86_64
      - name: Import exact original source rigs
        run: |
          set -euo pipefail
          timeout 240 /tmp/godot/Godot_v4.6.1-stable_linux.x86_64 --headless --editor --path xogot --quit \
            2>&1 | tee build/pistol-roll/import.log
          ! grep -E "SCRIPT ERROR|Parse Error" build/pistol-roll/import.log
      - name: A-B capture upright vs gangster pistol angle in real Godot
        run: |
          set -euo pipefail
          timeout 240 xvfb-run -a -s "-screen 0 1280x720x24" \
            /tmp/godot/Godot_v4.6.1-stable_linux.x86_64 --path xogot \
            --audio-driver Dummy --rendering-method gl_compatibility \
            --resolution 1280x720 --script res://ci/source_pistol_idle_bone_ab.gd \
            2>&1 | tee build/pistol-roll/render.log
          grep -q "XZOGOT_NATIVE_IDLE_AB_FRAMES count=" build/pistol-roll/render.log
          test "$(find /tmp/xogot-pistol-native-ab -maxdepth 1 -name '*.png' | wc -l)" -ge 20
          ! grep -E "SCRIPT ERROR|Parse Error|XZOGOT_PISTOL_ROLL_AB_RED" build/pistol-roll/render.log
      - name: Upload original pistol grip and sight comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Xogot-Five-Pistols-Original-Idle-Bone-Rest-A-B-PNGs
          path: /tmp/xogot-pistol-native-ab/*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Upload source socket axis measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Xogot-Five-Pistols-Idle-Bone-Rest-Logs
          path: build/pistol-roll/*.log
          if-no-files-found: warn
          retention-days: 14
