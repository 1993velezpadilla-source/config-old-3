name: Xogot Render Performance

on:
  workflow_dispatch:
  push:
    branches:
      - feature/church-expansion-v1
    paths:
      - "xogot/ci/performance_probe.gd"
      - ".github/workflows/xogot-performance.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: xogot-render-performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rendered-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Install renderer
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip curl xvfb libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers

      - name: Install Godot 4.6.1
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --retry-all-errors --retry-delay 2 \
            https://github.com/godotengine/godot-builds/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip \
            -o /tmp/godot.zip
          rm -rf /tmp/godot
          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.6.1-stable_linux.x86_64

      - name: Import project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/performance
          timeout 240 /tmp/godot/Godot_v4.6.1-stable_linux.x86_64 \
            --headless --editor --path xogot --quit \
            2>&1 | tee build/performance/import.log
          ! grep -E "SCRIPT ERROR|Parse Error|ERROR: Failed to load script" build/performance/import.log

      - name: Run rendered 12-Monja benchmark
        shell: bash
        run: |
          set -euo pipefail
          timeout 240 xvfb-run -a -s "-screen 0 1280x720x24" \
            /tmp/godot/Godot_v4.6.1-stable_linux.x86_64 \
            --path xogot \
            --rendering-method gl_compatibility \
            --resolution 1280x720 \
            --script res://ci/performance_probe.gd \
            2>&1 | tee build/performance/render-performance.log
          grep -q "XZOGOT_PERF_METRICS" build/performance/render-performance.log
          grep -q "XZOGOT_RENDER_PERFORMANCE_GATE_GREEN" build/performance/render-performance.log
          ! grep -E "SCRIPT ERROR|Parse Error|ERROR: Failed to load script|PERFORMANCE_PROBE:" build/performance/render-performance.log
          grep "XZOGOT_PERF_METRICS" build/performance/render-performance.log | tail -1 \
            > build/performance/metrics.txt

      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Xogot-Render-Performance
          path: build/performance/
          if-no-files-found: warn
          retention-days: 14
