          assert pbr["validCounts"]["metallic"] > 0
          assert pbr["validCounts"]["specular"] > 0
          assert pbr["validCounts"]["emissive"] > 0
          print("XZIEL_NACHT_XZPB_REPORT_GREEN", pbr["validCounts"])
          PY

          python3 tools/maps/compile_nacht_normal_maps.py \
            --manifest "$RUNNER_TEMP/scene-glb/xziel-texture-manifest.json" \
            --materials-report build/nacht-static-scene/xziel.xzmat.report.json \
            --texture-root "$RUNNER_TEMP/scene-glb" \
            --output "$MAPROOT/materials.xzmn" \
            --report build/nacht-static-scene/xziel.xzmn.report.json \
            --max-dimension 256 \
            | tee build/nacht-static-scene/xzmn-compile.log

          python3 - <<'PY'
          import json
          from pathlib import Path

          normal = json.loads(
              Path(
                  "build/nacht-static-scene/xziel.xzmn.report.json"
              ).read_text()
          )
          assert normal["format"] == "XZMN"
          assert normal["version"] == 1
          assert normal["bindingCount"] == 1063
          assert normal["mappedBindings"] > 0
          assert normal["textureCount"] > 0
          assert normal["runtimeBytes"] > 0
          print(
              "XZIEL_NACHT_XZMN_REPORT_GREEN",
              {
                  "bindings": normal["bindingCount"],
                  "mapped": normal["mappedBindings"],
                  "textures": normal["textureCount"],
                  "bytes": normal["runtimeBytes"],
