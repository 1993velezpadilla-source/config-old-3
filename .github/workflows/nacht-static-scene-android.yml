          assert environment["withPosition"] == 166
          assert environment["withRotation"] == 166
          assert environment["withColor"] == 166
          assert environment["withIntensity"] == 166
          assert environment["withRadius"] == 163
          assert environment["withCone"] == 19
          assert environment["withTemperature"] == 165
