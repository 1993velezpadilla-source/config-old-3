      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK, NDK and emulator
        run: |
          set -euo pipefail
          SDKMANAGER=$(find "${ANDROID_HOME}/cmdline-tools" \
            -type f -name sdkmanager | sort | tail -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "emulator" \
            "system-images;android-35;google_apis;x86_64"

      - name: Prepare Android project with real static scene overlay
        env:
          XZIEL_EXTRA_MAP_NAME: xziel_nacht_bo3
          XZIEL_EXTRA_MAP_BSP: ${{ github.workspace }}/nacht-ci/xziel_nacht_bo3.bsp
          XZIEL_EXTRA_MAP_MB2: ${{ github.workspace }}/nacht-ci/xziel_nacht_bo3.mb2
        run: |
          set -euo pipefail

          bash scripts/prepare_android.sh

          test -f build/deps/vril/source/xz_xzmesh.c
          test -f build/deps/vril/source/xz_xzscene.c
          test -f build/deps/vril/source/xz_static_scene_runtime.c
          test -f build/deps/vril/source/xz_static_scene_draw_plan.c
          test -f build/deps/vril/source/xz_environment.c
          test -f build/deps/vril/source/xz_height_fog.c
          test -f build/deps/vril/source/xz_pbr_material.c

          grep -F 'static_scene status=%s' \
            build/deps/vril/source/xz_android_runtime.c
          grep -F 'XzStaticSceneRuntime_LoadMap' \
            build/deps/vril/source/xz_android_runtime.c
          grep -F 'XzGles3Shadow_UploadStaticScene' \
            build/deps/vril/source/xz_android_runtime.c
          grep -F 'static_scene_gpu_ready' \
            build/deps/vril/source/xz_gles3_shadow.c

          ZIP=build/android-project/app/src/main/assets/nzp-data.zip

          unzip -l "$ZIP" \
            | grep -F 'nzp/xziel/maps/xziel_nacht_bo3/scene.xzsc'

          unzip -l "$ZIP" \
            | grep -F 'nzp/xziel/maps/xziel_nacht_bo3/materials.xzmt'

          unzip -l "$ZIP" \
            | grep -F 'nzp/xziel/maps/xziel_nacht_bo3/materials.xzpb'

          unzip -l "$ZIP" \
            | grep -F 'nzp/xziel/maps/xziel_nacht_bo3/materials.xzmn'

          unzip -l "$ZIP" \
            | grep -F 'nzp/xziel/maps/xziel_nacht_bo3/environment.xzen'

          unzip -l "$ZIP" \
            | grep -F 'nzp/xziel/maps/xziel_nacht_bo3/fog.xzfg'

          unzip -l "$ZIP" \
            | grep -F 'nzp/xziel/maps/xziel_nacht_bo3/reflection.xzrc'

          test "$(unzip -Z1 "$ZIP" \
            | grep -E '^nzp/xziel/maps/xziel_nacht_bo3/meshes/.*\.xzm$' \
            | wc -l)" -eq 492

          echo "XZIEL_NACHT_ANDROID_OVERLAY_ZIP_OK xzms=492"

      - name: Build static-scene Android APK
        working-directory: build/android-project
        run: |
          ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Collect APK
        run: |
          set -euo pipefail
          mkdir -p dist
          cp \
            build/android-project/app/build/outputs/apk/debug/app-debug.apk \
            dist/XZIEL-Nacht-Static-Scene-debug.apk
          cp \
            "$RUNNER_TEMP/xziel-material-evidence/xziel.xzmat.report.json" \
            dist/xziel.xzmat.report.json
          cp \
            "$RUNNER_TEMP/xziel-material-evidence/xziel-texture-manifest.json" \
            dist/xziel-texture-manifest.json
          ls -lh dist/XZIEL-Nacht-Static-Scene-debug.apk

      - name: Boot Nacht and prove 492/492 VFS validation
        env:
          ANDROID_AVD_HOME: ${{ runner.temp }}/xziel-static-scene-avd
        run: |
          set -euo pipefail

          mkdir -p "$ANDROID_AVD_HOME" dist

          ADB="${ANDROID_HOME}/platform-tools/adb"
          EMULATOR="${ANDROID_HOME}/emulator/emulator"
          AVDMANAGER=$(find "${ANDROID_HOME}/cmdline-tools" \
            -type f -name avdmanager | sort | tail -n 1)

          printf 'no\n' | "$AVDMANAGER" create avd \
            --force \
            --name xziel-static-scene-ci \
            --package "system-images;android-35;google_apis;x86_64" \
            --device "pixel_6"

          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm || true
          fi

          nohup "$EMULATOR" \
            @xziel-static-scene-ci \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -gpu swiftshader_indirect \
            -memory 3072 \
            > dist/emulator-stdout.txt 2>&1 &

          EMU_PID=$!
          sleep 5
          kill -0 "$EMU_PID"

          timeout 120 "$ADB" wait-for-device

          for i in $(seq 1 60); do
            if [[ "$("$ADB" shell getprop sys.boot_completed \
                2>/dev/null | tr -d '\r')" == "1" ]]; then
              break
            fi
            sleep 2
          done

          test "$("$ADB" shell getprop sys.boot_completed \
            2>/dev/null | tr -d '\r')" = "1"

          # Suppress Android's one-time immersive-mode education overlay so the
          # captured framebuffer is the game itself rather than the system
          # "Viewing full screen / Got it" tutorial.
          "$ADB" shell settings put secure \
            immersive_mode_confirmations confirmed || true

          "$ADB" install -r \
            dist/XZIEL-Nacht-Static-Scene-debug.apk

          "$ADB" logcat -c
          "$ADB" shell am force-stop com.xziel.engine || true

          # Prevent Android's first-use immersive-mode education card from
          # covering the framebuffer evidence. The fixed tap is a fallback for
          # emulator images that ignore the secure confirmation setting.
          "$ADB" shell settings put secure \
            immersive_mode_confirmations confirmed || true

          "$ADB" shell am start -W \
            -n com.xziel.engine/org.libsdl.app.NZPActivity \
            --es xziel_ci_map xziel_nacht_bo3 \
            --ez xziel_ci_hud_preview true \
            > dist/am-start.txt 2>&1 || true

          sleep 2
          "$ADB" shell input tap 1700 626 || true
          sleep 1

          STAGE=""
          for i in $(seq 1 90); do
            STAGE=$("$ADB" shell run-as com.xziel.engine \
              cat files/nzp-runtime/.xziel-stage \
              2>/dev/null | tr -d '\r' || true)

            if [[ "$STAGE" == "FIRST_FRAME_OK" ]]; then
              break
            fi
            sleep 2
          done

          echo "STAGE=$STAGE" \
            | tee dist/static-scene-status.txt

          test "$STAGE" = "FIRST_FRAME_OK"

          # Preserve the one-shot startup evidence before the verbose renderer
          # can rotate it out of logcat while we wait for MODERN cutover.
          "$ADB" logcat -d -v threadtime \
            > dist/static-scene-logcat-early.txt || true

          # FIRST_FRAME_OK only proves Vril completed its first host frame.
          # The modern cutover intentionally needs several real geometry frames
          # before the static scene can borrow a valid gameplay camera and
          # replace the legacy BSP world. Keep the app alive until the first
          # complete Nacht instanced framebuffer draw is observed.
          DRAW_READY=0
          : > dist/static-scene-logcat-draw.txt
          : > dist/static-scene-logcat-probe.txt
          for i in $(seq 1 90); do
            # Detect and preserve from the same immutable snapshot. Using
            # separate logcat reads leaves a race where the one-shot draw line
            # can rotate away between detection and evidence capture.
            "$ADB" logcat -d -v threadtime \
              > dist/static-scene-logcat-probe.txt || true
            if grep -Eq \
                "XZIEL-XZ.*static_scene_draw ready=1 meshes=492 instances=10791 drawCalls=1063 attempts=[1-9][0-9]* failures=0" \
                dist/static-scene-logcat-probe.txt; then
              DRAW_READY=1
              cp \
                dist/static-scene-logcat-probe.txt \
                dist/static-scene-logcat-draw.txt
              break
            fi

            if ! "$ADB" shell pidof com.xziel.engine >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done

          # One successful native present is not enough to promote the
          # cutover. Let XZIEL complete the required consecutive presents and
          # prove that legacy world suppression has actually reached MODERN
          # before capturing Android's front buffer.
          CUTOVER_READY=0
          for i in $(seq 1 30); do
            if "$ADB" logcat -d -v threadtime 2>/dev/null \
                | grep -Eq \
                  "XZIEL-XZ.*phase16 heartbeat requested=MODERN active=MODERN.*blockers=0x0"; then
              CUTOVER_READY=1
              break
            fi
            if ! "$ADB" shell pidof com.xziel.engine >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          echo "CUTOVER_READY=$CUTOVER_READY" \
            | tee -a dist/static-scene-status.txt

          "$ADB" logcat -d -v threadtime \
            > dist/static-scene-logcat-late.txt || true
          cat \
            dist/static-scene-logcat-early.txt \
            dist/static-scene-logcat-draw.txt \
            dist/static-scene-logcat-late.txt \
            > dist/static-scene-logcat.txt

          # Capture the renderer's own FBO before Android/GL4ES presentation.
          # This is the authoritative visual proof for the native GLES3 scene.
          "$ADB" shell run-as com.xziel.engine \
            cat files/nzp-runtime/static-scene-fbo.ppm \
            > dist/static-scene-fbo.ppm 2>/dev/null || true
          test -s dist/static-scene-fbo.ppm

          # API 35 emulators may still show the education dialog even when the
          # secure setting was pre-seeded. Detect it instead of blindly tapping
          # the game, and dismiss it only when the system text is present.
          "$ADB" shell uiautomator dump /sdcard/xziel-window.xml \
            >/dev/null 2>&1 || true
          "$ADB" shell cat /sdcard/xziel-window.xml \
            > dist/static-scene-window.xml 2>/dev/null || true

          if grep -q "Viewing full screen" \
              dist/static-scene-window.xml 2>/dev/null; then
            "$ADB" shell input tap 1960 720 || true
            sleep 1
            "$ADB" shell uiautomator dump /sdcard/xziel-window.xml \
              >/dev/null 2>&1 || true
            "$ADB" shell cat /sdcard/xziel-window.xml \
              > dist/static-scene-window-after-dismiss.xml \
              2>/dev/null || true
          fi

          if grep -q "Viewing full screen" \
              dist/static-scene-window-after-dismiss.xml \
              2>/dev/null; then
            echo "XZIEL_SCREENSHOT_BLOCKED_BY_ANDROID_OVERLAY"
            exit 1
          fi

          "$ADB" exec-out screencap -p \
            > dist/static-scene-runtime.png || true

          echo "DRAW_READY=$DRAW_READY" \
            | tee -a dist/static-scene-status.txt

          test "$DRAW_READY" = "1"
          test "$CUTOVER_READY" = "1"

          grep -E \
            "XZIEL-XZ.*static_scene status=READY map='xziel_nacht_bo3'.*meshes=492 instances=10791 xzms=492.*vertices=1067383 indices=3608148 submeshes=1063 meshBytes=48633408" \
            dist/static-scene-logcat.txt

          grep -E \
            "XZIEL-XZ.*static_scene status=READY map='xziel_nacht_bo3'.*gpuReady=1 gpuMeshes=492 gpuVertices=1067383 gpuIndices=3608148 gpuBytes=48588848" \
            dist/static-scene-logcat.txt

          grep -E \
            "XZIEL-XZ.*static_scene status=READY map='xziel_nacht_bo3'.*materialReady=1 gpuTextures=[1-9][0-9]* gpuTextureBytes=[1-9][0-9]* materialBindings=1063 mappedBindings=[1-9][0-9]*" \
            dist/static-scene-logcat.txt

          grep -E \
            "XZIEL-XZ.*static_scene status=READY map='xziel_nacht_bo3'.*pbrBindings=1063 pbrBytes=21280 pbrGpuReady=1 pbrAuthored=91 specularReady=1" \
            dist/static-scene-logcat.txt

          grep -q "vec3 fresnelSchlick" engine/xz/xz_gles3_shadow.c
          grep -q "float distributionGGX" engine/xz/xz_gles3_shadow.c
          grep -q "vec3 cookTorranceSpec" engine/xz/xz_gles3_shadow.c
          grep -q "localSpec+=cookTorranceSpec" engine/xz/xz_gles3_shadow.c
          grep -q "uniform samplerCube uReflectionCapture" \
            engine/xz/xz_gles3_shadow.c
          grep -q "float ueReflectionMip" \
            engine/xz/xz_gles3_shadow.c
          grep -q "float levelFrom1x1=1.0-1.2\*log2" \
            engine/xz/xz_gles3_shadow.c
          grep -q "vec3 ueEnvBRDFApprox" \
            engine/xz/xz_gles3_shadow.c
          grep -q "textureLod(uReflectionCapture,ueR,mip)" \
            engine/xz/xz_gles3_shadow.c
          grep -q "vec4 ueSphereReflectionVector" \
