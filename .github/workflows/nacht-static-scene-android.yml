          test -s "$MAPROOT/scene.xzsc"
          test -s "$MAPROOT/materials.xzmt"
          test -s "$MAPROOT/materials.xzpb"
          test -s "$MAPROOT/materials.xzmn"
          test -s "$MAPROOT/environment.xzen"
          test -s "$MAPROOT/fog.xzfg"
          test -s "$MAPROOT/reflection.xzrc"

          python3 - <<'PY'
