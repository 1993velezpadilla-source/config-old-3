          PY

          mkdir -p "$RUNNER_TEMP/xziel-material-evidence"
          cp \
            build/nacht-static-scene/xziel.xzmat.report.json \
            "$RUNNER_TEMP/xziel-material-evidence/xziel.xzmat.report.json"
          cp \
            "$RUNNER_TEMP/scene-glb/xziel-texture-manifest.json" \
            "$RUNNER_TEMP/xziel-material-evidence/xziel-texture-manifest.json"

          echo "XZIEL_EXTRA_ASSET_DIR=$OVERLAY" \
