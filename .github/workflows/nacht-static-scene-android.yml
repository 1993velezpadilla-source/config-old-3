          assert fog["version"] == 1
          assert fog["bytes"] == 92
          assert fog["flags"] == 0
          assert abs(fog["resolved"]["fogDensity"] - 0.1) < 1e-7
          assert abs(fog["resolved"]["fogHeightFalloff"] - 2.0) < 1e-7
          assert abs(fog["resolved"]["fogMaxOpacity"] - 0.2) < 1e-7
          assert abs(fog["resolved"]["startDistanceMeters"] - 3.0) < 1e-7

          print(
