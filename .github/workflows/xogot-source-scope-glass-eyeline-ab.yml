name: Xogot Original Scope Glass Eye-Line A-B
on:
  workflow_dispatch:
  push:
    branches:
      - fix/source-viewmodel-inherited-hands-unit-scale
    paths:
      - "xogot/ci/source_scope_glass_eyeline_ab.gd"
      - ".github/workflows/xogot-source-scope-glass-eyeline-ab.yml"

permissions:
  contents: read

jobs:
  scope-glass:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v5
      - name: Install original Godot 4.6.1 renderer
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers
          curl -L --fail --retry 5 --retry-all-errors --retry-delay 2 \
            https://github.com/godotengine/godot-builds/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip -o /tmp/godot.zip
          mkdir -p /tmp/godot /tmp/xogot-source-scope-glass build/scope-glass
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.6.1-stable_linux.x86_64
      - name: Import recovered original glTF skinned scoped rifles
        run: |
          set -euo pipefail
          timeout 250 /tmp/godot/Godot_v4.6.1-stable_linux.x86_64 --headless --editor --path xogot --quit 2>&1 | tee build/scope-glass/import.log
          ! grep -E "SCRIPT ERROR|Parse Error" build/scope-glass/import.log
      - name: Compare source scope tag against authentic material glass center
        run: |
          set -euo pipefail
          timeout 250 xvfb-run -a -s "-screen 0 1280x720x24" \
            /tmp/godot/Godot_v4.6.1-stable_linux.x86_64 --path xogot --audio-driver Dummy \
            --rendering-method gl_compatibility --resolution 1280x720 \
            --script res://ci/source_scope_glass_eyeline_ab.gd 2>&1 | tee build/scope-glass/render.log
          grep -q "XZOGOT_SOURCE_GLASS_EYELINE_DIAGNOSTIC_GREEN frames=10" build/scope-glass/render.log
          test "$(find /tmp/xogot-source-scope-glass -maxdepth 1 -name '*.png' | wc -l)" -eq 10
          ! grep -E "SCRIPT ERROR|Parse Error|XZOGOT_SCOPE_GLASS_EYELINE_RED" build/scope-glass/render.log
      - name: Preserve original full resolution Godot glass A-B frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Xogot-Authentic-Sniper-Glass-vs-Tag-10PNG
          path: /tmp/xogot-source-scope-glass/*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve original measured glass eye-line logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Xogot-Authentic-Sniper-Glass-vs-Tag-Logs
          path: build/scope-glass/*.log
          if-no-files-found: warn
          retention-days: 14
