name: XZIEL Nacht Gameplay Harness

on:
  workflow_dispatch:
  push:
    branches:
      - feature/xziel-engine-nacht-runtime-v1
      - feature/xziel-nacht-gameplay-wunderfizz-v1
    paths:
      - "assets/nacht_reference/**"
      - "assets/map_package/**"
      - "assets/weapons/**"
      - "tools/weapons/**"
      - "tools/maps/export_nacht_nzp_harness.py"
      - "tools/maps/export_nacht_xziel_package_status.py"
      - "tools/maps/build_xziel_map_package.py"
      - "tests/test_xziel_xzp_package.py"
      - "tools/maps/verify_xziel_map_package.py"
      - "tools/maps/compile_xziel_map_package.py"
      - "tools/maps/validate_xziel_map_content_contract.py"
      - "tests/test_xziel_map_package_builder.py"
      - "tools/maps/validate_nacht_bo3_weapon_specs.py"
      - "tools/maps/validate_nacht_completion_contract.py"
      - "tools/maps/export_nacht_nzp_runtime_overlay.py"
      - "scripts/prepare_android.sh"
      - "scripts/patch_quakec_*.py"
      - "scripts/patch_vril_*.py"
      - "engine/xz/xz_nacht_reference.*"
      - "engine/xz/xz_map_runtime.*"
      - "engine/xz/xz_world_transform.*"
      - "engine/xz/xz_bo3_weapon_specs.*"
      - "tests/xz_bo3_weapon_specs_test.c"
      - "android/**"
      - ".github/workflows/nacht-gameplay-harness.yml"

permissions:
  contents: read

concurrency:
  group: xziel-nacht-gameplay-harness
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout XZIEL Engine
        uses: actions/checkout@v5

      - name: Generate Nacht server gameplay harness
        shell: bash
        env:
          XZIEL_NACHT_MAP_OUT: ${{ github.workspace }}/nacht-ci/xziel_nacht_bo3.map
          XZIEL_NACHT_HARNESS_SUMMARY: ${{ github.workspace }}/nacht-ci/xziel_nacht_bo3_harness.json
        run: |
          set -euo pipefail
          mkdir -p nacht-ci
          python3 tools/maps/export_nacht_nzp_harness.py \
            | tee nacht-ci/export.log
          test -s nacht-ci/xziel_nacht_bo3.map
          test -s nacht-ci/xziel_nacht_bo3_harness.json

      - name: Validate XZIEL universal map content contract
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/maps/validate_xziel_map_content_contract.py

      - name: Test XZIEL folder and ZIP package inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/test_xziel_map_package_builder.py

      - name: Test deterministic XZIEL XZP package
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/test_xziel_xzp_package.py

      - name: Validate Nacht universal package status
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/maps/export_nacht_xziel_package_status.py
          git diff --exit-code -- assets/nacht_reference/xziel_map_package_status_v1.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("assets/nacht_reference/xziel_map_package_status_v1.json").read_text())
          assert p["summary"]["requiredFamilyCount"] == 24
          assert p["summary"]["strictReady"] is False
          assert p["policy"]["zeroOmission"] is True
          assert p["policy"]["noSilentFallbacks"] is True
          print("XZIEL_NACHT_UNIVERSAL_PACKAGE_STATUS_OK", p["summary"])
          PY

      - name: Validate BO3 Nacht weapon behavior specs
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/maps/validate_nacht_bo3_weapon_specs.py
          python3 tools/maps/export_nacht_nzp_runtime_overlay.py
          git diff --exit-code -- assets/nacht_reference/nzp_runtime_overlay.json

      - name: Validate complete BO3 weapon source snapshot
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/weapons/validate_bo3_weapon_source_stats.py

      - name: Validate exact BO3 prototype weapon table
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/weapons/validate_bo3_zm_prototype_weapons.py

      - name: Validate BO3 source coverage for all weapon identities
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/weapons/validate_bo3_weapon_source_coverage.py

      - name: Validate BO3 Pack-a-Punch catalog
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/weapons/validate_bo3_pack_a_punch_catalog.py

      - name: Validate BO3 Disorderly Combat pool
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/maps/validate_bo3_disorderly_combat_pool.py

      - name: Validate global XZIEL weapon catalog
        shell: bash
        env:
          XZIEL_MYSTERY_BOX_MB2_OUT: ${{ github.workspace }}/nacht-ci/xziel_nacht_bo3.mb2
        run: |
          set -euo pipefail
          python3 tools/weapons/export_xziel_mystery_box_pool.py
          python3 tools/weapons/export_nacht_prototype_box_pool.py
          python3 tools/weapons/export_xziel_mystery_box_runtime_pool.py
          git diff --exit-code -- assets/weapons/xziel_mystery_box_pool_v1.json
          git diff --exit-code -- assets/weapons/nacht_prototype_box_pool_v1.json
          git diff --exit-code -- assets/weapons/xziel_mystery_box_runtime_pool_v1.json
          test -s nacht-ci/xziel_nacht_bo3.mb2
          grep -Fx 'nzp_mbox2' nacht-ci/xziel_nacht_bo3.mb2
          grep -Fx 'allow:' nacht-ci/xziel_nacht_bo3.mb2
          python3 tools/weapons/validate_xziel_weapon_catalog.py

      - name: Validate Mystery Box runtime allow-list
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest=json.loads(Path("assets/weapons/xziel_mystery_box_runtime_pool_v1.json").read_text())
          lines=[
              line.strip()
              for line in Path("nacht-ci/xziel_nacht_bo3.mb2").read_text().splitlines()
              if line.strip() and not line.lstrip().startswith("#")
          ]
          assert lines[:2] == ["nzp_mbox2", "allow:"], lines[:2]
          tokens=lines[2:]
          expected=[row["mboxToken"] for row in manifest["active"]]
          assert tokens == expected, (tokens, expected)
          assert manifest["candidateCount"] == 46, manifest
          assert manifest["activeCount"] == len(expected), manifest
          assert manifest["blockedCount"] + manifest["activeCount"] == 46, manifest
          print(
              "XZIEL_MYSTERY_BOX_ALLOWLIST_OK",
              {
                  "candidate": manifest["candidateCount"],
                  "active": manifest["activeCount"],
                  "blocked": manifest["blockedCount"],
              },
          )
          PY

      - name: Validate zero-omission Nacht completion contract
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/maps/validate_nacht_completion_contract.py

      - name: Test XZIEL BO3 weapon registry
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c99 -O2 -Wall -Wextra -Werror \
            -Iengine/xz \
            tests/xz_bo3_weapon_specs_test.c \
            engine/xz/xz_bo3_weapon_specs.c \
            -lm -o /tmp/xz_bo3_weapon_specs_test
          /tmp/xz_bo3_weapon_specs_test

      - name: Validate Nacht server entity contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("nacht-ci/xziel_nacht_bo3_harness.json")
          r=json.loads(p.read_text(encoding="utf-8"))
          c=r["counts"]
          assert r["serverAuthoritative"] is True, r
          assert r["scaleUnitsPerMeter"] == 39.3700787402, r
          assert c == {
              "playerSpawns":4,
              "zombieSpawns":21,
              "startZombieSpawns":10,
              "boxZombieSpawns":5,
              "upstairsZombieSpawns":6,
              "barricades":12,
              "doors":3,
              "nativePurchases":1,
              "blockedBo3WeaponPurchases":8,
              "mysteryBoxes":1,
              "wunderfizzMachines":1,
          }, c
          assert r["nativePurchase"]["weapon"] == "W_GRENADE", r
          assert r["nativePurchase"]["cost"] == 250, r
          assert len(r["blockedBo3Weapons"]) == 8, r
          text=Path("nacht-ci/xziel_nacht_bo3.map").read_text(encoding="utf-8")
          assert text.count('"classname" "spawn_zombie"') == 21
          assert text.count('"classname" "item_barricade"') == 12
          assert text.count('"classname" "func_door_nzp"') == 3
          assert text.count('"classname" "buy_weapon"') == 1
          assert text.count('"classname" "mystery_box"') == 1
          assert text.count('"classname" "xziel_wunderfizz"') == 1
          assert text.count('"classname" "trigger_relay"') == 2
          assert '"cost" "950"' in text
          assert '"cost" "1500"' in text
          assert '"weapon" "26"' in text
          assert '"cost2" "250"' in text
          assert '"targetname" "xz_upstairs_purchases"' in text
          assert "KN-44" not in text
          print("NACHT_SERVER_ENTITY_CONTRACT_OK", c)
          PY

      - name: Compile Nacht BSP with official NZP toolchain
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/nzp-assets
          git clone --depth 1 https://github.com/nzp-team/assets.git /tmp/nzp-assets
          (
            cd /tmp/nzp-assets
            bash tools/compile-wads.sh
            mkdir -p source/maps/xziel_nacht_bo3
            cp "$GITHUB_WORKSPACE/nacht-ci/xziel_nacht_bo3.map" \
              source/maps/xziel_nacht_bo3/xziel_nacht_bo3.map
            bash tools/compile-maps.sh --map xziel_nacht_bo3
          ) 2>&1 | tee nacht-ci/compile.log
          cp /tmp/nzp-assets/common/maps/xziel_nacht_bo3.bsp \
            nacht-ci/xziel_nacht_bo3.bsp
          test -s nacht-ci/xziel_nacht_bo3.bsp
          ls -lh nacht-ci/xziel_nacht_bo3.bsp

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK, NDK and emulator
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "emulator" \
            "system-images;android-35;google_apis;x86_64"

      - name: Prepare XZIEL Engine with Nacht harness
        shell: bash
        env:
          XZIEL_EXTRA_MAP_NAME: xziel_nacht_bo3
          XZIEL_EXTRA_MAP_BSP: ${{ github.workspace }}/nacht-ci/xziel_nacht_bo3.bsp
          XZIEL_EXTRA_MAP_MB2: ${{ github.workspace }}/nacht-ci/xziel_nacht_bo3.mb2
        run: |
          set -euo pipefail
          bash scripts/prepare_android.sh
          test -s build/android-project/app/src/main/java/org/libsdl/app/XzielMapPackageInstaller.java
          grep -F 'XzielMapPackageInstaller.install' build/android-project/app/src/main/java/org/libsdl/app/NZPActivity.java
          grep -F '"-game", importedMap.gameDirectoryName' build/android-project/app/src/main/java/org/libsdl/app/NZPActivity.java
          grep -F 'SHA-256 mismatch' build/android-project/app/src/main/java/org/libsdl/app/XzielMapPackageInstaller.java
          grep -F '"-xzielstrictassets"' build/android-project/app/src/main/java/org/libsdl/app/NZPActivity.java
          grep -F 'XZIEL_STRICT_MISSING_MODEL' build/deps/vril/source/platform/sdl/gl/gl_model.c
          grep -F 'XZIEL_STRICT_PRECACHE_MODEL' build/deps/vril/source/cl_parse.c
          grep -F 'XZIEL_STRICT_MISSING_SFX' build/deps/vril/source/snd_mem.c
          grep -F 'XZIEL_FULL_BOX_CAPACITY' build/deps/quakec/source/server/defs/custom.qc
          grep -F '#define MAX_BOX_WEAPONS' build/deps/quakec/source/server/defs/custom.qc | grep -F '64'
          grep -F 'XZIEL_BOUNDED_BOX_SELECTION' build/deps/quakec/source/server/entities/mystery_box.qc
          grep -F 'XZIEL_SPARSE_BOX_ALLOWLIST' build/deps/quakec/source/server/entities/mystery_box.qc
          grep -F 'XZIEL_EMPTY_BOX_GUARD' build/deps/quakec/source/server/entities/mystery_box.qc
          test "$(grep -c 'case "xz_.*": return W_XZ_' build/deps/quakec/source/shared/weapon_stats.qc)" -eq 87
          test "$(grep -c '^#define W_XZ_PAP_' build/deps/quakec/source/shared/shared_defs.qc)" -eq 35
          grep -F 'W_XZ_PAP_PISTOL_STANDARD_UPGRADED' build/deps/quakec/source/shared/shared_defs.qc | grep -F '160'
          grep -F 'W_XZ_PAP_LMG_RPK_UPGRADED' build/deps/quakec/source/shared/shared_defs.qc | grep -F '194'
          grep -F 'case "xz_cymbal_monkey_upgraded": return W_XZ_CYMBAL_MONKEY_UPGRADED;' build/deps/quakec/source/shared/weapon_stats.qc
          grep -F 'XZIEL_PACK_A_PUNCH_IDENTITY_MAP_BEGIN' build/deps/quakec/source/shared/weapon_stats.qc
          test "$(grep -c 'case W_XZ_.*: return W_XZ_PAP_' build/deps/quakec/source/shared/weapon_stats.qc)" -eq 35
          grep -F 'case W_XZ_CYMBAL_MONKEY: return W_XZ_CYMBAL_MONKEY_UPGRADED;' build/deps/quakec/source/shared/weapon_stats.qc
          grep -F 'XZIEL_GetPackAPunchWeaponID' build/deps/quakec/source/shared/weapon_stats.qc
          grep -F 'XZIEL_GetBaseWeaponIDFromPackAPunch' build/deps/quakec/source/shared/weapon_stats.qc
          grep -F 'XZIEL_PackAPunchRuntimeReady' build/deps/quakec/source/shared/weapon_stats.qc
          grep -F 'XZIEL_PackAPunchMapScopeActive' build/deps/quakec/source/shared/weapon_stats.qc
          grep -F 'substring(mapname, 0, 6) == "xziel_"' build/deps/quakec/source/shared/weapon_stats.qc
          grep -F 'XZIEL_PAP_LEGACY_ISPAP_BRIDGE' build/deps/quakec/source/shared/weapon_stats.qc
          grep -F 'XZIEL_PAP_LEGACY_NONPAP_BRIDGE' build/deps/quakec/source/shared/weapon_stats.qc
          grep -F 'XZIEL_PAP_LEGACY_PAP_BRIDGE' build/deps/quakec/source/shared/weapon_stats.qc
          grep -F 'XZIEL_GOBBLEGUM_PAP_EVENT_RUNTIME_BEGIN' build/deps/quakec/source/server/utilities/weapon_utilities.qc
          grep -F 'XZIEL_GobbleGumActivatePapEvent' build/deps/quakec/source/server/utilities/weapon_utilities.qc
          grep -F 'XZIEL_GobbleGumResolveWallPowerWeapon' build/deps/quakec/source/server/utilities/weapon_utilities.qc
          grep -F 'XZIEL_GobbleGumResolveCratePowerWeapon' build/deps/quakec/source/server/utilities/weapon_utilities.qc
          grep -F 'XZIEL_GOBBLEGUM_WALL_POWER_HOOK' build/deps/quakec/source/server/entities/wall_weapon.qc
          grep -F 'XZIEL_GOBBLEGUM_CRATE_POWER_HOOK' build/deps/quakec/source/server/entities/mystery_box.qc
          grep -F 'XZIEL_GOBBLEGUM_EPHEMERAL_RUNTIME_BEGIN' build/deps/quakec/source/server/utilities/weapon_utilities.qc
          grep -F 'XZIEL_GobbleGumEphemeralCanActivate' build/deps/quakec/source/server/utilities/weapon_utilities.qc
          grep -F 'XZIEL_GobbleGumActivateEphemeralEnhancement' build/deps/quakec/source/server/utilities/weapon_utilities.qc
          grep -F 'XZIEL_GobbleGumEphemeralRestore' build/deps/quakec/source/server/utilities/weapon_utilities.qc
          grep -F 'XZIEL_GobbleGumEphemeralTick' build/deps/quakec/source/server/utilities/weapon_utilities.qc
          grep -F 'XZIEL_GOBBLEGUM_EPHEMERAL_TICK' build/deps/quakec/source/server/weapons/weapon_core.qc
          grep -F '#define XZIEL_GUM_EPHEMERAL_DURATION_SECONDS 60' build/deps/quakec/source/server/defs/custom.qc
          grep -F 'XZIEL_WEAPON_RUNTIME_READINESS_BEGIN' build/deps/quakec/source/shared/weapon_stats.qc
          grep -F 'XZIEL_WeaponRuntimeReady' build/deps/quakec/source/shared/weapon_stats.qc
          grep -F 'XZIEL_GOBBLEGUM_DISORDERLY_POOL_BEGIN' build/deps/quakec/source/server/utilities/weapon_utilities.qc
          grep -F 'XZIEL_GobbleGumDisorderlyWeaponAtIndex' build/deps/quakec/source/server/utilities/weapon_utilities.qc
          grep -F 'XZIEL_GobbleGumDisorderlyReadyBaseCount' build/deps/quakec/source/server/utilities/weapon_utilities.qc
          grep -F 'XZIEL_GobbleGumDisorderlyReadyPapCount' build/deps/quakec/source/server/utilities/weapon_utilities.qc
          grep -F 'XZIEL_GobbleGumDisorderlyPoolRuntimeReady' build/deps/quakec/source/server/utilities/weapon_utilities.qc
          grep -F 'XZIEL_GobbleGumDisorderlyCanActivate' build/deps/quakec/source/server/utilities/weapon_utilities.qc
          grep -F '#define XZIEL_GUM_DISORDERLY_POOL_SIZE 26' build/deps/quakec/source/server/defs/custom.qc
          grep -F '#define XZIEL_GUM_DISORDERLY_DURATION_SECONDS 300' build/deps/quakec/source/server/defs/custom.qc
          grep -F '#define XZIEL_GUM_DISORDERLY_SWITCH_SECONDS 10' build/deps/quakec/source/server/defs/custom.qc
          grep -F 'XZIEL_GOBBLEGUM_DISORDERLY_RUNTIME_BEGIN' build/deps/quakec/source/server/utilities/weapon_utilities.qc
          grep -F 'XZIEL_GobbleGumDisorderlyCanActivateFull' build/deps/quakec/source/server/utilities/weapon_utilities.qc
          grep -F 'XZIEL_GobbleGumActivateDisorderlyCombat' build/deps/quakec/source/server/utilities/weapon_utilities.qc
          grep -F 'XZIEL_GobbleGumDisorderlyPickNextBase' build/deps/quakec/source/server/utilities/weapon_utilities.qc
          grep -F 'XZIEL_GobbleGumDisorderlyRestore' build/deps/quakec/source/server/utilities/weapon_utilities.qc
          grep -F 'XZIEL_GobbleGumDisorderlyTick' build/deps/quakec/source/server/utilities/weapon_utilities.qc
          grep -F 'XZIEL_GOBBLEGUM_DISORDERLY_RUNTIME_TICK' build/deps/quakec/source/server/weapons/weapon_core.qc
          grep -F 'XZIEL_GOBBLEGUM_DISORDERLY_BLOCK_WEAPON_CYCLE' build/deps/quakec/source/server/weapons/weapon_core.qc
          grep -F 'XZIEL_GOBBLEGUM_DISORDERLY_BLOCK_GRENADE_INPUT' build/deps/quakec/source/server/weapons/weapon_core.qc
          grep -F 'XZIEL_GOBBLEGUM_DISORDERLY_BLOCK_OFFHAND_IMPULSE' build/deps/quakec/source/server/weapons/weapon_core.qc
          python3 - <<'PY'
          from pathlib import Path

          stats = Path("build/deps/quakec/source/shared/weapon_stats.qc").read_text()
          ready = stats.split(
              "// XZIEL_WEAPON_RUNTIME_READINESS_BEGIN", 1
          )[1].split("// XZIEL_WEAPON_RUNTIME_READINESS_END", 1)[0]
          assert "return true;" not in ready, ready

          utils = Path(
              "build/deps/quakec/source/server/utilities/weapon_utilities.qc"
          ).read_text()
          pool = utils.split(
              "// XZIEL_GOBBLEGUM_DISORDERLY_POOL_BEGIN", 1
          )[1].split("// XZIEL_GOBBLEGUM_DISORDERLY_POOL_END", 1)[0]
          compiled = [
              line.strip()
              for line in pool.splitlines()
              if line.strip().startswith("case ")
              and ": return W_XZ_" in line
          ]
          assert len(compiled) == 26, len(compiled)
          assert len(set(compiled)) == 26, compiled

          runtime = utils.split(
              "// XZIEL_GOBBLEGUM_DISORDERLY_RUNTIME_BEGIN", 1
          )[1].split("// XZIEL_GOBBLEGUM_DISORDERLY_RUNTIME_END", 1)[0]
          aat = runtime.split(
              "float() XZIEL_GobbleGumDisorderlyAATRuntimeReady =", 1
          )[1].split("};", 1)[0]
          assert "return false;" in aat, "Disorderly AAT gate must stay closed"
          assert "return true;" not in aat, "Disorderly AAT gate promoted prematurely"
          assert "XZIEL_GUM_DISORDERLY_DURATION_SECONDS" in runtime
          assert "XZIEL_GUM_DISORDERLY_SWITCH_SECONDS" in runtime
          assert "XZIEL_GUM_DISORDERLY_WARNING_SECONDS" in runtime
          print(
              "XZIEL_DISORDERLY_COMPILED_POOL_OK",
              {
                  "weapons": 26,
                  "runtimeReady": 0,
                  "rotationBackend": True,
                  "aatBridge": False,
              },
          )
          PY
          grep -F 'XZIEL_ZOMBIES_POWERUP_BRIDGE_BEGIN' build/deps/quakec/source/server/entities/powerups.qc
          grep -F 'XZIEL_SpawnCorePowerup' build/deps/quakec/source/server/entities/powerups.qc
          grep -F 'XZIEL_SpawnPackAPunchGrant' build/deps/quakec/source/server/entities/powerups.qc
          grep -F 'XZIEL_ZOMBIES_PERK_BRIDGE_BEGIN' build/deps/quakec/source/server/entities/perk_a_cola.qc
          grep -F 'XZIEL_GrantPerkLogic' build/deps/quakec/source/server/entities/perk_a_cola.qc
          grep -F 'XZIEL_StartFireSaleLogic' build/deps/quakec/source/server/entities/powerups.qc
          grep -F 'XZIEL_FireSaleLogicActive' build/deps/quakec/source/server/entities/powerups.qc
          grep -F 'XZIEL_WunderfizzPickSupportedPerk' build/deps/quakec/source/server/entities/perk_a_cola.qc
          grep -F 'XZIEL_WunderfizzGrantLogic' build/deps/quakec/source/server/entities/perk_a_cola.qc
          grep -F 'XZIEL_WunderfizzTouch' build/deps/quakec/source/server/entities/perk_a_cola.qc
          grep -F 'void() xziel_wunderfizz' build/deps/quakec/source/server/entities/perk_a_cola.qc
          grep -F 'XZIEL_GobbleGumCurrentPrice' build/deps/quakec/source/server/entities/perk_a_cola.qc
          grep -F 'XZIEL_GobbleGumRollIdentity' build/deps/quakec/source/server/entities/perk_a_cola.qc
          grep -F 'XZIEL_GobbleGumMappedPowerupSemantic' build/deps/quakec/source/server/entities/perk_a_cola.qc
          grep -F 'XZIEL_GobbleGumMappedActivationCount' build/deps/quakec/source/server/entities/perk_a_cola.qc
          grep -F 'XZIEL_GobbleGumSpawnMappedPowerup' build/deps/quakec/source/server/entities/perk_a_cola.qc
          grep -F 'XZIEL_GobbleGumActivateHeldMappedPowerup' build/deps/quakec/source/server/entities/perk_a_cola.qc
          grep -F 'XZIEL_GobbleGumHeldUsesRemaining' build/deps/quakec/source/server/entities/perk_a_cola.qc
          grep -F 'XZIEL_GOBBLEGUM_PLAYER_STATE_BEGIN' build/deps/quakec/source/server/defs/custom.qc
          grep -F 'XZIEL_DEATH_MACHINE_STATE_RUNTIME_BEGIN' build/deps/quakec/source/server/utilities/weapon_utilities.qc
          grep -F 'XZIEL_DEATH_MACHINE_BLOCK_WALLBUY' build/deps/quakec/source/server/entities/wall_weapon.qc
          grep -F 'XZIEL_DEATH_MACHINE_BLOCK_MBOX' build/deps/quakec/source/server/entities/mystery_box.qc
          grep -F 'XZIEL_DEATH_MACHINE_BLOCK_PERK' build/deps/quakec/source/server/entities/perk_a_cola.qc
          grep -F 'XZIEL_DEATH_MACHINE_BLOCK_PAP' build/deps/quakec/source/server/entities/pack_a_punch.qc
          grep -F 'XZIEL_DEATH_MACHINE_BLOCK_BARRICADE' build/deps/quakec/source/server/entities/window.qc
          grep -F 'XZIEL_DEATH_MACHINE_BLOCK_REVIVE' build/deps/quakec/source/server/player/last_stand.qc
          grep -F 'XZIEL_DEATH_MACHINE_SWITCH_CANCEL' build/deps/quakec/source/server/weapons/weapon_core.qc
          grep -F 'XZIEL_DeathMachineAdjustDamage' build/deps/quakec/source/server/utilities/weapon_utilities.qc
          grep -F 'XZIEL_DEATH_MACHINE_DAMAGE_HOOK' build/deps/quakec/source/server/damage.qc
          grep -F '0.34 + (random() * 0.41)' build/deps/quakec/source/server/utilities/weapon_utilities.qc
          unzip -l build/android-project/app/src/main/assets/nzp-data.zip \
            | grep 'nzp/maps/xziel_nacht_bo3.bsp'
          unzip -l build/android-project/app/src/main/assets/nzp-data.zip \
            | grep -F 'nzp/xziel/weapons/nacht_prototype_box_pool_v1.json'
          unzip -l build/android-project/app/src/main/assets/nzp-data.zip \
            | grep -F 'nzp/xziel/weapons/xziel_weapon_id_registry_v1.json'
          unzip -l build/android-project/app/src/main/assets/nzp-data.zip \
            | grep -F 'nzp/xziel/weapons/xziel_mystery_box_runtime_pool_v1.json'
          unzip -l build/android-project/app/src/main/assets/nzp-data.zip \
            | grep -F 'nzp/maps/xziel_nacht_bo3.mb2'

      - name: Build Nacht harness APK
        working-directory: build/android-project
        shell: bash
        run: ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Collect Nacht APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/android-project/app/build/outputs/apk/debug/app-debug.apk \
            dist/XZIEL-Engine-Nacht-Gameplay-Harness-debug.apk
          ls -lh dist/XZIEL-Engine-Nacht-Gameplay-Harness-debug.apk

      - name: Boot Nacht harness on Android
        id: smoke
        continue-on-error: true
        shell: bash
        env:
          ANDROID_AVD_HOME: ${{ runner.temp }}/xziel-nacht-avd
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_AVD_HOME" dist
          ADB="${ANDROID_HOME}/platform-tools/adb"
          EMULATOR="${ANDROID_HOME}/emulator/emulator"
          AVDMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name avdmanager | sort | tail -n 1)"

          printf 'no\n' | "$AVDMANAGER" create avd \
            --force \
            --name xziel-nacht-ci \
            --package "system-images;android-35;google_apis;x86_64" \
            --device "pixel_6"

          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm || true
          fi

          nohup "$EMULATOR" \
            @xziel-nacht-ci \
            -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect -memory 2048 \
            > dist/emulator-stdout.txt 2>&1 &
          EMU_PID=$!

          sleep 5
          kill -0 "$EMU_PID"
          timeout 120 "$ADB" wait-for-device

          for i in $(seq 1 60); do
            if [[ "$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]]; then
              break
            fi
            sleep 2
          done
          test "$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1"

          "$ADB" install -r dist/XZIEL-Engine-Nacht-Gameplay-Harness-debug.apk
          "$ADB" shell settings put system accelerometer_rotation 0 || true
          "$ADB" shell settings put system user_rotation 1 || true
          "$ADB" shell settings put secure immersive_mode_confirmations confirmed || true
          "$ADB" logcat -c
          "$ADB" shell am force-stop com.xziel.engine || true
          "$ADB" shell am start -W \
            -n com.xziel.engine/org.libsdl.app.NZPActivity \
            --es xziel_ci_map xziel_nacht_bo3 \
            --ez xziel_ci_hud_preview true \
            > dist/am-start.txt 2>&1 || true

          STAGE=""
          for i in $(seq 1 60); do
            STAGE="$("$ADB" shell run-as com.xziel.engine \
              cat files/nzp-runtime/.xziel-stage 2>/dev/null | tr -d '\r' || true)"
            if [[ "$STAGE" == "FIRST_FRAME_OK" ]]; then
              break
            fi
            sleep 2
          done

          # FIRST_FRAME_OK proves the game loop is alive, but SwiftShader can
          # still be presenting a transient black surface while XZIEL Phase 16
          # validates native ownership. Wait for the same stable MODERN proof
          # used by the main Android workflow before judging visual output.
          MODERN_VISUAL_READY=0
          for i in $(seq 1 60); do
            "$ADB" logcat -d -v threadtime > dist/nacht-logcat-previsual.txt || true
            if grep -Eq "XZIEL-XZ.*parity present context=1 attempts=[1-9][0-9]* success=[1-9][0-9]* fail=0 draws=[1-9][0-9]* streak=([2-9]|[1-9][0-9]+)" dist/nacht-logcat-previsual.txt \
              && grep -Eq "XZIEL-XZ.*phase16 heartbeat requested=MODERN active=MODERN candidate=1 allowed=1 caps=0xff blockers=0x0 .*legacyVisible=0" dist/nacht-logcat-previsual.txt; then
              MODERN_VISUAL_READY=1
              break
            fi
            sleep 2
          done

          if [[ "$MODERN_VISUAL_READY" != "1" ]]; then
            echo "Nacht harness never reached stable MODERN visual ownership."
            grep -E "XZIEL-XZ.*parity geometry|XZIEL-XZ.*parity texture|XZIEL-XZ.*parity shadows|XZIEL-XZ.*parity present|XZIEL-XZ.*phase16 heartbeat" \
              dist/nacht-logcat-previsual.txt | tail -n 260 || true
            exit 1
          fi

          sleep 3

          python3 -m pip install --quiet pillow==11.3.0
          : > dist/nacht-visual-report.txt
          VISUAL_OK=0

          for attempt in $(seq 1 6); do
            "$ADB" exec-out screencap -p > dist/nacht-harness-a.png || true
            sleep 3
            "$ADB" exec-out screencap -p > dist/nacht-harness-b.png || true

            if ATTEMPT="$attempt" python3 - <<'PY' >> dist/nacht-visual-report.txt 2>&1
          import os
          from pathlib import Path
          from PIL import Image, ImageChops, ImageStat

          attempt=os.environ.get("ATTEMPT","?")
          paths=[Path("dist/nacht-harness-a.png"),Path("dist/nacht-harness-b.png")]
          images=[]

          for path in paths:
              im=Image.open(path).convert("RGB")
              if im.height > im.width:
                  im=im.transpose(Image.Transpose.ROTATE_90)

              if im.width < 1000 or im.height < 500 or im.width <= im.height:
                  raise SystemExit(f"attempt={attempt} invalid dimensions: {path} {im.size}")

              gray=im.convert("L")
              stat=ImageStat.Stat(gray)
              lo,hi=gray.getextrema()
              if hi-lo < 24 or stat.stddev[0] < 8:
                  raise SystemExit(
                      f"attempt={attempt} blank/flat: {path} "
                      f"extrema={(lo,hi)} std={stat.stddev[0]:.2f}"
                  )

              images.append(im)
              print(
                  f"attempt={attempt} {path.name}: size={im.size} "
                  f"mean={stat.mean[0]:.2f} std={stat.stddev[0]:.2f} "
                  f"extrema={(lo,hi)}"
              )

          diff=ImageChops.difference(images[0],images[1]).convert("L")
          dstat=ImageStat.Stat(diff)
          print(
              f"attempt={attempt} frame_delta_mean={dstat.mean[0]:.3f} "
              f"frame_delta_std={dstat.stddev[0]:.3f}"
          )
          PY
            then
              VISUAL_OK=1
              cp dist/nacht-harness-a.png dist/nacht-harness.png
              break
            fi

            sleep 4
          done

          cat dist/nacht-visual-report.txt

          "$ADB" logcat -d -v threadtime > dist/nacht-logcat.txt || true

          PID="$("$ADB" shell pidof com.xziel.engine 2>/dev/null | tr -d '\r' || true)"
          echo "PID=$PID" | tee dist/runtime-state.txt
          echo "STAGE=$STAGE" | tee -a dist/runtime-state.txt
          echo "MODERN_VISUAL_READY=$MODERN_VISUAL_READY" | tee -a dist/runtime-state.txt
          echo "VISUAL_OK=$VISUAL_OK" | tee -a dist/runtime-state.txt

          grep -Ei "xziel_nacht_bo3|nacht runtime active|mapRuntime=NACHT_BO3|Fatal signal|FATAL EXCEPTION" \
            dist/nacht-logcat.txt > dist/nacht-runtime-highlights.txt || true
          cat dist/nacht-runtime-highlights.txt

          if grep -Eq "Fatal signal|FATAL EXCEPTION|stage=SYS_ERROR" dist/nacht-logcat.txt; then
            echo "Detected Nacht harness crash."
            exit 1
          fi

          test -n "$PID"
          test "$STAGE" = "FIRST_FRAME_OK"
          grep -Eq "map='xziel_nacht_bo3' mapRuntime=NACHT_BO3" dist/nacht-logcat.txt
          grep -Eq "nacht runtime active points=500 zones=0x1 spawns=10 purchases=9 doors=3 barricades=12" \
            dist/nacht-logcat.txt

          if [[ "$VISUAL_OK" != "1" ]]; then
            echo "Nacht harness remained blank/flat after stable MODERN ownership and all capture retries."
            grep -E "XZIEL-XZ.*parity geometry|XZIEL-XZ.*parity texture|XZIEL-XZ.*parity present|XZIEL-XZ.*phase16 heartbeat" \
              dist/nacht-logcat.txt | tail -n 220 || true
            exit 1
          fi

      - name: Upload Nacht gameplay harness
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XZIEL-Engine-Nacht-Gameplay-Harness
          path: |
            dist/XZIEL-Engine-Nacht-Gameplay-Harness-debug.apk
            dist/nacht-harness.png
            dist/nacht-harness-a.png
            dist/nacht-harness-b.png
            dist/nacht-logcat.txt
            dist/nacht-logcat-previsual.txt
            dist/nacht-runtime-highlights.txt
            dist/nacht-visual-report.txt
            dist/runtime-state.txt
            dist/am-start.txt
            dist/emulator-stdout.txt
            nacht-ci/xziel_nacht_bo3.map
            nacht-ci/xziel_nacht_bo3.bsp
            nacht-ci/xziel_nacht_bo3.mb2
            nacht-ci/xziel_nacht_bo3_harness.json
            nacht-ci/export.log
            nacht-ci/compile.log
          if-no-files-found: warn
          retention-days: 14

      - name: Fail on Nacht smoke failure
        if: steps.smoke.outcome == 'failure'
        shell: bash
        run: exit 1
