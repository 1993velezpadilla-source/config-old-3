name: XChurch API35 ARM Translation Capture

on:
  workflow_dispatch:
  push:
    branches:
      - feature/boz-mod-runtime
    paths:
      - ".github/workflows/boz-xchurch-api35-translation.yml"
      - "tools/boz_mod/run_api35_capture.sh"

permissions:
  actions: read
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5

      - name: Enable KVM
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm || true

      - name: Download signed XChurch APK
        uses: actions/download-artifact@v4
        with:
          name: XZIEL-BOZ-XChurch-APK
          run-id: 36768068731
          github-token: ${{ github.token }}
          path: /tmp/xchurch-apk

      - name: Prepare output
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/xchurch-api35/screens
          APK="$(find /tmp/xchurch-apk -type f -name '*.apk' | head -n1)"
          test -s "$APK"
          cp "$APK" /tmp/xchurch-api35/xchurch.apk
          sha256sum /tmp/xchurch-api35/xchurch.apk | tee /tmp/xchurch-api35/apk.sha256

      - name: Boot API35 x86_64 with ARM translation and capture XChurch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          cores: 2
          ram-size: 3072M
          emulator-boot-timeout: 420
          disable-animations: false
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -no-metrics
          script: bash tools/boz_mod/run_api35_capture.sh

      - name: Summary
        if: always()
        shell: bash
        run: |
          set +e
          cat /tmp/xchurch-api35/device.txt 2>/dev/null || true
          cat /tmp/xchurch-api35/status.txt 2>/dev/null || true
          ls -lh /tmp/xchurch-api35/screens 2>/dev/null || true
          tail -120 /tmp/xchurch-api35/logcat-highlights.txt 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: XChurch-API35-ARM-Translation-Proof
          path: /tmp/xchurch-api35/
          if-no-files-found: error
          retention-days: 14
