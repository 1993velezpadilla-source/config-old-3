name: Xogot All 28 Gun Grip Orientation Gate

on:
  workflow_dispatch:
  push:
    branches:
      - fix/source-viewmodel-inherited-hands-unit-scale
    paths:
      - "xogot/scripts/weapon.gd"
      - "xogot/scripts/weapon_asset_registry.gd"
      - "xogot/ci/aaa_weapon_runtime_probe.gd"
      - "xogot/assets/weapons/mapmod_weapon_asset_manifest.json"
      - ".github/workflows/xogot-all-weapon-grip-orientation-gate.yml"

permissions:
  contents: read

concurrency:
  group: xogot-all-28-source-gun-grips-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-grip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v5

      - name: Install Godot 4.6.1
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --retry-all-errors --retry-delay 2 \
            https://github.com/godotengine/godot-builds/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip \
            -o /tmp/godot.zip
          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.6.1-stable_linux.x86_64

      - name: Import and parse Godot project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/source-grip
          timeout 240 /tmp/godot/Godot_v4.6.1-stable_linux.x86_64 \
            --headless --editor --path xogot --quit \
            2>&1 | tee build/source-grip/import.log
          ! grep -E "SCRIPT ERROR|Parse Error|ERROR: Failed to load script" build/source-grip/import.log

      - name: Test source hand grip and meter-space geometry across all 28 firearms
        shell: bash
        run: |
          set -euo pipefail
          timeout 240 /tmp/godot/Godot_v4.6.1-stable_linux.x86_64 \
            --headless --path xogot --script res://ci/aaa_weapon_runtime_probe.gd \
            2>&1 | tee build/source-grip/guns.log
          grep -q "XZOGOT_AAA_28_FIREARMS_GREEN 28" build/source-grip/guns.log
          grep -q "XZOGOT_ALL_28_GUNS_GRIP_BASIS_GREEN count=28" build/source-grip/guns.log
          test "$(grep -c 'XZOGOT_ALL_GUNS_GRIP_BASIS_GREEN ' build/source-grip/guns.log)" -eq 28
          ! grep -E "SCRIPT ERROR|Parse Error|AAA_WEAPON_RUNTIME_PROBE:" build/source-grip/guns.log

      - name: Upload complete evidence even on RED
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Xogot-All-28-Guns-Source-Grip-Gauntlet
          path: build/source-grip/*.log
          if-no-files-found: warn
          retention-days: 14
