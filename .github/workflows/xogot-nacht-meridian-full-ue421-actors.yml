name: Xogot Nacht FULL 10793 UE421 Actors Meridian to Godot (Research)

on:
  workflow_dispatch:
  push:
    branches:
      - research/nacht-bo3-meridian-source-bridge-20261009
    paths:
      - ".github/workflows/xogot-nacht-meridian-full-ue421-actors.yml"
      - "tools/maps/nacht_meridian_source_bridge.py"
      - "tools/maps/validate_meridian_nacht_gltf.py"
      - "tools/maps/restore_nacht_source_affine.py"
      - "tools/maps/validate_meridian_full_scene_affine.py"

permissions:
  contents: read
  actions: read

jobs:
  real-pavlov-source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: "37762871109"
      SOURCE_ARTIFACT: "Xogot-Nacht-Chronicles-Godot-Runtime"
    steps:
      - uses: actions/checkout@v5
      - name: Require independent 493 distinct real geometry Godot gate GREEN
        shell: bash
        run: |
          set -euo pipefail
          CONCLUSION=$(gh run view 37932825571 --json conclusion --jq '.conclusion')
          test "$CONCLUSION" = success
          echo "XZOGOT_NACHT_493_DISTINCT_SOURCE_DEPENDENCY_GREEN run=37932825571"
      - name: Reuse original archived 2.1GB Pavlov UE4.21 real source (not BO3 T7)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/real-ue4-source" build/nacht-meridian-real
          gh run download "$SOURCE_RUN" -n "$SOURCE_ARTIFACT"             -D "$RUNNER_TEMP/real-ue4-source"             2>&1 | tee build/nacht-meridian-real/source-download.log
          SRC=$(find "$RUNNER_TEMP/real-ue4-source" -type f -name nacht-static-scene.json -print -quit)
          MESHES=$(find "$RUNNER_TEMP/real-ue4-source" -type d -name meshes_glb -print -quit)
          test -s "$SRC"
          test -d "$MESHES"
          echo "UE_SCENE=$SRC" >> "$GITHUB_ENV"
          echo "UE_MESHES=$MESHES" >> "$GITHUB_ENV"
          python3 - "$SRC" "$MESHES" <<'PY'
          import json,sys,pathlib
          data=json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert data['format']=='xziel_visual_scene_v1',data.get('format')
          assert data['summary']['ready'] is True
          assert len(data['instances'])==10793,len(data['instances'])
          assert len(data['meshes'])==493,len(data['meshes'])
          assert len({int(r['meshIndex']) for r in data['instances']})==493
          assert len({str(r['instanceId']) for r in data['instances']})==10793
          missing=[]
          for m in data['meshes']:
              fn=pathlib.Path(m['runtimeFile']).stem+'.glb'
              p=pathlib.Path(sys.argv[2])/fn
              if not p.is_file():missing.append(str(p))
          assert not missing, ('native-GLB missing',missing[:5])
          print('XZOGOT_NACHT_REAL_PAVLOV_SOURCE_READY',
                'instances=',len(data['instances']),
                'meshes=',len(data['meshes']),
                'all493_NativeGLBs_present=true')
          print('XZOGOT_NACHT_NOT_2017_BO3_T7_SOURCE')
          PY
      - name: Gate original complete source scene - 10793 unique actors and 493 mesh types
        shell: bash
        run: |
          set -euo pipefail
          test -s "$UE_SCENE"
          test -d "$UE_MESHES"
          echo "XZOGOT_NACHT_FULL_PAVLOV_SOURCE_10793_ACTORS_493_MESHES_GREEN"
      - name: Install pin-blender and independently pinned Meridian
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1-mesa-dri libglx-mesa0 libegl1 libxi6 libxrender1 libsm6 libxxf86vm1 libxfixes3 unzip
          python3 -m pip install --disable-pip-version-check blender-downloader
          BLENDER=$(blender-downloader 5.0 --extract --remove-compressed --print-blender-executable)
          test -x "$BLENDER"
          echo "BLENDER=$BLENDER" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/addon-source"
          git clone https://github.com/Naxela/Meridian.git "$RUNNER_TEMP/addon-source/Meridian"
          git -C "$RUNNER_TEMP/addon-source/Meridian" checkout --detach af7749fe03c6c595f67c991628a5892a200eb8ee
          echo "MERIDIAN_PARENT=$RUNNER_TEMP/addon-source" >> "$GITHUB_ENV"
      - name: Compile native source UE actors and actual GLBs with Meridian 2.0
        shell: bash
        run: |
          set -euo pipefail
          "$BLENDER" --background --factory-startup             --python tools/maps/nacht_meridian_source_bridge.py --             --scene "$UE_SCENE" --mesh-root "$UE_MESHES"             --meridian-parent "$MERIDIAN_PARENT"             --out "$PWD/build/nacht-meridian-real"             --max-instances 10793             2>&1 | tee build/nacht-meridian-real/blender-real-source.log
          grep -q "XZOGOT_NACHT_MERIDIAN_REAL_ADDON_COMPILE_GREEN test_fixture= False"             build/nacht-meridian-real/blender-real-source.log
          python3 tools/maps/validate_meridian_nacht_gltf.py             --glb build/nacht-meridian-real/godot/assets/meshes/Nacht_Source_Bridge_Probe.glb             --report build/nacht-meridian-real/source-equivalence.json             --output build/nacht-meridian-real/transform-parity.json             2>&1 | tee build/nacht-meridian-real/transform-parity.log
          grep -q "XZOGOT_NACHT_MERIDIAN_SOURCE_XFORM_GREEN"             build/nacht-meridian-real/transform-parity.log
          python3 tools/maps/validate_meridian_full_scene_affine.py \
            --scene "$UE_SCENE" \
            --glb build/nacht-meridian-real/godot/assets/meshes/Nacht_Source_Bridge_Probe.glb \
            --expected-count 10793 \
            --output build/nacht-meridian-real/full-affine-parity.json \
            2>&1 | tee build/nacht-meridian-real/full-affine-parity.log
          grep -q "XZOGOT_NACHT_FULL_SOURCE_AFFINE_PARITY_GREEN" \
            build/nacht-meridian-real/full-affine-parity.log
          python3 - <<'PY'
          import json
          p=json.load(open('build/nacht-meridian-real/source-equivalence.json'))
          assert p["exported_instance_count"] == 10793,p["exported_instance_count"]
          assert p["exported_mesh_references"] == 493,p["exported_mesh_references"]
          assert p["made_up_source_objects"] is False
          print("XZOGOT_NACHT_FULL_SOURCE_NO_SYNTHETIC_PROPS_GREEN")
          PY
          echo "XZOGOT_NACHT_REAL_PAVLOV_FULL_ACTORS_TO_MERIDIAN_GREEN"
      - name: Declare exactly what this phase does NOT approve
        run: |
          echo "Full 10793 source affine matrices and GLB node/mesh attachment parity only."
          echo "Original native mesh type geometry parity is independently GREEN for all 493 types."
          echo "Full per-instance geometry parity, material/lighting, collisions, FPS, gameplay, shipping APK NOT YET PROVEN."
          echo "XZOGOT_NACHT_FULL_ACTOR_GATE_SCOPE_EXPLICIT"
      - name: Import all 10793 real actor mesh nodes in Godot 4.6.1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          curl --fail -L --retry 3 -o "$RUNNER_TEMP/godot/godot.zip" \
            https://github.com/godotengine/godot-builds/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip
          unzip -q "$RUNNER_TEMP/godot/godot.zip" -d "$RUNNER_TEMP/godot"
          GODOT="$RUNNER_TEMP/godot/Godot_v4.6.1-stable_linux.x86_64"
          chmod +x "$GODOT"
          "$GODOT" --headless --path build/nacht-meridian-real/godot --import \
            2>&1 | tee build/nacht-meridian-real/godot-real-import.log
          ! grep -E "SCRIPT ERROR|Parse Error|ERROR: Failed to load" build/nacht-meridian-real/godot-real-import.log
          cat > build/nacht-meridian-real/godot/real_source_gate.gd <<'GDS'
          extends SceneTree
          func _initialize() -> void:
              call_deferred("_run")
          func _run() -> void:
              var pack: PackedScene = load("res://scenes/main.tscn") as PackedScene
              if pack == null:
                  push_error("XZOGOT_MERIDIAN_REAL_NACHT_SCENE_LOAD_RED")
                  quit(4)
                  return
              var world: Node = pack.instantiate()
              get_root().add_child(world)
              var meshes := world.find_children("*", "MeshInstance3D", true, false).size()
              if meshes < 10793:
                  push_error("XZOGOT_MERIDIAN_REAL_NACHT_MESH_LOSS count=" + str(meshes))
                  quit(5)
                  return
              print("XZOGOT_NACHT_REAL_MERIDIAN_GODOT_4_6_GREEN actors=10793 meshes=",meshes)
              world.queue_free()
              quit(0)
          GDS
          "$GODOT" --headless --path build/nacht-meridian-real/godot \
            --script res://real_source_gate.gd \
            2>&1 | tee build/nacht-meridian-real/godot-real-runtime.log
          grep -q "XZOGOT_NACHT_REAL_MERIDIAN_GODOT_4_6_GREEN" \
            build/nacht-meridian-real/godot-real-runtime.log
      - name: Preserve all real source comparison evidence even on RED
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nacht-UE421-Full-10793-Actor-Source-Meridian-Affine-Godot
          path: |
            build/nacht-meridian-real/source-download.log
            build/nacht-meridian-real/blender-real-source.log
            build/nacht-meridian-real/source-equivalence.json
            build/nacht-meridian-real/transform-parity.*
            build/nacht-meridian-real/full-affine-parity.*
            build/nacht-meridian-real/godot-real-import.log
            build/nacht-meridian-real/godot-real-runtime.log
            build/nacht-meridian-real/godot/project.godot
            build/nacht-meridian-real/godot/scenes/*.tscn
            build/nacht-meridian-real/godot/assets/meshes/*.glb
          if-no-files-found: warn
          retention-days: 7
