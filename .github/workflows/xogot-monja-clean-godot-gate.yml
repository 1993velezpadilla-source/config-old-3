name: Verify Clean Monja Rig in Godot

on:
  workflow_dispatch:
  push:
    branches:
      - feature/church-expansion-v1
    paths:
      - "xogot/assets/zombies/monja_clean/**"
      - ".github/workflows/xogot-monja-clean-godot-gate.yml"

permissions:
  contents: read

concurrency:
  group: xogot-monja-clean-godot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Install host tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip curl

      - name: Install Godot 4.6.1
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --retry-all-errors --retry-delay 2             https://github.com/godotengine/godot-builds/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip             -o /tmp/godot.zip
          rm -rf /tmp/godot
          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.6.1-stable_linux.x86_64
          /tmp/godot/Godot_v4.6.1-stable_linux.x86_64 --version

      - name: Import clean Monja asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/monja-clean-godot
          timeout 180 /tmp/godot/Godot_v4.6.1-stable_linux.x86_64             --headless --editor --path xogot --quit             2>&1 | tee build/monja-clean-godot/import.log
          ! grep -E "SCRIPT ERROR|Parse Error|ERROR: Failed to load script" build/monja-clean-godot/import.log

      - name: Verify skeleton and animations
        shell: bash
        run: |
          set -euo pipefail
          timeout 90 /tmp/godot/Godot_v4.6.1-stable_linux.x86_64             --headless --path xogot --script res://ci/monja_clean_rig_probe.gd             2>&1 | tee build/monja-clean-godot/probe.log
          grep -q "XZOGOT_MONJA_CLEAN_GODOT_SKELETON_GREEN" build/monja-clean-godot/probe.log
          grep -q "XZOGOT_MONJA_CLEAN_GODOT_ANIMS_GREEN" build/monja-clean-godot/probe.log
          grep -q "XZOGOT_MONJA_CLEAN_GODOT_GATE_GREEN" build/monja-clean-godot/probe.log
          ! grep -E "SCRIPT ERROR|Parse Error|ERROR: Failed to load script|MONJA_CLEAN_RIG_PROBE:" build/monja-clean-godot/probe.log

      - name: Upload Godot proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monja-clean-godot-proof
          path: build/monja-clean-godot/
          if-no-files-found: warn
          retention-days: 14
