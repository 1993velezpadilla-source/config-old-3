name: XChurch macOS ARM64 Fast Capture

on:
  workflow_dispatch:
  push:
    branches:
      - feature/boz-mod-runtime
    paths:
      - ".github/workflows/boz-xchurch-macos-fast.yml"

permissions:
  actions: read
  contents: read

jobs:
  capture:
    runs-on: macos-14
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v5

      - name: Host proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/xchurch-fast/screens
          uname -a | tee /tmp/xchurch-fast/host.txt
          uname -m | tee -a /tmp/xchurch-fast/host.txt
          test "$(uname -m)" = "arm64"

      - name: Download signed XChurch APK
        uses: actions/download-artifact@v4
        with:
          name: XZIEL-BOZ-XChurch-APK
          run-id: 36768068731
          github-token: ${{ github.token }}
          path: /tmp/xchurch-apk

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find /tmp/xchurch-apk -type f -name '*.apk' | head -n1)"
          test -s "$APK"
          cp "$APK" /tmp/xchurch-fast/xchurch.apk
          shasum -a 256 /tmp/xchurch-fast/xchurch.apk | tee /tmp/xchurch-fast/apk.sha256

          SDK="$HOME/Library/Android/sdk"
          mkdir -p "$SDK"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -n1 || true)"
          if [[ -z "$SDKMANAGER" ]]; then
            curl -L --fail --retry 3               -o /tmp/android-cli.zip               https://dl.google.com/android/repository/commandlinetools-mac-11076708_latest.zip
            rm -rf /tmp/android-cli
            mkdir -p /tmp/android-cli "$SDK/cmdline-tools/latest"
            unzip -q /tmp/android-cli.zip -d /tmp/android-cli
            cp -a /tmp/android-cli/cmdline-tools/. "$SDK/cmdline-tools/latest/"
            SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/emulator" >> "$GITHUB_PATH"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER"             "platform-tools"             "emulator"             "system-images;android-30;google_apis;arm64-v8a"

      - name: Create and boot ARM64 AVD
        shell: bash
        run: |
          set -euo pipefail
          SDK="$ANDROID_HOME"
          ADB="$SDK/platform-tools/adb"
          EMULATOR="$SDK/emulator/emulator"
          AVDMANAGER="$(find "$SDK/cmdline-tools" -type f -name avdmanager | sort | tail -n1)"
          test -x "$ADB"
          test -x "$EMULATOR"
          test -x "$AVDMANAGER"

          export ANDROID_AVD_HOME=/tmp/xchurch-avd
          mkdir -p "$ANDROID_AVD_HOME"
          printf 'no\n' | "$AVDMANAGER" create avd             --force             --name xchurch-arm64             --package "system-images;android-30;google_apis;arm64-v8a"             --device "pixel_2"

          "$EMULATOR" -version | tee /tmp/xchurch-fast/emulator-version.txt
          nohup "$EMULATOR"             @xchurch-arm64             -no-window             -noaudio             -no-boot-anim             -no-snapshot             -accel off             -gpu swiftshader_indirect             -no-metrics             > /tmp/xchurch-fast/emulator.log 2>&1 &
          echo $! > /tmp/xchurch-fast/emulator.pid

          READY=0
          for i in $(seq 1 120); do
            if "$ADB" get-state 2>/dev/null | grep -q '^device$'; then
              READY=1
              break
            fi
            sleep 3
          done
          echo "ADB_READY=$READY" | tee /tmp/xchurch-fast/status.txt
          test "$READY" = "1"

          BOOT=0
          for i in $(seq 1 120); do
            if [[ "$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]]; then
              BOOT=1
              break
            fi
            sleep 3
          done
          echo "BOOT_COMPLETED=$BOOT" | tee -a /tmp/xchurch-fast/status.txt
          test "$BOOT" = "1"

          {
            echo "ABI=$("$ADB" shell getprop ro.product.cpu.abi | tr -d '\r')"
            echo "ABILIST=$("$ADB" shell getprop ro.product.cpu.abilist | tr -d '\r')"
            echo "SDK=$("$ADB" shell getprop ro.build.version.sdk | tr -d '\r')"
          } | tee /tmp/xchurch-fast/device.txt

      - name: Install, launch and capture BOZ XChurch
        shell: bash
        run: |
          set +e
          ADB="$ANDROID_HOME/platform-tools/adb"
          OUT=/tmp/xchurch-fast

          "$ADB" install -r -d "$OUT/xchurch.apk" > "$OUT/install.log" 2>&1
          INSTALL_RC=$?
          echo "INSTALL_RC=$INSTALL_RC" | tee -a "$OUT/status.txt"
          cat "$OUT/install.log" | tee -a "$OUT/status.txt"

          if [[ "$INSTALL_RC" -eq 0 ]]; then
            "$ADB" shell settings put system accelerometer_rotation 0 || true
            "$ADB" shell settings put system user_rotation 1 || true
            "$ADB" shell pm grant com.activision.boz android.permission.WRITE_EXTERNAL_STORAGE 2>/dev/null || true
            "$ADB" shell pm grant com.activision.boz android.permission.READ_EXTERNAL_STORAGE 2>/dev/null || true
            "$ADB" shell appops set com.activision.boz MANAGE_EXTERNAL_STORAGE allow 2>/dev/null || true
            "$ADB" shell mkdir -p /sdcard/Android/obb/com.activision.boz 2>/dev/null || true

            "$ADB" logcat -c
            "$ADB" shell am force-stop com.activision.boz
            "$ADB" shell am start -W -n com.activision.boz/.Main > "$OUT/am-start.txt" 2>&1
            START_RC=$?
            echo "START_RC=$START_RC" | tee -a "$OUT/status.txt"
            cat "$OUT/am-start.txt" | tee -a "$OUT/status.txt"

            sleep 5
            "$ADB" exec-out screencap -p > "$OUT/screens/boot_05s.png"
            sleep 10
            "$ADB" exec-out screencap -p > "$OUT/screens/boot_15s.png"
            sleep 15
            "$ADB" exec-out screencap -p > "$OUT/screens/boot_30s.png"
          else
            "$ADB" exec-out screencap -p > "$OUT/screens/install_failure.png"
          fi

          "$ADB" logcat -d -v threadtime > "$OUT/logcat.txt" 2>&1
          "$ADB" shell dumpsys activity activities > "$OUT/activities.txt" 2>&1
          "$ADB" shell dumpsys window windows > "$OUT/window.txt" 2>&1
          PID="$("$ADB" shell pidof com.activision.boz 2>/dev/null | tr -d '\r' || true)"
          echo "PID=$PID" | tee -a "$OUT/status.txt"

          grep -Eai             'FATAL EXCEPTION|Fatal signal|SIGSEGV|SIGABRT|UnsatisfiedLinkError|dlopen failed|xchurch|kino|Marmalade|s3e|activision|boz'             "$OUT/logcat.txt" | tail -300 > "$OUT/logcat-highlights.txt" || true

          exit 0

      - name: Capture result summary
        if: always()
        shell: bash
        run: |
          set +e
          cat /tmp/xchurch-fast/status.txt 2>/dev/null || true
          ls -lh /tmp/xchurch-fast/screens 2>/dev/null || true
          cat /tmp/xchurch-fast/logcat-highlights.txt 2>/dev/null | tail -120 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: XChurch-macOS-ARM64-Fast-Capture
          path: /tmp/xchurch-fast/
          if-no-files-found: error
          retention-days: 14
