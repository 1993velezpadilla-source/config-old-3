name: XZIEL Tripo Church Mini - Android Native

on:
  workflow_dispatch:
  push:
    branches:
      - feature/xziel-tripo-church-mini-20261020
    paths:
      - ".github/workflows/xziel-tripo-church-mini-apk.yml"
      - "tools/church_mini/**"
      - "scripts/patch_vril_church_mini.py"
      - "scripts/prepare_android.sh"

permissions:
  contents: read

concurrency:
  group: xziel-tripo-church-mini-${{ github.sha }}
  cancel-in-progress: true

jobs:
  native-church-mini:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - name: Checkout native XZIEL and REAL user Tripo church assets
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            scripts
            android
            tools/church_mini
            xogot/assets/environment/church
          sparse-checkout-cone-mode: true

      - name: Verify authentic recovered altar + bench files
        shell: bash
        run: |
          set -euo pipefail
          test -s xogot/assets/environment/church/altar.glb
          test -s xogot/assets/environment/church/bench.glb
          test -s xogot/assets/environment/church/furniture.asset.json
          python3 - <<'PY'
          import json, struct
          from pathlib import Path
          root=Path("xogot/assets/environment/church")
          for name in ("bench.glb","altar.glb"):
              with (root/name).open("rb") as f:
                  magic,version,n=struct.unpack("<4sII",f.read(12))
              assert magic==b"glTF" and version==2 and n>100000
              print("USER_TRIPO_SOURCE_GLTF_GREEN",name,n)
          data=json.loads((root/"furniture.asset.json").read_text())
          assert {"bench","altar"} <= set(data["assets"])
          PY

      - name: Generate small Quake church from known validated NZP brush rules
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/church_mini/build_map.py tools/church_mini/export_tripo_xzsm.py scripts/patch_vril_church_mini.py
          python3 tools/church_mini/build_map.py
          test -s build/church_mini/sanctum_mini.map

      - name: Export REAL Tripo furniture as mobile XZSM v2
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender
          blender --background --factory-startup --python tools/church_mini/export_tripo_xzsm.py \
            2>&1 | tee build/church_mini/tripo-export.log
          grep -q XZIEL_TRIPO_MINI_EXPORT_GREEN build/church_mini/tripo-export.log
          test -s build/church_mini/nzp/models/xziel/sanctum_mini/sanctum_mini.xzsm
          test -d build/church_mini/nzp/textures/xziel/sanctum_mini
          python3 - <<'PY'
          import json
          d=json.load(open("build/church_mini/nzp/tripo_mini_export.json"))
          assert len(d["assetSources"])==2
          assert {x["kind"] for x in d["assetSources"]}=={"bench","altar"}
          assert d["triangles"]>200 and d["triangles"]<=155000
          assert d["textureCount"]>0
          print("USER_TRIPO_MOBILE_XZSM_GREEN",d["triangles"],d["textureCount"])
          PY

      - name: Compile authentic NZP map BSP and zombie spawn zones
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/nzp-team/assets.git /tmp/nzp-assets
          git clone --depth 1 --recursive https://github.com/nzp-team/spawn-zone-tool.git /tmp/spawn-zone-tool
          python3 -m pip install --quiet -r /tmp/spawn-zone-tool/requirements.txt
          (
            cd /tmp/nzp-assets
            bash tools/compile-wads.sh
            mkdir -p source/maps/sanctum_mini
            cp "$GITHUB_WORKSPACE/build/church_mini/sanctum_mini.map" source/maps/sanctum_mini/
            if [[ ! -x tools/vhlt/hlbsp ]]; then
              wget -q -P tools/ https://github.com/nzp-team/vhlt/releases/download/Vanilla/vhlt-v34-linux-x86_64.zip
              unzip -q tools/vhlt-v34-linux-x86_64.zip -d tools/vhlt/
              chmod +x tools/vhlt/*
            fi
            cd source/maps/sanctum_mini
            ../../../tools/vhlt/hlcsg -threads 8 -nowadtextures -wadautodetect sanctum_mini.map
            ../../../tools/vhlt/hlbsp -threads 8 sanctum_mini.map
            python3 /tmp/spawn-zone-tool/spawn_zone_tool.py sanctum_mini.map --output ../../../common/maps/sanctum_mini.nsz
            mv sanctum_mini.bsp ../../../common/maps/sanctum_mini.bsp
          ) 2>&1 | tee build/church_mini/bsp-compile.log
          test -s /tmp/nzp-assets/common/maps/sanctum_mini.bsp
          test -s /tmp/nzp-assets/common/maps/sanctum_mini.nsz

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android native SDK NDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -name sdkmanager -type f | sort | tail -n1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "emulator" "system-images;android-35;google_apis;x86_64"

      - name: Build original VRIL gameplay with opt-in mini renderer
        env:
          XZIEL_CHURCH_MINI: "1"
          XZIEL_EXTRA_MAP_NAME: sanctum_mini
          XZIEL_EXTRA_MAP_BSP: ${{ github.workspace }}/../dummy
          XZIEL_EXTRA_MAP_NSZ: ${{ github.workspace }}/../dummy
          XZIEL_EXTRA_ASSET_DIR: /tmp/xziel-church-mini-nzp
        shell: bash
        run: |
          set -euo pipefail
          export XZIEL_EXTRA_MAP_BSP="/tmp/nzp-assets/common/maps/sanctum_mini.bsp"
          export XZIEL_EXTRA_MAP_NSZ="/tmp/nzp-assets/common/maps/sanctum_mini.nsz"
          mkdir -p church-mini-dist
          cp -a build/church_mini/nzp /tmp/xziel-church-mini-nzp
          cp build/church_mini/map_report.json church-mini-dist/
          cp build/church_mini/nzp/tripo_mini_export.json church-mini-dist/
          cp build/church_mini/tripo-export.log church-mini-dist/
          cp build/church_mini/bsp-compile.log church-mini-dist/
          # prepare_android.sh intentionally deletes build/. Keep all evidence outside it.
          bash scripts/prepare_android.sh 2>&1 | tee church-mini-dist/native-build.log
          unzip -l build/android-project/app/src/main/assets/nzp-data.zip | grep 'nzp/maps/sanctum_mini.bsp'
          unzip -l build/android-project/app/src/main/assets/nzp-data.zip | grep 'nzp/models/xziel/sanctum_mini/sanctum_mini.xzsm'
          unzip -l build/android-project/app/src/main/assets/nzp-data.zip | grep 'nzp/textures/xziel/sanctum_mini/'

      - name: Configure one-tap landscape APK without changing weapon logic
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          activity=Path("build/android-project/app/src/main/java/org/libsdl/app/NZPActivity.java")
          s=activity.read_text()
          needle='''return new String[] {
                      "-basedir", dataRoot.getAbsolutePath()
                  };'''
          assert s.count(needle)==1, "Expected exact default launcher only"
          s=s.replace(needle,'''return new String[] {
                      "-basedir", dataRoot.getAbsolutePath(),
                      "+map", "sanctum_mini"
                  };''',1)
          assert "SCREEN_ORIENTATION_SENSOR_LANDSCAPE" in s
          activity.write_text(s)
          gradle=Path("build/android-project/app/build.gradle")
          s=gradle.read_text()
          s,n=re.subn(r'applicationId\s+"[^"]+"','applicationId "com.xziel.churchmini"',s,count=1)
          assert n==1
          gradle.write_text(s)
          strings=Path("build/android-project/app/src/main/res/values/strings.xml")
          s=strings.read_text()
          s=re.sub(r'<string name="app_name">.*?</string>','<string name="app_name">XZIEL: Church Mini</string>',s)
          strings.write_text(s)
          PY

      - name: Assemble ARM64 native APK
        shell: bash
        working-directory: build/android-project
        run: ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Preserve native APK and trace evidence
        if: always()
        shell: bash
        run: |
          mkdir -p church-mini-dist
          if [[ -s build/android-project/app/build/outputs/apk/debug/app-debug.apk ]]; then
            cp build/android-project/app/build/outputs/apk/debug/app-debug.apk church-mini-dist/XZIEL-Tripo-Church-Mini-ARM64.apk
            sha256sum church-mini-dist/XZIEL-Tripo-Church-Mini-ARM64.apk > church-mini-dist/XZIEL-Tripo-Church-Mini-ARM64.apk.sha256
          fi

      - name: Upload APK and proof of original Tripo assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XZIEL-Tripo-Church-Mini-Android
          path: |
            church-mini-dist/

          if-no-files-found: warn
          retention-days: 30
