name: XZIEL Engine Android APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/android-native.yml"
      - "android/**"
      - "scripts/**"
      - "engine/**"
      - "tests/**"
      - "README.md"
      - "assets/nacht_enhanced/**"
      - "assets/weapons/**"
      - "tools/weapons/**"
      - "docs/NACHT_ENHANCED*.md"
  push:
    branches:
      - main
      - feature/xz-parity-real-textures
      - feature/xz-parity-visible-present
      - feature/xz-material-lightmap-parity
      - feature/xz-fog-renderstate-parity
      - feature/xz-effects-geometry-parity
      - feature/xz-sky-water-parity
      - feature/xz-legacy-world-retirement
      - feature/xz-legacy-world-suppress
      - feature/xz-shadow-raster-suppress
      - feature/xz-bsp-special-raster-suppress
      - feature/xz-special-raster-suppress
      - feature/xz-full-world-raster-retirement
      - feature/xziel-engine-nacht-runtime-v1
      - feature/xziel-bo3-style-map-loader-v1
    paths:
      - ".github/workflows/android-native.yml"
      - "android/**"
      - "scripts/**"
      - "engine/**"
      - "tests/**"
      - "assets/weapons/**"
      - "tools/weapons/**"
      - "README.md"

concurrency:
  group: xziel-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  build-and-smoke-test:
    name: Build XZIEL Engine APK + Android smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Xziel
        uses: actions/checkout@v5

      - name: Publish CI run pointer
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context="xziel/engine-android" \
            -f description="XZIEL Engine Android build is running" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            >/dev/null || true

      - name: Validate patch scripts
        shell: bash
        run: |
          python3 -m py_compile \
            scripts/patch_vril_mobile_v024.py \
            scripts/patch_quakec_mobile_v024.py \
            scripts/patch_vril_xz_phase0.py

      - name: Test Xz Phase-0 core
        shell: bash
        run: |
          cc -std=c99 -O2 -Wall -Wextra -Werror \
            -Iengine/xz \
            tests/xz_phase0_test.c engine/xz/xz_phase0.c \
            -lm -o /tmp/xz_phase0_test
          /tmp/xz_phase0_test

      - name: Test Xz PresentWorld core
        shell: bash
        run: |
          cc -std=c99 -O2 -Wall -Wextra -Werror \
            -Iengine/xz \
            tests/xz_present_world_test.c engine/xz/xz_present_world.c \
            -o /tmp/xz_present_world_test
          /tmp/xz_present_world_test

      - name: Test Xz DeviceCaps
        shell: bash
        run: |
          cc -std=c99 -O2 -Wall -Wextra -Werror \
            -Iengine/xz \
            tests/xz_device_caps_test.c engine/xz/xz_device_caps.c \
            -o /tmp/xz_device_caps_test
          /tmp/xz_device_caps_test

      - name: Test Xz SceneBudget
        shell: bash
        run: |
          cc -std=c99 -O2 -Wall -Wextra -Werror \
            -Iengine/xz \
            tests/xz_scene_budget_test.c engine/xz/xz_scene_budget.c \
            -o /tmp/xz_scene_budget_test
          /tmp/xz_scene_budget_test

      - name: Test Xz RenderPlan
        shell: bash
        run: |
          cc -std=c99 -O2 -Wall -Wextra -Werror \
            -Iengine/xz \
            tests/xz_render_plan_test.c engine/xz/xz_render_plan.c engine/xz/xz_visibility.c engine/xz/xz_material_lighting.c \
            -o /tmp/xz_render_plan_test
          /tmp/xz_render_plan_test

      - name: Test Xz Visibility
        shell: bash
        run: |
          cc -std=c99 -O2 -Wall -Wextra -Werror \
            -Iengine/xz \
            tests/xz_visibility_test.c engine/xz/xz_visibility.c \
            -o /tmp/xz_visibility_test
          /tmp/xz_visibility_test

      - name: Test Xz MaterialLighting
        shell: bash
        run: |
          cc -std=c99 -O2 -Wall -Wextra -Werror \
            -Iengine/xz \
            tests/xz_material_lighting_test.c \
            engine/xz/xz_material_lighting.c \
            -o /tmp/xz_material_lighting_test
          /tmp/xz_material_lighting_test

      - name: Test Xz ActiveQuality
        shell: bash
        run: |
          cc -std=c99 -O2 -Wall -Wextra -Werror \
            -Iengine/xz \
            tests/xz_active_quality_test.c \
            engine/xz/xz_active_quality.c \
            -o /tmp/xz_active_quality_test
          /tmp/xz_active_quality_test

      - name: Test Xz StreamResidency
        shell: bash
        run: |
          cc -std=c99 -O2 -Wall -Wextra -Werror \
            -Iengine/xz \
            tests/xz_stream_residency_test.c \
            engine/xz/xz_stream_residency.c \
            -o /tmp/xz_stream_residency_test
          /tmp/xz_stream_residency_test

      - name: Test Xz Cutover
        shell: bash
        run: |
          cc -std=c99 -O2 -Wall -Wextra -Werror \
            -Iengine/xz \
            tests/xz_cutover_test.c \
            engine/xz/xz_cutover.c \
            -o /tmp/xz_cutover_test
          /tmp/xz_cutover_test

      - name: Test Xz GeometryTap
        shell: bash
        run: |
          cc -std=c99 -O2 -Wall -Wextra -Werror \
            -Iengine/xz \
            tests/xz_geometry_tap_test.c \
            engine/xz/xz_geometry_tap.c \
            -o /tmp/xz_geometry_tap_test
          /tmp/xz_geometry_tap_test

      - name: Test Xz TextureTap
        shell: bash
        run: |
          cc -std=c99 -O2 -Wall -Wextra -Werror \
            -Iengine/xz \
            tests/xz_texture_tap_test.c \
            engine/xz/xz_texture_tap.c \
            -o /tmp/xz_texture_tap_test
          /tmp/xz_texture_tap_test

      - name: Test Xz Nacht reference runtime
        shell: bash
        run: |
          cc -std=c99 -O2 -Wall -Wextra -Werror \
            -Iengine/xz \
            tests/xz_nacht_reference_test.c \
            engine/xz/xz_nacht_reference.c \
            -lm -o /tmp/xz_nacht_reference_test
          /tmp/xz_nacht_reference_test

      - name: Test XZIEL world transform
        shell: bash
        run: |
          cc -std=c99 -O2 -Wall -Wextra -Werror \
            -Iengine/xz \
            tests/xz_world_transform_test.c \
            engine/xz/xz_world_transform.c \
            -lm -o /tmp/xz_world_transform_test
          /tmp/xz_world_transform_test

      - name: Test XZIEL BO3 weapon registry
        shell: bash
        run: |
          cc -std=c99 -O2 -Wall -Wextra -Werror \
            -Iengine/xz \
            tests/xz_bo3_weapon_specs_test.c \
            engine/xz/xz_bo3_weapon_specs.c \
            -lm -o /tmp/xz_bo3_weapon_specs_test
          /tmp/xz_bo3_weapon_specs_test

      - name: Test XZIEL map identity runtime
        shell: bash
        run: |
          cc -std=c99 -O2 -Wall -Wextra -Werror \
            -Iengine/xz \
            tests/xz_map_runtime_test.c \
            engine/xz/xz_map_runtime.c \
            engine/xz/xz_world_transform.c \
            engine/xz/xz_nacht_reference.c \
            engine/xz/xz_bo3_weapon_specs.c \
            -lm -o /tmp/xz_map_runtime_test
          /tmp/xz_map_runtime_test

      - name: Validate BO3 Nacht weapon behavior specs
        shell: bash
        run: |
          python3 tools/maps/validate_nacht_bo3_weapon_specs.py

      - name: Validate global XZIEL weapon catalog
        shell: bash
        run: |
          python3 tools/weapons/export_xziel_mystery_box_pool.py
          python3 tools/weapons/export_nacht_prototype_box_pool.py
          git diff --exit-code -- assets/weapons/xziel_mystery_box_pool_v1.json
          git diff --exit-code -- assets/weapons/nacht_prototype_box_pool_v1.json
          python3 tools/weapons/validate_xziel_weapon_catalog.py

      - name: Validate Nacht runtime overlay
        shell: bash
        run: |
          python3 tools/maps/export_nacht_nzp_runtime_overlay.py
          git diff --exit-code -- assets/nacht_reference/nzp_runtime_overlay.json

      - name: Test Xz RHI
        shell: bash
        run: |
          cc -std=c99 -O2 -Wall -Wextra -Werror \
            -Iengine/xz \
            tests/xz_rhi_test.c \
            engine/xz/xz_rhi.c \
            engine/xz/xz_render_plan.c \
            engine/xz/xz_visibility.c \
            engine/xz/xz_material_lighting.c \
            engine/xz/xz_device_caps.c \
            engine/xz/xz_gpu_resources.c \
            -o /tmp/xz_rhi_test
          /tmp/xz_rhi_test

      - name: Test Xz RenderGraph
        shell: bash
        run: |
          cc -std=c99 -O2 -Wall -Wextra -Werror \
            -Iengine/xz \
            tests/xz_render_graph_test.c \
            engine/xz/xz_render_graph.c \
            -o /tmp/xz_render_graph_test
          /tmp/xz_render_graph_test

      - name: Test Xz resource handles + command stream
        shell: bash
        run: |
          cc -std=c99 -O2 -Wall -Wextra -Werror \
            -Iengine/xz \
            tests/xz_resource_command_test.c \
            engine/xz/xz_gpu_resources.c \
            engine/xz/xz_command_stream.c \
            engine/xz/xz_render_graph.c \
            engine/xz/xz_render_plan.c \
            engine/xz/xz_visibility.c \
            engine/xz/xz_material_lighting.c \
            -o /tmp/xz_resource_command_test
          /tmp/xz_resource_command_test

      - name: Test Xz GLES3 resource planner
        shell: bash
        run: |
          cc -std=c99 -O2 -Wall -Wextra -Werror \
            -Iengine/xz \
            tests/xz_gles3_resource_plan_test.c \
            engine/xz/xz_gles3_resource_plan.c \
            -o /tmp/xz_gles3_resource_plan_test
          /tmp/xz_gles3_resource_plan_test

      - name: Test Xz pass target planner
        shell: bash
        run: |
          cc -std=c99 -O2 -Wall -Wextra -Werror \
            -Iengine/xz \
            tests/xz_pass_targets_test.c \
            engine/xz/xz_pass_targets.c \
            engine/xz/xz_gpu_resources.c \
            engine/xz/xz_command_stream.c \
            engine/xz/xz_render_graph.c \
            engine/xz/xz_render_plan.c \
            engine/xz/xz_visibility.c \
            engine/xz/xz_material_lighting.c \
            -o /tmp/xz_pass_targets_test
          /tmp/xz_pass_targets_test

      - name: Test Xz pass input planner
        shell: bash
        run: |
          cc -std=c99 -O2 -Wall -Wextra -Werror \
            -Iengine/xz \
            tests/xz_pass_inputs_test.c \
            engine/xz/xz_pass_inputs.c \
            engine/xz/xz_gpu_resources.c \
            engine/xz/xz_command_stream.c \
            engine/xz/xz_render_graph.c \
            engine/xz/xz_render_plan.c \
            engine/xz/xz_visibility.c \
            engine/xz/xz_material_lighting.c \
            -o /tmp/xz_pass_inputs_test
          /tmp/xz_pass_inputs_test

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK, NDK and emulator
        shell: bash
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER"             "platform-tools"             "platforms;android-35"             "build-tools;35.0.0"             "ndk;27.2.12479018"             "emulator"             "system-images;android-35;google_apis;x86_64"

      - name: Prepare XZIEL Engine Android project
        shell: bash
        run: |
          bash scripts/prepare_android.sh
          unzip -l build/android-project/app/src/main/assets/nzp-data.zip \
            | grep -F "nzp/xziel/weapons/xziel_weapon_catalog_v1.json"
          unzip -l build/android-project/app/src/main/assets/nzp-data.zip \
            | grep -F "nzp/xziel/weapons/xziel_mystery_box_pool_v1.json"
          unzip -l build/android-project/app/src/main/assets/nzp-data.zip \
            | grep -F "nzp/xziel/weapons/nacht_prototype_box_pool_v1.json"

      - name: Build debug APK
        working-directory: build/android-project
        shell: bash
        run: ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p dist
          cp build/android-project/app/build/outputs/apk/debug/app-debug.apk              dist/XZIEL-Engine-Android-debug.apk
          ls -lh dist/XZIEL-Engine-Android-debug.apk

      - name: Boot emulator and smoke-test Xziel
        id: smoke
        shell: bash
        continue-on-error: true
        env:
          ANDROID_AVD_HOME: ${{ runner.temp }}/xziel-avd-home
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_AVD_HOME"
          ADB="${ANDROID_HOME}/platform-tools/adb"
          EMULATOR="${ANDROID_HOME}/emulator/emulator"
          AVDMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name avdmanager | sort | tail -n 1)"

          printf 'no\n' | "$AVDMANAGER" create avd             --force             --name xziel-ci             --package "system-images;android-35;google_apis;x86_64"             --device "pixel_6"

          echo "Created AVDs:"
          "$AVDMANAGER" list avd
          find "$ANDROID_AVD_HOME" -maxdepth 2 -type f -print

          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm || true
          fi

          nohup "$EMULATOR"             @xziel-ci             -no-window             -no-audio             -no-boot-anim             -no-snapshot             -gpu swiftshader_indirect             -memory 2048             > dist/emulator-stdout.txt 2>&1 &
          EMU_PID=$!

          sleep 5
          if ! kill -0 "$EMU_PID" 2>/dev/null; then
            cat dist/emulator-stdout.txt || true
            exit 1
          fi

          timeout 120 "$ADB" wait-for-device

          BOOTED=0
          for i in $(seq 1 60); do
            if [[ "$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]]; then
              BOOTED=1
              break
            fi
            sleep 2
          done

          if [[ "$BOOTED" != "1" ]]; then
            echo "Emulator boot timeout"
            "$ADB" devices -l || true
            cat dist/emulator-stdout.txt || true
            exit 1
          fi

          "$ADB" install -r dist/XZIEL-Engine-Android-debug.apk
          # Keep emulator orientation deterministic. SwiftShader/API-35 can
          # occasionally expose the physical screencap in portrait even though
          # SDL has already entered landscape.
          "$ADB" shell settings put system accelerometer_rotation 0 || true
          "$ADB" shell settings put system user_rotation 1 || true
          # Suppress Android's one-time "Viewing full screen" tutorial so the
          # automated HUD screenshots contain only the game UI.
          "$ADB" shell settings put secure immersive_mode_confirmations confirmed || true
          "$ADB" logcat -c
          "$ADB" shell am force-stop com.xziel.engine || true
          "$ADB" shell am start -W -n com.xziel.engine/org.libsdl.app.NZPActivity             --ez xziel_ci_hud_preview true             --ez xziel_ci_fog_preview true             > dist/am-start.txt 2>&1 || true

          # Wait for the actual processed-frame marker instead of assuming
          # emulator/SwiftShader startup completes at a fixed wall-clock time.
          STAGE=""
          for i in $(seq 1 30); do
            STAGE="$("$ADB" shell run-as com.xziel.engine cat files/nzp-runtime/.xziel-stage 2>/dev/null | tr -d '\\r' || true)"
            if [[ "$STAGE" == "FIRST_FRAME_OK" ]]; then
              break
            fi
            sleep 2
          done

          # Wait for the native visible path itself, not merely FIRST_FRAME_OK.
          # Shadow-heavy parity probes can advance slowly under SwiftShader; taking
          # screenshots before MODERN owns the backbuffer creates false black-frame
          # failures even though the renderer reaches a clean takeover moments later.
          MODERN_VISUAL_READY=0
          for i in $(seq 1 60); do
            "$ADB" logcat -d -v threadtime > dist/xziel-logcat-previsual.txt || true
            if grep -Eq "XZIEL-XZ.*parity present context=1 attempts=[1-9][0-9]* success=[1-9][0-9]* fail=0 draws=[1-9][0-9]* streak=([2-9]|[1-9][0-9]+)" dist/xziel-logcat-previsual.txt \
              && grep -Eq "XZIEL-XZ.*phase16 heartbeat requested=MODERN active=MODERN candidate=1 allowed=1 caps=0xff blockers=0x0 .*legacyVisible=0" dist/xziel-logcat-previsual.txt; then
              MODERN_VISUAL_READY=1
              break
            fi
            sleep 2
          done

          if [[ "$MODERN_VISUAL_READY" != "1" ]]; then
            echo "Native visible renderer did not reach stable MODERN ownership before visual capture."
            grep -E "XZIEL-XZ.*parity geometry|XZIEL-XZ.*parity shadows|XZIEL-XZ.*parity present|XZIEL-XZ.*phase16 heartbeat" dist/xziel-logcat-previsual.txt | tail -n 260 || true
            exit 1
          fi

          # Give SurfaceFlinger a short grace period after native takeover.
          sleep 3

          # Automated visual sanity pass: obtain two valid, non-blank landscape
          # gameplay frames. Retry transient all-black emulator captures rather
          # than misclassifying a SurfaceFlinger timing hiccup as an engine bug.
          python3 -m pip install --quiet pillow==11.3.0
          : > dist/hud-visual-report.txt
          VISUAL_OK=0

          for attempt in $(seq 1 6); do
            "$ADB" exec-out screencap -p > dist/xziel-hud-preview-a.png || true
            sleep 3
            "$ADB" exec-out screencap -p > dist/xziel-hud-preview-b.png || true

            if ATTEMPT="$attempt" python3 - <<'PY' >> dist/hud-visual-report.txt 2>&1
          import os
          from pathlib import Path
          from PIL import Image, ImageChops, ImageStat

          attempt = os.environ.get("ATTEMPT", "?")
          paths = [Path("dist/xziel-hud-preview-a.png"), Path("dist/xziel-hud-preview-b.png")]
          images = []

          for path in paths:
              im = Image.open(path).convert("RGB")

              # Some emulator builds report the physical framebuffer portrait
              # even while the landscape SDL surface is healthy. Normalize
              # orientation for visual analysis; still require gameplay-sized
              # non-flat content after normalization.
              if im.height > im.width:
                  im = im.transpose(Image.Transpose.ROTATE_90)

              if im.width < 1000 or im.height < 500 or im.width <= im.height:
                  raise SystemExit(f"attempt={attempt} invalid dimensions: {path} {im.size}")

              gray = im.convert("L")
              stat = ImageStat.Stat(gray)
              lo, hi = gray.getextrema()
              if hi - lo < 24 or stat.stddev[0] < 8:
                  raise SystemExit(
                      f"attempt={attempt} blank/flat: {path} "
                      f"extrema={(lo,hi)} std={stat.stddev[0]:.2f}"
                  )

              images.append(im)
              print(
                  f"attempt={attempt} {path.name}: size={im.size} "
                  f"mean={stat.mean[0]:.2f} std={stat.stddev[0]:.2f} "
                  f"extrema={(lo,hi)}"
              )

          diff = ImageChops.difference(images[0], images[1]).convert("L")
          dstat = ImageStat.Stat(diff)
          print(
              f"attempt={attempt} frame_delta_mean={dstat.mean[0]:.3f} "
              f"frame_delta_std={dstat.stddev[0]:.3f}"
          )
          PY
            then
              VISUAL_OK=1
              cp dist/xziel-hud-preview-a.png dist/xziel-screen.png || true
              break
            fi

            sleep 4
          done

          cat dist/hud-visual-report.txt

          if [[ "$VISUAL_OK" != "1" ]]; then
            "$ADB" logcat -d -v threadtime > dist/xziel-logcat-nacht.txt || true
            echo "HUD preview remained blank/flat after all retries."
            grep -E "XZIEL-XZ.*parity geometry|XZIEL-XZ.*parity texture|XZIEL-XZ.*parity present|XZIEL-XZ.*phase16 heartbeat" dist/xziel-logcat-nacht.txt | tail -n 220 || true
            exit 1
          fi

          # Preserve the Nacht proof separately, then clear logcat so the
          # Dung3on gates cannot accidentally pass on Nacht evidence.
          "$ADB" logcat -d -v threadtime > dist/xziel-logcat-nacht.txt || true

          # Second real-scene parity probe. Dung3on is an official NZ:P map
          # whose source explicitly contains knee-high water.
          "$ADB" shell am force-stop com.xziel.engine || true
          "$ADB" shell run-as com.xziel.engine rm -f files/nzp-runtime/.xziel-stage files/nzp-runtime/.xziel-last-error || true
          "$ADB" logcat -c
          "$ADB" shell am start -W -n com.xziel.engine/org.libsdl.app.NZPActivity             --ez xziel_ci_hud_preview true             --ez xziel_ci_fog_preview true             --es xziel_ci_map dung3on             > dist/am-start-water.txt 2>&1 || true

          WATER_STAGE=""
          for i in $(seq 1 45); do
            WATER_STAGE="$("$ADB" shell run-as com.xziel.engine cat files/nzp-runtime/.xziel-stage 2>/dev/null | tr -d '\r' || true)"
            if [[ "$WATER_STAGE" == "FIRST_FRAME_OK" ]]; then
              break
            fi
            sleep 2
          done

          if [[ "$WATER_STAGE" != "FIRST_FRAME_OK" ]]; then
            echo "Dung3on water parity probe did not reach FIRST_FRAME_OK (stage=$WATER_STAGE)."
            cat dist/am-start-water.txt || true
            exit 1
          fi

          # Do not call water visible until this process itself has switched to
          # the native GLES3 visible path with live water batches.
          WATER_MODERN_OK=0
          for i in $(seq 1 30); do
            "$ADB" logcat -d -v threadtime > dist/xziel-logcat-water-live.txt || true
            if grep -Eq "XZIEL-XZ.*parity specials current=[1-9][0-9]* sky=[0-9]+ water=[1-9][0-9]* skySeen=[01] waterSeen=1" dist/xziel-logcat-water-live.txt \
              && grep -Eq "XZIEL-XZ.*phase16 heartbeat requested=MODERN active=MODERN candidate=1 allowed=1 caps=0xff blockers=0x0 .*legacyVisible=0" dist/xziel-logcat-water-live.txt; then
              WATER_MODERN_OK=1
              break
            fi
            sleep 2
          done

          if [[ "$WATER_MODERN_OK" != "1" ]]; then
            echo "Dung3on produced water but never reached visible MODERN cutover."
            grep -E "XZIEL-XZ.*parity specials|XZIEL-XZ.*parity geometry|XZIEL-XZ.*parity texture|XZIEL-XZ.*phase16 heartbeat" dist/xziel-logcat-water-live.txt | tail -n 220 || true
            exit 1
          fi

          : > dist/water-visual-report.txt
          WATER_VISUAL_OK=0
          for attempt in $(seq 1 8); do
            "$ADB" exec-out screencap -p > dist/xziel-water-preview.png || true
            if ATTEMPT="$attempt" python3 - <<'PY' >> dist/water-visual-report.txt 2>&1
          import os
          from pathlib import Path
          from PIL import Image, ImageStat

          attempt = os.environ.get("ATTEMPT", "?")
          path = Path("dist/xziel-water-preview.png")
          im = Image.open(path).convert("RGB")
          if im.height > im.width:
              im = im.transpose(Image.Transpose.ROTATE_90)
          if im.width < 1000 or im.height < 500 or im.width <= im.height:
              raise SystemExit(f"attempt={attempt} invalid dimensions: {im.size}")
          gray = im.convert("L")
          stat = ImageStat.Stat(gray)
          lo, hi = gray.getextrema()
          if hi - lo < 24 or stat.stddev[0] < 8:
