            exit 1
          fi

          if ! grep -Eq "XZIEL-XZ.*parity material state=[1-9][0-9]* blend=[1-9][0-9]* lightmap=[1-9][0-9]* alpha=[0-9]+ modulate=[1-9][0-9]* ready=1" dist/xziel-logcat.txt; then
            echo "Xz material/lightmap parity did not replay the captured Vril fixed-function state cleanly."
            grep -E "XZIEL-XZ.*parity material|XZIEL-XZ.*parity geometry|XZIEL-XZ.*parity texture" dist/xziel-logcat.txt | tail -n 180 || true
            exit 1
          fi

          if ! grep -Eq "XZIEL-XZ.*parity raster fog=[1-9][0-9]* cull=[1-9][0-9]* depthRange=[1-9][0-9]* offset=[0-9]+ ready=1" dist/xziel-logcat.txt; then
            echo "Xz fog/raster parity did not replay deterministic fog, culling and viewmodel depth-range state."
            grep -E "XZIEL-XZ.*parity raster|XZIEL-XZ.*parity material|XZIEL-XZ.*phase16 heartbeat" dist/xziel-logcat.txt | tail -n 180 || true
            exit 1
          fi

          if ! grep -Eq "XZIEL-XZ.*parity present context=1 attempts=[1-9][0-9]* success=[1-9][0-9]* fail=0 draws=[1-9][0-9]* streak=[1-9][0-9]* render=[1-9][0-9]*x[1-9][0-9]* surface=[1-9][0-9]*x[1-9][0-9]* ready=1" dist/xziel-logcat.txt; then
            echo "Xz visible-present parity did not sustain a clean GLES3 pre-HUD composite."
            grep -E "XZIEL-XZ.*parity present|XZIEL-XZ.*phase16 heartbeat" dist/xziel-logcat.txt | tail -n 180 || true
            exit 1
          fi

          if ! grep -Eq "XZIEL-XZ.*phase16 heartbeat requested=MODERN active=MODERN candidate=1 allowed=1 caps=0xff blockers=0x0 eval=[1-9][0-9]* blocked=[1-9][0-9]* legacyVisible=0" dist/xziel-logcat.txt; then
            echo "Xz did not complete the safe visible MODERN cutover."
            grep -E "XZIEL-XZ.*phase16 heartbeat|XZIEL-XZ.*parity present|XZIEL-XZ.*parity texture|XZIEL-XZ.*parity geometry" dist/xziel-logcat.txt | tail -n 220 || true
            exit 1
          fi

          echo "Xziel remained alive; stable MODERN frames execute zero legacy 3D raster, while GL4ES remains available for HUD/menu/touch and map-transition fallback."

      - name: Upload runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XZIEL-Engine-runtime-diagnostics
          path: |
            dist/xziel-logcat.txt
            dist/xziel-logcat-nacht.txt
            dist/xziel-logcat-previsual.txt
            dist/xziel-logcat-water.txt
            dist/xziel-logcat-water-live.txt
            dist/xziel-screen.png
            dist/xziel-hud-preview-a.png
            dist/xziel-hud-preview-b.png
            dist/xziel-water-preview.png
            dist/hud-visual-report.txt
            dist/water-visual-report.txt
            dist/emulator-stdout.txt
            dist/am-start.txt
            dist/am-start-water.txt
            dist/activity-processes.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XZIEL-Engine-Android-debug
          path: dist/XZIEL-Engine-Android-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Fail if smoke test failed
        if: steps.smoke.outcome == 'failure'
        shell: bash
        run: exit 1

      - name: Publish final CI status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          case "$JOB_STATUS" in
            success) STATE=success ;;
            cancelled) STATE=error ;;
            *) STATE=failure ;;
          esac
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$STATE" \
            -f context="xziel/engine-android" \
            -f description="XZIEL Engine Android build: $JOB_STATUS" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            >/dev/null || true
