name: Native Android APK

on:
  workflow_call:
    inputs:
      multiplayer_url:
        description: Cloudflare multiplayer deployment URL to bake into the APK
        required: false
        type: string
        default: ""
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/android-native.yml"
      - "android/**"
      - "scripts/**"
      - "README.md"
      - "assets/nacht_enhanced/**"
      - "docs/NACHT_ENHANCED*.md"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/android-native.yml"
      - "android/**"
      - "scripts/**"
      - "README.md"

concurrency:
  # Keep stale runs of the same workflow from wasting runners, but do not let
  # the PR build, Cloudflare deploy build and 4-player integration build cancel
  # each other merely because they share the same branch.
  group: xziel-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  build-and-smoke-test:
    name: Build native APK + Android smoke test
    runs-on: ubuntu-latest
    env:
      XZIEL_MULTIPLAYER_URL: ${{ inputs.multiplayer_url }}
    timeout-minutes: 25

    steps:
      - name: Checkout Xziel
        uses: actions/checkout@v5

      - name: Publish CI run pointer
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context="xziel/android-hud" \
            -f description="Native Android HUD build is running" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            >/dev/null || true

      - name: Validate patch scripts
        shell: bash
        run: |
          python3 -m py_compile \
            scripts/patch_vril_mobile_v024.py \
            scripts/patch_vril_multiplayer_hud_test.py \
            scripts/patch_vril_multiplayer_online.py \
            scripts/build_xziel_icons.py \
            scripts/patch_vril_sanctum_staticmesh.py \
            scripts/patch_vril_official_touch_skins_v026.py \
            scripts/patch_quakec_mobile_v024.py \
            scripts/patch_quakec_multiplayer_v026.py \
            scripts/audit_online_world_sync.py


      - name: Audit full Vril and QuakeC patch chain
        shell: bash
        run: |
          set -euo pipefail
          AUDIT="${RUNNER_TEMP}/xziel-patch-audit"
          rm -rf "$AUDIT"
          mkdir -p "$AUDIT"
          git clone --depth 1 https://github.com/nzp-team/vril-engine.git "$AUDIT/vril"
          git clone --depth 1 https://github.com/nzp-team/quakec.git "$AUDIT/quakec"

          python3 scripts/patch_vril_android.py "$AUDIT/vril"
          python3 scripts/patch_vril_weaponhud.py "$AUDIT/vril"
          python3 scripts/patch_vril_mobile_v018.py "$AUDIT/vril"
          python3 scripts/patch_vril_weaponhud_v020.py "$AUDIT/vril"
          python3 scripts/patch_vril_combatfx.py "$AUDIT/vril"
          python3 scripts/patch_vril_modern_movement.py "$AUDIT/vril"
          python3 scripts/patch_vril_camera_feel.py "$AUDIT/vril"
          python3 scripts/patch_vril_animation_feel.py "$AUDIT/vril"
          python3 scripts/patch_vril_mobile_v021.py "$AUDIT/vril"
          python3 scripts/patch_vril_mobile_v022.py "$AUDIT/vril"
          python3 scripts/patch_vril_mobile_v024.py "$AUDIT/vril"
          python3 scripts/patch_vril_multiplayer_hud_test.py "$AUDIT/vril"
          python3 scripts/patch_vril_multiplayer_online.py "$AUDIT/vril"
          python3 scripts/patch_vril_sanctum_staticmesh.py "$AUDIT/vril"
          python3 scripts/patch_vril_official_touch_skins_v026.py "$AUDIT/vril"

          python3 scripts/patch_quakec_mobile.py "$AUDIT/quakec"
          python3 scripts/patch_quakec_combatfx.py "$AUDIT/quakec"
          python3 scripts/patch_quakec_modern_movement.py "$AUDIT/quakec"
          python3 scripts/patch_quakec_mobile_v021.py "$AUDIT/quakec"
          python3 scripts/patch_quakec_mobile_v022.py "$AUDIT/quakec"
          python3 scripts/patch_quakec_mobile_v024.py "$AUDIT/quakec"
          python3 scripts/patch_quakec_multiplayer_v026.py "$AUDIT/quakec"

          python3 scripts/audit_online_world_sync.py "$AUDIT/quakec" \
            | tee "$AUDIT/online-world-sync-report.json"

          echo "Full upstream patch chain and online world-sync contract passed."

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK, NDK and emulator
        shell: bash
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER"             "platform-tools"             "platforms;android-35"             "build-tools;35.0.0"             "ndk;27.2.12479018"             "emulator"             "system-images;android-35;google_apis;x86_64"

      - name: Prepare full native NZ:P Android project
        shell: bash
        run: bash scripts/prepare_android.sh

      - name: Build debug APK
        working-directory: build/android-project
        shell: bash
        run: ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p dist
          cp build/android-project/app/build/outputs/apk/debug/app-debug.apk              dist/Xziel-NZP-native-universal-debug.apk
          ls -lh dist/Xziel-NZP-native-universal-debug.apk

      - name: Boot emulator and smoke-test Xziel
        id: smoke
        shell: bash
        continue-on-error: true
        env:
          ANDROID_AVD_HOME: ${{ runner.temp }}/xziel-avd-home
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_AVD_HOME"
          ADB="${ANDROID_HOME}/platform-tools/adb"
          EMULATOR="${ANDROID_HOME}/emulator/emulator"
          AVDMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name avdmanager | sort | tail -n 1)"

          printf 'no\n' | "$AVDMANAGER" create avd             --force             --name xziel-ci             --package "system-images;android-35;google_apis;x86_64"             --device "pixel_6"

          echo "Created AVDs:"
          "$AVDMANAGER" list avd
          find "$ANDROID_AVD_HOME" -maxdepth 2 -type f -print

          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm || true
          fi

          nohup "$EMULATOR"             @xziel-ci             -no-window             -no-audio             -no-boot-anim             -no-snapshot             -gpu swiftshader_indirect             -memory 2048             > dist/emulator-stdout.txt 2>&1 &
          EMU_PID=$!

          sleep 5
          if ! kill -0 "$EMU_PID" 2>/dev/null; then
            cat dist/emulator-stdout.txt || true
            exit 1
          fi

          timeout 120 "$ADB" wait-for-device

          BOOTED=0
          for i in $(seq 1 60); do
            if [[ "$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]]; then
              BOOTED=1
              break
            fi
            sleep 2
          done

          if [[ "$BOOTED" != "1" ]]; then
            echo "Emulator boot timeout"
            "$ADB" devices -l || true
            cat dist/emulator-stdout.txt || true
            exit 1
          fi

          "$ADB" install -r dist/Xziel-NZP-native-universal-debug.apk
          # Suppress Android's one-time "Viewing full screen" tutorial so the
          # automated HUD screenshots contain only the game UI.
          "$ADB" shell settings put secure immersive_mode_confirmations confirmed || true
          "$ADB" logcat -c
          "$ADB" shell am force-stop com.xziel.nzp || true
          "$ADB" shell am start -W -n com.xziel.nzp/org.libsdl.app.NZPActivity             --ez xziel_ci_hud_preview true             > dist/am-start.txt 2>&1 || true

          # Let bundled data extraction finish and boot directly into Nacht der
          # Untoten so CI validates the actual gameplay HUD.
          sleep 30

          "$ADB" exec-out screencap -p > dist/xziel-hud-preview-a.png || true
          sleep 3
          "$ADB" exec-out screencap -p > dist/xziel-hud-preview-b.png || true
          cp dist/xziel-hud-preview-a.png dist/xziel-screen.png || true

          # Visual QA for the new map -> public -> Duo/Trio/Quad selector.
          "$ADB" shell am force-stop com.xziel.nzp || true
          "$ADB" shell am start -W -n com.xziel.nzp/org.libsdl.app.NZPActivity \
            --ez xziel_ci_squad_preview true \
            > dist/am-start-squad.txt 2>&1 || true
          sleep 8
          "$ADB" exec-out screencap -p > dist/xziel-squad-selector.png || true

          # Online builds must exercise the same human menu entry point used on
          # real phones. This catches regressions that CI public-match shortcuts
          # would otherwise bypass.
          if [[ -n "${XZIEL_MULTIPLAYER_URL:-}" ]]; then
            "$ADB" shell am force-stop com.xziel.nzp || true
            "$ADB" shell am start -W -n com.xziel.nzp/org.libsdl.app.NZPActivity \
              --ez xziel_ci_multiplayer_menu_preview true \
              > dist/am-start-multiplayer-menu.txt 2>&1 || true
            sleep 8
            "$ADB" shell uiautomator dump /sdcard/xziel-multiplayer-menu.xml >/dev/null 2>&1
            "$ADB" pull /sdcard/xziel-multiplayer-menu.xml dist/xziel-multiplayer-menu.xml >/dev/null 2>&1
            "$ADB" exec-out screencap -p > dist/xziel-multiplayer-menu.png || true
            grep -q 'text="Nacht der Untoten"' dist/xziel-multiplayer-menu.xml
            grep -q 'text="PRIVATE ROOM"' dist/xziel-multiplayer-menu.xml
            grep -q 'text="PUBLIC MATCH"' dist/xziel-multiplayer-menu.xml
          fi

          # Automated visual sanity pass: both frames must be valid, non-blank
          # landscape gameplay-sized images. We also record inter-frame change
          # as evidence the renderer is live rather than frozen.
          python3 -m pip install --quiet pillow==11.3.0
          python3 - <<'PY' > dist/hud-visual-report.txt
          from pathlib import Path
          from PIL import Image, ImageChops, ImageStat

          paths = [Path("dist/xziel-hud-preview-a.png"), Path("dist/xziel-hud-preview-b.png")]
          images = []
          for path in paths:
              im = Image.open(path).convert("RGB")
              if im.width < 1000 or im.height < 500 or im.width <= im.height:
                  raise SystemExit(f"HUD preview has invalid dimensions: {path} {im.size}")
              gray = im.convert("L")
              stat = ImageStat.Stat(gray)
              lo, hi = gray.getextrema()
              if hi - lo < 24 or stat.stddev[0] < 8:
                  raise SystemExit(f"HUD preview appears blank/flat: {path} extrema={(lo,hi)} std={stat.stddev[0]:.2f}")
              images.append(im)
              print(f"{path.name}: size={im.size} mean={stat.mean[0]:.2f} std={stat.stddev[0]:.2f} extrema={(lo,hi)}")

          diff = ImageChops.difference(images[0], images[1]).convert("L")
          dstat = ImageStat.Stat(diff)
          print(f"frame_delta_mean={dstat.mean[0]:.3f} frame_delta_std={dstat.stddev[0]:.3f}")

          selector_path = Path("dist/xziel-squad-selector.png")
          selector = Image.open(selector_path).convert("RGB")
          if selector.width < 1000 or selector.height < 500 or selector.width <= selector.height:
              raise SystemExit(f"squad selector has invalid dimensions: {selector.size}")
          selector_gray = selector.convert("L")
          selector_stat = ImageStat.Stat(selector_gray)
          if selector_stat.stddev[0] < 8:
              raise SystemExit(f"squad selector appears blank: std={selector_stat.stddev[0]:.2f}")
          hsv = selector.convert("HSV")
          colorful = sum(
              1 for h, s, v in hsv.getdata()
              if s >= 80 and v >= 80
          )
          if colorful < 1500:
              raise SystemExit(f"squad selector missing colored icon rings: pixels={colorful}")
          print(f"squad_selector: size={selector.size} colorful_pixels={colorful}")
          PY
          cat dist/hud-visual-report.txt
          "$ADB" logcat -d -v threadtime > dist/xziel-logcat.txt || true
          "$ADB" shell dumpsys activity processes > dist/activity-processes.txt || true

          PID="$("$ADB" shell pidof com.xziel.nzp 2>/dev/null | tr -d '\\r' || true)"
          echo "PID=$PID"

          echo "===== DEVICE STARTUP MARKER ====="
          "$ADB" shell run-as com.xziel.nzp cat files/nzp-runtime/.xziel-stage 2>/dev/null || true
          "$ADB" shell run-as com.xziel.nzp cat files/nzp-runtime/.xziel-last-error 2>/dev/null || true

          echo "===== XZIEL LOGCAT HIGHLIGHTS ====="
          grep -Ei "FATAL EXCEPTION|Fatal signal|AndroidRuntime|DEBUG|libmain|gl4es|SDL|xziel|com.xziel.nzp|Vril Engine|Sys_Error|EGL_BAD_CONTEXT|stage=SYS_ERROR|stage=HOST_INIT_OK|stage=FIRST_FRAME_OK" \
            dist/xziel-logcat.txt | tail -n 500 || true

          if grep -Eq "Fatal signal .*SDLActivity|>>> com\\.xziel\\.nzp <<<|Process .*com\\.xziel\\.nzp.*exited due to signal|EGL_BAD_CONTEXT|stage=SYS_ERROR" dist/xziel-logcat.txt; then
            echo "Detected native Xziel/EGL crash in logcat."
            exit 1
          fi

          if [[ -z "$PID" ]]; then
            echo "Xziel process is not alive after smoke test."
            exit 1
          fi

          STAGE="$("$ADB" shell run-as com.xziel.nzp cat files/nzp-runtime/.xziel-stage 2>/dev/null | tr -d '\\r' || true)"
          if [[ "$STAGE" != "FIRST_FRAME_OK" ]]; then
            echo "Xziel is alive but did not reach FIRST_FRAME_OK (stage=$STAGE)."
            exit 1
          fi

          echo "Xziel remained alive and reached FIRST_FRAME_OK after 20 seconds."

      - name: Upload runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Xziel-runtime-diagnostics
          path: |
            dist/xziel-logcat.txt
            dist/xziel-screen.png
            dist/xziel-hud-preview-a.png
            dist/xziel-hud-preview-b.png
            dist/xziel-squad-selector.png
            dist/hud-visual-report.txt
            dist/emulator-stdout.txt
            dist/am-start.txt
            dist/am-start-squad.txt
            dist/activity-processes.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Xziel-NZP-native-universal-debug
          path: dist/Xziel-NZP-native-universal-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Fail if smoke test failed
        if: steps.smoke.outcome == 'failure'
        shell: bash
        run: exit 1

      - name: Publish final CI status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          case "$JOB_STATUS" in
            success) STATE=success ;;
            cancelled) STATE=error ;;
            *) STATE=failure ;;
          esac
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$STATE" \
            -f context="xziel/android-hud" \
            -f description="Native Android HUD build: $JOB_STATUS" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            >/dev/null || true
