name: HAYUYA Hunyuan Head Probe

on:
  workflow_dispatch:
  push:
    branches:
      - art/hayuya-monster-v1
    paths:
      - tools/hayuya3d/hunyuan3d_cloud.py
      - tools/hayuya3d/regional_fusion.py
      - tools/hayuya3d/source_autofix.py
      - tools/hayuya3d/source_front_projection.py
      - tools/hayuya3d/software_glb_preview.py
      - tools/hayuya3d/silhouette_conform.py
      - tools/hayuya3d/mvadapter_texture_cloud.py
      - tools/hayuya3d/triposg_cloud.py
      - tools/hayuya3d/judge_v4_face_worker.py
      - .github/workflows/hayuya-hunyuan-head-probe.yml

permissions:
  contents: read

concurrency:
  group: hayuya-hunyuan-head-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  monja-head:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install probe dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "gradio_client>=1.10,<2" pillow numpy trimesh "scipy>=1.11" "mediapipe==1.0.1" "numba>=0.61,<1"

      - name: Install MediaPipe runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1-mesa-dri libgles2

      - name: Build real-pixel Monja head detail
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/hunyuan-head-probe
          python - <<'PY'
          import json, sys
          from pathlib import Path
          from dataclasses import asdict

          sys.path.insert(0, "tools/hayuya3d")
          from source_autofix import build_source_autofix

          report=build_source_autofix(
              [Path("hayuya/assets/monja-mugfwln6/geometry/primary.webp")],
              Path("out/hunyuan-head-probe/source_autofix"),
              policy="required",
          )
          Path("out/hunyuan-head-probe/source_autofix_report.json").write_text(
              json.dumps(asdict(report),indent=2)+"\n",encoding="utf-8"
          )
          if not report.derived_detail_sources:
              raise SystemExit("No real-pixel head detail was recovered")
          head=Path(report.derived_detail_sources[0])
          target=Path("out/hunyuan-head-probe/head_detail.png")
          target.write_bytes(head.read_bytes())
          print("HAYUYA_HUNYUAN_HEAD_DETAIL",target,report.sources[0].method)
          PY

      - name: Generate native body and head donor
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, sys
          from pathlib import Path

          sys.path.insert(0, "tools/hayuya3d")
          from hunyuan3d_cloud import generate_shape

          root=Path("out/hunyuan-head-probe")
          body=generate_shape(
              Path("hayuya/assets/monja-mugfwln6/geometry/primary.webp"),
              root/"body_native.glb",
              seed=1993,
              steps=30,
              guidance_scale=5.0,
              octree_resolution=384,
              num_chunks=8000,
          )
          head=generate_shape(
              root/"head_detail.png",
              root/"head_donor_native.glb",
              seed=1994,
              steps=30,
              guidance_scale=5.0,
              octree_resolution=384,
              num_chunks=8000,
              remove_background=True,
          )
          print("HAYUYA_HUNYUAN_BODY_AND_HEAD_NATIVE",json.dumps({
              "body":body,"head":head
          },separators=(",",":")))
          PY

      - name: Build seam-aware native head challenger
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, sys
          from dataclasses import asdict
          from pathlib import Path

          sys.path.insert(0, "tools/hayuya3d")
          from regional_fusion import prepare_head_wrap_challenger, write_head_wrap_result
          from mesh_gate import inspect

          root=Path("out/hunyuan-head-probe")
          result=prepare_head_wrap_challenger(
              root/"body_native.glb",
              root/"head_donor_native.glb",
              root/"head_wrap",
              texture_size=4096,
              require_rebake=False,
              donor_scope="head",
          )
          write_head_wrap_result(result,root/"head_wrap_result.json")
          print("HAYUYA_HUNYUAN_HEAD_WRAP",json.dumps(asdict(result),separators=(",",":")))
          if not result.ready_for_judge:
              raise SystemExit(result.error or "head wrap not ready")

          final=Path(result.output_glb or result.raw_output_glb)
          target=root/"body_headwrap_native.glb"
          target.write_bytes(final.read_bytes())
          gate=inspect(target,require_normals=False)
          payload={
              "faces":int(gate.faces),
              "vertices":int(gate.vertices),
              "components":int(gate.components),
              "largest_component_fraction":float(gate.largest_component_fraction),
              "passed":bool(gate.passed),
              "reasons":list(gate.reasons),
              "warnings":list(gate.warnings),
          }
          (root/"head_wrap_mesh_gate.json").write_text(
              json.dumps(payload,indent=2)+"\n",encoding="utf-8"
          )
          print("HAYUYA_HUNYUAN_HEAD_WRAP_MESH",json.dumps(payload,separators=(",",":")))
          if not gate.passed:
              raise SystemExit(2)
          PY

      - name: Texture refined native head with cloud fallback chain
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, "tools/hayuya3d")
          from mvadapter_texture_cloud import texture as mv_texture
          from triposg_cloud import texture_existing_mesh

          mesh=Path("out/hunyuan-head-probe/body_headwrap_native.glb")
          image=Path("hayuya/assets/monja-mugfwln6/geometry/primary.webp")
          output=Path("out/hunyuan-head-probe/body_headwrap_material_native.glb")
          failures=[]

          try:
              mv_texture(
                  mesh,
                  image,
                  output,
                  space="VAST-AI/MV-Adapter-Img2Texture",
                  seed=1993,
                  guidance=3.5,
                  steps=30,
                  reference_scale=1.4,
                  uv_size=4096,
              )
              print("HAYUYA_TEXTURE_BACKEND_SELECTED","mvadapter-4k")
          except Exception as exc:
              failures.append({
                  "backend":"mvadapter-4k",
                  "error":f"{type(exc).__name__}: {exc}",
              })
              print(
                  "::warning::MVAdapter unavailable; trying TripoSG direct texture: "
                  + failures[-1]["error"]
              )

          if not output.is_file() or output.read_bytes()[:4] != b"glTF":
              try:
                  result=texture_existing_mesh(
                      image,
                      mesh,
                      output,
                      token=os.environ.get("HF_TOKEN") or None,
                      seed=1993,
                  )
                  print("HAYUYA_TEXTURE_BACKEND_SELECTED","triposg-direct")
                  print("HAYUYA_TEXTURE_BACKEND_RESULT",json.dumps(result,separators=(",",":")))
              except Exception as exc:
                  failures.append({
                      "backend":"triposg-direct",
                      "error":f"{type(exc).__name__}: {exc}",
                  })

          if not output.is_file() or output.read_bytes()[:4] != b"glTF":
              try:
                  from source_front_projection import project_source_front
                  result=project_source_front(
                      image,
                      mesh,
                      output,
                      texture_edge=4096,
                  )
                  print("HAYUYA_TEXTURE_BACKEND_SELECTED","local-occlusion-projection")
                  print("HAYUYA_TEXTURE_BACKEND_RESULT",json.dumps(result,separators=(",",":")))
              except Exception as exc:
                  failures.append({
                      "backend":"local-occlusion-projection",
                      "error":f"{type(exc).__name__}: {exc}",
                  })

          if not output.is_file() or output.read_bytes()[:4] != b"glTF":
              raise SystemExit(
                  "all_texture_backends_failed:"+
                  json.dumps(failures,separators=(",",":"))
              )
          PY

      - name: Conform textured silhouette geometry
        shell: bash
        run: |
          set -euo pipefail
          python tools/hayuya3d/silhouette_conform.py \
            --input out/hunyuan-head-probe/body_headwrap_material_native.glb \
            --output out/hunyuan-head-probe/body_headwrap_material_native.glb \
            --report out/hunyuan-head-probe/body_headwrap_material_native.silhouette_conform.json \
            --iterations 2 --grid 768 \
            --overscan 1.42 --alpha-threshold 48 --edge-fill-radius 6

      - name: Render base native front
        shell: bash
        run: |
          set -euo pipefail
          python tools/hayuya3d/software_glb_preview.py \
            --input out/hunyuan-head-probe/body_native.glb \
            --output-dir out/hunyuan-head-probe/base_front \
            --size 768 --face-size 768

      - name: Render head-refined native front
        shell: bash
        run: |
          set -euo pipefail
          python tools/hayuya3d/software_glb_preview.py \
            --input out/hunyuan-head-probe/body_headwrap_native.glb \
            --output-dir out/hunyuan-head-probe/headwrap_front \
            --size 768 --face-size 768

      - name: Render textured refined front
        shell: bash
        run: |
          set -euo pipefail
          python tools/hayuya3d/software_glb_preview.py \
            --input out/hunyuan-head-probe/body_headwrap_material_native.glb \
            --output-dir out/hunyuan-head-probe/headwrap_textured_front \
            --size 1024 --face-size 1024 --supersample 2

      - name: Validate refined face and nose proportions
        shell: bash
        run: |
          set -euo pipefail
          python tools/hayuya3d/judge_v4_face_worker.py \
            --source out/hunyuan-head-probe/head_detail.png \
            --candidate out/hunyuan-head-probe/headwrap_textured_front/faces/12_180.png \
            --output out/hunyuan-head-probe/refined_face_gate.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("out/hunyuan-head-probe/refined_face_gate.json").read_text())
          ref=d.get("reference_profile") or {}
          rows=d.get("candidate") or []
          if d.get("candidate_detected") != 1 or not rows:
              raise SystemExit("refined face was not detected")
          f=rows[0].get("features") or {}
          def ratio(name):
              a=float(f.get(name,0.0) or 0.0)
              b=float(ref.get(name,0.0) or 0.0)
              return None if a<=1e-8 or b<=1e-8 else a/b
          nose_chin=ratio("nose_to_chin")
          nose_eye=ratio("nose_eye_center_offset")
          payload={
              "nose_to_chin_ratio":nose_chin,
              "nose_eye_center_offset_ratio":nose_eye,
              "median_profile_error":d.get("median_profile_error"),
              "limits":{"nose_ratio":[0.65,1.40],"median_profile_error_max":0.30},
          }
          Path("out/hunyuan-head-probe/refined_nose_gate.json").write_text(
              json.dumps(payload,indent=2)+"\n",encoding="utf-8"
          )
          print("HAYUYA_REFINED_NOSE_GATE",json.dumps(payload,separators=(",",":")))
          if nose_chin is None or not (0.65 <= nose_chin <= 1.40):
              raise SystemExit("nose_to_chin ratio rejected")
          if nose_eye is None or not (0.65 <= nose_eye <= 1.40):
              raise SystemExit("nose_eye_center ratio rejected")
          err=d.get("median_profile_error")
          if err is None or float(err)>0.30:
              raise SystemExit("face profile error rejected")
          PY

      - name: Upload head probe artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hayuya-hunyuan-head-probe
          path: out/hunyuan-head-probe/**
          if-no-files-found: warn
          retention-days: 3
