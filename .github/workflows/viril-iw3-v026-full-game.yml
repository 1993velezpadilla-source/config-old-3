name: VIRIL IW3 - complete v0.26 game and isolated Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/viril-iw3-v026
    paths:
      - .github/workflows/viril-iw3-v026-full-game.yml
      - scripts/prepare_viril_iw3_android.sh

permissions:
  contents: write

concurrency:
  group: viril-iw3-v026-full-game
  cancel-in-progress: false

jobs:
  package-complete-original:
    name: Package ALL original weapons, animations, assets, maps and independent APK
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout new branch only (do not touch v0.26 recovery)
        uses: actions/checkout@v4
        with:
          ref: feature/viril-iw3-v026
          fetch-depth: 1

      - name: Validate copied v0.26 engine source and original game files
        shell: bash
        run: |
          set -euo pipefail
          test -s third_party/viril-iw3-v026/vril/source/view.c
          test -s third_party/viril-iw3-v026/quakec/source/shared/weapon_stats.qc
          test -s third_party/viril-iw3-v026/SDL/src/sensor/android/SDL_androidsensor.c
          test -s assets/xziel/official_touch_skins_v1/manifest.json
          test -s scripts/prepare_android.sh
          python3 - <<'PY'
          from pathlib import Path
          a=Path('third_party/viril-iw3-v026/quakec/source/shared/weapon_stats.qc').read_text()
          b=Path('third_party/viril-iw3-v026/vril/source/view.c').read_text()
          assert 'GetWeaponADSOfs' in a and 'W_MP40' in a
          assert 'STAT_WEAPON' in b and 'cl.viewent' in b
          assert sum(Path('assets/xziel/official_touch_skins_v1').glob('*.png'),[]) if False else True
          assert len(list(Path('assets/xziel/official_touch_skins_v1').glob('*.png'))) == 12
          print('All v0.26 engine, weapon, ADS, animation and official HUD sources present.')
          PY

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"

      - name: Package complete original game data with ALL native models and maps
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/prepare_viril_iw3_android.sh

      - name: Compile original v0.26 as distinct Viril IW3 APK
        shell: bash
        working-directory: build/android-project
        run: ./gradlew --no-daemon :app:assembleDebug --stacktrace

      - name: Verify that new app cannot replace or erase the original v0.26
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/android-project/app/build/outputs/apk/debug/app-debug.apk dist/Viril-IW3-v026-complete-debug.apk
          AAPT="${ANDROID_HOME}/build-tools/35.0.0/aapt"
          "$AAPT" dump badging dist/Viril-IW3-v026-complete-debug.apk | tee dist/viril-iw3-apk-badging.txt
          grep -q "package: name='com.xziel.viriliw3'" dist/viril-iw3-apk-badging.txt
          if grep -q "package: name='com.xziel.nzp'" dist/viril-iw3-apk-badging.txt; then
            echo "SAFETY ERROR: original v0.26 package ID reused!" >&2
            exit 1
          fi
          unzip -l dist/Viril-IW3-v026-complete-debug.apk | grep -q 'nzp-data.zip'
          echo "Original com.xziel.nzp app and saves cannot be overwritten by this distinct package."
          cp build/android-project/app/src/main/assets/nzp-data.zip dist/Viril-IW3-v026-game-data.zip
          sha256sum dist/Viril-IW3-v026-*.apk dist/Viril-IW3-v026-game-data.zip > dist/SHA256SUMS

      - name: Backup original NZP Blender 3D authoring sources
        shell: bash
        run: |
          set -euo pipefail
          # Full original assets project includes editable Blender .blend sources,
          # 3D models, textures, sounds and map authoring source. This is extra
          # backup data, NOT an IW3 asset import.
          git clone -q --depth 1 https://github.com/nzp-team/assets.git build/nzp-full-original-assets
          ASSET_SHA="$(git -C build/nzp-full-original-assets rev-parse HEAD)"
          echo "nzp-team/assets commit: $ASSET_SHA" | tee dist/3D_SOURCE_PROVENANCE.txt
          test -s build/nzp-full-original-assets/LICENSE.md
          test -d build/nzp-full-original-assets/source
          tar -C build/nzp-full-original-assets --exclude='.git' -czf dist/Viril-IW3-v026-full-original-assets-and-3d-source.tar.gz .
          sha256sum dist/Viril-IW3-v026-full-original-assets-and-3d-source.tar.gz >> dist/SHA256SUMS

      - name: Make portable copy of full patched engine code and Android project
        shell: bash
        run: |
          set -euo pipefail
          tar -czf dist/Viril-IW3-v026-complete-engine-source.tar.gz \
            third_party/viril-iw3-v026 \
            scripts \
            android \
            assets/xziel/official_touch_skins_v1 \
            VIRIL_IW3.md
          sha256sum dist/Viril-IW3-v026-complete-engine-source.tar.gz >> dist/SHA256SUMS
          ls -lh dist/

      - name: Retain full game backup and independent APK as CI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VIRIL-IW3-v026-FULL-GAME-AND-ENGINE
          path: dist/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Publish permanent isolated baseline backup on GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="viril-iw3-v026-complete-baseline"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Immutable baseline release already exists; preserving existing backup."
            exit 0
          fi
          cat > dist/RELEASE_NOTES.md <<'EOF'
          VIRIL IW3: isolated backup of the complete XZIEL/Vril 0.26 original game.
          Includes the complete, patched Vril/QuakeC/SDL/GL4ES engine source,
          the entire official NZ:P game-data archive with all available guns,
          animations, models, maps, sounds, and the original 12 XZIEL mobile skins,
          as well as the upstream NZ:P asset-authoring source (including Blender 3D).

          The new Android package ID is com.xziel.viriliw3. It will NOT replace
          the original XZIEL v0.26 Android package com.xziel.nzp.
          This is a preserved experimental baseline; NO IW3 integration yet.
          Engine and artwork retain their upstream GPL/CC-BY-SA attribution.
          This baseline was built by GitHub Actions, not gameplay-tested on device.
          EOF
          gh release create "$TAG" \
            --target "feature/viril-iw3-v026" \
            --title "VIRIL IW3 - Complete original v0.26 baseline" \
            --notes-file dist/RELEASE_NOTES.md \
            --prerelease \
            --latest=false \
            dist/Viril-IW3-v026-complete-debug.apk \
            dist/Viril-IW3-v026-game-data.zip \
            dist/Viril-IW3-v026-full-original-assets-and-3d-source.tar.gz \
            dist/Viril-IW3-v026-complete-engine-source.tar.gz \
            dist/SHA256SUMS \
            dist/3D_SOURCE_PROVENANCE.txt \
            dist/viril-iw3-apk-badging.txt
