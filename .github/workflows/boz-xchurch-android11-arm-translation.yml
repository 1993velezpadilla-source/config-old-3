name: XChurch Android11 ARM Translation Capture

on:
  workflow_dispatch:
  push:
    branches:
      - feature/boz-mod-runtime
    paths:
      - ".github/workflows/boz-xchurch-android11-arm-translation.yml"

permissions:
  actions: read
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 22

    steps:
      - uses: actions/checkout@v5

      - name: Enable KVM
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/xchurch-x86/screens
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          test -e /dev/kvm
          ls -l /dev/kvm | tee /tmp/xchurch-x86/kvm.txt

      - name: Download verified XChurch APK
        uses: actions/download-artifact@v4
        with:
          name: XZIEL-BOZ-XChurch-APK
          run-id: 36768068731
          github-token: ${{ github.token }}
          path: /tmp/xchurch-apk

      - name: Stage APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find /tmp/xchurch-apk -type f -name '*.apk' | head -n1)"
          test -s "$APK"
          cp "$APK" /tmp/xchurch-x86/xchurch.apk
          sha256sum /tmp/xchurch-x86/xchurch.apk | tee /tmp/xchurch-x86/apk.sha256

      - name: Install Android 11 x86_64 image
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n1)"
          AVDMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name avdmanager | sort -V | tail -n1)"
          test -x "$SDKMANAGER"
          test -x "$AVDMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "AVDMANAGER=$AVDMANAGER" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "emulator" \
            "system-images;android-30;google_apis;x86_64" \
            2>&1 | tee /tmp/xchurch-x86/sdk-install.txt

      - name: Create and boot Android 11
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_AVD_HOME=/tmp/xchurch-x86/avd
          mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"

          printf 'no\n' | "$AVDMANAGER" create avd \
            --force \
            --name xchurch-x86 \
            --package "system-images;android-30;google_apis;x86_64" \
            --device "pixel_4" \
            2>&1 | tee /tmp/xchurch-x86/avd-create.txt

          ADB="$ANDROID_HOME/platform-tools/adb"
          EMU="$ANDROID_HOME/emulator/emulator"
          test -x "$ADB"
          test -x "$EMU"

          "$EMU" -accel-check | tee /tmp/xchurch-x86/accel-check.txt || true
          "$ADB" kill-server >/dev/null 2>&1 || true
          "$ADB" start-server >/dev/null 2>&1

          nohup "$EMU" @xchurch-x86 \
            -no-window \
            -gpu swiftshader_indirect \
            -no-snapshot \
            -noaudio \
            -no-boot-anim \
            -no-metrics \
            -camera-back none \
            > /tmp/xchurch-x86/emulator.log 2>&1 &
          EMU_PID=$!
          echo "EMU_PID=$EMU_PID" | tee /tmp/xchurch-x86/status.txt

          READY=0
          for i in $(seq 1 60); do
            STATE="$("$ADB" get-state 2>/dev/null || true)"
            echo "ADB_$i=$STATE" >> /tmp/xchurch-x86/status.txt
            if [ "$STATE" = "device" ]; then
              READY=1
              break
            fi
            if ! kill -0 "$EMU_PID" 2>/dev/null; then
              echo "EMULATOR_EXITED_EARLY" | tee -a /tmp/xchurch-x86/status.txt
              break
            fi
            sleep 2
          done
          echo "ADB_READY=$READY" | tee -a /tmp/xchurch-x86/status.txt
          test "$READY" = "1"

          BOOT=0
          for i in $(seq 1 60); do
            COMPLETE="$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
            echo "BOOT_$i=$COMPLETE" >> /tmp/xchurch-x86/status.txt
            if [ "$COMPLETE" = "1" ]; then
              BOOT=1
              break
            fi
            sleep 2
          done
          echo "BOOT_COMPLETED=$BOOT" | tee -a /tmp/xchurch-x86/status.txt
          test "$BOOT" = "1"

          "$ADB" exec-out screencap -p > /tmp/xchurch-x86/screens/android_boot.png

      - name: Probe ARM native bridge
        shell: bash
        run: |
          set -euo pipefail
          ADB="$ANDROID_HOME/platform-tools/adb"
          {
            echo "ABI=$("$ADB" shell getprop ro.product.cpu.abi | tr -d '\r')"
            echo "ABILIST=$("$ADB" shell getprop ro.product.cpu.abilist | tr -d '\r')"
            echo "ABILIST64=$("$ADB" shell getprop ro.product.cpu.abilist64 | tr -d '\r')"
            echo "NATIVE_BRIDGE=$("$ADB" shell getprop ro.dalvik.vm.native.bridge | tr -d '\r')"
            echo "NATIVE_BRIDGE_EXEC=$("$ADB" shell getprop ro.enable.native.bridge.exec | tr -d '\r')"
            echo "NDK_TRANSLATION=$("$ADB" shell getprop ro.ndk_translation.version | tr -d '\r')"
            echo "SDK=$("$ADB" shell getprop ro.build.version.sdk | tr -d '\r')"
          } | tee /tmp/xchurch-x86/device.txt

          "$ADB" shell 'find /system -name "*ndk_translation*" -o -name "libnb.so" 2>/dev/null | head -100' \
            | tee /tmp/xchurch-x86/native-bridge-files.txt || true

      - name: Install and launch XChurch APK
        shell: bash
        run: |
          set +e
          ADB="$ANDROID_HOME/platform-tools/adb"
          OUT=/tmp/xchurch-x86

          "$ADB" install --abi arm64-v8a -r -d "$OUT/xchurch.apk" \
            > "$OUT/install-arm64.txt" 2>&1
          INSTALL_RC=$?
          echo "INSTALL_ARM64_RC=$INSTALL_RC" | tee -a "$OUT/status.txt"
          cat "$OUT/install-arm64.txt" | tee -a "$OUT/status.txt"

          if [ "$INSTALL_RC" -ne 0 ]; then
            "$ADB" install -r -d "$OUT/xchurch.apk" > "$OUT/install-auto.txt" 2>&1
            INSTALL_RC=$?
            echo "INSTALL_AUTO_RC=$INSTALL_RC" | tee -a "$OUT/status.txt"
            cat "$OUT/install-auto.txt" | tee -a "$OUT/status.txt"
          fi

          "$ADB" exec-out screencap -p > "$OUT/screens/post_install.png" 2>/dev/null || true

          if [ "$INSTALL_RC" -eq 0 ]; then
            "$ADB" shell pm grant com.activision.boz android.permission.WRITE_EXTERNAL_STORAGE 2>/dev/null || true
            "$ADB" shell pm grant com.activision.boz android.permission.READ_EXTERNAL_STORAGE 2>/dev/null || true
            "$ADB" shell mkdir -p /sdcard/Android/obb/com.activision.boz 2>/dev/null || true

            "$ADB" logcat -c
            "$ADB" shell am force-stop com.activision.boz >/dev/null 2>&1 || true
            "$ADB" shell am start -W -n com.activision.boz/.Main > "$OUT/launch.txt" 2>&1
            LAUNCH_RC=$?
            echo "LAUNCH_RC=$LAUNCH_RC" | tee -a "$OUT/status.txt"
            cat "$OUT/launch.txt" | tee -a "$OUT/status.txt"

            capture_state() {
              LABEL="$1"
              "$ADB" exec-out screencap -p > "$OUT/screens/app_${LABEL}.png" 2>/dev/null || true
              PID_NOW="$("$ADB" shell pidof com.activision.boz 2>/dev/null | tr -d '\r\n')"
              echo "APP_${LABEL}_PID=$PID_NOW" | tee -a "$OUT/status.txt"
              if [ -n "$PID_NOW" ]; then
                "$ADB" shell top -b -n 1 -p "$PID_NOW" > "$OUT/top_${LABEL}.txt" 2>&1 || true
                "$ADB" shell "cat /proc/$PID_NOW/status" > "$OUT/proc_status_${LABEL}.txt" 2>&1 || true
                "$ADB" shell "cat /proc/$PID_NOW/wchan" > "$OUT/wchan_${LABEL}.txt" 2>&1 || true
                "$ADB" shell "ps -T -p $PID_NOW" > "$OUT/threads_${LABEL}.txt" 2>&1 || true
              fi
            }

            sleep 3
            capture_state 03s
            sleep 5
            capture_state 08s
            sleep 7
            capture_state 15s
            sleep 15
            capture_state 30s
            sleep 30
            capture_state 60s
            sleep 30
            capture_state 90s
            sleep 30
            capture_state 120s
            sleep 60
            capture_state 180s

            PID="$("$ADB" shell pidof com.activision.boz 2>/dev/null | tr -d '\r\n')"
            echo "PID=$PID" | tee -a "$OUT/status.txt"

            {
              echo "=== SCREEN SHA256 ==="
              sha256sum "$OUT"/screens/app_*.png 2>/dev/null || true
            } > "$OUT/screen-hashes.txt"
          fi

          "$ADB" logcat -d -v threadtime > "$OUT/logcat.txt" 2>&1
          "$ADB" shell dumpsys activity activities > "$OUT/activities.txt" 2>&1
          "$ADB" shell dumpsys window windows > "$OUT/window.txt" 2>&1
          grep -Eai \
            'FATAL EXCEPTION|Fatal signal|SIGSEGV|SIGABRT|UnsatisfiedLinkError|dlopen failed|native bridge|ndk_translation|xchurch|kino|Marmalade|s3e|activision|boz' \
            "$OUT/logcat.txt" | tail -400 > "$OUT/logcat-highlights.txt" || true
          exit 0

      - name: Summarize ARM translation capture
        if: always()
        shell: bash
        run: |
          set +e
          echo "=== DEVICE ==="
          cat /tmp/xchurch-x86/device.txt 2>/dev/null || true
          echo "=== STATUS ==="
          cat /tmp/xchurch-x86/status.txt 2>/dev/null || true
          echo "=== SCREENSHOTS ==="
          ls -lh /tmp/xchurch-x86/screens 2>/dev/null || true
          echo "=== LOG HIGHLIGHTS ==="
          tail -160 /tmp/xchurch-x86/logcat-highlights.txt 2>/dev/null || true
          echo "=== EMULATOR TAIL ==="
          tail -100 /tmp/xchurch-x86/emulator.log 2>/dev/null || true

      - name: Stage slim proof artifact
        if: always()
        shell: bash
        run: |
          set +e
          SRC=/tmp/xchurch-x86
          DST=/tmp/xchurch-proof
          rm -rf "$DST"
          mkdir -p "$DST/screens"
          cp -f "$SRC"/screens/*.png "$DST/screens/" 2>/dev/null || true
          for f in             status.txt device.txt native-bridge-files.txt             install-arm64.txt install-auto.txt launch.txt             logcat.txt logcat-highlights.txt activities.txt window.txt             emulator.log accel-check.txt apk.sha256 screen-hashes.txt             top_*.txt proc_status_*.txt wchan_*.txt threads_*.txt; do
            test -f "$SRC/$f" && cp "$SRC/$f" "$DST/$f"
          done
          find "$DST" -maxdepth 2 -type f -printf '%P %s bytes\n'             | sort | tee "$DST/manifest.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: XChurch-Android11-Slim-Proof
          path: /tmp/xchurch-proof/
          if-no-files-found: error
          retention-days: 14
