name: XZIEL Hybrid EXE-in-APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/xziel-hybrid-apk.yml"
      - "scripts/build_xziel_hybrid_apk.sh"
      - "scripts/patch_winlator_xziel_direct.py"
      - "scripts/prepare_windows_x64.sh"
      - "scripts/patch_vril_*.py"
      - "scripts/patch_quakec_*.py"
      - "scripts/build_xziel_icons.py"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/xziel-hybrid-apk.yml"
      - "scripts/build_xziel_hybrid_apk.sh"
      - "scripts/patch_winlator_xziel_direct.py"
      - "scripts/prepare_windows_x64.sh"
      - "scripts/patch_vril_*.py"
      - "scripts/patch_quakec_*.py"
      - "scripts/build_xziel_icons.py"

concurrency:
  group: xziel-hybrid-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build direct-boot XZIEL APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout XZIEL
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install host build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            gcc-mingw-w64-x86-64 \
            mingw-w64-tools \
            make git pkg-config wget curl tar unzip zip file python3-pip

      - name: Install Android NDK/CMake required by compatibility layer
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "ndk;24.0.8215888" "cmake;3.22.1"

      - name: Build one-click hybrid APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/build_xziel_hybrid_apk.sh scripts/prepare_windows_x64.sh
          bash scripts/build_xziel_hybrid_apk.sh

      - name: Upload hybrid APK
        uses: actions/upload-artifact@v4
        with:
          name: XZIEL-Hybrid-PixelFold
          path: |
            build/xziel-hybrid/dist/XZIEL-Hybrid-PixelFold-debug.apk
            build/xziel-hybrid/dist/XZIEL-Hybrid-PixelFold-debug.apk.sha256
            build/xziel-hybrid/dist/apk-contents.txt
          if-no-files-found: error
          retention-days: 14
