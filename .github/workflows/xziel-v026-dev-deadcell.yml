name: Xziel v0.26 DEV + Dead Cell CORE

on:
  push:
    branches: [feature/xziel-v026-dev-dead-cell-20261011]
    paths:
      - 'tools/zombie_prototype/generate_graybox_map.py'
      - '.github/workflows/xziel-v026-dev-deadcell.yml'
      - 'scripts/patch_xziel_v026_devmenu.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-prototype:
    name: Add ORIGINAL Dead Cell CORE to Xziel v0.26 DEV
    runs-on: ubuntu-latest
    env:
      XZIEL_DEV_MENU_ONLY: '1'
    timeout-minutes: 60

    steps:
      - name: Checkout XZIEL
        uses: actions/checkout@v5

      - name: Restore original compact 4-spawn Dead Cell CORE
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/zombie_prototype/generate_graybox_map.py
          test -s build/prototype/xziel_proto.map
          cat build/prototype/xziel_proto_report.json

      - name: Compile map and spawn zones with NZP tools
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/nzp-assets /tmp/spawn-zone-tool
          git clone --depth 1 https://github.com/nzp-team/assets.git /tmp/nzp-assets
          git clone --depth 1 --recursive https://github.com/nzp-team/spawn-zone-tool.git /tmp/spawn-zone-tool
          python3 -m pip install --quiet -r /tmp/spawn-zone-tool/requirements.txt

          (
            cd /tmp/nzp-assets
            bash tools/compile-wads.sh
            mkdir -p source/maps/xziel_proto
            cp "$GITHUB_WORKSPACE/build/prototype/xziel_proto.map" source/maps/xziel_proto/xziel_proto.map
            bash tools/compile-maps.sh --map xziel_proto --zone-tool-path /tmp/spawn-zone-tool
          ) 2>&1 | tee /tmp/xziel-proto-map-compile.log

          mkdir -p proto-dist
          cp /tmp/nzp-assets/common/maps/xziel_proto.bsp proto-dist/
          test -s /tmp/nzp-assets/common/maps/xziel_proto.nsz
          cp /tmp/nzp-assets/common/maps/xziel_proto.nsz proto-dist/
          cp build/prototype/xziel_proto.map proto-dist/
          cp build/prototype/xziel_proto_report.json proto-dist/
          cp /tmp/xziel-proto-map-compile.log proto-dist/
          ls -lh proto-dist/

      - name: Add Dead Cell custom-map display name only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dead-cell-overlay/maps
          python3 - <<'PY'
          from pathlib import Path
          rows=["XZIEL: DEAD CELL", "ORIGINAL FAST-SPAWN CORE ARENA",
                "4 INSIDE ZOMBIE SPAWNS", "NO WAITING ON WINDOWS",
                "SOLO ZOMBIES TEST", "DEVELOPER MENU SUPPORTED",
                "", "", "", "XZIEL", "0", "1"]
          assert len(rows)==12
          Path("dead-cell-overlay/maps/xziel_proto.txt").write_text("\n".join(rows)+"\n")
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK, NDK and emulator
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER"             "platform-tools"             "platforms;android-35"             "build-tools;35.0.0"             "ndk;27.2.12479018"             "emulator"             "system-images;android-35;google_apis;x86_64"

      - name: Prepare source-pinned Xziel v0.26 DEV and add only Dead Cell
        shell: bash
        env:
          XZIEL_EXTRA_MAP_NAME: xziel_proto
          XZIEL_EXTRA_MAP_BSP: ${{ github.workspace }}/proto-dist/xziel_proto.bsp
          XZIEL_EXTRA_MAP_NSZ: ${{ github.workspace }}/proto-dist/xziel_proto.nsz
          XZIEL_EXTRA_ASSET_DIR: ${{ github.workspace }}/dead-cell-overlay
        run: |
          set -euo pipefail
          bash scripts/prepare_android.sh
          unzip -l build/android-project/app/src/main/assets/nzp-data.zip | grep 'nzp/maps/xziel_proto.bsp'
          unzip -l build/android-project/app/src/main/assets/nzp-data.zip | grep 'nzp/maps/xziel_proto.nsz'

      - name: Prove original v0.26 unchanged and Dead Cell added
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'applicationId "com.xziel.nzp"' build/android-project/app/build.gradle
          grep -F '<string name="app_name">Xziel: NZP Native</string>' build/android-project/app/src/main/res/values/strings.xml
          grep -F 'XZIEL DEVELOPER' build/deps/vril/source/menu/menu_pause.c
          grep -F 'XzielDev_DispatchPendingImpulse();' build/deps/vril/source/render/r_hud.c
          grep -F 'Command_XzielDev(ftos(action));' build/deps/quakec/source/server/weapons/weapon_core.qc
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import json
          report=json.loads(Path("build/prototype/xziel_proto_report.json").read_text())
          assert report["mode"]=="minimal-green-core"
          assert report["zombie_spawns"]==4 and report["barricades"]==0 and report["zones"]==1
          with ZipFile("build/android-project/app/src/main/assets/nzp-data.zip") as z:
              names=set(z.namelist())
              for ext in ("bsp","nsz","txt"):
                  assert f"nzp/maps/xziel_proto.{ext}" in names, ext
              assert z.read("nzp/maps/xziel_proto.bsp")==Path("proto-dist/xziel_proto.bsp").read_bytes()
              assert z.read("nzp/maps/xziel_proto.nsz")==Path("proto-dist/xziel_proto.nsz").read_bytes()
              assert z.read("nzp/maps/xziel_proto.txt").startswith(b"XZIEL: DEAD CELL")
              assert "nzp/maps/ndu.bsp" in names, "Nacht was replaced!"
              controls={"fire":"fire", "aim":"ads", "aim_fire":"adsfire",
                        "crouch":"crouch", "prone":"prone", "slide":"slide",
                        "reload":"reload", "knife":"knife", "interact":"use",
                        "grenade":"grenade", "weapon_swap":"switch",
                        "vault_jump":"jump"}
              for a,b in controls.items():
                  source=Path(f"assets/xziel/official_touch_skins_v1/{a}.png").read_bytes()
                  assert z.read(f"nzp/gfx/xziel/{b}.png")==source, f"Changed original button: {a}"
              assert len(z.read("nzp/progs.dat"))>50000, "No compiled gameplay logic"
              print("PASS: original DEV+56 weapon controls; all 12 official PNGs exact; stock maps retained; original fast Dead Cell BSP+NSZ+metadata added.")
          PY
      - name: Build source-pinned Xziel v0.26 Android-native APK
        working-directory: build/android-project
        shell: bash
        run: ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Verify ARM64 game and collect original + Dead Cell APK
        shell: bash
        run: |
          set -euo pipefail
          APK=build/android-project/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -p "$APK" lib/arm64-v8a/libmain.so > /tmp/xziel-deadcell.so
          strings /tmp/xziel-deadcell.so | grep -F 'XZIEL DEVELOPER'
          strings /tmp/xziel-deadcell.so | grep -F 'XZIEL WEAPON LAB'
          mkdir -p dead-cell-dist
          cp "$APK" dead-cell-dist/Xziel-v0.26-DEV-Dead-Cell-CORE.apk
          cp proto-dist/xziel_proto.bsp proto-dist/xziel_proto.nsz proto-dist/xziel_proto.map proto-dist/xziel_proto_report.json dead-cell-dist/
          sha256sum "$APK" > dead-cell-dist/APK-SHA256.txt

      - name: Upload APK and original Dead Cell BSP and NSZ
        uses: actions/upload-artifact@v4
        with:
          name: Xziel-v026-DEV-Dead-Cell-CORE
          path: dead-cell-dist/
          if-no-files-found: error
          retention-days: 14
