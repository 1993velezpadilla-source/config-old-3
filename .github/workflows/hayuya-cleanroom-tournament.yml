name: HAYUYA Cleanroom Tournament
run-name: HAYUYA Cleanroom • Monji • isolated providers

on:
  push:
    branches:
      - art/hayuya-cleanroom-aaa-v1
    paths:
      - .github/workflows/hayuya-cleanroom-tournament.yml
      - tools/hayuya3d/cleanroom_engine_router.py
      - tools/hayuya3d/cleanroom_aggregate.py
      - tools/hayuya3d/triposg_cloud.py
      - tools/hayuya3d/trellis2_cloud.py
      - tools/hayuya3d/hunyuan3d_cloud.py
      - hayuya/assets/monji-murgucol/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hayuya-cleanroom-${{ github.ref }}
  cancel-in-progress: true

jobs:
  providers:
    strategy:
      fail-fast: false
      matrix:
        provider: [triposg, hunyuan, trellis2]
    name: provider / ${{ matrix.provider }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    continue-on-error: true
    env:
      INPUT_IMAGE: hayuya/assets/monji-murgucol/geometry/primary.webp
      OUTPUT_DIR: out/hayuya-cleanroom/${{ matrix.provider }}
      PROVIDER: ${{ matrix.provider }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install controller dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install \
            "gradio_client>=1.10,<2" \
            pillow numpy trimesh scipy \
            "scikit-image>=0.22" \
            "fast-simplification>=0.1.7"

      - name: Install TripoSG local RMBG fallback
        if: matrix.provider == 'triposg'
        run: |
          set -euo pipefail
          python -m pip install "rembg>=2.0.67,<3" "onnxruntime>=1.20,<2"

      - name: Compile provider runner
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/hayuya3d/cleanroom_engine_router.py \
            tools/hayuya3d/triposg_cloud.py \
            tools/hayuya3d/trellis2_cloud.py \
            tools/hayuya3d/hunyuan3d_cloud.py

      - name: Verify source
        run: |
          set -euo pipefail
          test -s "$INPUT_IMAGE"

      - name: Run isolated provider
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          python tools/hayuya3d/cleanroom_engine_router.py \
            --input "$INPUT_IMAGE" \
            --output-dir "$OUTPUT_DIR" \
            --providers "$PROVIDER" \
            --seed 1993

      - name: Upload provider evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hayuya-cleanroom-${{ matrix.provider }}
          path: |
            out/hayuya-cleanroom/${{ matrix.provider }}/**
          if-no-files-found: warn
          retention-days: 14

  aggregate:
    name: aggregate surviving providers
    needs: providers
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download provider artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: hayuya-cleanroom-*
          path: out/provider-artifacts
          merge-multiple: false

      - name: Aggregate tournament
        run: |
          set -euo pipefail
          python tools/hayuya3d/cleanroom_aggregate.py \
            --root out/provider-artifacts \
            --output-dir out/hayuya-cleanroom/final

      - name: Upload winner
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hayuya-cleanroom-monji-final
          path: |
            out/hayuya-cleanroom/final/**
          if-no-files-found: warn
          retention-days: 14
