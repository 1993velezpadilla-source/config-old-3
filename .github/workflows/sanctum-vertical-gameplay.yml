name: Sanctum Vertical Gameplay Blockout

on:
  push:
    branches:
      - feature/xziel-map-builder-agent-v1
    paths:
      - ".github/workflows/sanctum-vertical-gameplay.yml"
      - "tools/sanctum_v2/build_sanctum_vertical_blockout.py"
      - "tools/sanctum_v2/enrich_sanctum_cc0_props.py"
      - "docs/sanctum-vertical-layout.v1.json"
      - "tools/xziel_toolchain/xziel_navmesh_bake.cpp"
      - "tools/xziel_toolchain/extract_runtime_geometry.py"
      - "tools/xziel_toolchain/generate_collision_hulls.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sanctum-vertical-gameplay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vertical:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v5

      - name: Install host packages
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            git-lfs curl xz-utils xvfb unzip bzip2 \
            build-essential cmake ninja-build pkg-config python3-venv \
            libx11-6 libxi6 libxxf86vm1 libxfixes3 libxrender1 \
            libgl1 libglu1-mesa libegl1
          git lfs install

      - name: Fetch approved architecture and CC0 art
        shell: bash
        run: |
          set -euo pipefail
          rm -rf external-french-houses external-cc0-church external-ruins external-sanctum-props

          git clone --depth 1 https://github.com/IRCSS/Blender-Geometry-Node-French-Houses.git external-french-houses
          (cd external-french-houses && git lfs pull || true)
          grep -q "MIT License" external-french-houses/LICENSE
          test -s external-french-houses/GeometryNodesFrenchHous.blend

          mkdir -p external-cc0-church external-ruins external-sanctum-props

          curl -L --fail --retry 3 https://opengameart.org/content/medieval-church-interior -o external-cc0-church/page.html
          grep -qi CC0 external-cc0-church/page.html
          curl -L --fail --retry 3 https://opengameart.org/sites/default/files/church.blend -o external-cc0-church/church.blend

          curl -L --fail --retry 3 https://opengameart.org/content/3td-fantasy-ruins-pack-for-blender -o external-ruins/page.html
          grep -qi CC0 external-ruins/page.html
          curl -L --fail --retry 3 https://opengameart.org/sites/default/files/fantasy_ruins_pack_for_blender.blend -o external-ruins/fantasy_ruins_pack_for_blender.blend

          curl -L --fail --retry 3 https://opengameart.org/content/medieval-benches -o external-sanctum-props/benches.html
          grep -qi CC0 external-sanctum-props/benches.html
          curl -L --fail --retry 3 https://opengameart.org/sites/default/files/medievalbenchesexport.blend -o external-sanctum-props/medievalbenchesexport.blend

          curl -L --fail --retry 3 https://opengameart.org/content/medieval-candles -o external-sanctum-props/candles.html
          grep -qi CC0 external-sanctum-props/candles.html
          curl -L --fail --retry 3 https://opengameart.org/sites/default/files/medievalcandles.blend -o external-sanctum-props/medievalcandles.blend

          test -s external-cc0-church/church.blend
          test -s external-ruins/fantasy_ruins_pack_for_blender.blend
          test -s external-sanctum-props/medievalbenchesexport.blend
          test -s external-sanctum-props/medievalcandles.blend

          sha256sum external-ruins/fantasy_ruins_pack_for_blender.blend | tee /tmp/ruins.sha256
          sha256sum external-sanctum-props/medievalbenchesexport.blend | tee /tmp/bench.sha256
          sha256sum external-sanctum-props/medievalcandles.blend | tee /tmp/candle.sha256

      - name: Install Blender 5.2.2
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz -o /tmp/blender.tar.xz
          tar -C /tmp -xf /tmp/blender.tar.xz
          /tmp/blender-5.2.2-linux-x64/blender --version

      - name: Build three-floor Sanctum
        shell: bash
        env:
          SANCTUM_COMPOSITE_OUT: sanctum-vertical-composite
          SANCTUM_DRESS_OUT: sanctum-vertical-dressed
          SANCTUM_ENRICH_OUT: sanctum-vertical-enriched
          SANCTUM_VERTICAL_OUT: sanctum-vertical-probe
          SANCTUM_CC0_BLEND: external-cc0-church/church.blend
          SANCTUM_RUINS_BLEND: external-ruins/fantasy_ruins_pack_for_blender.blend
          SANCTUM_BENCH_BLEND: external-sanctum-props/medievalbenchesexport.blend
          SANCTUM_CANDLE_BLEND: external-sanctum-props/medievalcandles.blend
          SANCTUM_VERTICAL_LAYOUT: docs/sanctum-vertical-layout.v1.json
          XZIEL_MAP_AGENT_PLAN: tools/sanctum_v2/map_builder_plan.json
        run: |
          set -euo pipefail
          mkdir -p sanctum-vertical-composite sanctum-vertical-dressed sanctum-vertical-enriched sanctum-vertical-probe
          export SANCTUM_RUINS_SHA256="$(cut -d' ' -f1 /tmp/ruins.sha256)"
          export SANCTUM_BENCH_SHA256="$(cut -d' ' -f1 /tmp/bench.sha256)"
          export SANCTUM_CANDLE_SHA256="$(cut -d' ' -f1 /tmp/candle.sha256)"

          xvfb-run -a -s "-screen 0 1600x1000x24" \
            /tmp/blender-5.2.2-linux-x64/blender \
            -b external-french-houses/GeometryNodesFrenchHous.blend \
            --python tools/sanctum_v2/build_sanctum_vertical_blockout.py \
            2>&1 | tee sanctum-vertical-probe/blender-vertical.log

          grep -q SANCTUM_VERTICAL_BLOCKOUT_PASS sanctum-vertical-probe/blender-vertical.log

      - name: Validate vertical evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          root=Path("sanctum-vertical-probe")
          d=json.loads((root/"vertical-report.json").read_text(encoding="utf-8"))
          ads=json.loads((root/"sanctum-ad-surfaces.json").read_text(encoding="utf-8"))
          gp=json.loads((root/"sanctum-gameplay-entities.json").read_text(encoding="utf-8"))

          assert d["status"]=="PASS",d
          assert d["vertical_span_m"] >= 7.0,d
          assert len(d["connections"])==4,d
          assert d["ad_surface_count"]==3,d
          assert len(d["renders"])==6,d
          assert d["glb_bytes"]>1000000,d
          assert len(ads["placements"])==3,ads
          assert ads["policy"]["pauses_gameplay"] is False,ads
          assert ads["policy"]["hud_overlay"] is False,ads
          assert ads["policy"]["forced_fullscreen"] is False,ads
          assert len(gp["entities"])>=8,gp

          for item in d["renders"]:
              p=root/item["name"]
              assert p.is_file() and p.stat().st_size>4000,p

          print("SANCTUM_VERTICAL_EVIDENCE_GREEN")
          print("FLOOR_HEIGHTS",d["floor_heights_m"])
          print("VERTICAL_SPAN",d["vertical_span_m"])
          print("ADS",len(ads["placements"]))
          print("GAMEPLAY_ENTITIES",len(gp["entities"]))
          PY

      - name: Optimize validate and build runtime navigation
        shell: bash
        env:
          XZIEL_KTX2_UASTC: "1"
        run: |
          set -euo pipefail

          RAW="sanctum-vertical-probe/sanctum-vertical-blockout.glb"

          bash tools/xziel_toolchain/bootstrap_asset_cli.sh
          bash tools/xziel_toolchain/process_glb.sh \
            "$RAW" sanctum-vertical-probe/asset-pipeline sanctum-vertical

          bash tools/xziel_toolchain/bootstrap_fast.sh
          bash tools/xziel_toolchain/bootstrap_geometry_cpu.sh
          mkdir -p sanctum-vertical-probe/runtime

          .xziel-tools/geometry-venv/bin/python \
            tools/xziel_toolchain/extract_runtime_geometry.py \
            --input "$RAW" \
            --out sanctum-vertical-probe/runtime \
            --exclude-prefix SANCTUM_AD_

          .xziel-tools/bin/xziel-navmesh-bake \
            sanctum-vertical-probe/runtime/sanctum-nav-source.obj \
            sanctum-vertical-probe/runtime/sanctum.navbin \
            sanctum-vertical-probe/runtime/navmesh-report.json

          .xziel-tools/geometry-venv/bin/python \
            tools/xziel_toolchain/generate_collision_hulls.py \
            --input sanctum-vertical-probe/runtime/sanctum-collision-source.glb \
            --output sanctum-vertical-probe/runtime/sanctum-collision-hulls.glb \
            --report sanctum-vertical-probe/runtime/collision-report.json \
            --threshold 0.10 \
            --max-hulls 128 \
            --max-hull-vertices 64

          python3 - <<'PY'
          import json
          from pathlib import Path

          root=Path("sanctum-vertical-probe")
          pipe=json.loads((root/"asset-pipeline/sanctum-vertical.pipeline.json").read_text(encoding="utf-8"))
          nav=json.loads((root/"runtime/navmesh-report.json").read_text(encoding="utf-8"))
          col=json.loads((root/"runtime/collision-report.json").read_text(encoding="utf-8"))

          assert pipe["validator"]["errors"]==0,pipe
          assert nav["status"]=="PASS",nav
          assert nav["nav_polygons"]>0,nav
          assert nav["nav_vertical_span"]>=6.5,nav
          assert nav["nav_vertical_bands"]>=3,nav
          assert nav["nearest_poly_ref"]!=0,nav
          assert col["status"]=="PASS",col
          assert 1<=col["hull_count"]<=128,col
          assert col["hull_triangles"]>0,col

          print("SANCTUM_VERTICAL_RUNTIME_GREEN")
          print("NAV_POLYGONS",nav["nav_polygons"])
          print("NAV_VERTICAL_SPAN",nav["nav_vertical_span"])
          print("NAV_VERTICAL_BANDS",nav["nav_vertical_bands"])
          print("COLLISION_HULLS",col["hull_count"])
          PY

      - name: Upload vertical Sanctum
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XZIEL-Sanctum-Vertical-Gameplay
          path: |
            sanctum-vertical-probe/
            sanctum-vertical-enriched/enriched-report.json
            sanctum-vertical-dressed/dressed-report.json
            sanctum-vertical-composite/composite-report.json
          if-no-files-found: error
          retention-days: 14
