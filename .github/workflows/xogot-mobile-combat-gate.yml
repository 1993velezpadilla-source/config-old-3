name: Xogot Mobile Combat Gate

on:
  workflow_dispatch:
  push:
    branches:
      - feature/godot-aaa-rebuild-v1
    paths:
      - "xogot/scripts/player.gd"
      - "xogot/scripts/weapon.gd"
      - "xogot/scripts/mobile_*.gd"
      - "xogot/assets/hud/**"
      - "xogot/ci/mobile_survival_probe.gd"
      - ".github/workflows/xogot-mobile-combat-gate.yml"

permissions:
  contents: read

concurrency:
  group: xogot-mobile-combat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-combat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Install Godot 4.6.1
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip curl
          curl -L --fail --retry 5 --retry-all-errors --retry-delay 2 \
            https://github.com/godotengine/godot-builds/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip \
            -o /tmp/godot.zip
          rm -rf /tmp/godot
          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.6.1-stable_linux.x86_64

      - name: Import project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/xogot-mobile
          timeout 180 /tmp/godot/Godot_v4.6.1-stable_linux.x86_64 \
            --headless --editor --path xogot --quit \
            2>&1 | tee build/xogot-mobile/import.log
          ! grep -E "SCRIPT ERROR|Parse Error|ERROR: Failed to load script" build/xogot-mobile/import.log

      - name: Verify NZPortable mobile combat parity
        shell: bash
        run: |
          set -euo pipefail
          timeout 90 /tmp/godot/Godot_v4.6.1-stable_linux.x86_64 \
            --headless --path xogot --script res://ci/mobile_survival_probe.gd \
            2>&1 | tee build/xogot-mobile/mobile-survival-probe.log
          grep -q "XZOGOT_MOBILE_CUSTOM_SKINS_GREEN" build/xogot-mobile/mobile-survival-probe.log
          grep -q "XZOGOT_MOBILE_PISTOL_AUTOFIRE_GREEN" build/xogot-mobile/mobile-survival-probe.log
          grep -q "XZOGOT_MOBILE_RELEASE_FIRE_GREEN" build/xogot-mobile/mobile-survival-probe.log
          grep -q "XZOGOT_SPRINT_RELOAD_PRESERVED_GREEN" build/xogot-mobile/mobile-survival-probe.log
          grep -q "XZOGOT_MOBILE_ADS_READY_GATE_GREEN" build/xogot-mobile/mobile-survival-probe.log
          grep -q "XZOGOT_MOBILE_SPRINT_ZONE_GREEN" build/xogot-mobile/mobile-survival-probe.log
          grep -q "XZOGOT_MOBILE_ACTION_SPRINT_SUPPRESSION_GREEN" build/xogot-mobile/mobile-survival-probe.log
          grep -q "XZOGOT_MOBILE_ADS_RELOAD_RESTORE_GREEN" build/xogot-mobile/mobile-survival-probe.log
          grep -q "XZOGOT_MOBILE_ADS_WALK_SPEED_GREEN" build/xogot-mobile/mobile-survival-probe.log
          grep -q "XZOGOT_ADS_MOVE_SOURCE_POLICY_GREEN" build/xogot-mobile/mobile-survival-probe.log
          grep -q "XZOGOT_GYRO_ADS_ONLY_GREEN" build/xogot-mobile/mobile-survival-probe.log
          grep -q "XZOGOT_AUTO_REBUILD_PROBE_GREEN" build/xogot-mobile/mobile-survival-probe.log
          grep -q "XZOGOT_MANUAL_KNIFE_PROBE_GREEN" build/xogot-mobile/mobile-survival-probe.log
          grep -q "XZOGOT_DISMEMBERMENT_CRAWLER_PROBE_GREEN" build/xogot-mobile/mobile-survival-probe.log
          grep -q "XZOGOT_MOBILE_SURVIVAL_PROBE_GREEN" build/xogot-mobile/mobile-survival-probe.log
          ! grep -E "SCRIPT ERROR|Parse Error|ERROR: Failed to load script|MOBILE_SURVIVAL_PROBE:" build/xogot-mobile/mobile-survival-probe.log
          echo "XZOGOT_MOBILE_COMBAT_GATE_GREEN"

      - name: Upload mobile combat proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Xogot-Mobile-Combat-Proof
          path: build/xogot-mobile/
          if-no-files-found: warn
