          unzip -l "$APK" | tee "$GITHUB_WORKSPACE/xzwin-apk-files.txt"

          grep -q 'lib/arm64-v8a/libxzbox64.so' "$GITHUB_WORKSPACE/xzwin-apk-files.txt"
          grep -q 'assets/xzwin/rootfs.tzst' "$GITHUB_WORKSPACE/xzwin-apk-files.txt"
          grep -q 'assets/xzwin/default.box64rc' "$GITHUB_WORKSPACE/xzwin-apk-files.txt"

          mkdir -p "$RUNNER_TEMP/apk-check"
          unzip -p "$APK" lib/arm64-v8a/libxzbox64.so \
            > "$RUNNER_TEMP/apk-check/libxzbox64.so"
          file "$RUNNER_TEMP/apk-check/libxzbox64.so" \
            | tee "$GITHUB_WORKSPACE/xzwin-packaged-box64.txt"
          readelf -h "$RUNNER_TEMP/apk-check/libxzbox64.so" \
