name: Hayuya Portable Texture E2E

on:
  workflow_dispatch:
  push:
    branches:
      - art/hayuya-monster-v1
    paths:
      - tools/hayuya3d/portable_textures.py
      - tools/hayuya3d/portable_pack.py
      - tools/hayuya3d/tests/test_portable_textures.py
      - .github/workflows/hayuya-portable-textures-ci.yml

permissions:
  contents: read

jobs:
  ktx2-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAYUYA_KTX2_E2E: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned glTF Transform
        run: |
          npm install --global @gltf-transform/cli@4.5.0
          gltf-transform --version

      - name: Install pinned KTX-Software
        run: |
          curl -L --fail --retry 3             -o /tmp/ktx.deb             https://github.com/KhronosGroup/KTX-Software/releases/download/v4.4.2/KTX-Software-4.4.2-Linux-x86_64.deb
          sudo apt-get update
          sudo apt-get install -y /tmp/ktx.deb
          ktx --version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Hayuya fixture dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pillow trimesh

      - name: Physical KTX2 GLB conversion proof
        run: |
          python -m unittest tools.hayuya3d.tests.test_portable_textures -v
