name: HAYUYA Character Package

on:
  workflow_dispatch:
    inputs:
      recipe_b64:
        description: Base64 encoded HAYUYA editor recipe
        required: true
        type: string

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Hayuya branch
        uses: actions/checkout@v4
        with:
          ref: art/hayuya-monster-v1
          fetch-depth: 1

      - name: Decode recipe
        id: recipe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/character-package
          printf '%s' '${{ inputs.recipe_b64 }}' | base64 -d > out/character-package/recipe.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          r=json.loads(Path("out/character-package/recipe.json").read_text())
          job=str(r["job_id"])
          if not job.replace("-","").replace("_","").isalnum():
              raise SystemExit("unsafe job_id")
          anims=r.get("selected",{}).get("animations",[])
          external=r.get("selected",{}).get("real_mocap",[])
          sources=sorted({
              str(x.get("source")) for x in anims
              if x.get("availability") in (None,"local") and x.get("clip") and x.get("source")
          })
          source=(sources[0] if len(sources)==1 else ("mixed" if len(sources)>1 else "none"))
          print(f"job_id={job}")
          print(f"needs_rig={'true' if anims else 'false'}")
          print(f"animation_source={source}")
          print(f"has_external={'true' if external else 'false'}")
          PY

      - name: Validate source model
        shell: bash
        run: |
          set -euo pipefail
          test -f "hayuya/models/${{ steps.recipe.outputs.job_id }}/model.glb"
          python tools/hayuya3d/mesh_gate.py             "hayuya/models/${{ steps.recipe.outputs.job_id }}/model.glb"             --json out/character-package/source-mesh-gate.json

      - name: Resolve best character model
        id: model
        shell: bash
        run: |
          set -euo pipefail
          job="${{ steps.recipe.outputs.job_id }}"
          base="hayuya/models/$job/model.glb"
          source="${{ steps.recipe.outputs.animation_source }}"
          selected="$base"
          needs_autorig="false"
          donor="hayuya/animation_library/quaternius-uam2/library.glb"
          bank=""
          bank_key=""

          case "$source" in
            quaternius-uam1)
              donor="hayuya/animation_library/quaternius-uam1/library.glb"
              bank="hayuya/models/$job/animated-uam1.glb"
              bank_key="quaternius-uam1"
              ;;
            quaternius-uam2)
              donor="hayuya/animation_library/quaternius-uam2/library.glb"
              bank="hayuya/models/$job/animated.glb"
              bank_key="quaternius-uam2"
              ;;
            mixed)
              donor="hayuya/animation_library/quaternius-uam2/library.glb"
              bank="hayuya/models/$job/animated.glb"
              bank_key="quaternius-uam2"
              ;;
            *)
              donor="hayuya/animation_library/quaternius-uam2/library.glb"
              bank="hayuya/models/$job/animated.glb"
              bank_key="quaternius-uam2"
              ;;
          esac

          if [[ "${{ steps.recipe.outputs.needs_rig }}" == "true" ]]; then
            safe_existing="false"
            if [[ -n "$bank" && -f "$bank" && -f "hayuya/models/$job/manifest.json" ]]; then
              SAFE_BANK_KEY="$bank_key" python - <<'PY' && safe_existing="true" || true
          import json, os
          from pathlib import Path
          recipe=json.loads(Path("out/character-package/recipe.json").read_text())
          manifest=json.loads((Path("hayuya/models")/recipe["job_id"]/"manifest.json").read_text())
          bank_key=os.environ["SAFE_BANK_KEY"]
          bank=(manifest.get("animation_banks") or {}).get(bank_key) or {}
          if int(bank.get("rig_quality_version") or 0) < 2 or bank.get("quality_passed") is not True:
              raise SystemExit("existing animation bank is not Rig QA v2 safe")
          selected={
              str(x.get("clip")) for x in (recipe.get("selected",{}).get("animations") or [])
              if x.get("availability") in (None,"local") and x.get("clip")
          }
          compatible={str(x) for x in bank.get("clips") or []}
          missing=sorted(selected-compatible)
          if missing:
              raise SystemExit("selected clips are not deformation-safe in existing bank: "+", ".join(missing))
          print("HAYUYA_EXISTING_SAFE_BANK",bank_key,len(compatible))
          PY
            fi
            if [[ "$safe_existing" == "true" ]]; then
              selected="$bank"
            else
              needs_autorig="true"
            fi
          fi

          echo "path=$selected" >> "$GITHUB_OUTPUT"
          echo "donor=$donor" >> "$GITHUB_OUTPUT"
          echo "bank_key=$bank_key" >> "$GITHUB_OUTPUT"
          echo "needs_autorig=$needs_autorig" >> "$GITHUB_OUTPUT"
          echo "HAYUYA_PACKAGE_MODEL=$selected"
          echo "HAYUYA_PACKAGE_DONOR=$donor"
          echo "HAYUYA_PACKAGE_NEEDS_AUTORIG=$needs_autorig"

      - name: Install Blender for animation retarget
        if: steps.model.outputs.needs_autorig == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender python3-numpy

      - name: AutoRig + retarget local animation library
        if: steps.model.outputs.needs_autorig == 'true'
        shell: bash
        run: |
          set -euo pipefail
          blender --python-exit-code 1 -b --python tools/hayuya3d/blender_autorig.py -- \
            --target "hayuya/models/${{ steps.recipe.outputs.job_id }}/model.glb" \
            --donor "${{ steps.model.outputs.donor }}" \
            --output out/character-package/rigged.glb \
            --report out/character-package/autorig-report.json
          python tools/hayuya3d/rig_gate.py \
            out/character-package/rigged.glb \
            --json out/character-package/rig-gate.json
          blender --python-exit-code 1 -b --python tools/hayuya3d/blender_animation_gate.py -- \
            --model out/character-package/rigged.glb \
            --reference "hayuya/models/${{ steps.recipe.outputs.job_id }}/model.glb" \
            --json out/character-package/animation-gate.json --samples 5 || true
          python - <<'PY'
          import json
          from pathlib import Path
          rig=json.loads(Path("out/character-package/rig-gate.json").read_text())
          gate=json.loads(Path("out/character-package/animation-gate.json").read_text())
          recipe=json.loads(Path("out/character-package/recipe.json").read_text())
          assert rig.get("rig_ready") is True, rig
          assert rig.get("animation_ready") is True, rig
          assert int(rig.get("weighted_joints") or 0) >= 12, rig
          selected={
              str(x.get("clip")) for x in (recipe.get("selected",{}).get("animations") or [])
              if x.get("availability") in (None,"local") and x.get("clip")
          }
          compatible={str(x) for x in gate.get("compatible_clips") or []}
          missing=sorted(selected-compatible)
          if missing:
              raise SystemExit("Selected animation(s) failed deformation QA: "+", ".join(missing))
          if selected and not compatible:
              raise SystemExit("No deformation-safe animation clips")
          print("HAYUYA_PACKAGE_RIG_PASS",rig["joints"],rig.get("weighted_joints"),len(compatible))
          print("HAYUYA_PACKAGE_SELECTED_CLIPS_PASS",sorted(selected))
          PY

      - name: Build ZIP package
        shell: bash
        run: |
          set -euo pipefail
          model="${{ steps.model.outputs.path }}"
          if [[ -f out/character-package/rigged.glb ]]; then
            model="out/character-package/rigged.glb"
          fi
          gate_args=()
          if [[ -f out/character-package/animation-gate.json ]]; then
            gate_args+=(--animation-gate out/character-package/animation-gate.json)
          fi
          python tools/hayuya3d/build_character_package.py \
            --recipe out/character-package/recipe.json \
            --model "$model" \
            --out out/character-package/build \
            "${gate_args[@]}"

      - name: Persist recipe and latest package to GitHub
        shell: bash
        run: |
          set -euo pipefail
          job="${{ steps.recipe.outputs.job_id }}"
          dst="hayuya/packages/$job"
          mkdir -p "$dst"
          cp out/character-package/recipe.json "$dst/recipe.json"
          cp "out/character-package/build/$job-hayuya-package.zip" "$dst/latest.zip"
          cp "out/character-package/build/$job/BUILD.json" "$dst/BUILD.json"
          if [[ -f out/character-package/rig-gate.json ]]; then
            cp out/character-package/rig-gate.json "$dst/rig_gate.json"
          fi
          if [[ -f out/character-package/autorig-report.json ]]; then
            cp out/character-package/autorig-report.json "$dst/autorig-report.json"
          fi
          if [[ -f out/character-package/animation-gate.json ]]; then
            cp out/character-package/animation-gate.json "$dst/animation_gate.json"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$dst"
          if git diff --cached --quiet; then
            echo "No package changes to commit."
            exit 0
          fi
          git commit -m "hayuya: build game-ready package for $job"
          git pull --rebase origin art/hayuya-monster-v1
          git push origin HEAD:art/hayuya-monster-v1

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: hayuya-package-${{ steps.recipe.outputs.job_id }}
          path: out/character-package/build/*-hayuya-package.zip
          retention-days: 30

      - name: Notify HAYUYA Hub
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          status='${{ job.status }}'
          url='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          job='${{ steps.recipe.outputs.job_id }}'
          if [[ "$status" == "success" ]]; then
            gh issue comment 55 --repo "$GITHUB_REPOSITORY" --body "📦 **PACKAGE READY** — **HAYUYA** / `$job`

          Character recipe, animation rig (when selected), audio payload and ZIP are saved under `hayuya/packages/$job/`.

          [Open package build]($url)"
          else
            gh issue comment 55 --repo "$GITHUB_REPOSITORY" --body "❌ **PACKAGE FAILED** — **HAYUYA** / `$job`

          [Open package build]($url)"
          fi
