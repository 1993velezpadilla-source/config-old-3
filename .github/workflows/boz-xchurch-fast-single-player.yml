name: XChurch Fast Single Player Driver
# reusable-driver-v2

on:
  workflow_dispatch:
  push:
    branches:
      - feature/boz-mod-runtime
    paths:
      - ".github/workflows/boz-xchurch-fast-single-player.yml"

permissions:
  actions: read
  contents: read

jobs:
  drive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Enable KVM
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/xchurch-fast/screens
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"'             | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          test -e /dev/kvm

      - name: Download reusable diagnostic APK
        uses: actions/download-artifact@v4
        with:
          name: XChurch-Diagnostic-Touch-APK
          run-id: 36783515318
          github-token: ${{ github.token }}
          path: /tmp/xchurch-diag

      - name: Install Android 11 emulator tools
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n1)"
          AVDMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name avdmanager | sort -V | tail -n1)"
          echo "AVDMANAGER=$AVDMANAGER" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "emulator" "build-tools;36.0.0"             "system-images;android-30;google_apis;x86_64" >/dev/null

      - name: A/B test NO legacy online auth or downloader using original embedded DZ
        shell: bash
        run: |
          set -euo pipefail
          SRC="$(find /tmp/xchurch-diag -type f -name '*.apk' | head -n1)"
          test -s "$SRC"
          OUT=/tmp/xchurch-fast-offline
          mkdir -p "$OUT/stage/assets"
          unzip -p "$SRC" assets/app.icf > "$OUT/app-original.icf"
          python3 tools/boz_mod/patch_offline_startup_icf.py "$OUT/app-original.icf" "$OUT/stage/assets/app.icf"
          cmp -s "$OUT/app-original.icf" "$OUT/stage/assets/app.icf" && { echo "patch ineffective"; exit 1; } || true
          grep -q "^EnableOF=0$" "$OUT/stage/assets/app.icf"
          grep -q "^ResourceDownloader=0$" "$OUT/stage/assets/app.icf"
          cp "$SRC" "$OUT/unsigned.apk"
          zip -qd "$OUT/unsigned.apk" assets/app.icf || true
          zip -qd "$OUT/unsigned.apk" 'META-INF/*.RSA' 'META-INF/*.DSA' 'META-INF/*.EC' 'META-INF/*.SF' 'META-INF/MANIFEST.MF' || true
          (cd "$OUT/stage"; zip -q "$OUT/unsigned.apk" assets/app.icf)
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -f -p 4 "$OUT/unsigned.apk" "$OUT/aligned.apk"
          keytool -genkeypair -noprompt -keystore "$OUT/ci-debug.jks" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=XChurchOffline,O=XZIEL,C=US" >/dev/null 2>&1
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$OUT/ci-debug.jks" --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out "$OUT/offline.apk" "$OUT/aligned.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$OUT/offline.apk"
          test -s "$OUT/offline.apk"
          echo "XZIEL_A_B_OFFLINE_CONFIG_APK_READY"

      - name: Boot Android 11
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_AVD_HOME=/tmp/xchurch-fast-avd
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_AVD_HOME"
          printf 'no\n' | "$AVDMANAGER" create avd             --force --name xchurch-fast             --package "system-images;android-30;google_apis;x86_64"             --device "pixel_4" >/dev/null

          ADB="$ANDROID_HOME/platform-tools/adb"
          EMU="$ANDROID_HOME/emulator/emulator"
          "$ADB" start-server >/dev/null 2>&1 || true
          nohup "$EMU" @xchurch-fast             -no-window -gpu swiftshader_indirect -no-snapshot             -noaudio -no-boot-anim -no-metrics -camera-back none             > /tmp/xchurch-fast/emulator.log 2>&1 &
          echo "EMU_PID=$!" > /tmp/xchurch-fast/status.txt

          for i in $(seq 1 70); do
            [ "$("$ADB" get-state 2>/dev/null || true)" = "device" ] && break
            sleep 2
          done
          for i in $(seq 1 70); do
            [ "$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] && break
            sleep 2
          done
          echo "BOOT_OK=1" >> /tmp/xchurch-fast/status.txt

      - name: Drive title then delayed Single Player
        shell: bash
        run: |
          set +e
          OUT=/tmp/xchurch-fast
          ADB="$ANDROID_HOME/platform-tools/adb"
          APK="/tmp/xchurch-fast-offline/offline.apk"
          test -s "$APK" || exit 1

          "$ADB" install --abi arm64-v8a -r -d "$APK" > "$OUT/install.txt" 2>&1
          echo "INSTALL_RC=$?" | tee -a "$OUT/status.txt"
          "$ADB" shell pm grant com.activision.boz android.permission.WRITE_EXTERNAL_STORAGE 2>/dev/null || true
          "$ADB" shell pm grant com.activision.boz android.permission.READ_EXTERNAL_STORAGE 2>/dev/null || true
          "$ADB" shell appops set com.activision.boz MANAGE_EXTERNAL_STORAGE allow 2>/dev/null || true
          "$ADB" shell mkdir -p /sdcard/Android/obb/com.activision.boz 2>/dev/null || true

          "$ADB" logcat -c
          "$ADB" shell am force-stop com.activision.boz
          "$ADB" shell am start -W -n com.activision.boz/.Main > "$OUT/launch.txt" 2>&1

          TITLE_HASH="49d0c83ce3913b461bc8b6eab848f15305487af49528efa832d2c787732204bb"
          FOUND=0
          for SEC in $(seq 60 5 230); do
            "$ADB" exec-out screencap -p > "$OUT/screens/poll_${SEC}s.png" 2>/dev/null || true
            H="$(sha256sum "$OUT/screens/poll_${SEC}s.png" | awk '{print $1}')"
            echo "POLL_${SEC}s=$H" >> "$OUT/status.txt"
            if [ "$H" = "$TITLE_HASH" ]; then
              echo "TITLE_AT=${SEC}s" | tee -a "$OUT/status.txt"
              cp "$OUT/screens/poll_${SEC}s.png" "$OUT/screens/title.png"
              FOUND=1
              break
            fi
            sleep 5
          done

          if [ "$FOUND" = "1" ]; then
            "$ADB" shell am start -W -n com.activision.boz/.Main               --ez xzielDirectTap true --ei xzielX 1140 --ei xzielY 540               > "$OUT/title-tap.txt" 2>&1
            sleep 10
            "$ADB" exec-out screencap -p > "$OUT/screens/main_menu_10s.png"

            # Let the menu completely settle before interacting again.
            sleep 15
            "$ADB" exec-out screencap -p > "$OUT/screens/main_menu_25s.png"

            "$ADB" shell am start -W -n com.activision.boz/.Main               --ez xzielDirectTap true --ei xzielX 570 --ei xzielY 165               > "$OUT/single-player-tap.txt" 2>&1
            echo "SINGLE_PLAYER_TAP_SENT=570,165" | tee -a "$OUT/status.txt"

            sleep 5
            "$ADB" exec-out screencap -p > "$OUT/screens/after_single_05s.png"
            sleep 10
            "$ADB" exec-out screencap -p > "$OUT/screens/after_single_15s.png"
            sleep 15
            "$ADB" exec-out screencap -p > "$OUT/screens/after_single_30s.png"

            # VISUAL CORRECTION from actual captured pixels:
            # main_menu_25s.png was STILL "TOUCH SCREEN TO START".
            # Our second touch was the one which finally opened Main Menu.
            # Thus the old workflow had NEVER PRESSED SINGLE PLAYER.
            cp "$OUT/screens/after_single_30s.png" "$OUT/screens/after_title_second_tap_30s.png"
            echo "AFTER_SECOND_TITLE_TAP_CAPTURED=1" >> "$OUT/status.txt"

            # Now the original BOZ MAIN MENU is on screen. Its upper-left
            # SINGLE PLAYER button really spans approximately x=360..805,
            # y=130..208 in the captured 2280x1080 Android framebuffer.
            "$ADB" shell am start -W -n com.activision.boz/.Main \
              --ez xzielDirectTap true --ei xzielX 570 --ei xzielY 165 \
              > "$OUT/real-single-player-tap.txt" 2>&1
            echo "ACTUAL_SINGLE_PLAYER_TAP_SENT=570,165" | tee -a "$OUT/status.txt"
            sleep 5
            "$ADB" exec-out screencap -p > "$OUT/screens/real_single_05s.png"
            sleep 10
            "$ADB" exec-out screencap -p > "$OUT/screens/real_single_15s.png"
            sleep 15
            "$ADB" exec-out screencap -p > "$OUT/screens/real_single_30s.png"

            # A changed framebuffer only means screen transition, NOT proof
            # of a loaded 3D map or visible zombies. Upload native evidence.
            BEFORE_HASH="$(sha256sum "$OUT/screens/after_title_second_tap_30s.png" | awk '{print $1}')"
            AFTER_HASH="$(sha256sum "$OUT/screens/real_single_30s.png" | awk '{print $1}')"
            echo "BEFORE_SINGLE_HASH=$BEFORE_HASH" >> "$OUT/status.txt"
            echo "AFTER_REAL_SINGLE_HASH=$AFTER_HASH" >> "$OUT/status.txt"
            if [ "$BEFORE_HASH" = "$AFTER_HASH" ]; then
              echo "XCHURCH_REAL_SINGLE_PLAYER_NO_SCREEN_TRANSITION_RED" | tee -a "$OUT/status.txt"
            else
              echo "XCHURCH_REAL_SINGLE_PLAYER_SCREEN_CHANGED_VISUAL_REVIEW_REQUIRED" | tee -a "$OUT/status.txt"
            fi

            # This is now confirmed to display BOZ's ACTUAL SINGLE PLAYER
            # screen, with NEW GAME on the lower-left illustration.
            # Screenshot dimensions are 2280x1080, coordinates are full-size.
            "$ADB" shell am start -W -n com.activision.boz/.Main \
              --ez xzielDirectTap true --ei xzielX 970 --ei xzielY 828 \
              > "$OUT/new-game-tap.txt" 2>&1
            echo "REAL_NEW_GAME_TAP_SENT=970,828" | tee -a "$OUT/status.txt"
            sleep 5
            "$ADB" exec-out screencap -p > "$OUT/screens/after_new_game_05s.png"
            sleep 10
            "$ADB" exec-out screencap -p > "$OUT/screens/after_new_game_15s.png"
            sleep 15
            "$ADB" exec-out screencap -p > "$OUT/screens/after_new_game_30s.png"
            AFTER_NEW_GAME_HASH="$(sha256sum "$OUT/screens/after_new_game_30s.png" | awk '{print $1}')"
            echo "AFTER_NEW_GAME_HASH=$AFTER_NEW_GAME_HASH" >> "$OUT/status.txt"
            if [ "$AFTER_NEW_GAME_HASH" = "$AFTER_HASH" ]; then
              # Tapping the NEW GAME caption was delivered by native touch,
              # but the screenshot was unchanged. Try the original illustrated
              # card's BODY instead; this changes no game engine code/assets.
              echo "XCHURCH_NEW_GAME_LABEL_TAP_UNCHANGED_RETRY_CARD_BODY" | tee -a "$OUT/status.txt"
              "$ADB" shell am start -W -n com.activision.boz/.Main \
                --ez xzielDirectTap true --ei xzielX 690 --ei xzielY 530 \
                > "$OUT/new-game-card-tap.txt" 2>&1
              sleep 15
              "$ADB" exec-out screencap -p > "$OUT/screens/after_new_game_card_15s.png"
              RETRY_HASH="$(sha256sum "$OUT/screens/after_new_game_card_15s.png" | awk '{print $1}')"
              if [ "$RETRY_HASH" = "$AFTER_HASH" ]; then
                echo "XCHURCH_NEW_GAME_CARD_BODY_STILL_NO_TRANSITION_RED" | tee -a "$OUT/status.txt"
              else
                echo "XCHURCH_NEW_GAME_CARD_SCREEN_CHANGED_VISUAL_REVIEW_REQUIRED" | tee -a "$OUT/status.txt"
                # Actual inspected original BOZ frame is the SELECT CHARACTER /
                # DIFFICULTY / SELECT MAP menu. Coordinates use native 2280x1080.
                # Select Kino, Regular and Continue. NO asset or gameplay edits.
                "$ADB" shell am start -W -n com.activision.boz/.Main --ez xzielDirectTap true --ei xzielX 1358 --ei xzielY 780 > "$OUT/kino-map-tap.txt" 2>&1
                echo "REAL_KINO_MAP_TILE_TAP_SENT=1358,780" | tee -a "$OUT/status.txt"
                sleep 3
                "$ADB" exec-out screencap -p > "$OUT/screens/after_kino_map_tap.png"
                "$ADB" shell am start -W -n com.activision.boz/.Main --ez xzielDirectTap true --ei xzielX 1760 --ei xzielY 472 > "$OUT/regular-difficulty-tap.txt" 2>&1
                echo "REAL_REGULAR_DIFFICULTY_TAP_SENT=1760,472" | tee -a "$OUT/status.txt"
                sleep 2
                "$ADB" exec-out screencap -p > "$OUT/screens/after_regular_difficulty_tap.png"
                "$ADB" shell am start -W -n com.activision.boz/.Main --ez xzielDirectTap true --ei xzielX 1760 --ei xzielY 995 > "$OUT/continue-start-game-tap.txt" 2>&1
                echo "REAL_CONTINUE_TO_GAME_TAP_SENT=1760,995" | tee -a "$OUT/status.txt"
                sleep 5
                "$ADB" exec-out screencap -p > "$OUT/screens/after_continue_05s.png"
                sleep 10
                "$ADB" exec-out screencap -p > "$OUT/screens/after_continue_15s.png"
                sleep 15
                "$ADB" exec-out screencap -p > "$OUT/screens/after_continue_30s.png"
                sleep 30
                "$ADB" exec-out screencap -p > "$OUT/screens/after_continue_60s.png"
                # Exact previous run: all three Android MotionEvents returned
                # handled=true but EVERY screen remained byte-identical to
                # the original character/map menu. Try OS input directly.
                STUCK_BEFORE="$(sha256sum "$OUT/screens/after_new_game_card_15s.png" | cut -d " " -f1)"
                STUCK_AFTER="$(sha256sum "$OUT/screens/after_continue_60s.png" | cut -d " " -f1)"
                if [ "$STUCK_BEFORE" = "$STUCK_AFTER" ]; then
                  echo "XCHURCH_NATIVE_TOUCH_HANDLED_BUT_GAME_MENU_FROZEN_RETEST_ADB_INPUT" | tee -a "$OUT/status.txt"
                  "$ADB" shell input tap 425 220; sleep 2
                  "$ADB" shell input tap 1700 460; sleep 2
                  "$ADB" shell input tap 1380 770; sleep 2
                  "$ADB" exec-out screencap -p > "$OUT/screens/adb_pre_continue.png"
                  "$ADB" shell input tap 1730 995; sleep 15
                  "$ADB" exec-out screencap -p > "$OUT/screens/adb_after_continue_15s.png"
                  ADHASH="$(sha256sum "$OUT/screens/adb_after_continue_15s.png" | cut -d " " -f1)"
                  echo "ADB_INPUT_FINAL_HASH=$ADHASH" >> "$OUT/status.txt"
                  if [ "$ADHASH" = "$STUCK_BEFORE" ]; then
                    echo "XCHURCH_ORIGINAL_GAMEPLAY_NOT_REACHED_REAL_RED" | tee -a "$OUT/status.txt"
                    # Does BACK still work? Distinguishes bad selection from
                    # native menu event-loop/UI lock. No engine/assets edits.
                    "$ADB" shell input tap 540 995; sleep 8
                    "$ADB" exec-out screencap -p > "$OUT/screens/diagnostic_back_touch.png"
                    BACKHASH="$(sha256sum "$OUT/screens/diagnostic_back_touch.png" | cut -d " " -f1)"
                    echo "MENU_BACK_TOUCH_HASH=$BACKHASH" | tee -a "$OUT/status.txt"
                    if [ "$BACKHASH" = "$STUCK_BEFORE" ]; then
                      "$ADB" shell input keyevent 4; sleep 8
                      "$ADB" exec-out screencap -p > "$OUT/screens/diagnostic_back_key.png"
                      KEYHASH="$(sha256sum "$OUT/screens/diagnostic_back_key.png" | cut -d " " -f1)"
                      echo "MENU_ANDROID_BACK_KEY_HASH=$KEYHASH" | tee -a "$OUT/status.txt"
                      if [ "$KEYHASH" = "$STUCK_BEFORE" ]; then
                        echo "XCHURCH_UI_FROZEN_TOUCH_AND_HARDWARE_BACK_RED" | tee -a "$OUT/status.txt"
                      else
                        echo "XCHURCH_ANDROID_BACK_NAVIGATES_BUT_TOUCH_MISSING_RED" | tee -a "$OUT/status.txt"
                      fi
                    else
                      echo "XCHURCH_UI_BACK_NAVIGATION_WORKS_SELECTION_INCOMPLETE_RED" | tee -a "$OUT/status.txt"
                    fi
                    exit 68
                  fi
                fi
                echo "XZIEL_REAL_BOZ_START_GAME_CAPTURED_NEEDS_VISUAL_QA" | tee -a "$OUT/status.txt"
              fi
            else
              echo "XCHURCH_NEW_GAME_SCREEN_CHANGED_VISUAL_REVIEW_REQUIRED" | tee -a "$OUT/status.txt"
            fi
          fi

          "$ADB" logcat -d -v threadtime > "$OUT/logcat.txt"
          grep -Eai 'XZIEL_DIRECT_NATIVE_TAP|STARTGAME|single|menu|map|kino|xchurch|FATAL|SIGSEGV|SIGABRT'             "$OUT/logcat.txt" | tail -500 > "$OUT/logcat-focus.txt" || true
          sha256sum "$OUT"/screens/*.png > "$OUT/screen-hashes.txt" 2>/dev/null || true
          exit 0

      - name: Summarize
        if: always()
        shell: bash
        run: |
          cat /tmp/xchurch-fast/status.txt 2>/dev/null || true
          cat /tmp/xchurch-fast/screen-hashes.txt 2>/dev/null || true
          tail -120 /tmp/xchurch-fast/logcat-focus.txt 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: XChurch-Fast-Single-Player-Proof
          path: |
            /tmp/xchurch-fast/
            /tmp/xchurch-fast-offline/offline.apk
            /tmp/xchurch-fast-offline/app-original.icf
            /tmp/xchurch-fast-offline/stage/assets/app.icf
          if-no-files-found: error
          retention-days: 14
