name: Extract Nacht 260 FBO

on:
  push:
    branches:
      - feature/xziel-nacht-lightmap-hq-gpu-v1
    paths:
      - ".github/workflows/extract-nacht260-fbo.yml"

permissions:
  actions: read
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Nacht 260 evidence
        uses: actions/download-artifact@v4
        with:
          name: XZIEL-Nacht-Static-Scene-Android-Evidence
          path: evidence
          repository: 1993velezpadilla-source/config-old-3
          run-id: 36464715053
          github-token: ${{ github.token }}

      - name: Isolate renderer FBO
        run: |
          set -euo pipefail
          capture=$(find evidence -type f -name 'static-scene-fbo.ppm' -print -quit)
          test -n "$capture"
          cp "$capture" nacht260-fbo.ppm
          test -s nacht260-fbo.ppm
          file nacht260-fbo.ppm

      - name: Upload renderer FBO only
        uses: actions/upload-artifact@v4
        with:
          name: XZIEL-Nacht-260-FBO
          path: nacht260-fbo.ppm
          compression-level: 0
          retention-days: 7
