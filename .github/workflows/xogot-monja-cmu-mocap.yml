name: Add CMU Human Mocap to Monja

on:
  workflow_dispatch:
  push:
    branches:
      - feature/church-expansion-v1
    paths:
      - "xogot/assets/zombies/monja_clean/clean_runtime/**"
      - ".github/workflows/xogot-monja-cmu-mocap.yml"

permissions:
  contents: write

concurrency:
  group: xogot-monja-cmu-mocap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  augment:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Blender headless dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender python3-numpy libegl1 libgl1-mesa-dri mesa-utils
          blender --version | head -n 2
          sudo npm install --global @gltf-transform/cli@4.5.1
          gltf-transform --version

      - name: Materialize clean runtime Monja as GLB for Blender
        shell: bash
        run: |
          set -euo pipefail
          NEW=xogot/assets/zombies/monja_clean/clean_runtime/monja_basica_clean_rig.gltf
          OLD=xogot/assets/zombies/monja_clean/monja_basica_clean_rig.glb
          if [ -s "$NEW" ]; then
            INPUT="$NEW"
          else
            test -s "$OLD"
            INPUT="$OLD"
          fi
          rm -rf xogot/build/monja-cmu-input
          mkdir -p xogot/build/monja-cmu-input
          gltf-transform dequantize "$INPUT" \
            xogot/build/monja-cmu-input/monja_basica_clean_rig.glb
          python3 - <<'PY'
          import json,struct
          from pathlib import Path
          p=Path("xogot/build/monja-cmu-input/monja_basica_clean_rig.glb")
          data=p.read_bytes()
          assert data[:4]==b"glTF" and len(data)>20
          json_len,json_type=struct.unpack_from("<II",data,12)
          assert json_type==0x4E4F534A
          doc=json.loads(data[20:20+json_len].decode("utf-8").rstrip("\x00 \t\r\n"))
          used=set(doc.get("extensionsUsed",[]))
          required=set(doc.get("extensionsRequired",[]))
          assert "EXT_meshopt_compression" not in used|set(required), (used,required)
          assert "KHR_mesh_quantization" not in required, required
          print("XZOGOT_MONJA_BASIC_CMU_INPUT_STANDARD_GLTF_GREEN",p.stat().st_size)
          PY

      - name: Bake nine CMU human mocap clips onto clean Monja
        shell: bash
        run: |
          set -euo pipefail
          rm -rf xogot/build/monja-cmu-mocap
          mkdir -p xogot/build/monja-cmu-mocap
          timeout 2700 blender -b --python xogot/tools/augment_monja_cmu_mocap.py -- \
            --base "$PWD/xogot/build/monja-cmu-input/monja_basica_clean_rig.glb" \
            --output-dir "$PWD/xogot/build/monja-cmu-mocap" \
            --output-name monja_basica_cmu_rig.glb \
            2>&1 | tee xogot/build/monja-cmu-mocap/blender.log
          grep -q "XZOGOT_MONJA_CMU_GEOMETRY_GREEN" xogot/build/monja-cmu-mocap/blender.log
          grep -q "XZOGOT_MONJA_CMU_9_REAL_MOCAP_CLIPS_GREEN" xogot/build/monja-cmu-mocap/blender.log
          grep -q "XZOGOT_MONJA_CMU_RIG_GREEN" xogot/build/monja-cmu-mocap/blender.log
          test -s xogot/build/monja-cmu-mocap/monja_basica_cmu_rig.glb
          test -s xogot/build/monja-cmu-mocap/report.json
          test -s xogot/build/monja-cmu-mocap/cmu_zombie_walk_mid.png
          test -s xogot/build/monja-cmu-mocap/cmu_drag_bad_leg_mid.png
          test -s xogot/build/monja-cmu-mocap/cmu_crawl_mid.png
          test -s xogot/build/monja-cmu-mocap/cmu_strike_mid.png

      - name: Validate CMU augmented Monja
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("xogot/build/monja-cmu-mocap/report.json").read_text())
          assert r["geometry_conserved"] is True
          assert r["armatures"] == 1
          assert r["bones"] >= 20
          assert len(r["baked_cmu"]) == 9
          assert not r["missing_cmu_actions"]
          assert r.get("raw_glb_animation_motion_valid") is True
          names=" ".join(r["output_actions"]).lower()
          for token in ("104_41","105_25","74_01","139_19","02_05","111_19","111_03","90_16","140_01"):
              assert token in names,(token,r["output_actions"])
          print("XZOGOT_MONJA_CMU_REPORT_GREEN",r["bones"],r["output_bytes"])
          PY

      - name: Pack Godot-compatible CMU runtime as separate glTF
        shell: bash
        run: |
          set -euo pipefail
          rm -rf xogot/build/monja-cmu-runtime
          mkdir -p xogot/build/monja-cmu-runtime
          gltf-transform dequantize \
            xogot/build/monja-cmu-mocap/monja_basica_cmu_rig.glb \
            xogot/build/monja-cmu-runtime/monja_basica_cmu_rig.gltf
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path("xogot/build/monja-cmu-runtime")
          p=root/"monja_basica_cmu_rig.gltf"
          doc=json.loads(p.read_text())
          used=set(doc.get("extensionsUsed",[]))
          required=set(doc.get("extensionsRequired",[]))
          assert "EXT_meshopt_compression" not in used|set(required), (used,required)
          assert "KHR_mesh_quantization" not in required, required
          files=[x for x in root.iterdir() if x.is_file()]
          assert files
          too_big=[(x.name,x.stat().st_size) for x in files if x.stat().st_size>=99_000_000]
          assert not too_big, too_big
          for buf in doc.get("buffers",[]):
              uri=buf.get("uri")
              assert uri and (root/uri).is_file(), uri
          for img in doc.get("images",[]):
              uri=img.get("uri")
              if uri:
                  assert (root/uri).is_file(), uri
          report_path=Path("xogot/build/monja-cmu-mocap/report.json")
          r=json.loads(report_path.read_text())
          r["runtime_format"]="gltf_separate"
          r["runtime_compression"]="none"
          r["runtime_simplification"]=False
          r["runtime_quantization"]=False
          r["runtime_files"]={x.name:x.stat().st_size for x in files}
          r["runtime_output_bytes"]=sum(x.stat().st_size for x in files)
          report_path.write_text(json.dumps(r,indent=2)+"\n")
          print("XZOGOT_MONJA_BASIC_CMU_RUNTIME_GLTF_SEPARATE_GREEN",r["runtime_files"])
          PY

      - name: Stage CMU Monja candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p xogot/assets/zombies/monja_clean
          rm -f xogot/assets/zombies/monja_clean/monja_basica_cmu_rig.glb
          rm -rf xogot/assets/zombies/monja_clean/cmu_runtime
          mkdir -p xogot/assets/zombies/monja_clean/cmu_runtime
          cp -a xogot/build/monja-cmu-runtime/. \
             xogot/assets/zombies/monja_clean/cmu_runtime/
          cp xogot/build/monja-cmu-mocap/report.json \
             xogot/assets/zombies/monja_clean/cmu_mocap_report.json

      - name: Commit CMU Monja candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "XZOGOT Asset Bot"
          git config user.email "xogot-asset-bot@users.noreply.github.com"
          git pull --rebase origin feature/church-expansion-v1
          git add -A xogot/assets/zombies/monja_clean/
          if ! git diff --cached --quiet; then
            git commit -m "asset: add nine real CMU mocap clips to Monja"
            git push origin HEAD:feature/church-expansion-v1
          fi

      - name: Upload CMU Monja proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monja-cmu-human-mocap-proof
          path: |
            xogot/build/monja-cmu-mocap/report.json
            xogot/build/monja-cmu-mocap/blender.log
            xogot/build/monja-cmu-mocap/cmu_zombie_walk_mid.png
            xogot/build/monja-cmu-mocap/cmu_drag_bad_leg_mid.png
            xogot/build/monja-cmu-mocap/cmu_crawl_mid.png
            xogot/build/monja-cmu-mocap/cmu_strike_mid.png
          if-no-files-found: warn
          retention-days: 14
