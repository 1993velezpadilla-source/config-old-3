name: Xogot ActorX PSA to glTF Skeleton Axis Truth

on:
  workflow_dispatch:
  push:
    branches:
      - fix/source-viewmodel-inherited-hands-unit-scale
    paths:
      - "xogot/ci/source_psa_glb_axis_proof.gd"
      - ".github/workflows/xogot-source-psa-glb-axis-proof.yml"

permissions:
  contents: read

jobs:
  source-axis-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - name: Install Godot original renderer
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers
          curl -L --fail --retry 5 --retry-all-errors --retry-delay 2 \
            https://github.com/godotengine/godot-builds/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip -o /tmp/godot.zip
          mkdir -p /tmp/godot /tmp/xogot-psa-gltf-axis-ab build/psa-axis
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.6.1-stable_linux.x86_64
      - name: Import 28 original authored source PSA glTF assets
        run: |
          set -euo pipefail
          timeout 240 /tmp/godot/Godot_v4.6.1-stable_linux.x86_64 --headless --editor --path xogot --quit 2>&1 | tee build/psa-axis/import.log
          ! grep -E "SCRIPT ERROR|Parse Error" build/psa-axis/import.log
      - name: Compare source original animation axes versus untouched glTF rest
        run: |
          set -euo pipefail
          timeout 240 xvfb-run -a -s "-screen 0 1280x720x24" \
            /tmp/godot/Godot_v4.6.1-stable_linux.x86_64 --path xogot --audio-driver Dummy --rendering-method gl_compatibility \
            --resolution 1280x720 --script res://ci/source_psa_glb_axis_proof.gd \
            2>&1 | tee build/psa-axis/render.log
          grep -q "XZOGOT_PSA_GLTF_AXIS_PROOF_GREEN frames=21" build/psa-axis/render.log
          test "$(find /tmp/xogot-psa-gltf-axis-ab -maxdepth 1 -name '*.png' | wc -l)" -eq 21
          ! grep -E "SCRIPT ERROR|Parse Error|XZOGOT_PSA_GLTF_AXIS_RED" build/psa-axis/render.log
      - name: Upload independent native A/B screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Xogot-Original-PSA-GLB-Axis-21PNG
          path: /tmp/xogot-psa-gltf-axis-ab/*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Upload numerical axes and source rest measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Xogot-Original-PSA-GLB-Axis-Logs
          path: build/psa-axis/*.log
          if-no-files-found: warn
          retention-days: 14
