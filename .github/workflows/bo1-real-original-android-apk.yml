name: BO1 ORIGINAL PC C++ in REAL Android ARM64 APK (NON-PLAYABLE NATIVE TEST)

on:
  workflow_dispatch:
  push:
    branches:
      - feature/bo1-original-engine-arm64-feasibility-v1
    paths:
      - tools/bo1_pc_engine/android_app/**
      - tools/bo1_pc_engine/compat/**
      - tools/bo1_pc_engine/fastfile/**
      - tools/bo1_pc_engine/ff_payload/**
      - tools/bo1_pc_engine/xblocks/**
      - .github/workflows/bo1-real-original-android-apk.yml

permissions:
  contents: read

jobs:
  genuine-original-engine-native-android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Stage original BO1 engine source; compile NDK and package signed APK
        shell: bash
        run: |
          bash tools/bo1_pc_engine/android_app/build_android_ci.sh

      - name: Upload Android installable diagnostic APK — NOT BLACK OPS GAME
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BO1-ARM64-ACTUAL-ANDROID-APK-NATIVE-ENGINE-TEST-NOT-GAME
          path: ${{ runner.temp }}/bo1-native-apk-public/*.apk
          retention-days: 2
          if-no-files-found: error

      - name: Upload truthfully scoped source and build verification (no game data)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BO1-ANDROID-NATIVE-APK-COMPILE-REPORT
          path: ${{ runner.temp }}/bo1-native-apk-report
          retention-days: 14
          if-no-files-found: warn
