name: Unity Aether Enemy Census

on:
  push:
    branches: [feature/unity-zombies-v1]
    paths:
      - '.github/workflows/unity-aether-enemy-census.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SOURCE_RUN_ID: "37233982456"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/unity-zombies-v1

      - name: Download Project Aether public build
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full xz-utils
          mkdir -p "$RUNNER_TEMP/aether-download"
          npx --yes itchio-downloader --url "https://verrial.itch.io/projectaether" --downloadDirectory "$RUNNER_TEMP/aether-download"
          FILE=$(find "$RUNNER_TEMP/aether-download" -type f -name '*.zip' -printf '%s\t%p\n' | sort -nr | head -1 | cut -f2-)
          test -s "$FILE"
          echo "PAYLOAD=$FILE" >> "$GITHUB_ENV"
          echo "UNITY_AETHER_PAYLOAD_GREEN"

      - name: Convert IoStore to searchable legacy pak
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aether-paks"
          7z x -y "$PAYLOAD" 'ProjectAether/Content/Paks/*' -o"$RUNNER_TEMP/aether-paks" >/dev/null
          rm -f "$PAYLOAD"
          PAKDIR="$RUNNER_TEMP/aether-paks/ProjectAether/Content/Paks"
          test -d "$PAKDIR"

          curl -fL --retry 5 https://github.com/trumank/retoc/releases/download/v0.1.5/retoc_cli-x86_64-unknown-linux-gnu.tar.xz -o "$RUNNER_TEMP/retoc.tar.xz"
          mkdir -p "$RUNNER_TEMP/retoc"
          tar -xJf "$RUNNER_TEMP/retoc.tar.xz" -C "$RUNNER_TEMP/retoc"
          RETOC=$(find "$RUNNER_TEMP/retoc" -type f -name 'retoc*' -perm -111 | head -1)

          curl -fL --retry 5 https://github.com/trumank/repak/releases/download/v0.2.3/repak_cli-x86_64-unknown-linux-gnu.tar.xz -o "$RUNNER_TEMP/repak.tar.xz"
          mkdir -p "$RUNNER_TEMP/repak"
          tar -xJf "$RUNNER_TEMP/repak.tar.xz" -C "$RUNNER_TEMP/repak"
          REPAK=$(find "$RUNNER_TEMP/repak" -type f -name 'repak*' -perm -111 | head -1)

          "$RETOC" to-legacy "$PAKDIR" "$RUNNER_TEMP/aether-legacy.pak"
          test -s "$RUNNER_TEMP/aether-legacy.pak"
          echo "REPAK=$REPAK" >> "$GITHUB_ENV"
          echo "AETHER_LEGACY=$RUNNER_TEMP/aether-legacy.pak" >> "$GITHUB_ENV"
          echo "UNITY_AETHER_LEGACY_GREEN"

      - name: Census original zombie and dog packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p enemy-census
          "$REPAK" list "$AETHER_LEGACY" > enemy-census/all_paths.txt
          python3 - <<'PY'
          from pathlib import Path
          import json,re

          lines=[x.strip().replace("\\","/") for x in Path("enemy-census/all_paths.txt").read_text(errors="ignore").splitlines() if x.strip()]
          content=[x for x in lines if x.startswith("ProjectAether/Content/")]

          reject=re.compile(r"(monja|nun|sheep)",re.I)
          enemy=re.compile(r"(zomb|undead|crawler|walker|runner|hellhound|hound|dog|canine|ai[_/ -]?dog)",re.I)
          anim=re.compile(r"(anim|attack|melee|walk|run|sprint|crawl|death|die|hit|react|stumble|fall|vault|window|barrier|barricade|spawn|idle|limb|leg|arm|head|gib)",re.I)
          likely=[]
          zombie=[]
          dog=[]
          limb=[]
          for p in content:
              if reject.search(p):
                  continue
              if enemy.search(p) or ("/AI/" in p and anim.search(p)):
                  likely.append(p)
              if re.search(r"(zomb|undead|crawler|walker)",p,re.I):
                  zombie.append(p)
              if re.search(r"(hellhound|hound|dog|canine|ai[_/ -]?dog)",p,re.I):
                  dog.append(p)
              if re.search(r"(crawler|limb|leg|arm|head|gib|dismember)",p,re.I):
                  limb.append(p)

          def uniq(xs): return sorted(set(xs))
          likely,zombie,dog,limb=map(uniq,(likely,zombie,dog,limb))
          report={
            "schema":1,
            "source":"Project Aether public build",
            "explicitly_excluded":["monja","nun","sheep"],
            "counts":{"candidate":len(likely),"zombie":len(zombie),"dog":len(dog),"limb_or_crawler":len(limb)},
            "zombie_paths":zombie,
            "dog_paths":dog,
            "limb_or_crawler_paths":limb,
            "candidate_paths":likely,
          }
          Path("enemy-census/report.json").write_text(json.dumps(report,indent=2)+"\n")
          Path("enemy-census/zombie_paths.txt").write_text("\n".join(zombie)+"\n")
          Path("enemy-census/dog_paths.txt").write_text("\n".join(dog)+"\n")
          Path("enemy-census/limb_paths.txt").write_text("\n".join(limb)+"\n")
          Path("enemy-census/candidate_paths.txt").write_text("\n".join(likely)+"\n")
          print("UNITY_AETHER_ENEMY_COUNTS",report["counts"])
          if not zombie:
              raise SystemExit("No original zombie package candidates found")
          if not dog:
              raise SystemExit("No original dog/hellhound package candidates found")
          print("UNITY_AETHER_ENEMY_CENSUS_GREEN")
          PY

      - name: Extract candidate enemy package triplets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p enemy-census/raw
          python3 - <<'PY'
          from pathlib import Path
          lines=[x.strip() for x in Path("enemy-census/candidate_paths.txt").read_text().splitlines() if x.strip()]
          # Keep exact candidate packages. Bound extraction to avoid accidental whole-game artifact.
          lines=lines[:3500]
          Path("enemy-census/extract_paths.txt").write_text("\n".join(lines)+"\n")
          print("UNITY_AETHER_ENEMY_EXTRACT_COUNT",len(lines))
          PY
          args=(unpack "$AETHER_LEGACY" -o enemy-census/raw --force)
          while IFS= read -r asset; do
            [ -n "$asset" ] || continue
            args+=(-i "$asset")
          done < enemy-census/extract_paths.txt
          "$REPAK" "${args[@]}" >/dev/null 2>&1 || true
          find enemy-census/raw -type f | sort > enemy-census/raw_files.txt
          COUNT=$(wc -l < enemy-census/raw_files.txt)
          echo "UNITY_AETHER_ENEMY_RAW_FILES=$COUNT"
          test "$COUNT" -gt 0

      - name: Upload original enemy census
        uses: actions/upload-artifact@v4
        with:
          name: unity-aether-original-enemy-census
          path: |
            enemy-census/report.json
            enemy-census/zombie_paths.txt
            enemy-census/dog_paths.txt
            enemy-census/limb_paths.txt
            enemy-census/candidate_paths.txt
            enemy-census/extract_paths.txt
            enemy-census/raw_files.txt
            enemy-census/raw/**
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
