name: Nacht Real 16-View Mesa GPU Counter Regression Audit
on:
  workflow_dispatch:
  push:
    branches:
      - research/nacht-bo3-meridian-source-bridge-20261009
    paths:
      - ".github/workflows/xogot-nacht-real-16view-mesa-gpu-counter-audit.yml"
      - "tools/maps/nacht_original_source_16view_mesa_drawcall_audit.py"
permissions:
  contents: read
  actions: read
jobs:
  original-nacht-matched-source-gpu-counters:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: "37979580156"
    steps:
      - uses: actions/checkout@v5
      - name: No fake Android or scene regression classifications allowed
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/maps/nacht_original_source_16view_mesa_drawcall_audit.py
          python3 tools/maps/nacht_original_source_16view_mesa_drawcall_audit.py --self-test
      - name: Retrieve native 16 candidate viewpoints without reconstructing 2GB source again
        shell: bash
        run: |
          set -euo pipefail
          complete=""
          for i in $(seq 1 100); do
            complete="$(gh run view "$SOURCE_RUN" --json status --jq '.status')"
            if test "$complete" = completed; then break; fi
            echo "Await authentic Godot Mesa measured native source views #$SOURCE_RUN iteration $i/100"
            sleep 30
          done
          test "$complete" = completed || { echo "RED: real original-source Mesa renderer not complete"; exit 1; }
          mkdir -p build/nacht-16view-gpu/source
          gh run download "$SOURCE_RUN" \
            -n Nacht-10793-Source-16-Candidate-EyeHeight-Yaw-Directions-32-Original-Godot-PNGs \
            -D build/nacht-16view-gpu/source
          test -s build/nacht-16view-gpu/source/nacht-original-vista-360-candidate-visual-sweep.json
      - name: Independently compare actual draw calls and primitive indices at all 16 cameras
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/maps/nacht_original_source_16view_mesa_drawcall_audit.py \
            --source build/nacht-16view-gpu/source/nacht-original-vista-360-candidate-visual-sweep.json \
            --output build/nacht-16view-gpu/genuine-Mesa-source-16cardinal-camera-gpu-regression-audit.json \
            2>&1 | tee build/nacht-16view-gpu/counters.log
          grep -q MEASURED_MESA_16_CANDIDATE_VIEW_COUNTS_IMPROVED_NOT_ANDROID_FPS \
            build/nacht-16view-gpu/counters.log
          test "$(gh run view "$SOURCE_RUN" --json conclusion --jq '.conclusion')" = success
      - name: Preserve actual original-world camera GPU RED/green metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nacht-Original-16-Cardinal-Camera-Godot-Mesa-GPU-Counter-Regression
          path: |
            build/nacht-16view-gpu/genuine-Mesa-source-16cardinal-camera-gpu-regression-audit.json
            build/nacht-16view-gpu/counters.log
          retention-days: 14
          if-no-files-found: warn
