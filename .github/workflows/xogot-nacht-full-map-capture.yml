name: Xogot Nacht Full Map Capture

on:
  workflow_dispatch:
  push:
    branches:
      - feature/godot-aaa-rebuild-v1
    paths:
      - "xogot/ci/nacht_full_map_capture.gd"
      - ".github/workflows/xogot-nacht-full-map-capture.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: xogot-nacht-full-map-capture
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: feature/godot-aaa-rebuild-v1
      SOURCE_ARTIFACT: Xogot-Nacht-Chronicles-Godot-Runtime

    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/godot-aaa-rebuild-v1
          fetch-depth: 1

      - name: Resolve latest GREEN Nacht staged runtime
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_RUN=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" \
            --jq '[.workflow_runs[] | select(.head_branch=="feature/godot-aaa-rebuild-v1" and .name=="Stage Nacht Chronicles Full Map" and .conclusion=="success")][0].id // empty')
          test -n "$SOURCE_RUN"
          echo "SOURCE_RUN=$SOURCE_RUN" >> "$GITHUB_ENV"
          echo "XZOGOT_NACHT_CAPTURE_SELECTED_STAGE_RUN=$SOURCE_RUN"

      - name: Download exact staged Nacht runtime
        shell: bash
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/nacht-capture-artifact"
          root=xogot/assets/benchmarks/nacht_chronicles
          rm -rf "$tmp" "$root"
          mkdir -p "$tmp" "$root"

          gh run download "$SOURCE_RUN" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$SOURCE_ARTIFACT" \
            --dir "$tmp"

          manifest=$(find "$tmp" -type f -name source_manifest.json -print -quit)
          test -n "$manifest"
          artifact_root=$(dirname "$manifest")
          cp -a "$artifact_root/." "$root/"

          test -s "$root/source_manifest.json"
          test -s "$root/nacht-static-scene.json"
          test -s "$root/native-glb-report.json"
          test -s "$root/native-dds-report.json"
          test -s "$root/complete-xztx-report.json"
          test -s "$root/nacht-environment-report.json"
          test -s "$root/nacht-audio-runtime-authority.json"
          echo "XZOGOT_NACHT_CAPTURE_STAGE_DOWNLOAD_GREEN run=$SOURCE_RUN root=$artifact_root"

      - name: Gate capture source authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          root=Path("xogot/assets/benchmarks/nacht_chronicles")
          source=json.loads((root/"source_manifest.json").read_text())
          scene=json.loads((root/"nacht-static-scene.json").read_text())
          glb=json.loads((root/"native-glb-report.json").read_text())
          dds=json.loads((root/"native-dds-report.json").read_text())
          complete=json.loads((root/"complete-xztx-report.json").read_text())

          assert source["ready"] is True, source
          assert source["sourcePackages"] == 3871, source
          assert source["sourceMeshes"] == 493, source
          assert source["sourceInstances"] == 10793, source
          assert source["sourceActors"] == 11023, source
          assert source["sourceLights"] == 166, source
          assert source["sourceTextures"] == 1581, source
          assert source["sourceUsedTextures"] == 702, source
          assert scene["summary"]["ready"] is True, scene["summary"]
          assert scene["summary"]["unresolvedMeshCount"] == 0, scene["summary"]
          assert glb["mesh_count"] == 493, glb
          assert dds["ready"] is True and dds["failure_count"] == 0, dds
          assert dds["texture_count"] == 1581, dds
          assert complete["ready"] is True, complete
          assert complete["textureAssetCount"] == 1581, complete

          print("XZOGOT_NACHT_CAPTURE_AUTHORITY_GREEN", {
              "packages": source["sourcePackages"],
              "meshes": source["sourceMeshes"],
              "instances": source["sourceInstances"],
              "actors": source["sourceActors"],
              "lights": source["sourceLights"],
              "textures": source["sourceTextures"],
          })
          PY

      - name: Install Godot 4.6.1 capture runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip curl xvfb libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers
          curl -L --fail --retry 5 --retry-all-errors --retry-delay 2 \
            https://github.com/godotengine/godot-builds/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip \
            -o /tmp/godot.zip
          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.6.1-stable_linux.x86_64

      - name: Import complete Nacht capture assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/nacht-capture
          timeout 1200 /tmp/godot/Godot_v4.6.1-stable_linux.x86_64 \
            --headless --editor --path xogot --quit \
            2>&1 | tee build/nacht-capture/import.log
          ! grep -E "SCRIPT ERROR|Parse Error|ERROR: Failed to load script|MAX_MESH_SURFACES" \
            build/nacht-capture/import.log

      - name: Render complete Nacht source world
        shell: bash
        run: |
          set -euo pipefail
          timeout 1200 xvfb-run -a -s "-screen 0 1280x720x24" \
            /tmp/godot/Godot_v4.6.1-stable_linux.x86_64 \
            --path xogot \
            --rendering-method gl_compatibility \
            --resolution 1280x720 \
            --script res://ci/nacht_full_map_capture.gd \
            2>&1 | tee build/nacht-capture/render.log

          grep -q "XZOGOT_NACHT_CAPTURE_WORLD_GREEN" build/nacht-capture/render.log
          grep -q "XZOGOT_NACHT_SPAWN_SCREENSHOT_GREEN" build/nacht-capture/render.log
          grep -q "XZOGOT_NACHT_OVERVIEW_SCREENSHOT_GREEN" build/nacht-capture/render.log
          ! grep -E "NACHT_CAPTURE:|SCRIPT ERROR|Parse Error|MAX_MESH_SURFACES" build/nacht-capture/render.log
          test -s /tmp/xogot-nacht-spawn.png
          test -s /tmp/xogot-nacht-overview.png
          cp /tmp/xogot-nacht-spawn.png build/nacht-capture/xogot-nacht-spawn.png
          cp /tmp/xogot-nacht-overview.png build/nacht-capture/xogot-nacht-overview.png
          echo "XZOGOT_NACHT_CAPTURE_RENDER_GREEN"

      - name: Upload Nacht screenshots
        uses: actions/upload-artifact@v4
        with:
          name: Xogot-Nacht-Full-Map-Screenshots
          path: |
            build/nacht-capture/xogot-nacht-spawn.png
            build/nacht-capture/xogot-nacht-overview.png
            build/nacht-capture/render.log
          if-no-files-found: error
          retention-days: 7
