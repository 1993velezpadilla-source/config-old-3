name: Hayuya Queue CI

on:
  push:
    branches:
      - art/hayuya-monster-v1
    paths:
      - hayuya/jobs/**
      - tools/hayuya3d/job_request.py
      - tools/hayuya3d/hub/**
      - .github/workflows/hayuya-queue.yml
      - .github/workflows/hayuya-queue-ci.yml
      - tools/hayuya3d/phone_cloud_worker.py
      - tools/hayuya3d/mesh_gate.py
      - tools/hayuya3d/judge_phone_v4.py
      - tools/hayuya3d/judge_v4.py
      - tools/hayuya3d/judge_v4_qrealign_worker.py
      - tools/hayuya3d/judge_v4_face_worker.py
      - tools/hayuya3d/judge_v4_dreamsim_worker.py
      - tools/hayuya3d/judge_v4_internvl_worker.py
      - tools/hayuya3d/judge_v5.py
      - tools/hayuya3d/judge_v5_gate.py
      - tools/hayuya3d/judge_v5_visualquality_r1_worker.py
      - tools/hayuya3d/siglip2_reference_judge.py
      - tools/hayuya3d/cvlface_identity_judge.py
      - tools/hayuya3d/pyiqa_ensemble_judge.py
      - hayuya/standards/judge_v5_policy.json

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compile queue code
        run: |
          python -m py_compile             tools/hayuya3d/job_request.py             tools/hayuya3d/judge_phone_v4.py             tools/hayuya3d/judge_v4.py             tools/hayuya3d/judge_v4_qrealign_worker.py             tools/hayuya3d/judge_v4_face_worker.py             tools/hayuya3d/judge_v4_dreamsim_worker.py             tools/hayuya3d/judge_v4_internvl_worker.py             tools/hayuya3d/judge_v5.py             tools/hayuya3d/judge_v5_gate.py             tools/hayuya3d/judge_v5_visualquality_r1_worker.py             tools/hayuya3d/siglip2_reference_judge.py             tools/hayuya3d/cvlface_identity_judge.py             tools/hayuya3d/pyiqa_ensemble_judge.py
      - name: Validate request template shape
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('hayuya/jobs/templates/model-job.json')
          d=json.loads(p.read_text())
          assert d['schema'] in (1,2)
          assert d['job_id']
          assert d['owner']
          PY
      - name: Validate Hub JavaScript
        run: node --check tools/hayuya3d/hub/hub.js
      - name: Validate queue workflow markers
        run: |
          grep -q 'hayuya/jobs/requests/' .github/workflows/hayuya-queue.yml
          grep -q 'matrix.job_id' .github/workflows/hayuya-queue.yml
          grep -q 'runs-on: ubuntu-latest' .github/workflows/hayuya-queue.yml
          grep -q 'phone_cloud_worker.py' .github/workflows/hayuya-queue.yml
          grep -q 'Judge v4 Core — fail closed before HAYUYA 3D export' .github/workflows/hayuya-queue.yml
          grep -q 'Legacy AutoRig disabled — moved to HAYUYA Motions' .github/workflows/hayuya-queue.yml
          grep -q 'Emit HAYUYA Motions handoff' .github/workflows/hayuya-queue.yml
          grep -q 'Persist core-screened model for Hub preview' .github/workflows/hayuya-queue.yml
          grep -q 'mesh_gate' tools/hayuya3d/phone_cloud_worker.py
          grep -q '"production_approved":False' tools/hayuya3d/judge_phone_v4.py
          grep -q 'Judge v5' tools/hayuya3d/judge_phone_v4.py
          grep -q 'approval_enabled' hayuya/standards/judge_v5_policy.json
