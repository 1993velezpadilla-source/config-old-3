name: Package Xogot Source Bundle

on:
  workflow_dispatch:
  push:
    branches:
      - feature/church-expansion-v1
    paths:
      - ".github/workflows/xogot-source-bundle.yml"

# BUNDLE_REV=3
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Record revision
        run: git rev-parse HEAD > PORTABLE_HEAD.txt
      - name: Package Godot 4.6.1 host binary
        shell: bash
        run: |
          set -euo pipefail
          rm -rf portable_tools/godot
          mkdir -p portable_tools/godot
          curl -L --fail --retry 5 --retry-all-errors --retry-delay 2 \
            https://github.com/godotengine/godot-builds/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip \
            -o /tmp/godot-portable.zip
          unzip -q /tmp/godot-portable.zip -d portable_tools/godot
          chmod +x portable_tools/godot/Godot_v4.6.1-stable_linux.x86_64
          portable_tools/godot/Godot_v4.6.1-stable_linux.x86_64 --version | tee portable_tools/godot/VERSION.txt
          echo "XZOGOT_PORTABLE_GODOT_READY"

      - name: Upload current Xogot project
        uses: actions/upload-artifact@v4
        with:
          name: Xogot-Source-Bundle
          path: |
            xogot/
            tools/gifts/
            portable_tools/godot/
            PORTABLE_HEAD.txt
          compression-level: 1
          retention-days: 14
