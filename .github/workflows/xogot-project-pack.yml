name: Xogot Godot 4.6 Project Pack

on:
  workflow_dispatch:
  push:
    branches:
      - feature/xogot-port-v1
    paths:
      - "xogot/tools/**"
      - "xogot/data/nav_skeleton.json"
      - "tools/church_map/bake_hero_blend_for_xzsm.py"
      - "tools/church_map/sanctum_nav_skeleton_apk9.v1.json"
      - "tools/sanctum_v2/reference_materials.py"

permissions:
  contents: read
  actions: read

concurrency:
  group: xogot-project-pack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5

      - name: Download current packed Hero authority
        uses: actions/download-artifact@v5
        with:
          name: XZIEL-Sanctum-Hero-Altar
          path: build/hero
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37006309792

      - name: Install Blender host packages
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth unzip zip curl

      - name: Install Blender 5.2.2
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 6 --retry-all-errors --retry-delay 2 \
            https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz \
            -o /tmp/blender.tar.xz
          tar -C /tmp -xf /tmp/blender.tar.xz

      - name: Apply current church polish for Xogot
        shell: bash
        env:
          XZIEL_HERO_BLEND: ${{ github.workspace }}/build/hero/sanctum-hero-altar.blend
          XZIEL_SNAPSHOT_OUT: build/xogot_bake
          XZIEL_NAV_SKELETON: ${{ github.workspace }}/tools/church_map/sanctum_nav_skeleton_apk9.v1.json
        run: |
          set -euo pipefail
          mkdir -p build/xogot_bake xogot/assets/church xogot/data
          xvfb-run -a -s "-screen 0 1600x1000x24" /tmp/blender-5.2.2-linux-x64/blender -b \
            --python tools/church_map/bake_hero_blend_for_xzsm.py \
            2>&1 | tee build/xogot_bake/bake.log
          grep -q XZIEL_EXACT_HERO_MATERIAL_BAKE_PASS build/xogot_bake/bake.log
          test -s build/xogot_bake/hero31_android_baked.blend
          test -s build/xogot_bake/window-spawner-prep.json
          cp build/xogot_bake/window-spawner-prep.json xogot/data/window_spawners.json

      - name: Export native Godot GLB
        shell: bash
        env:
          XOGOT_GLB_OUT: ${{ github.workspace }}/xogot/assets/church/sanctum_current.glb
          XOGOT_GLB_REPORT: ${{ github.workspace }}/xogot/assets/church/sanctum_current.report.json
        run: |
          set -euo pipefail
          xvfb-run -a -s "-screen 0 1600x1000x24" /tmp/blender-5.2.2-linux-x64/blender -b \
            build/xogot_bake/hero31_android_baked.blend \
            --python xogot/tools/export_godot_glb.py \
            2>&1 | tee build/xogot_bake/gltf.log
          grep -q XOGOT_GLTF_EXPORT_GREEN build/xogot_bake/gltf.log
          test -s xogot/assets/church/sanctum_current.glb

      - name: Install Godot 4.6.1
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 \
            https://github.com/godotengine/godot-builds/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip \
            -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.6.1-stable_linux.x86_64

      - name: Validate Xogot project in Godot 4.6
        shell: bash
        run: |
          set -euo pipefail
          timeout 300 /tmp/godot/Godot_v4.6.1-stable_linux.x86_64 \
            --headless --editor --path xogot --quit \
            2>&1 | tee build/xogot_bake/godot-import.log
          ! grep -E "SCRIPT ERROR|Parse Error|ERROR: Failed to load script" build/xogot_bake/godot-import.log
          test -f xogot/project.godot
          test -f xogot/main.tscn
          test -s xogot/assets/church/sanctum_current.glb
          python3 - <<'PY'
          import json
          nav=json.load(open("xogot/data/nav_skeleton.json"))
          windows=json.load(open("xogot/data/window_spawners.json"))
          assert any(x["id"]=="upper_full_deck" for x in nav["floors"])
          assert sum(1 for x in nav["floors"] if x["id"].startswith("exterior_"))==4
          assert len(nav["ramps"])==4
          assert windows["count"]==8
          assert windows["status"]=="PREPARED_NO_ZOMBIES"
          print("XOGOT_PROJECT_GREEN",{
              "floors":len(nav["floors"]),
              "ramps":len(nav["ramps"]),
              "windows":windows["count"],
              "zombies":0,
          })
          PY

      - name: Package Xogot project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf xogot/.godot dist
          mkdir -p dist
          (cd xogot && zip -qr ../dist/XZIEL-Xogot-Port-v1.zip .)
          cp xogot/assets/church/sanctum_current.report.json dist/
          cp xogot/data/window_spawners.json dist/
          ls -lh dist/

      - name: Upload Xogot project
        uses: actions/upload-artifact@v4
        with:
          name: XZIEL-Xogot-Port-v1
          path: dist/
          if-no-files-found: error
          retention-days: 14
