name: Xziel IW4 Probe APK

on:
  workflow_dispatch:
  push:
    branches:
      - "research/iw4-android-compat-spike"
    paths:
      - "tools/iw4_android_spike/patch_winlator_probe.py"
      - "docs/engine/IW4_PROBE_THIRD_PARTY_NOTICE.md"
      - ".github/workflows/iw4-probe-apk.yml"
  pull_request:
    paths:
      - "tools/iw4_android_spike/patch_winlator_probe.py"
      - "docs/engine/IW4_PROBE_THIRD_PARTY_NOTICE.md"
      - ".github/workflows/iw4-probe-apk.yml"

permissions:
  contents: read

jobs:
  build-probe-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Xziel spike
        uses: actions/checkout@v5
        with:
          path: xziel

      - name: Checkout pinned Winlator source
        uses: actions/checkout@v5
        with:
          repository: brunodev85/winlator-app
          ref: 90390783d955c75ca8ca153353cf3c5b9ca6d6a1
          path: winlator-src
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER"             "platform-tools"             "platforms;android-35"             "build-tools;35.0.0"             "ndk;24.0.8215888"             "cmake;3.22.1"

      - name: Patch Winlator into Xziel IW4 Probe
        run: python3 xziel/tools/iw4_android_spike/patch_winlator_probe.py --source winlator-src

      - name: Verify pinned upstream and patch boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C winlator-src rev-parse HEAD)" = "90390783d955c75ca8ca153353cf3c5b9ca6d6a1"
          grep -q "GNU LESSER GENERAL PUBLIC LICENSE" winlator-src/LICENSE
          grep -q "com.xziel.iw4probe" winlator-src/app/build.gradle
          grep -q "IW4ProbeActivity" winlator-src/app/src/main/AndroidManifest.xml
          grep -q "XZIEL_IW4" winlator-src/app/src/main/java/com/winlator/IW4ProbeActivity.java

      - name: Build ARM64 probe APK
        working-directory: winlator-src
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug --stacktrace

      - name: Verify APK identity and payload
        shell: bash
        run: |
          set -euo pipefail
          APK="winlator-src/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"

          AAPT="${ANDROID_HOME}/build-tools/35.0.0/aapt"
          "$AAPT" dump badging "$APK" | tee xziel/iw4-probe-badging.txt
          grep -q "package: name='com.xziel.iw4probe'" xziel/iw4-probe-badging.txt
          grep -q "launchable-activity: name='com.winlator.IW4ProbeActivity'" xziel/iw4-probe-badging.txt

          unzip -l "$APK" | tee xziel/iw4-probe-apk-contents.txt
          if grep -Eiq '(^|/)(iw4mp\.exe|iw4sp\.exe)$|\.iwd$|\.ff$' xziel/iw4-probe-apk-contents.txt; then
            echo "Unexpected MW2 proprietary payload detected in probe APK."
            exit 1
          fi

          mkdir -p xziel/dist
          cp "$APK" xziel/dist/Xziel-IW4-Probe-debug.apk
          cp winlator-src/LICENSE xziel/dist/WINLATOR-LGPL-2.1.txt
          cp xziel/docs/engine/IW4_PROBE_THIRD_PARTY_NOTICE.md xziel/dist/
          cp xziel/tools/iw4_android_spike/patch_winlator_probe.py xziel/dist/

      - name: Upload Xziel IW4 Probe APK
        uses: actions/upload-artifact@v4
        with:
          name: Xziel-IW4-Probe-debug
          path: |
            xziel/dist/Xziel-IW4-Probe-debug.apk
            xziel/dist/WINLATOR-LGPL-2.1.txt
            xziel/dist/IW4_PROBE_THIRD_PARTY_NOTICE.md
            xziel/dist/patch_winlator_probe.py
            xziel/iw4-probe-badging.txt
            xziel/iw4-probe-apk-contents.txt
          if-no-files-found: error
          retention-days: 14
