name: HAYUYA TripoSG Public Probe

on:
  workflow_dispatch:
  push:
    branches:
      - art/hayuya-monster-v1
    paths:
      - tools/hayuya3d/triposg_cloud.py
      - .github/workflows/hayuya-triposg-public-probe.yml

permissions:
  contents: read

concurrency:
  group: hayuya-triposg-public-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install public probe deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install "gradio_client>=1.10,<2" trimesh

      - name: Generate unsimplified Monja Hero with public TripoSG
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/triposg-public-probe
          python - <<'PY'
          import json, sys
          from pathlib import Path

          sys.path.insert(0, "tools/hayuya3d")
          from triposg_cloud import generate

          source=Path("hayuya/assets/monja-mugfwln6/geometry/primary.webp")
          out=Path("out/triposg-public-probe/monja_triposg_raw.glb")
          meta=generate(
              source,
              out,
              seed=1993,
              apply_texture=False,
          )
          Path("out/triposg-public-probe/generation.json").write_text(
              json.dumps(meta, indent=2)+"\n",
              encoding="utf-8",
          )
          PY

      - name: Inspect raw Hero density
        shell: bash
        run: |
          python - <<'PY'
          import json
          import trimesh
          from pathlib import Path

          p=Path("out/triposg-public-probe/monja_triposg_raw.glb")
          loaded=trimesh.load(p, force="scene", process=False)
          meshes=list(loaded.geometry.values()) if hasattr(loaded,"geometry") else [loaded]
          faces=sum(len(m.faces) for m in meshes if hasattr(m,"faces"))
          vertices=sum(len(m.vertices) for m in meshes if hasattr(m,"vertices"))
          report={
              "schema":1,
              "product":"HAYUYA 3D",
              "backend":"VAST-AI/TripoSG public Space",
              "simplified":False,
              "triangles":int(faces),
              "vertices":int(vertices),
              "target_ceiling":2_000_000,
          }
          Path("out/triposg-public-probe/density.json").write_text(
              json.dumps(report,indent=2)+"\n"
          )
          print("HAYUYA_TRIPOSG_PUBLIC_DENSITY",json.dumps(report,separators=(",",":")))
          PY

      - name: Upload probe artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hayuya-triposg-public-probe
          path: out/triposg-public-probe/**
          if-no-files-found: warn
          retention-days: 3
