name: XZIEL UE StaticMesh Converter Compile

on:
  workflow_dispatch:
  push:
    branches:
      - feature/xziel-bo3-style-map-loader-v1
    paths:
      - .github/workflows/xziel-ue-staticmesh-converter-compile.yml
      - tools/maps/UEStaticMeshXZMS/**
      - tools/maps/UEStaticMeshAudit/**
      - tools/maps/UESceneTransformAudit/**
      - tools/maps/UEDeepPayloadAudit/**
      - tools/maps/patch_cue4parse_animation_fallback.py
      - tools/maps/xz_xzmesh_file_gate.c
      - engine/xz/xz_xztexture.h
      - engine/xz/xz_xztexture.c
      - tools/maps/xz_xztexture_selftest.c
      - tools/maps/xz_xztexture_file_gate.c
      - tools/maps/UETextureXZTX/**
      - engine/xz/xz_xzaudio.h
      - engine/xz/xz_xzaudio.c
      - tools/maps/xz_xzaudio_selftest.c
      - tools/maps/xz_xzaudio_file_gate.c
      - tools/maps/UEAudioXZAW/**
      - engine/xz/xz_native_payload.h
      - engine/xz/xz_native_payload.c
      - tools/maps/xz_native_payload_selftest.c
      - engine/xz/xz_xzmesh.c
      - engine/xz/xz_xzmesh.h

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout XZIEL Engine
        uses: actions/checkout@v4

      - name: Compile direct UE to XZMS converter
        run: |
          set -euxo pipefail
          dotnet restore tools/maps/UEStaticMeshXZMS/UEStaticMeshXZMS.csproj
          dotnet build tools/maps/UEStaticMeshXZMS/UEStaticMeshXZMS.csproj \
            --configuration Release \
            --no-restore \
            -warnaserror

      - name: Compile exhaustive UE static mesh audit
        run: |
          set -euxo pipefail
          dotnet restore tools/maps/UEStaticMeshAudit/UEStaticMeshAudit.csproj
          dotnet build tools/maps/UEStaticMeshAudit/UEStaticMeshAudit.csproj \
            --configuration Release \
            --no-restore \
            -warnaserror

      - name: Compile UE scene transform audit
        run: |
          set -euxo pipefail
          dotnet restore tools/maps/UESceneTransformAudit/UESceneTransformAudit.csproj
          dotnet build tools/maps/UESceneTransformAudit/UESceneTransformAudit.csproj \
            --configuration Release \
            --no-restore \
            -warnaserror

      - name: Prepare pinned CUE4Parse animation fallback
        run: |
          set -euxo pipefail
          CUE4PARSE_ROOT="$RUNNER_TEMP/CUE4Parse"
          git init "$CUE4PARSE_ROOT"
          git -C "$CUE4PARSE_ROOT" remote add origin \
            https://github.com/FabianFG/CUE4Parse.git
          git -C "$CUE4PARSE_ROOT" fetch --depth=1 origin \
            28f385e622468c4ab84997d596b46bb1c3adfcfa
          git -C "$CUE4PARSE_ROOT" checkout --detach FETCH_HEAD
          test "$(git -C "$CUE4PARSE_ROOT" rev-parse HEAD)" = \
            "28f385e622468c4ab84997d596b46bb1c3adfcfa"
          python3 tools/maps/patch_cue4parse_animation_fallback.py \
            --root "$CUE4PARSE_ROOT"
          echo "CUE4PARSE_SOURCE_ROOT=$CUE4PARSE_ROOT" >> "$GITHUB_ENV"

      - name: Compile deep UE payload audit
        run: |
          set -euxo pipefail
          dotnet restore tools/maps/UEDeepPayloadAudit/UEDeepPayloadAudit.csproj \
            -p:CUE4ParseSourceRoot="$CUE4PARSE_SOURCE_ROOT" \
            -p:CUE4PARSE_SKIP_NATIVE=true
          dotnet build tools/maps/UEDeepPayloadAudit/UEDeepPayloadAudit.csproj \
            --configuration Release \
            --no-restore \
            -p:CUE4ParseSourceRoot="$CUE4PARSE_SOURCE_ROOT" \
            -p:CUE4PARSE_SKIP_NATIVE=true

      - name: Compile UE Texture2D to XZTX converter
        run: |
          set -euxo pipefail
          dotnet restore tools/maps/UETextureXZTX/UETextureXZTX.csproj
          dotnet build tools/maps/UETextureXZTX/UETextureXZTX.csproj \
            --configuration Release \
            --no-restore \
            -warnaserror

      - name: Compile and self-test native XZTX validator
        run: |
          set -euxo pipefail
          mkdir -p build/xztx-native-gate
          cc -std=gnu11 -Wall -Wextra -Werror \
            -Iengine/xz \
            tools/maps/xz_xztexture_selftest.c \
            engine/xz/xz_xztexture.c \
            -o build/xztx-native-gate/xz-xztexture-selftest
          build/xztx-native-gate/xz-xztexture-selftest

          cc -std=gnu11 -Wall -Wextra -Werror \
            -Iengine/xz \
            tools/maps/xz_xztexture_file_gate.c \
            engine/xz/xz_xztexture.c \
            -o build/xztx-native-gate/xz-xztexture-file-gate
          test -x build/xztx-native-gate/xz-xztexture-file-gate
          echo XZIEL_UE_XZTX_CONVERTER_COMPILE_GREEN

      - name: Compile UE SoundWave to XZAW converter
        run: |
          set -euxo pipefail
          dotnet restore tools/maps/UEAudioXZAW/UEAudioXZAW.csproj
          dotnet build tools/maps/UEAudioXZAW/UEAudioXZAW.csproj \
            --configuration Release \
            --no-restore \
            -warnaserror

      - name: Compile and self-test native XZAW validator
        run: |
          set -euxo pipefail
          mkdir -p build/xzaw-native-gate
          cc -std=gnu11 -Wall -Wextra -Werror \
            -Iengine/xz \
            tools/maps/xz_xzaudio_selftest.c \
            engine/xz/xz_xzaudio.c \
            -o build/xzaw-native-gate/xz-xzaudio-selftest
          build/xzaw-native-gate/xz-xzaudio-selftest

          cc -std=gnu11 -Wall -Wextra -Werror \
            -Iengine/xz \
            tools/maps/xz_xzaudio_file_gate.c \
            engine/xz/xz_xzaudio.c \
            -o build/xzaw-native-gate/xz-xzaudio-file-gate
          test -x build/xzaw-native-gate/xz-xzaudio-file-gate
          echo XZIEL_UE_XZAW_CONVERTER_COMPILE_GREEN

      - name: Compile native rig and animation payload validator
        run: |
          set -euxo pipefail
          mkdir -p build/native-payload-gate
          cc -std=gnu11 -Wall -Wextra -Werror \
            -Iengine/xz \
            tools/maps/xz_native_payload_selftest.c \
            engine/xz/xz_native_payload.c \
            -lm \
            -o build/native-payload-gate/xz-native-payload-selftest
          build/native-payload-gate/xz-native-payload-selftest

      - name: Compile native XZMS file validator
        run: |
          set -euxo pipefail
          mkdir -p build/xzms-native-gate
          cc -std=gnu11 -Wall -Wextra -Werror \
            -Iengine/xz \
            tools/maps/xz_xzmesh_file_gate.c \
            engine/xz/xz_xzmesh.c \
            -lm \
            -o build/xzms-native-gate/xz-xzmesh-file-gate
          test -x build/xzms-native-gate/xz-xzmesh-file-gate
          echo XZIEL_UE_XZMS_CONVERTER_COMPILE_GREEN
