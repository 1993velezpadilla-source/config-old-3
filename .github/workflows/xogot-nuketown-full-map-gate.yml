name: Xogot Nuketown Full Map Gate

on:
  workflow_dispatch:
  push:
    branches:
      - feature/godot-aaa-rebuild-v1
    paths:
      - "xogot/nuketown_full_map.tscn"
      - "xogot/scripts/nuketown_full_map.gd"
      - "xogot/scripts/nuketown_navigation_runtime.gd"
      - "xogot/scripts/nuketown_source_audio_runtime.gd"
      - "xogot/data/nuketown_source_audio.json"
      - "xogot/scripts/interactable.gd"
      - "xogot/scripts/weapon.gd"
      - "xogot/ci/nuketown_full_map_probe.gd"
      - "xogot/data/nuketown_source_gameplay.json"
      - "xogot/data/nuketown_actor_coverage.json"
      - "xogot/scripts/xziel_benchmark_loader.gd"
      - "tools/maps/xztx_astc6_to_png.py"
      - "tools/maps/xz_mystery_to_gltf.py"
      - "benchmarks/nuketown_xziel/**"
      - ".github/workflows/xogot-nuketown-full-map-gate.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: xogot-nuketown-full-map-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-map:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Mount complete source-world payload
        shell: bash
        run: |
          set -euo pipefail
          test -d benchmarks/nuketown_xziel
          rm -rf xogot/assets/benchmarks/nuketown_xziel
          mkdir -p xogot/assets/benchmarks
          cp -a benchmarks/nuketown_xziel xogot/assets/benchmarks/nuketown_xziel

          python3 - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          root=Path("xogot/assets/benchmarks/nuketown_xziel")
          p=root/"visual-scene.json"
          d=json.loads(p.read_text())
          authority=json.loads((root/"source_manifest.json").read_text())
          assert authority["source_authority"] == "Pavlov/Plugins/UGC5097941/Content (complete folder)", authority
          assert authority["source_file_count"] == 2859, authority
          assert authority["source_package_count"] == 1266, authority
          assert authority["source_export_count"] == 2499, authority
          complete=authority["complete_converted_library"]
          expected={
              "static_meshes":83,
              "textures":321,
              "audio":26,
              "skeletons":3,
              "skeletal_meshes":3,
              "animations":9,
          }
          assert {k:int(complete[k]["count"]) for k in expected} == expected, complete
          print("XZOGOT_NUKETOWN_COMPLETE_SOURCE_AUTHORITY_GREEN", expected)
          classes=Counter(x["className"] for x in d["actorAnchors"])
          assert d["summary"]["ready"] is True
          assert len(d["meshes"]) == 52
          assert len(d["instances"]) == 124
          assert len(d["actorAnchors"]) == 233
          assert classes["Pavlov_Spawn"] == 3
          assert classes["Pavlov_Ladder"] == 2
          assert classes["wallbuy_C"] + classes["wallbuy_2_C"] + classes["wallbuy_3_C"] == 3
          assert classes["NewBlueprint1_2_C"] == 1
          print("XZOGOT_NUKETOWN_FULL_SOURCE_PREFLIGHT_GREEN", dict(classes))
          PY

      - name: Mount latest private Nuketown source WAV proof
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          AUDIO_RUN=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/xogot-nuketown-audio-truth.yml/runs?branch=feature%2Fgodot-aaa-rebuild-v1&status=success&per_page=1" \
            --jq '.workflow_runs[0].id')
          test -n "$AUDIO_RUN"
          rm -rf "$RUNNER_TEMP/nuketown-audio-proof"
          mkdir -p "$RUNNER_TEMP/nuketown-audio-proof"
          gh run download "$AUDIO_RUN" \
            --repo "$GITHUB_REPOSITORY" \
            --name Xogot-Nuketown-Source-Audio-Proof \
            --dir "$RUNNER_TEMP/nuketown-audio-proof"

          mkdir -p xogot/assets/benchmarks/nuketown_xziel/audio
          find "$RUNNER_TEMP/nuketown-audio-proof" -type f -name '*.wav' -print0 \
            | xargs -0 -I{} cp "{}" xogot/assets/benchmarks/nuketown_xziel/audio/

          WAV_COUNT=$(find xogot/assets/benchmarks/nuketown_xziel/audio -maxdepth 1 -type f -name '*.wav' | wc -l)
          test "$WAV_COUNT" -eq 20
          test -s xogot/assets/benchmarks/nuketown_xziel/audio/music_box_00.wav
          test -s xogot/assets/benchmarks/nuketown_xziel/audio/ntzombiesamb.wav
          test -s xogot/assets/benchmarks/nuketown_xziel/audio/marlton_1.wav
          echo "XZOGOT_NUKETOWN_SOURCE_AUDIO_MOUNT_GREEN run=$AUDIO_RUN wavs=$WAV_COUNT"

      - name: Mount real Mystery Box source rig and animations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RIG_RUN=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/xogot-nuketown-source-rig-animation-truth.yml/runs?branch=feature%2Fgodot-aaa-rebuild-v1&status=success&per_page=1" \
            --jq '.workflow_runs[0].id')
          test -n "$RIG_RUN"
          rm -rf "$RUNNER_TEMP/nuketown-rig-proof"
          mkdir -p "$RUNNER_TEMP/nuketown-rig-proof" build
          gh run download "$RIG_RUN" \
            --repo "$GITHUB_REPOSITORY" \
            --name Xogot-Nuketown-Source-Rig-Animation-Proof \
            --dir "$RUNNER_TEMP/nuketown-rig-proof"

          rm -rf xogot/assets/benchmarks/nuketown_xziel/mystery_source
          python3 tools/maps/xz_mystery_to_gltf.py \
            "$RUNNER_TEMP/nuketown-rig-proof" \
            xogot/assets/benchmarks/nuketown_xziel/mystery_source \
            2>&1 | tee build/nuketown-mystery-source-gltf.log
          grep -q "XZOGOT_MYSTERY_GLTF_GREEN" build/nuketown-mystery-source-gltf.log
          test -s xogot/assets/benchmarks/nuketown_xziel/mystery_source/mystery_box_source.gltf
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("xogot/assets/benchmarks/nuketown_xziel/mystery_source/manifest.json")
          d=json.loads(p.read_text())
          assert d["ready"] is True
          assert d["bones"] == 5
          assert len(d["animations"]) == 7
          required={"arrive","close","leave","open","teddy_rise","weapon_dual_rise","weapon_rise"}
          assert required == {x["name"] for x in d["animations"]}, d["animations"]
          print("XZOGOT_MYSTERY_SOURCE_MOUNT_GREEN", d["skeletonHash"], sorted(required))
          PY

      - name: Install rendering and ASTC tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip curl xvfb libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers astcenc

      - name: Decode source ASTC 6x6 textures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          python3 tools/maps/xztx_astc6_to_png.py \
            xogot/assets/benchmarks/nuketown_xziel \
            2>&1 | tee build/nuketown-full-map-textures.log
          grep -q "XZOGOT_ASTC6_DECODE_GREEN" build/nuketown-full-map-textures.log

      - name: Install Godot 4.6.1
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --retry-all-errors --retry-delay 2 \
            https://github.com/godotengine/godot-builds/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip \
            -o /tmp/godot.zip
          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.6.1-stable_linux.x86_64

      - name: Import complete map project
        shell: bash
        run: |
          set -euo pipefail
          timeout 420 /tmp/godot/Godot_v4.6.1-stable_linux.x86_64 \
            --headless --editor --path xogot --quit \
            2>&1 | tee build/nuketown-full-map-import.log
          ! grep -E "SCRIPT ERROR|Parse Error|ERROR: Failed to load script|MAX_MESH_SURFACES" build/nuketown-full-map-import.log

      - name: Gate full source map runtime
        shell: bash
        run: |
          set -euo pipefail
          timeout 420 xvfb-run -a -s "-screen 0 1280x720x24" \
            /tmp/godot/Godot_v4.6.1-stable_linux.x86_64 \
            --path xogot \
            --rendering-method gl_compatibility \
            --script res://ci/nuketown_full_map_probe.gd \
            2>&1 | tee build/nuketown-full-map-probe.log
          grep -q "XZOGOT_NUKETOWN_FULL_MAP_PROBE_GREEN" build/nuketown-full-map-probe.log
          ! grep -E "NUKETOWN_FULL_MAP_PROBE:|NUKETOWN_FULL_MAP:" build/nuketown-full-map-probe.log

      - name: Upload full-map proof
        uses: actions/upload-artifact@v4
        with:
          name: Xogot-Nuketown-Full-Map-Proof
          path: |
            build/nuketown-full-map-textures.log
            build/nuketown-mystery-source-gltf.log
            build/nuketown-full-map-import.log
            build/nuketown-full-map-probe.log
          if-no-files-found: error
          retention-days: 14
