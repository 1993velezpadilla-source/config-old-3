name: Stage Nuketown Source World Benchmark

on:
  workflow_dispatch:
    inputs:
      source_run:
        description: "Exact Full Source Authority run id"
        required: false
        type: string
  push:
    branches:
      - feature/godot-aaa-rebuild-v1
    paths:
      - ".github/workflows/xogot-stage-nuketown-benchmark.yml"
      - "tools/maps/xz_skeletal_library_to_gltf.py"
  workflow_run:
    workflows:
      - "Xogot Nuketown Full Source Authority"
    types:
      - completed

permissions:
  contents: write
  actions: write

concurrency:
  group: xogot-stage-nuketown-benchmark
  cancel-in-progress: true

jobs:
  stage:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_ARTIFACT: "Xogot-Nuketown-Full-Source-Authority"

    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/godot-aaa-rebuild-v1
          fetch-depth: 0

      - name: Download complete-source-derived Nuketown runtime artifact
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            SOURCE_RUN="${{ github.event.workflow_run.id }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.source_run }}" ]; then
            SOURCE_RUN="${{ inputs.source_run }}"
          else
            SOURCE_RUN=$(gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/actions/runs?branch=feature%2Fgodot-aaa-rebuild-v1&status=success&per_page=100" \
              --jq '.workflow_runs[] | select(.name=="Xogot Nuketown Full Source Authority") | .id' \
              | head -1)
          fi
          test -n "$SOURCE_RUN"
          echo "SOURCE_RUN=$SOURCE_RUN" >> "$GITHUB_ENV"

          rm -rf "$RUNNER_TEMP/nuketown-rich"
          mkdir -p "$RUNNER_TEMP/nuketown-rich"
          gh run download "$SOURCE_RUN" -n "$SOURCE_ARTIFACT" -D "$RUNNER_TEMP/nuketown-rich"

          SCENE=$(find "$RUNNER_TEMP/nuketown-rich" -type f -path '*/runtime-static-scene/visual-scene.json' | head -1)
          test -n "$SCENE"
          RUNTIME_ROOT=$(dirname "$SCENE")
          AUTH_ROOT=$(dirname "$RUNTIME_ROOT")
          echo "RUNTIME_ROOT=$RUNTIME_ROOT" >> "$GITHUB_ENV"
          echo "AUTH_ROOT=$AUTH_ROOT" >> "$GITHUB_ENV"

          test -s "$AUTH_ROOT/nuketown-full-content-manifest.json"
          test -s "$AUTH_ROOT/nuketown-content-files.txt"
          test -s "$AUTH_ROOT/nuketown-source-export-manifest-summary.json"
          test -s "$RUNTIME_ROOT/ue-lights.json"
          test -s "$RUNTIME_ROOT/xzen-report.json"
          test -s "$RUNTIME_ROOT/material-binding-manifest.json"
          test -s "$RUNTIME_ROOT/xzml-report.json"
          test -d "$RUNTIME_ROOT/vfs/xziel/maps/xziel_nuketown_zombies/meshes"
          test -d "$RUNTIME_ROOT/vfs/xziel/maps/xziel_nuketown_zombies/textures"
          echo "XZOGOT_NUKETOWN_COMPLETE_SOURCE_RUNTIME_GREEN run=$SOURCE_RUN"

      - name: Stage complete source-derived runtime world payload
        shell: bash
        run: |
          set -euo pipefail
          dst=benchmarks/nuketown_xziel
          rm -rf "$dst"
          mkdir -p "$dst/vfs/xziel/maps/xziel_nuketown_zombies"

          cp "$RUNTIME_ROOT/visual-scene.json" "$dst/visual-scene.json"
          cp "$RUNTIME_ROOT/ue-lights.json" "$dst/ue-lights.json"
          cp "$RUNTIME_ROOT/xzen-report.json" "$dst/xzen-report.json"
          cp "$RUNTIME_ROOT/material-binding-manifest.json" "$dst/material-binding-manifest.json"
          cp "$RUNTIME_ROOT/xzml-report.json" "$dst/xzml-report.json"
          cp "$RUNTIME_ROOT/xzmi-report.json" "$dst/xzmi-report.json"
          cp "$RUNTIME_ROOT/materials.xzml" "$dst/materials.xzml"
          cp "$RUNTIME_ROOT/materials.xzmi" "$dst/materials.xzmi"
          cp "$AUTH_ROOT/nuketown-full-content-manifest.json" "$dst/nuketown-full-content-manifest.json"
          cp "$AUTH_ROOT/nuketown-content-files.txt" "$dst/nuketown-content-files.txt"
          cp "$AUTH_ROOT/nuketown-source-export-manifest-summary.json" "$dst/nuketown-source-export-manifest-summary.json"
          if [ -s "$AUTH_ROOT/nuketown-complete-converted-library.json" ]; then
            cp "$AUTH_ROOT/nuketown-complete-converted-library.json" "$dst/nuketown-complete-converted-library.json"
          fi
          if [ -s "$AUTH_ROOT/runtime-skeletal-scene/skeletal-scene.json" ]; then
            cp "$AUTH_ROOT/runtime-skeletal-scene/skeletal-scene.json" "$dst/skeletal-scene.json"
            echo "XZOGOT_NUKETOWN_EXACT_SKELETAL_SCENE_STAGED"
          else
            echo "XZOGOT_NUKETOWN_EXACT_SKELETAL_SCENE_PENDING source_run=$SOURCE_RUN"
          fi
          test -s "$AUTH_ROOT/ue-xztx-probe/report.json"
          cp "$AUTH_ROOT/ue-xztx-probe/report.json" "$dst/complete-xztx-native-report.json"

          srcmap="$RUNTIME_ROOT/vfs/xziel/maps/xziel_nuketown_zombies"
          cp -a "$srcmap/meshes" "$dst/vfs/xziel/maps/xziel_nuketown_zombies/meshes"
          cp -a "$srcmap/textures" "$dst/vfs/xziel/maps/xziel_nuketown_zombies/textures"
          # The map's XZML references 221 textures, but the literal Content
          # authority contains 321 converted Texture2D assets. Stage all of them
          # under the same stable native indices so Godot can recover source
          # bindings that were not part of the original visible subset.
          cp "$AUTH_ROOT"/ue-xztx-probe/*.xzt             "$dst/vfs/xziel/maps/xziel_nuketown_zombies/textures/"
          test "$(find "$dst/vfs/xziel/maps/xziel_nuketown_zombies/textures" -maxdepth 1 -type f -name '*.xzt' | wc -l)" -eq 321
          cp "$srcmap/scene.xzsc" "$dst/vfs/xziel/maps/xziel_nuketown_zombies/scene.xzsc"
          cp "$srcmap/environment.xzen" "$dst/vfs/xziel/maps/xziel_nuketown_zombies/environment.xzen"
          cp "$srcmap/materials.xzml" "$dst/vfs/xziel/maps/xziel_nuketown_zombies/materials.xzml"
          cp "$srcmap/materials.xzmi" "$dst/vfs/xziel/maps/xziel_nuketown_zombies/materials.xzmi"

          python3 - <<'PY'
          import json
          from pathlib import Path

          dst=Path("benchmarks/nuketown_xziel")
          scene=json.loads((dst/"visual-scene.json").read_text())
          lights=json.loads((dst/"xzen-report.json").read_text())
          mats=json.loads((dst/"material-binding-manifest.json").read_text())
          tex=json.loads((dst/"xzml-report.json").read_text())
          full_content=json.loads((dst/"nuketown-full-content-manifest.json").read_text())
          full_deps=json.loads((dst/"nuketown-source-export-manifest-summary.json").read_text())
          complete_library_path=dst/"nuketown-complete-converted-library.json"
          complete_library=(
              json.loads(complete_library_path.read_text())
              if complete_library_path.is_file()
              else {}
          )
          complete_native=json.loads((dst/"complete-xztx-native-report.json").read_text())
          assert complete_native["ready"] is True, complete_native
          assert complete_native["convertedTextures"] == 321, complete_native
          complete_rows=[]
          for row in complete_native["textures"]:
              complete_rows.append({
                  "sourcePath":row["objectPath"],
                  "runtimeFile":row["file"],
                  "format":row["format"],
                  "width":row["width"],
                  "height":row["height"],
                  "mipCount":row["mipCount"],
                  "srgb":row["srgb"],
              })
          complete_report={
              "schemaVersion":1,
              "authority":"literal_complete_nuketown_content_folder",
              "textureAssetCount":len(complete_rows),
              "astc6Count":sum(1 for row in complete_rows if row["format"]=="PF_ASTC_6x6"),
              "bgra8Count":sum(1 for row in complete_rows if row["format"]=="PF_B8G8R8A8"),
              "textureAssets":complete_rows,
              "ready":True,
          }
          assert complete_report["textureAssetCount"] == 321
          assert complete_report["astc6Count"] == 312
          assert complete_report["bgra8Count"] == 9
          (dst/"complete-xztx-report.json").write_text(
              json.dumps(complete_report,indent=2)+"\n"
          )
          full_by_path={row["sourcePath"]:row for row in complete_rows}
          for row in tex["textureAssets"]:
              source=row["sourcePath"]
              assert source in full_by_path, source
              assert full_by_path[source]["runtimeFile"] == row["runtimeFile"], (source,row,full_by_path[source])
          mesh_files=sorted((dst/"vfs/xziel/maps/xziel_nuketown_zombies/meshes").glob("*.xzm"))
          texture_files=sorted((dst/"vfs/xziel/maps/xziel_nuketown_zombies/textures").glob("*.xzt"))

          assert scene["format"] == "xziel_visual_scene_v1"
          assert scene["summary"]["ready"] is True
          assert len(scene["meshes"]) == 52
          assert len(scene["instances"]) == 124
          assert len(mesh_files) == 52
          assert lights["lightCount"] == 5
          assert mats["summary"]["unresolvedMaterialCount"] == 0
          assert mats["summary"]["unresolvedTextureCount"] == 0
          assert tex["textureAssetCount"] == 221, tex["textureAssetCount"]
          assert len(texture_files) == 321, len(texture_files)

          manifest={
              "schema":2,
              "id":"xogot_nuketown_complete_source_runtime",
              "purpose":"Godot runtime derived from the literal complete Nuketown Content folder",
              "source_run":int(__import__("os").environ["SOURCE_RUN"]),
              "source_artifact":"Xogot-Nuketown-Full-Source-Authority",
              "source_authority":"Pavlov/Plugins/UGC5097941/Content (complete folder)",
              "source_map":"Pavlov/Plugins/UGC5097941/Content/nuketownz.umap",
              "coordinate_system":"XZIEL X,-Y,Z meters; Godot conversion happens once at XZIELSceneRoot",
              "mesh_count":len(mesh_files),
              "instance_count":len(scene["instances"]),
              "material_count":mats["summary"]["usedMaterialCount"],
              "texture_count":len(texture_files),
              "runtime_referenced_texture_count":tex["textureAssetCount"],
              "complete_source_texture_count":complete_report["textureAssetCount"],
              "complete_source_astc6_count":complete_report["astc6Count"],
              "complete_source_bgra8_count":complete_report["bgra8Count"],
              "light_count":lights["lightCount"],
              "unresolved_meshes":scene["summary"]["unresolvedMeshCount"],
              "unresolved_materials":mats["summary"]["unresolvedMaterialCount"],
              "unresolved_textures":mats["summary"]["unresolvedTextureCount"],
              "runtime_loader":"res://scripts/xziel_benchmark_loader.gd",
              "full_content_manifest":"nuketown-full-content-manifest.json",
              "full_content_file_list":"nuketown-content-files.txt",
              "full_dependency_manifest":"nuketown-source-export-manifest-summary.json",
              "source_file_count":full_content["fileCount"],
              "source_total_bytes":full_content["totalBytes"],
              "source_package_count":full_deps["packageCount"],
              "source_export_count":full_deps["exportsDecoded"],
              "source_dependency_edges":{
                  "structural":full_deps["structuralEdges"],
                  "preload":full_deps["preloadEdges"],
                  "local":full_deps["localDependencyEdges"],
                  "external":full_deps["externalImportEdges"],
                  "script":full_deps["scriptImportEdges"],
              },
              "complete_converted_library":complete_library.get("assets", {}),
          }
          (dst/"source_manifest.json").write_text(json.dumps(manifest,indent=2)+"\n")
          print("XZOGOT_NUKETOWN_WORLD_STAGE_GREEN",manifest)
          PY

          du -sh "$dst"
          find "$dst" -type f -size +95M -print -quit | (! grep .)
          echo "XZOGOT_NUKETOWN_WORLD_FILESIZE_GATE_GREEN"

      - name: Regenerate native Godot GLB benchmark meshes
        shell: bash
        run: |
          set -euo pipefail
          src=benchmarks/nuketown_xziel/vfs/xziel/maps/xziel_nuketown_zombies/meshes
          dst=benchmarks/nuketown_xziel/vfs/xziel/maps/xziel_nuketown_zombies/meshes_glb
          report=benchmarks/nuketown_xziel/native-glb-report.json
          test -d "$src"
          rm -rf "$dst"
          mkdir -p "$dst"

          python3 tools/maps/xzms_to_glb.py "$src" "$dst" \
            --report "$report" | tee /tmp/nuketown-stage-glb.log
          grep -q "XZOGOT_XZMS_GLB_GREEN" /tmp/nuketown-stage-glb.log

          python3 - <<'PY'
          import json
          from pathlib import Path

          root=Path("benchmarks/nuketown_xziel")
          report_path=root/"native-glb-report.json"
          manifest_path=root/"source_manifest.json"
          glb_dir=root/"vfs/xziel/maps/xziel_nuketown_zombies/meshes_glb"

          report=json.loads(report_path.read_text())
          files=sorted(glb_dir.glob("*.glb"))
          assert report["mesh_count"] == 52, report
          assert report["mesh_chunks"] == 53, report
          assert report["max_chunk_surfaces"] <= 240, report
          assert report["vertices"] == 671012, report
          assert report["indices"] == 859353, report
          assert report["submeshes"] == 563, report
          assert len(files) == 52, len(files)
          assert all(path.stat().st_size > 100 for path in files)

          manifest=json.loads(manifest_path.read_text())
          manifest["runtime_mesh_format"]="GLB"
          manifest["runtime_mesh_directory"]="vfs/xziel/maps/xziel_nuketown_zombies/meshes_glb"
          manifest["runtime_mesh_conversion"]="lossless XZMS vertex/index/submesh bridge; Godot-safe surface chunking only"
          manifest["runtime_mesh_chunks"]=report["mesh_chunks"]
          manifest["runtime_max_surfaces_per_mesh"]=report["max_chunk_surfaces"]
          manifest["source_xzms_authority"]={
              "source_run":int(__import__("os").environ["SOURCE_RUN"]),
              "source_artifact":"Xogot-Nuketown-Full-Source-Authority",
              "staged_directory":"vfs/xziel/maps/xziel_nuketown_zombies/meshes",
          }
          manifest_path.write_text(json.dumps(manifest,indent=2)+"\n")
          print("XZOGOT_NUKETOWN_STAGE_NATIVE_GLB_GREEN",len(files))
          PY

      - name: Bridge complete static mesh source library
        shell: bash
        run: |
          set -euo pipefail
          root=benchmarks/nuketown_xziel
          tmp="$RUNNER_TEMP/nuketown-extra-xzms"
          extra="$root/source_library/extra_static_glb"
          rm -rf "$tmp" "$root/source_library"
          mkdir -p "$tmp" "$extra"

          python3 - <<'PY'
          import json
          import os
          import shutil
          from pathlib import Path

          auth=Path(os.environ["AUTH_ROOT"])
          root=Path("benchmarks/nuketown_xziel")
          source_dir=auth/"ue-xzms-probe"
          scene=json.loads((root/"visual-scene.json").read_text())
          source_files=sorted(source_dir.glob("*.xzm"))
          used={str(row["runtimeFile"]) for row in scene["meshes"]}
          extras=[path for path in source_files if path.name not in used]

          assert len(source_files)==83, len(source_files)
          assert len(used)==52, len(used)
          assert used.issubset({path.name for path in source_files})
          assert len(extras)==31, len(extras)

          tmp=Path(os.environ["RUNNER_TEMP"])/"nuketown-extra-xzms"
          for path in extras:
              shutil.copy2(path,tmp/path.name)

          source_report=source_dir/"report.json"
          assert source_report.is_file(), source_report
          shutil.copy2(source_report,root/"complete-static-mesh-source-report.json")

          manifest={
              "schemaVersion":1,
              "authority":"literal complete Nuketown converted static-mesh library",
              "sourceCount":len(source_files),
              "placedCount":len(used),
              "extraCount":len(extras),
              "placedFiles":sorted(used),
              "extraFiles":[path.name for path in extras],
              "ready":True,
          }
          (root/"complete-static-mesh-library.json").write_text(
              json.dumps(manifest,indent=2)+"\n"
          )
          print(
              "XZOGOT_NUKETOWN_COMPLETE_STATIC_LIBRARY_SPLIT_GREEN",
              f"source={len(source_files)}",
              f"placed={len(used)}",
              f"extra={len(extras)}",
          )
          PY

          python3 tools/maps/xzms_to_glb.py "$tmp" "$extra"             --report "$root/complete-static-extra-glb-report.json"             | tee /tmp/nuketown-complete-static-glb.log
          grep -q "XZOGOT_XZMS_GLB_GREEN" /tmp/nuketown-complete-static-glb.log

          python3 - <<'PY'
          import json
          from pathlib import Path

          root=Path("benchmarks/nuketown_xziel")
          split=json.loads((root/"complete-static-mesh-library.json").read_text())
          report=json.loads((root/"complete-static-extra-glb-report.json").read_text())
          glbs=sorted((root/"source_library/extra_static_glb").glob("*.glb"))

          assert split["sourceCount"]==83, split
          assert split["placedCount"]==52, split
          assert split["extraCount"]==31, split
          assert report["mesh_count"]==31, report
          assert len(glbs)==31, len(glbs)
          assert all(path.stat().st_size>100 for path in glbs)

          manifest_path=root/"source_manifest.json"
          manifest=json.loads(manifest_path.read_text())
          manifest["complete_static_mesh_runtime_library"]={
              "source_count":83,
              "map_referenced_count":52,
              "unplaced_library_count":31,
              "map_referenced_directory":"vfs/xziel/maps/xziel_nuketown_zombies/meshes_glb",
              "unplaced_library_directory":"source_library/extra_static_glb",
              "source_report":"complete-static-mesh-source-report.json",
              "split_manifest":"complete-static-mesh-library.json",
          }
          manifest_path.write_text(json.dumps(manifest,indent=2)+"\n")
          print(
              "XZOGOT_NUKETOWN_COMPLETE_STATIC_GODOT_LIBRARY_GREEN",
              "placed=52 extra=31 total=83"
          )
          PY

      - name: Bridge complete source skeletal library
        shell: bash
        run: |
          set -euo pipefail
          root=benchmarks/nuketown_xziel
          out="$root/source_library/skeletal_gltf"
          rm -rf "$out"
          mkdir -p "$out"

          python3 tools/maps/xz_skeletal_library_to_gltf.py             "$RUNNER_TEMP/nuketown-rich"             "$out"             | tee /tmp/nuketown-skeletal-library.log
          grep -q "XZOGOT_SKELETAL_LIBRARY_GLTF_GREEN"             /tmp/nuketown-skeletal-library.log

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root=Path("benchmarks/nuketown_xziel")
          skeletal=root/"source_library/skeletal_gltf"
          lib=json.loads((skeletal/"manifest.json").read_text())
          assert lib["ready"] is True, lib
          assert lib["sourceSkeletonCount"]==3, lib
          assert lib["sourceSkeletalMeshCount"]==3, lib
          assert lib["sourceAnimationCount"]==9, lib
          assert lib["outputCount"]==3, lib
          outputs=sorted(skeletal.glob("*.gltf"))
          assert len(outputs)==3, outputs
          assert all(path.stat().st_size>100 for path in outputs)

          scene=json.loads((root/"visual-scene.json").read_text())
          anchors=[
              row for row in scene["actorAnchors"]
              if row.get("className")=="SkeletalMeshActor"
          ]
          assert len(anchors)==2, anchors
          (root/"skeletal-actor-anchors.json").write_text(
              json.dumps(
                  {
                      "schemaVersion":1,
                      "sourceActorCount":len(anchors),
                      "actors":anchors,
                      "ready":True,
                  },
                  indent=2,
              )+"\n"
          )

          exact_path=root/"skeletal-scene.json"
          exact_ready=False
          bindings=[]
          if exact_path.is_file():
              exact=json.loads(exact_path.read_text())
              assert exact["ready"] is True, exact
              assert exact["skeletalComponentCount"]==3, exact
              assert exact["resolvedActorCount"]==3, exact
              assert exact["unresolvedCount"]==0, exact
              assert exact["failureCount"]==0, exact
              by_xzsk={row["sourceXzskFile"]:row for row in lib["meshes"]}
              assert len(by_xzsk)==3, by_xzsk
              for actor in exact["actors"]:
                  source_xzsk=actor["sourceXzskFile"]
                  assert source_xzsk in by_xzsk, (source_xzsk,by_xzsk)
                  asset=by_xzsk[source_xzsk]
                  assert asset["skeletonHash"]==actor["skeletonHash"], (asset,actor)
                  bindings.append({
                      "actorName":actor["actorName"],
                      "actorObjectPath":actor["actorObjectPath"],
                      "componentObjectPath":actor["componentObjectPath"],
                      "sourceSkeletalMeshObjectPath":actor["sourceSkeletalMeshObjectPath"],
                      "sourceSkeletalMeshPackagePath":actor["sourceSkeletalMeshPackagePath"],
                      "sourceXzskFile":source_xzsk,
                      "skeletonHash":actor["skeletonHash"],
                      "matrixRowMajor":actor["matrixRowMajor"],
                      "gltf":asset["output"],
                      "animations":[row["name"] for row in asset["animations"]],
                  })
              assert len(bindings)==3, bindings
              assert len({row["gltf"] for row in bindings})==3, bindings
              exact_ready=True

          (root/"skeletal-runtime-bindings.json").write_text(
              json.dumps(
                  {
                      "schemaVersion":1,
                      "authority":"cooked UE skeletal component -> recovered XZSK -> Godot glTF",
                      "bindingCount":len(bindings),
                      "bindings":bindings,
                      "ready":exact_ready,
                  },
                  indent=2,
              )+"\n"
          )
          if exact_ready:
              print(
                  "XZOGOT_NUKETOWN_EXACT_SKELETAL_BINDINGS_GREEN",
                  [(row["actorName"],row["sourceXzskFile"],row["gltf"],row["animations"]) for row in bindings]
              )
          else:
              print("XZOGOT_NUKETOWN_EXACT_SKELETAL_BINDINGS_PENDING")

          names=[
              "SkeletalMeshActor_3",
              "SkeletalMeshActor_5",
          ]
          matched=[]
          shard_root=Path(os.environ["AUTH_ROOT"])/"source-manifest-shards"
          shards=sorted(shard_root.glob("shard-*.json"))
          assert len(shards)==16, len(shards)
          for shard_path in shards:
              shard=json.loads(shard_path.read_text())
              for node in shard.get("nodes",[]):
                  encoded=json.dumps(node,sort_keys=True)
                  if any(name in encoded for name in names):
                      matched.append(node)

          (root/"skeletal-actor-source-node-audit.json").write_text(
              json.dumps(
                  {
                      "schemaVersion":1,
                      "actorNames":names,
                      "matchCount":len(matched),
                      "nodes":matched,
                      "ready":len(matched)>=2,
                  },
                  indent=2,
              )+"\n"
          )
          assert len(matched)>=2, len(matched)

          manifest_path=root/"source_manifest.json"
          manifest=json.loads(manifest_path.read_text())
          manifest["source_skeletal_actor_count"]=2
          manifest["complete_skeletal_runtime_library"]={
              "skeletons":3,
              "skeletal_meshes":3,
              "animations":9,
              "gltf_outputs":3,
              "directory":"source_library/skeletal_gltf",
              "manifest":"source_library/skeletal_gltf/manifest.json",
              "actor_anchors":"skeletal-actor-anchors.json",
              "source_node_audit":"skeletal-actor-source-node-audit.json",
              "source_node_matches":len(matched),
              "exact_placement_report":"skeletal-scene.json" if exact_path.is_file() else "",
              "runtime_bindings":"skeletal-runtime-bindings.json",
              "exact_runtime_bindings_ready":exact_ready,
          }
          manifest_path.write_text(json.dumps(manifest,indent=2)+"\n")

          print(
              "XZOGOT_NUKETOWN_SKELETAL_ACTOR_AUDIT_GREEN",
              f"actors={len(anchors)}",
              f"source_nodes={len(matched)}",
              f"exact_bindings={len(bindings)}",
          )
          PY

      - name: Commit portable Godot benchmark payload
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/nuketown_xziel
          if git diff --cached --quiet; then
            echo "XZOGOT_NUKETOWN_WORLD_ALREADY_STAGED"
            exit 0
          fi
          git commit -m "assets: stage complete Nuketown source-world benchmark"
          git pull --rebase origin feature/godot-aaa-rebuild-v1
          git push origin HEAD:feature/godot-aaa-rebuild-v1
          echo "XZOGOT_NUKETOWN_WORLD_COMMIT_GREEN"

      - name: Dispatch Godot validation from staged complete source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for workflow in \
            xogot-nuketown-full-map-gate.yml \
            xogot-nuketown-benchmark-capture.yml \
            xogot-aaa-rebuild-gate.yml
          do
            gh workflow run "$workflow" \
              --repo "$GITHUB_REPOSITORY" \
              --ref feature/godot-aaa-rebuild-v1
          done
          echo "XZOGOT_COMPLETE_SOURCE_GODOT_GATES_DISPATCHED"

      - name: Upload stage proof
        uses: actions/upload-artifact@v4
        with:
          name: xogot-nuketown-world-stage-proof
          path: benchmarks/nuketown_xziel/source_manifest.json
          if-no-files-found: error
          retention-days: 14
