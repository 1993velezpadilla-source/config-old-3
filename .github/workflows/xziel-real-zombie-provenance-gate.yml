name: XZIEL Real Zombie Anti-Regression Gate

on:
  push:
    branches:
      - fix/xziel-real-zombie-provenance-gate-20261013
    paths:
      - 'scripts/guard_hotstrike_real_zombie.py'
      - 'tools/zombie_prototype/test_hotstrike_real_zombie_gate.py'
      - '.github/workflows/xziel-real-zombie-provenance-gate.yml'
  pull_request:
    paths:
      - 'scripts/guard_hotstrike_real_zombie.py'
      - 'tools/zombie_prototype/test_hotstrike_real_zombie_gate.py'
      - '.github/workflows/xziel-real-zombie-provenance-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  anti-regression:
    name: Refuse synthetic stock zombie as Hotstrike
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Execute source / geometry / native APK provenance tests
        run: python3 -m unittest discover -s tools/zombie_prototype -p test_hotstrike_real_zombie_gate.py -v
      - name: Declare accurate status
        run: |
          echo 'ANTI-REGRESSION GATE GREEN: synthetic stock zombie and missing renderer rejected.'
          echo 'REAL HOTSTRIKE MODEL: NOT YET CONVERTED OR DEVICE-TESTED.'
          echo 'DO NOT RELEASE ANOTHER NEW-ZOMBIE APK WITHOUT REAL SOURCE INPUT AND PHONE PROOF.'
