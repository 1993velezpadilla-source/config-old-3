name: Xogot Nacht Audio Placement Gate

on:
  workflow_dispatch:
  push:
    branches:
      - feature/godot-aaa-rebuild-v1
    paths:
      - "tools/maps/UEAudioSceneExtract/**"
      - "tools/maps/UEAudioCueGraphExtract/**"
      - "tools/maps/UEAudioTemplateCatalog/**"
      - ".github/workflows/xogot-nacht-audio-placement-gate.yml"

permissions:
  contents: read

concurrency:
  group: xogot-nacht-audio-placement-gate
  cancel-in-progress: true

jobs:
  audio-authority:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      WORKSHOP_APP_ID: "555160"
      WORKSHOP_ITEM_ID: "2755515831"
      EXPECTED_MAP: "Pavlov/Content/CustomMaps/UGC2755515831/Nacht_de_Untoten.umap"

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Download and unpack exact validated Nacht PAK
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $steam=Join-Path $env:RUNNER_TEMP 'steamcmd'
          New-Item -ItemType Directory -Force -Path $steam | Out-Null
          Invoke-WebRequest 'https://steamcdn-a.akamaihd.net/client/installer/steamcmd.zip' -OutFile "$env:RUNNER_TEMP\steamcmd.zip"
          Expand-Archive "$env:RUNNER_TEMP\steamcmd.zip" -DestinationPath $steam -Force

          & (Join-Path $steam 'steamcmd.exe') +login anonymous +workshop_download_item $env:WORKSHOP_APP_ID $env:WORKSHOP_ITEM_ID validate +quit
          $root=Get-ChildItem $steam,$env:RUNNER_TEMP -Directory -Recurse -ErrorAction SilentlyContinue |
            Where-Object {$_.FullName -like "*steamapps\workshop\content\$env:WORKSHOP_APP_ID\$env:WORKSHOP_ITEM_ID"} |
            Select-Object -First 1
          if(-not $root){throw 'Nacht workshop payload not found'}
          $pak=Join-Path $root.FullName 'WindowsNoEditor.pak'
          if(-not (Test-Path $pak)){throw 'Nacht PAK missing'}
          if((Get-Item $pak).Length -ne 2543506907){throw 'Nacht PAK byte authority mismatch'}

          Invoke-WebRequest 'https://github.com/trumank/repak/releases/download/v0.2.3/repak_cli-x86_64-pc-windows-msvc.zip' -OutFile "$env:RUNNER_TEMP\repak.zip"
          $repakDir="$env:RUNNER_TEMP\repak"
          Expand-Archive "$env:RUNNER_TEMP\repak.zip" -DestinationPath $repakDir -Force
          $repak=Get-ChildItem $repakDir -Filter repak.exe -Recurse | Select-Object -First 1
          if(-not $repak){throw 'repak missing'}

          Remove-Item nacht-source -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path nacht-source | Out-Null
          & $repak.FullName unpack $pak -o nacht-source --force
          if($LASTEXITCODE -ne 0){throw "repak failed $LASTEXITCODE"}

          $contentRoot=Join-Path $PWD 'nacht-source\Pavlov\Content'
          if(-not (Test-Path $contentRoot)){throw 'Pavlov Content root missing'}
          "NACHT_CONTENT_ROOT=$contentRoot" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "XZOGOT_NACHT_AUDIO_SOURCE_GREEN"

      - name: Pin mappings and minimal map census
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Invoke-WebRequest 'https://raw.githubusercontent.com/THW-Reaper/PavlovVRMappings/4976647b4f3a209042460bc55a7a3122662d05b7/PavMappings.usmap' -OutFile PavMappings.usmap
          $hash=(Get-FileHash PavMappings.usmap -Algorithm SHA256).Hash.ToLowerInvariant()
          if($hash -ne '6d19f9731cc3fbaba34ca8e0833e81e4ffdf1b407edf24de48b1ccb5c63b060c'){throw "mappings mismatch $hash"}

          @'
          import json
          from pathlib import Path
          Path("nacht-audio-census.json").write_text(json.dumps({
              "packages":[{"packagePath":"Content/CustomMaps/UGC2755515831/Nacht_de_Untoten.umap","classes":{}}]
          },indent=2)+"\n")
          '@ | python -
          Write-Host "XZOGOT_NACHT_AUDIO_MINIMAL_CENSUS_GREEN"

      - name: Restore proven class census tool
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $old='055f0d0721eb212e3f4713e149d1e2ace5c53674'
          git fetch origin $old --depth=1
          if($LASTEXITCODE -ne 0){throw 'failed to fetch proven census tool commit'}
          git checkout $old -- tools/maps/UEAssetClassCensus
          if($LASTEXITCODE -ne 0){throw 'failed to restore UEAssetClassCensus'}
          Write-Host "XZOGOT_NACHT_AUDIO_CENSUS_TOOL_RESTORED_GREEN source=$old"

      - name: Compile exact audio tools
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach($project in @(
            'tools/maps/UEAssetClassCensus/UEAssetClassCensus.csproj',
            'tools/maps/UEAudioSceneExtract/UEAudioSceneExtract.csproj',
            'tools/maps/UEAudioCueGraphExtract/UEAudioCueGraphExtract.csproj',
            'tools/maps/UEAudioTemplateCatalog/UEAudioTemplateCatalog.csproj'
          )){
            dotnet restore $project
            if($LASTEXITCODE -ne 0){throw "restore failed $project"}
            dotnet build $project -c Release --no-restore
            if($LASTEXITCODE -ne 0){throw "build failed $project"}
          }
          Write-Host "XZOGOT_NACHT_AUDIO_TOOLS_GREEN"

      - name: Catalog cooked AudioComponent templates
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $census='tools/maps/UEAssetClassCensus/bin/Release/net10.0/UEAssetClassCensus.dll'
          dotnet $census $env:NACHT_CONTENT_ROOT nacht-full-class-census.json ue4.21 |
            Tee-Object nacht-full-class-census.log
          if($LASTEXITCODE -ne 0){throw "full class census failed $LASTEXITCODE"}

          $catalog='tools/maps/UEAudioTemplateCatalog/bin/Release/net10.0/UEAudioTemplateCatalog.dll'
          dotnet $catalog $env:NACHT_CONTENT_ROOT PavMappings.usmap nacht-full-class-census.json nacht-audio-template-catalog.json ue4.21 |
            Tee-Object nacht-audio-template-catalog.log
          if($LASTEXITCODE -ne 0){throw "audio template catalog failed $LASTEXITCODE"}

          @'
          import json
          from pathlib import Path
          d=json.loads(Path("nacht-audio-template-catalog.json").read_text())
          print("XZOGOT_NACHT_AUDIO_TEMPLATE_CATALOG_PROOF",{
              "candidatePackages":d["candidatePackageCount"],
              "packagesLoaded":d["packagesLoaded"],
              "audioComponentsSeen":d["audioComponentsSeen"],
              "targetCounts":d["targetCounts"],
              "matches":d["matches"],
          })
          assert d["ready"] is True,d
          '@ | python -

      - name: Extract exact UMAP audio placement
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $app='tools/maps/UEAudioSceneExtract/bin/Release/net10.0/UEAudioSceneExtract.dll'
          dotnet $app $env:NACHT_CONTENT_ROOT PavMappings.usmap nacht-audio-census.json nacht-audio-scene.json ue4.21 |
            Tee-Object nacht-audio-scene.log
          if($LASTEXITCODE -ne 0){throw "audio scene failed $LASTEXITCODE"}

          @'
          import json
          from pathlib import Path
          d=json.loads(Path("nacht-audio-scene.json").read_text())
          assert d["mapPackageCount"]==1,d
          assert d["packagesLoaded"]==1,d
          assert d["audioComponentCount"]==3,d
          assert d["referencedSoundCount"]==3,d
          assert d["nullSoundCount"]==0,d
          assert len(d["packageFailures"])==0,d
          assert len(d["componentFailures"])==0,d
          assert d["ready"] is True,d
          print("XZOGOT_NACHT_AUDIO_PLACEMENT_GREEN",{
              "components":d["audioComponentCount"],
              "referenced":d["referencedSoundCount"],
              "loaded":d["loadedSoundCount"],
              "null":d["nullSoundCount"],
              "types":d["soundTypeCounts"],
              "sounds":[
                  {
                      "actor":row["actorName"],
                      "component":row["componentName"],
                      "sound":row["sound"]["objectPath"],
                      "type":row["sound"]["exportType"],
                  }
                  for row in d["audioComponents"]
              ],
          })
          '@ | python -

      - name: Upload exact audio placement proof
        uses: actions/upload-artifact@v4
        with:
          name: Xogot-Nacht-Audio-Placement-Proof
          path: |
            nacht-audio-scene.json
            nacht-audio-scene.log
            nacht-audio-template-catalog.json
            nacht-audio-template-catalog.log
            nacht-full-class-census.json
            nacht-full-class-census.log
          if-no-files-found: error
          retention-days: 14
