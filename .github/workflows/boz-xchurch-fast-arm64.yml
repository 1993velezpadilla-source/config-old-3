name: XChurch Fast ARM64 Capture

on:
  workflow_dispatch:
  push:
    branches:
      - feature/boz-mod-runtime
    paths:
      - ".github/workflows/boz-xchurch-fast-arm64.yml"

permissions:
  actions: read
  contents: read

jobs:
  capture:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Prepare output and host proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/xchurch-fast
          uname -a | tee /tmp/xchurch-fast/host.txt
          uname -m | tee -a /tmp/xchurch-fast/host.txt

      - name: Download verified XChurch APK
        uses: actions/download-artifact@v4
        with:
          name: XZIEL-BOZ-XChurch-APK
          run-id: 36768068731
          github-token: ${{ github.token }}
          path: /tmp/xchurch-apk-artifact

      - name: Stage APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find /tmp/xchurch-apk-artifact -type f -name '*.apk' | head -n1)"
          test -s "$APK"
          cp "$APK" /tmp/xchurch-fast/xchurch.apk
          shasum -a 256 /tmp/xchurch-fast/xchurch.apk | tee /tmp/xchurch-fast/apk-sha256.txt

      - name: Fast ARM64 boot and screenshots
        uses: reactivecircus/android-emulator-runner@v2
        continue-on-error: true
        with:
          api-level: 30
          target: default
          arch: arm64-v8a
          profile: pixel_6
          emulator-boot-timeout: 600
          disable-animations: false
          emulator-options: -no-window -accel off -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics -camera-back none
          script: |
            OUT=/tmp/xchurch-fast
            set +e
            adb shell getprop ro.product.cpu.abi > "$OUT/device-abi.txt" 2>&1
            adb install -r "$OUT/xchurch.apk" > "$OUT/install.log" 2>&1
            echo "INSTALL_RC=$?" > "$OUT/status.txt"
            cat "$OUT/install.log" >> "$OUT/status.txt"
            adb shell pm list packages | grep -i 'activision\|boz' >> "$OUT/status.txt" 2>&1 || true
            adb shell am force-stop com.activision.boz >/dev/null 2>&1 || true
            adb shell monkey -p com.activision.boz -c android.intent.category.LAUNCHER 1 > "$OUT/launch.log" 2>&1 || true
            sleep 5
            adb exec-out screencap -p > "$OUT/boot_05s.png" || true
            sleep 10
            adb exec-out screencap -p > "$OUT/boot_15s.png" || true
            sleep 15
            adb exec-out screencap -p > "$OUT/boot_30s.png" || true
            adb shell dumpsys activity activities > "$OUT/activity.txt" 2>&1 || true
            adb logcat -d > "$OUT/logcat.txt" 2>&1 || true
            exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: XChurch-Fast-ARM64-Capture
          path: /tmp/xchurch-fast/
          if-no-files-found: warn
          retention-days: 14
