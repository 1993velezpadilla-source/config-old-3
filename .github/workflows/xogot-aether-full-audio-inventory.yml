name: Inventory Aether Full Weapon Audio

on:
  workflow_dispatch:
  push:
    branches:
      - feature/church-expansion-v1
    paths:
      - ".github/workflows/xogot-aether-full-audio-inventory.yml"

permissions:
  contents: read

concurrency:
  group: xogot-aether-full-audio-inventory
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Download Project Aether
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aether-download"
          npx --yes itchio-downloader             --url "https://verrial.itch.io/projectaether"             --downloadDirectory "$RUNNER_TEMP/aether-download"
          FILE=$(find "$RUNNER_TEMP/aether-download" -type f -name '*.zip' -printf '%s\t%p\n' | sort -nr | head -1 | cut -f2-)
          test -s "$FILE"
          echo "PAYLOAD=$FILE" >> "$GITHUB_ENV"

      - name: Prepare legacy Aether pak
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aether-paks"
          7z x -y "$PAYLOAD" 'ProjectAether/Content/Paks/*' -o"$RUNNER_TEMP/aether-paks" >/dev/null
          PAKDIR="$RUNNER_TEMP/aether-paks/ProjectAether/Content/Paks"
          curl -fL --retry 5             https://github.com/trumank/retoc/releases/download/v0.1.5/retoc_cli-x86_64-unknown-linux-gnu.tar.xz             -o "$RUNNER_TEMP/retoc.tar.xz"
          mkdir -p "$RUNNER_TEMP/retoc"
          tar -xJf "$RUNNER_TEMP/retoc.tar.xz" -C "$RUNNER_TEMP/retoc"
          RETOC=$(find "$RUNNER_TEMP/retoc" -type f -name 'retoc*' -perm -111 | head -1)
          curl -fL --retry 5             https://github.com/trumank/repak/releases/download/v0.2.3/repak_cli-x86_64-unknown-linux-gnu.tar.xz             -o "$RUNNER_TEMP/repak.tar.xz"
          mkdir -p "$RUNNER_TEMP/repak"
          tar -xJf "$RUNNER_TEMP/repak.tar.xz" -C "$RUNNER_TEMP/repak"
          REPAK=$(find "$RUNNER_TEMP/repak" -type f -name 'repak*' -perm -111 | head -1)
          test -x "$RETOC" && test -x "$REPAK"
          "$RETOC" to-legacy "$PAKDIR" "$RUNNER_TEMP/aether-legacy.pak"
          test -s "$RUNNER_TEMP/aether-legacy.pak"
          echo "REPAK=$REPAK" >> "$GITHUB_ENV"

      - name: Inventory every Aether weapon source family
        shell: bash
        run: |
          set -euo pipefail
          "$REPAK" list "$RUNNER_TEMP/aether-legacy.pak" > aether-all-files.txt
          python3 - <<'PY'
          from pathlib import Path
          import json
          prefix="ProjectAether/Content/Assets/Weapons/"
          families={}
          examples={}
          for raw in Path("aether-all-files.txt").read_text(errors="ignore").splitlines():
              line=raw.strip().replace("\\","/")
              i=line.find(prefix)
              if i<0: continue
              rel=line[i+len(prefix):]
              parts=[p for p in rel.split("/") if p]
              if not parts: continue
              family=parts[0]
              families[family]=families.get(family,0)+1
              examples.setdefault(family,[])
              if len(examples[family])<30:
                  examples[family].append(rel)
          out={"family_count":len(families),"families":dict(sorted(families.items())),"examples":examples}
          Path("aether-all-weapon-source-families.json").write_text(json.dumps(out,indent=2)+"\n")
          print("XZOGOT_AETHER_ALL_WEAPON_FAMILIES",out["family_count"],out["families"])
          if not families:
              raise SystemExit("No Aether weapon source families found")
          PY

      - name: Extract complete base weapon sound bank
        shell: bash
        run: |
          set -euo pipefail
          rm -rf audio-raw
          mkdir -p audio-raw
          "$REPAK" unpack "$RUNNER_TEMP/aether-legacy.pak"             -o audio-raw             -i 'ProjectAether/Content/Assets/Sounds/Base/**'             --force
          find audio-raw -type f | sort > audio-files.txt
          test -s audio-files.txt
          echo "XZOGOT_AETHER_BASE_AUDIO_FILES $(wc -l < audio-files.txt)"

      - name: Score fire sound candidates for full real arsenal
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re

          roots=list(Path("audio-raw").rglob("*.ubulk"))
          aliases={
            "colt":["1911","colt45","colt"],
            "357":["sw357","357","magnum"],
            "arisaka":["arisaka"],
            "bar":["bar"],
            "browning":["browning","30cal"],
            "doublebarrel":["doublebarrel","double_barrel","dblbarrel"],
            "dp28":["dp28"],
            "fg42":["fg42"],
            "gewehr":["gewehr","g43"],
            "kar98k":["kar98","kar98k"],
            "m1a1":["m1carbine","m1a1"],
            "m1":["m1garand","garand"],
            "mg42":["mg42"],
            "mosin":["mosin"],
            "mp40":["mp40"],
            "nambu":["nambu"],
            "ppsh":["ppsh"],
            "ptrs":["ptrs"],
            "sawnoff":["sawedoff","sawnoff"],
            "springfield":["springfield"],
            "stg":["stg44","mp44"],
            "svt40":["svt40"],
            "thompson":["thompson"],
            "trench":["trench","shtgun"],
            "tt33":["tt33","tt30"],
            "type100":["type100"],
            "type99":["type99"],
            "walther":["walther","p38"],
          }
          def score(name,tokens):
              n=name.lower()
              s=0
              for token in tokens:
                  if token in n: s=max(s,100+len(token))
              if s==0: return 0
              if "fire" in n: s+=45
              if re.search(r"(?:^|_)st_f(?:_|$)",n): s+=55
              elif re.search(r"(?:^|_)f(?:_|$)",n): s+=20
              if "ln100" in n: s+=8
              if "tail" in n or "dist" in n or "distant" in n: s-=35
              if "reload" in n or "act" in n or "mech" in n: s-=50
              return s
          report={}
          for wid,tokens in aliases.items():
              rows=[]
              for p in roots:
                  stem=p.stem
                  val=score(stem,tokens)
                  if val>0:
                      rows.append({"score":val,"stem":stem,"path":p.as_posix(),"bytes":p.stat().st_size})
              rows.sort(key=lambda r:(-r["score"],r["stem"].lower()))
              report[wid]={"aliases":tokens,"candidates":rows[:20]}
              print("XZOGOT_AUDIO_CANDIDATES",wid,[(r["score"],r["stem"]) for r in rows[:6]])
          Path("aether-full-weapon-audio-candidates.json").write_text(json.dumps(report,indent=2)+"\n")
          matched=sum(bool(v["candidates"]) for v in report.values())
          print("XZOGOT_AUDIO_MATCHED_WEAPONS",matched,"/",len(report))
          if matched < 20:
              raise SystemExit(f"Audio candidate coverage too low: {matched}/{len(report)}")
          PY

      - name: Upload full audio inventory
        uses: actions/upload-artifact@v4
        with:
          name: aether-full-weapon-audio-inventory
          path: |
            aether-full-weapon-audio-candidates.json
            aether-all-weapon-source-families.json
            audio-files.txt
          if-no-files-found: error
          retention-days: 14
