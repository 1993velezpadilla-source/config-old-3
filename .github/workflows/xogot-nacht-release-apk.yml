name: Xogot Nacht Release APK Gauntlet

on:
  push:
    branches:
      - feature/godot-aaa-rebuild-v1
    paths:
      - ".github/workflows/xogot-nacht-release-apk.yml"
      - ".github/workflows/xogot-stage-nacht-full-map.yml"
      - "tools/maps/compile_nacht_interactive_placements.py"
      - "xogot/scripts/nacht_full_map.gd"
      - "xogot/scripts/source_navigation_runtime.gd"
      - "xogot/scripts/interactable.gd"
      - "xogot/ci/nacht_full_map_probe.gd"
  workflow_dispatch:
    inputs:
      source_run:
        description: "Exact successful Stage Nacht Chronicles Full Map run id"
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: xogot-nacht-release-apk-gauntlet
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/godot-aaa-rebuild-v1
          fetch-depth: 3

      - name: Resolve exact GREEN Nacht stage
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${{ inputs.source_run || '' }}" ]]; then
            SOURCE_RUN="${{ inputs.source_run }}"
          else
            GAMEPLAY_SHA="$(git rev-parse HEAD)"
            echo "XZOGOT_RELEASE_WAITING_FOR_STAGE gameplay_sha=$GAMEPLAY_SHA"
            SOURCE_RUN=""
            for attempt in $(seq 1 80); do
              SOURCE_RUN="$(gh api                 -H "Accept: application/vnd.github+json"                 "/repos/${GITHUB_REPOSITORY}/actions/workflows/xogot-stage-nacht-full-map.yml/runs?branch=feature%2Fgodot-aaa-rebuild-v1&event=push&per_page=30"                 --jq "[.workflow_runs[] | select(.head_sha == \"$GAMEPLAY_SHA\" and .status == \"completed\" and .conclusion == \"success\")][0].id // empty"                 || true)"
              if [[ -n "$SOURCE_RUN" ]]; then
                break
              fi
              FAILED_RUN="$(gh api                 -H "Accept: application/vnd.github+json"                 "/repos/${GITHUB_REPOSITORY}/actions/workflows/xogot-stage-nacht-full-map.yml/runs?branch=feature%2Fgodot-aaa-rebuild-v1&event=push&per_page=30"                 --jq "[.workflow_runs[] | select(.head_sha == \"$GAMEPLAY_SHA\" and .status == \"completed\" and .conclusion != \"success\")][0].id // empty"                 || true)"
              if [[ -n "$FAILED_RUN" ]]; then
                echo "XZOGOT_RELEASE_BLOCKED_STAGE_RED run=$FAILED_RUN"
                exit 31
              fi
              sleep 20
            done
            if [[ -z "$SOURCE_RUN" ]]; then
              echo "XZOGOT_RELEASE_STAGE_TIMEOUT gameplay_sha=$GAMEPLAY_SHA"
              exit 32
            fi
          fi

          STATUS="$(gh api             -H "Accept: application/vnd.github+json"             "/repos/${GITHUB_REPOSITORY}/actions/runs/$SOURCE_RUN"             --jq '.status + ":" + (.conclusion // "")')"
          [[ "$STATUS" == "completed:success" ]] || {
            echo "XZOGOT_RELEASE_SOURCE_NOT_GREEN run=$SOURCE_RUN status=$STATUS"
            exit 33
          }
          echo "SOURCE_RUN=$SOURCE_RUN" >> "$GITHUB_ENV"
          echo "XZOGOT_RELEASE_STAGE_GREEN run=$SOURCE_RUN"

      - name: Download exact staged Nacht runtime
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/nacht-stage-artifact"
          mkdir -p "$RUNNER_TEMP/nacht-stage-artifact"
          gh run download "$SOURCE_RUN"             -n Xogot-Nacht-Chronicles-Godot-Runtime             -D "$RUNNER_TEMP/nacht-stage-artifact"
          manifest="$(find "$RUNNER_TEMP/nacht-stage-artifact" -type f -name source_manifest.json -print -quit)"
          test -n "$manifest"
          runtime_root="$(dirname "$manifest")"
          test -s "$runtime_root/nacht-full-map-handoff.json"
          test -s "$runtime_root/nacht-static-scene.json"
          test -d "$runtime_root/vfs"
          rm -rf xogot/assets/benchmarks/nacht_chronicles
          mkdir -p xogot/assets/benchmarks
          cp -a "$runtime_root" xogot/assets/benchmarks/nacht_chronicles
          echo "NACHT_RUNTIME_ROOT=$runtime_root" >> "$GITHUB_ENV"
          echo "XZOGOT_RELEASE_RUNTIME_MOUNT_GREEN root=$runtime_root"

      - name: Force shipping entry scene to Nacht
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path("xogot/project.godot")
          s=p.read_text()
          old='run/main_scene="res://main.tscn"'
          new='run/main_scene="res://nacht_full_map.tscn"'
          if old not in s and new not in s:
              raise SystemExit("main scene anchor missing")
          p.write_text(s.replace(old,new))
          print("XZOGOT_RELEASE_MAIN_SCENE_GREEN res://nacht_full_map.tscn")
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.1"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Install Godot 4.6.1 and export templates
        shell: bash
        run: |
          set -euo pipefail
          GODOT_VER="4.6.1-stable"
          curl -L --fail --retry 5 --retry-all-errors --retry-delay 2             "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VER}/Godot_v${GODOT_VER}_linux.x86_64.zip"             -o /tmp/godot.zip
          curl -L --fail --retry 5 --retry-all-errors --retry-delay 2             "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VER}/Godot_v${GODOT_VER}_export_templates.tpz"             -o /tmp/godot-templates.tpz
          rm -rf /tmp/godot /tmp/godot-templates
          mkdir -p /tmp/godot /tmp/godot-templates
          unzip -q /tmp/godot.zip -d /tmp/godot
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
          chmod +x /tmp/godot/Godot_v4.6.1-stable_linux.x86_64
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.6.1.stable"
          mkdir -p "$TEMPLATE_DIR"
          cp -a /tmp/godot-templates/templates/. "$TEMPLATE_DIR/"
          test -s "$TEMPLATE_DIR/android_debug.apk"
          printf '%s\n' "4.6.1.stable" > "$TEMPLATE_DIR/version.txt"
          echo "XZOGOT_RELEASE_GODOT_TEMPLATES_GREEN"

      - name: Create Android debug keystore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/xogot-keystore"
          KEYSTORE="$RUNNER_TEMP/xogot-keystore/debug.keystore"
          keytool -genkeypair -v             -keystore "$KEYSTORE"             -storepass android             -alias androiddebugkey             -keypass android             -keyalg RSA             -keysize 2048             -validity 10000             -dname "CN=Android Debug,O=XZIEL,C=US"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Re-probe exact shipping runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/nacht-release
          timeout 900 /tmp/godot/Godot_v4.6.1-stable_linux.x86_64             --headless --editor --path xogot --quit             2>&1 | tee build/nacht-release/import.log
          ! grep -E "SCRIPT ERROR|Parse Error|ERROR: Failed to load script|MAX_MESH_SURFACES" build/nacht-release/import.log

          timeout 900 /tmp/godot/Godot_v4.6.1-stable_linux.x86_64             --headless --path xogot             --script res://ci/nacht_full_map_probe.gd             2>&1 | tee build/nacht-release/probe.log
          grep -q "XZOGOT_NACHT_GAMEPLAY_PROBE_GREEN" build/nacht-release/probe.log
          grep -q "XZOGOT_NACHT_FULL_MAP_PROBE_GREEN" build/nacht-release/probe.log

          # The shared player/weapon layer carries the source-authored ADS,
          # perks and Pack-a-Punch behavior used by the Nacht shipping scene.
          # Prove those behaviors directly instead of grepping for a marker
          # that the full-map probe does not emit.
          timeout 180 /tmp/godot/Godot_v4.6.1-stable_linux.x86_64 \
            --headless --path xogot \
            --script res://ci/mobile_survival_probe.gd \
            2>&1 | tee build/nacht-release/mobile-source.log
          grep -q "XZOGOT_28_SOURCE_ADS_PROFILES_GREEN" build/nacht-release/mobile-source.log
          grep -q "XZOGOT_SOURCE_PERK_CONSTANTS_GREEN" build/nacht-release/mobile-source.log
          grep -q "XZOGOT_SOURCE_PERK_RUNTIME_GREEN" build/nacht-release/mobile-source.log
          grep -q "XZOGOT_PACK_SOURCE_TABLE_GREEN" build/nacht-release/mobile-source.log
          grep -q "XZOGOT_TT33_PAP_BURST_SOURCE_GREEN" build/nacht-release/mobile-source.log
          grep -q "XZOGOT_WALTHER_PAP_AUTO_SOURCE_GREEN" build/nacht-release/mobile-source.log
          grep -q "XZOGOT_PAP_SELECTFIRE_SOURCE_GREEN" build/nacht-release/mobile-source.log
          grep -q "XZOGOT_MOBILE_COMBAT_GATE_GREEN" build/nacht-release/mobile-source.log || \
            grep -q "XZOGOT_MOBILE_SURVIVAL_PROBE_GREEN" build/nacht-release/mobile-source.log
          echo "XZOGOT_RELEASE_SOURCE_COMBAT_GREEN"
          echo "XZOGOT_RELEASE_GAMEPLAY_GREEN"

      - name: Export Android ARM64 Nacht APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/android dist
          timeout 1800 /tmp/godot/Godot_v4.6.1-stable_linux.x86_64             --headless --path xogot             --export-debug "Android ARM64"             "$PWD/dist/you-wont-win-nacht-arm64.apk"             2>&1 | tee build/nacht-release/export.log
          test -s dist/you-wont-win-nacht-arm64.apk
          ! grep -E "SCRIPT ERROR|Parse Error|Export failed|ERROR: Failed to load script" build/nacht-release/export.log
          echo "XZOGOT_RELEASE_APK_EXPORT_GREEN bytes=$(stat -c%s dist/you-wont-win-nacht-arm64.apk)"

      - name: Validate APK contents and identity
        shell: bash
        run: |
          set -euo pipefail
          APK=dist/you-wont-win-nacht-arm64.apk
          unzip -l "$APK" > build/nacht-release/apk-files.txt
          grep -q 'lib/arm64-v8a/' build/nacht-release/apk-files.txt
          if grep -q 'lib/x86_64/' build/nacht-release/apk-files.txt; then
            echo "XZOGOT_RELEASE_APK_UNEXPECTED_X86_64"
            exit 41
          fi
          AAPT="$ANDROID_HOME/build-tools/35.0.1/aapt"
          "$AAPT" dump badging "$APK" > build/nacht-release/apk-badging.txt
          grep -q "package: name='com.xziel.youwontwin'" build/nacht-release/apk-badging.txt
          grep -q "application-label:'YOU WON'T WIN'" build/nacht-release/apk-badging.txt
          printf 'source_stage_run=%s\nbranch=%s\ncommit=%s\n'             "$SOURCE_RUN" "${GITHUB_REF_NAME}" "${GITHUB_SHA}"             > build/nacht-release/release-manifest.txt
          echo "XZOGOT_RELEASE_APK_CONTENT_GREEN arm64=1 package=com.xziel.youwontwin"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Xogot-Nacht-Android-Release-Gauntlet
          path: |
            dist/you-wont-win-nacht-arm64.apk
            build/nacht-release/import.log
            build/nacht-release/probe.log
            build/nacht-release/mobile-source.log
            build/nacht-release/export.log
            build/nacht-release/apk-files.txt
            build/nacht-release/apk-badging.txt
            build/nacht-release/release-manifest.txt
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
