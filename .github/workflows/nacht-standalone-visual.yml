      - name: Derive four native camera probes from Nacht spawn
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          d=json.loads(
              Path("assets/nacht_reference/pavlov_scene_reference/spawns.json")
              .read_text(encoding="utf-8")
          )
          spawn=next(
              row for row in d["spawns"]
              if row["id"] == "player_spawn_pavlov_spawn_1"
          )
          p=spawn["transform"]["position"]

          # Spawn transform is the gameplay actor root/capsule reference.
          # Raise only the diagnostic camera, not the world transform.
          eye=[float(p["x"]), float(p["y"]), float(p["z"]) + 0.60]

          out={
              "source": spawn["id"],
              "rootMeters": [p["x"],p["y"],p["z"]],
              "eyeMeters": eye,
              "eyeOffsetMeters": [0.0,0.0,0.60],
              "up": [0.0,0.0,1.0],
              "fovY": 75,
              "directions": {
                  "east": [1.0,0.0,0.0],
                  "west": [-1.0,0.0,0.0],
                  "north": [0.0,1.0,0.0],
                  "south": [0.0,-1.0,0.0],
              },
          }
          Path("dist/nacht-camera-probes.json").write_text(
              json.dumps(out,indent=2)+"\n",
              encoding="utf-8"
          )
          print("XZIEL_NACHT_CAMERA_PROBES",out)
          PY

      - name: Install Android emulator
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "emulator" \
            "system-images;android-35;google_apis;x86_64"

      - name: Boot Nacht on pure XZIEL and capture four directions
        shell: bash
        env:
          ANDROID_AVD_HOME: ${{ runner.temp }}/xziel-nacht-avd
        run: |
          set -euxo pipefail
          mkdir -p "$ANDROID_AVD_HOME" dist

          ADB="${ANDROID_HOME}/platform-tools/adb"
          EMULATOR="${ANDROID_HOME}/emulator/emulator"
          AVDMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name avdmanager | sort | tail -n 1)"

          printf 'no\n' | "$AVDMANAGER" create avd \
            --force \
            --name xziel-nacht-ci \
            --package "system-images;android-35;google_apis;x86_64" \
            --device "pixel_6"

          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm || true
          fi

          nohup "$EMULATOR" \
            @xziel-nacht-ci \
            -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect -memory 6144 \
            > dist/emulator-stdout.txt 2>&1 &

          timeout 180 "$ADB" wait-for-device
          for _ in $(seq 1 90); do
            if [[ "$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]]; then
              break
            fi
            sleep 2
          done
          test "$("$ADB" shell getprop sys.boot_completed | tr -d '\r')" = "1"

          "$ADB" install -r dist/XZIEL-Nacht-Standalone-debug.apk
          "$ADB" push dist/xziel-nacht-vfs.tar /data/local/tmp/xziel-nacht-vfs.tar
          "$ADB" shell run-as com.xziel.engine mkdir -p files
          "$ADB" shell run-as com.xziel.engine mkdir -p files/xziel-runtime
          "$ADB" shell run-as com.xziel.engine sh -c \
            "'cd files && tar -xf /data/local/tmp/xziel-nacht-vfs.tar'"

          "$ADB" shell run-as com.xziel.engine test -s \
            files/xziel/maps/xziel_nacht_bo3/scene.xzsc
          "$ADB" shell run-as com.xziel.engine test -s \
            files/xziel/maps/xziel_nacht_bo3/lightmaps.xzlt

          "$ADB" shell settings put secure immersive_mode_confirmations confirmed || true

          EYE="$(python3 -c 'import json;d=json.load(open("dist/nacht-camera-probes.json"));print(",".join(map(str,d["eyeMeters"])))')"
          UP="0,0,1"

          capture_direction () {
            local label="$1"
            local forward="$2"
            local ready=0

            "$ADB" logcat -c
            "$ADB" shell am force-stop com.xziel.engine || true
            "$ADB" shell am start -W \
              -n com.xziel.engine/org.libsdl.app.XzielActivity \
              --es xziel_map xziel_nacht_bo3 \
              --es xziel_camera_eye "$EYE" \
              --es xziel_camera_forward "$forward" \
              --es xziel_camera_up "$UP" \
              --es xziel_camera_fov_y 75 \
              > "dist/am-start-$label.txt" 2>&1

            for _ in $(seq 1 180); do
              "$ADB" logcat -d -v threadtime > "dist/xziel-logcat-$label.txt" || true
              if grep -Eq \
                "static_scene status=READY map='xziel_nacht_bo3'.*meshes=492 instances=10791.*gpuReady=1" \
                "dist/xziel-logcat-$label.txt" \
                && grep -q \
                "standalone_static_present ready=1 map='xziel_nacht_bo3'" \
                "dist/xziel-logcat-$label.txt"; then
                ready=1
                break
              fi
              sleep 2
            done

            if [[ "$ready" != "1" ]]; then
              grep -E \
                "XZIEL-XZ.*static_scene|standalone_static_present|uploadFail|fatal|FATAL|SIG" \
                "dist/xziel-logcat-$label.txt" | tail -n 500 || true
              return 1
            fi

            sleep 3
            "$ADB" exec-out screencap -p > "dist/nacht-$label.png"
          }

          capture_direction east "1,0,0"
          capture_direction west "-1,0,0"
          capture_direction north "0,1,0"
          capture_direction south "0,-1,0"

          python3 -m pip install --quiet pillow==11.3.0
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageStat
          for p in sorted(Path("dist").glob("nacht-*.png")):
              im=Image.open(p).convert("RGB")
              if im.height > im.width:
                  im=im.transpose(Image.Transpose.ROTATE_90)
                  im.save(p)
              gray=im.convert("L")
              stat=ImageStat.Stat(gray)
              lo,hi=gray.getextrema()
              if im.width < 1000 or im.height < 500:
                  raise SystemExit(f"{p}: bad dimensions {im.size}")
              if hi-lo < 20 or stat.stddev[0] < 6:
                  raise SystemExit(
                      f"{p}: flat capture extrema={(lo,hi)} std={stat.stddev[0]:.2f}"
                  )
              print(
                  "XZIEL_NACHT_CAPTURE_GREEN",
                  p.name, im.size,
                  "mean", round(stat.mean[0],2),
                  "std", round(stat.stddev[0],2),
                  "extrema", (lo,hi),
              )
          PY

          if grep -Eiq \
            'NZPActivity|ndu\.bsp|nzp-data\.zip|gl4es|quakec|vril' \
            dist/xziel-logcat-*.txt; then
            echo "LEGACY_RUNTIME_CONTAMINATION"
            exit 92
          fi

          echo "XZIEL_NACHT_STANDALONE_VISUAL_GREEN"

      - name: Upload Nacht standalone visual proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XZIEL-Nacht-Standalone-Visual-Proof
          path: |
            dist/nacht-east.png
            dist/nacht-west.png
            dist/nacht-north.png
            dist/nacht-south.png
            dist/nacht-camera-probes.json
            dist/xziel-logcat-*.txt
            dist/am-start-*.txt
            dist/emulator-stdout.txt
            build/nacht-static-scene/xziel.xzscene.report.json
            build/nacht-static-scene/xziel.xzmat.report.json
            build/nacht-static-scene/xziel.xzpb.report.json
            build/nacht-static-scene/xziel.xzmn.report.json
            build/nacht-static-scene/xziel.xzen.report.json
            build/nacht-static-scene/xziel.xzfg.report.json
            build/nacht-static-scene/xziel.xzlt.report.json
          if-no-files-found: warn
          retention-days: 14
