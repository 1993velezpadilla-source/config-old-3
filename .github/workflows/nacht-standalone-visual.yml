            "$MAPROOT/lightmaps.xzlt"
          cp build/nacht-static-scene/lightmap-bindings.xzlb \
            "$MAPROOT/lightmap-bindings.xzlb"

          # Preserve the four remaining source material exports so the exact
          # parent/constants can be audited instead of guessed from names.
          DIAG="build/nacht-static-scene/material-audit/source-materials"
          mkdir -p "$DIAG"

          # Preserve the complete resolver manifest before the strict 1063/1063
          # gate so a failed run still contains every candidate/binding needed
          # for deterministic diagnosis.
          cp \
            "$RUNNER_TEMP/scene-glb/xziel-texture-manifest.json" \
            "build/nacht-static-scene/material-audit/xziel-texture-manifest.json"

          for name in \
            Atlas_39246_Mat \
            p7_fxanim_gp_tarp_drape_beige_02_s1_smod_Mat \
            mtl_p7_fxanim_zm_factory_flag_iron_cross \
            t7_water_cp_bio_muddy_waterfall; do
            found=$(find "$RUNNER_TEMP/scene-glb" -type f \
              -name "$name.json" -print -quit)
            if [[ -n "$found" ]]; then
              cp "$found" "$DIAG/$name.json"
              echo "XZIEL_MATERIAL_DIAG_SAVED $name $found"
            else
              echo "XZIEL_MATERIAL_DIAG_MISSING $name"
            fi
          done

          python3 tools/maps/compile_nacht_xzmesh_bundle.py \
            --glb-root "$RUNNER_TEMP/scene-glb" \
            --output-root "$MAPROOT/meshes" \
            --manifest build/nacht-static-scene/xziel.xzmesh.bundle.json \
            | tee build/nacht-static-scene/xzmesh-compile.log

          python3 tools/maps/compile_nacht_xzscene.py \
