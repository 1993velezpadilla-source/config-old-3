name: Black Pines Sanatorium Original Playable And Blender Art Gate
on:
  workflow_dispatch:
  push:
    branches:
      - feature/black-pines-sanatorium-playable-v1
    paths:
      - "xogot/data/black_pines_layout.json"
      - "xogot/black_pines.tscn"
      - "xogot/scripts/black_pines_*.gd"
      - "xogot/scripts/round_manager.gd"
      - "xogot/ci/black_pines_*.gd"
      - "xogot/ci/black_pines_*.py"
      - "xogot/tools/black_pines_author.py"
      - "xogot/tools/black_pines_forge_*.py"
      - ".github/workflows/black-pines-original-playable-blender-gate.yml"
permissions:
  contents: read
# Preserve free GitHub Actions minutes: future rapid Forge fidelity commits
# supersede stale map-render gauntlets on the SAME branch only.
concurrency:
  group: black-pines-forge-${{ github.ref }}
  cancel-in-progress: true
jobs:
  godot-gameplay-compile-and-scene:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v5
      - name: Install free Godot 4.6.1 and Mesa OpenGL
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libegl1 libx11-6 libxcursor1 libxrandr2 libxi6
          curl -fL --retry 5 --retry-all-errors --retry-delay 3 \
            https://github.com/godotengine/godot-builds/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip \
            -o /tmp/black-pines-godot.zip
          unzip -q /tmp/black-pines-godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.6.1-stable_linux.x86_64
          /tmp/Godot_v4.6.1-stable_linux.x86_64 --version
      - name: Original map JSON invariants; protect existing church scene
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/black-pines/godot
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("xogot/data/black_pines_layout.json").read_text())
          assert len(d["cells"])==9 and len(d["portals"])==12 and len(d["windows"])==12
          assert len(d["perks"])==6 and len(d["mysterySpots"])==4
          assert not d["technicalGates"]["originalChurchFilesMayChange"]
          assert not d["technicalGates"]["gobblegumEnabled"]
          print("BLACK_PINES_AUTHORED_NINE_ZONES_TWELVE_DOORS_TWELVE_WINDOWS_GREEN")
          PY
          # GitHub checkout@v5 is shallow; checking HEAD^ or git show HEAD
          # silently treats the shallow boundary as a root commit. Pin exact
          # Godot source blobs to the verified unchanged feature base instead.
          test "$(git hash-object xogot/main.tscn)" = "3960a7a8cfa56133da57b0bbb9740b3b76695e7a"
          test "$(git hash-object xogot/nacht_full_map.tscn)" = "e4a3db47aa959d1fdf14ab58845e71b4b4bf0285"
          test "$(git hash-object xogot/scripts/you_wont_win.gd)" = "4d7c6a266ce97d4d325c7241a2836a5c3d28bf85"
          test "$(git hash-object xogot/scripts/nacht_full_map.gd)" = "67f5e1d4fa6855dc895c82ed53287ec8227ccf26"
          printf 'BLACK_PINES_MAIN_CHURCH_AND_NACHT_SOURCE_BLOBS_UNTOUCHED_GREEN\n' | tee build/black-pines/godot/original-map-immutable.log
      - name: Godot import project and parse ALL original Black Pines scripts
        shell: bash
        run: |
          set -euo pipefail
          timeout 520 /tmp/Godot_v4.6.1-stable_linux.x86_64 --headless --editor --path xogot --quit \
            2>&1 | tee build/black-pines/godot/import.log
          ! grep -E 'SCRIPT ERROR|Parse Error' build/black-pines/godot/import.log
      - name: Run black Pines playable interactions (real authored scene, WaW internal test assets)
        shell: bash
        run: |
          set -euo pipefail
          timeout 200 /tmp/Godot_v4.6.1-stable_linux.x86_64 --headless --path xogot \
            --script res://ci/black_pines_phase1_gameplay_probe.gd \
            2>&1 | tee build/black-pines/godot/gameplay.log
          grep -q BLACK_PINES_PHASE1_GAMEPLAY_GREEN build/black-pines/godot/gameplay.log
          ! grep -E 'SCRIPT ERROR|Parse Error|BLACK_PINES_PHASE1_RED' build/black-pines/godot/gameplay.log
      - name: Probe REAL physics for all 12 paid doors and all 12 barricades
        shell: bash
        run: |
          set -euo pipefail
          timeout 150 /tmp/Godot_v4.6.1-stable_linux.x86_64 --headless --path xogot \
            --script res://ci/black_pines_spatial_physics_probe.gd \
            2>&1 | tee build/black-pines/godot/spatial-physics.log
          grep -q BLACK_PINES_SPATIAL_PHYSICS_GREEN build/black-pines/godot/spatial-physics.log
          ! grep -E 'SCRIPT ERROR|Parse Error|BLACK_PINES_SPATIAL_RED' \
            build/black-pines/godot/spatial-physics.log
      - name: Gate native door skins, variation and no ghost after purchase
        shell: bash
        run: |
          set -euo pipefail
          timeout 140 /tmp/Godot_v4.6.1-stable_linux.x86_64 --headless --path xogot \
            --script res://ci/black_pines_door_fidelity_probe.gd \
            2>&1 | tee build/black-pines/godot/door-fidelity.log
          grep -q BLACK_PINES_12_DOOR_FIDELITY_GREEN \
            build/black-pines/godot/door-fidelity.log
          ! grep -E 'SCRIPT ERROR|Parse Error|BLACK_PINES_DOOR_FIDELITY_RED' \
            build/black-pines/godot/door-fidelity.log
      - name: Gate 9-zone locked-door routing and real window-crossing zombies
        shell: bash
        run: |
          set -euo pipefail
          timeout 175 /tmp/Godot_v4.6.1-stable_linux.x86_64 --headless --path xogot \
            --script res://ci/black_pines_routing_probe.gd \
            2>&1 | tee build/black-pines/godot/routing-and-zombie-crossings.log
          grep -q BLACK_PINES_ROUTING_81_PAIRS_GREEN \
            build/black-pines/godot/routing-and-zombie-crossings.log
          grep -q BLACK_PINES_ALL_12_ZOMBIE_TRAVERSAL_GREEN \
            build/black-pines/godot/routing-and-zombie-crossings.log
          ! grep -E 'SCRIPT ERROR|Parse Error|BLACK_PINES_ROUTING_RED' \
            build/black-pines/godot/routing-and-zombie-crossings.log
      - name: Capture REAL Godot source-map overview image
        shell: bash
        run: |
          set -euo pipefail
          timeout 120 xvfb-run -a -s '-screen 0 1360x900x24' \
            /tmp/Godot_v4.6.1-stable_linux.x86_64 --path xogot \
            --rendering-method gl_compatibility --resolution 1360x900 \
            --script res://ci/black_pines_visual_probe.gd \
            2>&1 | tee build/black-pines/godot/visual.log
          grep -q BLACK_PINES_REAL_GODOT_1360x900_OVERVIEW_GREEN build/black-pines/godot/visual.log
          cp xogot/black-pines-real-firstframe-overview.png build/black-pines/godot/black-pines-real-firstframe-overview.png
          grep -q BLACK_PINES_REAL_GODOT_FIRSTPERSON_HUD_SCREENSHOT_GREEN build/black-pines/godot/visual.log
          cp xogot/black-pines-real-firstperson-mobile-hud.png build/black-pines/godot/black-pines-real-firstperson-mobile-hud.png
          grep -q BLACK_PINES_NINE_ROOM_FIDELITY_CAPTURE_GREEN build/black-pines/godot/visual.log
          cp xogot/black-pines-fidelity-*.png build/black-pines/godot/
          test "$(find build/black-pines/godot -maxdepth 1 -name 'black-pines-fidelity-*.png' | wc -l)" -eq 9
          file build/black-pines/godot/black-pines-real-firstframe-overview.png
          file build/black-pines/godot/black-pines-real-firstperson-mobile-hud.png
      - name: Preserve actual gameplay and screenshot proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Black-Pines-Phase1-Real-Godot-Gameplay-Screenshot-Proof
          path: build/black-pines/godot/
          retention-days: 14
          if-no-files-found: warn

  blender-original-level-author:
    runs-on: ubuntu-latest
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v5
      - name: Install original Blender editor free (zero generative API usage)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender xvfb python3-numpy libgl1-mesa-dri libegl1
          python3 -c 'import numpy; print("Blender glTF source numpy version", numpy.__version__)'
          blender --version | head -2
      - name: Build 9-zone original sanatorium mesh from same Godot source layout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/black-pines/blender xogot/assets/black_pines
          timeout 1100 xvfb-run -a -s '-screen 0 1280x800x24' \
            env PYTHONPATH=/usr/lib/python3/dist-packages blender -b --python xogot/tools/black_pines_author.py -- \
              --layout xogot/data/black_pines_layout.json \
              --out xogot/assets/black_pines/black_pines_architecture.glb \
              --preview build/black-pines/blender/black-pines-blender-artpass.png \
              --report build/black-pines/blender/source-original-art-report.json \
            2>&1 | tee build/black-pines/blender/blender.log
          grep -q BLACK_PINES_BLENDER_ORIGINAL_ARCHITECTURE_GREEN build/black-pines/blender/blender.log
          cp xogot/assets/black_pines/black_pines_architecture.glb \
            build/black-pines/blender/black-pines-original-architecture.glb
          cp xogot/assets/black_pines/black_pines_architecture.blend \
            build/black-pines/blender/black-pines-original-editable-source.blend
          python3 - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path("build/black-pines/blender/source-original-art-report.json").read_text())
          assert j["floor"]==9
          assert j["allOriginalAuthoring"]
          assert j["sameManifestAsGodot"]
          assert not j["commercialRippedAssets"]
          assert not j["publicReadiness"]
          f=j["fidelity"]
          assert f["pass"],f["issues"]
          assert f["roomLandmarkCount"]==9
          assert f["doorFrameCount"]==12
          surface=j["forge"]["surfacePass"]
          assert surface["batchedRoomFloorCount"]==9
          assert surface["facadeBranding"] is True
          assert surface["mobileBatchedFloorTiles"] is True
          assert all(v>=70 for v in surface["perRoomTileFaces"].values())
          pbr=j["forge"]["pbrSourceWear"]
          assert pbr["textureCount"]==7
          assert pbr["allEmbedded"]
          assert pbr["maxTextureSize"]<=512
          assert not pbr["paidAPI"] and not pbr["copyrightedExternalTextures"]
          hero=j["forge"]["originalHospitalKit"]
          assert len(hero["roomHeroes"])==9
          assert all(n>=4 for n in hero["roomHeroComponents"].values())
          assert hero["originalGeometry"] and hero["cosmeticOnlyUntilCollisionGate"]
          print("BLACK_PINES_NINE_ORIGINAL_HOSPITAL_HEROES_GREEN",
                hero["roomHeroes"])
          mobile=j["mobileExport"]
          assert mobile["originalMeshObjects"]==j["fidelity"]["meshObjects"]
          assert mobile["mobileExportMeshObjects"]<=165
          assert mobile["reductionFraction"]>=0.55
          assert mobile["nineHeroMeshesPreserved"] and mobile["nineFloorMeshesPreserved"]
          assert mobile["sourceBlendEditableUntouched"]
          print("BLACK_PINES_MOBILE_DRAW_BATCH_CI_GREEN",mobile)
          assert f["meshObjects"]<=f["meshObjectBudget"]
          assert f["triangles"]<=f["triangleBudget"]
          assert f["triangles"]>=5000
          assert not f["humanReferenceVisualMatchProven"]
          print("BLACK_PINES_FORGE_FIDELITY_REPORT_GREEN",
                "roomLandmarks=",f["roomLandmarkCount"],
                "meshes=",f["meshObjects"],"tris=",f["triangles"])
          assert Path(j["glb"]).stat().st_size>=10000
          assert Path(j["editableBlenderSource"]).stat().st_size>=10000
          assert Path("build/black-pines/blender/black-pines-blender-artpass.png").stat().st_size>=10000
          print("BLACK_PINES_BLENDER_ZERO_API_FIRST_ASSET_SOURCE_GREEN",j["objects"])
          PY
      - name: Package installable zero-budget Blender Forge GUI add-on
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/black-pines/blender/addon-staging/black_pines_forge
          cp xogot/tools/black_pines_forge_gui.py \
            build/black-pines/blender/addon-staging/black_pines_forge/__init__.py
          cp xogot/tools/black_pines_author.py \
             xogot/tools/black_pines_forge_detail.py \
             xogot/tools/black_pines_forge_surface.py \
             xogot/tools/black_pines_forge_materials.py \
             xogot/tools/black_pines_forge_hospital_kit.py \
             xogot/tools/black_pines_forge_mobile_export.py \
             build/black-pines/blender/addon-staging/black_pines_forge/
          (cd build/black-pines/blender/addon-staging && \
            zip -qr ../Black-Pines-Forge-GUI-install-in-Blender.zip black_pines_forge)
          unzip -l build/black-pines/blender/Black-Pines-Forge-GUI-install-in-Blender.zip \
            | grep -q 'black_pines_forge/__init__.py'
          test -s build/black-pines/blender/Black-Pines-Forge-GUI-install-in-Blender.zip
          echo BLACK_PINES_INSTALLABLE_FORGE_GUI_ZIP_GREEN
      - name: Test actual Blender Forge GUI buttons and export
        shell: bash
        run: |
          set -euo pipefail
          timeout 460 xvfb-run -a -s '-screen 0 1280x800x24' \
            env PYTHONPATH=/usr/lib/python3/dist-packages blender -b \
            --python xogot/tools/black_pines_forge_gui_smoke.py \
            2>&1 | tee build/black-pines/blender/forge-gui-smoke.log
          grep -q BLACK_PINES_FORGE_GUI_REAL_OPERATOR_GREEN \
            build/black-pines/blender/forge-gui-smoke.log
          grep -q BLACK_PINES_MOBILE_DRAW_BATCH_GREEN \
            build/black-pines/blender/forge-gui-smoke.log
          ! grep -E 'Traceback|BLACK_PINES_FORGE_RED|BLACK_PINES_FIDELITY_RED|BLACK_PINES_GLTF_RED' \
            build/black-pines/blender/forge-gui-smoke.log
      - name: Preserve true Blender rendered reference and authored GLB, never claim gameplay accepted
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Black-Pines-Original-Blender-Artpass-GLB-Preview
          path: build/black-pines/blender/
          retention-days: 14
          if-no-files-found: warn

  blender-godot-integrated-playable:
    # The original two GREEN jobs are independent. This THIRD job proves that
    # Blender's GLB is actually imported and rendered by the gameplay scene.
    needs: [blender-original-level-author, godot-gameplay-compile-and-scene]
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v5
      - name: Download true Blender-authored architecture
        uses: actions/download-artifact@v4
        with:
          name: Black-Pines-Original-Blender-Artpass-GLB-Preview
          path: build/black-pines/blender-in
      - name: Mount authored GLB without changing the original collision map
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p xogot/assets/black_pines build/black-pines/integrated
          cp build/black-pines/blender-in/black-pines-original-architecture.glb \
            xogot/assets/black_pines/black_pines_architecture.glb
          python3 - <<'PY'
          import struct
          from pathlib import Path
          p=Path('xogot/assets/black_pines/black_pines_architecture.glb')
          header=p.read_bytes()[:12]
          magic,version,length=struct.unpack('<4sII',header)
          assert magic==b'glTF' and version==2 and length==p.stat().st_size
          assert length>10000
          print('BLACK_PINES_GLTF2_BINARY_INTEGRITY_GREEN bytes=',length)
          PY
      - name: Install free Godot 4.6.1 for imported Blender runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libegl1 libx11-6 libxcursor1 libxrandr2 libxi6 python3-pil
          curl -fL --retry 5 --retry-all-errors --retry-delay 3 \
            https://github.com/godotengine/godot-builds/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip \
            -o /tmp/black-pines-godot.zip
          unzip -q /tmp/black-pines-godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.6.1-stable_linux.x86_64
          /tmp/Godot_v4.6.1-stable_linux.x86_64 --version
      - name: Import GLB into Godot editor without source-map changes
        shell: bash
        run: |
          set -euo pipefail
          timeout 600 /tmp/Godot_v4.6.1-stable_linux.x86_64 --headless \
            --editor --path xogot --quit 2>&1 | tee build/black-pines/integrated/import.log
          ! grep -E 'SCRIPT ERROR|Parse Error|ERROR:.*black_pines_architecture' \
            build/black-pines/integrated/import.log
      - name: Capture REAL Blender mesh mounted into live Godot gameplay
        shell: bash
        run: |
          set -euo pipefail
          BLACK_PINES_REQUIRE_BLENDER_MOUNT=1 timeout 180 xvfb-run -a \
            -s '-screen 0 1360x900x24' \
            /tmp/Godot_v4.6.1-stable_linux.x86_64 --path xogot \
            --rendering-method gl_compatibility --resolution 1360x900 \
            --script res://ci/black_pines_visual_probe.gd \
            2>&1 | tee build/black-pines/integrated/visual.log
          grep -q BLACK_PINES_BLENDER_MOUNT_GREEN build/black-pines/integrated/visual.log
          grep -q BLACK_PINES_NINE_HEROES_MOUNTED_GREEN build/black-pines/integrated/visual.log
          grep -q BLACK_PINES_DOUBLE_FURNITURE_ELIMINATED_GREEN build/black-pines/integrated/visual.log
          grep -q BLACK_PINES_REAL_GODOT_FIRSTPERSON_HUD_SCREENSHOT_GREEN \
            build/black-pines/integrated/visual.log
          ! grep -E 'SCRIPT ERROR|Parse Error|BLACK_PINES_BLENDER_MOUNT_RED' \
            build/black-pines/integrated/visual.log
          cp xogot/black-pines-real-firstframe-overview.png \
            build/black-pines/integrated/black-pines-BLENDER-IN-GODOT-overview.png
          cp xogot/black-pines-real-firstperson-mobile-hud.png \
            build/black-pines/integrated/black-pines-BLENDER-IN-GODOT-firstperson-HUD.png
          grep -q BLACK_PINES_NINE_ROOM_FIDELITY_CAPTURE_GREEN \
            build/black-pines/integrated/visual.log
          cp xogot/black-pines-fidelity-*.png build/black-pines/integrated/
          test "$(find build/black-pines/integrated -maxdepth 1 -name 'black-pines-fidelity-*.png' | wc -l)" -eq 9
          file build/black-pines/integrated/*.png
      - name: Fidelity screenshot audit of ALL nine REAL Godot rooms
        shell: bash
        run: |
          set -euo pipefail
          python3 xogot/ci/black_pines_fidelity_image_audit.py \
            build/black-pines/integrated \
            2>&1 | tee build/black-pines/integrated/fidelity-image-audit.log
          grep -q BLACK_PINES_NINE_ROOM_REAL_IMAGE_FIDELITY_GREEN \
            build/black-pines/integrated/fidelity-image-audit.log
          grep -q BLACK_PINES_FIDELITY_9_ROOM_CONTACT_SHEET_GREEN \
            build/black-pines/integrated/fidelity-image-audit.log
          test -s build/black-pines/integrated/black-pines-FIDELITY-9-REAL-GODOT-ROOMS.png
      - name: Archive actual Blender to Godot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Black-Pines-Blender-Mounted-In-Godot-Evidence
          path: build/black-pines/integrated/
          retention-days: 14
          if-no-files-found: warn
