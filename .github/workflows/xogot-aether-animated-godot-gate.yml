name: Verify Aether Animated Weapons in Godot

on:
  workflow_dispatch:
  push:
    branches:
      - feature/church-expansion-v1
    paths:
      - "xogot/assets/weapons/aether_waw_real/**"
      - "xogot/assets/weapons/mapmod_weapon_asset_manifest.json"
      - "xogot/scripts/weapon_asset_registry.gd"
      - "xogot/ci/aether_animated_weapon_probe.gd"
      - ".github/workflows/xogot-aether-animated-godot-gate.yml"

permissions:
  contents: read

concurrency:
  group: xogot-aether-animated-godot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Install Godot host tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip curl

      - name: Install Godot 4.6.1
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --retry-all-errors --retry-delay 2             https://github.com/godotengine/godot-builds/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip             -o /tmp/godot.zip
          rm -rf /tmp/godot
          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.6.1-stable_linux.x86_64
          /tmp/godot/Godot_v4.6.1-stable_linux.x86_64 --version

      - name: Import 28 animated real firearm GLBs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/aether-animated-godot
          timeout 300 /tmp/godot/Godot_v4.6.1-stable_linux.x86_64             --headless --editor --path xogot --quit             2>&1 | tee build/aether-animated-godot/import.log
          ! grep -E "SCRIPT ERROR|Parse Error|ERROR: Failed to load script" build/aether-animated-godot/import.log

      - name: Verify real animation roles and semantic variants
        shell: bash
        run: |
          set -euo pipefail
          timeout 180 /tmp/godot/Godot_v4.6.1-stable_linux.x86_64             --headless --path xogot --script res://ci/aether_animated_weapon_probe.gd             2>&1 | tee build/aether-animated-godot/probe.log
          grep -q "XZOGOT_AETHER_28_FIREARMS_GODOT_GREEN" build/aether-animated-godot/probe.log
          grep -q "XZOGOT_AETHER_538_ANIMATIONS_GODOT_GREEN" build/aether-animated-godot/probe.log
          grep -q "XZOGOT_AETHER_ANIMATED_WEAPON_GATE_GREEN" build/aether-animated-godot/probe.log
          grep -q "XZOGOT_AETHER_VARIANT_RESOLUTION_GREEN" build/aether-animated-godot/probe.log
          ! grep -E "SCRIPT ERROR|Parse Error|ERROR: Failed to load script|AETHER_ANIMATED_WEAPON_PROBE:" build/aether-animated-godot/probe.log

      - name: Upload dedicated Aether Godot proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aether-animated-godot-proof
          path: build/aether-animated-godot/
          if-no-files-found: warn
          retention-days: 14
