name: XZIEL Nacht XZMS Geometry Build

on:
  workflow_dispatch:
  push:
    branches:
      - feature/xziel-nacht-xzmesh-v1
      - feature/xziel-engine-nacht-runtime-v1
    paths:
      - "tools/maps/convert_glb_to_xzmesh.py"
      - "tools/maps/compile_nacht_xzmesh_bundle.py"
      - "tests/test_nacht_xzmesh_converter.py"
      - "assets/nacht_reference/pavlov_scene_reference/assets.json"
      - ".github/workflows/nacht-xzmesh-build.yml"

permissions:
  contents: read

concurrency:
  group: xziel-nacht-xzmesh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Test XZMS converter and 492-mesh bundle
        run: |
          set -euo pipefail
          python3 -m py_compile             tools/maps/convert_glb_to_xzmesh.py             tools/maps/compile_nacht_xzmesh_bundle.py
          python3 tests/test_nacht_xzmesh_converter.py

  source-conversion:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5

      - name: Install SteamCMD and repak
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/steamcmd" "$RUNNER_TEMP/repak"
          curl -fL --retry 6 --retry-delay 2 --retry-all-errors             https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz             -o "$RUNNER_TEMP/steamcmd.tgz"
          tar -xzf "$RUNNER_TEMP/steamcmd.tgz" -C "$RUNNER_TEMP/steamcmd"
          "$RUNNER_TEMP/steamcmd/steamcmd.sh" +quit || true
          curl -fL --retry 5             https://github.com/trumank/repak/releases/download/v0.2.3/repak_cli-x86_64-unknown-linux-gnu.tar.xz             -o "$RUNNER_TEMP/repak.tar.xz"
          tar -xJf "$RUNNER_TEMP/repak.tar.xz" -C "$RUNNER_TEMP/repak"
          REPAK=$(find "$RUNNER_TEMP/repak" -type f -name 'repak*' -perm -111 | head -1)
          test -n "$REPAK"
          echo "REPAK=$REPAK" >> "$GITHUB_ENV"

      - name: Download and unpack public Pavlov Nacht source
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/steamcmd/steamcmd.sh"             +login anonymous             +workshop_download_item 555160 2755515831 validate             +quit
          ROOT=$(find "$HOME" "$RUNNER_TEMP" -type d             -path '*/steamapps/workshop/content/555160/2755515831'             -print -quit 2>/dev/null)
          test -n "$ROOT"
          test -f "$ROOT/WindowsNoEditor.pak"
          mkdir -p "$RUNNER_TEMP/nacht-unpacked"
          "$REPAK" unpack "$ROOT/WindowsNoEditor.pak" -o "$RUNNER_TEMP/nacht-unpacked"
          echo "UNPACKED=$RUNNER_TEMP/nacht-unpacked" >> "$GITHUB_ENV"

      - name: Build exact CUE4Parse GLB exporter
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/exporter"
          cd "$RUNNER_TEMP/exporter"
          dotnet new console --framework net10.0 --force
          dotnet add package CUE4Parse --version 1.2.2.202609
          dotnet add package CUE4Parse-Conversion --version 1.2.2.202609
          cat > Program.cs <<'CS'
          using CUE4Parse.FileProvider;
          using CUE4Parse.UE4.Versions;
          using CUE4Parse.UE4.Assets.Exports.StaticMesh;
          using CUE4Parse_Conversion;
          using CUE4Parse_Conversion.Options;
          using System.Text.Json;

          if (args.Length < 3) return 2;
          using var doc=JsonDocument.Parse(File.ReadAllText(args[2]));
          var wanted=new HashSet<string>(StringComparer.OrdinalIgnoreCase);
          foreach(var row in doc.RootElement.GetProperty("meshes").EnumerateArray()) {
              var src=row.GetProperty("sourcePath").GetString() ?? "";
              var name=src.Replace('\\','/').TrimEnd('/').Split('/').Last();
              if(!string.IsNullOrWhiteSpace(name)) wanted.Add(name);
          }
          if(wanted.Count!=492) return 3;

          var provider=new DefaultFileProvider(args[0],SearchOption.AllDirectories,true,new VersionContainer(EGame.GAME_UE4_21));
          provider.Initialize(); provider.PostMount(); provider.LoadVirtualPaths();
          var session=new ExportSession{MaxDegreeOfParallelism=Math.Max(1,Environment.ProcessorCount/2)};
          var queued=new HashSet<string>(StringComparer.OrdinalIgnoreCase);
          foreach(var file in provider.Files.Values.Where(f=>f.IsUePackage && f.Path.Contains("/CoD_nacht/",StringComparison.OrdinalIgnoreCase) && f.Path.EndsWith(".uasset",StringComparison.OrdinalIgnoreCase))) {
              try {
                  foreach(var mesh in provider.LoadPackage(file.Path).GetExports().OfType<UStaticMesh>()) {
                      if(wanted.Contains(mesh.Name) && queued.Add(mesh.Name)) session.Add(mesh);
                  }
              } catch(Exception e) { Console.WriteLine("skip="+file.Path+" :: "+e.Message); }
          }
          Console.WriteLine($"wanted={wanted.Count} queued={queued.Count}");
          if(queued.Count!=wanted.Count) return 4;
          Directory.CreateDirectory(args[1]);
          var result=await session.RunAsync(args[1],new ExportOptions(meshFormat:EMeshFormat.Gltf2,exportMaterials:false));
          Console.WriteLine($"exportResults={result.Count}");
          return result.Count==wanted.Count ? 0 : 5;
          CS
          dotnet build -c Release

      - name: Export 492 GLBs
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/scene-glb" build/nacht-xzmesh
          dotnet "$RUNNER_TEMP/exporter/bin/Release/net10.0/exporter.dll"             "$UNPACKED"             "$RUNNER_TEMP/scene-glb"             "$GITHUB_WORKSPACE/assets/nacht_reference/pavlov_scene_reference/assets.json"             2>&1 | tee build/nacht-xzmesh/export.log
          python3 - <<'PY'
          import os,pathlib,shutil
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'scene-glb'
          root.mkdir(parents=True,exist_ok=True)
          for p in list(pathlib.Path.cwd().iterdir()):
              if p.is_file() and '\\' in p.name and p.name.lower().endswith('.glb'):
                  name=p.name.replace('\\','/').split('/')[-1]
                  target=root/name
                  if target.exists(): raise SystemExit(f'duplicate {name}')
                  shutil.move(str(p),str(target))
          glbs=list(root.rglob('*.glb'))
          assert len(glbs)==492,len(glbs)
          assert len({p.stem.lower() for p in glbs})==492
          print('XZIEL_NACHT_GLBS_READY',len(glbs))
          PY

      - name: Convert all source GLBs to XZMS
        run: |
          set -euo pipefail
          python3 tools/maps/compile_nacht_xzmesh_bundle.py             --glb-root "$RUNNER_TEMP/scene-glb"             --output-root "$RUNNER_TEMP/xzmesh"             --manifest build/nacht-xzmesh/xziel.xzmesh.bundle.json             | tee build/nacht-xzmesh/compile.log
          python3 - <<'PY'
          import json,pathlib
          d=json.loads(pathlib.Path('build/nacht-xzmesh/xziel.xzmesh.bundle.json').read_text())
          s=d['summary']
          assert s['meshCount']==492,s
          assert s['vertexCount']>0,s
          assert s['indexCount']>0,s
          assert s['triangleCount']>0,s
          assert s['geometryRuntimeFormatReady'] is True,s
          print('XZIEL_NACHT_XZMS_SOURCE_GREEN',json.dumps(s,sort_keys=True))
          PY

      - name: Upload XZMS conversion evidence only
        uses: actions/upload-artifact@v4
        with:
          name: XZIEL-Nacht-XZMS-Geometry-Evidence
          path: |
            build/nacht-xzmesh/xziel.xzmesh.bundle.json
            build/nacht-xzmesh/export.log
            build/nacht-xzmesh/compile.log
          retention-days: 7
