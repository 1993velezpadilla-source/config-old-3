name: Sanctum V2 Cathedral Material ID Probe

on:
  push:
    branches:
      - sanctum-v2-existing-assets-only
    paths:
      - ".github/workflows/sanctum-v2-material-id.yml"
      - "tools/sanctum_v2/material_id_cathedral_probe.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sanctum-v2-material-id-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: Render cathedral material IDs
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout XZIEL
        uses: actions/checkout@v5

      - name: Install host packages
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq git-lfs curl xz-utils xvfb libx11-6 libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libglu1-mesa
          git lfs install

      - name: Fetch upstream authored cathedral kit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf external-french-houses
          git clone --depth 1 https://github.com/IRCSS/Blender-Geometry-Node-French-Houses.git external-french-houses
          (cd external-french-houses && git lfs pull || true)
          test -s external-french-houses/GeometryNodesFrenchHous.blend
          grep -q "MIT License" external-french-houses/LICENSE

      - name: Install Blender 5.2.2
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz -o /tmp/blender.tar.xz
          tar -C /tmp -xf /tmp/blender.tar.xz
          /tmp/blender-5.2.2-linux-x64/blender --version

      - name: Render material ID views
        shell: bash
        env:
          SANCTUM_V2_MATERIAL_ID_OUT: sanctum-v2-material-id
        run: |
          set -euo pipefail
          mkdir -p sanctum-v2-material-id
          xvfb-run -a -s "-screen 0 1600x1000x24" \
            /tmp/blender-5.2.2-linux-x64/blender \
            -b external-french-houses/GeometryNodesFrenchHous.blend \
            --python tools/sanctum_v2/material_id_cathedral_probe.py \
            2>&1 | tee sanctum-v2-material-id/blender-material-id.log

          grep -q "SANCTUM_V2_MATERIAL_ID_OK" sanctum-v2-material-id/blender-material-id.log
          test -s sanctum-v2-material-id/material-id-map.json

          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path("sanctum-v2-material-id")
          d=json.loads((root/"material-id-map.json").read_text())
          assert d["source_object"]=="Catehdral", d
          assert len(d["renders"])==6, d
          for name in d["renders"]:
              p=root/name
              assert p.is_file() and p.stat().st_size>0, name
          print("SANCTUM_V2_MATERIAL_ID_GATES_OK")
          PY

      - name: Upload material ID evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XZIEL-Sanctum-V2-Cathedral-Material-ID
          path: sanctum-v2-material-id/
          if-no-files-found: error
          retention-days: 14
