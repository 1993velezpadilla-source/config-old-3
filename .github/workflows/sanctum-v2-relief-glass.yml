name: Sanctum V2 Relief and Stained Glass Probe

on:
  push:
    branches:
      - sanctum-v2-existing-assets-only
    paths:
      - ".github/workflows/sanctum-v2-relief-glass.yml"
      - "tools/sanctum_v2/probe_cathedral_relief_stained_glass.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sanctum-v2-relief-glass-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: Render relief and seamless CC0 stained glass
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout XZIEL
        uses: actions/checkout@v5

      - name: Install host packages
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq git-lfs curl xz-utils xvfb libx11-6 libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libglu1-mesa
          git lfs install
          python3 -m pip install --quiet pillow

      - name: Fetch upstream authored cathedral kit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf external-french-houses
          git clone --depth 1 https://github.com/IRCSS/Blender-Geometry-Node-French-Houses.git external-french-houses
          (cd external-french-houses && git lfs pull || true)
          test -s external-french-houses/GeometryNodesFrenchHous.blend
          grep -q "MIT License" external-french-houses/LICENSE

      - name: Download licensed surface sources
        shell: bash
        run: |
          set -euo pipefail
          rm -rf sanctum-v2-relief-assets
          mkdir -p sanctum-v2-relief-assets/stained_glass

          python3 - <<'PY'
          import html as htmlmod
          import io
          import json
          import re
          import urllib.request
          import zipfile
          from pathlib import Path
          from urllib.parse import urljoin, urlsplit, urlunsplit
          from PIL import Image

          UA="XZIEL-Sanctum-V2/1.0 (licensed surface source probe)"
          root=Path("sanctum-v2-relief-assets")
          sgdir=root/"stained_glass"

          def req(url, timeout=120):
              return urllib.request.Request(url, headers={"User-Agent":UA})

          def get_json(url):
              with urllib.request.urlopen(req(url), timeout=60) as r:
                  return json.load(r)

          def get_bytes(url):
              with urllib.request.urlopen(req(url), timeout=180) as r:
                  return r.read()

          def download(url,dst):
              dst.parent.mkdir(parents=True,exist_ok=True)
              data=get_bytes(url)
              dst.write_bytes(data)
              if dst.stat().st_size==0:
                  raise SystemExit(f"Empty download: {url}")

          def leaves(obj,path=()):
              if isinstance(obj,dict):
                  if isinstance(obj.get("url"),str):
                      yield path,obj
                  for k,v in obj.items():
                      if k!="url":
                          yield from leaves(v,path+(str(k),))
              elif isinstance(obj,list):
                  for i,v in enumerate(obj):
                      yield from leaves(v,path+(str(i),))

          def choose_polyhaven(asset,kind):
              tree=get_json(f"https://api.polyhaven.com/files/{asset}")
              rows=[]
              for path,rec in leaves(tree):
                  parts=[str(x).lower() for x in path]
                  url=rec.get("url","")
                  s=(" / ".join(path)+" "+url).lower()
                  if "4k" not in parts or ".png" not in url.lower():
                      continue
                  score=0
                  if kind=="diffuse":
                      if "diffuse" in s: score+=30
                      if re.search(r"(^|[/_ -])diff([/_ .-]|$)",s): score+=15
                  elif kind=="rough":
                      if "roughness" in s: score+=30
                      if "rough" in s: score+=15
                      if "rough_ao" in s or "rough ao" in s: score-=10
                  elif kind=="displacement":
                      if "displacement" in s: score+=40
                      if re.search(r"(^|[/_ -])disp([/_ .-]|$)",s): score+=20
                  if score>0:
                      rows.append((score,path,rec))
              if not rows:
                  raise SystemExit(f"No exact 4K {kind} PNG for {asset}")
              rows.sort(key=lambda x:(x[0],x[2].get("size",0)),reverse=True)
              return rows[0][2]["url"]

          def png_dims(p):
              with p.open("rb") as f:
                  sig=f.read(24)
              if len(sig)<24 or sig[:8]!=b"\x89PNG\r\n\x1a\n" or sig[12:16]!=b"IHDR":
                  raise SystemExit(f"Invalid PNG: {p}")
              return [int.from_bytes(sig[16:20],"big"),int.from_bytes(sig[20:24],"big")]

          manifest={
              "polyhaven_provider":"Powered by Poly Haven",
              "polyhaven_license":"CC0",
              "polyhaven":{},
              "stained_glass":{
                  "title":"3DTextures stained glass seamless material",
                  "license":"CC0 / Public Domain",
                  "source_pages":[
                      "https://3dtextures.me/2026/03/14/glass-stained-panel-window-004-free-seamless-pbr-texture/",
                      "https://3dtextures.me/2020/09/21/glass-stained-001/"
                  ],
                  "expected_dimensions":[1024,1024],
                  "seamless":True,
                  "source_author_repeat_guidance":"2x to 4x"
              }
          }

          for asset in ("stone_wall_04","roof_slates_03"):
              info=get_json(f"https://api.polyhaven.com/info/{asset}")
              dims=info.get("dimensions")
              if not isinstance(dims,list) or len(dims)<2:
                  raise SystemExit(f"Missing physical dimensions for {asset}: {dims}")
              urls={}
              for kind in ("diffuse","rough","displacement"):
                  url=choose_polyhaven(asset,kind)
                  p=root/asset/f"{kind}.png"
                  download(url,p)
                  if max(png_dims(p))!=4096:
                      raise SystemExit(f"Expected exact 4K texture: {p} {png_dims(p)}")
                  urls[kind]=url
              manifest["polyhaven"][asset]={"dimensions_mm":dims,"urls":urls}

          def normalize_url(base,v):
              u=urljoin(base,htmlmod.unescape(v))
              p=urlsplit(u)
              return urlunsplit((p.scheme,p.netloc,p.path,"",""))

          discovered=[]
          for page in manifest["stained_glass"]["source_pages"]:
              raw=get_bytes(page).decode("utf-8","ignore")
              vals=[]
              vals += re.findall(r'(?:href|src)=["\x27]([^"\x27]+)["\x27]',raw,re.I)
              for srcset in re.findall(r'srcset=["\x27]([^"\x27]+)["\x27]',raw,re.I):
                  vals += [x.strip().split()[0] for x in srcset.split(",") if x.strip()]
              vals += re.findall(r'https?://[^"\x27<>\s]+',raw,re.I)
              for v in vals:
                  u=normalize_url(page,v)
                  path=urlsplit(u).path.lower()
                  if "3dtextures.me/wp-content/uploads/" in u or "i0.wp.com/3dtextures.me/wp-content/uploads/" in u:
                      if re.search(r'\.(png|jpe?g|webp|zip)$',path,re.I):
                          discovered.append(u)

          for q in ("Glass Stained 001","Glass Stained Panel Window 004","Material 1638","Material 2001"):
              api="https://3dtextures.me/wp-json/wp/v2/media?per_page=100&search="+urllib.parse.quote(q)
              try:
                  data=get_json(api)
                  for item in data if isinstance(data,list) else []:
                      for candidate in (
                          item.get("source_url"),
                          ((item.get("media_details") or {}).get("sizes") or {}).get("full",{}).get("source_url")
                      ):
                          if candidate:
                              discovered.append(normalize_url(api,candidate))
              except Exception as e:
                  print("WP_MEDIA_SEARCH_SKIP",q,repr(e))

          discovered=list(dict.fromkeys(discovered))
          candidates=[]
          audit={"discovered_urls":discovered,"inspected":[]}

          def inspect_image_bytes(data,label,url):
              try:
                  with Image.open(io.BytesIO(data)) as im:
                      size=list(im.size)
                      rec={"url":url,"label":label,"size":size,"format":im.format}
                      audit["inspected"].append(rec)
                      if size==[1024,1024]:
                          candidates.append((url,label,data,im.format))
              except Exception:
                  pass

          for url in discovered:
              try:
                  data=get_bytes(url)
                  if urlsplit(url).path.lower().endswith(".zip"):
                      with zipfile.ZipFile(io.BytesIO(data)) as z:
                          for name in z.namelist():
                              if re.search(r'\.(png|jpe?g|webp)$',name,re.I):
                                  inspect_image_bytes(z.read(name),name,url+"#"+name)
                  else:
                      inspect_image_bytes(data,Path(urlsplit(url).path).name,url)
              except Exception as e:
                  audit["inspected"].append({"url":url,"error":repr(e)})

          def rank(item):
              url,label,_,_=item
              s=(url+" "+label).lower()
              score=0
              if any(k in s for k in ("diffuse","albedo","basecolor","base_color","color")): score+=100
              if "stained" in s: score+=30
              if any(k in s for k in ("normal","rough","disp","height","metal","mask","ambient","_ao")): score-=90
              if "material_" in s: score-=20
              return score

          candidates.sort(key=rank,reverse=True)
          audit["candidate_count"]=len(candidates)
          audit["candidate_labels"]=[{"url":x[0],"label":x[1],"rank":rank(x)} for x in candidates]
          (sgdir/"source-audit.json").write_text(json.dumps(audit,indent=2),encoding="utf-8")

          if not candidates or rank(candidates[0])<0:
              raise SystemExit("STAINED_SOURCE_DISCOVERY_FAILED: no trustworthy exact 1024x1024 color map exposed by source pages")

          chosen=candidates[0]
          with Image.open(io.BytesIO(chosen[2])) as im:
              im.convert("RGB").save(sgdir/"color.png")

          manifest["stained_glass"]["selected_url"]=chosen[0]
          manifest["stained_glass"]["selected_label"]=chosen[1]
          manifest["stained_glass"]["selected_rank"]=rank(chosen)
          (root/"SOURCE_MANIFEST.json").write_text(json.dumps(manifest,indent=2),encoding="utf-8")
          print("SELECTED_STAINED_GLASS",json.dumps(manifest["stained_glass"],indent=2))
          PY

      - name: Install Blender 5.2.2
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz -o /tmp/blender.tar.xz
          tar -C /tmp -xf /tmp/blender.tar.xz
          /tmp/blender-5.2.2-linux-x64/blender --version

      - name: Render relief and seamless stained glass
        shell: bash
        env:
          SANCTUM_V2_RELIEF_OUT: sanctum-v2-relief-glass
          SANCTUM_V2_RELIEF_ASSETS: sanctum-v2-relief-assets
        run: |
          set -euo pipefail
          mkdir -p sanctum-v2-relief-glass
          xvfb-run -a -s "-screen 0 1600x1000x24" \
            /tmp/blender-5.2.2-linux-x64/blender \
            -b external-french-houses/GeometryNodesFrenchHous.blend \
            --python tools/sanctum_v2/probe_cathedral_relief_stained_glass.py \
            2>&1 | tee sanctum-v2-relief-glass/blender-relief-glass.log

          grep -q "SANCTUM_V2_RELIEF_GLASS_OK" sanctum-v2-relief-glass/blender-relief-glass.log
          test -s sanctum-v2-relief-glass/relief-glass-report.json
          cp sanctum-v2-relief-assets/SOURCE_MANIFEST.json sanctum-v2-relief-glass/
          cp sanctum-v2-relief-assets/stained_glass/source-audit.json sanctum-v2-relief-glass/

          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path("sanctum-v2-relief-glass")
          d=json.loads((root/"relief-glass-report.json").read_text())
          assert d["source_object"]=="Catehdral", d
          assert d["mapping"]["stained_glass"]=="existing UVMap + seamless REPEAT 2x", d
          assert d["stained_glass"]["source_dimensions"]==[1024,1024], d
          assert d["relief"]["stone_bump_distance_m"]>0, d
          assert d["relief"]["roof_bump_distance_m"]>0, d
          assert len(d["renders"])==6, d
          for n in d["renders"]:
              p=root/n
              assert p.is_file() and p.stat().st_size>0, n
          print("SANCTUM_V2_RELIEF_GLASS_GATES_OK")
          PY

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XZIEL-Sanctum-V2-Relief-Stained-Glass
          path: |
            sanctum-v2-relief-glass/
            sanctum-v2-relief-assets/stained_glass/source-audit.json
          if-no-files-found: warn
          retention-days: 14
