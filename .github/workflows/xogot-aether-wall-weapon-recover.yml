name: Recover Aether Wall Weapons

# recovery-matrix-trigger: 2026-10-04-v8

on:
  workflow_dispatch:
  push:
    branches:
      - feature/church-expansion-v1
    paths:
      - ".github/workflows/xogot-aether-wall-weapon-recover.yml"

concurrency:
  group: xogot-aether-wall-weapon-recover
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5

      - name: Install package tools
        shell: bash
        run: |
          set -euo pipefail
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            p7zip-full xz-utils \
            libc6:i386 libgcc-s1:i386 libstdc++6:i386 zlib1g:i386 \
            libsdl2-2.0-0:i386
          npm --version

      - name: Download reconstructed Project Aether build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aether-download"
          npx --yes itchio-downloader             --url "https://verrial.itch.io/projectaether"             --downloadDirectory "$RUNNER_TEMP/aether-download"
          FILE=$(find "$RUNNER_TEMP/aether-download" -type f -name '*.zip' -printf '%s\t%p\n' | sort -nr | head -1 | cut -f2-)
          test -s "$FILE"
          echo "PAYLOAD=$FILE" >> "$GITHUB_ENV"

      - name: Prepare legacy pak
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aether-paks"
          7z x -y "$PAYLOAD" 'ProjectAether/Content/Paks/*' -o"$RUNNER_TEMP/aether-paks" >/dev/null
          rm -f "$PAYLOAD"
          PAKDIR="$RUNNER_TEMP/aether-paks/ProjectAether/Content/Paks"
          curl -fL --retry 5             https://github.com/trumank/retoc/releases/download/v0.1.5/retoc_cli-x86_64-unknown-linux-gnu.tar.xz             -o "$RUNNER_TEMP/retoc.tar.xz"
          mkdir -p "$RUNNER_TEMP/retoc"
          tar -xJf "$RUNNER_TEMP/retoc.tar.xz" -C "$RUNNER_TEMP/retoc"
          RETOC=$(find "$RUNNER_TEMP/retoc" -type f -name 'retoc*' -perm -111 | head -1)
          curl -fL --retry 5             https://github.com/trumank/repak/releases/download/v0.2.3/repak_cli-x86_64-unknown-linux-gnu.tar.xz             -o "$RUNNER_TEMP/repak.tar.xz"
          mkdir -p "$RUNNER_TEMP/repak"
          tar -xJf "$RUNNER_TEMP/repak.tar.xz" -C "$RUNNER_TEMP/repak"
          REPAK=$(find "$RUNNER_TEMP/repak" -type f -name 'repak*' -perm -111 | head -1)
          test -x "$RETOC" && test -x "$REPAK"
          "$RETOC" to-legacy "$PAKDIR" "$RUNNER_TEMP/aether-legacy.pak"
          test -s "$RUNNER_TEMP/aether-legacy.pak"
          echo "REPAK=$REPAK" >> "$GITHUB_ENV"

      - name: Extract four wall-weapon source packages
        shell: bash
        run: |
          set -euo pipefail
          rm -rf recovered
          mkdir -p recovered/raw
          "$REPAK" unpack "$RUNNER_TEMP/aether-legacy.pak"             -o recovered/raw             -i 'ProjectAether/Content/Assets/Weapons/waw/M1Garand/**'             -i 'ProjectAether/Content/Assets/Weapons/waw/MP40/**'             -i 'ProjectAether/Content/Assets/Weapons/waw/TrenchGun/**'             -i 'ProjectAether/Content/Assets/Weapons/waw/Thompson/**'             -i 'ProjectAether/Content/Assets/Sounds/**/*garand*'             -i 'ProjectAether/Content/Assets/Sounds/**/*Garand*'             -i 'ProjectAether/Content/Assets/Sounds/**/*mp40*'             -i 'ProjectAether/Content/Assets/Sounds/**/*MP40*'             -i 'ProjectAether/Content/Assets/Sounds/**/*trench*'             -i 'ProjectAether/Content/Assets/Sounds/**/*Trench*'             -i 'ProjectAether/Content/Assets/Sounds/**/*thompson*'             -i 'ProjectAether/Content/Assets/Sounds/**/*Thompson*'             --force
          find recovered/raw -type f | sort > recovered/raw-files.txt
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path("recovered/raw")
          rows=[]
          for p in root.rglob("*"):
              if p.is_file():
                  rows.append({"path":p.as_posix(),"bytes":p.stat().st_size,"ext":p.suffix.lower()})
          names=("M1Garand","MP40","TrenchGun","Thompson")
          counts={n:sum(n.lower() in r["path"].lower() for r in rows) for n in names}
          out={"file_count":len(rows),"bytes":sum(r["bytes"] for r in rows),"weapon_path_counts":counts,"files":rows}
          Path("recovered/raw-report.json").write_text(json.dumps(out,indent=2)+"\n")
          print("XZOGOT_AETHER_WALL_RAW",out["file_count"],out["bytes"],counts)
          assert all(v>0 for v in counts.values()), counts
          assert any(r["ext"]==".uasset" for r in rows)
          PY

      - name: Install .NET 10 for current CUE4Parse
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build current CUE4Parse CLI for Linux
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/CUE4Parse.CLI" "$RUNNER_TEMP/cue4parse-publish"
          git clone --depth 1 https://github.com/joric/CUE4Parse.CLI.git "$RUNNER_TEMP/CUE4Parse.CLI"
          dotnet publish "$RUNNER_TEMP/CUE4Parse.CLI/CUE4Parse.CLI/CUE4Parse.CLI.csproj" \
            -c Release -r linux-x64 --self-contained true \
            -p:RuntimeIdentifier=linux-x64 \
            -p:PublishTrimmed=false \
            -p:PublishSingleFile=true \
            -o "$RUNNER_TEMP/cue4parse-publish"
          CUE4PARSE=$(find "$RUNNER_TEMP/cue4parse-publish" -maxdepth 1 -type f -perm -111 \
            ! -name '*.so' | head -1)
          test -x "$CUE4PARSE"
          "$CUE4PARSE" --version | tee recovered/cue4parse-version.txt || true
          "$CUE4PARSE" --help > recovered/cue4parse-help.txt 2>&1 || true
          echo "CUE4PARSE=$CUE4PARSE" >> "$GITHUB_ENV"
          echo "XZOGOT_CUE4PARSE_LINUX_READY $CUE4PARSE"

      - name: Build native Linux detex for CUE4Parse
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/detex"
          git clone --depth 1 https://github.com/hglm/detex.git "$RUNNER_TEMP/detex"
          cd "$RUNNER_TEMP/detex"
          sed -i -E 's/^LIBRARY_CONFIGURATION[[:space:]]*=.*/LIBRARY_CONFIGURATION = SHARED/' Makefile.conf
          python3 - <<'PY'
          from pathlib import Path
          p=Path("detex.h")
          s=p.read_text()
          old="DETEX_API bool detexDecompressTextureLinear"
          new="DETEX_HELPER_SHARED_EXPORT bool detexDecompressTextureLinear"
          if old in s:
              s=s.replace(old,new)
          p.write_text(s)
          PY
          make -j2
          DETEX_SO=$(find . -type f \( -name 'libdetex.so' -o -name 'libdetex.so.*' \) | sort | tail -1)
          test -n "$DETEX_SO"
          cp "$DETEX_SO" /tmp/Detex.dll
          file /tmp/Detex.dll
          ldd /tmp/Detex.dll || true
          echo "XZOGOT_CUE4PARSE_LINUX_DETEX_READY $DETEX_SO"

      - name: Export UE5 Aether weapon meshes animations textures and sounds
        shell: bash
        run: |
          set -euo pipefail
          rm -rf recovered/export
          mkdir -p recovered/export
          cat > recovered/aether-weapon-packages.txt <<'EOF'
          ProjectAether/Content/Assets/Weapons/waw/M1Garand/*.uasset
          ProjectAether/Content/Assets/Weapons/waw/MP40/*.uasset
          ProjectAether/Content/Assets/Weapons/waw/TrenchGun/*.uasset
          ProjectAether/Content/Assets/Weapons/waw/Thompson/*.uasset
          ProjectAether/Content/Assets/Sounds/**/*garand*.uasset
          ProjectAether/Content/Assets/Sounds/**/*Garand*.uasset
          ProjectAether/Content/Assets/Sounds/**/*mp40*.uasset
          ProjectAether/Content/Assets/Sounds/**/*MP40*.uasset
          ProjectAether/Content/Assets/Sounds/**/*trench*.uasset
          ProjectAether/Content/Assets/Sounds/**/*Trench*.uasset
          ProjectAether/Content/Assets/Sounds/**/*thompson*.uasset
          ProjectAether/Content/Assets/Sounds/**/*Thompson*.uasset
          EOF

          : > recovered/cue4parse-export.log
          SUCCESS_GAME=""
          # The raw provider is already curated to only the requested Aether assets.
          # Match its normalized package namespace wholesale; the original mount prefix
          # is not a valid CUE4Parse filesystem-provider package selector.
          PROBE_PACKAGE="*"

          # Resolve the reconstructed build's actual package version against one
          # known skeletal weapon package first. Read the extracted package tree
          # directly so .uasset/.uexp/.ubulk remain paired under one filesystem
          # provider; the retoc-generated legacy pak was exposing them as raw data.
          # Do not let sidecars count as a successful export.
          for GAME in \
            GAME_UE5_7 GAME_UE5_6 GAME_UE5_5 GAME_UE5_4 GAME_UE5_3 \
            GAME_UE5_2 GAME_UE5_1 GAME_UE5_0 GAME_UE4_27; do
            echo "XZOGOT_CUE4PARSE_VERSION_PROBE $GAME" | tee -a recovered/cue4parse-export.log
            rm -rf recovered/version-probe
            mkdir -p recovered/version-probe
            set +e
            "$CUE4PARSE" \
              -i recovered/raw \
              -g "$GAME" \
              -p "$PROBE_PACKAGE" \
              -o recovered/version-probe \
              -y -v \
              --mesh-format Gltf2 \
              --texture-format Png \
              --mesh-quality Highest \
              --export-materials true \
              >> recovered/cue4parse-export.log 2>&1
            RC=$?
            set -e
            MESH_COUNT=$(find recovered/version-probe -type f \
              \( -iname '*.gltf' -o -iname '*.glb' -o -iname '*.psk' -o -iname '*.pskx' -o -iname '*.uemodel' \) | wc -l)
            echo "XZOGOT_CUE4PARSE_VERSION_RESULT $GAME rc=$RC meshes=$MESH_COUNT" | tee -a recovered/cue4parse-export.log
            if [ "$MESH_COUNT" -gt 0 ]; then
              SUCCESS_GAME="$GAME"
              break
            fi
          done

          if [ -z "$SUCCESS_GAME" ]; then
            echo "No tested engine version exported the M1Garand skeletal mesh." | tee -a recovered/cue4parse-export.log
            exit 31
          fi

          echo "$SUCCESS_GAME" > recovered/cue4parse-game-version.txt
          echo "XZOGOT_CUE4PARSE_VERSION_LOCKED $SUCCESS_GAME" | tee -a recovered/cue4parse-export.log

          rm -rf recovered/export
          mkdir -p recovered/export
          set +e
          "$CUE4PARSE" \
            -i recovered/raw \
            -g "$SUCCESS_GAME" \
            -p "*" \
            -o recovered/export \
            -y -v \
            --mesh-format Gltf2 \
            --texture-format Png \
            --mesh-quality Highest \
            --export-materials true \
            >> recovered/cue4parse-export.log 2>&1
          RC=$?
          set -e

          find recovered/export -type f | sort > recovered/export-files.txt
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path("recovered/export")
          rows=[{"path":p.as_posix(),"bytes":p.stat().st_size,"ext":p.suffix.lower()} for p in root.rglob("*") if p.is_file()]
          kinds={}
          for r in rows:kinds[r["ext"]]=kinds.get(r["ext"],0)+1
          report={"file_count":len(rows),"bytes":sum(r["bytes"] for r in rows),"extensions":kinds,"files":rows}
          Path("recovered/export-report.json").write_text(json.dumps(report,indent=2)+"\n")
          print("XZOGOT_AETHER_CUE4PARSE_EXPORT",report["file_count"],report["bytes"],kinds)
          mesh=sum(kinds.get(x,0) for x in (".gltf",".glb",".psk",".pskx",".uemodel",".obj"))
          anim=sum(kinds.get(x,0) for x in (".psa",".ueanim"))
          sound=sum(kinds.get(x,0) for x in (".wav",".ogg",".mp3",".wem"))
          print("XZOGOT_AETHER_WALL_EXPORT_CLASSES",mesh,anim,sound)
          if mesh<=0:
              raise SystemExit("No weapon mesh export produced")
          if anim<=0:
              raise SystemExit("No weapon animation export produced")
          if sound<=0:
              raise SystemExit("No weapon sound export produced")
          PY
          test "$RC" -eq 0
          echo "XZOGOT_AETHER_CUE4PARSE_GREEN $SUCCESS_GAME"

      - name: Upload recovered wall weapons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aether-wall-weapons-recovered
          path: |
            recovered/raw-report.json
            recovered/raw-files.txt
            recovered/raw/
            recovered/version-probe/
            recovered/cue4parse-version.txt
            recovered/cue4parse-help.txt
            recovered/cue4parse-game-version.txt
            recovered/cue4parse-export.log
            recovered/aether-weapon-packages.txt
            recovered/export-report.json
            recovered/export-files.txt
            recovered/export/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6
