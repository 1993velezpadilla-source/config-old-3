name: Recover Aether Wall Weapons

# recovery-matrix-trigger: 2026-10-04-v13-full-waw-arsenal

on:
  workflow_dispatch:
  push:
    branches:
      - feature/church-expansion-v1
    paths:
      - ".github/workflows/xogot-aether-wall-weapon-recover.yml"

permissions:
  contents: write

concurrency:
  group: xogot-aether-wall-weapon-recover
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5

      - name: Install package tools
        shell: bash
        run: |
          set -euo pipefail
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            p7zip-full xz-utils \
            libc6:i386 libgcc-s1:i386 libstdc++6:i386 zlib1g:i386 \
            libsdl2-2.0-0:i386
          npm --version

      - name: Download reconstructed Project Aether build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aether-download"
          npx --yes itchio-downloader             --url "https://verrial.itch.io/projectaether"             --downloadDirectory "$RUNNER_TEMP/aether-download"
          FILE=$(find "$RUNNER_TEMP/aether-download" -type f -name '*.zip' -printf '%s\t%p\n' | sort -nr | head -1 | cut -f2-)
          test -s "$FILE"
          echo "PAYLOAD=$FILE" >> "$GITHUB_ENV"

      - name: Prepare legacy pak
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aether-paks"
          7z x -y "$PAYLOAD" 'ProjectAether/Content/Paks/*' -o"$RUNNER_TEMP/aether-paks" >/dev/null
          rm -f "$PAYLOAD"
          PAKDIR="$RUNNER_TEMP/aether-paks/ProjectAether/Content/Paks"
          curl -fL --retry 5             https://github.com/trumank/retoc/releases/download/v0.1.5/retoc_cli-x86_64-unknown-linux-gnu.tar.xz             -o "$RUNNER_TEMP/retoc.tar.xz"
          mkdir -p "$RUNNER_TEMP/retoc"
          tar -xJf "$RUNNER_TEMP/retoc.tar.xz" -C "$RUNNER_TEMP/retoc"
          RETOC=$(find "$RUNNER_TEMP/retoc" -type f -name 'retoc*' -perm -111 | head -1)
          curl -fL --retry 5             https://github.com/trumank/repak/releases/download/v0.2.3/repak_cli-x86_64-unknown-linux-gnu.tar.xz             -o "$RUNNER_TEMP/repak.tar.xz"
          mkdir -p "$RUNNER_TEMP/repak"
          tar -xJf "$RUNNER_TEMP/repak.tar.xz" -C "$RUNNER_TEMP/repak"
          REPAK=$(find "$RUNNER_TEMP/repak" -type f -name 'repak*' -perm -111 | head -1)
          test -x "$RETOC" && test -x "$REPAK"
          "$RETOC" to-legacy "$PAKDIR" "$RUNNER_TEMP/aether-legacy.pak"
          test -s "$RUNNER_TEMP/aether-legacy.pak"
          echo "REPAK=$REPAK" >> "$GITHUB_ENV"
          echo "AETHER_PAKDIR=$PAKDIR" >> "$GITHUB_ENV"

      - name: Inventory and extract complete WaW weapon arsenal
        shell: bash
        run: |
          set -euo pipefail
          rm -rf recovered
          mkdir -p recovered/raw
          find "$AETHER_PAKDIR" -maxdepth 2 -type f -printf "%f\t%s\n" | sort > recovered/pak-files.txt
          "$REPAK" list "$RUNNER_TEMP/aether-legacy.pak" > recovered/aether-legacy-files.txt
          python3 - <<'PY'
          from pathlib import Path
          import json
          rows=[]
          prefix="ProjectAether/Content/Assets/Weapons/waw/"
          for raw in Path("recovered/aether-legacy-files.txt").read_text(errors="ignore").splitlines():
              line=raw.strip().replace("\\","/")
              i=line.find(prefix)
              if i < 0:
                  continue
              rel=line[i+len(prefix):]
              top=rel.split("/",1)[0]
              if top and top not in rows:
                  rows.append(top)
          rows=sorted(rows,key=str.lower)
          Path("recovered/waw-weapon-directories.json").write_text(json.dumps({"count":len(rows),"directories":rows},indent=2)+"\n")
          print("XZOGOT_AETHER_WAW_WEAPON_DIRS",len(rows),rows)
          if not rows:
              raise SystemExit("No WaW weapon directories discovered")
          PY
          "$REPAK" unpack "$RUNNER_TEMP/aether-legacy.pak" \
            -o recovered/raw \
            -i 'ProjectAether/Content/Assets/Weapons/waw/**' \
            -i 'ProjectAether/Content/Assets/Sounds/**/*1911*' \
            -i 'ProjectAether/Content/Assets/Sounds/**/*colt*' \
            -i 'ProjectAether/Content/Assets/Sounds/**/*Colt*' \
            -i 'ProjectAether/Content/Assets/Sounds/**/*garand*' \
            -i 'ProjectAether/Content/Assets/Sounds/**/*Garand*' \
            -i 'ProjectAether/Content/Assets/Sounds/**/*mp40*' \
            -i 'ProjectAether/Content/Assets/Sounds/**/*MP40*' \
            -i 'ProjectAether/Content/Assets/Sounds/**/*trench*' \
            -i 'ProjectAether/Content/Assets/Sounds/**/*Trench*' \
            -i 'ProjectAether/Content/Assets/Sounds/**/*thompson*' \
            -i 'ProjectAether/Content/Assets/Sounds/**/*Thompson*' \
            -i 'ProjectAether/Content/Assets/Sounds/**/*wpn_shtgun_st_f*' \
            -i 'ProjectAether/Content/Assets/Sounds/**/*wpn_shtgun_st_act*' \
            -i 'ProjectAether/Content/Assets/Sounds/**/*car_m_left*' \
            -i 'ProjectAether/Content/Assets/Sounds/**/*car_m_right*' \
            -i 'ProjectAether/Content/Assets/Sounds/**/*dist_us_mg*' \
            --force
          find recovered/raw -type f | sort > recovered/raw-files.txt
          echo "=== COMPLETE WAW WEAPON PACKAGE INVENTORY ==="
          cat recovered/waw-weapon-directories.json
          grep -F 'ProjectAether/Content/Assets/Weapons/waw/' recovered/raw-files.txt | head -n 400 || true
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path("recovered/raw")
          rows=[]
          for p in root.rglob("*"):
              if p.is_file():
                  rows.append({"path":p.as_posix(),"bytes":p.stat().st_size,"ext":p.suffix.lower()})
          prefix="recovered/raw/ProjectAether/Content/Assets/Weapons/waw/"
          weapon_dirs={}
          for r in rows:
              p=r["path"].replace("\\","/")
              if prefix in p:
                  rel=p.split(prefix,1)[1]
                  top=rel.split("/",1)[0]
                  weapon_dirs[top]=weapon_dirs.get(top,0)+1
          out={"file_count":len(rows),"bytes":sum(r["bytes"] for r in rows),"weapon_path_counts":dict(sorted(weapon_dirs.items())),"files":rows}
          Path("recovered/raw-report.json").write_text(json.dumps(out,indent=2)+"\n")
          print("XZOGOT_AETHER_WAW_RAW",out["file_count"],out["bytes"],out["weapon_path_counts"])
          assert len(weapon_dirs)>=5, weapon_dirs
          assert any(r["ext"]==".uasset" for r in rows)
          PY

      - name: Install .NET 10 for current CUE4Parse
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build current CUE4Parse CLI for Linux
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/CUE4Parse.CLI" "$RUNNER_TEMP/cue4parse-publish"
          git clone --depth 1 https://github.com/joric/CUE4Parse.CLI.git "$RUNNER_TEMP/CUE4Parse.CLI"
          dotnet publish "$RUNNER_TEMP/CUE4Parse.CLI/CUE4Parse.CLI/CUE4Parse.CLI.csproj" \
            -c Release -r linux-x64 --self-contained true \
            -p:RuntimeIdentifier=linux-x64 \
            -p:PublishTrimmed=false \
            -p:PublishSingleFile=true \
            -o "$RUNNER_TEMP/cue4parse-publish"
          CUE4PARSE=$(find "$RUNNER_TEMP/cue4parse-publish" -maxdepth 1 -type f -perm -111 \
            ! -name '*.so' | head -1)
          test -x "$CUE4PARSE"
          "$CUE4PARSE" --version | tee recovered/cue4parse-version.txt || true
          "$CUE4PARSE" --help > recovered/cue4parse-help.txt 2>&1 || true
          echo "CUE4PARSE=$CUE4PARSE" >> "$GITHUB_ENV"
          echo "XZOGOT_CUE4PARSE_LINUX_READY $CUE4PARSE"

      - name: Build native Linux detex for CUE4Parse
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/detex"
          git clone --depth 1 https://github.com/hglm/detex.git "$RUNNER_TEMP/detex"
          cd "$RUNNER_TEMP/detex"
          sed -i -E 's/^LIBRARY_CONFIGURATION[[:space:]]*=.*/LIBRARY_CONFIGURATION = SHARED/' Makefile.conf
          python3 - <<'PY'
          from pathlib import Path
          p=Path("detex.h")
          s=p.read_text()
          old="DETEX_API bool detexDecompressTextureLinear"
          new="DETEX_HELPER_SHARED_EXPORT bool detexDecompressTextureLinear"
          if old in s:
              s=s.replace(old,new)
          p.write_text(s)
          PY
          make -j2
          DETEX_SO=$(find . -type f \( -name 'libdetex.so' -o -name 'libdetex.so.*' \) | sort | tail -1)
          test -n "$DETEX_SO"
          cp "$DETEX_SO" /tmp/Detex.dll
          file /tmp/Detex.dll
          ldd /tmp/Detex.dll || true
          echo "XZOGOT_CUE4PARSE_LINUX_DETEX_READY $DETEX_SO"

      - name: Export retoc-converted Aether weapon meshes animations textures and sounds
        id: cue4parse_models
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          rm -rf recovered/export recovered/version-probe
          mkdir -p recovered/export recovered/version-probe
          cat > recovered/aether-weapon-packages.txt <<'EOF'
          *Weapons/waw/*/*.uasset
          *Weapons/waw/*/Anims/**/*.uasset
          *Sounds/**/*1911*.uasset
          *Sounds/**/*colt*.uasset
          *Sounds/**/*Colt*.uasset
          *Sounds/**/*garand*.uasset
          *Sounds/**/*Garand*.uasset
          *Sounds/**/*mp40*.uasset
          *Sounds/**/*MP40*.uasset
          *Sounds/**/*trench*.uasset
          *Sounds/**/*Trench*.uasset
          *Sounds/**/*thompson*.uasset
          *Sounds/**/*Thompson*.uasset
          EOF

          # retoc has already converted the UE5 IoStore packages into legacy
          # .uasset/.uexp/.ubulk triplets.  Feed those loose converted packages
          # to CUE4Parse first; do NOT throw CUE4Parse back at the original
          # global.utoc package store unless the loose-provider probe fails.
          LOOSE_ROOT="$GITHUB_WORKSPACE/recovered/raw"
          PROBE_PACKAGE="*M1Garand/M1Garand.uasset"
          : > recovered/cue4parse-export.log
          SUCCESS_GAME=""
          SUCCESS_PROVIDER=""

          for PROVIDER in "$LOOSE_ROOT" "$AETHER_PAKDIR"; do
            if [ "$PROVIDER" = "$LOOSE_ROOT" ]; then
              echo "XZOGOT_CUE4PARSE_PROVIDER loose-retoc $PROVIDER" | tee -a recovered/cue4parse-export.log
            else
              echo "XZOGOT_CUE4PARSE_PROVIDER original-iostore $PROVIDER" | tee -a recovered/cue4parse-export.log
            fi

            for GAME in               GAME_UE5_7 GAME_UE5_6 GAME_UE5_5 GAME_UE5_4 GAME_UE5_3               GAME_UE5_2 GAME_UE5_1 GAME_UE5_0 GAME_UE4_27; do
              echo "XZOGOT_CUE4PARSE_VERSION_PROBE provider=$PROVIDER game=$GAME" | tee -a recovered/cue4parse-export.log
              rm -rf recovered/version-probe
              mkdir -p recovered/version-probe
              set +e
              "$CUE4PARSE"                 -i "$PROVIDER"                 -g "$GAME"                 -p "$PROBE_PACKAGE"                 -o recovered/version-probe                 -y -v                 --mesh-format Gltf2                 --texture-format Png                 --mesh-quality Highest                 --export-materials true                 >> recovered/cue4parse-export.log 2>&1
              RC=$?
              set -e
              MESH_COUNT=$(find recovered/version-probe -type f                 \( -iname '*.gltf' -o -iname '*.glb' -o -iname '*.psk' -o -iname '*.pskx' -o -iname '*.uemodel' \) | wc -l)
              echo "XZOGOT_CUE4PARSE_VERSION_RESULT provider=$PROVIDER game=$GAME rc=$RC meshes=$MESH_COUNT" | tee -a recovered/cue4parse-export.log
              if [ "$MESH_COUNT" -gt 0 ]; then
                SUCCESS_GAME="$GAME"
                SUCCESS_PROVIDER="$PROVIDER"
                break 2
              fi
            done
          done

          if [ -z "$SUCCESS_GAME" ] || [ -z "$SUCCESS_PROVIDER" ]; then
            echo "No provider/version exported the M1Garand skeletal mesh." | tee -a recovered/cue4parse-export.log
            echo "=== FINAL CUE4PARSE DIAGNOSTIC TAIL ==="
            tail -n 180 recovered/cue4parse-export.log || true
            exit 31
          fi

          printf '%s\n' "$SUCCESS_GAME" > recovered/cue4parse-game-version.txt
          printf '%s\n' "$SUCCESS_PROVIDER" > recovered/cue4parse-provider.txt
          echo "XZOGOT_CUE4PARSE_LOCKED provider=$SUCCESS_PROVIDER game=$SUCCESS_GAME" | tee -a recovered/cue4parse-export.log

          rm -rf recovered/export
          mkdir -p recovered/export
          set +e
          "$CUE4PARSE"             -i "$SUCCESS_PROVIDER"             -g "$SUCCESS_GAME"             -c recovered/aether-weapon-packages.txt             -o recovered/export             -y -v             --mesh-format Gltf2             --texture-format Png             --mesh-quality Highest             --export-materials true             >> recovered/cue4parse-export.log 2>&1
          RC=$?
          set -e

          find recovered/export -type f | sort > recovered/export-files.txt
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path("recovered/export")
          rows=[{"path":p.as_posix(),"bytes":p.stat().st_size,"ext":p.suffix.lower()} for p in root.rglob("*") if p.is_file()]
          kinds={}
          for r in rows:
              kinds[r["ext"]]=kinds.get(r["ext"],0)+1
          report={"file_count":len(rows),"bytes":sum(r["bytes"] for r in rows),"extensions":kinds,"files":rows}
          Path("recovered/export-report.json").write_text(json.dumps(report,indent=2)+"\n")
          print("XZOGOT_AETHER_CUE4PARSE_EXPORT",report["file_count"],report["bytes"],kinds)
          mesh=sum(kinds.get(x,0) for x in (".gltf",".glb",".psk",".pskx",".uemodel",".obj"))
          anim=sum(kinds.get(x,0) for x in (".psa",".ueanim",".json"))
          sound=sum(kinds.get(x,0) for x in (".wav",".ogg",".mp3",".wem"))
          print("XZOGOT_AETHER_WALL_EXPORT_CLASSES",mesh,anim,sound)
          if mesh<=0:
              raise SystemExit("No weapon mesh export produced")
          if sound<=0:
              raise SystemExit("No weapon sound export produced")
          PY
          test "$RC" -eq 0
          echo "XZOGOT_AETHER_CUE4PARSE_GREEN provider=$SUCCESS_PROVIDER game=$SUCCESS_GAME"

      - name: Upload recovered wall weapons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aether-wall-weapons-recovered
          path: |
            recovered/raw-report.json
            recovered/raw-files.txt
            recovered/pak-files.txt
            recovered/raw/
            recovered/version-probe/
            recovered/cue4parse-version.txt
            recovered/cue4parse-help.txt
            recovered/cue4parse-game-version.txt
            recovered/cue4parse-provider.txt
            recovered/cue4parse-export.log
            recovered/aether-weapon-packages.txt
            recovered/export-report.json
            recovered/export-files.txt
            recovered/export/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6


  decode-real-fire-audio:
    name: Decode real weapon fire audio
    needs: recover
    if: always()
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Xogot
        uses: actions/checkout@v5
        with:
          ref: feature/church-expansion-v1
          fetch-depth: 0

      - name: Download recovered Aether raw packages
        uses: actions/download-artifact@v4
        with:
          name: aether-wall-weapons-recovered
          path: recovered-bundle

      - name: Install UE5 BINKA decoder pipeline
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git clone --depth 1 https://github.com/AbienteSadness/ue5-binka-to-wav.git "$env:RUNNER_TEMP\ue5-binka-to-wav"
          Invoke-WebRequest 'https://github.com/Keisawaakira/BinkadecWithWavHeader/releases/download/1.0.2/binkadec.zip' -OutFile "$env:RUNNER_TEMP\binkadec.zip"
          Expand-Archive "$env:RUNNER_TEMP\binkadec.zip" -DestinationPath "$env:RUNNER_TEMP\binkadec" -Force
          $decoder = Get-ChildItem "$env:RUNNER_TEMP\binkadec" -Filter 'binkadec.exe' -Recurse | Select-Object -First 1
          if (-not $decoder) { throw 'binkadec.exe missing from decoder release' }
          "BINKADEC=$($decoder.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "XZOGOT_BINKADEC_READY $($decoder.FullName)"

      - name: Decode authentic 1911 M1 MP40 Trench Thompson fire SFX
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $raw = Join-Path $PWD 'recovered-bundle\raw\ProjectAether\Content\Assets\Sounds\Base'
          if (-not (Test-Path $raw)) { throw "Recovered sound root missing: $raw" }

          $targets = @{
            'colt'     = 'wpn_pistol_1911_fire_LN100_pc_snd'
            'm1'       = 'wpn_m1garand_st_f'
            'mp40'     = 'wpn_mp40_st_f'
            'trench'   = 'wpn_shtgun_st_f'
            'thompson' = 'wpn_thompson_st_f'
          }

          $tool = Join-Path $env:RUNNER_TEMP 'ue5-binka-to-wav'
          $report = @()
          foreach ($weapon in $targets.Keys) {
            $stem = $targets[$weapon]
            $ubulk = Get-ChildItem $raw -Filter "$stem.ubulk" -Recurse | Select-Object -First 1
            if (-not $ubulk) { throw "Missing UE5 BINKA payload for $weapon ($stem.ubulk)" }
            $uasset = [System.IO.Path]::ChangeExtension($ubulk.FullName, '.uasset')
            $uexp = [System.IO.Path]::ChangeExtension($ubulk.FullName, '.uexp')
            if (-not (Test-Path $uasset)) { throw "Missing paired uasset for $weapon" }
            if (-not (Test-Path $uexp)) { throw "Missing paired uexp for $weapon" }

            $outDir = Join-Path $PWD "xogot\assets\audio\weapons\mapmod\$weapon"
            New-Item -ItemType Directory -Force -Path $outDir | Out-Null
            $tmpOut = Join-Path $env:RUNNER_TEMP "decoded-$weapon"
            New-Item -ItemType Directory -Force -Path $tmpOut | Out-Null

            Push-Location $tool
            python 'binka2wav-cli.py' $ubulk.FullName -o $tmpOut --binkadec $env:BINKADEC
            if ($LASTEXITCODE -ne 0) { throw "BINKA decode failed for $weapon" }
            Pop-Location

            $wav = Get-ChildItem $tmpOut -Filter '*.wav' -Recurse | Select-Object -First 1
            if (-not $wav -or $wav.Length -le 44) { throw "No valid WAV produced for $weapon" }
            $dest = Join-Path $outDir 'fire.wav'
            Copy-Item $wav.FullName $dest -Force

            $bytes = (Get-Item $dest).Length
            $report += [PSCustomObject]@{ weapon=$weapon; source=$stem; bytes=$bytes; output=$dest }
            Write-Host "XZOGOT_REAL_FIRE_SFX_READY $weapon bytes=$bytes"
          }

          $report | ConvertTo-Json -Depth 4 | Set-Content 'xogot/assets/audio/weapons/mapmod/fire-audio-report.json' -Encoding utf8
          if ($report.Count -ne 5) { throw "Expected five decoded weapon fire sounds, got $($report.Count)" }
          Write-Host 'XZOGOT_REAL_FIRE_AUDIO_GATE_GREEN'

      - name: Point runtime manifest at decoded WAV fire sounds
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import json
          from pathlib import Path
          path=Path("xogot/assets/weapons/mapmod_weapon_asset_manifest.json")
          data=json.loads(path.read_text(encoding="utf-8"))
          changed=[]
          for wid in ("colt","m1","mp40","trench","thompson"):
              rec=data["weapons"][wid]
              target=f"res://assets/audio/weapons/mapmod/{wid}/fire.wav"
              if rec["runtime"]["audio"].get("fire") != target:
                  rec["runtime"]["audio"]["fire"]=target
                  changed.append(wid)
          path.write_text(json.dumps(data,indent=2)+"\n",encoding="utf-8")
          print("XZOGOT_FIRE_MANIFEST_WAV", changed)
          '@ | Set-Content "$env:RUNNER_TEMP\patch_manifest.py" -Encoding utf8
          python "$env:RUNNER_TEMP\patch_manifest.py"

      - name: Verify decoded WAV files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import wave
          from pathlib import Path
          ids=("colt","m1","mp40","trench","thompson")
          for wid in ids:
              p=Path(f"xogot/assets/audio/weapons/mapmod/{wid}/fire.wav")
              assert p.is_file() and p.stat().st_size > 44, p
              with wave.open(str(p),"rb") as w:
                  assert w.getnchannels() in (1,2), (wid,w.getnchannels())
                  assert 8000 <= w.getframerate() <= 96000, (wid,w.getframerate())
                  assert w.getnframes() > 100, (wid,w.getnframes())
                  print("XZOGOT_WAV_OK",wid,w.getnchannels(),w.getframerate(),w.getnframes())
          print("XZOGOT_REAL_FIRE_AUDIO_VALIDATED_GREEN")
          '@ | Set-Content "$env:RUNNER_TEMP\verify_wav.py" -Encoding utf8
          python "$env:RUNNER_TEMP\verify_wav.py"

      - name: Commit decoded fire SFX to gameplay branch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add xogot/assets/audio/weapons/mapmod xogot/assets/weapons/mapmod_weapon_asset_manifest.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'XZOGOT_REAL_FIRE_AUDIO_ALREADY_COMMITTED'
            exit 0
          }
          $global:LASTEXITCODE = 0
          git commit -m "Integrate real Aether weapon fire audio"
          git pull --rebase origin feature/church-expansion-v1
          git push origin HEAD:feature/church-expansion-v1
          Write-Host 'XZOGOT_REAL_FIRE_AUDIO_COMMITTED_GREEN'

      - name: Upload decoded fire audio proof
        uses: actions/upload-artifact@v4
        with:
          name: aether-real-fire-audio
          path: |
            xogot/assets/audio/weapons/mapmod/*/fire.wav
            xogot/assets/audio/weapons/mapmod/fire-audio-report.json
            xogot/assets/weapons/mapmod_weapon_asset_manifest.json
          if-no-files-found: error
          retention-days: 14
