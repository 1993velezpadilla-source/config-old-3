name: HAYUYA Native Conform

on:
  push:
    branches:
      - art/hayuya-core-generalize-v1
    paths:
      - tools/hayuya3d/hayuya.py
      - tools/hayuya3d/judge_v4.py
      - tools/hayuya3d/native_geometry_guard.py
      - tools/hayuya3d/native_360_geometry_gate.py
      - tools/hayuya3d/native_silhouette_conform.py
      - tools/hayuya3d/silhouette_conform.py
      - tools/hayuya3d/asset_profile.py
      - tools/hayuya3d/profiles/generic.json
      - tools/hayuya3d/profiles/monja-mugfwln6.json
      - tools/hayuya3d/native_face_repair.py
      - tools/hayuya3d/regional_fusion.py
      - tools/hayuya3d/visual_judge.py
      - tools/hayuya3d/tests/test_judge_v4_face_proportions.py
      - tools/hayuya3d/tests/test_native_geometry_guard.py
      - tools/hayuya3d/tests/test_native_360_geometry_gate.py
      - tools/hayuya3d/tests/test_native_silhouette_conform.py
      - tools/hayuya3d/tests/test_native_face_repair.py
      - tools/hayuya3d/tests/test_regional_fusion.py
      - tools/hayuya3d/tests/test_rigged_regional_fusion.py
      - tools/hayuya3d/tests/test_planner.py
      - .github/workflows/hayuya-native-conform.yml
  workflow_dispatch:

jobs:
  native-conform:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy pillow trimesh pytest
      - name: Native geometry provenance guard
        run: |
          python -m pytest -q tools/hayuya3d/tests/test_native_geometry_guard.py
      - name: Native 360 volumetric geometry gate
        run: |
          python -m pytest -q tools/hayuya3d/tests/test_native_360_geometry_gate.py
      - name: Source-driven native silhouette conform
        run: |
          python -m pytest -q tools/hayuya3d/tests/test_native_silhouette_conform.py
      - name: Generic source-relative face proportions
        run: |
          python -m pytest -q tools/hayuya3d/tests/test_judge_v4_face_proportions.py
      - name: Source-derived native face repair
        run: |
          python -m pytest -q tools/hayuya3d/tests/test_native_face_repair.py
      - name: Regional fusion topology and UV preservation
        run: |
          python -m pytest -q tools/hayuya3d/tests/test_regional_fusion.py
      - name: Rig-preserving regional fusion
        run: |
          python -m pytest -q tools/hayuya3d/tests/test_rigged_regional_fusion.py
      - name: Pipeline planner contract
        run: |
          python -m pytest -q tools/hayuya3d/tests/test_planner.py
