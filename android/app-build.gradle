apply plugin: 'com.android.application'

android {
    namespace "org.libsdl.app"
    compileSdkVersion 35
    ndkVersion "27.2.12479018"

    defaultConfig {
        applicationId "com.xziel.engine"
        minSdkVersion 23
        targetSdkVersion 35
        versionCode 18
        versionName "0.18-xziel-engine"

        externalNativeBuild {
            ndkBuild {
                arguments "APP_PLATFORM=android-23"
                abiFilters "arm64-v8a", "x86_64"
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    sourceSets.main {
        jniLibs.srcDir 'libs'
    }

    externalNativeBuild {
        ndkBuild {
            path 'jni/Android.mk'
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    // nzp-data.zip is already compressed. Keep its bytes verbatim so Gradle
    // does not inflate the full-resolution Nacht payload into Java heap.
    androidResources {
        noCompress += ['zip']
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}
