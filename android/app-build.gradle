apply plugin: 'com.android.application'

def xzielMultiplayerUrl = System.getenv("XZIEL_MULTIPLAYER_URL") ?: ""
def xzielMultiplayerUrlEscaped = xzielMultiplayerUrl.replace("\\", "\\\\").replace("\"", "\\\"")

android {
    namespace "org.libsdl.app"
    compileSdkVersion 35
    ndkVersion "27.2.12479018"

    defaultConfig {
        applicationId "com.xziel.nzp"
        minSdkVersion 23
        targetSdkVersion 35
        versionCode 26
        versionName "0.26-online-social-test"
        buildConfigField "String", "XZIEL_MULTIPLAYER_URL", "\"${xzielMultiplayerUrlEscaped}\""

        externalNativeBuild {
            ndkBuild {
                arguments "APP_PLATFORM=android-23"
                abiFilters "arm64-v8a", "x86_64"
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    sourceSets.main {
        jniLibs.srcDir 'libs'
    }

    externalNativeBuild {
        ndkBuild {
            path 'jni/Android.mk'
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    buildFeatures {
        buildConfig true
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
